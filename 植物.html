<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物クイズ｜中学受験 理科</title>
<style>
  :root{
    --paper:#F1F4EA; --paper2:#FBFCF7; --ink:#1E2A21; --ink60:#5A6A5C;
    --line:#CBD6C0; --leaf:#3F7D53; --leafLt:#E3EEDF; --petal:#8C5A9E;
    --petalLt:#F0E8F4; --seed:#B98A2E; --seedLt:#F7EEDA;
    --wrong:#B4483C; --wrongLt:#F7E6E3; --warnBg:#FBEFD8;
    --red:#C0392B; --redLt:#F7E2DE;
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       -webkit-text-size-adjust:100%;line-height:1.6}
  #app{max-width:600px;margin:0 auto;padding:20px 16px 70px}
  h1,h2{font-family:var(--serif);font-weight:600;margin:0}
  button{font-family:var(--sans);cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
  ruby rt{font-size:.55em;color:var(--ink60);font-weight:400}
  .panel{border:1px solid var(--line);border-radius:10px;background:var(--paper2);padding:16px}
  .eyebrow{font-size:11px;letter-spacing:.16em;color:var(--ink60)}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--leaf);transition:width .3s ease}
  .row{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);
       border-radius:8px;padding:10px 12px;text-align:left;background:transparent}
  .box{width:15px;height:15px;border-radius:4px;flex:0 0 auto;border:2px solid var(--line);background:transparent}
  .pill{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;background:transparent;color:var(--ink)}
  .pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .primary{width:100%;padding:14px 0;border-radius:8px;border:none;background:var(--ink);
           color:var(--paper);font-size:15px;letter-spacing:.06em}
  .secondary{width:100%;padding:12px 0;border-radius:8px;border:1px solid var(--line);
             background:transparent;color:var(--ink);font-size:14px}
  .primary[disabled],.secondary[disabled]{opacity:.4;cursor:default}
  .choice{display:flex;align-items:center;width:100%;text-align:left;border:1px solid var(--line);
          border-radius:8px;padding:13px 14px;font-size:15px;line-height:1.5;background:transparent;color:var(--ink)}
  .choice[disabled]{cursor:default}
  .link{border:none;background:transparent;color:var(--ink60);font-size:12.5px;padding:4px 6px}
  .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.05em}
  .stack{display:grid;gap:8px}
  .dots{letter-spacing:2px;font-size:13px}
  .nameinput{border:none;border-bottom:1px dashed var(--line);background:transparent;font-size:15px;
             font-family:var(--serif);color:var(--ink);padding:2px 0;min-width:90px}
  .num{font-variant-numeric:tabular-nums}
  .ubtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:13px;margin-left:6px;line-height:1}
  .unitrow:active{background:var(--leafLt)!important}
  .find{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .find a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12px;
          border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--ink60);background:var(--paper2)}
  .find a:hover{border-color:var(--leaf);color:var(--leaf)}
  .find .kw{font-size:11px;color:var(--ink60);opacity:.8}
  .badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--warnBg);
         color:var(--seed);border:1px solid #E7CE9A;margin-left:6px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:center;
            justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--paper2);border-radius:12px;padding:22px;max-width:360px;width:100%}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  .miss{background:var(--warnBg)}
  select{font-family:var(--sans);border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper2);font-size:12.5px;color:var(--ink)}
  .kpstate{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
  .swatch{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

function groupLabel(f){return f.group==="裸子植物"?"裸子植物":(f.group==="単子葉類"?"単子葉類":"双子葉類・"+f.ben);}

var FACTS=[
 ["受粉と実","花粉がめしべの先につくことを何といいますか。",["受粉","発芽","蒸散","光合成"],0,"めしべの先(柱頭)に花粉がつくことを受粉という。"],

 ["受粉と実","こん虫が花粉を運ぶ花を何といいますか。",["虫媒花","風媒花","水媒花","鳥媒花"],0,"虫媒花は花が目立ち、みつがあり、花粉はねばりけがある。"],
 ["受粉と実","次のうち風媒花はどれですか。",["マツ","アブラナ","ヘチマ","ヒマワリ"],0,"風媒花＝マツ・スギ・イネ・トウモロコシ・ススキ・ヨモギ。"],
 ["受粉と実","風媒花の花粉の特徴として正しいものはどれですか。",["軽くて量が多い","重くてねばりけがある","とげがある","みつを出す"],0,"風で運ぶので軽く量が多い。花は地味でみつもない。"],
 ["受粉と実","マツの花粉についている、風で飛びやすくするつくりは何ですか。",["空気ぶくろ","冠毛","とげ","油てん"],0,"マツの花粉には左右2つの空気ぶくろがある。"],
 ["受粉と実","水の流れで受粉する水媒花の例はどれですか。",["クロモ","ツバキ","イネ","ヘチマ"],0,"クロモ・キンギョモなどの水草。"],
 ["受粉と実","鳥が花粉を運ぶ花(鳥媒花)はどれですか。",["ツバキ","アブラナ","ススキ","エンドウ"],0,"ツバキ・サザンカはメジロなどが運ぶ。冬に咲く。"],
 ["受粉と実","つぼみのうちに自分の花粉で受粉してしまう植物はどれですか。",["エンドウ","ヘチマ","カボチャ","マツ"],0,"エンドウ・イネ・アサガオは自家受粉。ヘチマは単性花で不可。"],

 ["体のつくり","単子葉類の葉脈はどれですか。",["平行脈","網状脈","放射脈","羽状脈"],0,"単子葉＝平行脈、双子葉＝網状脈。"],

 ["光合成と呼吸","二酸化炭素があるか調べるのに使うものはどれですか。",["石灰水","ヨウ素液","食塩水","エタノール"],0,"石灰水は二酸化炭素で白くにごる。"],

 ["種子と発芽","インゲンマメの種子で、養分がたくわえられているのはどこですか。",["子葉","胚乳","はい","種皮"],0,"インゲン・ダイズ・アサガオ・クリ＝無胚乳種子(子葉に養分)。"],

/* =========================================================
   4. KP（知識ポイント）生成  ── 各KPに forms{A,B} を持たせる
   ========================================================= */
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function pick(arr,n){return shuffle(arr).slice(0,n);}

function buildKPs(){
  var KP=[];
  var allPlants=[];
  FAMILIES.forEach(function(f){f.members.forEach(function(m){allPlants.push({plant:m,fam:f});});});

  // --- Type1: 植物の科 (形式A: 植物→科 / 形式B: 科→植物) ---
  FAMILIES.forEach(function(f){
    f.members.slice(0,4).forEach(function(m){
      var famChoices=[f.name].concat(pick(FAMILIES.filter(function(x){return x.key!==f.key;}).map(function(x){return x.name;}),3));
      var plantDistract=pick(allPlants.filter(function(p){return p.fam.key!==f.key;}).map(function(p){return p.plant;}),3);
      KP.push({
        id:"fam_"+f.key+"_"+m, cat:"植物と科", label:m+"＝"+f.name,
        exp:m+" は "+f.name+"("+groupLabel(f)+")。"+f.note,
        forms:{
          A:{prompt:"「"+m+"」は何のなかまですか。",choices:famChoices,answers:[f.name],kw:m+" 花"},
          B:{prompt:"次のうち "+f.name+" はどれですか。",choices:[m].concat(plantDistract),answers:[m],kw:f.name+" 植物"}
        }
      });
    });
  });

  // --- Type2: 科の分類 (A: 科→分類 / B: 代表植物→葉脈と根) ---
  FAMILIES.forEach(function(f){
    var forms={A:{prompt:f.name+"は次のどれにあてはまりますか。",choices:GROUP_CHOICES.slice(),answers:[groupLabel(f)],kw:f.name+" "+groupLabel(f)}};
    if(f.group!=="裸子植物"){
      var tan=f.group==="単子葉類", rep=f.members[0];
      forms.B={prompt:"「"+rep+"」の葉脈と根の正しい組み合わせはどれですか。",
        choices:["平行脈・ひげ根","網状脈・主根と側根","平行脈・主根と側根","網状脈・ひげ根"],
        answers:[tan?"平行脈・ひげ根":"網状脈・主根と側根"],kw:(tan?"平行脈 ひげ根":"網状脈 主根 側根")+" 図"};
    }
    KP.push({id:"grp_"+f.key, cat:"分類", label:f.name+"の分類",
      exp:f.name+" → "+groupLabel(f)+"。"+f.note, forms:forms});
  });

  // --- Type3: 単性花/両性花 (単形式) ---
  FAMILIES.forEach(function(f){
    var tansei=f.sex.indexOf("単性")===0;
    KP.push({id:"sex_"+f.key, cat:"花のつくり", label:f.name+"＝"+(tansei?"単性花":"両性花"),
      exp:f.name+" … "+f.sex+"。単性花は「ウリ科・トウモロコシ・裸子植物」。",
      forms:{A:{prompt:f.name+"("+f.members[0]+")の花は 単性花・両性花 のどちらですか。",
        choices:["単性花","両性花"],answers:[tansei?"単性花":"両性花"],kw:f.members[0]+" "+(tansei?"お花 め花":"花のつくり")}}});
  });

  // --- Type4/5: 花びら・おしべの数 (単形式) ---
  var partPool=["0","3","4","5","6","10","多数"];
  [["petal","花びら"],["stamen","おしべ"]].forEach(function(pp){
    FAMILIES.forEach(function(f){
      var ans=f.parts[pp[0]]; if(ans==="—")return;
      var wrong=pick(partPool.filter(function(x){return x!==ans;}),3);
      KP.push({id:"part_"+f.key+"_"+pp[0], cat:"花のつくり", label:f.name+" "+pp[1]+ans,
        exp:f.name+"｜花びら"+f.parts.petal+"／がく"+f.parts.sepal+"／おしべ"+f.parts.stamen+"／めしべ"+f.parts.pistil,
        forms:{A:{prompt:f.name+"("+f.members[0]+")の花の "+pp[1]+" の数はいくつですか。",
          choices:[ans].concat(wrong),answers:[ans],kw:f.members[0]+" 花のつくり 図"}}});
    });
  });

  // --- Type6: 知識カード (単形式) ---
  FACTS.forEach(function(r,i){
    var ans=r[2][r[3]];
    var bare=ans.replace(/\(.*?\)/g,"").trim();
    var kw=(bare.length<=8?bare:r[0])+" 理科 小学生";
    KP.push({id:"fact_"+i, cat:r[0], label:r[1].replace(/。$/,"").slice(0,22),
      exp:r[4], forms:{A:{prompt:r[1],choices:r[2].slice(),answers:[ans],kw:kw}}});
  });

  return KP;
}
var KPS=buildKPs();
var KP_BY={}; KPS.forEach(function(k){KP_BY[k.id]=k;});

function buildMasterKPs(){
  var KP=[];
  Object.keys(MASTER_CONTENT).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){
    var cat=masterCatId(n), C=MASTER_CONTENT[n];
    if(!catColorHas(cat)) CATS.push({id:cat,color:"var(--red)",group:"マスター",unit:n});
    var localAns=(C.fill||[]).map(function(r){return r[1];});
    (C.fill||[]).forEach(function(r,i){
      var ans=r[1], pool=localAns.concat(TERM_POOL).filter(function(a,idx,self){return self.indexOf(a)===idx;});
      var dis=shuffle(pool.filter(function(a){return a!==ans;})).slice(0,3);
      KP.push({id:"m"+n+"_f"+i, cat:cat, unit:n, label:ans, exp:r[2],
        forms:{A:{prompt:r[0], choices:[ans].concat(dis), answers:[ans], kw:ans+" 理科 植物"}}});
    });
    (C.two||[]).forEach(function(r,i){
      KP.push({id:"m"+n+"_t"+i, cat:cat, unit:n, label:r[0].replace(/「|」.*/g,""), exp:r[3],
        forms:{A:{prompt:r[0], choices:r[1].slice(), answers:[r[2]], kw:r[0].replace(/[「」。]/g,"")+" 理科"}}});
    });
    (C.mem||[]).forEach(function(r,i){
      var pool=(r.length>4 && r[4]) ? r[4] : PLANT_POOL;
      var non=shuffle(pool.filter(function(x){return r[1].indexOf(x)<0;})).slice(0,3);
      KP.push({id:"m"+n+"_m"+i, cat:cat, unit:n, label:r[0], exp:r[3],
        forms:{A:{prompt:"次のうち「"+r[0]+"」にあてはまるものはどれ？", choices:[r[2]].concat(non), answers:[r[2]], kw:r[0]+" 植物"}}});
    });
    (C.img||[]).forEach(function(r,i){
      KP.push({id:"m"+n+"_i"+i, cat:cat, unit:n, img:r[0], label:r[1].replace(/？$/,""), exp:r[4],
        forms:{A:{prompt:r[1], choices:r[2].slice(), answers:[r[3]], kw:"植物 理科 図"}}});
    });
  });
  return KP;
}
var MASTER_KPS=buildMasterKPs();
MASTER_KPS.forEach(function(k){ KPS.push(k); KP_BY[k.id]=k; });

function newSessionObj(mode,kpIds){
  return {mode:mode, kpIds:kpIds, queue:[], served:[], cur:null,
    work:{}, repeat:{}, correct:0, wrong:0, servedCount:0,
    startedAt:new Date().toISOString(), viewPos:null, newlyMastered:[], nominal:0};
}

/* 出題対象KPの選定（§2-1 優先順位） */
function selectKPs(n,onlyWrong,catFilter){
  var id=DB.activeAccountId;
  var cand=KPS.filter(function(k){
    if(catFilter && k.cat!==catFilter) return false;
    var it=accProgress(id).items[k.id];
    if(onlyWrong){ return it && it.totalWrong>0 && !it.mastered; }
    return !(it && it.mastered);  // 習得済み除外
  });
  cand.sort(function(a,b){
    var ia=accProgress(id).items[a.id], ib=accProgress(id).items[b.id];
    var wa=ia?ia.totalWrong:0, wb=ib?ib.totalWrong:0;
    if(wb!==wa) return wb-wa;                       // ①誤答多い順
    var sa=ia&&ia.lastSeenAt?1:0, sb=ib&&ib.lastSeenAt?1:0;
    if(sa!==sb) return sa-sb;                       // ②未出題を先に
    var ta=ia&&ia.lastSeenAt?ia.lastSeenAt:"", tb=ib&&ib.lastSeenAt?ib.lastSeenAt:"";
    return ta<tb?-1:(ta>tb?1:0);                    // ③直近出題が古い順
  });
  return cand.slice(0,n).map(function(k){return k.id;});
}

/* 単元・カテゴリーを指定して開始 */
function startCat(catId){
  var avail=selectKPs(9999,false,catId);
  if(avail.length) startSession("20q",false,catId);   // 未習得を単元まとめて
  else startSession("all",false,catId);               // 全部習得済みなら復習(全問)
}
function startCatMemo(catId){
  MEMO={cats:[catId],scope:"all"};
  MEMO.cards=buildMemoCards(MEMO.cats,MEMO.scope);
  MEMO.idx=0; MEMO.revealed=false;
  if(!MEMO.cards.length) return;
  UI.screen="memocard"; render();
}

function startSession(mode,onlyWrong,catFilter){
  if(!loggedIn()){ UI.screen="gate"; render(); return; }
  var kpIds;
  if(mode==="all"){ kpIds=shuffle(KPS.filter(function(k){return !catFilter||k.cat===catFilter;}).map(function(k){return k.id;})); }
  else {
    var n=(mode==="20q"?20:10);
    kpIds=selectKPs(n,onlyWrong,catFilter);
  }
  if(kpIds.length===0) return;

  S=newSessionObj(mode,kpIds);
  // work: 対象KPの現在値を複製（§5-2 一時領域）
  kpIds.forEach(function(kid){
    var src=itemOf(DB.activeAccountId,kid);
    S.work[kid]=JSON.parse(JSON.stringify(src));
    S.repeat[kid]=0;
  });
  // 初期キュー
  kpIds.forEach(function(kid){
    var kp=KP_BY[kid];
    var last=S.work[kid].lastFormat;
    var fmt= kpFormats(kp).length>1 ? (last?otherFormat(kp,last):"A") : kpFormats(kp)[0];
    S.queue.push({kpId:kid,format:fmt});
  });
  S.nominal = (mode==="all") ? kpIds.length : kpIds.length*2;
  UI.screen="quiz";
  advance();
  render();
  armLeaveGuard(true);
}

function advance(){
  if(S.queue.length===0){ finishSession(); return; }
  S.cur=S.queue.shift();
  S.curView=makeView(S.cur);
  S.picked=[]; S.judged=false; S.viewPos=null;
}

/* KP+形式 → 表示用問題（選択肢はここでシャッフル） */
function makeView(item){
  var kp=KP_BY[item.kpId]; var fm=kp.forms[item.format];
  return {kpId:item.kpId, format:item.format, cat:kp.cat, label:kp.label, img:kp.img||null,
    prompt:fm.prompt, choices:shuffle(fm.choices.slice()), answers:fm.answers.slice(),
    multi:fm.answers.length>1, exp:kp.exp, kw:fm.kw};
}

function judge(){
  if(S.judged || S.picked.length===0) return;
  var v=S.curView, kid=v.kpId, fmt=v.format;
  var ok = S.picked.length===v.answers.length && S.picked.every(function(p){return v.answers.indexOf(p)>=0;});
  var w=S.work[kid];
  var wasMastered=w.mastered;

  w.lastSeenAt=new Date().toISOString();
  w.lastFormat=fmt;
  if(ok){
    w.totalCorrect++; w.byFormat[fmt].correct++;
    // streak：単形式は連続、複形式は「異なる形式」でのみ加算（§3）
    if(kpFormats(KP_BY[kid]).length>1){
      if(w.streak>0 && w.streakFormat===fmt){ w.streak=1; w.streakFormat=fmt; }
      else { w.streak=w.streak+1; w.streakFormat=fmt; }
    } else { w.streak=w.streak+1; }
    if(!w.mastered && w.streak>=MASTERY_STREAK){
      w.mastered=true; w.masteredAt=new Date().toISOString();
      if(!wasMastered) S.newlyMastered.push(kid);
    }
    S.correct++;
  } else {
    // §9-1 誤答3層（streak/masteredはリセット、3層は残す）
    w.totalWrong++; w.byFormat[fmt].wrong++;
    w.wrongLog.push({at:new Date().toISOString(),format:fmt,answered:S.picked.join("・")});
    if(w.wrongLog.length>WRONGLOG_MAX) w.wrongLog=w.wrongLog.slice(w.wrongLog.length-WRONGLOG_MAX);
    w.streak=0; w.streakFormat=null; w.mastered=false; w.masteredAt=null;
    S.wrong++;
  }
  S.served.push({kpId:kid,format:fmt,picked:S.picked.slice(),correct:ok,
    prompt:v.prompt,choices:v.choices.slice(),answers:v.answers.slice(),multi:v.multi,exp:v.exp,kw:v.kw,cat:v.cat,label:v.label,img:v.img||null});
  S.servedCount++;
  S.repeat[kid]=(S.repeat[kid]||0)+1;

  // 遅延キュー（§4）— 全問モードは再投入しない
  if(S.mode!=="all"){
    if(!w.mastered && S.repeat[kid]<MAX_REPEAT){
      var delay = ok ? UNMASTERED_DELAY : WRONG_DELAY;
      var nf = otherFormat(KP_BY[kid],fmt);
      var pos = Math.min(delay-1, S.queue.length);
      S.queue.splice(pos,0,{kpId:kid,format:nf});
    }
  }
  S.judged=true;
  render();
}

function nextQ(){ advance(); render(); }

function finishSession(){
  armLeaveGuard(false);
  // work を本保存へ反映（§5-2 一括永続化）
  var p=accProgress(DB.activeAccountId);
  var wrongKp=[];
  S.kpIds.forEach(function(kid){ p.items[kid]=S.work[kid]; });
  S.served.forEach(function(s){ if(!s.correct && wrongKp.indexOf(s.kpId)<0) wrongKp.push(s.kpId); });
  p.sessions.push({startedAt:S.startedAt,finishedAt:new Date().toISOString(),mode:S.mode,
    correct:S.correct,wrong:S.wrong,newlyMastered:S.newlyMastered.slice(),wrongKpIds:wrongKp});
  if(p.sessions.length>50) p.sessions=p.sessions.slice(p.sessions.length-50);
  saveDB();
  autoPush();               // 追補v1.2 §5：終了直後に自動push
  S.cur=null; S.curView=null;
  UI.screen="result";
  render();
}

function catStat(catId){
  var items=accProgress(DB.activeAccountId).items;

  ks.forEach(function(k){var it=items[k.id];if(it&&it.mastered)mastered++;else if(it&&(it.totalCorrect>0||it.totalWrong>0))started++;});
  return {total:ks.length,mastered:mastered,started:started};
}
function overallStat(){
  var items=accProgress(DB.activeAccountId).items;

/* ---- 出題（§6-1 UI / §5 戻る=閲覧のみ） ---- */
function renderQuiz(){
  var reviewing = S.viewPos!==null;
  var v = reviewing ? S.served[S.viewPos] : S.curView;
  var judged = reviewing ? true : S.judged;
  var picked = reviewing ? v.picked : S.picked;
  var ok = judged && (reviewing ? v.correct :
            (S.picked.length===v.answers.length && S.picked.every(function(p){return v.answers.indexOf(p)>=0;})));
  var w=S.work[v.kpId];
  var total=Math.max(S.nominal, S.servedCount);
  var pos = reviewing ? (S.viewPos+1) : (S.servedCount+ (S.judged?0:1));
  var remaining=S.kpIds.filter(function(kid){return !S.work[kid].mastered && S.repeat[kid]<MAX_REPEAT;}).length;

  // 習得ゲージ
  var need=(kpFormats(KP_BY[v.kpId]).length>1)?MASTERY_STREAK:MASTERY_STREAK;
  var dots=""; for(var i=0;i<need;i++){dots+= (i<w.streak?"●":"○");}

  var html='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'+
    '<button class="link" id="quit">✕ やめる</button>'+
    (S.served.length>0 && !reviewing ? '<button class="link" id="back">← 前へ（見直し）</button>':'')+
    (reviewing ? '<button class="link" id="fwd">→ 進む</button>':'')+
    '<span class="num" style="margin-left:auto;font-size:12px;color:var(--ink60)">'+pos+' / '+total+'</span></div>';
  html+=bar((S.servedCount)/(total||1));
  html+='<div style="display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--ink60)" class="num">'+
    '<span>あと '+remaining+' 語</span><span>正解 '+S.correct+'</span><span>誤答 '+S.wrong+'</span>'+
    '<span style="margin-left:auto">習得 <span class="dots">'+dots+'</span></span></div>';
  if(reviewing) html+='<p style="font-size:11.5px;color:var(--seed);margin:10px 0 0">見直し中（閲覧のみ）</p>';

  html+='<div class="panel" style="margin-top:14px"><span class="tag" style="background:var(--leafLt);color:'+catColor(v.cat)+'">'+esc(v.cat)+'<span style="opacity:.6">・形式'+v.format+'</span></span>'+
    '<h2 style="font-size:20px;line-height:1.7;margin:12px 0 0">'+txt(v.prompt)+'</h2>'+
    imgHtml(v.img)+
    (v.multi?'<p style="font-size:11.5px;color:var(--ink60);margin:6px 0 0">あてはまるものを すべて えらんでください</p>':'')+'</div>';

  html+='<div class="stack" style="margin-top:14px">';
  v.choices.forEach(function(ch,i){
    var sel=picked.indexOf(ch)>=0, isAns=v.answers.indexOf(ch)>=0;
    var bg="transparent",bd="var(--line)",fg="var(--ink)";
    if(judged){ if(isAns){bg="var(--leafLt)";bd="var(--leaf)";} else if(sel){bg="var(--wrongLt)";bd="var(--wrong)";fg="var(--wrong)";} }
    else if(sel){bg="var(--paper2)";bd="var(--ink)";}
    var mk=(sel||(judged&&isAns))?bd:"var(--line)";
    html+='<button class="choice" data-ch="'+i+'"'+((judged||reviewing)?' disabled':'')+' style="background:'+bg+';border-color:'+bd+';color:'+fg+'">'+
      (v.multi?'<span class="box" style="margin-right:10px;border-color:'+mk+';background:'+((sel||(judged&&isAns))?bd:"transparent")+'"></span>':'')+
      '<span>'+txt(ch)+'</span>'+(judged&&isAns?'<span style="margin-left:auto;color:var(--leaf);font-size:13px">正解</span>':'')+'</button>';
  });
  html+='</div>';

  if(judged){
    html+='<div class="panel" style="margin-top:14px;border-color:'+(ok?"var(--leaf)":"var(--wrong)")+';background:'+(ok?"var(--leafLt)":"var(--wrongLt)")+'">'+
      '<div style="font-family:var(--serif);font-size:17px;color:'+(ok?"var(--leaf)":"var(--wrong)")+';margin-bottom:6px">'+(ok?"○ せいかい":"× ざんねん")+'</div>'+
      '<p style="font-size:13.5px;line-height:1.85;margin:0">'+txt(v.exp)+'</p>'+findLinks(v.kw)+'</div>';
  }
  if(!reviewing){
    html+='<div style="margin-top:16px">'+
      (S.judged? '<button class="primary" id="next">'+(S.queue.length===0?"けっかを見る":"つぎの問題 →")+'</button>'
               : '<button class="primary" id="do"'+(S.picked.length?"":" disabled")+'>こたえあわせ</button>')+'</div>';
  }
  app.innerHTML=html;

  q("#quit").onclick=confirmQuit;
  var bk=q("#back"); if(bk) bk.onclick=function(){S.viewPos=S.served.length-1;render();};
  var fw=q("#fwd"); if(fw) fw.onclick=function(){
    if(S.viewPos<S.served.length-1){S.viewPos++;} else {S.viewPos=null;} render();
  };
  qa("[data-ch]").forEach(function(el){el.onclick=function(){
    if(S.judged||reviewing)return; var ch=v.choices[+el.getAttribute("data-ch")];
    if(v.multi){var k=S.picked.indexOf(ch); if(k>=0)S.picked.splice(k,1); else S.picked.push(ch);}
    else S.picked=[ch]; render();
  };});
  var dbtn=q("#do"); if(dbtn) dbtn.onclick=judge;
  var nb=q("#next"); if(nb) nb.onclick=nextQ;
}

function kpState(it){
  if(!it||(it.totalCorrect===0&&it.totalWrong===0)) return {label:"未出題",rank:0,color:"var(--line)"};
  if(it.mastered) return {label:"習得済み",rank:3,color:"var(--leaf)"};
  if(it.totalWrong>0 && it.totalCorrect===0) return {label:"誤答あり",rank:1,color:"var(--wrong)"};
  return {label:it.totalCorrect+"回正解",rank:2,color:"var(--seed)"};
}

  else if(UI.resultStateFilter==="mastered") rows=rows.filter(function(r){return r.it.mastered;});

      '<span class="swatch" style="background:'+r.st.color+'"></span>'+

/* CSV（BOM付き・1列目=ID、末尾に表示名） */
function exportCSV(){
  if(!AUTH) return;
  var items=accProgress(AUTH.id).items;
  var cols=LIST_HEADER.concat(["表示名"]);
  var rows=KPS.map(function(k){ return rowFor(k,items[k.id]).concat([AUTH.label||""]); });
  rows.sort(function(a,b){return (b[8]||0)-(a[8]||0);});  // 累計誤答数の多い順
  var csv=cols.join(",")+"\r\n"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  var d=new Date(); var ymd=""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="植物クイズ結果_"+AUTH.id+"_"+ymd+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}
function csvCell(v){v=String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

/* ---- 覚えるモード（§7 とは別・成績非影響） ---- */
function buildMemoCards(cats,scope){
  var items=accProgress(DB.activeAccountId).items;
  return KPS.filter(function(k){
    if(cats.indexOf(k.cat)<0) return false;
    var it=items[k.id];
    if(scope==="unmastered") return !(it&&it.mastered);
    if(scope==="weak") return it && it.totalWrong>0;
    return true;
  });
}

function renderMemoCard(){
  armLeaveGuard(false);
  if(!MEMO||!MEMO.cards||!MEMO.cards.length){ UI.screen="memodone"; return renderMemoDone(); }
  if(MEMO.idx>=MEMO.cards.length) MEMO.idx=MEMO.cards.length-1;
  var k=MEMO.cards[MEMO.idx], fm=k.forms.A;

/* =========================================================
   10. クラウド同期（v3.0：自分のID 1件だけ / action:fetch,save）
   ========================================================= */
var SYNCST={kind:"",msg:""};   // kind: ok/err/prog
function setSync(kind,msg){SYNCST.kind=kind;SYNCST.msg=msg;}
function renderIfHome(){ if(UI.screen==="home" && loggedIn() && ready()) renderHome(); }
function fmtYMD(iso){ if(!iso) return ""; var d=new Date(iso); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }

/* --- 1アカウント用の合流（指示書§F） --- */
function mergeItem(a,b){
  if(!a) return JSON.parse(JSON.stringify(b));
  if(!b) return JSON.parse(JSON.stringify(a));
  var r=JSON.parse(JSON.stringify(a));
  r.totalCorrect=Math.max(a.totalCorrect||0,b.totalCorrect||0);
  r.totalWrong=Math.max(a.totalWrong||0,b.totalWrong||0);
  r.mastered=!!(a.mastered||b.mastered);
  if(a.masteredAt&&b.masteredAt) r.masteredAt=(new Date(a.masteredAt)<=new Date(b.masteredAt))?a.masteredAt:b.masteredAt;
  else r.masteredAt=a.masteredAt||b.masteredAt||null;
  if(r.mastered&&!r.masteredAt) r.masteredAt=nowISO();
  r.byFormat={A:{correct:0,wrong:0},B:{correct:0,wrong:0}};
  ["A","B"].forEach(function(f){
    var af=(a.byFormat&&a.byFormat[f])||{correct:0,wrong:0}, bf=(b.byFormat&&b.byFormat[f])||{correct:0,wrong:0};
    r.byFormat[f]={correct:Math.max(af.correct||0,bf.correct||0),wrong:Math.max(af.wrong||0,bf.wrong||0)};
  });
  var seen={},log=[];
  (a.wrongLog||[]).concat(b.wrongLog||[]).forEach(function(w){var k=(w.at||"")+"|"+w.format+"|"+w.answered; if(!seen[k]){seen[k]=1;log.push(w);}});
  log.sort(function(x,y){return (x.at||"")<(y.at||"")?-1:1;});
  if(log.length>WRONGLOG_MAX) log=log.slice(log.length-WRONGLOG_MAX);
  r.wrongLog=log;
  var at=a.lastSeenAt?new Date(a.lastSeenAt).getTime():0, bt=b.lastSeenAt?new Date(b.lastSeenAt).getTime():0;
  var newer=(at>=bt)?a:b;
  r.lastSeenAt=newer.lastSeenAt||a.lastSeenAt||b.lastSeenAt||null;
  r.streak=newer.streak; r.streakFormat=newer.streakFormat||null; r.lastFormat=newer.lastFormat;
  return r;
}
function mergeProgress(L,C){
  L=normProgress(L); C=normProgress(C);
  var M={items:{},sessions:[]}, ids={};
  Object.keys(L.items).forEach(function(k){ids[k]=1;});
  Object.keys(C.items).forEach(function(k){ids[k]=1;});
  Object.keys(ids).forEach(function(k){ M.items[k]=mergeItem(L.items[k],C.items[k]); });
  var seen={}, ss=[];
  L.sessions.concat(C.sessions).forEach(function(s){ if(s&&!seen[s.finishedAt]){ seen[s.finishedAt]=1; ss.push(s); } });
  ss.sort(function(x,y){ return new Date(y.finishedAt)-new Date(x.finishedAt); });
  M.sessions=ss.slice(0,100).reverse();
  return M;
}

/* --- 通信（指示書§E：POST text/plain、action付き） --- */
function api(body){
  return fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({key:SYNC.key},body))})
   .then(function(r){return r.text();})
   .then(function(t){ try{return JSON.parse(t);}catch(e){ throw new Error("GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください"); } });
}
function apiError(j){ var e=String(j.error||""); if(e==="auth") return "ログインが無効になりました。ポータルでログインし直してください"; if(/合言葉|key/i.test(e)) return "合言葉が違います"; return e||"エラー"; }
function onAuthLost(){ lsDel(K_AUTH); AUTH=null; UI.screen="gate"; render(); }

/* pull：サーバーから自分のIDの記録を取得して合流（初回端末はそのまま反映） */
function pullCloud(silent){
  if(!ready()||!AUTH) return;
  if(!silent){ setSync("prog","☁… クラウドと同期しています"); renderIfHome(); }
  api({action:"fetch",app:APP_KEY,id:AUTH.id,pw:AUTH.pw}).then(function(j){
    if(!j.ok){ if(j.error==="auth"){ setSync("err","☁⚠ "+apiError(j)); onAuthLost(); return; } setSync("err","☁⚠ "+apiError(j)); renderIfHome(); return; }
    var cloudP=normProgress(((j.data||{}).progress||{})[AUTH.id]);
    var localP=accProgress(AUTH.id);
    var before=JSON.stringify(localP);
    var merged=mergeProgress(localP,cloudP);
    DB.progress[AUTH.id]=merged;
    if(j.label){ AUTH.label=j.label; lsSet(K_AUTH,JSON.stringify(AUTH)); if(DB.accounts[0]) DB.accounts[0].label=j.label; }
    var cd=(j.data||{}).accounts&&j.data.accounts[0];
    if(cd&&cd.createdAt&&DB.accounts[0]) DB.accounts[0].createdAt=cd.createdAt;
    saveDB({fromCloud:true});
    SYNC.lastSync=nowISO(); saveSync();
    var n=Object.keys(merged.items).length;
    var mm=Object.keys(merged.items).filter(function(k){return merged.items[k].mastered;}).length;
    setSync("ok","☁✓ クラウドと合流しました（"+n+"語・習得"+mm+"）");
    render();
    if(before!==JSON.stringify(merged)) pushCloud(true, SYNCST.msg);   // 合流で増えた分を送り返す
  }).catch(function(e){
    if(/GASの応答/.test(e.message)) setSync("err","☁⚠ "+e.message);
    else setSync("","☁ オフライン（ローカルには保存済み）");
    renderIfHome();
  });
}

/* push：自分のID 1件だけ送る（DB丸ごとは送らない） */
function pushCloud(silent,okMsg){
  if(!ready()||!AUTH) return;
  if(!silent){ setSync("prog","☁… 送信しています"); renderIfHome(); }
  api({action:"save",app:APP_KEY,id:AUTH.id,pw:AUTH.pw,account:DB.accounts[0],progress:accProgress(AUTH.id)}).then(function(j){
    if(!j.ok){ if(j.error==="auth"){ setSync("err","☁⚠ "+apiError(j)); onAuthLost(); return; } setSync("err","☁⚠ "+apiError(j)); renderIfHome(); return; }
    SYNC.lastSync=nowISO(); saveSync();
    setSync("ok", okMsg||"☁✓ クラウドに保存しました"); renderIfHome();
  }).catch(function(e){
    if(/GASの応答/.test(e.message)) setSync("err","☁⚠ "+e.message);
    else setSync("","☁ オフライン（ローカルには保存済み。次につながったときに送ります）");
    renderIfHome();
  });
}
function autoPush(){ pushCloud(true); }

/* 全問一覧をDriveへ（指示書§E：action無し・IDを付ける） */
var LIST_HEADER=["名前","カテゴリー","記号","知識ポイント","よみがな","重要度","状態","累計正解数","累計誤答数","形式A誤答数","形式B誤答数","過去の誤答内容","最終誤答日","習得日"];
function rowFor(k,it){
  var itt=it||newItem(); var st=kpState(it).label;
  var past=(itt.wrongLog||[]).map(function(w){return w.answered;}).join(";");
  var lastWD=(itt.wrongLog&&itt.wrongLog.length)?fmtYMD(itt.wrongLog[itt.wrongLog.length-1].at):"";
  var mAt=itt.masteredAt?fmtYMD(itt.masteredAt):"";
  var bA=(itt.byFormat&&itt.byFormat.A)?itt.byFormat.A.wrong:0, bB=(itt.byFormat&&itt.byFormat.B)?itt.byFormat.B.wrong:0;
  return [AUTH?AUTH.id:"", k.cat, "", k.label, "", "", st, itt.totalCorrect||0, itt.totalWrong||0, bA, bB, past, lastWD, mAt];
}
function buildListRows(){
  var rows=[]; if(!AUTH) return rows;
  var items=accProgress(AUTH.id).items;
  KPS.forEach(function(k){ rows.push(rowFor(k,items[k.id])); });
  return rows;
}
function exportListToDrive(){
  if(!ready()||!AUTH) return;
  setSync("prog","☁… 送信しています"); renderIfHome();
  api({app:APP_KEY, id:AUTH.id, list:{header:LIST_HEADER, rows:buildListRows()}}).then(function(j){
    if(!j.ok){ if(j.error==="auth"){ setSync("err","☁⚠ "+apiError(j)); onAuthLost(); return; } setSync("err","☁⚠ "+apiError(j)); renderIfHome(); return; }
    setSync("ok","☁✓ 全問一覧をスプレッドシートに書き出しました"); renderIfHome();
  }).catch(function(e){
    if(/GASの応答/.test(e.message)) setSync("err","☁⚠ "+e.message);
    else setSync("","☁ オフライン（ローカルには保存済み）");
    renderIfHome();
  });
}

/* --- JSON 書き出し / 読み込み（自分のIDだけ・指示書§H） --- */
function exportJSON(){
  if(!AUTH) return;
  var blob=new Blob([JSON.stringify(DB)],{type:"application/json"});
  var d=new Date(); var ymd=""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="植物クイズ記録_"+AUTH.id+"_"+ymd+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}
function importJSON(file){
  if(!AUTH) return;
  var rd=new FileReader();
  rd.onload=function(){
    var obj; try{obj=JSON.parse(rd.result);}catch(e){ showModal("読み込めません","JSONの形式が正しくありません。","OK","",closeModal,closeModal); return; }
    if(obj.app!==APP_KEY){ showModal("別のツールのデータです","このファイルは「"+esc(obj.app||"不明")+"」用です。植物クイズ（"+APP_KEY+"）の記録を選んでください。","OK","",closeModal,closeModal); return; }
    var p=(obj.progress||{})[AUTH.id];
    if(!p){ showModal("このIDの記録がありません","このファイルには ID "+esc(AUTH.id)+" の記録が入っていません（別のお子さんの記録の可能性があります）。","OK","",closeModal,closeModal); return; }
    var when=obj.updatedAt?String(obj.updatedAt).slice(0,16).replace("T"," "):"不明";
    showModal("記録を置き換えますか?","ID <b>"+esc(AUTH.id)+"</b> の記録を、このファイルの内容で置き換えます。<br>保存日時："+esc(when),"置き換える","やめる",function(){
      DB.progress[AUTH.id]=normProgress(p); saveDB(); autoPush(); closeModal(); UI.screen="home"; render();
    },closeModal);
  };
  rd.readAsText(file);
}
