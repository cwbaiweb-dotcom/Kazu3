<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>敬語マスター｜中学受験 国語</title>
<style>
:root{
  --bg:#f5f7fa; --card:#fff; --ink:#1f2a37; --sub:#64748b; --line:#e2e8f0;
  --pri:#2563eb; --pri-d:#1d4ed8; --ok:#059669; --ng:#dc2626; --warn:#d97706;
  --son:#7c3aed; --ken:#0891b2; --tei:#65a30d; --bik:#db2777; --err:#e11d48;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.7; padding-bottom:40px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}
header.top{
  background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff;
  padding:14px 12px; position:sticky; top:0; z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
header.top .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em}
header.top .who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.muted{color:var(--sub);font-size:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;min-height:44px;
}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ghost{background:#f8fafc}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px;border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)
}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.seg button.on{background:var(--pri);color:#fff}
.bar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;color:#fff}
.t-son{background:var(--son)} .t-ken{background:var(--ken)} .t-tei{background:var(--tei)}
.t-bik{background:var(--bik)} .t-err{background:var(--err)}
.imp2{color:#b45309;font-weight:800}
.imp1{color:#0369a1;font-weight:800}
.q-stem{font-size:15px;color:var(--sub);font-weight:700;margin-bottom:6px}
.q-main{font-size:24px;font-weight:800;line-height:1.5;margin:6px 0 14px;word-break:break-word}
.choice{
  display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;
  border-radius:12px;padding:14px;margin:8px 0;font-size:17px;font-weight:700;
  cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.5;
}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--ok);background:#ecfdf5}
.choice.ng{border-color:var(--ng);background:#fef2f2}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-size:15px}
.fb.ok{background:#ecfdf5;border:1px solid #a7f3d0}
.fb.ng{background:#fef2f2;border:1px solid #fecaca}
.fb b{font-size:16px}
.gauge{display:inline-flex;gap:4px;align-items:center}
.gauge i{width:12px;height:12px;border-radius:50%;background:#d1d5db;display:block}
.gauge i.f{background:var(--ok)}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub);font-weight:700}
table.lst{width:100%;border-collapse:collapse;font-size:13px}
table.lst th,table.lst td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
table.lst th{color:var(--sub);font-size:12px;white-space:nowrap}
.st-m{color:var(--ok);font-weight:800}
.st-w{color:var(--warn);font-weight:800}
.st-x{color:var(--ng);font-weight:800}
.st-n{color:var(--sub)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 10px;font-size:17px}
input[type=text],input[type=password],select,textarea{
  width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)
}
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 4px}
.status{border-radius:10px;padding:10px;font-size:13px;font-weight:700;margin-bottom:10px;background:#f1f5f9;color:var(--sub)}
.status.ok{background:#ecfdf5;color:#047857}
.status.err{background:#fef2f2;color:#b91c1c}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:200;max-width:92vw}
.flip{
  border:2px solid var(--line);border-radius:16px;min-height:210px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;
  cursor:pointer;background:#fff;
}
.flip .big{font-size:28px;font-weight:800;line-height:1.4}
.hide{display:none!important}
.li{border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0}
.warnbar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:10px;font-size:13px;margin:10px 0}
.badge{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;cursor:pointer}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff}
summary{cursor:pointer;font-weight:700;font-size:14px}
@media(max-width:420px){ .q-main{font-size:21px} .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <h1>敬語マスター</h1>
    <div class="who">
      <span id="whoName">—</span>
      <button class="btn sm ghost" id="btnSwitch">切替</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="lsWarn" class="warnbar hide"></div>

  <!-- ============ HOME ============ -->
  <div id="scHome">
    <div class="card">
      <h2>📚 出題範囲</h2>
      <div class="muted" style="margin-bottom:6px">重要度</div>
      <div class="seg" id="impSeg">
        <button data-v="all">すべて</button>
        <button data-v="21">◎○のみ</button>
        <button data-v="2">◎のみ</button>
      </div>
      <div class="muted" style="margin:12px 0 6px">カテゴリー</div>
      <div class="row" id="catChips"></div>
      <div class="muted" id="rangeInfo" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>▶ 学習をはじめる</h2>
      <div class="grid2">
        <button class="btn pri" data-mode="10問">10問モード<br><span style="font-size:11px;font-weight:600">（10語＝20問）</span></button>
        <button class="btn pri" data-mode="20問">20問モード<br><span style="font-size:11px;font-weight:600">（20語＝40問）</span></button>
        <button class="btn" data-mode="全問">全問モード<br><span style="font-size:11px;font-weight:600">（範囲内すべて1問ずつ）</span></button>
        <button class="btn" data-mode="再確認">再確認モード<br><span style="font-size:11px;font-weight:600">（要注意習得のみ）</span></button>
      </div>
      <div style="margin-top:8px"><button class="btn wide ghost" id="btnMemo">📖 覚えるモード（記録に残りません）</button></div>
      <div style="margin-top:10px" id="alertBadge"></div>
    </div>

    <div class="card">
      <h2>📊 習得状況<span class="muted" style="font-weight:600">（範囲に関係なく全体で集計）</span></h2>
      <div id="masteryBox"></div>
    </div>

    <div class="card">
      <h2>⚠ 間違いランキング</h2>
      <div id="rankBox"></div>
    </div>

    <div class="card">
      <h2>💾 記録データの管理</h2>
      <div id="syncStatus" class="status">☁ 同期は未設定です</div>
      <div class="row">
        <button class="btn sm" id="btnExport">📤 記録を書き出す</button>
        <button class="btn sm" id="btnImport">📥 記録を読み込む</button>
        <button class="btn sm" id="btnSyncCfg">☁ クラウド同期設定</button>
        <button class="btn sm hide" id="btnSyncNow">🔄 今すぐ同期</button>
        <button class="btn sm hide" id="btnPushList">📋 全問一覧をDriveへ</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm ghost" id="btnAccounts">👤 アカウント管理</button>
        <button class="btn sm ghost" id="btnReset">🗑 このアカウントの記録を消す</button>
      </div>
    </div>
    <div class="muted" style="text-align:center;padding:10px 0">app: <code id="appId"></code></div>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="scQuiz" class="hide">
    <div class="card">
      <div class="hud">
        <span id="qCount"></span><span id="qLeft"></span><span id="qScore"></span>
        <span style="margin-left:auto"><button class="btn sm ghost" id="btnQuit">中断</button></span>
      </div>
      <div class="bar" style="margin:8px 0"><i id="qBar" style="width:0%"></i></div>
      <div class="hud"><span id="qGauge"></span><span id="qHard" class="muted"></span></div>
    </div>
    <div class="card">
      <div id="qStem" class="q-stem"></div>
      <div id="qMain" class="q-main"></div>
      <div id="qChoices"></div>
      <div id="qFb"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn sm ghost" id="btnPrev">← 前の問題へ</button>
        <button class="btn sm ghost hide" id="btnFwd">進む →</button>
        <span style="margin-left:auto"><button class="btn pri hide" id="btnNext">次へ →</button></span>
      </div>
    </div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="scResult" class="hide">
    <div class="card" id="resSummary"></div>
    <div class="card" id="resWrong"></div>
    <div class="card" id="resAll"></div>
    <div class="row">
      <button class="btn pri" id="btnHome">🏠 ホームへ</button>
      <button class="btn" id="btnCsv">⬇ CSVダウンロード</button>
    </div>
  </div>

  <!-- ============ MEMORIZE ============ -->
  <div id="scMemo" class="hide">
    <div class="card">
      <h2>📖 覚えるモード</h2>
      <div class="muted">このモードの操作は記録・習得判定・同期に<b>いっさい影響しません</b>。</div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="mTabList">📋 一覧学習</button>
        <button class="btn sm" id="mTabCard">🃏 単語カード</button>
        <span style="margin-left:auto"><button class="btn sm ghost" id="mBack">🏠 ホーム</button></span>
      </div>
    </div>
    <div id="mList" class="card"></div>
    <div id="mCard" class="card hide"></div>
  </div>
</div>

<div id="modalRoot"></div>
<script>
/* ================= 基本設定 ================= */
const APP   = 'kj-quiz-kokugo-keigo';
const TITLE = '敬語';
const SCHEMA_VERSION = 2;

/* 出題形式の定義（このツール）
   A = 「ふつうの言い方 → 敬語」／「ことば → 敬語の種類」／「誤文 → 正しい言い方」
   B = 「敬語 → ふつうの言い方」／「種類 → あてはまることば」／「誤文 → まちがいの理由」 */
const FMT_NAME = { A:'A（ふつう→敬語・種類・直し）', B:'B（敬語→ふつう・見分け・理由）' };

const REASONS = {
  R1:'自分や身内の動作に尊敬語を使っている',
  R2:'相手（目上）の動作に謙譲語を使っている',
  R3:'二重敬語になっている（敬語の重ねすぎ）',
  R4:'相手への依頼なのに「お〜する」（謙譲語）を使っている'
};

/* ================= 知識ポイント =================
   kind: conv=言いかえ / cls=種類の見分け / err=まちがい直し
   imp : 2=◎最重要 1=○重要 0=標準 */
const DATA = [
/* --- 尊敬語（特別な形） --- */
{id:'s01',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:2,q:'言う',a:'おっしゃる',yomi:'おっしゃる',exp:'先生や目上の人が「言う」ときは尊敬語「おっしゃる」。自分が言うときは謙譲語「申す・申し上げる」。'},
{id:'s02',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:2,q:'行く',a:'いらっしゃる',yomi:'いらっしゃる',exp:'「行く・来る・いる」はどれも尊敬語では「いらっしゃる」。「おいでになる」も可。'},

{id:'s04',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:1,q:'いる',a:'いらっしゃる',yomi:'いらっしゃる',exp:'「先生は職員室にいらっしゃいます」。謙譲語は「おる」。'},
{id:'s05',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:2,q:'食べる',a:'召し上がる',yomi:'めしあがる',exp:'「食べる・飲む」の尊敬語。「いただく」は謙譲語なので相手にはすすめられない。'},
{id:'s06',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:1,q:'飲む',a:'召し上がる',yomi:'めしあがる',exp:'「お飲みになる」も尊敬語。「お召し上がりになられる」は二重敬語で誤り。'},
{id:'s07',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:2,q:'見る',a:'ご覧になる',yomi:'ごらんになる',exp:'相手が見るときは「ご覧になる」、自分が見るときは謙譲語「拝見する」。'},
{id:'s08',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:2,q:'する',a:'なさる',yomi:'なさる',exp:'「先生が研究をなさる」。自分の動作なら謙譲語「いたす」。'},
{id:'s09',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:2,q:'くれる',a:'くださる',yomi:'くださる',exp:'相手が自分に与える動作。反対に自分が与えるときは謙譲語「差し上げる」。'},

{id:'s14',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:0,q:'死ぬ',a:'お亡くなりになる',yomi:'おなくなりになる',exp:'「亡くなられる」も使う。'},
{id:'s15',cat:'尊敬語',kind:'conv',sym:'尊敬語',imp:0,q:'買う',a:'お求めになる',yomi:'おもとめになる',exp:'店などで客の動作をいうときに使う。'},

{id:'k04',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:1,q:'いる',a:'おる',yomi:'おる',exp:'「私は家におります」。「先生はおられますか」は本来誤りで「いらっしゃいますか」。'},
{id:'k05',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:2,q:'食べる',a:'いただく',yomi:'いただく',exp:'自分が食べる動作。相手にすすめるときは尊敬語「召し上がる」。'},
{id:'k06',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:1,q:'飲む',a:'いただく',yomi:'いただく',exp:'「お茶をいただきます」。'},
{id:'k07',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:2,q:'もらう',a:'頂戴する',yomi:'ちょうだいする',exp:'「いただく」も同じ。反対語は「差し上げる」。'},
{id:'k08',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:2,q:'見る',a:'拝見する',yomi:'はいけんする',exp:'自分が見る動作。「拝見させていただく」は敬語の重ねすぎ。'},
{id:'k09',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:2,q:'する',a:'いたす',yomi:'いたす',exp:'「私がいたします」。相手の動作には尊敬語「なさる」。'},
{id:'k10',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:2,q:'あげる',a:'差し上げる',yomi:'さしあげる',exp:'自分が相手に与える。もらうときは「いただく」。'},
{id:'k11',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:2,q:'聞く',a:'伺う',yomi:'うかがう',exp:'「先生に伺いました」。「拝聴する」も謙譲語。'},
{id:'k12',cat:'謙譲語',kind:'conv',sym:'謙譲語',imp:2,q:'知る',a:'存じる',yomi:'ぞんじる',exp:'「その件は存じております」。人について言うときは「存じ上げる」。'},

const BY_ID = {}; DATA.forEach(d=>BY_ID[d.id]=d);
const CATS = []; DATA.forEach(d=>{ if(CATS.indexOf(d.cat)<0) CATS.push(d.cat); });
const SYM_MARK = {'尊敬語':'尊','謙譲語':'謙','丁寧語':'丁','美化語':'美'};
/* ================= ストレージ ================= */
const MEM={};
const LS_OK=(function(){try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__');return true;}catch(e){return false;}})();
function lsGet(k){ if(!LS_OK) return (k in MEM)?MEM[k]:null; try{return localStorage.getItem(k);}catch(e){return (k in MEM)?MEM[k]:null;} }
function lsSet(k,v){ if(!LS_OK){MEM[k]=v;return;} try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;} }
function lsDel(k){ if(!LS_OK){delete MEM[k];return;} try{localStorage.removeItem(k);}catch(e){delete MEM[k];} }

const K_DB=APP, K_SYNC=APP+':sync', K_UI=APP+':ui';

/* ================= DB ================= */
function nowISO(){ return new Date().toISOString(); }
function emptyDB(){ return {app:APP,version:SCHEMA_VERSION,updatedAt:nowISO(),activeAccountId:null,accounts:[],progress:{}}; }
function newItem(){ return {streak:0,mastered:false,masteredAt:null,postMasterWrong:0,lastFormat:null,
  totalCorrect:0,totalWrong:0,byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}},wrongLog:[],lastSeenAt:null}; }
function newAccId(){ return 'acc_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function normalizeItem(it){
  const n=newItem();
  if(!it||typeof it!=='object') return n;
  n.streak=+it.streak||0;
  n.mastered=!!it.mastered;
  n.masteredAt=it.masteredAt||null;
  n.postMasterWrong=+it.postMasterWrong||0;      /* v1系からの移行で0を補う */
  n.lastFormat=(it.lastFormat==='A'||it.lastFormat==='B')?it.lastFormat:null;
  n.totalCorrect=+it.totalCorrect||0;
  n.totalWrong=+it.totalWrong||0;
  if(it.byFormat){ ['A','B'].forEach(f=>{ const s=it.byFormat[f]||{}; n.byFormat[f]={correct:+s.correct||0,wrong:+s.wrong||0}; }); }
  if(Array.isArray(it.wrongLog)) n.wrongLog=it.wrongLog.filter(x=>x&&x.at).slice(0,5);
  n.lastSeenAt=it.lastSeenAt||null;
  if(n.mastered&&!n.masteredAt) n.masteredAt=n.lastSeenAt||nowISO();
  return n;
}
function normalizeDB(d){
  if(!d||typeof d!=='object') return emptyDB();
  const out=emptyDB();
  out.app=APP;
  out.updatedAt=d.updatedAt||nowISO();
  out.accounts=Array.isArray(d.accounts)?d.accounts.filter(a=>a&&a.id&&a.name)
    .map(a=>({id:String(a.id),name:String(a.name),createdAt:a.createdAt||nowISO()})):[];
  const prog=d.progress&&typeof d.progress==='object'?d.progress:{};
  out.accounts.forEach(a=>{
    const p=prog[a.id]||{};
    const items={}; const src=p.items&&typeof p.items==='object'?p.items:{};
    Object.keys(src).forEach(k=>{ if(BY_ID[k]) items[k]=normalizeItem(src[k]); });
    const ses=Array.isArray(p.sessions)?p.sessions.slice(0,100):[];
    out.progress[a.id]={items:items,sessions:ses};
  });
  out.activeAccountId=(d.activeAccountId&&out.accounts.some(a=>a.id===d.activeAccountId))
    ? d.activeAccountId : (out.accounts[0]?out.accounts[0].id:null);
  return out;
}
/* 旧スキーマ（{users:{名前:{st:{...}}}} など）からの移行 */
function migrateLegacy(raw){
  const d=emptyDB();
  const users=raw.users||raw.accountsData||null;
  if(users&&typeof users==='object'){
    Object.keys(users).forEach(name=>{
      const id=newAccId();
      d.accounts.push({id:id,name:String(name),createdAt:nowISO()});
      const items={};
      const st=users[name].st||users[name].items||users[name]||{};
      Object.keys(st).forEach(k=>{ if(BY_ID[k]) items[k]=normalizeItem(st[k]); });
      d.progress[id]={items:items,sessions:[]};
    });
    d.activeAccountId=d.accounts[0]?d.accounts[0].id:null;
  }
  return d;
}
function loadDB(){
  const raw=lsGet(K_DB);
  if(!raw) return emptyDB();
  let o; try{ o=JSON.parse(raw); }catch(e){ return emptyDB(); }
  if(o&&Array.isArray(o.accounts)) return normalizeDB(o);
  return normalizeDB(migrateLegacy(o||{}));
}

/* ================= 習得判定 ================= */
function requiredStreak(it){
  const w=(it&&it.totalWrong)||0;
  if(w>=6) return 4;
  if(w>=3) return 3;
  return 2;
}
function stateOf(it){
  if(!it) return '未出題';
  if(it.mastered) return it.postMasterWrong>0?'要注意習得':'習得済み';
  if(it.totalCorrect+it.totalWrong===0) return '未出題';
  if(it.totalCorrect>0) return it.totalCorrect+'回正解';
  return '誤答';
}

/* ================= 出題生成 ================= */
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i];r[i]=r[j];r[j]=t; } return r; }
function uniqPush(arr,v){ if(v&&arr.indexOf(v)<0) arr.push(v); }

function buildQ(kp,fmt){
  const Q={kp:kp,fmt:fmt,stem:'',main:'',choices:[],correct:'',note:''};
  if(kp.kind==='conv'){
    const pool=DATA.filter(x=>x.kind==='conv'&&x.sym===kp.sym&&x.id!==kp.id);
    if(fmt==='A'){
      Q.stem='次のことばを'+kp.sym+'にすると？';
      Q.main='「'+kp.q+'」';
      Q.correct=kp.a;
      const cand=shuffle(pool.filter(x=>x.q!==kp.q&&x.a!==kp.a));
      const cs=[kp.a]; for(let i=0;i<cand.length&&cs.length<4;i++) uniqPush(cs,cand[i].a);
      const extra=shuffle(DATA.filter(x=>x.kind==='conv'&&x.a!==kp.a));
      for(let i=0;i<extra.length&&cs.length<4;i++) uniqPush(cs,extra[i].a);
      Q.choices=shuffle(cs);
    }else{
      Q.stem='次の敬語を、ふつうの言い方にすると？';
      Q.main='「'+kp.a+'」';
      Q.correct=kp.q;
      const cand=shuffle(pool.filter(x=>x.a!==kp.a&&x.q!==kp.q));
      const cs=[kp.q]; for(let i=0;i<cand.length&&cs.length<4;i++) uniqPush(cs,cand[i].q);
      const extra=shuffle(DATA.filter(x=>x.kind==='conv'&&x.q!==kp.q));
      for(let i=0;i<extra.length&&cs.length<4;i++) uniqPush(cs,extra[i].q);
      Q.choices=shuffle(cs);
    }
    Q.note=kp.sym;
  }else if(kp.kind==='cls'){
    if(fmt==='A'){
      Q.stem='次のことばは、どの敬語ですか？';
      Q.main='「'+kp.q+'」';
      Q.correct=kp.a;
      Q.choices=shuffle(['尊敬語','謙譲語','丁寧語','美化語']);
    }else{
      Q.stem='次のうち、「'+kp.a+'」はどれですか？';
      Q.main='';
      Q.correct=kp.q;
      const cand=shuffle(DATA.filter(x=>x.kind==='cls'&&x.a!==kp.a));
      const cs=[kp.q]; for(let i=0;i<cand.length&&cs.length<4;i++) uniqPush(cs,cand[i].q);
      Q.choices=shuffle(cs);
    }
  }else{ /* err */
    if(fmt==='A'){
      Q.stem='次の文の敬語の使い方を、正しく直すと？';
      Q.main='「'+kp.q+'」';
      Q.correct=kp.a;
      Q.choices=shuffle([kp.a].concat(kp.dis));
    }else{
      Q.stem='次の文の敬語は、どこがまちがっていますか？';
      Q.main='「'+kp.q+'」';
      Q.correct=REASONS[kp.reason];
      Q.choices=shuffle(Object.keys(REASONS).map(k=>REASONS[k]));
    }
  }
  return Q;
}

/* ================= セッション ================= */
let S=null;

function pickOrder(list,items){
  return list.slice().sort((a,b)=>{
    const ia=items[a.id]||newItem(), ib=items[b.id]||newItem();
    if(ib.totalWrong!==ia.totalWrong) return ib.totalWrong-ia.totalWrong;
    const ua=ia.lastSeenAt?1:0, ub=ib.lastSeenAt?1:0;
    if(ua!==ub) return ua-ub;
    if(ia.lastSeenAt&&ib.lastSeenAt) return ia.lastSeenAt<ib.lastSeenAt?-1:1;
    return 0;
  });
}
function otherFmt(f){ return f==='A'?'B':'A'; }
function firstFmt(it){ return it&&it.lastFormat?otherFmt(it.lastFormat):(Math.random()<0.5?'A':'B'); }

function startSession(mode){
  if(!accId()){ toast('先にアカウントを作ってください'); openAccounts(); return; }
  const src=itemsOf(accId());
  const clone=JSON.parse(JSON.stringify(src));
  DATA.forEach(kp=>{ if(!clone[kp.id]) clone[kp.id]=newItem(); });
  const range=rangeKPs();
  let pool=[],queue=[],shrunk=false,want=0;

  if(mode==='10問'||mode==='20問'){
    want=(mode==='10問')?10:20;
    pool=pickOrder(range.filter(kp=>!clone[kp.id].mastered),clone).slice(0,want);
    if(pool.length===0){ modalInfo('出題できません','選んだ範囲に、まだ習得していないことばがありません。範囲を広げるか、全問モード・再確認モードをお試しください。'); return; }
    if(pool.length<want) shrunk=true;
    const p1=[],p2=[];
    pool.forEach(kp=>{ const f=firstFmt(clone[kp.id]); p1.push({id:kp.id,fmt:f}); p2.push({id:kp.id,fmt:otherFmt(f)}); });
    queue=shuffle(p1).concat(shuffle(p2));
  }else if(mode==='全問'){
    pool=shuffle(range);
    if(pool.length===0){ modalInfo('出題できません','選んだ範囲にことばがありません。'); return; }
    queue=pool.map(kp=>({id:kp.id,fmt:firstFmt(clone[kp.id])}));
  }else{ /* 再確認 */
    pool=range.filter(kp=>{ const it=clone[kp.id]; return it.mastered&&it.postMasterWrong>0; });
    if(pool.length===0){ modalInfo('出題できません','要注意習得のことばはありません。よくできています！'); return; }
    pool=pickOrder(pool,clone);
    const p1=[],p2=[];
    pool.forEach(kp=>{ const f=firstFmt(clone[kp.id]); p1.push({id:kp.id,fmt:f}); p2.push({id:kp.id,fmt:otherFmt(f)}); });
    queue=shuffle(p1).concat(shuffle(p2));
  }

  const startMastered={};
  Object.keys(clone).forEach(k=>{ if(clone[k].mastered) startMastered[k]=true; });

  S={mode:mode,items:clone,queue:queue,pos:0,startedAt:nowISO(),startMastered:startMastered,
     kpIds:pool.map(k=>k.id),history:[],viewIdx:null,correct:0,wrong:0,asked:{},skipped:{},
     plannedKP:pool.length,curQ:null,answeredThis:null};

  if(shrunk) toast('範囲内の未習得は'+pool.length+'語です。その数で出題します。');
  show('scQuiz'); nextQuestion();
}

function totalPlannedQ(){ return S.queue.length; }

function nextQuestion(){
  S.viewIdx=null;
  if(S.pos>=S.queue.length){ finishSession(); return; }
  const e=S.queue[S.pos];
  S.asked[e.id]=(S.asked[e.id]||0)+1;
  S.curQ=buildQ(BY_ID[e.id],e.fmt);
  S.answeredThis=null;
  renderQuiz();
}

function applyAnswer(it,fmt,ok,chosen){
  const t=nowISO();
  if(S.mode==='再確認'){
    if(!ok) it.postMasterWrong++;
    return;
  }
  const prevFmt=it.lastFormat;
  it.lastSeenAt=t;
  if(ok){
    it.totalCorrect++; it.byFormat[fmt].correct++;
    if(!it.mastered){
      if(it.streak>0&&prevFmt===fmt){ /* 同じ形式の連続正解は進めない */ }
      else it.streak++;
      if(it.streak>=requiredStreak(it)){ it.mastered=true; it.masteredAt=t; }
    }
  }else{
    it.totalWrong++; it.byFormat[fmt].wrong++;
    it.wrongLog.unshift({at:t,format:fmt,answered:chosen});
    it.wrongLog=it.wrongLog.slice(0,5);
    it.streak=0;
    if(it.mastered) it.postMasterWrong++;
  }
  it.lastFormat=fmt;
}

function findPending(kpId){ for(let i=S.pos+1;i<S.queue.length;i++) if(S.queue[i].id===kpId) return i; return -1; }
function insertAt(entry,after){
  let t=S.pos+after;
  if(t>S.queue.length) t=S.queue.length;
  while(t<S.queue.length&&S.queue[t].id===entry.id) t++;
  S.queue.splice(t,0,entry);
}
function enqueue(kpId,prevFmt,after){
  const pend=findPending(kpId);
  /* 1セッション内の同一KPの再出題上限：4回 */
  if((S.asked[kpId]||0)>=4){ if(pend>=0) S.queue.splice(pend,1); S.skipped[kpId]=true; return; }
  if(pend>=0){
    /* すでに後ろに同じKPが控えているときは増やさず、誤答のときだけ手前へ繰り上げる */
    if(after<=3){ const e=S.queue.splice(pend,1)[0]; insertAt(e,after); }
    return;
  }
  insertAt({id:kpId,fmt:otherFmt(prevFmt)},after);
}

function doAnswer(chosen){
  if(S.answeredThis) return;
  const Q=S.curQ, kp=Q.kp, fmt=Q.fmt;
  const it=S.items[kp.id];
  const before=JSON.parse(JSON.stringify(it));
  const queueBefore=JSON.parse(JSON.stringify(S.queue));
  const ok=(chosen===Q.correct);
  applyAnswer(it,fmt,ok,chosen);
  if(ok) S.correct++; else S.wrong++;
  if(S.mode!=='全問'){
    if(!ok) enqueue(kp.id,fmt,3);
    else if(!it.mastered) enqueue(kp.id,fmt,6);
  }
  S.history.push({id:kp.id,fmt:fmt,chosen:chosen,ok:ok,Q:Q,before:before,queueBefore:queueBefore,pos:S.pos});
  S.answeredThis={ok:ok,chosen:chosen};
  renderQuiz();
}

function reAnswer(chosen){
  const h=S.history[S.history.length-1];
  if(!h) return;
  if(h.ok) S.correct--; else S.wrong--;
  S.items[h.id]=JSON.parse(JSON.stringify(h.before));
  S.queue=JSON.parse(JSON.stringify(h.queueBefore));
  S.pos=h.pos;
  S.history.pop();
  S.curQ=h.Q; S.answeredThis=null; S.viewIdx=null;
  doAnswer(chosen);
  S.pos=h.pos;
  renderQuiz();
}

function finishSession(){
  const id=accId();
  const p=progOf(id);
  const newly=[],wrongIds=[];
  Object.keys(S.items).forEach(k=>{ if(S.items[k].mastered&&!S.startMastered[k]) newly.push(k); });
  S.history.forEach(h=>{ if(!h.ok&&wrongIds.indexOf(h.id)<0) wrongIds.push(h.id); });
  p.items=S.items;
  let totalMastered=0; Object.keys(p.items).forEach(k=>{ if(p.items[k].mastered) totalMastered++; });
  p.sessions.unshift({startedAt:S.startedAt,finishedAt:nowISO(),mode:S.mode,
    correct:S.correct,wrong:S.wrong,newlyMastered:newly,wrongKpIds:wrongIds,totalMastered:totalMastered});
  p.sessions=p.sessions.slice(0,100);
  saveDB(false);
  S.newly=newly;
  renderResult();
  show('scResult');
  autoPush();
}

/* ================= 出題画面 ================= */
function remainKP(){ const s={}; for(let i=S.pos;i<S.queue.length;i++) s[S.queue[i].id]=1; return Object.keys(s).length; }
function renderQuiz(){
  const viewing=(S.viewIdx!==null);
  const rec=viewing?S.history[S.viewIdx]:null;
  const Q=viewing?rec.Q:S.curQ;
  const kp=Q.kp;
  const it=S.items[kp.id];

  $('#qCount').textContent=(S.pos+1)+'問目 / 全'+S.queue.length+'問';
  $('#qLeft').textContent='あと'+remainKP()+'語';
  $('#qScore').textContent='正解'+S.correct+'　誤答'+S.wrong;
  $('#qBar').style.width=Math.round(S.pos/S.queue.length*100)+'%';

  const need=requiredStreak(it);
  let g='';
  if(S.mode==='再確認'){ g='<span class="muted">再確認モード（記録は「要注意」の数だけ更新）</span>'; $('#qHard').textContent=''; }
  else if(it.mastered){ g='<span class="st-m">習得済み</span>'; $('#qHard').textContent=''; }
  else{
    g='<span class="gauge">'; for(let i=0;i<need;i++) g+='<i class="'+(i<it.streak?'f':'')+'"></i>'; g+='</span> <span class="muted">あと'+Math.max(0,need-it.streak)+'回で習得</span>';
    $('#qHard').textContent=need>2?'このことばは苦手なので'+need+'回必要です':'';
  }
  $('#qGauge').innerHTML=g;

  }else if(editable){

function dbHasRecords(d){
  if(!d||!d.progress) return false;
  return Object.keys(d.progress).some(id=>{
    const p=d.progress[id]||{};
    if(Array.isArray(p.sessions)&&p.sessions.length) return true;
    const its=p.items||{};
    return Object.keys(its).some(k=>((its[k].totalCorrect||0)+(its[k].totalWrong||0))>0);
  });
}
function statOf(d){
  let people=0,seen=0,mast=0;
  Object.keys(d.progress||{}).forEach(id=>{ people++;
    const its=(d.progress[id]||{}).items||{};
    Object.keys(its).forEach(k=>{ const i=its[k]; if((i.totalCorrect||0)+(i.totalWrong||0)>0) seen++; if(i.mastered) mast++; });
  });
  return people+'人・出題済み'+seen+'・習得'+mast;
}
function mergeItem(l,r){
  if(!l) return normalizeItem(r);
  if(!r) return normalizeItem(l);
  const a=normalizeItem(l), b=normalizeItem(r), o=newItem();
  o.totalCorrect=Math.max(a.totalCorrect,b.totalCorrect);
  o.totalWrong=Math.max(a.totalWrong,b.totalWrong);
  o.postMasterWrong=Math.max(a.postMasterWrong,b.postMasterWrong);
  ['A','B'].forEach(f=>{ o.byFormat[f]={correct:Math.max(a.byFormat[f].correct,b.byFormat[f].correct),
                                        wrong:Math.max(a.byFormat[f].wrong,b.byFormat[f].wrong)}; });
  o.mastered=a.mastered||b.mastered;
  if(a.masteredAt&&b.masteredAt) o.masteredAt=(a.masteredAt<b.masteredAt)?a.masteredAt:b.masteredAt;
  else o.masteredAt=a.masteredAt||b.masteredAt||null;
  const map={}; a.wrongLog.concat(b.wrongLog).forEach(w=>{ if(w&&w.at) map[w.at]=w; });
  o.wrongLog=Object.keys(map).sort().reverse().map(k=>map[k]).slice(0,5);
  const aNew=(a.lastSeenAt||'')>=(b.lastSeenAt||'');
  o.lastSeenAt=aNew?(a.lastSeenAt||b.lastSeenAt):(b.lastSeenAt||a.lastSeenAt);
  const newer=aNew?a:b;                 /* streak は最後に学習した端末の値 */
  o.streak=newer.streak; o.lastFormat=newer.lastFormat;
  if(o.mastered&&!o.masteredAt) o.masteredAt=o.lastSeenAt||nowISO();
  return o;
}
function mergeDB(local,remote){
  const out=emptyDB();
  out.updatedAt=local.updatedAt;
  const order=[],byName={};
  local.accounts.forEach(a=>{ if(!byName[a.name]){byName[a.name]={l:a,r:null};order.push(a.name);} });
  remote.accounts.forEach(a=>{ if(!byName[a.name]){byName[a.name]={l:null,r:a};order.push(a.name);} else byName[a.name].r=a; });
  order.forEach(name=>{
    const pair=byName[name];
    const id=pair.l?pair.l.id:pair.r.id;
    const created=(pair.l&&pair.l.createdAt)||(pair.r&&pair.r.createdAt)||nowISO();
    out.accounts.push({id:id,name:name,createdAt:created});
    const lp=pair.l?(local.progress[pair.l.id]||{items:{},sessions:[]}):{items:{},sessions:[]};
    const rp=pair.r?(remote.progress[pair.r.id]||{items:{},sessions:[]}):{items:{},sessions:[]};
    const items={},keys={};
    Object.keys(lp.items||{}).forEach(k=>keys[k]=1); Object.keys(rp.items||{}).forEach(k=>keys[k]=1);
    Object.keys(keys).forEach(k=>{ if(BY_ID[k]) items[k]=mergeItem((lp.items||{})[k],(rp.items||{})[k]); });
    const smap={};
    (lp.sessions||[]).concat(rp.sessions||[]).forEach(s=>{ if(s&&s.finishedAt) smap[s.finishedAt]=s; });
    const sessions=Object.keys(smap).sort().reverse().map(k=>smap[k]).slice(0,100);
    out.progress[id]={items:items,sessions:sessions};
  });
  const cur=local.accounts.find(a=>a.id===local.activeAccountId);
  const keep=cur?out.accounts.find(a=>a.name===cur.name):null;
  out.activeAccountId=keep?keep.id:(out.accounts[0]?out.accounts[0].id:null);
  return out;
}

  return JSON.stringify({a:d.accounts.map(x=>x.name).sort(),
    p:d.accounts.map(x=>({n:x.name,i:d.progress[x.id]?d.progress[x.id].items:{},s:(d.progress[x.id]||{sessions:[]}).sessions.length})).sort((m,n)=>m.n<n.n?-1:1)});
}

async function gasFetch(opt){
  const s=getSync(); if(!s||!s.url) throw {kind:'nocfg'};

  try{
    if(opt.method==='POST'){
      res=await fetch(s.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(opt.body)});
    }else{
      res=await fetch(s.url+(s.url.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(s.key)+'&app='+encodeURIComponent(APP));
    }
  }catch(e){ throw {kind:'net'}; }
  const t=await res.text();
  let j; try{ j=JSON.parse(t); }catch(e){ throw {kind:'parse'}; }
  return j;
}
function syncFail(e){
  if(!e||e.kind==='nocfg'){ setSyncMsg('☁ 同期は未設定です',''); return; }
  if(e.kind==='net'){ setSyncMsg('☁ オフライン（ローカルには保存済み）',''); return; }
  if(e.kind==='parse'){ setSyncMsg('☁⚠ '+gasErr(),'err'); return; }
  const m=String(e.error||e.message||'');
  if(/key|合言葉|unauthor/i.test(m)) setSyncMsg('☁⚠ 合言葉が違います','err');
  else setSyncMsg('☁⚠ 同期に失敗しました：'+m,'err');
}
function touchLastSync(){ const s=getSync(); if(s){ s.lastSync=nowISO(); setSync(s); } }

async function pushDB(silent){
  const s=getSync(); if(!s) return false;
  try{
    setSyncMsg('☁… 送信中','');
    const j=await gasFetch({method:'POST',body:{key:s.key,data:db}});
    if(!j||!j.ok) throw j||{};
    touchLastSync();
    if(!silent) setSyncMsg('☁✓ クラウドに保存しました（'+statOf(db)+'）','ok');
    else setSyncMsg('☁✓ 記録をクラウドに保存しました','ok');
    return true;
  }catch(e){ syncFail(e); return false; }
}
function autoPush(){ if(getSync()) pushDB(true); }

async function pullSync(quiet){
  const s=getSync(); if(!s){ if(!quiet) setSyncMsg('☁ 同期は未設定です',''); return; }
  try{
    setSyncMsg('☁… 同期中','');
    const j=await gasFetch({method:'GET'});
    if(!j||!j.ok) throw j||{};
    const cloud=j.data?normalizeDB(j.data):null;
    if(!cloud){                                   /* クラウドが空 → push */
      await pushDB(true); setSyncMsg('☁ クラウドに進捗が無かったので送りました','ok'); renderHome(); return;
    }
    const localHas=dbHasRecords(db), cloudHas=dbHasRecords(cloud);
    const before=sig(db);
    db=mergeDB(db,cloud);                         /* 両方に記録があっても無くても必ず合流 */
    const changedLocal=(sig(db)!==before);
    const changedCloud=(sig(db)!==sig(cloud));
    if(changedLocal) saveDB(false);
    else { db.updatedAt=cloud.updatedAt; saveDB(true); }   /* 変わらなければpull側のupdatedAtを維持 */
    touchLastSync();
    if(changedCloud) await pushDB(true);
    if(!localHas&&cloudHas) setSyncMsg('☁✓ クラウドの記録を取り込みました（'+statOf(db)+'）','ok');
    else if(localHas&&!cloudHas) setSyncMsg('☁ クラウドに進捗が無かったので送りました','ok');
    else if(changedLocal||changedCloud) setSyncMsg('☁✓ クラウドと合流しました（'+statOf(db)+'）','ok');
    else setSyncMsg('☁✓ クラウドと同じ内容です（'+statOf(db)+'）','ok');
    renderHome();
  }catch(e){ syncFail(e); }
}

async function pushList(){
  const s=getSync(); if(!s) return;
  setSyncMsg('☁… 一覧を書き出し中','');
  try{
    const j=await gasFetch({method:'GET'});
    if(j&&j.ok&&j.data){
      const cloud=normalizeDB(j.data);
      if(!dbHasRecords(db)&&dbHasRecords(cloud)){ db=cloud; saveDB(true); renderHome(); }
    }
  }catch(e){ syncFail(e); return; }
  if(!dbHasRecords(db)){
    modalInfo('書き出しを中止しました','記録がまだ1件もありません。空の一覧でスプレッドシートを上書きしてしまうため、書き出しを中止しました。<br>まず1回学習して結果画面まで進んでください。');
    setSyncMsg('☁ 記録が無いため一覧の書き出しを中止しました','');
    return;
  }
  try{
    const rows=rowsFor(db.accounts.map(a=>a.id)).map(r=>r.slice(0,14));
    const j=await gasFetch({method:'POST',body:{key:s.key,app:APP,list:{header:LIST_HEADER,rows:rows}}});
    if(!j||!j.ok) throw j||{};
    touchLastSync();
    setSyncMsg('☁✓ 全問一覧をスプレッドシートに書き出しました','ok');
    toast('全問一覧をスプレッドシートに書き出しました');
  }catch(e){ syncFail(e); }
}

/* ================= アカウント ================= */
function openAccounts(){
  let h='<h3>👤 アカウント</h3>';
  h+=db.accounts.map(a=>'<div class="li"><div class="g"><b>'+esc(a.name)+'</b>'+(a.id===accId()?' <span class="tag t-son">使用中</span>':'')+
      '<div class="muted">作成 '+fmtDate(a.createdAt)+'</div></div>'+
      '<button class="btn sm" data-use="'+a.id+'">切替</button>'+
      '<button class="btn sm ghost" data-ren="'+a.id+'">改名</button>'+
      '<button class="btn sm ghost" data-del="'+a.id+'">削除</button></div>').join('')||'<div class="muted">まだアカウントがありません。</div>';
  h+='<label class="f">新しいアカウント名</label><input type="text" id="newAcc" placeholder="例：長男">';
  h+='<div class="row" style="margin-top:12px"><button class="btn pri" id="addAcc">＋ 追加する</button><span style="margin-left:auto"><button class="btn" id="acCls">とじる</button></span></div>';
  openModal(h);
  $('#acCls').onclick=closeModal;
  $('#addAcc').onclick=()=>{
    const n=$('#newAcc').value.trim(); if(!n){ toast('名前を入力してください'); return; }
    if(db.accounts.some(a=>a.name===n)){ toast('同じ名前があります'); return; }
    const id=newAccId();
    db.accounts.push({id:id,name:n,createdAt:nowISO()});
    db.progress[id]={items:{},sessions:[]};
    if(!db.activeAccountId) db.activeAccountId=id;
    saveDB(false); autoPush(); closeModal(); renderHome(); toast('「'+n+'」を追加しました');
  };
  $$('#modalRoot [data-use]').forEach(b=>b.onclick=()=>{ db.activeAccountId=b.dataset.use; saveDB(false); closeModal(); renderHome(); toast(accName()+'に切り替えました'); });
  $$('#modalRoot [data-ren]').forEach(b=>b.onclick=()=>{
    const a=db.accounts.find(x=>x.id===b.dataset.ren);
    openModal('<h3>名前を変える</h3><label class="f">新しい名前</label><input type="text" id="rn" value="'+esc(a.name)+'">'+
      '<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="rc">やめる</button><button class="btn pri" id="rk">変更</button></div>');
    $('#rc').onclick=openAccounts;
    $('#rk').onclick=()=>{ const v=$('#rn').value.trim(); if(!v) return; a.name=v; saveDB(false); autoPush(); closeModal(); renderHome(); toast('名前を変更しました'); };
  });
  $$('#modalRoot [data-del]').forEach(b=>b.onclick=()=>{
    const a=db.accounts.find(x=>x.id===b.dataset.del);
    modalConfirm('アカウントの削除','「'+esc(a.name)+'」の記録をすべて削除します。もとに戻せません。よろしいですか？',()=>{
      db.accounts=db.accounts.filter(x=>x.id!==a.id); delete db.progress[a.id];
      if(db.activeAccountId===a.id) db.activeAccountId=db.accounts[0]?db.accounts[0].id:null;
      saveDB(false); autoPush(); renderHome(); toast('削除しました');
    },'削除する');
  });
}
function openSwitch(){
  if(!db.accounts.length){ openAccounts(); return; }
  openModal('<h3>だれが学習する？</h3>'+db.accounts.map(a=>
    '<button class="btn wide '+(a.id===accId()?'pri':'')+'" style="margin:6px 0" data-s="'+a.id+'">'+esc(a.name)+'</button>').join('')+
    '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="swMan">👤 アカウント管理</button><span style="margin-left:auto"><button class="btn" id="swCls">とじる</button></span></div>');
  $('#swCls').onclick=closeModal; $('#swMan').onclick=openAccounts;
  $$('#modalRoot [data-s]').forEach(b=>b.onclick=()=>{ db.activeAccountId=b.dataset.s; saveDB(false); closeModal(); renderHome(); });
}

/* ================= 書き出し／読み込み／設定 ================= */
function exportJSON(){
  const d=new Date(); const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=TITLE+'記録_'+ymd+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let o; try{ o=JSON.parse(rd.result); }catch(e){ modalInfo('読み込めません','JSONとして読めませんでした。'); return; }
      if(o.app&&o.app!==APP){ modalInfo('ツールが違います','このファイルは「'+esc(o.app)+'」のものです。このツール（'+APP+'）には読み込めません。'); return; }
      const nd=normalizeDB(o);
      modalConfirm('記録を置き換えますか？',
        '<div>ファイルのアカウント：<b>'+esc(nd.accounts.map(a=>a.name).join('、')||'（なし）')+'</b></div>'+
        '<div>保存日時：<b>'+fmtDT(o.updatedAt)+'</b></div>'+
        '<div class="warnbar">いまの記録はすべて置き換えられます。</div>',
        ()=>{ db=nd; saveDB(false); autoPush(); renderHome(); toast('記録を読み込みました'); },'置き換える');
    };
    rd.readAsText(f);
  };
  inp.click();
}
function openSyncCfg(){
  const s=getSync()||{url:'',key:''};
  openModal('<h3>☁ クラウド同期設定</h3>'+
    '<div class="muted">GASのウェブアプリURL（末尾が <code>/exec</code>）と合言葉を入力します。この設定はこの端末にだけ保存され、ほかの端末には同期されません。</div>'+
    '<label class="f">GASのURL</label><input type="text" id="sUrl" value="'+esc(s.url)+'" placeholder="https://script.google.com/macros/s/.../exec">'+
    '<label class="f">合言葉</label><input type="text" id="sKey" value="'+esc(s.key)+'" placeholder="合言葉">'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="sOff">同期を解除</button>'+
    '<span style="margin-left:auto"><button class="btn" id="sCls">とじる</button> <button class="btn pri" id="sSave">保存して同期</button></span></div>');
  $('#sCls').onclick=closeModal;
  $('#sOff').onclick=()=>{ setSync(null); closeModal(); setSyncMsg('☁ 同期は未設定です',''); renderHome(); };
  $('#sSave').onclick=()=>{
    const u=$('#sUrl').value.trim(), k=$('#sKey').value.trim();
    if(!/\/exec$/.test(u)){ toast('URLの末尾は /exec にしてください'); return; }
    setSync({url:u,key:k,lastSync:null}); closeModal(); renderHome(); pullSync();
  };
}
function resetRecords(){
  if(!accId()) return;
  modalConfirm('記録を消す','「'+esc(accName())+'」の学習記録をすべて消します。もとに戻せません。',()=>{
    db.progress[accId()]={items:{},sessions:[]};
    saveDB(false); autoPush(); renderHome(); toast('記録を消しました');
  },'消す');
}

/* ================= 起動 ================= */
function wire(){
  $('#btnSwitch').onclick=openSwitch;
  $$('#scHome [data-mode]').forEach(b=>b.onclick=()=>startSession(b.dataset.mode));
  $('#btnMemo').onclick=openMemo;
  $$('#impSeg button').forEach(b=>b.onclick=()=>{ UI.impFilter=b.dataset.v; saveUI(); renderHome(); });
  $('#btnExport').onclick=exportJSON;
  $('#btnImport').onclick=importJSON;
  $('#btnSyncCfg').onclick=openSyncCfg;
  $('#btnSyncNow').onclick=()=>pullSync();
  $('#btnPushList').onclick=pushList;
  $('#btnAccounts').onclick=openAccounts;
  $('#btnReset').onclick=resetRecords;

  $('#btnNext').onclick=()=>{ S.pos++; nextQuestion(); };
  $('#btnPrev').onclick=()=>{
    if(S.viewIdx===null){ S.viewIdx=S.answeredThis?S.history.length-2:S.history.length-1; }
    else S.viewIdx--;
    if(S.viewIdx<0){ S.viewIdx=0; }
    renderQuiz();
  };
  $('#btnFwd').onclick=()=>{ S.viewIdx++; if(S.viewIdx>S.history.length-1) S.viewIdx=null; renderQuiz(); };
  $('#btnQuit').onclick=()=>modalConfirm('学習を中断しますか？','いま解いたぶんは<b>記録されません</b>。結果画面まで進むと記録されます。',()=>{ S=null; show('scHome'); },'中断する');

  $('#btnHome').onclick=()=>{ S=null; show('scHome'); };
  $('#btnCsv').onclick=downloadCSV;
  $('#mBack').onclick=()=>show('scHome');
  $('#mTabList').onclick=()=>{MEMO.tab='list';renderMemoTab();};
  $('#mTabCard').onclick=()=>{MEMO.tab='card';renderMemoTab();};
  window.addEventListener('beforeunload',e=>{ if(S&&S.history.length){ e.preventDefault(); e.returnValue=''; } });
}
function boot(){
  if(!LS_OK){
    $('#lsWarn').classList.remove('hide');
    $('#lsWarn').innerHTML=getSync()
      ? '☁ この端末には記録を残せない環境ですが、クラウド同期が有効なので記録はGoogleに保存されます。'
      : '⚠ この端末には記録を保存できません（ブラウザの設定）。クラウド同期を設定すると記録を残せます。';
  }
  if(!db.accounts.length){
    const id=newAccId();
    db.accounts.push({id:id,name:'ゲスト',createdAt:nowISO()});
    db.progress[id]={items:{},sessions:[]};
    db.activeAccountId=id; saveDB(false);
  }
  wire(); show('scHome');
  if(getSync()) pullSync(true);
}
boot();
</script>
