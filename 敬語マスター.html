<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>敬語マスター｜中学受験 国語</title>
<style>
:root{
  --bg:#f5f7fa; --card:#fff; --ink:#1f2a37; --sub:#64748b; --line:#e2e8f0;
  --pri:#2563eb; --pri-d:#1d4ed8; --ok:#059669; --ng:#dc2626; --warn:#d97706;
  --son:#7c3aed; --ken:#0891b2; --tei:#65a30d; --bik:#db2777; --err:#e11d48;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.7; padding-bottom:40px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}
header.top{
  background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff;
  padding:14px 12px; position:sticky; top:0; z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
header.top .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em}
header.top .who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.muted{color:var(--sub);font-size:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;min-height:44px;
}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ghost{background:#f8fafc}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px;border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)
}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.seg button.on{background:var(--pri);color:#fff}
.bar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;color:#fff}
.t-son{background:var(--son)} .t-ken{background:var(--ken)} .t-tei{background:var(--tei)}
.t-bik{background:var(--bik)} .t-err{background:var(--err)}
.imp2{color:#b45309;font-weight:800}
.imp1{color:#0369a1;font-weight:800}
.q-stem{font-size:15px;color:var(--sub);font-weight:700;margin-bottom:6px}
.q-main{font-size:24px;font-weight:800;line-height:1.5;margin:6px 0 14px;word-break:break-word}
.choice{
  display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;
  border-radius:12px;padding:14px;margin:8px 0;font-size:17px;font-weight:700;
  cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.5;
}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--ok);background:#ecfdf5}
.choice.ng{border-color:var(--ng);background:#fef2f2}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-size:15px}
.fb.ok{background:#ecfdf5;border:1px solid #a7f3d0}
.fb.ng{background:#fef2f2;border:1px solid #fecaca}
.fb b{font-size:16px}
.gauge{display:inline-flex;gap:4px;align-items:center}
.gauge i{width:12px;height:12px;border-radius:50%;background:#d1d5db;display:block}
.gauge i.f{background:var(--ok)}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub);font-weight:700}
table.lst{width:100%;border-collapse:collapse;font-size:13px}
table.lst th,table.lst td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
table.lst th{color:var(--sub);font-size:12px;white-space:nowrap}
.st-m{color:var(--ok);font-weight:800}
.st-w{color:var(--warn);font-weight:800}
.st-x{color:var(--ng);font-weight:800}
.st-n{color:var(--sub)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 10px;font-size:17px}
input[type=text],input[type=password],select,textarea{
  width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)
}
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 4px}
.status{border-radius:10px;padding:10px;font-size:13px;font-weight:700;margin-bottom:10px;background:#f1f5f9;color:var(--sub)}
.status.ok{background:#ecfdf5;color:#047857}
.status.err{background:#fef2f2;color:#b91c1c}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:200;max-width:92vw}
.flip{
  border:2px solid var(--line);border-radius:16px;min-height:210px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;
  cursor:pointer;background:#fff;
}
.flip .big{font-size:28px;font-weight:800;line-height:1.4}
.hide{display:none!important}
.li{border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0}
.warnbar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:10px;font-size:13px;margin:10px 0}
.badge{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;cursor:pointer}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff}
summary{cursor:pointer;font-weight:700;font-size:14px}
@media(max-width:420px){ .q-main{font-size:21px} .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <h1>敬語マスター</h1>
    <div class="who">
      <button class="btn sm ghost" id="accBtn">👤 —</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="lsWarn" class="warnbar hide"></div>

  <!-- ============ GATE ============ -->
  <div id="scGate" class="hide"><div class="card" id="gateCard"></div></div>

  <!-- ============ HOME ============ -->
  <div id="scHome">
    <div class="card">
      <h2>📚 出題範囲</h2>
      <div class="muted" style="margin-bottom:6px">重要度</div>
      <div class="seg" id="impSeg">
        <button data-v="all">すべて</button>
        <button data-v="21">◎○のみ</button>
        <button data-v="2">◎のみ</button>
      </div>
      <div class="muted" style="margin:12px 0 6px">カテゴリー</div>
      <div class="row" id="catChips"></div>
      <div class="muted" id="rangeInfo" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>▶ 学習をはじめる</h2>
      <div class="grid2">
        <button class="btn pri" data-mode="10問">10問モード<br><span style="font-size:11px;font-weight:600">（10語＝20問）</span></button>
        <button class="btn pri" data-mode="20問">20問モード<br><span style="font-size:11px;font-weight:600">（20語＝40問）</span></button>
        <button class="btn" data-mode="全問">全問モード<br><span style="font-size:11px;font-weight:600">（範囲内すべて1問ずつ）</span></button>
        <button class="btn" data-mode="再確認">再確認モード<br><span style="font-size:11px;font-weight:600">（要注意習得のみ）</span></button>
      </div>
      <div style="margin-top:8px"><button class="btn wide ghost" id="btnMemo">📖 覚えるモード（記録に残りません）</button></div>
      <div style="margin-top:10px" id="alertBadge"></div>
    </div>

    <div class="card">
      <h2>📊 習得状況<span class="muted" style="font-weight:600">（範囲に関係なく全体で集計）</span></h2>
      <div id="masteryBox"></div>
    </div>

    <div class="card">
      <h2>⚠ 間違いランキング</h2>
      <div id="rankBox"></div>
    </div>

    <div class="card">
      <h2>💾 記録データの管理</h2>
      <div id="syncStatus" class="status">☁ 同期は未設定です</div>
      <div class="row">
        <button class="btn sm" id="btnSyncNow">🔄 今すぐ同期</button>
        <button class="btn sm" id="btnPushList">📋 全問一覧をDriveへ</button>
        <button class="btn sm" id="btnCsv2">📄 CSVをダウンロード</button>
        <button class="btn sm" id="btnExport">📤 記録を書き出す</button>
        <button class="btn sm" id="btnImport">📥 記録を読み込む</button>
        <button class="btn sm ghost" id="btnReset">🗑 このツールの記録を消す</button>
      </div>
      <a class="btn ghost wide" id="btnPortal" href="./index.html" style="display:block;text-decoration:none;margin-top:10px">⚙ 同期設定・ログアウトはポータルへ</a>
      <div class="muted" id="footInfo" style="margin-top:10px;font-size:12px"></div>
    </div>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="scQuiz" class="hide">
    <div class="card">
      <div class="hud">
        <span id="qCount"></span><span id="qLeft"></span><span id="qScore"></span>
        <span style="margin-left:auto"><button class="btn sm ghost" id="btnQuit">中断</button></span>
      </div>
      <div class="bar" style="margin:8px 0"><i id="qBar" style="width:0%"></i></div>
      <div class="hud"><span id="qGauge"></span><span id="qHard" class="muted"></span></div>
    </div>
    <div class="card">
      <div id="qStem" class="q-stem"></div>
      <div id="qMain" class="q-main"></div>
      <div id="qChoices"></div>
      <div id="qFb"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn sm ghost" id="btnPrev">← 前の問題へ</button>
        <button class="btn sm ghost hide" id="btnFwd">進む →</button>
        <span style="margin-left:auto"><button class="btn pri hide" id="btnNext">次へ →</button></span>
      </div>
    </div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="scResult" class="hide">
    <div class="card" id="resSummary"></div>
    <div class="card" id="resWrong"></div>
    <div class="card" id="resAll"></div>
    <div class="row">
      <button class="btn pri" id="btnHome">🏠 ホームへ</button>
      <button class="btn" id="btnCsv">⬇ CSVダウンロード</button>
    </div>
  </div>

  <!-- ============ MEMORIZE ============ -->
  <div id="scMemo" class="hide">
    <div class="card">
      <h2>📖 覚えるモード</h2>
      <div class="muted">このモードの操作は記録・習得判定・同期に<b>いっさい影響しません</b>。</div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="mTabList">📋 一覧学習</button>
        <button class="btn sm" id="mTabCard">🃏 単語カード</button>
        <span style="margin-left:auto"><button class="btn sm ghost" id="mBack">🏠 ホーム</button></span>
      </div>
    </div>
    <div id="mList" class="card"></div>
    <div id="mCard" class="card hide"></div>
  </div>
</div>

<div id="modalRoot"></div>
<script>
/* ================= 基本設定 ================= */
const APP   = 'kj-quiz-kokugo-keigo';
const TITLE = '敬語';
const SCHEMA_VERSION = 2;
const VER   = 'v3.0';

/* 出題形式の定義（このツール）
   A ＝ 種類の判定 … 「召し上がる」は尊敬語・謙譲語・丁寧語・美化語のどれ？
                      （まちがい直しの語群では「この文はどこがまちがっている？」）
   B ＝ 敬語への変換 … 「食べる」の尊敬語は？
                      （まちがい直しの語群では「正しく直すと？」）        */

  R1:'自分の動作に尊敬語を使っている',
  R2:'相手（目上）の動作に謙譲語を使っている',

  R6:'目上の人の動作なのに敬語を使っていない'
};

/* ================= 知識ポイント =================
   kind: conv=言いかえ（A=種類判定／B=変換） / err=まちがい直し（A=理由／B=正しい形）
   imp : 2=◎最重要 1=○重要 0=標準 */

const BY_ID = {}; DATA.forEach(d=>BY_ID[d.id]=d);

/* ================= ストレージ ================= */
const MEM={};
const LS_OK=(function(){try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__');return true;}catch(e){return false;}})();
function lsGet(k){ if(!LS_OK) return (k in MEM)?MEM[k]:null; try{return localStorage.getItem(k);}catch(e){return (k in MEM)?MEM[k]:null;} }
function lsSet(k,v){ if(!LS_OK){MEM[k]=v;return;} try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;} }
function lsDel(k){ if(!LS_OK){delete MEM[k];return;} try{localStorage.removeItem(k);}catch(e){delete MEM[k];} }

/* 共通キー（全ツールで共有する。ツール名を付けてはいけない） */
const K_DB=APP, K_UI=APP+':ui', K_SYNC='kj-quiz:sync', K_AUTH='kj-quiz:auth';
const LEGACY_SYNC_KEY=APP.concat(':sync');       /* v2.1 の端末別同期設定からの引き継ぎ用 */
let SYNC=null, AUTH=null, FRESH=false;           /* FRESH=この端末にこのIDの記録がまだ無い */

function jparse(s){ try{ return JSON.parse(s||'null'); }catch(e){ return null; } }

/* ================= DB ================= */
function nowISO(){ return new Date().toISOString(); }
function emptyDB(){ return {app:APP,version:SCHEMA_VERSION,updatedAt:nowISO(),activeAccountId:null,accounts:[],progress:{}}; }
function newItem(){ return {streak:0,mastered:false,masteredAt:null,postMasterWrong:0,lastFormat:null,
  totalCorrect:0,totalWrong:0,byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}},wrongLog:[],lastSeenAt:null}; }

function normalizeItem(it){
  const n=newItem();
  if(!it||typeof it!=='object') return n;
  n.streak=+it.streak||0;
  n.mastered=!!it.mastered;
  n.masteredAt=it.masteredAt||null;
  n.postMasterWrong=+it.postMasterWrong||0;      /* v1系からの移行で0を補う */
  n.lastFormat=(it.lastFormat==='A'||it.lastFormat==='B')?it.lastFormat:null;
  n.totalCorrect=+it.totalCorrect||0;
  n.totalWrong=+it.totalWrong||0;
  if(it.byFormat){ ['A','B'].forEach(f=>{ const s=it.byFormat[f]||{}; n.byFormat[f]={correct:+s.correct||0,wrong:+s.wrong||0}; }); }
  if(Array.isArray(it.wrongLog)) n.wrongLog=it.wrongLog.filter(x=>x&&x.at).slice(0,5);
  n.lastSeenAt=it.lastSeenAt||null;
  if(n.mastered&&!n.masteredAt) n.masteredAt=n.lastSeenAt||nowISO();
  return n;
}
function normProgress(p){
  const out={items:{},sessions:[]};
  if(!p||typeof p!=='object') return out;
  const src=p.items&&typeof p.items==='object'?p.items:{};
  Object.keys(src).forEach(k=>{ if(BY_ID[k]) out.items[k]=normalizeItem(src[k]); });
  out.sessions=Array.isArray(p.sessions)?p.sessions.filter(s=>s&&s.finishedAt).slice(0,100):[];
  return out;
}
function hasRecords(p){
  if(!p) return false;
  if((p.sessions||[]).length) return true;
  const its=p.items||{};
  return Object.keys(its).some(k=>((its[k].totalCorrect||0)+(its[k].totalWrong||0))>0);
}

/* 端末に持つのは常に「ログイン中のID 1件だけ」。他のIDは読み捨てる */
function buildDB(raw){
  const d=emptyDB();
  if(!AUTH) return d;
  d.activeAccountId=AUTH.id;
  const a={id:AUTH.id,name:AUTH.id,label:AUTH.label||AUTH.id,createdAt:nowISO()};
  const src=raw&&Array.isArray(raw.accounts)?raw.accounts.filter(x=>x&&String(x.id)===AUTH.id)[0]:null;
  if(src&&src.createdAt) a.createdAt=src.createdAt;
  d.accounts=[a];
  d.progress[AUTH.id]=normProgress(raw&&raw.progress?raw.progress[AUTH.id]:null);
  d.updatedAt=(raw&&raw.updatedAt)||nowISO();
  return d;
}

let db=emptyDB();

function loadAll(){
  /* 同期設定：共通キー。無ければ v2.1 の端末別キーから引き継ぐ */
  SYNC=jparse(lsGet(K_SYNC));
  if(!SYNC||!SYNC.url){
    const old=jparse(lsGet(LEGACY_SYNC_KEY));
    if(old&&old.url){ SYNC={url:old.url,key:old.key||'',lastSync:old.lastSync||null}; lsSet(K_SYNC,JSON.stringify(SYNC)); }
  }
  if(!SYNC||typeof SYNC!=='object') SYNC={url:'',key:'',lastSync:null};

  AUTH=jparse(lsGet(K_AUTH));
  if(!AUTH||!AUTH.id||!AUTH.pw) AUTH=null;
  else AUTH.id=String(AUTH.id);

  db=buildDB(jparse(lsGet(K_DB)));
  FRESH=!!AUTH&&!hasRecords(db.progress[AUTH.id]);   /* 初めて使う端末か */
}

function saveDB(fromCloud){
  if(!AUTH) return;
  db.app=APP; db.version=SCHEMA_VERSION;
  if(!fromCloud) db.updatedAt=nowISO();     /* クラウド取り込み時は上書きしない */
  lsSet(K_DB,JSON.stringify(db));
}
function saveSync(){ lsSet(K_SYNC,JSON.stringify(SYNC)); }
function ready(){ return !!(SYNC&&SYNC.url&&SYNC.key); }
function loggedIn(){ return !!AUTH; }
function portalURL(){ return './index.html'; }

function acc(){ return db.accounts[0]||null; }
function accId(){ return AUTH?AUTH.id:null; }
function accName(){ return AUTH?(AUTH.label||AUTH.id):'—'; }
function prog(){
  if(!AUTH) return null;
  if(!db.progress[AUTH.id]) db.progress[AUTH.id]={items:{},sessions:[]};
  const p=db.progress[AUTH.id]; if(!p.items)p.items={}; if(!p.sessions)p.sessions=[]; return p;
}
function progOf(id){ if(!db.progress[id]) db.progress[id]={items:{},sessions:[]}; return db.progress[id]; }
function itemOf(id,kpId,store){ const p=store||progOf(id).items; if(!p[kpId]) p[kpId]=newItem(); return p[kpId]; }
function itemsOf(id){ return id?progOf(id).items:{}; }
function getIt(kpId){ return itemsOf(accId())[kpId]||newItem(); }

/* ================= 範囲 ================= */
function impOK(kp){
  if(UI.impFilter==='all') return true;
  if(UI.impFilter==='21') return kp.imp>=1;
  return kp.imp>=2;
}
function rangeKPs(){
  return DATA.filter(kp=>impOK(kp)&&(UI.category==='all'||kp.cat===UI.category));
}
function countCat(cat){ return DATA.filter(kp=>impOK(kp)&&(cat==='all'||kp.cat===cat)).length; }

/* ================= 習得判定 ================= */
function requiredStreak(it){
  const w=(it&&it.totalWrong)||0;
  if(w>=6) return 4;
  if(w>=3) return 3;
  return 2;
}
function stateOf(it){
  if(!it) return '未出題';
  if(it.mastered) return it.postMasterWrong>0?'要注意習得':'習得済み';
  if(it.totalCorrect+it.totalWrong===0) return '未出題';
  if(it.totalCorrect>0) return it.totalCorrect+'回正解';
  return '誤答';
}
function alertKPs(){
  const its=itemsOf(accId());
  return DATA.filter(kp=>{ const it=its[kp.id]; return it&&it.mastered&&it.postMasterWrong>0; });
}

function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i];r[i]=r[j];r[j]=t; } return r; }
function uniqPush(arr,v){ if(v&&arr.indexOf(v)<0) arr.push(v); }

function buildQ(kp,fmt){
  const Q={kp:kp,fmt:fmt,stem:'',main:'',choices:[],correct:'',note:''};
  if(kp.kind==='conv'){
    if(fmt==='A'){                      /* A＝種類の判定 */
      Q.stem='次の敬語は、どの種類ですか？';
      Q.main='「'+kp.a+'」';
      Q.correct=kp.sym;
      Q.choices=shuffle(TYPES.slice());
    }else{                              /* B＝敬語への変換 */
      Q.stem='次のことばを'+kp.sym+'にすると？';
      Q.main='「'+kp.q+'」';
      Q.correct=kp.a;
      const cs=[kp.a];
      const same=shuffle(DATA.filter(x=>x.kind==='conv'&&x.sym===kp.sym&&x.q!==kp.q&&x.a!==kp.a));
      for(let i=0;i<same.length&&cs.length<4;i++) uniqPush(cs,same[i].a);
      const extra=shuffle(DATA.filter(x=>x.kind==='conv'&&x.q!==kp.q&&x.a!==kp.a));
      for(let i=0;i<extra.length&&cs.length<4;i++) uniqPush(cs,extra[i].a);
      Q.choices=shuffle(cs);
    }
    Q.note=kp.sym;
  }else{                                /* err */
    if(fmt==='A'){                      /* A＝まちがいの指摘 */
      Q.stem='次の文の敬語は、どこがまちがっていますか？';
      Q.main='「'+kp.q+'」';
      Q.correct=REASONS[kp.reason];
      const others=shuffle(Object.keys(REASONS).filter(k=>k!==kp.reason)).slice(0,3).map(k=>REASONS[k]);
      Q.choices=shuffle([Q.correct].concat(others));
    }else{                              /* B＝正しい言い方に直す */
      Q.stem='次の文の敬語の使い方を、正しく直すと？';
      Q.main='「'+kp.q+'」';
      Q.correct=kp.a;
      Q.choices=shuffle([kp.a].concat(kp.dis));
    }
  }
  return Q;
}

/* ================= セッション ================= */
let S=null;

function pickOrder(list,items){
  return list.slice().sort((a,b)=>{
    const ia=items[a.id]||newItem(), ib=items[b.id]||newItem();
    if(ib.totalWrong!==ia.totalWrong) return ib.totalWrong-ia.totalWrong;
    const ua=ia.lastSeenAt?1:0, ub=ib.lastSeenAt?1:0;
    if(ua!==ub) return ua-ub;
    if(ia.lastSeenAt&&ib.lastSeenAt) return ia.lastSeenAt<ib.lastSeenAt?-1:1;
    return 0;
  });
}
function otherFmt(f){ return f==='A'?'B':'A'; }
function firstFmt(it){ return it&&it.lastFormat?otherFmt(it.lastFormat):(Math.random()<0.5?'A':'B'); }

function startSession(mode){
  if(!loggedIn()){ render(); return; }
  const src=itemsOf(accId());
  const clone=JSON.parse(JSON.stringify(src));
  DATA.forEach(kp=>{ if(!clone[kp.id]) clone[kp.id]=newItem(); });
  const range=rangeKPs();
  let pool=[],queue=[],shrunk=false,want=0;

  if(mode==='10問'||mode==='20問'){
    want=(mode==='10問')?10:20;
    pool=pickOrder(range.filter(kp=>!clone[kp.id].mastered),clone).slice(0,want);
    if(pool.length===0){ modalInfo('出題できません','選んだ範囲に、まだ習得していないことばがありません。範囲を広げるか、全問モード・再確認モードをお試しください。'); return; }
    if(pool.length<want) shrunk=true;
    const p1=[],p2=[];
    pool.forEach(kp=>{ const f=firstFmt(clone[kp.id]); p1.push({id:kp.id,fmt:f}); p2.push({id:kp.id,fmt:otherFmt(f)}); });
    queue=shuffle(p1).concat(shuffle(p2));
  }else if(mode==='全問'){
    pool=shuffle(range);
    if(pool.length===0){ modalInfo('出題できません','選んだ範囲にことばがありません。'); return; }
    queue=pool.map(kp=>({id:kp.id,fmt:firstFmt(clone[kp.id])}));
  }else{ /* 再確認 */
    pool=range.filter(kp=>{ const it=clone[kp.id]; return it.mastered&&it.postMasterWrong>0; });
    if(pool.length===0){ modalInfo('出題できません','要注意習得のことばはありません。よくできています！'); return; }
    pool=pickOrder(pool,clone);
    const p1=[],p2=[];
    pool.forEach(kp=>{ const f=firstFmt(clone[kp.id]); p1.push({id:kp.id,fmt:f}); p2.push({id:kp.id,fmt:otherFmt(f)}); });
    queue=shuffle(p1).concat(shuffle(p2));
  }

  const startMastered={};
  Object.keys(clone).forEach(k=>{ if(clone[k].mastered) startMastered[k]=true; });

  S={mode:mode,items:clone,queue:queue,pos:0,startedAt:nowISO(),startMastered:startMastered,
     kpIds:pool.map(k=>k.id),history:[],viewIdx:null,correct:0,wrong:0,asked:{},skipped:{},
     plannedKP:pool.length,curQ:null,answeredThis:null};

  if(shrunk) toast('範囲内の未習得は'+pool.length+'語です。その数で出題します。');
  show('scQuiz'); nextQuestion();
}

function totalPlannedQ(){ return S.queue.length; }

function nextQuestion(){
  S.viewIdx=null;
  if(S.pos>=S.queue.length){ finishSession(); return; }
  const e=S.queue[S.pos];
  S.asked[e.id]=(S.asked[e.id]||0)+1;
  S.curQ=buildQ(BY_ID[e.id],e.fmt);
  S.answeredThis=null;
  renderQuiz();
}

function applyAnswer(it,fmt,ok,chosen){
  const t=nowISO();
  if(S.mode==='再確認'){
    if(!ok) it.postMasterWrong++;
    return;
  }
  const prevFmt=it.lastFormat;
  it.lastSeenAt=t;
  if(ok){
    it.totalCorrect++; it.byFormat[fmt].correct++;
    if(!it.mastered){
      if(it.streak>0&&prevFmt===fmt){ /* 同じ形式の連続正解は進めない */ }
      else it.streak++;
      if(it.streak>=requiredStreak(it)){ it.mastered=true; it.masteredAt=t; }
    }
  }else{
    it.totalWrong++; it.byFormat[fmt].wrong++;
    it.wrongLog.unshift({at:t,format:fmt,answered:chosen});
    it.wrongLog=it.wrongLog.slice(0,5);
    it.streak=0;
    if(it.mastered) it.postMasterWrong++;
  }
  it.lastFormat=fmt;
}

function findPending(kpId){ for(let i=S.pos+1;i<S.queue.length;i++) if(S.queue[i].id===kpId) return i; return -1; }
function insertAt(entry,after){
  let t=S.pos+after;
  if(t>S.queue.length) t=S.queue.length;
  while(t<S.queue.length&&S.queue[t].id===entry.id) t++;
  S.queue.splice(t,0,entry);
}
function enqueue(kpId,prevFmt,after){
  const pend=findPending(kpId);
  /* 1セッション内の同一KPの再出題上限：4回 */
  if((S.asked[kpId]||0)>=4){ if(pend>=0) S.queue.splice(pend,1); S.skipped[kpId]=true; return; }
  if(pend>=0){
    /* すでに後ろに同じKPが控えているときは増やさず、誤答のときだけ手前へ繰り上げる */
    if(after<=3){ const e=S.queue.splice(pend,1)[0]; insertAt(e,after); }
    return;
  }
  insertAt({id:kpId,fmt:otherFmt(prevFmt)},after);
}

function doAnswer(chosen){
  if(S.answeredThis) return;
  const Q=S.curQ, kp=Q.kp, fmt=Q.fmt;
  const it=S.items[kp.id];
  const before=JSON.parse(JSON.stringify(it));
  const queueBefore=JSON.parse(JSON.stringify(S.queue));
  const ok=(chosen===Q.correct);
  applyAnswer(it,fmt,ok,chosen);
  if(ok) S.correct++; else S.wrong++;
  if(S.mode!=='全問'){
    if(!ok) enqueue(kp.id,fmt,3);
    else if(!it.mastered) enqueue(kp.id,fmt,6);
  }
  S.history.push({id:kp.id,fmt:fmt,chosen:chosen,ok:ok,Q:Q,before:before,queueBefore:queueBefore,pos:S.pos});
  S.answeredThis={ok:ok,chosen:chosen};
  renderQuiz();
}

function reAnswer(chosen){
  const h=S.history[S.history.length-1];
  if(!h) return;
  if(h.ok) S.correct--; else S.wrong--;
  S.items[h.id]=JSON.parse(JSON.stringify(h.before));
  S.queue=JSON.parse(JSON.stringify(h.queueBefore));
  S.pos=h.pos;
  S.history.pop();
  S.curQ=h.Q; S.answeredThis=null; S.viewIdx=null;
  doAnswer(chosen);
  S.pos=h.pos;
  renderQuiz();
}

function finishSession(){
  const id=accId();
  const p=progOf(id);
  const newly=[],wrongIds=[];
  Object.keys(S.items).forEach(k=>{ if(S.items[k].mastered&&!S.startMastered[k]) newly.push(k); });
  S.history.forEach(h=>{ if(!h.ok&&wrongIds.indexOf(h.id)<0) wrongIds.push(h.id); });
  p.items=S.items;
  let totalMastered=0; Object.keys(p.items).forEach(k=>{ if(p.items[k].mastered) totalMastered++; });
  p.sessions.unshift({startedAt:S.startedAt,finishedAt:nowISO(),mode:S.mode,
    correct:S.correct,wrong:S.wrong,newlyMastered:newly,wrongKpIds:wrongIds,totalMastered:totalMastered});
  p.sessions=p.sessions.slice(0,100);
  saveDB(false);
  S.newly=newly;
  renderResult();
  show('scResult');
  autoPush();
}

function renderQuiz(){

function dbHasRecords(d){
  const p=d&&d.progress?d.progress[AUTH?AUTH.id:'']:null;
  return hasRecords(p);

function statOf(p){
  const its=(p||{}).items||{};
  let seen=0,mast=0;
  Object.keys(its).forEach(k=>{ const i=its[k]; if((i.totalCorrect||0)+(i.totalWrong||0)>0) seen++; if(i.mastered) mast++; });
  return '出題済み'+seen+'語・習得'+mast+'語';
}

/* ---- 合流 ---- */
function mergeItem(l,r){
  if(!l) return normalizeItem(r);
  if(!r) return normalizeItem(l);
  const a=normalizeItem(l), b=normalizeItem(r), o=newItem();
  o.totalCorrect=Math.max(a.totalCorrect,b.totalCorrect);
  o.totalWrong=Math.max(a.totalWrong,b.totalWrong);
  o.postMasterWrong=Math.max(a.postMasterWrong,b.postMasterWrong);
  ['A','B'].forEach(f=>{ o.byFormat[f]={correct:Math.max(a.byFormat[f].correct,b.byFormat[f].correct),
                                        wrong:Math.max(a.byFormat[f].wrong,b.byFormat[f].wrong)}; });
  o.mastered=a.mastered||b.mastered;
  if(a.masteredAt&&b.masteredAt) o.masteredAt=(a.masteredAt<b.masteredAt)?a.masteredAt:b.masteredAt;
  else o.masteredAt=a.masteredAt||b.masteredAt||null;
  const map={}; a.wrongLog.concat(b.wrongLog).forEach(w=>{ if(w&&w.at) map[w.at+'|'+(w.format||'')]=w; });
  o.wrongLog=Object.keys(map).sort().reverse().map(k=>map[k]).slice(0,5);
  const aNew=(a.lastSeenAt||'')>=(b.lastSeenAt||'');
  o.lastSeenAt=aNew?(a.lastSeenAt||b.lastSeenAt):(b.lastSeenAt||a.lastSeenAt);
  const newer=aNew?a:b;                 /* streak は最後に学習した端末の値 */
  o.streak=newer.streak; o.lastFormat=newer.lastFormat;
  if(o.mastered&&!o.masteredAt) o.masteredAt=o.lastSeenAt||nowISO();
  return o;
}
function mergeProgress(L,C){
  L=normProgress(L); C=normProgress(C);
  const M={items:{},sessions:[]}, ids={};
  Object.keys(L.items).forEach(k=>ids[k]=1);
  Object.keys(C.items).forEach(k=>ids[k]=1);
  Object.keys(ids).forEach(k=>{ if(BY_ID[k]) M.items[k]=mergeItem(L.items[k],C.items[k]); });
  const seen={}, ss=[];
  L.sessions.concat(C.sessions).forEach(s=>{ if(s&&s.finishedAt&&!seen[s.finishedAt]){ seen[s.finishedAt]=1; ss.push(s); } });
  ss.sort((x,y)=>new Date(y.finishedAt)-new Date(x.finishedAt));
  M.sessions=ss.slice(0,100).reverse();
  return M;
}
function sigP(p){ return JSON.stringify({i:(p||{}).items||{},s:((p||{}).sessions||[]).length}); }

/* ---- 通信 ---- */
function gasErr(){ return 'GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください'; }
async function api(body){
  const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({key:SYNC.key},body))});
  const txt=await r.text();
  try{ return JSON.parse(txt); }catch(e){ throw new Error(gasErr()); }
}
function apiError(j){
  const e=String((j&&j.error)||'');
  if(e==='auth') return 'ログインが無効になりました。ポータルでログインし直してください';
  if(/合言葉|key/i.test(e)) return '合言葉が違います';
  return e||'エラー';
}
function onAuthLost(){ lsDel(K_AUTH); AUTH=null; render(); }
function netFail(e){
  if(/GASの応答/.test(e.message||'')) setSyncMsg('☁⚠ '+e.message,'err');
  else setSyncMsg('☁ オフライン（ローカルには保存済み）','');
}

/* ---- 取り込み（初めての端末はここでクラウドの記録が入る） ---- */
async function pullCloud(silent){
  if(!ready()||!AUTH) return;
  const firstTime=FRESH;                       /* この端末にまだ記録が無い＝初回 */
  if(!silent) setSyncMsg(firstTime?'☁… 初めての端末です。クラウドから記録を取り込みます':'☁… クラウドと同期しています','');
  let j;
  try{ j=await api({action:'fetch',app:APP,id:AUTH.id,pw:AUTH.pw}); }
  catch(e){ netFail(e); return; }
  if(!j||!j.ok){
    if(j&&j.error==='auth'){ setSyncMsg('☁⚠ '+apiError(j),'err'); onAuthLost(); return; }
    setSyncMsg('☁⚠ '+apiError(j||{}),'err'); return;
  }
  const cloudP=normProgress(((j.data||{}).progress||{})[AUTH.id]);
  const localP=prog();
  const localHad=hasRecords(localP), cloudHas=hasRecords(cloudP);
  const before=sigP(localP);
  const merged=mergeProgress(localP,cloudP);
  db.progress[AUTH.id]=merged;
  if(j.label){ AUTH.label=j.label; lsSet(K_AUTH,JSON.stringify(AUTH)); if(db.accounts[0]) db.accounts[0].label=j.label; }
  const cd=(j.data||{}).accounts&&j.data.accounts[0];
  if(cd&&cd.createdAt&&db.accounts[0]) db.accounts[0].createdAt=cd.createdAt;
  const changed=(before!==sigP(merged));
  saveDB(!changed);
  touchLastSync();
  FRESH=!hasRecords(merged);
  if(firstTime&&cloudHas) setSyncMsg('☁✓ この端末にクラウドの記録を取り込みました（'+statOf(merged)+'）','ok');
  else if(!cloudHas&&!localHad) setSyncMsg('☁✓ クラウドにもまだ記録はありません','ok');
  else if(changed) setSyncMsg('☁✓ クラウドと合流しました（'+statOf(merged)+'）','ok');
  else setSyncMsg('☁✓ クラウドと同じ内容です（'+statOf(merged)+'）','ok');
  renderHome();
  /* 端末にしか無い記録があったときだけ返す（初回取り込みでは送り返さない） */
  if(localHad&&changed) await pushCloud(true,syncMsg.text);
}

/* ---- 送信（自分のID 1件だけ。DB丸ごとは送らない） ---- */
async function pushCloud(silent,okMsg){
  if(!ready()||!AUTH) return false;
  if(!silent) setSyncMsg('☁… 送信しています','');
  let j;
  try{ j=await api({action:'save',app:APP,id:AUTH.id,pw:AUTH.pw,account:db.accounts[0],progress:prog()}); }
  catch(e){
    if(/GASの応答/.test(e.message||'')) setSyncMsg('☁⚠ '+e.message,'err');
    else setSyncMsg('☁ オフライン（ローカルには保存済み。次につながったときに送ります）','');
    return false;
  }
  if(!j||!j.ok){
    if(j&&j.error==='auth'){ setSyncMsg('☁⚠ '+apiError(j),'err'); onAuthLost(); return false; }
    setSyncMsg('☁⚠ '+apiError(j||{}),'err'); return false;
  }
  touchLastSync();
  setSyncMsg(okMsg||'☁✓ クラウドに保存しました','ok');
  return true;
}
function autoPush(){ if(ready()&&AUTH) pushCloud(true); }

      modalConfirm('記録を置き換えますか？',
        '<div>ID：<b>'+esc(AUTH.id)+'</b>（'+esc(AUTH.label||AUTH.id)+'）</div>'+
        '<div>ファイルの内容：<b>'+esc(statOf(np))+'</b></div>'+
        '<div>保存日時：<b>'+fmtDT(o.updatedAt)+'</b></div>'+
        '<div class="warnbar">いまのこのツールの記録は置き換えられます。</div>',
        ()=>{ db.progress[AUTH.id]=np; FRESH=!hasRecords(np); saveDB(false); autoPush(); renderHome(); toast('記録を読み込みました'); },'置き換える');
    };
    rd.readAsText(f);
  };
  inp.click();
}
function resetRecords(){
  if(!AUTH) return;
  modalConfirm('このツールの記録を消す','ID '+esc(AUTH.id)+'（'+esc(AUTH.label||AUTH.id)+'）の<b>'+esc(TITLE)+'</b>の学習記録をすべて消します。もとに戻せません。',()=>{
    db.progress[AUTH.id]={items:{},sessions:[]}; FRESH=true;
    saveDB(false); autoPush(); renderHome(); toast('記録を消しました');
  },'消す');
}

/* ================= ゲート画面（未設定・未ログイン） ================= */
function renderGate(){
  const btn=$('#accBtn'); if(btn) btn.textContent='👤 —';
  const why=!ready()?'クラウド同期がまだ設定されていません。':'まだログインしていません。';
  $('#gateCard').innerHTML=
    '<h2>🔑 ポータルで準備してください</h2>'+
    '<div class="muted">'+esc(why)+'<br>ポータル（トップページ）で<b>同期設定とログイン</b>を1回だけ行うと、'+
    'すべての学習ツールがそのまま使えるようになります。</div>'+
    '<ul class="muted" style="padding-left:1.2em;line-height:2;margin:10px 0">'+
    '<li>GASのURLと合言葉 … ポータルで入力</li>'+
    '<li>ID（5けた）とパスワード … ポータルでログイン</li>'+
    '<li>この画面に戻ってくれば、すぐ学習を始められます</li>'+
    '<li>初めて使う端末では、ログインするとクラウドの記録を自動で取り込みます</li></ul>'+
    '<a class="btn pri wide" href="'+portalURL()+'" style="display:block;text-decoration:none">ポータルをひらく</a>'+
    '<button class="btn ghost wide" id="gateReload" style="margin-top:8px">ログイン済みなら、ここを押して読み込み直す</button>'+
    '<div class="status" id="syncStatus" style="margin-top:10px">'+esc(syncMsg.text)+'</div>';
  $('#gateReload').onclick=()=>{
    loadAll();
    if(ready()&&loggedIn()){ render(); pullCloud(false); }
    else { renderGate(); toast('まだポータルでの準備が終わっていません'); }
  };
}

/* ================= 起動 ================= */
function wire(){
  $('#accBtn').onclick=()=>{
    if(!$('#scQuiz').classList.contains('hide')&&S&&S.history.length){
      modalConfirm('学習を中断しますか？','いま解いたぶんは<b>記録されません</b>。',()=>{ S=null; show('scHome'); },'中断する'); return; }
    if(loggedIn()) location.href=portalURL();
  };
  $$('#scHome [data-mode]').forEach(b=>b.onclick=()=>startSession(b.dataset.mode));
  $('#btnMemo').onclick=openMemo;
  $$('#impSeg button').forEach(b=>b.onclick=()=>{ UI.impFilter=b.dataset.v; saveUI(); renderHome(); });
  $('#btnSyncNow').onclick=()=>pullCloud(false);
  $('#btnPushList').onclick=pushList;
  $('#btnCsv2').onclick=downloadCSV;
  $('#btnExport').onclick=exportJSON;
  $('#btnImport').onclick=importJSON;
  $('#btnReset').onclick=resetRecords;
  $('#btnPortal').href=portalURL();

  $('#btnNext').onclick=()=>{ S.pos++; nextQuestion(); };
  $('#btnPrev').onclick=()=>{
    if(S.viewIdx===null){ S.viewIdx=S.answeredThis?S.history.length-2:S.history.length-1; }
    else S.viewIdx--;
    if(S.viewIdx<0){ S.viewIdx=0; }
    renderQuiz();
  };
  $('#btnFwd').onclick=()=>{ S.viewIdx++; if(S.viewIdx>S.history.length-1) S.viewIdx=null; renderQuiz(); };
  $('#btnQuit').onclick=()=>modalConfirm('学習を中断しますか？','いま解いたぶんは<b>記録されません</b>。結果画面まで進むと記録されます。',()=>{ S=null; show('scHome'); },'中断する');

  $('#btnHome').onclick=()=>{ S=null; show('scHome'); };
  $('#btnCsv').onclick=downloadCSV;
  $('#mBack').onclick=()=>show('scHome');
  $('#mTabList').onclick=()=>{MEMO.tab='list';renderMemoTab();};
  $('#mTabCard').onclick=()=>{MEMO.tab='card';renderMemoTab();};
  window.addEventListener('beforeunload',e=>{ if(S&&S.history.length){ e.preventDefault(); e.returnValue=''; } });

  /* 他のツール／ポータルでログイン状態が変わったら追従する */
  window.addEventListener('storage',ev=>{
    if(ev.key!==K_AUTH&&ev.key!==K_SYNC) return;
    if(S&&S.history.length) return;
    const wasId=AUTH?AUTH.id:null;
    loadAll();
    render();
    if(ready()&&loggedIn()&&(AUTH.id!==wasId||FRESH)) pullCloud(false);   /* ログイン直後はクラウドを取り込む */
  });
}
function boot(){
  loadAll();
  if(!LS_OK){
    $('#lsWarn').classList.remove('hide');
    $('#lsWarn').innerHTML=ready()
      ? '☁ この端末には記録を残せない環境ですが、クラウド同期が有効なので記録はGoogleに保存されます。'
      : '⚠ この端末には記録を保存できません（ブラウザの設定）。ポータルで同期設定をすると記録を残せます。';
  }
  wire();
  if(ready()&&loggedIn()) setSyncMsg(FRESH?'☁… 初めての端末です。クラウドから記録を取り込みます':'☁… クラウドと同期しています','');
  render();
  if(ready()&&loggedIn()) pullCloud(!FRESH);   /* 初回端末は取り込み結果をはっきり出す */
}
boot();
</script>
</body>
</html>
