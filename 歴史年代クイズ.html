      <div class="qtype-tag">${accountName()} さんのお気に入り</div>
      <div class="question-text">忘れそう・気になる問題</div>
      <div class="review-list">${listHtml}</div>
      <div class="btn-row"><button class="ghost-btn" id="backHomeBtn">成績ページにもどる</button></div>
    </div>
  `;
  app.querySelectorAll('.review-item .star-btn').forEach(btn=>{
    btn.onclick = ()=>{ toggleFavorite(Number(btn.dataset.idx)); render(); };
  });
  app.querySelectorAll('.review-item .search-btn').forEach(btn=>{
    btn.onclick = ()=> openGoogleSearch(btn.dataset.search);
  });
  document.getElementById('backHomeBtn').onclick = ()=>{ state.screen = "home"; render(); };
}

function renderStudy(app){
  const st = state.study;
  if(st.indices.length === 0){
    app.innerHTML = `
      <div class="card center-card">
        <div class="qtype-tag">📖 覚えるモード</div>
        <div class="question-text">🎉 表示できる項目がありません</div>
        <p style="font-size:13px; color:var(--sumi-soft);">「未習得のみ」の絞り込みで全問習得済みのようです。素晴らしい！</p>
        <div class="btn-row">
          <button class="ghost-btn" id="studyShowAllBtn">全100問を表示する</button>
          <button class="big-btn" id="studyBackBtn">成績ページにもどる</button>
        </div>
      </div>
    `;
    document.getElementById('studyShowAllBtn').onclick = ()=>{ setStudyFilter(false); render(); };
    document.getElementById('studyBackBtn').onclick = ()=>{ state.study = null; state.screen = "home"; render(); };
    return;
  }

  const idx = st.indices[st.pos];
  const [item, year, mnemonic, why] = DATA[idx];
  renderTimelineMap(year);
  const progress = getCommittedStats(state.accountId);
  const mastered = isMastered(progress, idx);
  const pct = Math.round(((st.pos+1) / st.indices.length) * 100);

  app.innerHTML = `
    <div class="card">
      <div class="study-toolbar">
        <div class="qtype-tag" style="margin-bottom:0; background:var(--moss);">📖 覚えるモード</div>
        <label class="study-filter-label">
          <input type="checkbox" id="studyFilterCheck" ${st.filterUnmastered ? 'checked' : ''}>
          未習得のみを表示
        </label>
        <select class="study-era-select" id="studyEraJump">
          <option value="">時代へジャンプ…</option>
          ${ERA_BOUNDARIES.map((e,i)=>`<option value="${i}">${e[1]}</option>`).join("")}
        </select>
      </div>
      <div class="study-progress-track"><div class="study-progress-fill" style="width:${pct}%"></div></div>
      <div class="stat-strip">
        <span>${st.pos+1} / ${st.indices.length} 問</span>
        <span>${eraName(year)}</span>
      </div>

      <div class="study-card">
        <div class="study-era-tag">${eraName(year)}</div>
        <div class="study-year">${year}<span style="font-size:22px;">年</span>${mastered ? '<span class="study-mastered-badge">習得済み</span>' : ''}</div>
        <div class="study-item">${item}</div>
        <div class="study-mnemonic-box"><span class="lbl">ゴロあわせ</span>${mnemonic}</div>
        <div class="study-why-box"><b>なぜ起きた？</b><br>${why}</div>
        <div class="study-icons-row">
          <button class="star-btn ${isFavorite(progress, idx) ? 'active' : ''}" id="studyFavBtn">★ <span class="lbl">あとで見る</span></button>
          <button class="speak-btn" id="studySpeakBtn">🔊 <span class="lbl">読み上げ</span></button>
          <button class="search-btn" id="studySearchBtn">🔍 <span class="lbl">Googleで調べる</span></button>
        </div>
      </div>

      <div class="study-nav-row">
        <button class="study-nav-btn" id="studyPrevBtn" ${st.pos<=0 ? 'disabled' : ''}>← 前へ</button>
        <button class="study-nav-btn" id="studyNextBtn" ${st.pos>=st.indices.length-1 ? 'disabled' : ''}>次へ →</button>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="ghost-btn" id="studyBackBtn">成績ページにもどる</button>
      </div>
    </div>
  `;

  document.getElementById('studyFilterCheck').onchange = (e)=>{ setStudyFilter(e.target.checked); render(); };
  document.getElementById('studyEraJump').onchange = (e)=>{
    if(e.target.value === "") return;
    jumpStudyToEra(Number(e.target.value));
    render();
  };
  document.getElementById('studyFavBtn').onclick = ()=>{
    const nowFav = toggleFavorite(idx);
    document.getElementById('studyFavBtn').classList.toggle('active', nowFav);
  };
  document.getElementById('studySearchBtn').onclick = ()=> openGoogleSearch(item);
  const studySpeechText = `${year}年。${item}。ゴロ合わせ、${mnemonic}。なぜ起きた？　${why}`;
  document.getElementById('studySpeakBtn').onclick = ()=> speak(studySpeechText);
  if(state.autoRead) speak(studySpeechText);
  document.getElementById('studyPrevBtn').onclick = ()=>{ if(st.pos>0){ st.pos--; render(); } };
  document.getElementById('studyNextBtn').onclick = ()=>{ if(st.pos<st.indices.length-1){ st.pos++; render(); } };
  document.getElementById('studyBackBtn').onclick = ()=>{ state.study = null; state.screen = "home"; render(); };
}

function renderTimelineMap(currentYear, done){
  const map = document.getElementById('timelineMap');
  let html = `<div class="rail"></div>`;
  const labels = [
    [239,"古代"],[710,"奈良"],[794,"平安"],[1192,"鎌倉"],[1336,"室町"],
    [1603,"江戸"],[1868,"明治"],[1912,"大正〜昭和"],[1989,"平成〜"]
  ];
  labels.forEach(([y,label])=>{ html += `<div class="era-label" style="left:${pctPos(y)}%">${label}</div>`; });
  let answeredYears = [];
  if(state.session && state.screen === "quiz"){
    answeredYears = sessionAnsweredYears();
  }
  DATA.forEach(d=>{
    const y = d[1];
    let cls = "dot";
    if(currentYear && y===currentYear) cls += " current";
    else if(answeredYears.includes(y)) cls += " done";
    html += `<div class="${cls}" style="left:${pctPos(y)}%"></div>`;
  });
  map.innerHTML = html;
}
function sessionAnsweredYears(){
  const sess = state.session;
  return sess.log.map(l => DATA[l.dataIdx][1]);
}

// On a brand-new device (this ID has never synced here before), the local
// store is empty even though the child may already have real progress on
// the server. Rather than silently pulling in the background -- which
// would flash an empty "0 progress" home screen for a moment -- block on
// one initial download first, so the very first thing the child sees
// already reflects their real history.
async function initialLoad(){
  render();
  if(!ready() || !loggedIn()) return;
  try{
    if(!dbHasRecords(STORE)){
      state.screen = "loading";
      render();
      await pullCloud(true);
    } else {
      setSyncStatus("pending", "☁… クラウドと同期しています");
      pullCloud(true);
    }
  }catch(e){
    // belt-and-suspenders: pullCloud already catches its own errors, but
    // this guarantees the loading screen can never get stuck no matter what.
    handleSyncError(e);
  }finally{
    if(state.screen === "loading"){ state.screen = "home"; render(); }
  }
}
initialLoad();

// Follow login/sync changes made elsewhere (the portal, or another tool's
// tab) -- but never yank the rug out from under an in-progress quiz.
window.addEventListener('storage', (ev)=>{
  if(ev.key !== AUTH_KEY && ev.key !== SYNC_KEY) return;
  // never interrupt an active quiz or study session, even on the very first card/question
  if(state.screen === "quiz" && state.session) return;
  if(state.screen === "study" && state.study) return;
  loadAll();
  state.accountId = AUTH ? AUTH.id : null;
  state.screen = (ready() && loggedIn()) ? "home" : "gate";
  initialLoad();
});
</script>
