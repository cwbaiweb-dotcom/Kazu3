<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歴史年代表100 クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --washi: #efe8d8;
    --sumi: #2b2b2b;
    --sumi-soft: #4a4a45;
    --aizome: #2c4a6e;
    --aizome-deep: #1c324c;
    --shuiro: #b5451c;
    --kincha: #a9781f;
    --moss: #5f6f4e;
    --line: rgba(43,43,43,0.16);
    --card-shadow: 0 18px 40px rgba(43,30,10,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(169,120,31,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(44,74,110,0.10), transparent 55%),
      var(--washi);
    font-family: "Noto Sans JP", sans-serif;
    color: var(--sumi);
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 22px; }
  .eyebrow{ font-size: 12px; letter-spacing: 0.35em; color: var(--kincha); font-weight:700; }
  h1{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 34px);
    margin: 6px 0 4px;
    letter-spacing: 0.04em;
  }
  .sub{ font-size: 13px; color: var(--sumi-soft); }

  .account-bar{
    display:flex; justify-content:center; align-items:center; gap:10px;
    margin-top: 10px; font-size: 13px; color: var(--sumi-soft);
  }
  .account-bar .name-pill{
    font-family: "Shippori Mincho", serif;
    font-weight:700;
    color: var(--aizome-deep);
    background: rgba(44,74,110,0.08);
    padding: 3px 12px;
    border-radius: 20px;
  }
  .switch-link{
    font-size:12px; color: var(--shuiro); background:none; border:none;
    text-decoration:underline; cursor:pointer; font-family:inherit;
  }

  .timeline-map{ margin: 18px auto 0; max-width: 640px; position: relative; height: 34px; }
  .timeline-map .rail{
    position:absolute; left:0; right:0; top:16px; height:2px;
    background: linear-gradient(90deg, var(--aizome), var(--kincha) 50%, var(--shuiro));
    opacity:0.35;
  }
  .timeline-map .dot{
    position:absolute; top:11px; width:6px; height:6px; border-radius:50%;
    background: var(--sumi); opacity:0.18; transform: translateX(-50%); transition: all .25s ease;
  }
  .timeline-map .dot.done{ background: var(--moss); opacity:0.55; }
  .timeline-map .dot.current{
    width:12px; height:12px; top:8px; background: var(--shuiro); opacity:1;
    box-shadow: 0 0 0 4px rgba(181,69,28,0.18);
  }
  .timeline-map .era-label{ position:absolute; top:-4px; font-size:10px; color: var(--sumi-soft); transform: translateX(-50%); white-space:nowrap; }

  .card{
    background: #faf6ec; border: 1px solid var(--line); border-radius: 4px;
    box-shadow: var(--card-shadow); padding: 30px 26px 26px; margin-top: 26px; position: relative;
  }
  .card::before{
    content:""; position:absolute; left:14px; right:14px; top:8px; bottom:8px;
    border: 1px solid rgba(169,120,31,0.28); border-radius: 2px; pointer-events:none;
  }
  .center-card{ text-align:center; }

  /* ---- Login ---- */
  .avatar-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; margin: 22px 0 6px;
  }
  .avatar-tile{ position:relative; }
  .avatar-btn{
    width:100%;
    font-family:"Shippori Mincho", serif;
    font-size: 22px; font-weight:800;
    padding: 26px 8px;
    border-radius: 4px;
    border: 1.5px solid var(--line);
    background: #fff;
    cursor:pointer;
    color: var(--aizome-deep);
    transition: all .12s ease;
  }
  .avatar-btn:hover{ border-color: var(--aizome); background: #f2f1ea; transform: translateY(-2px); }
  .avatar-btn .kana{ display:block; font-size:11px; color: var(--sumi-soft); font-weight:500; margin-top:6px; font-family:"Noto Sans JP",sans-serif; letter-spacing:0.1em; }
  .avatar-delete-btn{
    position:absolute; top:-8px; right:-8px; width:26px; height:26px; border-radius:50%;
    background: #fff; border:1.5px solid var(--shuiro); color: var(--shuiro);
    font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .avatar-delete-btn:hover{ background: rgba(181,69,28,0.1); }
  .avatar-add-btn{
    width:100%; height:100%; min-height:88px;
    font-family:"Shippori Mincho", serif; font-size:15px; font-weight:700;
    border-radius:4px; border:1.5px dashed var(--kincha); background: rgba(169,120,31,0.04);
    color: var(--kincha); cursor:pointer; transition: all .12s ease;
  }
  .avatar-add-btn:hover{ background: rgba(169,120,31,0.1); border-color: var(--aizome); color: var(--aizome-deep); }

  /* ---- Home / dashboard ---- */
  .stat-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(76px,1fr)); gap:10px; margin: 18px 0 22px;
  }
  .stat-box{
    background:#fff; border:1px solid var(--line); border-radius:3px; padding: 14px 8px;
  }
  .stat-box .num{ font-family:"Shippori Mincho", serif; font-size:26px; font-weight:800; color: var(--aizome-deep); }
  .stat-box .label{ font-size:11px; color: var(--sumi-soft); margin-top:2px; }

  .weak-list{ text-align:left; margin-top: 10px; }
  .weak-list h3{
    font-family:"Shippori Mincho", serif; font-size:15px; color: var(--sumi);
    border-bottom: 1px solid var(--line); padding-bottom:6px; margin-bottom:10px;
  }
  .weak-row{
    display:flex; justify-content:space-between; gap:10px;
    font-size:13px; padding: 7px 0; border-bottom: 1px dashed var(--line);
  }
  .weak-row .wi{ flex:1; }
  .weak-row .wy{ color: var(--aizome-deep); font-weight:700; white-space:nowrap; }
  .weak-row .wp{ width:70px; text-align:right; font-weight:700; white-space:nowrap; }
  .weak-row .wp.low{ color: var(--shuiro); }
  .weak-row .wp.mid{ color: var(--kincha); }
  .weak-row .wp.high{ color: var(--moss); }

  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top: 8px; }

  .star-btn{
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
    font-size: 18px;
    line-height:1;
    padding: 9px 12px;
    color: var(--kincha);
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family: "Noto Sans JP", sans-serif;
    transition: all .12s ease;
  }
  .star-btn:hover{ border-color: var(--kincha); background: rgba(169,120,31,0.08); }
  .star-btn.active{ background: rgba(169,120,31,0.14); border-color: var(--kincha); color: var(--kincha); font-weight:700; }
  .star-btn .lbl{ font-size:12px; }

  .search-btn{
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
    font-size: 15px;
    line-height:1;
    padding: 9px 10px;
    color: var(--aizome-deep);
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family: "Noto Sans JP", sans-serif;
    transition: all .12s ease;
  }
  .search-btn:hover{ border-color: var(--aizome); background: rgba(44,74,110,0.08); }
  .search-btn .lbl{ font-size:12px; }
  .review-item .search-btn{ position:absolute; top:8px; right:44px; padding: 5px 8px; font-size:14px; }

  .top-actions{ display:flex; justify-content:flex-end; margin-bottom: 6px; }

  .review-item{ position:relative; }
  .review-item .star-btn{ position:absolute; top:8px; right:8px; padding: 5px 8px; font-size:15px; }

  .fav-empty{ font-size:13px; color: var(--sumi-soft); padding: 20px 0; }

  .mode-toggle{
    display:flex; gap:8px; margin: 4px 0 16px; justify-content:center;
  }
  .mode-btn{
    flex:1; max-width: 220px;
    font-family: "Shippori Mincho", serif; font-size: 13.5px; font-weight:700;
    padding: 10px 8px; border-radius: 3px; border: 1.5px solid var(--line);
    background: #fff; color: var(--sumi-soft); cursor:pointer; transition: all .12s ease;
  }
  .mode-btn:hover{ border-color: var(--aizome); }
  .mode-btn.active{ background: var(--aizome); border-color: var(--aizome); color: #faf6ec; }

  .year-input-row{
    display:flex; gap:10px; align-items:stretch; margin-top:4px;
  }
  .year-input{
    flex:1;
    font-family: "Shippori Mincho", serif;
    font-size: 22px; font-weight:700; letter-spacing: 0.08em;
    text-align:center;
    padding: 12px 10px;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    color: var(--aizome-deep);
    background:#fff;
  }
  .year-input:focus{ outline:none; border-color: var(--aizome); }
  .year-input.input-correct{ border-color: var(--moss); background: rgba(95,111,78,0.14); }
  .year-input.input-wrong{ border-color: var(--shuiro); background: rgba(181,69,28,0.10); }
  .year-input-suffix{
    display:flex; align-items:center; font-family:"Shippori Mincho", serif;
    font-size:16px; color: var(--sumi-soft);
  }
  .year-submit-btn{
    font-family: "Shippori Mincho", serif; font-size: 15px; font-weight:700;
    padding: 0 20px; border-radius: 3px; border:none; color:#faf6ec;
    background: var(--shuiro); cursor:pointer;
  }
  .year-submit-btn:hover:not(:disabled){ background: var(--aizome-deep); }
  .year-submit-btn:disabled{ opacity:0.5; cursor:default; }
  .year-input-hint{ font-size:11.5px; color: var(--sumi-soft); margin-top:6px; }

  .big-btn{
    font-family: "Shippori Mincho", serif; font-size: 18px; font-weight: 800; letter-spacing: 0.1em;
    padding: 16px 40px; border-radius: 3px; border: none; color: #faf6ec;
    background: var(--shuiro); cursor: pointer; box-shadow: 0 8px 18px rgba(181,69,28,0.28);
  }
  .big-btn:hover{ background: var(--aizome-deep); box-shadow: 0 8px 18px rgba(44,74,110,0.28); }
  .ghost-btn{
    font-family: "Shippori Mincho", serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
    padding: 12px 20px; border-radius: 3px; border: 1.5px solid var(--aizome); color: var(--aizome-deep);
    background: transparent; cursor:pointer;
  }
  .ghost-btn:hover{ background: rgba(44,74,110,0.08); }

  /* ---- Quiz ---- */
  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; font-family:"Shippori Mincho", serif; margin-bottom: 18px; }
  .progress-row .qnum{ font-size:15px; color: var(--sumi-soft); letter-spacing:0.05em; }
  .progress-row .qnum b{ font-size:22px; color: var(--aizome-deep); }
  .progress-row .score{ font-size:14px; color: var(--kincha); font-weight:600; }

  .qtype-tag{ display:inline-block; font-size: 11px; letter-spacing: 0.12em; color: #fff; background: var(--aizome); padding: 3px 10px; border-radius: 2px; margin-bottom: 14px; }
  .qtype-tag.era-to-event{ background: var(--shuiro); }

  .question-text{
    font-family: "Shippori Mincho", serif; font-size: clamp(19px, 5vw, 25px); font-weight: 600;
    line-height: 1.55; color: var(--sumi); margin-bottom: 22px;
  }
  .question-text .year-big{ font-size: 1.3em; color: var(--aizome-deep); font-weight:800; letter-spacing:0.02em; }

  .choices{ display:grid; gap: 10px; }
  .choice-btn{
    text-align:left; font-family: inherit; font-size: 16px; padding: 14px 16px; border-radius: 3px;
    border: 1.5px solid var(--line); background: #fff; cursor:pointer; color: var(--sumi);
    transition: all .12s ease; line-height:1.4;
  }
  .choice-btn:hover:not(:disabled){ border-color: var(--aizome); background: #f2f1ea; }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color: var(--moss); background: rgba(95,111,78,0.14); font-weight:700; }
  .choice-btn.wrong{ border-color: var(--shuiro); background: rgba(181,69,28,0.10); text-decoration: line-through; opacity:0.75; }

  .feedback-box{ margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--kincha); background: rgba(169,120,31,0.08); font-size: 14px; line-height:1.7; display:none; }
  .feedback-box.show{ display:block; }
  .feedback-box .mnemonic{ font-family:"Shippori Mincho", serif; font-weight:600; color: var(--aizome-deep); }

  .next-btn{
    margin-top: 20px; display:none; width:100%; padding: 14px; font-family: "Shippori Mincho", serif;
    font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #faf6ec; background: var(--sumi);
    border: none; border-radius: 3px; cursor:pointer;
  }
  .next-btn.show{ display:block; }
  .next-btn:hover{ background: var(--aizome-deep); }

  .result-score{ font-family:"Shippori Mincho", serif; font-size: 52px; font-weight: 800; color: var(--aizome-deep); margin: 8px 0 2px; }
  .result-score span{ font-size: 22px; color: var(--sumi-soft); font-weight:500;}
  .result-comment{ font-size:14px; color: var(--kincha); font-weight:600; margin-bottom: 22px;}

  .review-list{ text-align:left; margin-top: 10px; display:grid; gap: 10px; }
  .review-item{
    border: 1px solid var(--line); border-left: 4px solid var(--shuiro); background:#fff;
    padding: 10px 84px 10px 14px; border-radius: 2px; font-size: 13px; line-height:1.7;
  }
  .review-item.ok{ border-left-color: var(--moss); }
  .review-item .ritem{ font-weight:700; }
  .review-item .ryear{ color: var(--aizome-deep); font-weight:700; }

  footer{ text-align:center; margin-top: 30px; font-size:11px; color: var(--sumi-soft); opacity:0.6; }
  /* ---- v3: session length mode selector ---- */
  .len-toggle{ display:flex; gap:8px; margin: 4px 0 12px; }
  .study-mode-btn{
    width:100%; margin: 4px 0 14px;
    font-family:"Shippori Mincho", serif; font-size:14.5px; font-weight:700;
    padding: 11px 10px; border-radius:3px; border:1.5px solid var(--moss);
    background: rgba(95,111,78,0.06); color: var(--moss); cursor:pointer; transition: all .12s ease;
  }
  .study-mode-btn:hover{ background: rgba(95,111,78,0.14); }

  .study-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .study-filter-label{ font-size:12.5px; color: var(--sumi-soft); display:flex; align-items:center; gap:6px; }
  .study-era-select{
    font-family:"Noto Sans JP", sans-serif; font-size:12.5px; padding:6px 8px;
    border:1.5px solid var(--line); border-radius:3px; background:#fff; color: var(--sumi);
  }
  .study-card{
    text-align:center; padding: 26px 10px 10px;
  }
  .study-era-tag{
    display:inline-block; font-size:11.5px; letter-spacing:0.1em; color:#fff;
    background: var(--aizome); padding:3px 12px; border-radius:2px; margin-bottom:12px;
  }
  .study-year{
    font-family:"Shippori Mincho", serif; font-size:44px; font-weight:800; color: var(--aizome-deep); line-height:1;
  }
  .study-item{
    font-family:"Shippori Mincho", serif; font-size:19px; font-weight:700; color: var(--sumi);
    margin: 12px 0 16px; line-height:1.6;
  }
  .study-mnemonic-box{
    background: rgba(169,120,31,0.08); border:1px solid var(--kincha); border-radius:3px;
    padding:10px 14px; margin-bottom:12px; font-size:14px; color: var(--sumi);
  }
  .study-mnemonic-box .lbl{ font-size:11px; color: var(--kincha); font-weight:700; display:block; margin-bottom:4px; }
  .study-why-box{
    text-align:left; font-size:13px; color: var(--sumi-soft); line-height:1.8;
    border-top:1px dashed var(--line); padding-top:10px; margin-top:6px;
  }
  .study-why-box b{ color: var(--sumi); }
  .study-icons-row{ display:flex; justify-content:center; gap:10px; margin: 4px 0 16px; }
  .study-progress-track{ height:6px; border-radius:3px; background:#e9e3d2; overflow:hidden; margin-bottom:14px; }
  .study-progress-fill{ height:100%; background: var(--moss); }
  .study-nav-row{ display:flex; gap:10px; margin-top:6px; }
  .study-nav-btn{
    flex:1; font-family:"Shippori Mincho", serif; font-size:15px; font-weight:700;
    padding:13px 10px; border-radius:3px; border:1.5px solid var(--line);
    background:#fff; color: var(--aizome-deep); cursor:pointer;
  }
  .study-nav-btn:hover:not(:disabled){ border-color: var(--aizome); background: #f2f1ea; }
  .study-nav-btn:disabled{ opacity:0.35; cursor:default; }
  .study-mastered-badge{
    display:inline-block; font-size:11px; font-weight:700; color: var(--moss);
    background: rgba(95,111,78,0.12); padding:2px 8px; border-radius:10px; margin-left:6px;
  }
  .len-btn{
    flex:1; font-family:"Shippori Mincho", serif; font-size:13px; font-weight:700;
    padding: 9px 6px; border-radius:3px; border:1.5px solid var(--line);
    background:#fff; color: var(--sumi-soft); cursor:pointer; transition: all .12s ease;
  }
  .len-btn:hover{ border-color: var(--kincha); }
  .len-btn.active{ background: var(--kincha); border-color: var(--kincha); color:#faf6ec; }
  .shortage-note{ font-size:11.5px; color: var(--shuiro); margin: -4px 0 10px; text-align:center; }

  .range-panel{
    border: 1.5px dashed var(--line); border-radius:4px; padding:14px; margin: 4px 0 14px;
  }
  .range-panel-title{ font-family:"Shippori Mincho", serif; font-size:13.5px; font-weight:700; color: var(--sumi); margin-bottom:8px; }
  .range-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .range-row input[type=number]{
    width:64px; font-family:"Noto Sans JP", sans-serif; font-size:14px; padding:7px 8px;
    border:1.5px solid var(--line); border-radius:3px; text-align:center;
  }
  .range-row select{
    font-family:"Noto Sans JP", sans-serif; font-size:12.5px; padding:6px 8px;
    border:1.5px solid var(--line); border-radius:3px; background:#fff; color: var(--sumi);
  }
  .range-row span{ font-size:13px; color: var(--sumi-soft); }
  .range-start-btn{
    width:100%; font-family:"Shippori Mincho", serif; font-size:14px; font-weight:700;
    padding:10px; border-radius:3px; border:1.5px solid var(--aizome); color: var(--aizome-deep);
    background:#fff; cursor:pointer;
  }
  .range-start-btn:hover{ background: rgba(44,74,110,0.08); }
  .range-error{ font-size:11.5px; color: var(--shuiro); margin: -2px 0 8px; }

  /* ---- v3: era mastery bars ---- */
  .era-bars{ text-align:left; margin-top:14px; }
  .era-bars h3{
    font-family:"Shippori Mincho", serif; font-size:15px; color: var(--sumi);
    border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:10px;
  }
  .era-bar-row{ margin-bottom:9px; }
  .era-bar-row .ebr-label{
    display:flex; justify-content:space-between; font-size:12px; color: var(--sumi-soft); margin-bottom:3px;
  }
  .era-bar-track{
    display:flex; height:10px; border-radius:5px; overflow:hidden; background:#e9e3d2;
  }
  .era-bar-seg.mastered{ background: var(--aizome); }
  .era-bar-seg.partial{ background: var(--kincha); }
  .era-bar-seg.none{ background: transparent; }

  /* ---- v3: in-quiz progress bar & KP gauge ---- */
  .progress-track{
    height:7px; border-radius:4px; background:#e9e3d2; overflow:hidden; margin-bottom:10px;
  }
  .progress-fill{ height:100%; background: var(--aizome); }
  .stat-strip{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px 14px;
    font-size:12px; color: var(--sumi-soft); margin-bottom:10px;
  }
  .stat-strip b{ color: var(--aizome-deep); }
  .kp-gauge{ letter-spacing:3px; font-size:14px; color: var(--kincha); }

  /* ---- v3: back/forward nav ---- */
  .nav-row{ display:flex; justify-content:space-between; gap:10px; margin-top:14px; }
  .nav-btn{
    font-family:"Shippori Mincho", serif; font-size:13px; font-weight:700;
    padding:9px 14px; border-radius:3px; border:1.5px solid var(--line);
    background:#fff; color: var(--sumi-soft); cursor:pointer;
  }
  .nav-btn:hover:not(:disabled){ border-color: var(--aizome); color: var(--aizome-deep); }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .review-banner{
    font-size:12px; color: var(--shuiro); background: rgba(181,69,28,0.08);
    border:1px solid var(--shuiro); border-radius:3px; padding:6px 10px; margin-bottom:10px; text-align:center;
  }

  /* ---- v3: results category table ---- */
  .filter-row{ display:flex; gap:8px; margin: 10px 0; flex-wrap:wrap; }
  .filter-row select{
    font-family:"Noto Sans JP", sans-serif; font-size:12.5px; padding:6px 8px;

const STORAGE_KEY = APP_ID;
const SYNC_KEY = APP_ID + ":sync";
const PREV_V3_KEY = "kj-quiz-rekishi-nendai"; // this tool's own previous (pre-sync) key
const OLD_V2_KEY = "rekishi100_quiz_v1";       // earlier still (pre-spec) key
const MASTERY_STREAK = 2;      // consecutive correct answers, in DIFFERENT formats, to master a KP
const WRONG_REQUEUE_GAP = 3;   // wrong answer -> reappears after this many other problems
const PARTIAL_REQUEUE_GAP = 6; // correct-but-not-yet-mastered -> reappears after this many

const ERA_BOUNDARIES = [
  [239, "古代"], [538, "飛鳥時代"], [710, "奈良時代"], [794, "平安時代"],
  [1185, "鎌倉時代"], [1336, "室町時代"], [1573, "安土桃山時代"], [1603, "江戸時代"],
  [1868, "明治時代"], [1912, "大正時代"], [1926, "昭和時代"], [1989, "平成時代以降"],
];
function eraForYear(y){
  let idx = 0;
  for(let i=0;i<ERA_BOUNDARIES.length;i++) if(y >= ERA_BOUNDARIES[i][0]) idx = i;
  return idx;
}

// ---------------------------------------------------------------------
// storage: load / save / migrate  (v1.2: v1.0 §9 schema -- accounts as
// {id,name,createdAt}, progress keyed by account id, not by name. This is
// required for the sync server to pick up sessions[] into the session-
// history sheet; a name-keyed store silently fails that part while list
// export -- which ships its own header/rows and doesn't depend on this
// schema -- kept working, which is exactly the symptom being fixed here.)
// ---------------------------------------------------------------------
function blankItemStat(){
  return {
    streak: 0, mastered: false, masteredAt: null, lastFormat: null,
    totalCorrect: 0, totalWrong: 0,
    byFormat: { A: {correct:0, wrong:0}, B: {correct:0, wrong:0} },
    wrongLog: [], lastSeenAt: null, favorite: false,
  };
}
function blankAccountProgress(){
  return { items: {}, sessions: [] };
}
function genAccountId(){
  return "acc_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function blankStore(){
  const accounts = DEFAULT_ACCOUNTS.map(name => ({ id: genAccountId(), name, createdAt: nowIso() }));
  const progress = {};
  accounts.forEach(a => { progress[a.id] = blankAccountProgress(); });
  return { app: APP_ID, version: 1, updatedAt: null, activeAccountId: null, accounts, progress };
}

// Detects the pre-v1.2 shape (accounts as plain name strings, progress
// keyed by name) and converts it to the id-based schema without losing
// anything. Safe to call on an already-upgraded store (no-op).
function upgradeToIdSchema(store){
  if(!store) return store;
  const accountsAreIdShaped = Array.isArray(store.accounts) && store.accounts.length > 0
    && typeof store.accounts[0] === "object" && store.accounts[0] && "id" in store.accounts[0];
  if(accountsAreIdShaped){
    // still make sure every listed id has a progress bucket, and nothing orphaned is lost
    store.accounts.forEach(a=>{ if(!store.progress[a.id]) store.progress[a.id] = blankAccountProgress(); });
    if(store.activeAccountId === undefined) store.activeAccountId = null;
    if(store.version === undefined) store.version = 1;
    return store;
  }
  const oldNames = Array.isArray(store.accounts) ? store.accounts : Object.keys(store.progress || {});
  const accounts = [];
  const progress = {};
  oldNames.forEach(name=>{
    const id = genAccountId();
    accounts.push({ id, name, createdAt: nowIso() });
    const oldAcc = (store.progress && store.progress[name]) || {};
    progress[id] = {
      items: oldAcc.items || {},
      sessions: Array.isArray(oldAcc.sessions) ? oldAcc.sessions : [],
    };
  });
  return {
    app: store.app || APP_ID,
    version: 1,
    updatedAt: store.updatedAt || null,
    activeAccountId: null,
    accounts, progress,
  };
}

function migrateFromV2(oldRaw){
  // Best-effort port of the oldest (v2, pre common-spec) schema so 音/昂/暁 keep their history.
  let old;
  try{ old = JSON.parse(oldRaw); }catch(e){ return null; }
  const nameKeyedStore = { app: APP_ID, accounts: DEFAULT_ACCOUNTS.slice(), progress: {}, updatedAt: null };
  DEFAULT_ACCOUNTS.forEach(a=>{
    const oldAcc = old[a];
    const acc = blankAccountProgress();
    nameKeyedStore.progress[a] = acc;
    if(!oldAcc) return;
    const allIdxKeys = new Set([
      ...Object.keys(oldAcc.items || {}),
      ...Object.keys(oldAcc.favorites || {}),
    ]);
    allIdxKeys.forEach(idx=>{
      const oi = (oldAcc.items && oldAcc.items[idx]) || {};
      const streak = Math.min(oi.correctStreak || 0, MASTERY_STREAK);
      acc.items[idx] = {
        streak,
        mastered: (oi.correctStreak || 0) >= 3, // old mastery threshold was 3-in-a-row same format
        masteredAt: (oi.correctStreak || 0) >= 3 ? new Date().toISOString() : null,
        lastFormat: null,
        totalCorrect: oi.correctTotal || 0,
        totalWrong: oi.wrongTotal || 0,
        byFormat: { A: {correct:0, wrong:0}, B: {correct:0, wrong:0} },
        wrongLog: [],
        lastSeenAt: null,
        favorite: !!(oldAcc.favorites && oldAcc.favorites[idx]),
      };
    });
  });
  return upgradeToIdSchema(nameKeyedStore);
}

// Whether this browser can actually persist to localStorage (some private-
// browsing modes throw on every access). Checked once at load time.
let LOCAL_STORAGE_OK = true;
function probeLocalStorage(){
  try{
    const t = "__probe__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}

function loadStore(){
  LOCAL_STORAGE_OK = probeLocalStorage();
  if(!LOCAL_STORAGE_OK) return blankStore();
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return upgradeToIdSchema(JSON.parse(raw));
  }catch(e){}
  // try this tool's own previous (pre-id-schema) key
  try{
    const prevRaw = localStorage.getItem(PREV_V3_KEY);
    if(prevRaw){
      const prev = JSON.parse(prevRaw);
      prev.app = APP_ID;
      if(prev.updatedAt === undefined) prev.updatedAt = null;
      return upgradeToIdSchema(prev);
    }
  }catch(e){}
  // fall back further to the original (pre common-spec) key
  try{
    const oldRaw = localStorage.getItem(OLD_V2_KEY);
    if(oldRaw){
      const migrated = migrateFromV2(oldRaw);
      if(migrated) return migrated;
    }
  }catch(e){}
  return blankStore();
}

// preserveUpdatedAt=true is used when we've just adopted a record set that
// already carries its own updatedAt (e.g. pulled from the cloud) -- in that
// case we must NOT stamp "now" over it.
function saveStore(opts){
  opts = opts || {};
  if(!opts.preserveUpdatedAt) STORE.updatedAt = nowIso();
  if(!LOCAL_STORAGE_OK){
    // Nothing we can do locally; the in-memory STORE object is still live
    // for this session, and syncStatus messaging tells the user why.
    return;
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); }
  catch(e){ LOCAL_STORAGE_OK = false; }
}

let STORE = loadStore();

function accountList(){ return STORE.accounts; }
function findAccountByName(name){ return STORE.accounts.find(a => a.name === name); }
function findAccountById(id){ return STORE.accounts.find(a => a.id === id); }
function accountName(id){
  const a = findAccountById(id);
  return a ? a.name : "(不明)";
}

function addAccount(name){
  name = (name || "").trim();
  if(!name) return { ok: false, error: "名前を入力してください。" };
  if(name.length > 12) return { ok: false, error: "名前は12文字以内にしてください。" };
  if(findAccountByName(name)) return { ok: false, error: "同じ名前のアカウントがすでにあります。" };
  const id = genAccountId();
  STORE.accounts.push({ id, name, createdAt: nowIso() });
  STORE.progress[id] = blankAccountProgress();
  saveStore();
  pushOnly(); // spec: push after account add/rename/delete
  return { ok: true, id };
}

function deleteAccount(id){
  STORE.accounts = STORE.accounts.filter(a => a.id !== id);
  delete STORE.progress[id];
  if(STORE.activeAccountId === id) STORE.activeAccountId = null;
  saveStore();
  pushOnly();
}

function getCommittedStats(accountId){
  if(!STORE.progress[accountId]) STORE.progress[accountId] = blankAccountProgress();
  return STORE.progress[accountId];
}
function getItemStat(progress, dataIdx){
  if(!progress.items[dataIdx]) progress.items[dataIdx] = blankItemStat();
  return progress.items[dataIdx];
}
// During an active session, reads/writes should hit the in-memory pending
// copy so nothing is persisted until the session is completed in full.
function currentProgress(){
  if(state.session) return state.session.pendingProgress;
  return getCommittedStats(state.accountId);
}
function isMastered(progress, dataIdx){
  const s = progress.items[dataIdx];
  return !!s && s.mastered;
}
function isFrequentlyWrong(progress, dataIdx, threshold){
  const s = progress.items[dataIdx];
  return !!s && s.totalWrong >= threshold;
}
function isFavorite(progress, dataIdx){
  const s = progress.items[dataIdx];
  return !!s && s.favorite;
}
function toggleFavorite(dataIdx){
  const progress = currentProgress();
  const s = getItemStat(progress, dataIdx);
  s.favorite = !s.favorite;
  if(!state.session) saveStore();
  return s.favorite;
}
function masteredCount(progress){
  let n = 0;
  for(let i=0;i<DATA.length;i++) if(isMastered(progress, i)) n++;
  return n;
}

// ---------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pctPos(year){ return ((year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * 100; }
function openGoogleSearch(query){
  window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank", "noopener");
}
function otherFormat(f){ return f === "A" ? "B" : "A"; }
function nowIso(){ return new Date().toISOString(); }
function todayStamp(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

// ---------------------------------------------------------------------
// question materialization: given a KP + format, build the on-screen question
// ---------------------------------------------------------------------
function materializeQuestion(dataIdx, format, answerMode){
  const [item, year, mnemonic] = DATA[dataIdx];
  const useInput = format === "A" && answerMode === "input";
  let choices = null, correctIdx = null;
  if(format === "A" && !useInput){
    const distractYears = shuffle(DATA.filter((d,i)=>i!==dataIdx).map(d=>d[1]));
    const yrSet = new Set([year]);
    const opts = [year];
    for(const y of distractYears){
      if(opts.length>=4) break;
      if(!yrSet.has(y)){ yrSet.add(y); opts.push(y); }
    }
    const shuffled = shuffle(opts.map(y=>({y, isCorrect:y===year})));
    choices = shuffled.map(o=>String(o.y)+"年");
    correctIdx = shuffled.findIndex(o=>o.isCorrect);
  } else if(format === "B"){
    const distractItems = shuffle(DATA.filter((d,i)=>i!==dataIdx).map(d=>d[0]));
    const opts = [item, ...distractItems.slice(0,3)];
    const shuffled = shuffle(opts.map(o=>({text:o, isCorrect:o===item})));
    choices = shuffled.map(o=>o.text);
    correctIdx = shuffled.findIndex(o=>o.isCorrect);
  }
  return { dataIdx, format, item, year, mnemonic, useInput, choices, correctIdx };
}

// ---------------------------------------------------------------------
// session KP selection + initial problem list
// ---------------------------------------------------------------------
function selectSessionKPs(mode, progress, opts){
  if(mode === "all") return DATA.map((d,i)=>i);
  if(mode === "range"){
    const start = Math.max(1, Math.min(100, opts.start));
    const end = Math.max(start, Math.min(100, opts.end));
    const indices = [];
    for(let i=start-1;i<=end-1;i++) indices.push(i);
    return indices; // kept in chronological (DATA) order -- no shuffle, no priority sort
  }
  const n = mode === "10q" ? 10 : 20;
  const candidates = [];
  for(let i=0;i<DATA.length;i++) if(!isMastered(progress, i)) candidates.push(i);
  candidates.sort((a,b)=>{
    const sa = progress.items[a], sb = progress.items[b];
    const wa = sa ? sa.totalWrong : 0, wb = sb ? sb.totalWrong : 0;
    if(wb !== wa) return wb - wa; // most-wrong first
    const seenA = sa && sa.lastSeenAt, seenB = sb && sb.lastSeenAt;
    if(!seenA && seenB) return -1; // never-seen before seen
    if(seenA && !seenB) return 1;
    if(!seenA && !seenB) return a - b;
    return new Date(seenA) - new Date(seenB); // oldest-seen first
  });
  return candidates.slice(0, n);
}

function buildInitialProblems(mode, kpIndices, progress){
  if(mode === "all" || mode === "range"){
    const problems = kpIndices.map(idx=>{
      const s = progress.items[idx];
      const fmt = (s && s.lastFormat) ? otherFormat(s.lastFormat) : (Math.random()<0.5?"A":"B");
      return { dataIdx: idx, format: fmt };
    });
    // "all" mode shuffles for variety; "range" mode keeps the given
    // (chronological) order intact -- that's the whole point of it.
    return mode === "all" ? shuffle(problems) : problems;
  }
  let problems = [];
  kpIndices.forEach(idx=>{
    problems.push({dataIdx: idx, format:"A"});
    problems.push({dataIdx: idx, format:"B"});
  });
  problems = shuffle(problems);
  // avoid the same KP's two formats landing back-to-back
  for(let i=1;i<problems.length;i++){
    if(problems[i].dataIdx === problems[i-1].dataIdx){
      for(let j=i+1;j<problems.length;j++){
        if(problems[j].dataIdx !== problems[i-1].dataIdx && problems[j].dataIdx !== problems[i].dataIdx){
          [problems[i], problems[j]] = [problems[j], problems[i]];
          break;
        }
      }
    }
  }
  return problems;
}

// answer application (mutates the given progress object's item stat)
// ---------------------------------------------------------------------
function applyAnswer(progress, dataIdx, format, correct, answeredText){
  const s = getItemStat(progress, dataIdx);
  const wasMastered = s.mastered;
  s.byFormat[format][correct ? "correct" : "wrong"]++;
  if(correct){
    s.totalCorrect++;
    if(s.lastFormat !== format) s.streak++; // only a DIFFERENT format advances the streak
    if(s.streak >= MASTERY_STREAK){
      if(!s.mastered){ s.mastered = true; s.masteredAt = nowIso(); }
    }
  } else {
    s.totalWrong++;
    s.streak = 0;
    s.mastered = false; // any miss un-masters the KP, even if mastered earlier
    s.wrongLog.push({at: nowIso(), format, answered: answeredText});
    if(s.wrongLog.length > WRONG_LOG_MAX) s.wrongLog.shift();
  }
  s.lastFormat = format;
  s.lastSeenAt = nowIso();
  return { newlyMastered: !wasMastered && s.mastered };
}

// ---------------------------------------------------------------------
// global UI state
// ---------------------------------------------------------------------
let state = {
  screen: "login", // login | home | quiz | result | favorites | study
  accountId: null,
  quizMode: "choice", // choice | input  (answer style for format-A questions)
  session: null,
  study: null, // {indices:[...], pos, filterUnmastered}
  syncStatus: { kind: "idle", message: "" }, // idle | pending | success | error
  modal: null, // {type: "syncSettings" | "importConfirm" | "listBlocked" | "importMismatch", ...}
};

// ---------------------------------------------------------------------
// study mode (覚えるモード): a scoreless, browsable read-through of the
// KPs -- no questions, no right/wrong, just year + event + mnemonic + why,
// in chronological order, with an optional "unmastered only" filter.
// ---------------------------------------------------------------------
function buildStudyIndices(filterUnmastered){
  const progress = getCommittedStats(state.accountId);
  let indices = DATA.map((d,i)=>i);
  if(filterUnmastered) indices = indices.filter(i => !isMastered(progress, i));
  return indices; // DATA is already chronological, so no sort needed
}
function startStudyMode(){
  state.study = { indices: buildStudyIndices(false), pos: 0, filterUnmastered: false };
  state.screen = "study";
}
function setStudyFilter(filterUnmastered){
  const st = state.study;
  const currentIdx = st.indices[st.pos];
  st.filterUnmastered = filterUnmastered;
  st.indices = buildStudyIndices(filterUnmastered);
  if(st.indices.length === 0){ st.pos = 0; return; }
  const newPos = st.indices.indexOf(currentIdx);
  st.pos = newPos !== -1 ? newPos : 0;
}
function jumpStudyToEra(eraIdx){
  const st = state.study;
  const [start] = ERA_BOUNDARIES[eraIdx];
  const end = eraIdx+1 < ERA_BOUNDARIES.length ? ERA_BOUNDARIES[eraIdx+1][0] : Infinity;
  const targetPos = st.indices.findIndex(i => DATA[i][1] >= start && DATA[i][1] < end);
  if(targetPos !== -1) st.pos = targetPos;
}

function startSession(mode, opts){
  const committed = getCommittedStats(state.accountId);
  const pendingProgress = deepClone(committed);
  const kpIndices = selectSessionKPs(mode, committed, opts);
  const requestedN = mode === "all" ? DATA.length : mode === "range" ? kpIndices.length : (mode === "10q" ? 10 : 20);
  const shortage = (mode === "10q" || mode === "20q") && kpIndices.length < requestedN;
  const problems = buildInitialProblems(mode, kpIndices, pendingProgress);
  const appearanceCount = {};
  kpIndices.forEach(idx=>{ appearanceCount[idx] = (mode === "all" || mode === "range") ? 1 : 2; });

  state.session = {
    mode, answerMode: state.quizMode,
    rangeLabel: mode === "range" ? `${opts.start}〜${opts.end}` : null,
    startedAt: nowIso(),
    pendingProgress,
    kpTotal: kpIndices.length,
    shortage,
    questions: problems,
    qIndex: 0,
    reviewIndex: null,
    score: 0,
    wrongCount: 0,
    log: [],
    appearanceCount,
    newlyMastered: new Set(),
  };
  state.screen = "quiz";
}

function scheduleRequeue(sess, fromLogIdx, dataIdx, lastUsedFormat, gap){
  if(sess.mode === "all" || sess.mode === "range") return null;
  const count = sess.appearanceCount[dataIdx] || 0;
  if(count >= MAX_APPEARANCES) return null;
  const targetIdx = Math.min(sess.qIndex + 1 + gap, sess.questions.length);
  sess.questions.splice(targetIdx, 0, { dataIdx, format: otherFormat(lastUsedFormat), fromLog: fromLogIdx });
  sess.appearanceCount[dataIdx] = count + 1;
  return targetIdx;
}
function removeScheduledRequeue(sess, logIdx){
  const i = sess.questions.findIndex(q => q.fromLog === logIdx);
  if(i !== -1 && i > sess.qIndex - 1){
    const removed = sess.questions.splice(i, 1)[0];
    sess.appearanceCount[removed.dataIdx] = Math.max(0, (sess.appearanceCount[removed.dataIdx]||1) - 1);
  }
}

// Records an answer for the LIVE question at sess.qIndex (fresh answer, not a redo).
function commitLiveAnswer(correct, answeredText){
  const sess = state.session;
  const q = sess.questions[sess.qIndex];
  const snapshotBefore = deepClone(getItemStat(sess.pendingProgress, q.dataIdx));
  const { newlyMastered } = applyAnswer(sess.pendingProgress, q.dataIdx, q.format, correct, answeredText);
  if(newlyMastered) sess.newlyMastered.add(q.dataIdx);
  if(correct) sess.score++; else sess.wrongCount++;

  let requeueIdx = null;
  if(!correct){
    requeueIdx = scheduleRequeue(sess, sess.qIndex, q.dataIdx, q.format, WRONG_REQUEUE_GAP);
  } else if(!newlyMastered && !isMastered(sess.pendingProgress, q.dataIdx)){
    requeueIdx = scheduleRequeue(sess, sess.qIndex, q.dataIdx, q.format, PARTIAL_REQUEUE_GAP);
  }

  sess.log.push({
    dataIdx: q.dataIdx, format: q.format, correct, answeredText,
    snapshotBefore, requeueIdx,
  });
  sess.qIndex++;
}

// Overwrites the most recent (still-redoable) answer.
function redoAnswer(correct, answeredText){
  const sess = state.session;
  const j = sess.qIndex - 1;
  const old = sess.log[j];
  const q = sess.questions[j];

  // roll back
  sess.pendingProgress.items[q.dataIdx] = deepClone(old.snapshotBefore);
  if(old.correct) sess.score--; else sess.wrongCount--;
  if(old.requeueIdx !== null) removeScheduledRequeue(sess, j);

  // re-apply
  const { newlyMastered } = applyAnswer(sess.pendingProgress, q.dataIdx, q.format, correct, answeredText);
  if(newlyMastered) sess.newlyMastered.add(q.dataIdx); else sess.newlyMastered.delete(q.dataIdx);
  if(correct) sess.score++; else sess.wrongCount++;

  let requeueIdx = null;
  if(!correct){
    requeueIdx = scheduleRequeue(sess, j, q.dataIdx, q.format, WRONG_REQUEUE_GAP);
  } else if(!newlyMastered && !isMastered(sess.pendingProgress, q.dataIdx)){
    requeueIdx = scheduleRequeue(sess, j, q.dataIdx, q.format, PARTIAL_REQUEUE_GAP);
  }
  sess.log[j] = { dataIdx: q.dataIdx, format: q.format, correct, answeredText, snapshotBefore: old.snapshotBefore, requeueIdx };
  state.session.reviewIndex = null;
}

function modeLabel(sess){
  if(sess.mode === "10q") return "10問";
  if(sess.mode === "20q") return "20問";
  if(sess.mode === "range") return `範囲(${sess.rangeLabel})`;
  return "全問";
}

function finishSession(){
  const sess = state.session;
  STORE.progress[state.accountId] = sess.pendingProgress;
  const acc = STORE.progress[state.accountId];
  acc.sessions = acc.sessions || [];
  const wrongKpIds = Array.from(new Set(sess.log.filter(l => !l.correct).map(l => String(l.dataIdx))));
  acc.sessions.push({
    startedAt: sess.startedAt, finishedAt: nowIso(), mode: modeLabel(sess),
    correct: sess.score, wrong: sess.wrongCount,
    newlyMastered: Array.from(sess.newlyMastered).map(String),
    wrongKpIds,
    totalMastered: masteredCount(acc),
  });
  if(acc.sessions.length > 100) acc.sessions = acc.sessions.slice(-100);
  saveStore();
  state.screen = "result";
  pushOnly(); // spec: push automatically right after a session's save -- this is what lets the session land in the GAS session-history sheet
}

function confirmLeaveSession(){
  if(state.screen === "quiz" && state.session){
    return window.confirm("ここで終了すると今回の記録は保存されません。よろしいですか？");
  }
  return true;
}
window.addEventListener('beforeunload', (e)=>{
  if(state.screen === "quiz" && state.session){
    e.preventDefault();
    e.returnValue = '';
  }
});

// ---------------------------------------------------------------------
// CSV export
// ---------------------------------------------------------------------
function statusLabel(s){
  if(!s) return "未出題";
  if(s.mastered) return "習得済み";
  if(s.totalCorrect + s.totalWrong === 0) return "未出題";
  return `${s.streak}回連続正解中`;
}
function exportCsv(account){
  const progress = getCommittedStats(account);
  const rows = [[
    "カテゴリー","知識ポイント","問題文","正解","直近の解答","状態",
    "累計正解数","累計誤答数","形式A誤答数","形式B誤答数","過去の誤答内容","最終誤答日","習得日"
  ]];
  const indices = DATA.map((d,i)=>i).sort((a,b)=>{
    const sa = progress.items[a], sb = progress.items[b];
    const wa = sa ? sa.totalWrong : 0, wb = sb ? sb.totalWrong : 0;
    return wb - wa;
  });
  indices.forEach(idx=>{
    const [item, year] = DATA[idx];
    const s = progress.items[idx];
    const lastAnswered = s && s.wrongLog.length ? s.wrongLog[s.wrongLog.length-1].answered : "";
    const wrongHistory = s ? s.wrongLog.map(w=>w.answered).join(";") : "";
    const lastWrongDate = s && s.wrongLog.length ? s.wrongLog[s.wrongLog.length-1].at : "";
    rows.push([
      eraName(year), item, `${item}（${year}年）`, String(year), lastAnswered, statusLabel(s),
      s ? s.totalCorrect : 0, s ? s.totalWrong : 0,
      s ? s.byFormat.A.wrong : 0, s ? s.byFormat.B.wrong : 0,
      wrongHistory, lastWrongDate, (s && s.masteredAt) || "",
    ]);
  });
  const csv = rows.map(r => r.map(cell=>{
    const v = String(cell ?? "");
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `結果_${accountName(account)}_${todayStamp()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------------------------------------------------------------------
// v4: cloud sync (addendum v1.1)
// ---------------------------------------------------------------------
function loadSyncConfig(){
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSyncConfig(cfg){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearSyncConfig(){
  try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
}

function dbHasRecords(db){
  if(!db || !db.progress) return false;
  return Object.values(db.progress).some(acc=>{
    if(acc && acc.sessions && acc.sessions.length > 0) return true;
    if(!acc || !acc.items) return false;
    return Object.values(acc.items).some(it => (it.totalCorrect||0) + (it.totalWrong||0) > 0);
  });
}

function setSyncStatus(kind, message){
  state.syncStatus = { kind, message };
  if(state.screen === "home") render();
}

function classifySyncError(e){
  if(e && e.kind) return e;
  return { kind: "network" };
}
function syncErrorMessage(e){
  switch(e.kind){
    case "network": return "オフライン（ローカルには保存済み）";
    case "badkey": return "合言葉が違います";
    case "badresponse": return "GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください";
    default: return e.message || "同期エラーが発生しました";
  }
}
function handleSyncError(e){
  const c = classifySyncError(e);
  setSyncStatus("error", (c.kind === "badkey" ? "☁⚠ " : "☁⚠ ") + syncErrorMessage(c));
}

async function fetchJson(url, options){
  let res;
  try{ res = await fetch(url, options); }
  catch(e){ throw { kind: "network" }; }
  let text;
  try{ text = await res.text(); }catch(e){ throw { kind: "network" }; }
  let json;
  try{ json = JSON.parse(text); }catch(e){ throw { kind: "badresponse" }; }
  if(!json.ok){
    const msg = json.error || "";
    throw { kind: /合言葉|key|unauthorized/i.test(msg) ? "badkey" : "servererror", message: msg };
  }
  return json;
}

async function pullFromCloud(cfg){
  const url = cfg.url + "?key=" + encodeURIComponent(cfg.key) + "&app=" + encodeURIComponent(APP_ID);
  const json = await fetchJson(url, { method: "GET" });
  return json.data; // db object, or null
}
async function pushToCloud(cfg, data){
  await fetchJson(cfg.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ key: cfg.key, data }),
  });
}
async function pushListToCloud(cfg, list){
  await fetchJson(cfg.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ key: cfg.key, app: APP_ID, list }),
  });
}

function mergeItemStat(a, b){
  if(!a) return deepClone(b);
  if(!b) return deepClone(a);
  const fA = { correct: Math.max((a.byFormat&&a.byFormat.A.correct)||0, (b.byFormat&&b.byFormat.A.correct)||0),
               wrong:   Math.max((a.byFormat&&a.byFormat.A.wrong)||0,   (b.byFormat&&b.byFormat.A.wrong)||0) };
  const fB = { correct: Math.max((a.byFormat&&a.byFormat.B.correct)||0, (b.byFormat&&b.byFormat.B.correct)||0),
               wrong:   Math.max((a.byFormat&&a.byFormat.B.wrong)||0,   (b.byFormat&&b.byFormat.B.wrong)||0) };
  const mastered = !!(a.mastered || b.mastered);
  let masteredAt = null;
  const masteredCandidates = [a.mastered && a.masteredAt, b.mastered && b.masteredAt].filter(Boolean);
  if(masteredCandidates.length) masteredAt = masteredCandidates.sort()[0];

  const aSeen = a.lastSeenAt ? new Date(a.lastSeenAt).getTime() : 0;
  const bSeen = b.lastSeenAt ? new Date(b.lastSeenAt).getTime() : 0;
  const newer = aSeen >= bSeen ? a : b;

  const seen = new Set();
  const wrongLog = [];
  [...(a.wrongLog||[]), ...(b.wrongLog||[])].forEach(w=>{
    const key = w.at + "|" + w.format + "|" + w.answered;
    if(!seen.has(key)){ seen.add(key); wrongLog.push(w); }
  });
  wrongLog.sort((x,y)=> new Date(x.at) - new Date(y.at));
  const trimmedWrongLog = wrongLog.length > WRONG_LOG_MAX ? wrongLog.slice(-WRONG_LOG_MAX) : wrongLog;

  return {
    streak: Math.max(a.streak||0, b.streak||0),
    mastered, masteredAt,
    lastFormat: newer.lastFormat || a.lastFormat || b.lastFormat || null,
    totalCorrect: Math.max(a.totalCorrect||0, b.totalCorrect||0),
    totalWrong: Math.max(a.totalWrong||0, b.totalWrong||0),
    byFormat: { A: fA, B: fB },
    wrongLog: trimmedWrongLog,
    lastSeenAt: newer.lastSeenAt || a.lastSeenAt || b.lastSeenAt || null,
    favorite: !!(a.favorite || b.favorite),
  };
}

function mergeAccountProgress(a, b){
  if(!a) return deepClone(b || blankAccountProgress());
  if(!b) return deepClone(a);
  const items = {};
  const allIdx = new Set([...Object.keys(a.items||{}), ...Object.keys(b.items||{})]);
  allIdx.forEach(idx=>{ items[idx] = mergeItemStat((a.items||{})[idx], (b.items||{})[idx]); });
  const sessionsMap = new Map();
  [...(a.sessions||[]), ...(b.sessions||[])].forEach(s=>{
    if(!sessionsMap.has(s.finishedAt)) sessionsMap.set(s.finishedAt, s);
  });
  let sessions = Array.from(sessionsMap.values()).sort((x,y)=> new Date(x.finishedAt) - new Date(y.finishedAt));
  if(sessions.length > 100) sessions = sessions.slice(-100);
  return { items, sessions };
}

// Always-merge cloud adoption per addendum v1.2 §5-3: never "newer wins"
// wholesale -- accounts are matched by NAME (ids are per-device and may
// legitimately differ), and each matched account's stats are combined
// (max counters, OR'd mastered flag, unioned wrongLog, sessions de-duped
// by finishedAt) rather than one side clobbering the other. This is what
// lets two devices, used alternately, converge instead of only ever
// pushing past each other.
function mergeWithCloud(cloudData){
  const cloud = deepClone(cloudData);
  cloud.app = APP_ID;
  if(!Array.isArray(cloud.accounts)) cloud.accounts = [];
  if(!cloud.progress) cloud.progress = {};

  const localByName = new Map(STORE.accounts.map(a=>[a.name, a]));
  const cloudByName = new Map(cloud.accounts.map(a=>[a.name, a]));
  const allNames = new Set([...localByName.keys(), ...cloudByName.keys()]);

  const mergedAccounts = [];
  const mergedProgress = {};
  let changed = false;
  const idReassignments = {};

  allNames.forEach(name=>{
    const localAcc = localByName.get(name);
    const cloudAcc = cloudByName.get(name);
    const canonical = cloudAcc || localAcc; // prefer the cloud's id/createdAt as canonical when both sides have this account
    mergedAccounts.push(canonical);
    const localProg = localAcc ? STORE.progress[localAcc.id] : null;
    const cloudProg = cloudAcc ? cloud.progress[cloudAcc.id] : null;
    const mergedProg = mergeAccountProgress(localProg, cloudProg);
    mergedProgress[canonical.id] = mergedProg;
    if(localAcc && cloudAcc && localAcc.id !== cloudAcc.id){
      idReassignments[localAcc.id] = cloudAcc.id;
    }
    if(!cloudAcc || JSON.stringify(cloudProg) !== JSON.stringify(mergedProg)){
      changed = true;
    }
  });

  const merged = {
    app: APP_ID, version: 1,
    updatedAt: cloud.updatedAt || null,
    activeAccountId: STORE.activeAccountId,
    accounts: mergedAccounts,
    progress: mergedProgress,
  };
  if(merged.activeAccountId && idReassignments[merged.activeAccountId]){
    merged.activeAccountId = idReassignments[merged.activeAccountId];
  }
  // keep the currently logged-in account (if any) pointing at valid data
  // even if its canonical id changed during this merge
  if(state.accountId && idReassignments[state.accountId]){
    state.accountId = idReassignments[state.accountId];
  }

  STORE = merged;
  saveStore({ preserveUpdatedAt: !changed });
  return changed;
}

function syncSummaryMessage(prefix){
  const accCount = STORE.accounts.length;
  let totalAnswered = 0, totalMastered = 0;
  STORE.accounts.forEach(a=>{
    const p = STORE.progress[a.id];
    if(!p) return;
    totalMastered += masteredCount(p);
    Object.values(p.items||{}).forEach(it=>{ totalAnswered += (it.totalCorrect||0) + (it.totalWrong||0); });
  });
  return `${prefix}（${accCount}人・出題済み${totalAnswered}・習得${totalMastered}）`;
}

// Push-only: used for the deterministic "local just changed" triggers
// (session finished, import replaced data, account added/deleted) where
// local is unambiguously the freshest copy and a full pull/merge would be
// the wrong move.
async function pushOnly(){
  const cfg = loadSyncConfig();
  if(!cfg) return;
  setSyncStatus("pending", "☁… 同期中");
  try{
    await pushToCloud(cfg, STORE);
    cfg.lastSync = nowIso();
    saveSyncConfig(cfg);
    setSyncStatus("success", "☁✓ クラウド保存ずみ");
  }catch(e){ handleSyncError(e); }
}

// Full pull + always-merge, per addendum v1.2 §5.
async function doSync(){
  const cfg = loadSyncConfig();
  if(!cfg) return;
  setSyncStatus("pending", "☁… 同期中");
  try{
    const cloudData = await pullFromCloud(cfg);
    const localHas = dbHasRecords(STORE);
    const cloudHas = dbHasRecords(cloudData);

    if(!cloudData){
      await pushToCloud(cfg, STORE);
      cfg.lastSync = nowIso(); saveSyncConfig(cfg);
      setSyncStatus("success", localHas ? "☁ クラウドに進捗が無かったので送りました" : "☁✓ クラウド保存ずみ");
      return;
    }
    if(!localHas && cloudHas){
      mergeWithCloud(cloudData);
      cfg.lastSync = nowIso(); saveSyncConfig(cfg);
      setSyncStatus("success", syncSummaryMessage("☁✓ クラウドから取り込みました"));
      return;
    }
    if(localHas && !cloudHas){
      await pushToCloud(cfg, STORE);
      cfg.lastSync = nowIso(); saveSyncConfig(cfg);
      setSyncStatus("success", "☁ クラウドに進捗が無かったので送りました");
      return;
    }
    // both sides have records -> always merge, never let one side just clobber the other
    const changed = mergeWithCloud(cloudData);
    if(changed) await pushToCloud(cfg, STORE);
    cfg.lastSync = nowIso();
    saveSyncConfig(cfg);
    setSyncStatus("success", syncSummaryMessage("☁✓ クラウドと合流しました"));
  }catch(e){ handleSyncError(e); }
}

function exportJsonDb(){

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){
      state.modal = { type: "importMismatch", reason: "このファイルは読み込めませんでした（JSON形式が壊れています）。" };
      render();
      return;
    }
    if(!parsed || parsed.app !== APP_ID){
      state.modal = { type: "importMismatch", reason: "このファイルは別のツール（または別バージョン）の記録データのようです。" };
      render();
      return;
    }
    parsed = upgradeToIdSchema(parsed); // accept exports made before the id-based schema too
    const accountSummaries = parsed.accounts.map(({id, name})=>{
      const acc = parsed.progress && parsed.progress[id];
      const has = acc && dbHasRecords({ progress: { [id]: acc } });
      return `${name}：${has ? "記録あり" : "記録なし"}`;
    }).join(" / ");
    state.modal = {
      type: "importConfirm",
      pendingData: parsed,
      summary: accountSummaries,
      savedAt: parsed.updatedAt || "（不明）",
    };
    render();
  };
  reader.readAsText(file);
}
function confirmImportReplace(){
  const data = state.modal && state.modal.pendingData;
  if(!data) return;
  STORE = data;
  STORE.app = APP_ID;
  saveStore(); // updatedAt refreshed -- this is now a fresh local change
  state.modal = null;
  if(state.accountId && !findAccountById(state.accountId)){
    state.accountId = null;
    state.screen = "login";
  }
  render();
  pushOnly(); // spec: push right after an import replace
}

// ---- full KP list export to Drive (§6) ----
function statusLabelForList(s){
  if(!s || (s.totalCorrect||0)+(s.totalWrong||0) === 0) return "未出題";
  if(s.mastered) return "習得済み";
  return `${s.streak}回正解`;
}
function formatDateJP(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function buildFullKpList(){
  const header = [
    "名前","カテゴリー","記号","知識ポイント","よみがな","重要度","状態",
    "累計正解数","累計誤答数","形式A誤答数","形式B誤答数",
    "過去の誤答内容","最終誤答日","習得日",
  ];
  const rows = [];
  STORE.accounts.forEach(({id, name})=>{
    const acc = STORE.progress[id] || blankAccountProgress();
    DATA.forEach((d,idx)=>{
      const [item, year] = d;
      const s = acc.items[idx];
      const wrongHistory = s ? s.wrongLog.map(w=>w.answered).join(";") : "";
      const lastWrongDate = s && s.wrongLog.length ? formatDateJP(s.wrongLog[s.wrongLog.length-1].at) : "";
      rows.push([
        name, eraName(year), "", item, "", "",
        statusLabelForList(s),
        s ? s.totalCorrect : 0, s ? s.totalWrong : 0,
        s ? s.byFormat.A.wrong : 0, s ? s.byFormat.B.wrong : 0,
        wrongHistory, lastWrongDate, formatDateJP(s && s.masteredAt),
      ]);
    });
  });
  return { header, rows };
}
async function exportListToDrive(){
  const cfg = loadSyncConfig();
  if(!cfg) return;
  setSyncStatus("pending", "☁… 一覧を書き出し中");
  try{
    // anti-empty-overwrite: always pull (and merge) the latest first
    const cloudData = await pullFromCloud(cfg);
    if(cloudData) mergeWithCloud(cloudData);
    if(!dbHasRecords(STORE)){
      state.modal = { type: "listBlocked" };
      setSyncStatus("idle", "");
      render();
      return;
    }
    const list = buildFullKpList();
    await pushListToCloud(cfg, list);
    cfg.lastSync = nowIso();
    saveSyncConfig(cfg);
    setSyncStatus("success", "全問一覧をスプレッドシートに書き出しました");
  }catch(e){ handleSyncError(e); }
}

function renderEraBars(progress){
  const rows = ERA_BOUNDARIES.map(([start, name], i)=>{
    const end = i+1 < ERA_BOUNDARIES.length ? ERA_BOUNDARIES[i+1][0] : MAX_YEAR + 1;
    const idxs = [];
    DATA.forEach((d,idx)=>{ if(d[1] >= start && d[1] < end) idxs.push(idx); });
    if(idxs.length === 0) return "";
    let mastered = 0, partial = 0;
    idxs.forEach(idx=>{
      const s = progress.items[idx];
      if(s && s.mastered) mastered++;
      else if(s && s.streak > 0) partial++;
    });
    const total = idxs.length;
    const noneCount = total - mastered - partial;
    const pctM = (mastered/total)*100, pctP = (partial/total)*100, pctN = (noneCount/total)*100;
    return `
      <div class="era-bar-row">
        <div class="ebr-label"><span>${name}</span><span>${mastered} / ${total}</span></div>
        <div class="era-bar-track">
          <div class="era-bar-seg mastered" style="width:${pctM}%"></div>
          <div class="era-bar-seg partial" style="width:${pctP}%"></div>
          <div class="era-bar-seg none" style="width:${pctN}%"></div>
        </div>
      </div>`;
  }).join("");
  return rows;
}

function renderStorageWarning(){
  const cfg = loadSyncConfig();
  if(cfg){
    return `<div class="storage-warning ok-with-cloud">☁ この端末には記録を残せない環境ですが、クラウド同期が有効なので記録はGoogleに保存されます</div>`;
  }
  return `<div class="storage-warning">⚠ この端末（ブラウザ）には記録を保存できません（プライベートブラウジング等）。記録を残すには「☁ クラウド同期設定」から同期を設定してください。</div>`;
}

function renderSyncStatusPill(){
  const s = state.syncStatus;
  const cfg = loadSyncConfig();
  if(s.kind === 'idle' && !cfg){
    return `<div class="sync-status idle">☁ 未設定（この端末にのみ記録が保存されます）</div>`;
  }
  const lastSyncTxt = cfg && cfg.lastSync ? `｜最終同期 ${formatDateJP(cfg.lastSync)} ${new Date(cfg.lastSync).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}` : '';
  const msg = s.message || (cfg ? '☁ 同期設定ずみ' : '☁ 未設定');
  return `<div class="sync-status ${s.kind}">${msg}${lastSyncTxt}</div>`;
}

function renderQuiz(app){
  const sess = state.session;
  const liveQ = sess.questions[sess.qIndex];
  const viewingReview = sess.reviewIndex !== null;
  const viewIdx = viewingReview ? sess.reviewIndex : sess.qIndex;
  const q = viewingReview ? sess.questions[viewIdx] : liveQ;
  const logEntry = viewingReview ? sess.log[viewIdx] : null;
  const canRedo = viewingReview && viewIdx === sess.qIndex - 1;

  renderTimelineMap(q.year);
  const progress = sess.pendingProgress;
  const isEventQ = q.format === "A";
  const useInput = q.format === "A" && sess.answerMode === "input";
  const freqWrong = isFrequentlyWrong(progress, q.dataIdx, HOME_WRONG_THRESHOLD);
  const itemStat = progress.items[q.dataIdx];
  const streakForGauge = viewingReview && !canRedo ? null : (itemStat ? itemStat.streak : 0);
  const gauge = streakForGauge===null ? "" :
    '<span class="kp-gauge">' + "●".repeat(Math.min(streakForGauge, MASTERY_STREAK)) + "○".repeat(Math.max(0, MASTERY_STREAK-streakForGauge)) + "</span>";

  // "あと◯語" = KPs in this session's target set not yet mastered, live
  const sessionKpSet = new Set(sess.questions.map(qq=>qq.dataIdx));
  let stillToMaster = 0;
  sessionKpSet.forEach(idx=>{ if(!isMastered(progress, idx)) stillToMaster++; });

  const progressPct = Math.round((sess.qIndex / sess.questions.length) * 100);

  const materialized = q.choices !== undefined ? q : materializeQuestion(q.dataIdx, q.format, sess.answerMode);

  app.innerHTML = `
    <div class="card">
      ${viewingReview ? `<div class="review-banner">${canRedo ? "直前の問題を見直しています。答えを選び直すと上書きされます。" : "過去の問題を閲覧中です（この問題はもう答え直せません）"}</div>` : ""}
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="stat-strip">
        <span>第 <b>${viewIdx+1}</b> / ${sess.questions.length} 問</span>
        <span>正解 <b>${sess.score}</b> ／ 誤答 <b>${sess.wrongCount}</b></span>
        ${(sess.mode !== "all" && sess.mode !== "range") ? `<span>あと <b>${stillToMaster}</b> 語</span>` : ""}
        ${gauge}
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          <div class="qtype-tag ${isEventQ ? '' : 'era-to-event'}" style="margin-bottom:0;">${isEventQ ? "出来事 → 年代" : "年代 → 出来事"}</div>
          ${useInput ? `<div class="qtype-tag" style="background:var(--kincha); margin-bottom:0;">✎ 入力形式</div>` : ''}
          ${freqWrong ? `<div class="qtype-tag" style="background:var(--shuiro); margin-bottom:0;">⚠️ よく間違える</div>` : ''}
        </div>
        <button class="star-btn ${isFavorite(progress, q.dataIdx) ? 'active' : ''}" id="favToggleBtn">★ <span class="lbl">あとで見る</span></button>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-top:8px;">
        <button class="search-btn" id="searchBtn">🔍 <span class="lbl">Googleで調べる</span></button>
      </div>
      <div class="question-text" style="margin-top:14px;">
        ${isEventQ ? materialized.item : `<span class="year-big">${materialized.year}年</span> に起こったことは？`}
      </div>
      ${(!viewingReview || canRedo) ? `
        ${useInput ? `
          <div class="year-input-row">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="year-input" id="yearInput" placeholder="例：239 / 1868" autocomplete="off">
            <span class="year-input-suffix">年</span>
            <button class="year-submit-btn" id="yearSubmitBtn">こたえる</button>
          </div>
          <div class="year-input-hint">3桁・4桁どちらの年代でも、数字だけ入力してください</div>
        ` : `<div class="choices" id="choices"></div>`}
      ` : `
        <div class="choices" id="choicesReadonly">
          ${materialized.choices.map((c,i)=>{
            let cls = 'choice-btn';
            if(i === materialized.correctIdx) cls += ' correct';
            else if(logEntry && logEntry.answeredText === c) cls += ' wrong';
            return `<button class="${cls}" disabled>${c}</button>`;
          }).join("")}
        </div>
      `}
      <div class="feedback-box ${viewingReview ? 'show' : ''}" id="feedback">
        ${viewingReview ? `${logEntry.correct ? "○ 正解でした" : "× 不正解でした（正解: " + materialized.year + "年）"}<br><span class="mnemonic">${materialized.mnemonic}</span>` : ""}
      </div>
      ${!viewingReview ? `<button class="next-btn" id="nextBtn">${sess.qIndex===sess.questions.length-1 ? "結果を見る" : "次の問題へ"}</button>` : ""}
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" ${viewIdx<=0 ? "disabled" : ""}>← 前の問題</button>
        <button class="nav-btn" id="fwdBtn" ${!viewingReview ? "disabled" : ""}>進む →</button>
      </div>
    </div>
  `;

  document.getElementById('prevBtn').onclick = ()=>{
    sess.reviewIndex = viewingReview ? Math.max(0, sess.reviewIndex-1) : sess.qIndex-1;
    render();
  };
  document.getElementById('fwdBtn').onclick = ()=>{
    if(!viewingReview) return;
    sess.reviewIndex = (sess.reviewIndex >= sess.qIndex-1) ? null : sess.reviewIndex+1;
    render();
  };
  document.getElementById('favToggleBtn').onclick = ()=>{
    const nowFav = toggleFavorite(q.dataIdx);
    document.getElementById('favToggleBtn').classList.toggle('active', nowFav);
  };
  document.getElementById('searchBtn').onclick = ()=> openGoogleSearch(materialized.item);

  if(!viewingReview){
    document.getElementById('nextBtn').onclick = nextQuestion;
    if(useInput){
      const inputEl = document.getElementById('yearInput');
      const submitBtn = document.getElementById('yearSubmitBtn');
      submitBtn.onclick = ()=>submitAnswer('input', materialized);
      inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer('input', materialized); });
      inputEl.focus();
    } else {
      const choicesEl = document.getElementById('choices');
      materialized.choices.forEach((c,i)=>{
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c;
        btn.onclick = ()=> submitAnswer('choice', materialized, i);
        choicesEl.appendChild(btn);
      });
    }
  } else if(canRedo){
    // redo UI: same as live but writes go through redoAnswer
    if(useInput){
      const inputEl = document.getElementById('yearInput');
      const submitBtn = document.getElementById('yearSubmitBtn');
      submitBtn.onclick = ()=>submitAnswer('input', materialized, null, true);
      inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer('input', materialized, null, true); });
    } else {
      const choicesEl = document.getElementById('choices');
      materialized.choices.forEach((c,i)=>{
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c;
        btn.onclick = ()=> submitAnswer('choice', materialized, i, true);
        choicesEl.appendChild(btn);
      });
    }
  }
}

function submitAnswer(kind, materialized, choiceIdx, isRedo){
  const sess = state.session;
  let correct, answeredText;
  if(kind === 'choice'){
    correct = choiceIdx === materialized.correctIdx;
    answeredText = materialized.choices[choiceIdx];
  } else {
    const inputEl = document.getElementById('yearInput');
    const raw = (inputEl.value || "").trim();
    const val = parseInt(raw, 10);
    correct = !isNaN(val) && String(val) === raw.replace(/^0+(?=\d)/, "") && val === materialized.year;
    answeredText = raw;
    inputEl.disabled = true;
    inputEl.classList.add(correct ? 'input-correct' : 'input-wrong');
    if(!correct) inputEl.value = raw + "　→　正解: " + materialized.year;
  }

  if(isRedo){ redoAnswer(correct, answeredText); render(); return; }

  commitLiveAnswer(correct, answeredText);

  if(kind === 'choice'){
    document.querySelectorAll('.choice-btn').forEach((b,idx)=>{
      b.disabled = true;
      if(idx === materialized.correctIdx) b.classList.add('correct');
      else if(b.textContent === answeredText) b.classList.add('wrong');
    });
  }
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  fb.innerHTML = `${correct ? "○ 正解！" : "× 残念、正解は " + materialized.year + "年"}<br><span class="mnemonic">${materialized.mnemonic}</span>`;
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  const sess = state.session;
  if(sess.qIndex >= sess.questions.length){
    finishSession();
    render();
    return;
  }
  render();
}

function renderResult(app){
  const sess = state.session;
  renderTimelineMap(null, true);
  const total = sess.questions.length;
  const pct = Math.round((sess.score/total)*100);
  let comment;
  if(pct===100) comment = "満点！歴史マスター認定です";
  else if(pct>=80) comment = "あと少し！よく覚えています";
  else if(pct>=50) comment = "半分以上正解！この調子で復習を";
  else comment = "語呂合わせを見直してもう一度挑戦しよう";

  const progress = getCommittedStats(state.accountId);
  const wrongEntries = sess.log.filter(l=>!l.correct);
  const reviewHtml = wrongEntries.length ? wrongEntries.map(l=>{
    const d = DATA[l.dataIdx];
    return `<div class="review-item">
      <button class="search-btn" data-search="${d[0].replace(/"/g,'&quot;')}">🔍</button>
      <button class="star-btn ${isFavorite(progress, l.dataIdx) ? 'active':''}" data-idx="${l.dataIdx}">★</button>
      <span class="ritem">${d[0]}</span> — <span class="ryear">${d[1]}年</span> (${l.format==='A'?'出来事→年代':'年代→出来事'})<br>
      あなたの答え: ${l.answeredText}
    </div>`;
  }).join("") : `<div class="fav-empty">今回は間違いなし！お見事です。</div>`;

  // category (era) full table
  const eraFilterOptions = ['すべて', ...ERA_BOUNDARIES.map(e=>e[1])];
  app.innerHTML = `
    <div class="card center-card">
      <div class="qtype-tag">${accountName(state.accountId)} さんの結果（${modeLabel(sess)}モード）</div>
      <div class="result-score">${sess.score}<span> / ${total} 問正解</span></div>
      <div class="result-comment">${comment}</div>
      <div class="result-comment" style="color:var(--moss);">今回新しく習得：${sess.newlyMastered.size}問</div>
      <div class="btn-row">
        <button class="big-btn" id="backHomeBtn">成績ページにもどる</button>
        <button class="csv-btn" id="csvBtnResult">結果をCSVでダウンロード</button>
      </div>
      <div class="weak-list">
        <h3>今回間違えた問題</h3>
        <div class="review-list">${reviewHtml}</div>
      </div>
      <div class="weak-list">
        <div class="filter-row">
          <select id="eraFilter">${eraFilterOptions.map(e=>`<option value="${e}">${e}</option>`).join("")}</select>
          <select id="sortFilter">
            <option value="wrong">誤答数が多い順</option>
            <option value="category">カテゴリー順</option>
            <option value="status">状態順</option>
          </select>
        </div>
        <div id="kpTableWrap"></div>
      </div>
    </div>
  `;
  document.getElementById('backHomeBtn').onclick = ()=>{
    state.session = null;
    state.screen = "home";
    render();
  };
  document.getElementById('csvBtnResult').onclick = ()=>exportCsv(state.accountId);
  app.querySelectorAll('.review-item .star-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const nowFav = toggleFavorite(Number(btn.dataset.idx));
      btn.classList.toggle('active', nowFav);
    };
  });
  app.querySelectorAll('.review-item .search-btn').forEach(btn=>{
    btn.onclick = ()=> openGoogleSearch(btn.dataset.search);
  });

  function renderKpTable(){
    const era = document.getElementById('eraFilter').value;
    const sortKey = document.getElementById('sortFilter').value;
    let rows = DATA.map((d,idx)=>({idx, item:d[0], year:d[1], era:eraName(d[1]), s: progress.items[idx]}));
    if(era !== 'すべて') rows = rows.filter(r=>r.era===era);
    if(sortKey === 'wrong') rows.sort((a,b)=>(b.s?b.s.totalWrong:0)-(a.s?a.s.totalWrong:0));
    else if(sortKey === 'category') rows.sort((a,b)=>a.year-b.year);
    else if(sortKey === 'status') rows.sort((a,b)=>{
      const ma = a.s&&a.s.mastered?1:0, mb=b.s&&b.s.mastered?1:0;
      return ma-mb;
    });
    const html = `
      <table class="kp-table">
        <thead><tr><th>カテゴリー</th><th>知識ポイント</th><th>状態</th><th>累計正誤</th></tr></thead>
        <tbody>
          ${rows.map(r=>{
            const flagged = r.s && r.s.totalWrong >= RESULT_WRONG_BADGE_THRESHOLD;
            return `<tr class="${flagged?'flagged':''}">
              <td>${r.era}</td>
              <td>${r.item}${flagged ? ` <span class="kp-badge">⚠️${r.s.totalWrong}回ミス</span>` : ''}</td>
              <td>${statusLabel(r.s)}</td>
              <td>○${r.s?r.s.totalCorrect:0} ／ ×${r.s?r.s.totalWrong:0}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
    document.getElementById('kpTableWrap').innerHTML = html;
  }
  document.getElementById('eraFilter').onchange = renderKpTable;
  document.getElementById('sortFilter').onchange = renderKpTable;
  renderKpTable();
}

function renderFavorites(app){
  renderTimelineMap(null);
  const progress = getCommittedStats(state.accountId);
  const favIdxs = Object.keys(progress.items).map(Number).filter(idx=>progress.items[idx].favorite).sort((a,b)=>DATA[a][1]-DATA[b][1]);
  const listHtml = favIdxs.length ? favIdxs.map(idx=>{
    const d = DATA[idx];
    return `<div class="review-item ok">
      <button class="search-btn" data-search="${d[0].replace(/"/g,'&quot;')}">🔍</button>
      <button class="star-btn active" data-idx="${idx}">★</button>
      <span class="ritem">${d[0]}</span> — <span class="ryear">${d[1]}年</span><br>
      ${d[2]}
    </div>`;
  }).join("") : `<div class="fav-empty">まだお気に入りはありません。クイズ中に★ボタンで登録できます。</div>`;
  app.innerHTML = `
    <div class="card">
      <div class="qtype-tag">${accountName(state.accountId)} さんのお気に入り</div>
      <div class="question-text">忘れそう・気になる問題</div>
      <div class="review-list">${listHtml}</div>
      <div class="btn-row"><button class="ghost-btn" id="backHomeBtn">成績ページにもどる</button></div>
    </div>
  `;
  app.querySelectorAll('.review-item .star-btn').forEach(btn=>{
    btn.onclick = ()=>{ toggleFavorite(Number(btn.dataset.idx)); render(); };
  });
  app.querySelectorAll('.review-item .search-btn').forEach(btn=>{
    btn.onclick = ()=> openGoogleSearch(btn.dataset.search);
  });
  document.getElementById('backHomeBtn').onclick = ()=>{ state.screen = "home"; render(); };
}

function renderStudy(app){
  const st = state.study;
  if(st.indices.length === 0){
    app.innerHTML = `
      <div class="card center-card">
        <div class="qtype-tag">📖 覚えるモード</div>
        <div class="question-text">🎉 表示できる項目がありません</div>
        <p style="font-size:13px; color:var(--sumi-soft);">「未習得のみ」の絞り込みで全問習得済みのようです。素晴らしい！</p>
        <div class="btn-row">
          <button class="ghost-btn" id="studyShowAllBtn">全100問を表示する</button>
          <button class="big-btn" id="studyBackBtn">成績ページにもどる</button>
        </div>
      </div>
    `;
    document.getElementById('studyShowAllBtn').onclick = ()=>{ setStudyFilter(false); render(); };
    document.getElementById('studyBackBtn').onclick = ()=>{ state.study = null; state.screen = "home"; render(); };
    return;
  }

  const idx = st.indices[st.pos];
  const [item, year, mnemonic, why] = DATA[idx];
  renderTimelineMap(year);
  const progress = getCommittedStats(state.accountId);
  const mastered = isMastered(progress, idx);
  const pct = Math.round(((st.pos+1) / st.indices.length) * 100);

  app.innerHTML = `
    <div class="card">
      <div class="study-toolbar">
        <div class="qtype-tag" style="margin-bottom:0; background:var(--moss);">📖 覚えるモード</div>
        <label class="study-filter-label">
          <input type="checkbox" id="studyFilterCheck" ${st.filterUnmastered ? 'checked' : ''}>
          未習得のみを表示
        </label>
        <select class="study-era-select" id="studyEraJump">
          <option value="">時代へジャンプ…</option>
          ${ERA_BOUNDARIES.map((e,i)=>`<option value="${i}">${e[1]}</option>`).join("")}
        </select>
      </div>
      <div class="study-progress-track"><div class="study-progress-fill" style="width:${pct}%"></div></div>
      <div class="stat-strip">
        <span>${st.pos+1} / ${st.indices.length} 問</span>
        <span>${eraName(year)}</span>
      </div>

      <div class="study-card">
        <div class="study-era-tag">${eraName(year)}</div>
        <div class="study-year">${year}<span style="font-size:22px;">年</span>${mastered ? '<span class="study-mastered-badge">習得済み</span>' : ''}</div>
        <div class="study-item">${item}</div>
        <div class="study-mnemonic-box"><span class="lbl">ゴロあわせ</span>${mnemonic}</div>
        <div class="study-why-box"><b>なぜ起きた？</b><br>${why}</div>
        <div class="study-icons-row">
          <button class="star-btn ${isFavorite(progress, idx) ? 'active' : ''}" id="studyFavBtn">★ <span class="lbl">あとで見る</span></button>
          <button class="search-btn" id="studySearchBtn">🔍 <span class="lbl">Googleで調べる</span></button>
        </div>
      </div>

      <div class="study-nav-row">
        <button class="study-nav-btn" id="studyPrevBtn" ${st.pos<=0 ? 'disabled' : ''}>← 前へ</button>
        <button class="study-nav-btn" id="studyNextBtn" ${st.pos>=st.indices.length-1 ? 'disabled' : ''}>次へ →</button>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="ghost-btn" id="studyBackBtn">成績ページにもどる</button>
      </div>
    </div>
  `;

  document.getElementById('studyFilterCheck').onchange = (e)=>{ setStudyFilter(e.target.checked); render(); };
  document.getElementById('studyEraJump').onchange = (e)=>{
    if(e.target.value === "") return;
    jumpStudyToEra(Number(e.target.value));
    render();
  };
  document.getElementById('studyFavBtn').onclick = ()=>{
    const nowFav = toggleFavorite(idx);
    document.getElementById('studyFavBtn').classList.toggle('active', nowFav);
  };
  document.getElementById('studySearchBtn').onclick = ()=> openGoogleSearch(item);
  document.getElementById('studyPrevBtn').onclick = ()=>{ if(st.pos>0){ st.pos--; render(); } };
  document.getElementById('studyNextBtn').onclick = ()=>{ if(st.pos<st.indices.length-1){ st.pos++; render(); } };
  document.getElementById('studyBackBtn').onclick = ()=>{ state.study = null; state.screen = "home"; render(); };
}

function renderTimelineMap(currentYear, done){
  const map = document.getElementById('timelineMap');
  let html = `<div class="rail"></div>`;
  const labels = [
    [239,"古代"],[710,"奈良"],[794,"平安"],[1192,"鎌倉"],[1336,"室町"],
    [1603,"江戸"],[1868,"明治"],[1912,"大正〜昭和"],[1989,"平成〜"]
  ];
  labels.forEach(([y,label])=>{ html += `<div class="era-label" style="left:${pctPos(y)}%">${label}</div>`; });
  let answeredYears = [];
  if(state.session && state.screen === "quiz"){
    answeredYears = sessionAnsweredYears();
  }
  DATA.forEach(d=>{
    const y = d[1];
    let cls = "dot";
    if(currentYear && y===currentYear) cls += " current";
    else if(answeredYears.includes(y)) cls += " done";
    html += `<div class="${cls}" style="left:${pctPos(y)}%"></div>`;
  });
  map.innerHTML = html;
}
function sessionAnsweredYears(){
  const sess = state.session;
  return sess.log.map(l => DATA[l.dataIdx][1]);
}

render();
if(loadSyncConfig()) doSync(); // §5: pull on app launch
</script>
