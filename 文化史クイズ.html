<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文化史 クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --washi: #efe8d8;
    --sumi: #2b2b2b;
    --sumi-soft: #4a4a45;
    --aizome: #2c4a6e;
    --aizome-deep: #1c324c;
    --shuiro: #b5451c;
    --kincha: #a9781f;
    --moss: #5f6f4e;
    --line: rgba(43,43,43,0.16);
    --card-shadow: 0 18px 40px rgba(43,30,10,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(169,120,31,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(44,74,110,0.10), transparent 55%),
      var(--washi);
    font-family: "Noto Sans JP", sans-serif;
    color: var(--sumi);
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 22px; }
  .eyebrow{ font-size: 12px; letter-spacing: 0.35em; color: var(--kincha); font-weight:700; }
  h1{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 34px);
    margin: 6px 0 4px;
    letter-spacing: 0.04em;
  }
  .sub{ font-size: 13px; color: var(--sumi-soft); }

  .account-bar{
    display:flex; justify-content:center; align-items:center; gap:10px;
    margin-top: 10px; font-size: 13px; color: var(--sumi-soft);
  }
  .account-bar .name-pill{
    font-family: "Shippori Mincho", serif;
    font-weight:700;
    color: var(--aizome-deep);
    background: rgba(44,74,110,0.08);
    padding: 3px 12px;
    border-radius: 20px;
  }
  .switch-link{
    font-size:12px; color: var(--shuiro); background:none; border:none;
    text-decoration:underline; cursor:pointer; font-family:inherit;
  }

  /* culture rail: the cultural-history analogue of the year timeline */
  .culture-rail{ margin: 18px auto 0; max-width: 660px; position: relative; height: 30px; }
  .culture-rail .rail{
    position:absolute; left:0; right:0; top:15px; height:2px;
    background: linear-gradient(90deg, var(--aizome), var(--kincha) 50%, var(--shuiro));
    opacity:0.35;
  }
  .culture-rail .dot{
    position:absolute; top:10px; width:7px; height:7px; border-radius:50%;
    background: var(--sumi); opacity:0.18; transform: translateX(-50%); transition: all .25s ease;
  }
  .culture-rail .dot.current{
    width:13px; height:13px; top:7px; background: var(--shuiro); opacity:1;
    box-shadow: 0 0 0 4px rgba(181,69,28,0.18);
  }
  .culture-rail .era-label{ position:absolute; top:-3px; font-size:10px; color: var(--sumi-soft); transform: translateX(-50%); white-space:nowrap; }

  .card{
    background: #faf6ec; border: 1px solid var(--line); border-radius: 4px;
    box-shadow: var(--card-shadow); padding: 30px 26px 26px; margin-top: 26px; position: relative;
  }
  .card::before{
    content:""; position:absolute; left:14px; right:14px; top:8px; bottom:8px;
    border: 1px solid rgba(169,120,31,0.28); border-radius: 2px; pointer-events:none;
  }
  .center-card{ text-align:center; }

  /* ---- Home / dashboard ---- */
  .stat-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(76px,1fr)); gap:10px; margin: 18px 0 22px;
  }
  .stat-box{
    background:#fff; border:1px solid var(--line); border-radius:3px; padding: 14px 8px;
  }
  .stat-box .num{ font-family:"Shippori Mincho", serif; font-size:26px; font-weight:800; color: var(--aizome-deep); }
  .stat-box .label{ font-size:11px; color: var(--sumi-soft); margin-top:2px; }

  .weak-list{ text-align:left; margin-top: 10px; }
  .weak-list h3{
    font-family:"Shippori Mincho", serif; font-size:15px; color: var(--sumi);
    border-bottom: 1px solid var(--line); padding-bottom:6px; margin-bottom:10px;
  }
  .weak-row{
    display:flex; justify-content:space-between; gap:10px; align-items:center;
    font-size:13px; padding: 7px 0; border-bottom: 1px dashed var(--line);
  }
  .weak-row.clickable{ cursor:pointer; }
  .weak-row.clickable:hover{ background: rgba(44,74,110,0.05); }
  .weak-row .wi{ flex:1; }
  .weak-row .wy{ color: var(--aizome-deep); font-weight:700; white-space:nowrap; font-size:12px; }
  .weak-row .wp{ width:76px; text-align:right; font-weight:700; white-space:nowrap; }
  .weak-row .wp.low{ color: var(--shuiro); }
  .weak-row .wp.mid{ color: var(--kincha); }
  .weak-row .wp.high{ color: var(--moss); }

  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top: 8px; }

  .star-btn{
    border: 1.5px solid var(--line); background: #fff; border-radius: 3px; cursor: pointer;
    font-size: 18px; line-height:1; padding: 9px 12px; color: var(--kincha);
    display:inline-flex; align-items:center; gap:6px;
    font-family: "Noto Sans JP", sans-serif; transition: all .12s ease;
  }
  .star-btn:hover{ border-color: var(--kincha); background: rgba(169,120,31,0.08); }
  .star-btn.active{ background: rgba(169,120,31,0.14); border-color: var(--kincha); color: var(--kincha); font-weight:700; }
  .star-btn .lbl{ font-size:12px; }

  .search-btn{
    border: 1.5px solid var(--line); background: #fff; border-radius: 3px; cursor: pointer;
    font-size: 15px; line-height:1; padding: 9px 10px; color: var(--aizome-deep);
    display:inline-flex; align-items:center; gap:5px;
    font-family: "Noto Sans JP", sans-serif; transition: all .12s ease;
  }
  .search-btn:hover{ border-color: var(--aizome); background: rgba(44,74,110,0.08); }
  .search-btn .lbl{ font-size:12px; }
  .review-item .search-btn{ position:absolute; top:8px; right:44px; padding: 5px 8px; font-size:14px; }

  .speak-btn{
    border: 1.5px solid var(--line); background: #fff; border-radius: 3px; cursor: pointer;
    font-size: 15px; line-height:1; padding: 9px 10px; color: var(--moss);
    display:inline-flex; align-items:center; gap:5px;
    font-family: "Noto Sans JP", sans-serif; transition: all .12s ease;
  }
  .speak-btn:hover{ border-color: var(--moss); background: rgba(95,111,78,0.08); }
  .speak-btn .lbl{ font-size:12px; }
  .speak-btn.active{ background: rgba(95,111,78,0.16); border-color: var(--moss); }

  .autoread-toggle{
    display:flex; align-items:center; gap:6px; justify-content:center;
    font-size:12.5px; color: var(--sumi-soft); margin: 6px 0 12px;
  }

  .review-item{ position:relative; }
  .review-item .star-btn{ position:absolute; top:8px; right:8px; padding: 5px 8px; font-size:15px; }

  .fav-empty{ font-size:13px; color: var(--sumi-soft); padding: 20px 0; }

  .mode-toggle{ display:flex; gap:8px; margin: 4px 0 10px; justify-content:center; flex-wrap:wrap; }
  .mode-btn{
    flex:1; min-width: 150px; max-width: 260px;
    font-family: "Shippori Mincho", serif; font-size: 13.5px; font-weight:700;
    padding: 10px 8px; border-radius: 3px; border: 1.5px solid var(--line);
    background: #fff; color: var(--sumi-soft); cursor:pointer; transition: all .12s ease;
  }
  .mode-btn:hover{ border-color: var(--aizome); }
  .mode-btn.active{ background: var(--aizome); border-color: var(--aizome); color: #faf6ec; }

  .kanji-input-row{ margin-top:8px; }
  .kanji-input{
    width:100%; box-sizing:border-box;
    font-family:"Shippori Mincho", serif; font-size:18px;
    padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 3px;
    color: var(--sumi);
  }
  .kanji-input:focus{ outline:none; border-color: var(--aizome); }
  .kanji-reveal-btn{
    width:100%; margin-top:10px;
    font-family:"Shippori Mincho", serif; font-size:15px; font-weight:700;
    padding:13px 10px; border-radius:3px; border:none;
    background: var(--kincha); color:#fff; cursor:pointer;
  }
  .kanji-reveal-btn:hover{ background: var(--shuiro); }
  .kanji-reveal-box{
    margin-top:10px; padding:14px 16px; border:1.5px solid var(--kincha);
    border-radius:3px; background: rgba(169,120,31,0.06);
  }
  .kanji-reveal-box .kanji-your-answer{ font-size:12px; color: var(--sumi-soft); margin-bottom:8px; }
  .kanji-reveal-box .kanji-answer{
    font-family:"Shippori Mincho", serif; font-size:18px; font-weight:700;
    color: var(--sumi); line-height:1.6; margin-bottom:8px;
  }
  .kanji-selfgrade-row{ display:flex; gap:10px; margin-top:12px; }
  .kanji-grade-btn{
    flex:1; font-family:"Shippori Mincho", serif; font-size:15px; font-weight:700;
    padding:13px 10px; border-radius:3px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; transition: all .12s ease;
  }
  .kanji-grade-btn.correct{ color: var(--moss); border-color: var(--moss); }
  .kanji-grade-btn.correct:hover, .kanji-grade-btn.correct.active{ background: rgba(95,111,78,0.15); }
  .kanji-grade-btn.wrong{ color: var(--shuiro); border-color: var(--shuiro); }
  .kanji-grade-btn.wrong:hover, .kanji-grade-btn.wrong.active{ background: rgba(181,69,28,0.12); }
  .kanji-grade-btn:disabled{ opacity:0.55; cursor:default; }
  .kanji-grade-note{ font-size:11.5px; color: var(--sumi-soft); margin-top:4px; text-align:center; }

  .big-btn{
    font-family: "Shippori Mincho", serif; font-size: 18px; font-weight: 800; letter-spacing: 0.1em;
    padding: 16px 40px; border-radius: 3px; border: none; color: #faf6ec;
    background: var(--shuiro); cursor: pointer; box-shadow: 0 8px 18px rgba(181,69,28,0.28);
  }
  .big-btn:hover{ background: var(--aizome-deep); box-shadow: 0 8px 18px rgba(44,74,110,0.28); }
  .ghost-btn{
    font-family: "Shippori Mincho", serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
    padding: 12px 20px; border-radius: 3px; border: 1.5px solid var(--aizome); color: var(--aizome-deep);
    background: transparent; cursor:pointer;
  }
  .ghost-btn:hover{ background: rgba(44,74,110,0.08); }

  /* ---- Quiz ---- */
  .qtype-tag{ display:inline-block; font-size: 11px; letter-spacing: 0.12em; color: #fff; background: var(--aizome); padding: 3px 10px; border-radius: 2px; margin-bottom: 14px; }
  .qtype-tag.fmt-b{ background: var(--shuiro); }

  .question-lead{ font-size:12.5px; color: var(--sumi-soft); margin-bottom:6px; }
  .question-text{
    font-family: "Shippori Mincho", serif; font-size: clamp(17px, 4.4vw, 22px); font-weight: 600;
    line-height: 1.7; color: var(--sumi); margin-bottom: 22px;
  }
  .question-text .term-big{ font-size: 1.18em; color: var(--aizome-deep); font-weight:800; }

  .choices{ display:grid; gap: 10px; }
  .choice-btn{
    text-align:left; font-family: inherit; font-size: 15.5px; padding: 14px 16px; border-radius: 3px;
    border: 1.5px solid var(--line); background: #fff; cursor:pointer; color: var(--sumi);
    transition: all .12s ease; line-height:1.5;
  }
  .choice-btn:hover:not(:disabled){ border-color: var(--aizome); background: #f2f1ea; }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color: var(--moss); background: rgba(95,111,78,0.14); font-weight:700; }
  .choice-btn.wrong{ border-color: var(--shuiro); background: rgba(181,69,28,0.10); text-decoration: line-through; opacity:0.75; }

  .feedback-box{ margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--kincha); background: rgba(169,120,31,0.08); font-size: 14px; line-height:1.8; display:none; text-align:left; }
  .feedback-box.show{ display:block; }
  .feedback-box .fb-term{ font-family:"Shippori Mincho", serif; font-weight:700; color: var(--aizome-deep); font-size:16px; }
  .feedback-box .fb-note{ font-size:13px; color: var(--sumi-soft); display:block; margin-top:6px; }

  .next-btn{
    margin-top: 20px; display:none; width:100%; padding: 14px; font-family: "Shippori Mincho", serif;
    font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #faf6ec; background: var(--sumi);
    border: none; border-radius: 3px; cursor:pointer;
  }
  .next-btn.show{ display:block; }
  .next-btn:hover{ background: var(--aizome-deep); }

  .result-score{ font-family:"Shippori Mincho", serif; font-size: 52px; font-weight: 800; color: var(--aizome-deep); margin: 8px 0 2px; }
  .result-score span{ font-size: 22px; color: var(--sumi-soft); font-weight:500;}
  .result-comment{ font-size:14px; color: var(--kincha); font-weight:600; margin-bottom: 22px;}

  .review-list{ text-align:left; margin-top: 10px; display:grid; gap: 10px; }
  .review-item{
    border: 1px solid var(--line); border-left: 4px solid var(--shuiro); background:#fff;
    padding: 10px 84px 10px 14px; border-radius: 2px; font-size: 13px; line-height:1.7;
  }
  .review-item.ok{ border-left-color: var(--moss); }
  .review-item .ritem{ font-weight:700; }
  .review-item .ryear{ color: var(--aizome-deep); font-weight:700; }

  footer{ text-align:center; margin-top: 30px; font-size:11px; color: var(--sumi-soft); opacity:0.6; }

  .len-toggle{ display:flex; gap:8px; margin: 4px 0 6px; flex-wrap:wrap; }
  .len-btn{
    flex:1; min-width:92px; font-family:"Shippori Mincho", serif; font-size:13px; font-weight:700;
    padding: 10px 6px; border-radius:3px; border:1.5px solid var(--line);
    background:#fff; color: var(--sumi-soft); cursor:pointer; transition: all .12s ease;
  }
  .len-btn:hover{ border-color: var(--kincha); }
  .len-btn.warn{ border-color: var(--shuiro); color: var(--shuiro); }
  .len-btn.warn:hover{ background: rgba(181,69,28,0.07); }
  .len-btn:disabled{ opacity:0.4; cursor:default; }
  .study-mode-btn{
    width:100%; margin: 8px 0 14px;
    font-family:"Shippori Mincho", serif; font-size:14.5px; font-weight:700;
    padding: 11px 10px; border-radius:3px; border:1.5px solid var(--moss);
    background: rgba(95,111,78,0.06); color: var(--moss); cursor:pointer; transition: all .12s ease;
  }
  .study-mode-btn:hover{ background: rgba(95,111,78,0.14); }
  .shortage-note{ font-size:11.5px; color: var(--shuiro); margin: 4px 0 10px; text-align:center; line-height:1.7; }
  .hint-note{ font-size:11.5px; color: var(--sumi-soft); margin: 4px 0 10px; text-align:center; line-height:1.7; }

  /* ---- range selector (imp + category) ---- */
  .range-panel{ border: 1.5px dashed var(--line); border-radius:4px; padding:14px; margin: 4px 0 14px; text-align:left; }
  .range-panel-title{ font-family:"Shippori Mincho", serif; font-size:13.5px; font-weight:700; color: var(--sumi); margin-bottom:8px; }
  .imp-seg{ display:flex; gap:0; margin-bottom:10px; border:1.5px solid var(--line); border-radius:3px; overflow:hidden; }
  .imp-seg button{
    flex:1; font-family:"Noto Sans JP",sans-serif; font-size:12.5px; font-weight:700;
    padding:9px 4px; border:none; background:#fff; color: var(--sumi-soft); cursor:pointer;
    border-right:1px solid var(--line);
  }
  .imp-seg button:last-child{ border-right:none; }
  .imp-seg button.active{ background: var(--kincha); color:#faf6ec; }
  .cat-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .cat-chip{
    font-family:"Noto Sans JP",sans-serif; font-size:12px; padding:7px 11px;
    border-radius:16px; border:1.5px solid var(--line); background:#fff;
    color: var(--sumi-soft); cursor:pointer; transition: all .12s ease;
  }
  .cat-chip:hover{ border-color: var(--aizome); }
  .cat-chip.active{ background: var(--aizome); border-color: var(--aizome); color:#faf6ec; }
  .cat-chip .cnt{ font-size:11px; opacity:0.8; margin-left:3px; }
  .range-summary{ font-size:12px; color: var(--sumi-soft); margin-top:10px; }
  .range-summary b{ color: var(--aizome-deep); font-size:14px; }

  /* ---- mastery bars ---- */
  .era-bars{ text-align:left; margin-top:14px; }
  .era-bars h3{
    font-family:"Shippori Mincho", serif; font-size:15px; color: var(--sumi);
    border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:10px;
  }
  .era-bars .scope-note{ font-size:11px; color: var(--sumi-soft); font-weight:400; }
  .era-bar-row{ margin-bottom:9px; }
  .era-bar-row .ebr-label{ display:flex; justify-content:space-between; font-size:12px; color: var(--sumi-soft); margin-bottom:3px; }
  .era-bar-track{ display:flex; height:10px; border-radius:5px; overflow:hidden; background:#e9e3d2; }
  .era-bar-seg.mastered{ background: var(--aizome); }
  .era-bar-seg.flagged{ background: var(--shuiro); }
  .era-bar-seg.partial{ background: var(--kincha); }
  .era-bar-seg.none{ background: transparent; }
  .bar-legend{ font-size:11px; color: var(--sumi-soft); margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; }
  .bar-legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }

  /* ---- in-quiz progress bar & KP gauge ---- */
  .progress-track{ height:7px; border-radius:4px; background:#e9e3d2; overflow:hidden; margin-bottom:10px; }
  .progress-fill{ height:100%; background: var(--aizome); }
  .stat-strip{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px 14px;
    font-size:12px; color: var(--sumi-soft); margin-bottom:10px;
  }
  .stat-strip b{ color: var(--aizome-deep); }
  .kp-gauge{ letter-spacing:3px; font-size:14px; color: var(--kincha); }
  .hurdle-note{ font-size:11.5px; color: var(--shuiro); margin:-4px 0 10px; }

  /* ---- back/forward nav ---- */
  .nav-row{ display:flex; justify-content:space-between; gap:10px; margin-top:14px; }
  .nav-btn{
    font-family:"Shippori Mincho", serif; font-size:13px; font-weight:700;
    padding:9px 14px; border-radius:3px; border:1.5px solid var(--line);
    background:#fff; color: var(--sumi-soft); cursor:pointer;
  }
  .nav-btn:hover:not(:disabled){ border-color: var(--aizome); color: var(--aizome-deep); }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .review-banner{
    font-size:12px; color: var(--shuiro); background: rgba(181,69,28,0.08);
    border:1px solid var(--shuiro); border-radius:3px; padding:6px 10px; margin-bottom:10px; text-align:center;
  }

  /* ---- results category table ---- */
  .filter-row{ display:flex; gap:8px; margin: 10px 0; flex-wrap:wrap; }
  .filter-row select{
    font-family:"Noto Sans JP", sans-serif; font-size:12.5px; padding:6px 8px;
    border:1.5px solid var(--line); border-radius:3px; background:#fff; color: var(--sumi);
  }
  .kp-table-wrap{ overflow-x:auto; }
  .kp-table{ width:100%; border-collapse:collapse; font-size:12px; text-align:left; }
  .kp-table th{
    font-family:"Shippori Mincho", serif; font-weight:700; color: var(--sumi-soft);
    border-bottom:1.5px solid var(--line); padding:6px 6px; white-space:nowrap;
  }
  .kp-table td{ border-bottom:1px solid var(--line); padding:6px 6px; vertical-align:top; }
  .kp-table tr.flagged td{ background: rgba(181,69,28,0.06); }
  .kp-table tr.kp-main{ cursor:pointer; }
  .kp-table tr.kp-main:hover td{ background: rgba(44,74,110,0.05); }
  .kp-table tr.kp-detail td{ background: rgba(169,120,31,0.06); font-size:11.5px; line-height:1.9; color: var(--sumi-soft); }
  .kp-badge{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:10px;
    background: rgba(181,69,28,0.14); color: var(--shuiro); margin-left:4px;
  }
  .kp-badge.warn2{ background: rgba(181,69,28,0.26); }
  .kp-badge.imp{ background: rgba(169,120,31,0.16); color: var(--kincha); }
  .kp-badge.postm{ background: rgba(181,69,28,0.14); color: var(--shuiro); }
  .csv-btn{
    font-family:"Shippori Mincho", serif; font-size:14px; font-weight:700;
    padding:12px 18px; border-radius:3px; border:1.5px solid var(--moss); color: var(--moss);
    background:#fff; cursor:pointer;
  }
  .csv-btn:hover{ background: rgba(95,111,78,0.08); }

  .attn-badge{
    display:inline-block; font-family:"Shippori Mincho",serif; font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:20px; border:1.5px solid var(--shuiro);
    color: var(--shuiro); background: rgba(181,69,28,0.07); cursor:pointer; margin-bottom:10px;
  }
  .attn-badge:hover{ background: rgba(181,69,28,0.15); }
  .attn-badge:disabled{ opacity:0.45; cursor:default; }

  /* ---- study mode ---- */
  .study-tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .study-tab{

{i:"e05",c:4,t:"国風文化",y:"こくふうぶんか",d:"遣唐使の停止をきっかけに、日本の風土や生活に合わせて育った、優雅な貴族の文化",k:"period",a:"平安時代（中期〜後期）",p:2},
{i:"e06",c:4,t:"鎌倉文化",y:"かまくらぶんか",d:"質実剛健で写実的。日宋貿易による宋文化と、伝統的な貴族文化が合わさった文化",k:"period",a:"鎌倉時代",p:2},

// §4-1 適応ハードル：累計誤答が多いKPほど、習得に必要な連続正解数が増える
function requiredStreak(item){
  const w = (item && item.totalWrong) || 0;
  if (w >= 6) return 4;
  if (w >= 3) return 3;
  return 2;
}

// KP の索引（idで引く）

Object.keys(POOL).forEach(k=>{ USED_ATTR[k] = new Set(); });

function blankItemStat(){
  return {
    streak: 0, mastered: false, masteredAt: null, postMasterWrong: 0, lastFormat: null,
    totalCorrect: 0, totalWrong: 0,
    byFormat: { A: {correct:0, wrong:0}, B: {correct:0, wrong:0} },
    wrongLog: [], lastSeenAt: null, favorite: false,
  };
}
function blankAccountProgress(){ return { items: {}, sessions: [] }; }
function blankStore(){ return { app: APP_ID, version: 2, updatedAt: null, accounts: [], progress: {} }; }

function normalizeItemStat(it){
  const b = blankItemStat();
  if(!it || typeof it !== "object" || Array.isArray(it)) return b;
  b.streak = Number(it.streak) || 0;
  b.mastered = !!it.mastered;
  b.masteredAt = it.masteredAt || null;
  b.postMasterWrong = Number(it.postMasterWrong) || 0;
  b.lastFormat = (it.lastFormat === "A" || it.lastFormat === "B") ? it.lastFormat : null;
  b.totalCorrect = Number(it.totalCorrect) || 0;
  b.totalWrong = Number(it.totalWrong) || 0;
  const bf = it.byFormat || {};
  ["A","B"].forEach(f=>{
    const s = bf[f] || {};
    b.byFormat[f] = { correct: Number(s.correct)||0, wrong: Number(s.wrong)||0 };
  });
  b.wrongLog = Array.isArray(it.wrongLog) ? it.wrongLog.filter(w=>w && typeof w === "object").slice(-WRONG_LOG_MAX) : [];
  b.lastSeenAt = it.lastSeenAt || null;
  b.favorite = !!it.favorite;
  return b;
}
function normalizeProgress(p){
  if(!p) return blankAccountProgress();
  const rawItems = (p.items && typeof p.items === "object") ? p.items : {};
  const items = {};
  Object.keys(rawItems).forEach(id=>{
    // 壊れたクラウドJSONや旧データで画面が真っ白になるより、そのKPだけ捨てるほうがよい
    if(rawItems[id] && typeof rawItems[id] === "object" && !Array.isArray(rawItems[id])){
      items[id] = normalizeItemStat(rawItems[id]);
    }
  });
  return { items, sessions: Array.isArray(p.sessions) ? p.sessions.filter(s=>s && typeof s === "object") : [] };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function otherFormat(f){ return f === "A" ? "B" : "A"; }
function nowIso(){ return new Date().toISOString(); }
function todayStamp(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function openGoogleSearch(query){ window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank", "noopener"); }
function formatDateJP(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

// =====================================================================
// 音声読み上げ（追加仕様書 v1.0 の実装をそのまま移植）
// =====================================================================
function speechAvailable(){ return typeof window.speechSynthesis !== "undefined"; }
let CACHED_VOICES = [];
function refreshVoiceCache(){
  if(!speechAvailable()) return;
  try{ CACHED_VOICES = window.speechSynthesis.getVoices() || []; }catch(e){}
}
if(speechAvailable()){
  refreshVoiceCache();
  try{ window.speechSynthesis.onvoiceschanged = refreshVoiceCache; }catch(e){}
}
function pickJapaneseVoice(){
  if(!CACHED_VOICES.length) refreshVoiceCache();
  const ja = CACHED_VOICES.filter(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
  if(!ja.length) return null;
  return ja.find(v => /Google/i.test(v.name))
      || ja.find(v => /Kyoko|O-Ren|Otoya|Siri/i.test(v.name))
      || ja.find(v => v.localService === false)
      || ja[0];
}
let SPEECH_GEN = 0;
const SPEECH_CHUNK_THRESHOLD = 60;
function speak(text){
  if(!speechAvailable() || !text) return;
  try{
    window.speechSynthesis.cancel();
    const myGen = ++SPEECH_GEN;
    const voice = pickJapaneseVoice();
    let chunks = text.length > SPEECH_CHUNK_THRESHOLD
      ? text.split(/(?<=[。、！？])/).map(s=>s.trim()).filter(Boolean)
      : [text];
    if(!chunks.length) chunks = [text];
    let i = 0;
    function speakNext(){
      if(myGen !== SPEECH_GEN) return; // 新しい speak()/cancel に追い越された
      if(i >= chunks.length) return;
      const chunk = chunks[i];
      const u = new SpeechSynthesisUtterance(chunk);
      u.lang = "ja-JP";
      if(voice) u.voice = voice;
      u.rate = 1.2;
      u.pitch = 1.0;
      let advanced = false;
      const advance = ()=>{
        if(advanced || myGen !== SPEECH_GEN) return;
        advanced = true; i++; speakNext();
      };
      u.onend = advance;
      u.onerror = advance;
      // onend が発火しない端末があるため、文字数から見積もった時間で強制的に次へ進める保険
      setTimeout(advance, Math.max(700, chunk.length * 220));
      window.speechSynthesis.speak(u);
    }
    speakNext();
  }catch(e){ /* 読み上げは best-effort。クイズを壊さない */ }
}
function stopSpeaking(){
  SPEECH_GEN++;
  if(speechAvailable()){ try{ window.speechSynthesis.cancel(); }catch(e){} }
}
// タブレット/スマホでは pause() が発話を殺してしまうため、キープアライブはデスクトップのみ
function isMobileLikeDevice(){
  try{
    const ua = navigator.userAgent || "";
    const isTouchMac = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
    return /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua) || isTouchMac;
  }catch(e){ return false; }
}
if(speechAvailable() && !isMobileLikeDevice()){
  setInterval(()=>{
    try{
      if(window.speechSynthesis.speaking && !window.speechSynthesis.paused){
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }
    }catch(e){}
  }, 4000);
}

function impPass(kp){
  if(UI.impFilter === "2") return kp.p === 2;

  return true;

// =====================================================================
// 問題の組み立て
// =====================================================================
// 形式A：説明 → 名称。誤答は「まぎらわしい相手（x）」を優先し、残りは同カテゴリーから。
// 形式B：名称 → 文化区分・宗派・時代。誤答は同じ種類のプールから。
// どちらも正解と同じ意味になる選択肢は混ぜない（§19-30）。
function materializeQuestion(id, format){
  const kp = BY_ID[id];
  let choices, correctIdx;
  if(format === "A"){
    const opts = [kp.t];
    const seen = new Set([kp.t]);
    (kp.x || []).forEach(tt=>{ if(opts.length<4 && BY_ID_BY_TERM[tt] && !seen.has(tt)){ seen.add(tt); opts.push(tt); } });
    const sameCat = shuffle(DATA.filter(o=>o.c===kp.c && o.i!==kp.i).map(o=>o.t));
    const anyOther = shuffle(DATA.filter(o=>o.i!==kp.i).map(o=>o.t));
    [...sameCat, ...anyOther].forEach(tt=>{ if(opts.length<4 && !seen.has(tt)){ seen.add(tt); opts.push(tt); } });
    const arranged = shuffle(opts.map(o=>({text:o, isCorrect:o===kp.t})));
    choices = arranged.map(o=>o.text);
    correctIdx = arranged.findIndex(o=>o.isCorrect);
  } else {
    const opts = [kp.a];
    const seen = new Set([kp.a]);
    // まず「実際にこのツールで使われている値」から、次にプール全体から補う
    const used = shuffle(Array.from(USED_ATTR[kp.k] || []));
    const all = shuffle((POOL[kp.k] || []).slice());
    [...used, ...all].forEach(v=>{ if(opts.length<4 && !seen.has(v)){ seen.add(v); opts.push(v); } });
    const arranged = shuffle(opts.map(o=>({text:o, isCorrect:o===kp.a})));
    choices = arranged.map(o=>o.text);
    correctIdx = arranged.findIndex(o=>o.isCorrect);
  }
  return { id, format, kp, choices, correctIdx, answerText: format === "A" ? kp.t : kp.a };
}
const BY_ID_BY_TERM = {};
DATA.forEach(kp=>{ BY_ID_BY_TERM[kp.t] = kp; });

function questionPrompt(m){

  return `${m.kp.t} は、どの${KIND_Q[m.kp.k]}か。`;

function questionSpeech(m){

  return `${m.kp.t} は、どの${KIND_Q[m.kp.k]}ですか。`;

}

// =====================================================================
// セッションの組み立て（§3-1〜§3-3）
// =====================================================================
function selectSessionKPs(mode, progress){
  const scope = scopedKPs();
  if(mode === "all") return scope.map(kp=>kp.i);
  if(mode === "review") return scope.filter(kp=>isAttention(progress, kp.i)).map(kp=>kp.i);
  const n = mode === "10q" ? 10 : 20;
  const candidates = scope.filter(kp=>!isMastered(progress, kp.i)).map(kp=>kp.i);
  candidates.sort((a,b)=>{
    const sa = progress.items[a], sb = progress.items[b];
    const wa = sa ? sa.totalWrong : 0, wb = sb ? sb.totalWrong : 0;
    if(wb !== wa) return wb - wa;                       // ① 誤答が多い順
    const seenA = sa && sa.lastSeenAt, seenB = sb && sb.lastSeenAt;
    if(!seenA && seenB) return -1;                      // ② 未出題を先に
    if(seenA && !seenB) return 1;
    if(!seenA && !seenB) return BY_ID[a]._idx - BY_ID[b]._idx;
    return new Date(seenA) - new Date(seenB);           // ③ 最終出題が古い順
  });
  return candidates.slice(0, n);
}
function buildInitialProblems(mode, ids, progress){
  if(mode === "all"){
    // 全問モードは 1KP=1問。形式は lastFormat と異なる方を優先（§3-2）
    return shuffle(ids.map(id=>{
      const s = progress.items[id];
      const fmt = (s && s.lastFormat) ? otherFormat(s.lastFormat) : (Math.random()<0.5?"A":"B");
      return { id, format: fmt };
    }));
  }
  // 10問／20問／再確認は形式A・Bの両方を出す
  let problems = [];
  ids.forEach(id=>{ problems.push({id, format:"A"}); problems.push({id, format:"B"}); });
  problems = shuffle(problems);
  for(let i=1;i<problems.length;i++){
    if(problems[i].id === problems[i-1].id){
      for(let j=i+1;j<problems.length;j++){
        if(problems[j].id !== problems[i-1].id && problems[j].id !== problems[i].id){
          [problems[i], problems[j]] = [problems[j], problems[i]];
          break;
        }
      }
    }
  }
  return problems;
}

// =====================================================================
// 採点（§4・§9）
// =====================================================================
// isReviewMode=true（再確認モード）では、誤答時に postMasterWrong を増やす以外の
// 状態変更を行わない（§3-3）。習得判定・streak・totalWrong を汚さないため。
function applyAnswer(progress, id, format, correct, answeredText, isReviewMode){
  const s = getItemStat(progress, id);
  const wasMastered = s.mastered;

  if(isReviewMode){
    if(correct){
      s.byFormat[format].correct++;
      s.totalCorrect++;
      s.lastFormat = format;
      s.lastSeenAt = nowIso();
    } else {
      s.postMasterWrong++; // これ以外は一切変えない
    }
    return { newlyMastered: false };
  }

  s.byFormat[format][correct ? "correct" : "wrong"]++;
  if(correct){
    s.totalCorrect++;
    // 連続正解は必ず異なる出題形式でなければ進めない（§4-1）
    if(s.lastFormat !== format) s.streak++;
    if(!s.mastered && s.streak >= requiredStreak(s)){
      s.mastered = true;
      s.masteredAt = nowIso();
    }
  } else {
    s.totalWrong++;
    s.streak = 0;
    // 習得は降格しない。習得後の誤答は postMasterWrong で「要注意習得」にする（§4-2）
    if(s.mastered) s.postMasterWrong++;
    s.wrongLog.push({at: nowIso(), format, answered: answeredText});
    if(s.wrongLog.length > WRONG_LOG_MAX) s.wrongLog.shift();
  }
  s.lastFormat = format;
  s.lastSeenAt = nowIso();
  return { newlyMastered: !wasMastered && s.mastered };
}

// =====================================================================
// セッション操作
// =====================================================================
function modeLabel(mode){
  if(mode === "10q") return "10問";
  if(mode === "20q") return "20問";
  if(mode === "review") return "再確認";
  return "全問";
}
function startSession(mode){
  if(!loggedIn()){ state.screen = "gate"; return; }
  const committed = getCommittedStats(state.accountId);
  const pendingProgress = deepClone(committed);
  const ids = selectSessionKPs(mode, committed);
  if(!ids.length){
    state.modal = { type: "noTarget", mode };
    return;
  }
  const requested = (mode === "10q") ? 10 : (mode === "20q") ? 20 : ids.length;
  const shortage = (mode === "10q" || mode === "20q") && ids.length < requested;
  const problems = buildInitialProblems(mode, ids, pendingProgress);
  const appearanceCount = {};
  ids.forEach(id=>{ appearanceCount[id] = (mode === "all") ? 1 : 2; });

  state.session = {
    mode, answerMode: UI.quizMode,
    isReviewMode: mode === "review",
    startedAt: nowIso(),
    pendingProgress,
    kpTotal: ids.length,
    shortage, requested,
    scopeLabel: rangeLabelText(),
    questions: problems,
    qIndex: 0,
    reviewIndex: null,
    score: 0,
    wrongCount: 0,
    log: [],
    appearanceCount,
    overCap: new Set(),          // 再出題上限を超えてスキップしたKP（結果画面で「要復習」）
    newlyMastered: new Set(),
    kanjiRevealedAt: {},         // {設問インデックス: 開示した瞬間の入力文字列}
  };
  state.screen = "quiz";
}
function scheduleRequeue(sess, fromLogIdx, id, lastUsedFormat, gap){
  if(sess.mode === "all") return null;                 // 全問モードは1周のみ（§3-2）
  const count = sess.appearanceCount[id] || 0;
  if(count >= MAX_APPEARANCES){ sess.overCap.add(id); return null; } // §5 上限4回
  // 再投入の基準位置は「答えた問題自体のキュー位置」であって、現在位置ではない（§5）。
  // やり直し（§6-1）のときは qIndex が1つ先に進んでいるので、基準を取りちがえないこと。
  const targetIdx = Math.min(Math.max(fromLogIdx + 1 + gap, sess.qIndex), sess.questions.length);
  sess.questions.splice(targetIdx, 0, { id, format: otherFormat(lastUsedFormat), fromLog: fromLogIdx });
  sess.appearanceCount[id] = count + 1;
  return targetIdx;
}
function removeScheduledRequeue(sess, logIdx){
  const i = sess.questions.findIndex(q => q.fromLog === logIdx);
  if(i !== -1 && i > sess.qIndex - 1){
    const removed = sess.questions.splice(i, 1)[0];
    sess.appearanceCount[removed.id] = Math.max(0, (sess.appearanceCount[removed.id]||1) - 1);
  }
}
function commitLiveAnswer(correct, answeredText){
  const sess = state.session;
  const q = sess.questions[sess.qIndex];
  const snapshotBefore = deepClone(getItemStat(sess.pendingProgress, q.id));
  const { newlyMastered } = applyAnswer(sess.pendingProgress, q.id, q.format, correct, answeredText, sess.isReviewMode);
  if(newlyMastered) sess.newlyMastered.add(q.id);
  if(correct) sess.score++; else sess.wrongCount++;

  let requeueIdx = null;
  if(!correct){
    requeueIdx = scheduleRequeue(sess, sess.qIndex, q.id, q.format, WRONG_REQUEUE_GAP);
  } else if(!newlyMastered && !isMastered(sess.pendingProgress, q.id)){
    requeueIdx = scheduleRequeue(sess, sess.qIndex, q.id, q.format, PARTIAL_REQUEUE_GAP);
  }
  sess.log.push({ id: q.id, format: q.format, correct, answeredText, snapshotBefore, requeueIdx });
  sess.qIndex++;
}
// 直前の1問だけ答え直せる（§6-1）。スナップショットから巻き戻して再計算する。
function redoAnswer(correct, answeredText){
  const sess = state.session;
  const j = sess.qIndex - 1;
  const old = sess.log[j];
  const q = sess.questions[j];

  sess.pendingProgress.items[q.id] = deepClone(old.snapshotBefore);
  if(old.correct) sess.score--; else sess.wrongCount--;
  if(old.requeueIdx !== null) removeScheduledRequeue(sess, j);

  const { newlyMastered } = applyAnswer(sess.pendingProgress, q.id, q.format, correct, answeredText, sess.isReviewMode);
  if(newlyMastered) sess.newlyMastered.add(q.id); else sess.newlyMastered.delete(q.id);
  if(correct) sess.score++; else sess.wrongCount++;

  let requeueIdx = null;
  if(!correct){
    requeueIdx = scheduleRequeue(sess, j, q.id, q.format, WRONG_REQUEUE_GAP);
  } else if(!newlyMastered && !isMastered(sess.pendingProgress, q.id)){
    requeueIdx = scheduleRequeue(sess, j, q.id, q.format, PARTIAL_REQUEUE_GAP);
  }
  sess.log[j] = { id: q.id, format: q.format, correct, answeredText, snapshotBefore: old.snapshotBefore, requeueIdx };
  sess.reviewIndex = null;
}
// 結果画面に到達したときだけ確定・記録し、直後に push する（§6-2・§11・§13-1）
function finishSession(){
  const sess = state.session;
  STORE.progress[state.accountId] = sess.pendingProgress;
  const acc = STORE.progress[state.accountId];
  acc.sessions = acc.sessions || [];
  const wrongKpIds = Array.from(new Set(sess.log.filter(l=>!l.correct).map(l=>l.id)));
  acc.sessions.push({
    startedAt: sess.startedAt,
    finishedAt: nowIso(),
    mode: modeLabel(sess.mode),
    correct: sess.score,
    wrong: sess.wrongCount,
    newlyMastered: Array.from(sess.newlyMastered),
    wrongKpIds,
    totalMastered: masteredCount(acc),
  });
  if(acc.sessions.length > SESSIONS_MAX) acc.sessions = acc.sessions.slice(-SESSIONS_MAX);
  saveStore();
  state.screen = "result";
  pushOnly();
}

function dbHasRecords(db){
  if(!db || !db.progress) return false;
  return Object.values(db.progress).some(acc=>{
    if(acc && acc.sessions && acc.sessions.length > 0) return true;
    if(!acc || !acc.items) return false;
    return Object.values(acc.items).some(it => (it.totalCorrect||0) + (it.totalWrong||0) > 0);
  });
}
function setSyncStatus(kind, message){
  state.syncStatus = { kind, message };
  if(state.screen === "home") render();
}
function classifySyncError(e){
  if(e && e.kind) return e;
  if(e instanceof Error) return { kind: "exception", message: e.message };
  return { kind: "network" };
}
function syncErrorMessage(e){
  switch(e.kind){
    case "network": return "オフライン（ローカルには保存済み）";
    case "auth": return "ログインが無効になりました。ポータルでログインし直してください";
    case "badkey": return "合言葉が違います";
    case "badresponse": return "GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください";
    case "exception": return "予期しないエラーが発生しました：" + (e.message || "詳細不明");
    default: return e.message || "同期エラーが発生しました";
  }
}
function handleSyncError(e){
  const c = classifySyncError(e);
  setSyncStatus("error", "☁⚠ " + syncErrorMessage(c));
  if(c.kind === "auth") onAuthLost();
}
// サーバーが auth を返したらログインだけ消す。学習記録は消さない（§12エラーの扱い）
function onAuthLost(){
  clearAuth();
  state.accountId = null;
  render();
}
async function api(body){
  let res;
  try{
    res = await fetch(SYNC.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // プリフライト回避（§12）
      body: JSON.stringify(Object.assign({ key: SYNC.key }, body)),
    });
  }catch(e){ throw { kind: "network" }; }
  let text;
  try{ text = await res.text(); }catch(e){ throw { kind: "network" }; }
  let json;
  try{ json = JSON.parse(text); }catch(e){ throw { kind: "badresponse" }; }
  if(!json.ok){
    const msg = String(json.error || "");
    const kind = msg === "auth" ? "auth" : /合言葉|key/i.test(msg) ? "badkey" : "servererror";
    throw { kind, message: msg };
  }
  return json;
}
// §13-2 合流ルール
function mergeItemStat(a, b){
  if(!a) return deepClone(b);
  if(!b) return deepClone(a);
  const mx = (x,y)=>Math.max(x||0, y||0);
  const fA = { correct: mx(a.byFormat&&a.byFormat.A.correct, b.byFormat&&b.byFormat.A.correct),
               wrong:   mx(a.byFormat&&a.byFormat.A.wrong,   b.byFormat&&b.byFormat.A.wrong) };
  const fB = { correct: mx(a.byFormat&&a.byFormat.B.correct, b.byFormat&&b.byFormat.B.correct),
               wrong:   mx(a.byFormat&&a.byFormat.B.wrong,   b.byFormat&&b.byFormat.B.wrong) };
  const mastered = !!(a.mastered || b.mastered);
  let masteredAt;
  if(a.masteredAt && b.masteredAt) masteredAt = (new Date(a.masteredAt) <= new Date(b.masteredAt)) ? a.masteredAt : b.masteredAt;
  else masteredAt = a.masteredAt || b.masteredAt || null;
  if(mastered && !masteredAt) masteredAt = nowIso();

  const seen = new Set();
  const wrongLog = [];
  [...(a.wrongLog||[]), ...(b.wrongLog||[])].forEach(w=>{
    const key = w.at + "|" + w.format;
    if(!seen.has(key)){ seen.add(key); wrongLog.push(w); }
  });
  wrongLog.sort((x,y)=> new Date(y.at) - new Date(x.at));
  const trimmedWrongLog = wrongLog.slice(0, WRONG_LOG_MAX).reverse();

  // ⚠ streak は「大きい方」ではなく、lastSeenAt が新しい側の値を採る（§13-2）。
  // max() にすると、端末Aで誤答して0になった streak が端末Bの古い2で復活してしまう。
  const aSeen = a.lastSeenAt ? new Date(a.lastSeenAt).getTime() : 0;
  const bSeen = b.lastSeenAt ? new Date(b.lastSeenAt).getTime() : 0;
  const newer = aSeen >= bSeen ? a : b;

  return {
    streak: newer.streak || 0,
    mastered, masteredAt,
    postMasterWrong: mx(a.postMasterWrong, b.postMasterWrong),
    lastFormat: newer.lastFormat || a.lastFormat || b.lastFormat || null,
    totalCorrect: mx(a.totalCorrect, b.totalCorrect),
    totalWrong: mx(a.totalWrong, b.totalWrong),
    byFormat: { A: fA, B: fB },
    wrongLog: trimmedWrongLog,
    lastSeenAt: newer.lastSeenAt || a.lastSeenAt || b.lastSeenAt || null,
    favorite: !!(a.favorite || b.favorite),
  };
}
function mergeAccountProgress(a, b){
  if(!a) return deepClone(b || blankAccountProgress());
  if(!b) return deepClone(a);
  const items = {};
  const allIds = new Set([...Object.keys(a.items||{}), ...Object.keys(b.items||{})]);
  allIds.forEach(id=>{ items[id] = mergeItemStat((a.items||{})[id], (b.items||{})[id]); });
  const seen = new Set();
  const sessions = [];
  [...(a.sessions||[]), ...(b.sessions||[])].forEach(s=>{
    if(!seen.has(s.finishedAt)){ seen.add(s.finishedAt); sessions.push(s); }
  });
  sessions.sort((x,y)=> new Date(y.finishedAt) - new Date(x.finishedAt));
  return { items, sessions: sessions.slice(0, SESSIONS_MAX).reverse() };
}
function syncSummaryMessage(prefix){
  const p = getCommittedStats(AUTH ? AUTH.id : null);
  return `${prefix}（習得 ${masteredCount(p)} / ${DATA.length}）`;
}
async function pullCloud(silent){
  if(!ready() || !AUTH) return;
  if(!silent) setSyncStatus("pending", "☁… クラウドと同期しています");
  try{
    const j = await api({ action: "fetch", app: APP_ID, id: AUTH.id, pw: AUTH.pw });
    const cloudProgress = normalizeProgress(((j.data||{}).progress||{})[AUTH.id]);
    const localProgress = getCommittedStats(AUTH.id);
    const before = JSON.stringify(localProgress);
    const merged = mergeAccountProgress(localProgress, cloudProgress);
    STORE.progress[AUTH.id] = merged;

    if(!STORE.accounts[0]) STORE.accounts[0] = { id: AUTH.id, name: AUTH.id, label: AUTH.label || AUTH.id, createdAt: nowIso() };
    if(j.label){ saveAuthLabel(j.label); STORE.accounts[0].label = j.label; } // label はクラウドが正（§13-2）
    const cloudAcc = (j.data||{}).accounts && j.data.accounts[0];
    if(cloudAcc && cloudAcc.createdAt) STORE.accounts[0].createdAt = cloudAcc.createdAt;

    saveStore({ fromCloud: true });
    SYNC.lastSync = nowIso(); saveSyncConfig();
    setSyncStatus("success", syncSummaryMessage("☁✓ クラウドと合流しました"));
    if(before !== JSON.stringify(merged)) await pushCloud(true, state.syncStatus.message); // 合流で変わったら直後にpush
  }catch(e){ handleSyncError(e); }
}
async function pushCloud(silent, okMsg){
  if(!ready() || !AUTH) return false;
  if(!silent) setSyncStatus("pending", "☁… 送信しています");
  try{
    if(!STORE.accounts[0]) STORE.accounts[0] = { id: AUTH.id, name: AUTH.id, label: AUTH.label || AUTH.id, createdAt: nowIso() };
    await api({
      action: "save", app: APP_ID, id: AUTH.id, pw: AUTH.pw,
      account: STORE.accounts[0],
      progress: getCommittedStats(AUTH.id),
    });
    SYNC.lastSync = nowIso(); saveSyncConfig();
    setSyncStatus("success", okMsg || "☁✓ クラウドに保存しました");
    return true;
  }catch(e){ handleSyncError(e); return false; }
}
async function pushOnly(){ await pushCloud(true, "☁✓ クラウド保存ずみ"); }
async function doSync(){ await pullCloud(false); }

function handleImportFile(file){
  if(!AUTH) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){
      state.modal = { type: "importMismatch", reason: "このファイルは読み込めませんでした（JSON形式が壊れています）。" };
      render(); return;
    }
    if(!parsed || parsed.app !== APP_ID){
      state.modal = { type: "importMismatch", reason: "このファイルは別のツール（または別バージョン）の記録データのようです。" };
      render(); return;
    }
    const myProgress = parsed.progress && parsed.progress[AUTH.id];
    if(!myProgress){
      state.modal = { type: "importMismatch", reason: `このファイルには ID ${AUTH.id} の記録が入っていません（別のお子さんの記録の可能性があります）。` };
      render(); return;
    }
    const has = dbHasRecords({ progress: { [AUTH.id]: myProgress } });
    state.modal = {
      type: "importConfirm",
      pendingProgress: normalizeProgress(myProgress),
      summary: `ID ${AUTH.id}：${has ? "記録あり" : "記録なし"}`,
      savedAt: parsed.updatedAt || "（不明）",
    };
    render();
  };
  reader.readAsText(file);
}

    accountBar.style.display = "none";

    const why = !ready() ? "クラウド同期がまだ設定されていません。" : "まだログインしていません。";
    app.innerHTML = `
      <div class="card center-card">
        <div class="qtype-tag">🔑 ポータルで準備してください</div>
        <div class="question-text">${why}</div>
        <p style="font-size:13px; color:var(--sumi-soft); line-height:1.9; text-align:left;">
          ポータル（トップページ）で<b>同期設定とログイン</b>を1回だけ行うと、すべての学習ツールがそのまま使えるようになります。
        </p>
        <ul style="text-align:left; font-size:12.5px; color:var(--sumi-soft); line-height:2; padding-left:1.3em;">
          <li>GASのURLと合言葉 … ポータルで入力</li>
          <li>ID（5桁）とパスワード … ポータルでログイン</li>
          <li>この画面に戻ってくれば、すぐ学習を始められます</li>
        </ul>
        <div class="btn-row">
          <a class="big-btn" style="display:block; text-decoration:none; text-align:center;" href="${portalURL()}">ポータルをひらく</a>
          <button class="ghost-btn" id="reloadAuthBtn">ログイン済みなら、ここを押して読み込み直す</button>
        </div>
      </div>`;
    document.getElementById('reloadAuthBtn').onclick = ()=>{
      loadAll();
      state.accountId = AUTH ? AUTH.id : null;
      state.screen = (ready() && loggedIn()) ? "home" : "gate";
      initialLoad();
    };
    return;
  }

  accountBar.style.display = "flex";
  document.getElementById('accountNamePill').textContent = `${accountName()}（${AUTH.id}）`;
  document.getElementById('switchAccountBtn').onclick = ()=>{
    if(state.screen === "quiz" && state.session && state.session.log.length){
      if(!confirmLeaveSession()) return;
      state.session = null; state.screen = "home"; render(); return;
    }
    window.location.href = portalURL();
  };

  if(state.screen === "home" || state.screen === "gate"){ renderHome(app); return; }
  if(state.screen === "quiz"){ renderQuiz(app); return; }
  if(state.screen === "result"){ renderResult(app); return; }
  if(state.screen === "favorites"){ renderFavorites(app); return; }
  if(state.screen === "study"){ renderStudy(app); return; }
}

// 習得バーは出題範囲の選択に関係なく、常に全KPで集計する（§3-5③）
function renderMasteryBars(progress){
  function bar(label, kps){
    if(!kps.length) return "";
    let m = 0, attn = 0, partial = 0;
    kps.forEach(kp=>{
      const s = progress.items[kp.i];
      if(s && s.mastered){ if((s.postMasterWrong||0) >= 1) attn++; else m++; }
      else if(s && (s.streak > 0)) partial++;
    });
    const total = kps.length;
    const none = total - m - attn - partial;
    const p = n => (n/total)*100;
    return `
      <div class="era-bar-row">
        <div class="ebr-label"><span>${esc(label)}</span><span>${m+attn} / ${total}（${Math.round(((m+attn)/total)*100)}%）</span></div>
        <div class="era-bar-track">
          <div class="era-bar-seg mastered" style="width:${p(m)}%"></div>
          <div class="era-bar-seg flagged" style="width:${p(attn)}%"></div>
          <div class="era-bar-seg partial" style="width:${p(partial)}%"></div>
          <div class="era-bar-seg none" style="width:${p(none)}%"></div>
        </div>
      </div>`;
  }
  let html = CATS.map((c,i)=>bar(c, DATA.filter(kp=>kp.c===i))).join("");
  html += `<div style="height:8px"></div>`;
  html += [2,1,0].map(v=>bar(`重要度 ${IMP_LABEL[v]}`, DATA.filter(kp=>kp.p===v))).join("");
  html += bar("総合", DATA);
  html += `<div class="bar-legend">
      <span><i style="background:var(--aizome)"></i>習得済み</span>
      <span><i style="background:var(--shuiro)"></i>要注意習得</span>
      <span><i style="background:var(--kincha)"></i>1回以上正解</span>
      <span><i style="background:#e9e3d2"></i>未着手・誤答</span>
    </div>`;
  return html;
}

function renderQuiz(app){
  const sess = state.session;
  const viewingReview = sess.reviewIndex !== null;
  const viewIdx = viewingReview ? sess.reviewIndex : sess.qIndex;
  const q = sess.questions[viewIdx];
  const logEntry = viewingReview ? sess.log[viewIdx] : null;
  const canRedo = viewingReview && viewIdx === sess.qIndex - 1;

  const progress = sess.pendingProgress;
  const m = materializeQuestion(q.id, q.format);
  const kp = m.kp;
  renderCultureRail(kp.k === "culture" ? kp.a : null);

  const useKanji = sess.answerMode === "kanji" && isKanjiTarget(q.format);
  const kanjiRevealedText = sess.kanjiRevealedAt[viewIdx];
  const kanjiRevealed = kanjiRevealedText !== undefined;

  const itemStat = progress.items[q.id];
  const need = requiredStreak(itemStat);
  const streakForGauge = (viewingReview && !canRedo) ? null : (itemStat ? itemStat.streak : 0);
  const gauge = streakForGauge === null ? "" :
    `<span class="kp-gauge">${"●".repeat(Math.min(streakForGauge, need))}${"○".repeat(Math.max(0, need - streakForGauge))}</span>`;
  const hurdleNote = (!sess.isReviewMode && need > 2 && !(itemStat && itemStat.mastered))
    ? `<div class="hurdle-note">⚠ この語は苦手なので、習得には形式をかえて ${need}回連続の正解が必要です</div>` : "";

  const sessionKpSet = new Set(sess.questions.map(qq=>qq.id));
  let stillToMaster = 0;
  sessionKpSet.forEach(id=>{ if(!isMastered(progress, id)) stillToMaster++; });
  const progressPct = Math.round((sess.qIndex / sess.questions.length) * 100);

  const answeredView = viewingReview && logEntry;
  const attn = isAttention(progress, q.id);

  app.innerHTML = `
    <div class="card">
      ${viewingReview ? `<div class="review-banner">${canRedo ? "直前の問題を見直しています。答え直すと上書きされます。" : "過去の問題を閲覧中です（この問題はもう答え直せません）"}</div>` : ""}
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="stat-strip">
        <span>第 <b>${viewIdx+1}</b> / ${sess.questions.length} 問</span>
        <span>正解 <b>${sess.score}</b> ／ 誤答 <b>${sess.wrongCount}</b></span>
        ${sess.mode !== "all" ? `<span>あと <b>${stillToMaster}</b> 語</span>` : ""}
        ${gauge}
      </div>
      ${hurdleNote}
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          <div class="qtype-tag ${q.format==='A'?'':'fmt-b'}" style="margin-bottom:0;">${q.format==='A' ? "説明 → 語" : "語 → " + KIND_Q[kp.k]}</div>
          ${useKanji ? `<div class="qtype-tag" style="background:var(--kincha); margin-bottom:0;">✏️ 漢字書き</div>` : ''}
          <div class="qtype-tag" style="background:var(--moss); margin-bottom:0;">${esc(CATS[kp.c])}</div>
          ${kp.p ? `<div class="qtype-tag" style="background:var(--kincha); margin-bottom:0;">${IMP_MARK[kp.p]}</div>` : ''}
          ${attn ? `<div class="qtype-tag" style="background:var(--shuiro); margin-bottom:0;">⚠ 要注意習得</div>` : ''}
        </div>
        <button class="star-btn ${isFavorite(progress, q.id) ? 'active' : ''}" id="favToggleBtn">★ <span class="lbl">あとで見る</span></button>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="speak-btn" id="speakQBtn">🔊 <span class="lbl">読み上げ</span></button>
        <button class="search-btn" id="searchBtn">🔍 <span class="lbl">Googleで調べる</span></button>
      </div>
      <div class="question-lead" style="margin-top:12px;">${q.format==='A' ? "次の説明にあてはまる語は？" : "この語はどの" + KIND_Q[kp.k] + "？"}</div>
      <div class="question-text">${q.format==='A' ? esc(kp.d) : `<span class="term-big">${esc(kp.t)}</span>`}</div>

      ${(!viewingReview || canRedo) ? (useKanji ? (
        !kanjiRevealed ? `
          <div class="kanji-input-row">
            <input type="text" class="kanji-input" id="kanjiInput" placeholder="語を書いてみよう（紙に書いてもOK）" autocomplete="off">
          </div>
          <button class="kanji-reveal-btn" id="kanjiRevealBtn">こたえを見る</button>
        ` : `
          <div class="kanji-reveal-box">
            <div class="kanji-your-answer">あなたの解答：${esc(kanjiRevealedText || "（未入力）")}</div>
            <div class="kanji-answer">${esc(kp.t)}${kp.y ? `<span style="font-size:12px; color:var(--sumi-soft); font-weight:400;">（${esc(kp.y)}）</span>` : ''}</div>
            <span class="fb-term">${esc(kp.a)}</span>
            ${kp.n ? `<span class="fb-note">${esc(kp.n)}</span>` : ''}
            <div style="margin-top:8px;"><button class="speak-btn" id="kanjiSpeakBtn">🔊 <span class="lbl">読み上げ</span></button></div>
          </div>
          <div class="kanji-selfgrade-row">
            <button class="kanji-grade-btn correct" id="kanjiCorrectBtn">○ できた（正解）</button>
            <button class="kanji-grade-btn wrong" id="kanjiWrongBtn">× できなかった（不正解）</button>
          </div>
          <div class="kanji-grade-note">見比べて、自分で○か×を選んでください</div>
        `) : `<div class="choices" id="choices"></div>`)
      : (useKanji ? `
        <div class="kanji-reveal-box">
          <div class="kanji-your-answer">あなたの解答：${esc((logEntry && logEntry.answeredText) || "（未入力）")}</div>
          <div class="kanji-answer">${esc(kp.t)}</div>
          <span class="fb-term">${esc(kp.a)}</span>
          ${kp.n ? `<span class="fb-note">${esc(kp.n)}</span>` : ''}
        </div>` : `
        <div class="choices">
          ${m.choices.map((c,i)=>{
            let cls = 'choice-btn';
            if(i === m.correctIdx) cls += ' correct';
            else if(logEntry && logEntry.answeredText === c) cls += ' wrong';
            return `<button class="${cls}" disabled>${esc(c)}</button>`;
          }).join("")}
        </div>`)}

      <div class="feedback-box ${answeredView && !useKanji ? 'show' : ''}" id="feedback">
        ${answeredView && !useKanji ? feedbackHtml(m, logEntry.correct, false) : ""}
      </div>
      ${!viewingReview ? `<button class="next-btn" id="nextBtn">${sess.qIndex===sess.questions.length-1 ? "結果を見る" : "次の問題へ"}</button>` : ""}
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" ${viewIdx<=0 ? "disabled" : ""}>← 前の問題</button>
        <button class="nav-btn" id="fwdBtn" ${!viewingReview ? "disabled" : ""}>進む →</button>
        <button class="nav-btn" id="quitBtn">やめる</button>
      </div>
    </div>`;

  document.getElementById('prevBtn').onclick = ()=>{
    sess.reviewIndex = viewingReview ? Math.max(0, sess.reviewIndex-1) : sess.qIndex-1;
    if(sess.reviewIndex === sess.qIndex - 1) delete sess.kanjiRevealedAt[sess.reviewIndex]; // やり直しは真っさらから
    render();
  };
  document.getElementById('fwdBtn').onclick = ()=>{
    if(!viewingReview) return;
    sess.reviewIndex = (sess.reviewIndex >= sess.qIndex-1) ? null : sess.reviewIndex+1;
    render();
  };
  document.getElementById('quitBtn').onclick = ()=>{
    if(!confirmLeaveSession()) return;
    state.session = null; state.screen = "home"; render();
  };
  document.getElementById('favToggleBtn').onclick = ()=>{
    const nowFav = toggleFavorite(q.id);
    document.getElementById('favToggleBtn').classList.toggle('active', nowFav);
  };
  document.getElementById('searchBtn').onclick = ()=> openGoogleSearch(kp.t + " 文化史");
  const qSpeech = questionSpeech(m);
  document.getElementById('speakQBtn').onclick = ()=> speak(qSpeech);
  // 自動読み上げは「新しく問題が表示された時だけ」。過去問題の閲覧中は鳴らさない
  if(!viewingReview && !kanjiRevealed && UI.autoRead) speak(qSpeech);

  if(!viewingReview){
    document.getElementById('nextBtn').onclick = nextQuestion;
    if(useKanji) wireKanjiUI(viewIdx, m, false);
    else wireChoices(m, false);
  } else if(canRedo){
    if(useKanji) wireKanjiUI(viewIdx, m, true);
    else wireChoices(m, true);
  }
}

function wireChoices(m, isRedo){
  const choicesEl = document.getElementById('choices');
  if(!choicesEl) return;
  m.choices.forEach((c,i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = ()=> submitChoice(m, i, isRedo);
    choicesEl.appendChild(btn);
  });
}

// 解答直後、画面を作り直さずに上部の集計だけを更新する（次の問題へ進むまで数字が古いままにならないように）
function refreshStatStripAfterAnswer(id){
  const sess = state.session;
  const strip = document.querySelector('.stat-strip');
  if(!strip) return;
  const progress = sess.pendingProgress;
  const s = progress.items[id];
  const need = requiredStreak(s);
  const streak = s ? s.streak : 0;
  const sessionKpSet = new Set(sess.questions.map(qq=>qq.id));
  let stillToMaster = 0;
  sessionKpSet.forEach(x=>{ if(!isMastered(progress, x)) stillToMaster++; });
  strip.innerHTML = `
    <span>第 <b>${sess.qIndex}</b> / ${sess.questions.length} 問</span>
    <span>正解 <b>${sess.score}</b> ／ 誤答 <b>${sess.wrongCount}</b></span>
    ${sess.mode !== "all" ? `<span>あと <b>${stillToMaster}</b> 語</span>` : ""}
    <span class="kp-gauge">${"●".repeat(Math.min(streak, need))}${"○".repeat(Math.max(0, need - streak))}</span>`;
  const fill = document.querySelector('.progress-fill');
  if(fill) fill.style.width = Math.round((sess.qIndex / sess.questions.length) * 100) + "%";
}

function feedbackHtml(m, correct, withSpeakBtn){
  const kp = m.kp;
  const head = correct ? "○ 正解！" : `× 残念、正解は「${esc(m.answerText)}」`;
  const body = m.format === "A"
    ? `<span class="fb-term">${esc(kp.t)}</span>${kp.y ? `（${esc(kp.y)}）` : ''} … ${esc(kp.a)}`
    : `<span class="fb-term">${esc(kp.t)}</span> … ${esc(kp.d)}`;
  return `${head}<br>${body}${kp.n ? `<span class="fb-note">${esc(kp.n)}</span>` : ''}
    ${withSpeakBtn ? `<button class="speak-btn" id="speakABtn" style="margin-top:8px;">🔊 <span class="lbl">読み上げ</span></button>` : ''}`;
}

function submitChoice(m, choiceIdx, isRedo){
  const correct = choiceIdx === m.correctIdx;
  const answeredText = m.choices[choiceIdx];
  if(isRedo){ redoAnswer(correct, answeredText); render(); return; }
  commitLiveAnswer(correct, answeredText);
  document.querySelectorAll('#choices .choice-btn').forEach((b,idx)=>{
    b.disabled = true;
    if(idx === m.correctIdx) b.classList.add('correct');
    else if(b.textContent === answeredText) b.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  fb.innerHTML = feedbackHtml(m, correct, true);
  const aSpeech = answerSpeech(m, correct);
  document.getElementById('speakABtn').onclick = ()=> speak(aSpeech);
  if(UI.autoRead) speak(aSpeech);
  document.getElementById('nextBtn').classList.add('show');
  refreshStatStripAfterAnswer(m.id);
}

// 漢字書きモード：未開示（入力＋開示ボタン）と開示済み（自己採点）の両方を1関数で扱う
function wireKanjiUI(viewIdx, m, isRedo){
  const sess = state.session;
  const kp = m.kp;
  const revealSpeech = `${kp.t}。${kp.d}。${kp.a}。${kp.n ? kp.n : ""}`;
  if(sess.kanjiRevealedAt[viewIdx] === undefined){
    const inputEl = document.getElementById('kanjiInput');
    const revealBtn = document.getElementById('kanjiRevealBtn');
    const doReveal = ()=>{
      sess.kanjiRevealedAt[viewIdx] = (inputEl.value || "").trim();
      render();
    };
    revealBtn.onclick = doReveal;
    inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') doReveal(); });
    inputEl.focus();
  } else {
    if(UI.autoRead) speak(revealSpeech);
    const speakBtn = document.getElementById('kanjiSpeakBtn');
    if(speakBtn) speakBtn.onclick = ()=> speak(revealSpeech);
    const correctBtn = document.getElementById('kanjiCorrectBtn');
    const wrongBtn = document.getElementById('kanjiWrongBtn');
    const grade = (correct)=>{
      const answeredText = sess.kanjiRevealedAt[viewIdx] || "";
      if(isRedo){ redoAnswer(correct, answeredText); render(); return; }
      commitLiveAnswer(correct, answeredText);
      correctBtn.disabled = true;
      wrongBtn.disabled = true;
      (correct ? correctBtn : wrongBtn).classList.add('active');
      document.getElementById('nextBtn').classList.add('show');
      refreshStatStripAfterAnswer(m.id);
    };
    correctBtn.onclick = ()=> grade(true);
    wrongBtn.onclick = ()=> grade(false);
  }
}

function nextQuestion(){
  const sess = state.session;
  if(sess.qIndex >= sess.questions.length){ finishSession(); render(); return; }
  render();
}

        <h3>今回間違えた問題</h3>

      </div>
      <div class="weak-list">
        <h3>カテゴリー別 全問一覧 <span class="scope-note">（出題範囲に関係なく全${DATA.length}語）</span></h3>
        <div class="filter-row">
          <select id="catFilter">${["すべて",...CATS].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
          <select id="statusFilter">
            <option value="すべて">状態：すべて</option>

            <option value="要注意習得">要注意習得</option>
            <option value="未習得">未習得（正解あり）</option>
            <option value="未出題">未出題</option>

  };

  app.querySelectorAll('.review-item .star-btn').forEach(btn=>{
    btn.onclick = ()=>{ const f = toggleFavorite(btn.dataset.id); btn.classList.toggle('active', f); };
  });
  app.querySelectorAll('.review-item .search-btn').forEach(btn=>{
    btn.onclick = ()=> openGoogleSearch(btn.dataset.search + " 文化史");

  function renderKpTable(){
    const cat = document.getElementById('catFilter').value;
    const st = document.getElementById('statusFilter').value;
    const sortKey = document.getElementById('sortFilter').value;
    let rows = DATA.map(kp=>({kp, s: progress.items[kp.i]}));
    if(cat !== 'すべて') rows = rows.filter(r=>CATS[r.kp.c]===cat);
    if(st !== 'すべて'){
      rows = rows.filter(r=>{
        const label = statusLabel(r.s);
        if(st === "未習得") return label !== "習得済み" && label !== "要注意習得" && label !== "未出題";
        return label === st;
      });
    }
    if(sortKey === 'wrong') rows.sort((a,b)=>((b.s?b.s.totalWrong:0)-(a.s?a.s.totalWrong:0)));
    else if(sortKey === 'cat') rows.sort((a,b)=> a.kp.c - b.kp.c || a.kp._idx - b.kp._idx);
    else if(sortKey === 'imp') rows.sort((a,b)=> b.kp.p - a.kp.p || a.kp._idx - b.kp._idx);
    else rows.sort((a,b)=>{
      const rank = s => { const l = statusLabel(s); return l==="習得済み"?0 : l==="要注意習得"?1 : l==="未出題"?3 : 2; };

            let html = `<tr class="kp-main ${flagged?'flagged':''}" data-id="${esc(r.kp.i)}">
              <td>${esc(CATS[r.kp.c])}</td>
              <td>${IMP_MARK[r.kp.p] ? `<span class="kp-badge imp">${IMP_MARK[r.kp.p]}</span>` : ''}${esc(r.kp.t)}${flagged ? `<span class="kp-badge ${s.totalWrong>=RESULT_WRONG_BADGE_THRESHOLD?'warn2':''}">誤答${s.totalWrong}回</span>` : ''}</td>
              <td>${esc(r.kp.a)}</td>
              <td>${statusLabel(s)}${s && s.mastered && (s.postMasterWrong||0)>=1 ? `<span class="kp-badge postm">習得後×${s.postMasterWrong}</span>` : ''}</td>
              <td>○${s?s.totalCorrect:0} ／ ×${s?s.totalWrong:0}</td>
            </tr>`;
            if(open){
              const wl = (s && s.wrongLog) || [];
              html += `<tr class="kp-detail"><td colspan="5">
                <b>${esc(r.kp.t)}</b>${r.kp.y?`（${esc(r.kp.y)}）`:''} … ${esc(r.kp.d)}<br>
                ${r.kp.n ? esc(r.kp.n)+"<br>" : ""}
                形式A：○${s?s.byFormat.A.correct:0} ×${s?s.byFormat.A.wrong:0}　／　形式B：○${s?s.byFormat.B.correct:0} ×${s?s.byFormat.B.wrong:0}
                　習得に必要な連続正解：${requiredStreak(s)}回<br>
                過去の誤答：${wl.length ? wl.map(w=>`${esc(w.answered||"（未入力）")}（${w.format}・${formatDateJP(w.at)}）`).join("／") : "なし"}
              </td></tr>`;
            }
            return html;
          }).join("")}
        </tbody>
      </table>`;
    document.querySelectorAll('.kp-table tr.kp-main').forEach(tr=>{
      tr.onclick = ()=>{
        state.expandedKp = (state.expandedKp === tr.dataset.id) ? null : tr.dataset.id;
        renderKpTable();
      };
    });
  }
  document.getElementById('catFilter').onchange = renderKpTable;
  document.getElementById('statusFilter').onchange = renderKpTable;
  document.getElementById('sortFilter').onchange = renderKpTable;
  renderKpTable();
}

function studyStatusChip(progress, id){
  const s = progress.items[id];
  if(!s) return `<span class="sl-s">未出題</span>`;
  if(s.mastered) return (s.postMasterWrong||0)>=1
    ? `<span class="sl-s w">要注意習得</span>` : `<span class="sl-s m">習得済み</span>`;
  if(s.totalWrong > 0) return `<span class="sl-s w">誤答${s.totalWrong}回</span>`;
  if(s.totalCorrect > 0) return `<span class="sl-s">${s.streak}回正解</span>`;
  return `<span class="sl-s">未出題</span>`;
}

function renderStudyCard(app, st, progress, header){
  if(!st.deck.length){
    renderCultureRail(null);

    document.getElementById('deckReset').onclick = ()=>{ st.deck = shuffle(st.ids); st.flipped = false; st.learned = 0; render(); };
    wireStudyCommon(st);

  }
  const kp = BY_ID[st.deck[0]];
  renderCultureRail(kp.k === "culture" ? kp.a : null);
  const frontIsDesc = st.dir === "A"; // A方向＝説明→語（出題形式Aと同じ向き）
  const front = frontIsDesc ? kp.d : kp.t;
  const backMain = frontIsDesc ? kp.t : kp.a;
  const backSub = frontIsDesc ? `${kp.y ? kp.y + "／" : ""}${kp.a}${kp.n ? "<br>" + esc(kp.n) : ""}` : `${esc(kp.d)}${kp.n ? "<br>" + esc(kp.n) : ""}`;
  const pct = Math.round(((st.learned)/(st.ids.length))*100);

  app.innerHTML = `
    <div class="card">
      ${header}
      <div class="dir-toggle">
        <button class="dir-btn ${st.dir==='A'?'active':''}" id="dirA">説明 → 語（形式A）</button>
        <button class="dir-btn ${st.dir==='B'?'active':''}" id="dirB">語 → 文化・宗派（形式B）</button>
      </div>
      <div class="study-progress-track"><div class="study-progress-fill" style="width:${pct}%"></div></div>
      <div class="stat-strip"><span>残り <b>${st.deck.length}</b> 枚</span><span>覚えた ${st.learned}</span><span>${esc(CATS[kp.c])}</span></div>
      <div class="flip-card" id="flipCard">
        <div class="fc-side">${st.flipped ? "うら（こたえ）" : "おもて（といかけ）"}</div>
        <div class="fc-main">${st.flipped ? esc(backMain) : esc(front)}</div>
        ${st.flipped ? `<div class="fc-sub">${backSub}</div>` : ''}
        <div class="fc-hint">${st.flipped ? "もう一度タップでおもてにもどる" : "タップしてめくる"}</div>
      </div>
      <div class="study-icons-row" style="margin-top:12px;">
        <button class="speak-btn" id="cardSpeakBtn">🔊 <span class="lbl">読み上げ</span></button>
        <button class="search-btn" id="cardSearchBtn">🔍 <span class="lbl">Googleで調べる</span></button>
      </div>
      <div class="deck-row">
        <button class="deck-btn got" id="deckGot">✓ 覚えた（デッキから外す）</button>
        <button class="deck-btn notyet" id="deckNot">↻ まだ（あとでもう一度）</button>
      </div>
      <div class="hint-note">「覚えた」は画面上だけの一時的な状態です。習得判定・記録・同期には一切影響しません。</div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="ghost-btn" id="studyBackBtn">成績ページにもどる</button>
      </div>
    </div>`;

  const sp = studySpeech(kp);
  document.getElementById('cardSpeakBtn').onclick = ()=> speak(sp);
  if(UI.autoRead) speak(st.flipped ? sp : (frontIsDesc ? kp.d : kp.t));
  document.getElementById('cardSearchBtn').onclick = ()=> openGoogleSearch(kp.t + " 文化史");
  document.getElementById('flipCard').onclick = ()=>{ st.flipped = !st.flipped; render(); };
  document.getElementById('dirA').onclick = ()=>{ st.dir = "A"; st.flipped = false; render(); };
  document.getElementById('dirB').onclick = ()=>{ st.dir = "B"; st.flipped = false; render(); };
  document.getElementById('deckGot').onclick = ()=>{ st.deck.shift(); st.learned++; st.flipped = false; render(); };
  document.getElementById('deckNot').onclick = ()=>{ const c = st.deck.shift(); st.deck.push(c); st.flipped = false; render(); };
  wireStudyCommon(st);
}

function wireStudyCommon(st){
  const tl = document.getElementById('tabList');
  const tc = document.getElementById('tabCard');
  if(tl) tl.onclick = ()=>{ st.tab = "list"; st.showDetail = false; render(); };
  if(tc) tc.onclick = ()=>{ st.tab = "card"; st.flipped = false; render(); };
  const back = document.getElementById('studyBackBtn');
  if(back) back.onclick = ()=>{ state.study = null; state.screen = "home"; render(); };
}

// ---------------------------------------------------------------- モーダル
function renderModalOverlay(){
  let overlay = document.getElementById('modalOverlay');
  if(!state.modal){ if(overlay) overlay.remove(); return; }
  if(!overlay){ overlay = document.createElement('div'); overlay.id = 'modalOverlay'; document.body.appendChild(overlay); }
  overlay.className = 'modal-overlay';
  const m = state.modal;
  const close = ()=>{ state.modal = null; render(); };

  if(m.type === 'noTarget'){
    const msg = m.mode === "review"
      ? "いまの出題範囲には「要注意習得」の語がありません。範囲を広げるか、通常のモードで学習してください。"
      : "いまの出題範囲に、出題できる語がありません。カテゴリーや重要度の絞り込みを広げてください。";
    overlay.innerHTML = `<div class="modal-box"><h3>出題できる語がありません</h3><p>${msg}</p>
      <div class="modal-btn-row"><button class="sync-btn" id="modalCancelBtn">OK</button></div></div>`;
    document.getElementById('modalCancelBtn').onclick = close;
    return;
  }
  if(m.type === 'importConfirm'){
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>記録を置き換えますか？</h3>
        <p>読み込んだファイルの保存日時：${esc(m.savedAt)}<br>${esc(m.summary)}</p>
        <p style="color:var(--shuiro);">この端末にある現在の記録は、読み込んだ内容で<b>すべて置き換わります</b>。元には戻せません。</p>
        <div class="modal-btn-row">
          <button class="sync-btn warn" id="importConfirmBtn">置き換える</button>
          <button class="ghost-btn" id="modalCancelBtn">キャンセル</button>
        </div>
      </div>`;
    document.getElementById('importConfirmBtn').onclick = confirmImportReplace;
    document.getElementById('modalCancelBtn').onclick = close;
    return;
  }
  if(m.type === 'importMismatch'){
    overlay.innerHTML = `<div class="modal-box"><h3>読み込めませんでした</h3><p>${esc(m.reason)}</p>
      <div class="modal-btn-row"><button class="ghost-btn" id="modalCancelBtn">閉じる</button></div></div>`;
    document.getElementById('modalCancelBtn').onclick = close;
    return;
  }
  if(m.type === 'listBlocked'){
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>書き出しを中止しました</h3>
        <p>この端末にもクラウドにも、ID ${esc(AUTH ? AUTH.id : "")}（${esc(accountName())}）の学習記録がまだありません。<br>
        空の一覧でスプレッドシートを上書きしてしまうため、書き出しを中止しました。</p>
        <ul style="text-align:left; font-size:12.5px; color:var(--sumi-soft); line-height:2; padding-left:1.2em; margin:0 0 14px;">
          <li>まず1回学習して、結果画面まで進んでください。</li>
          <li>ほかの端末で学習ずみのときは、ポータルで同じIDにログインしているかご確認ください。</li>
        </ul>
        <div class="modal-btn-row"><button class="sync-btn" id="modalCancelBtn">OK</button></div>
      </div>`;
    document.getElementById('modalCancelBtn').onclick = close;
    return;
  }
  if(m.type === 'resetRecordsConfirm'){
    const acc = AUTH ? getCommittedStats(AUTH.id) : blankAccountProgress();
    const hasRecords = dbHasRecords({ progress: { x: acc } });
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>このツールの記録を消しますか？</h3>
        <p>ID ${esc(AUTH ? AUTH.id : "")} の、このツール（${TOOL_NAME}）の記録だけを消します。ほかのツールや、ほかのお子さんの記録には影響しません。</p>
        <p style="color:var(--shuiro);"><b>${hasRecords ? "この操作は元に戻せません。学習の記録がすべて消えます。" : "（今のところ記録はまだありません）"}</b></p>
        <div class="modal-btn-row">
          <button class="sync-btn warn" id="resetConfirmBtn">記録を消す</button>
          <button class="ghost-btn" id="modalCancelBtn">キャンセル</button>
        </div>
      </div>`;
    document.getElementById('resetConfirmBtn').onclick = resetMyRecords;
    document.getElementById('modalCancelBtn').onclick = close;
    return;
  }
}

// =====================================================================
// 起動
// =====================================================================
loadAll();
state.accountId = AUTH ? AUTH.id : null;
state.screen = (ready() && loggedIn()) ? "home" : "gate";

async function initialLoad(){
  render();
  if(!ready() || !loggedIn()) return;
  try{
    if(!dbHasRecords(STORE)){
      // 新しい端末では、空の「0件」ホームを一瞬見せるより、先に1回だけ取得を待つ
      state.screen = "loading";
      render();
      await pullCloud(true);
    } else {
      setSyncStatus("pending", "☁… クラウドと同期しています");
      pullCloud(true);
    }
  }catch(e){
    handleSyncError(e);
  }finally{
    if(state.screen === "loading"){ state.screen = "home"; render(); }
  }
}
initialLoad();

// ポータルや他ツールでのログイン状態の変化に追従する。
// ただし出題中・覚えるモード中は、1問目/1枚目から必ず割り込まない（音声仕様書 §5）
window.addEventListener('storage', (ev)=>{
  if(ev.key !== AUTH_KEY && ev.key !== SYNC_KEY) return;
  if(state.screen === "quiz" && state.session) return;
  if(state.screen === "study" && state.study) return;
  loadAll();
  state.accountId = AUTH ? AUTH.id : null;
  state.screen = (ready() && loggedIn()) ? "home" : "gate";
  initialLoad();
});
</script>
