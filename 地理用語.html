<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理マスター|半島・島・湾・岬・海峡・リアス海岸</title>
<style>
:root{
  --hanto:#2f7d43; --shima:#0e7490; --wan:#2563eb; --misaki:#d97706; --kaikyo:#7c3aed; --rias:#dc2626;
  --ink:#273240; --sub:#5b6b7c; --bg:#eef4f8; --card:#ffffff; --line:#dce5ec;
  --sea:#d4e9f7; --land:#f9f5ea; --coast:#a9a493;
  --ok:#2f9e44; --ng:#e03131; --accent:#2a6db5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif; background:var(--bg); color:var(--ink);}
header{background:linear-gradient(135deg,#1d4e89,#2a6db5); color:#fff; padding:12px 16px 9px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
header .ttl{text-align:left;}
header h1{margin:0; font-size:18px; letter-spacing:1px;}
header .sub{font-size:10.5px; opacity:.85; margin-top:2px;}
.accchip{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.5); color:#fff; border-radius:16px; padding:5px 12px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
.wrap{max-width:1080px; margin:0 auto; padding:10px 12px 60px;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 2px 8px rgba(30,60,90,.06);}
.warnbar{background:#fff3cd; border:1px solid #e6c96a; color:#7a5c00; border-radius:10px; padding:8px 12px; font-size:12.5px; margin-bottom:10px; line-height:1.6;}
h3.sec{font-size:14px; margin:16px 2px 8px; color:var(--sub);}
.btn{border:none; border-radius:10px; padding:11px 14px; font-size:14px; font-weight:800; cursor:pointer; background:var(--accent); color:#fff;}
.btn.ghost{background:#fff; color:var(--accent); border:1.5px solid var(--accent);}
.btn.big{padding:14px; font-size:16px; width:100%;}
.btn.ok{background:var(--ok);} .btn.ng{background:#e8590c;} .btn.danger{background:var(--ng);}
.btn.mini{padding:5px 10px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.4; cursor:default;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.grow{flex:1;}
.chips{display:flex; gap:5px; flex-wrap:wrap;}
.chip{border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer; color:var(--sub);}
.chip.on{color:#fff; border-color:transparent;}
.chip[data-cat="hanto"].on{background:var(--hanto);} .chip[data-cat="shima"].on{background:var(--shima);}
.chip[data-cat="wan"].on{background:var(--wan);} .chip[data-cat="misaki"].on{background:var(--misaki);}
.chip[data-cat="kaikyo"].on{background:var(--kaikyo);} .chip[data-cat="rias"].on{background:var(--rias);}
.chip[data-cat="all"].on{background:#37474f;}
.seg{display:inline-flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; background:#fff;}
.seg button{border:none; background:transparent; padding:5px 10px; font-size:12px; font-weight:700; color:var(--sub); cursor:pointer;}
.seg button.on{background:#37474f; color:#fff;}

/* account screen */
.accrow{display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; background:#fff;}
.accrow .nm{font-size:16px; font-weight:800; flex:1; cursor:pointer;}
.accrow .meta{font-size:11px; color:var(--sub);}
input.txt{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; width:100%;}

/* home */
.modebtns{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px;}
.modebtn{border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:12px; cursor:pointer; text-align:left;}
.modebtn b{font-size:15px;}
.modebtn .d{font-size:11.5px; color:var(--sub); margin-top:3px; line-height:1.5;}
.modebtn.primary{border-color:var(--accent); background:#f2f8ff;}
.barrow{display:flex; align-items:center; gap:8px; margin-top:7px;}
.barrow .lb{width:92px; font-size:12px; font-weight:800; text-align:right;}
.barrow .bar{flex:1; height:16px; background:#e7edf2; border-radius:8px; overflow:hidden; display:flex;}
.barrow .bar i{display:block; height:100%;}
.barrow .pct{width:104px; font-size:11.5px; color:var(--sub); font-weight:700;}
.legendline{font-size:11px; color:var(--sub); margin-top:8px;}
.legendline i{display:inline-block; width:10px; height:10px; border-radius:3px; vertical-align:-1px; margin:0 3px 0 10px;}
.rankrow{border-top:1px solid var(--line); padding:8px 4px; font-size:13.5px;}
.rankrow summary{cursor:pointer; font-weight:700; list-style:none; display:flex; align-items:center; gap:8px;}
.rankrow summary::-webkit-details-marker{display:none;}
.wbadge{background:#ffe3e3; color:#c92a2a; border-radius:10px; padding:1px 8px; font-size:11.5px; font-weight:800;}
.wbadge.hot{background:#c92a2a; color:#fff;}
.rdetail{font-size:12.5px; color:var(--sub); padding:6px 4px 2px 26px; line-height:1.8;}
.setlinks{font-size:12px; color:var(--sub); margin-top:10px;}
.setlinks a{color:var(--accent); cursor:pointer; text-decoration:underline; margin-right:14px;}

/* session */
.qhead{position:sticky; top:0; z-index:20; background:var(--bg); padding:6px 0;}
.qhead .inner{background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 12px;}
.pbar{height:8px; background:#e7edf2; border-radius:4px; overflow:hidden;}
.pbar i{display:block; height:100%; background:linear-gradient(90deg,#4dabf7,#2a6db5); transition:width .3s;}
.qstats{display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--sub); font-weight:700; margin-top:6px;}
.qstats .gauge{color:var(--accent); font-size:13px; letter-spacing:2px;}
.qbar{background:#fff7dc; border:1.5px solid #f2d98c; border-radius:12px; padding:10px 14px; margin:10px 0; text-align:center;}
.qbar .qname{font-size:23px; font-weight:800; letter-spacing:2px;}
.qbar .qkana{font-size:13px; color:var(--sub); font-weight:700;}
.qbar .qtype{font-size:12px; color:#8a6d00; font-weight:800;}
.choice{display:block; width:100%; text-align:left; margin-top:8px; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:12px 14px; font-size:16px; font-weight:800; cursor:pointer; letter-spacing:1px;}
.choice.correct{background:#e3f6e6; border-color:var(--ok);}
.choice.wrong{background:#ffe3e3; border-color:var(--ng);}
.choice:disabled{cursor:default; opacity:.95;}
.feedback{margin-top:10px; font-size:14px; line-height:1.7; background:#f4f8fb; border-radius:10px; padding:12px;}
.fb-ok{color:var(--ok); font-weight:900;} .fb-ng{color:var(--ng); font-weight:900;}
.notice{background:#e7f5ff; border:1px solid #a5d8ff; color:#1864ab; border-radius:10px; padding:7px 12px; font-size:12.5px; margin:8px 0;}
.reviewbar{background:#f3f0ff; border:1.5px solid #b197fc; color:#5f3dc4; border-radius:10px; padding:7px 12px; font-size:13px; font-weight:800; margin:8px 0; text-align:center;}

svg.map{width:100%; height:auto; display:block; background:var(--sea); border-radius:10px; border:1px solid var(--line);}
.zoomrow{display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; justify-content:center;}
.zbtn{border:1px solid var(--line); background:#fff; border-radius:8px; padding:4px 9px; font-size:11.5px; font-weight:700; color:var(--sub); cursor:pointer;}
.zbtn.on{background:#37474f; color:#fff; border-color:#37474f;}
.hintline{font-size:12px; color:var(--sub); text-align:center; margin-top:6px;}
.maplegend{font-size:11px; color:var(--sub); margin-top:6px; text-align:center; line-height:1.7;}
.marker{cursor:pointer;}
.marker text{font-weight:800; pointer-events:none;}
.marker circle.dot{stroke:#fff; stroke-width:1.4;}
.marker.sel circle.dot{stroke:#273240; stroke-width:2.2;}

/* learn */
.maparea{display:flex; gap:12px; align-items:flex-start;}
.mapcol{flex:1.4; min-width:0;}
.sidecol{flex:1; min-width:250px;}
@media(max-width:760px){ .maparea{flex-direction:column;} .sidecol{width:100%;} }
.detail{border-radius:12px; padding:14px; min-height:150px;}
.detail .badge{display:inline-block; color:#fff; border-radius:6px; padding:2px 9px; font-size:12px; font-weight:700;}
.detail h2{margin:8px 0 2px; font-size:28px; letter-spacing:2px;}
.detail .kana{color:var(--sub); font-size:14px; font-weight:700;}
.detail .desc{margin-top:10px; font-size:14px; line-height:1.7; background:#f4f8fb; border-radius:8px; padding:10px;}
.navbtns{display:flex; gap:8px; margin-top:12px;}
.navbtns .btn{flex:1;}
table.list{width:100%; border-collapse:collapse; font-size:13px; background:#fff;}
table.list th{background:#eef3f7; padding:6px; font-size:11.5px; color:var(--sub); text-align:left; position:sticky; top:0;}
table.list td{padding:7px 6px; border-top:1px solid var(--line); cursor:pointer;}
table.list tr.sel td{background:#fff7dc;}
.listwrap{max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-top:10px;}
.grouphead td{background:#f2f6f9!important; font-weight:800; font-size:12px; cursor:default;}

/* result */
.result{text-align:center; padding:16px 8px;}
.result .score{font-size:42px; font-weight:900; color:var(--accent);}
.result .stars{font-size:23px; color:#f5a623; letter-spacing:4px; margin:4px 0;}
.sumgrid{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0;}
.sumcell{background:#f4f8fb; border-radius:10px; padding:8px 14px; font-size:12px; color:var(--sub); font-weight:700;}
.sumcell b{display:block; font-size:20px; color:var(--ink);}
.misslist{text-align:left; margin:10px 0 0; font-size:13px; background:#fff4f4; border:1px solid #f0c4c4; border-radius:10px; padding:10px 14px; line-height:1.8;}
.kprow{border-top:1px solid var(--line); padding:7px 4px; font-size:13px;}
.kprow .hd{display:flex; align-items:center; gap:7px; cursor:pointer; flex-wrap:wrap;}
.kprow.warn2{background:#fff5f5;}
.statechip{border-radius:9px; padding:1px 8px; font-size:11px; font-weight:800;}
.st-mastered{background:#d3f9d8; color:#2b8a3e;} .st-part{background:#fff3bf; color:#8a6d00;}
.st-none{background:#eceff1; color:#78909c;} .st-wrong{background:#ffe3e3; color:#c92a2a;}
select.sel{border:1.5px solid var(--line); border-radius:8px; padding:5px 8px; font-size:12.5px; background:#fff; color:var(--sub); font-weight:700;}

/* cards */
.card{max-width:470px; margin:0 auto;}
.face{border:2px solid var(--line); border-radius:16px; background:#fff; padding:22px; text-align:center; min-height:300px; display:flex; flex-direction:column; justify-content:center; align-items:center;}
.face .big{font-size:36px; font-weight:900; letter-spacing:3px; margin:8px 0;}
.face .mid{font-size:15px; color:var(--sub); font-weight:700;}
.cardbtns{display:flex; gap:10px; margin-top:12px; max-width:470px; margin-left:auto; margin-right:auto;}
.cardbtns .btn{flex:1;}
.deckinfo{text-align:center; font-size:12.5px; color:var(--sub); margin-bottom:8px; font-weight:700;}
.minimap{width:min(300px,86%); margin:8px auto 0;}
.minimap svg{width:100%; height:auto; background:var(--sea); border-radius:10px; border:1px solid var(--line);}

/* modal */
#modalback{position:fixed; inset:0; background:rgba(20,30,45,.45); display:none; align-items:center; justify-content:center; z-index:99; padding:20px;}
#modalback.show{display:flex;}
.modal{background:#fff; border-radius:14px; padding:18px; max-width:400px; width:100%;}
.modal .m-title{font-size:15px; font-weight:900; margin-bottom:8px;}
.modal .m-body{font-size:13.5px; line-height:1.7; color:var(--sub);}
.modal .m-btns{display:flex; gap:8px; margin-top:14px;}
.modal .m-btns .btn{flex:1;}
.foot{margin-top:26px; text-align:center; font-size:11px; color:#93a3b2; line-height:1.8;}
.backlink{font-size:13px; color:var(--accent); font-weight:800; cursor:pointer; margin-bottom:8px; display:inline-block;}
</style>
</head>

async function pullCloud(){
  if (!SYNC.url) return;
  setSync('busy', '同期確認中…');
  try{
    const j = await gasFetch(SYNC.url + '?key=' + encodeURIComponent(SYNC.key || '') + '&app=' + encodeURIComponent(APPKEY));
    if (!j.ok){ setSync('err', j.error || '同期エラー'); return; }
    if (j.data && j.data.app === APPKEY){
      const remote = j.data;
      const localHas = dbHasRecords(db), remoteHas = dbHasRecords(remote);
      let adopt = false, push = false;
      if (!localHas && remoteHas) adopt = true;            /* 記録が空の側は負ける */
      else if (localHas && !remoteHas) push = true;
      else {
        const rU = remote.updatedAt || '', lU = db.updatedAt || '';
        if (rU > lU) adopt = true; else if (lU > rU) push = true;
      }
      if (adopt){
        /* ローカルにしかないアカウント(名前で判定)は合流させて消さない */
        const localActiveName = activeAcc() ? activeAcc().name : null;
        const localAccs = db.accounts || [], localProg = db.progress || {};
        db = remote;
        let merged = 0;
        for (const a of localAccs){
          if (!db.accounts.some(x => x.name === a.name)){
            db.accounts.push(a);
            if (localProg[a.id]) db.progress[a.id] = localProg[a.id];
            merged++;
          }
        }
        if (localActiveName){
          const m = db.accounts.find(x => x.name === localActiveName);
          if (m) db.activeAccountId = m.id;
        }
        persistDB();
        SYNC.lastSync = nowIso(); saveSync();
        setSync('ok', 'クラウドの記録を取り込みました');
        if (screen !== 'session'){ screen = activeAcc() ? 'home' : 'account'; render(); }
        if (merged) await pushCloud();
      } else if (push){ await pushCloud(); }
      else { SYNC.lastSync = nowIso(); saveSync(); setSync('ok', '同期ずみ(最新)'); }
    } else { await pushCloud(); }
  }catch(e){ setSync('err', 'オフライン(ローカルには保存済み)'); }
}
/* 全問一覧(全アカウント分)をDriveのスプレッドシートへ手動書き出し */
async function pushListCloud(){
  if (!SYNC.url){ modal('クラウド同期が未設定です', '先に「☁ クラウド同期設定」を済ませてください。', [{label:'OK'}]); return; }
  setSync('busy', '一覧を書き出し中…');
  const header = ['名前','カテゴリー','記号','知識ポイント','よみがな','重要度','状態','累計正解数','累計誤答数','形式A誤答数','形式B誤答数','過去の誤答内容','最終誤答日','習得日'];
  const rows = [];
  for (const a of db.accounts){
    const items = (db.progress[a.id] || {}).items || {};
    for (const f of FEATURES){
      const r = items[kpId(f)] || blankItem();
      const lastWrong = r.wrongLog.length ? fmtDate(r.wrongLog[r.wrongLog.length-1].at) : '';
      rows.push([a.name, CATS[f.cat].label, f.id, f.name, f.kana, IMPMARK[f.imp] || '－', stateOf(r).label,
        r.totalCorrect, r.totalWrong, r.byFormat.A.wrong, r.byFormat.B.wrong,
        r.wrongLog.map(w => w.answered).join(';'), lastWrong, fmtDate(r.masteredAt)]);
    }
  }
  try{
    const j = await gasFetch(SYNC.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({key: SYNC.key || '', app: APPKEY, list: {header, rows}})});
    if (j.ok) setSync('ok', '全問一覧をスプレッドシートに書き出しました');
    else setSync('err', j.error || '一覧の書き出しエラー');
  }catch(e){ setSync('err', 'オフラインのため一覧を書き出せませんでした'); }
}
/* ---- export / import ---- */
function exportData(){
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const blob = new Blob([JSON.stringify(db, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `地理マスター記録_${ymd}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    let d;
    try{ d = JSON.parse(fr.result); }catch(e){ modal('読み込みエラー', 'ファイルの形式が正しくありません。', [{label:'OK'}]); return; }
    if (!d || d.app !== APPKEY){ modal('読み込みエラー', 'このツールの記録ファイルではないようです。', [{label:'OK'}]); return; }
    const names = (d.accounts || []).map(a => esc(a.name)).join('、') || '(なし)';
    modal('記録の読み込み',
      `このファイルの記録で<b>今の記録を置き換え</b>ます(元にもどせません)。<br>アカウント:${names}<br>保存日時:${d.updatedAt ? new Date(d.updatedAt).toLocaleString('ja-JP') : '不明'}`,
      [{label:'キャンセル'}, {label:'置き換える', cls:'danger', fn:() => { db = d; db.updatedAt = nowIso(); persistDB(); pushCloud(); go(activeAcc() ? 'home' : 'account'); }}]);
  };
  fr.readAsText(file);
}

function blankItem(){
  return {streak:0, mastered:false, masteredAt:null, lastFormat:null, lastCorrectFormat:null,
    totalCorrect:0, totalWrong:0,
    byFormat:{A:{correct:0,wrong:0}, B:{correct:0,wrong:0}},
    wrongLog:[], lastAnswered:null, lastSeenAt:null};
}
function accProgress(accId){
  if(!db.progress[accId]) db.progress[accId] = {items:{}, sessions:[]};
  return db.progress[accId];
}
function getItem(items, id){ if(!items[id]) items[id] = blankItem(); return items[id]; }
function activeAcc(){ return db.accounts.find(a => a.id === db.activeAccountId) || null; }

/* ================= modal ================= */
function modal(title, body, btns){
  const back = document.getElementById('modalback'), box = document.getElementById('modalbox');
  box.innerHTML = `<div class="m-title">${title}</div><div class="m-body">${body}</div>
    <div class="m-btns">${btns.map((b,i)=>`<button class="btn ${b.cls||'ghost'}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
  back.classList.add('show');
  box.querySelectorAll('button').forEach(el => el.onclick = () => {
    back.classList.remove('show');
    const fn = btns[+el.dataset.i].fn; if(fn) fn();
  });
}

/* ================= map rendering ================= */
function proj(f){
  const p = f.inset ? MAP.INSET : MAP.MAIN;
  let x = (f.lon - p.lon0) * p.kx * p.S, y = (p.lat1 - f.lat) * p.S;
  if (f.inset){ x += INSET_POS.x; y += INSET_POS.y; }
  return [x, y];
}
function projLL(lat, lon){ return proj({lat, lon}); }
function baseSvg(withStructs){
  let s = '';
  s += `<path d="${MAP.koreaPath}" fill="#ece8dc" stroke="#b9b4a4" stroke-width="0.8"/>`;
  s += `<text x="18" y="415" font-size="12" fill="#8fa9bf">韓国</text>`;
  s += `<line x1="330" y1="276" x2="768" y2="276" stroke="#c46a6a" stroke-width="1" stroke-dasharray="6 4" opacity="0.7"/>`;
  s += `<text x="655" y="270" font-size="11" fill="#c46a6a">北緯40度</text>`;
  s += `<text x="180" y="380" font-size="15" fill="#8fb3cd" letter-spacing="4">日本海</text>`;
  s += `<text x="430" y="640" font-size="15" fill="#8fb3cd" letter-spacing="4">太平洋</text>`;
  s += `<text x="600" y="60" font-size="13" fill="#8fb3cd" letter-spacing="2">オホーツク海</text>`;
  for (const d of MAP.prefPaths) s += `<path d="${d}" fill="var(--land)" stroke="var(--coast)" stroke-width="0.7"/>`;
  for (const d of MAP.extraPaths) s += `<path d="${d}" fill="var(--land)" stroke="var(--coast)" stroke-width="0.7"/>`;
  s += `<g><rect x="${INSET_POS.x}" y="${INSET_POS.y}" width="${MAP.insetW}" height="${MAP.insetH}" fill="var(--sea)" stroke="#7d8fa0" stroke-width="1.2" rx="4"/>`;
  s += `<text x="${INSET_POS.x+6}" y="${INSET_POS.y+14}" font-size="10.5" fill="#7d8fa0">南西諸島</text>`;
  for (const d of MAP.insetPaths) s += `<g transform="translate(${INSET_POS.x},${INSET_POS.y})"><path d="${d}" fill="var(--land)" stroke="var(--coast)" stroke-width="0.7"/></g>`;
  s += `</g>`;
  if (withStructs){
    for (const st of STRUCTS){
      const [x1,y1] = projLL(st.pts[0][0], st.pts[0][1]);
      const [x2,y2] = projLL(st.pts[1][0], st.pts[1][1]);
      const style = st.type === 'bridge' ? 'stroke="#8d5524" stroke-width="3.4"' : 'stroke="#37474f" stroke-width="3.4" stroke-dasharray="3 2.4"';
      s += `<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${style} stroke-linecap="round"><title>${st.name}</title></line>
        <circle cx="${(x1+x2)/2}" cy="${(y1+y2)/2}" r="6.5" fill="transparent"><title>${st.name}</title></circle></g>`;
    }
  }
  return s;
}
function markerSvg(f, opts){
  const [x,y] = proj(f);
  const c = CATS[f.cat].hex;
  let inner = '';
  if (f.cat === 'rias' && !opts.neutral){
    inner += `<circle cx="${x}" cy="${y}" r="12.5" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  }
  const fill = opts.neutral ? '#8a97a5' : c;
  inner += `<circle class="dot" cx="${x}" cy="${y}" r="${opts.labels ? 7.2 : 6.5}" fill="${fill}"/>`;
  if (opts.labels) inner += `<text x="${x}" y="${y+3.4}" text-anchor="middle" font-size="9.5" fill="#fff" style="pointer-events:none;stroke:none">${f.id}</text>`;
  return `<g class="marker" data-key="${kpId(f)}">${inner}</g>`;
}
function mapSvg(items, opts){
  opts = opts || {};
  return `<svg class="map" viewBox="${opts.vb || '0 0 768 734'}" xmlns="http://www.w3.org/2000/svg">
    ${baseSvg(opts.structs)}<g class="mlayer">${items.map(f => markerSvg(f, opts)).join('')}</g></svg>`;
}
function highlightSvg(f){
  const [x,y] = proj(f);
  const c = CATS[f.cat].hex;
  const W = 320;
  let vx = Math.min(Math.max(x - W/2, 0), 768 - W);
  let vy = Math.min(Math.max(y - W/2, 0), 734 - W);
  return `<svg viewBox="${vx} ${vy} ${W} ${W}" xmlns="http://www.w3.org/2000/svg">${baseSvg(false)}
    <circle cx="${x}" cy="${y}" r="10" fill="${c}" stroke="#fff" stroke-width="2.5"/>
    <circle cx="${x}" cy="${y}" r="10" fill="none" stroke="${c}" stroke-width="3">
      <animate attributeName="r" values="10;24;10" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.6s" repeatCount="indefinite"/>
    </circle></svg>`;
}
let mapView = 'full';
function curVb(){ return VIEWS.find(v => v.id === mapView).vb; }
function zoomRow(){
  return `<div class="zoomrow">` + VIEWS.map(v =>
    `<button class="zbtn ${mapView===v.id?'on':''}" data-view="${v.id}">${v.label}</button>`).join('') + `</div>`;
}
function bindZoom(container){
  container.querySelectorAll('.zbtn').forEach(b => b.onclick = () => {
    mapView = b.dataset.view;
    container.querySelector('svg.map').setAttribute('viewBox', VIEWS.find(v=>v.id===mapView).vb);
    container.querySelectorAll('.zbtn').forEach(x => x.classList.toggle('on', x === b));
  });
}

/* ================= scope ================= */
let scope = {cat:'all', imp:0};
function scopePool(){
  return FEATURES.filter(f => (scope.cat === 'all' || f.cat === scope.cat) && f.imp >= scope.imp);
}
function scopeLabel(){
  return (scope.cat==='all' ? 'すべて' : CATS[scope.cat].label) + (scope.imp===2?'・◎のみ':scope.imp===1?'・◎○のみ':'');
}
function scopeCtrls(){
  const cats = ['all', ...CATORDER];
  return `<div class="row" style="margin-top:6px">
    <div class="chips" id="scChips">${cats.map(c => {
      const n = FEATURES.filter(f => (c==='all'||f.cat===c) && f.imp>=scope.imp).length;
      return `<button class="chip ${scope.cat===c?'on':''}" data-cat="${c}">${c==='all'?'すべて':CATS[c].label} ${n}</button>`;
    }).join('')}</div>
    <div class="seg" id="scImp">
      <button data-imp="0" class="${scope.imp===0?'on':''}">すべて</button>
      <button data-imp="1" class="${scope.imp===1?'on':''}">◎○のみ</button>
      <button data-imp="2" class="${scope.imp===2?'on':''}">◎のみ</button>
    </div></div>`;
}
function bindScope(onChange){
  document.querySelectorAll('#scChips .chip').forEach(b => b.onclick = () => { scope.cat = b.dataset.cat; onChange(); });
  document.querySelectorAll('#scImp button').forEach(b => b.onclick = () => { scope.imp = +b.dataset.imp; onChange(); });
}

/* ---------- home ---------- */
function catStats(items){
  const stats = {};
  const cats = ['total', ...CATORDER];
  for (const c of cats) stats[c] = {mastered:0, part:0, none:0, total:0};
  for (const f of FEATURES){
    const rec = items[kpId(f)] || blankItem();
    const st = rec.mastered ? 'mastered' : (rec.totalCorrect > 0 || rec.streak > 0) ? 'part' : 'none';
    stats[f.cat][st]++; stats[f.cat].total++;
    stats.total[st]++; stats.total.total++;
  }
  return stats;
}
function barHtml(label, s, hex){
  const pc = n => s.total ? (100*n/s.total) : 0;
  return `<div class="barrow"><div class="lb">${label}</div>
    <div class="bar"><i style="width:${pc(s.mastered)}%;background:${hex}"></i><i style="width:${pc(s.part)}%;background:${hex}55"></i></div>
    <div class="pct">習得 ${s.mastered}/${s.total}(${Math.round(pc(s.mastered))}%)</div></div>`;
}

    <div class="panel">
      <div style="font-size:15px;font-weight:900">こんにちは、${esc(activeAcc().name)}さん!</div>

/* ================= session engine ================= */
let SES = null;
window._dbg = { get ses(){ return SES; }, get db(){ return db; } };
function chooseFormat(rec){ return rec.lastFormat ? other(rec.lastFormat) : (Math.random() < 0.5 ? 'A' : 'B'); }
function startSession(mode, forcedKps){
  const prog = accProgress(db.activeAccountId);
  const pool = scopePool();
  let kps, queue, notice = '';
  const temp = JSON.parse(JSON.stringify(prog.items));
  for (const f of FEATURES) getItem(temp, kpId(f));
  if (mode === 'allq'){
    kps = shuffle(pool);
    if (!kps.length){ modal('項目がありません','この範囲には項目がありません。',[{label:'OK'}]); return; }
    queue = kps.map(f => ({kp: kpId(f), format: chooseFormat(temp[kpId(f)])}));
  } else {
    const n = mode === '20q' ? 20 : 10;
    let cands;
    if (forcedKps && forcedKps.length){ cands = forcedKps.slice(); }
    else {
      cands = pool.filter(f => !temp[kpId(f)].mastered);
      /* priority: 1) most wrong 2) unseen 3) longest since last seen */
      cands.sort((a,b) => {
        const ra = temp[kpId(a)], rb = temp[kpId(b)];
        const ga = ra.totalWrong > 0 ? 0 : (!ra.lastSeenAt ? 1 : 2);
        const gb = rb.totalWrong > 0 ? 0 : (!rb.lastSeenAt ? 1 : 2);
        if (ga !== gb) return ga - gb;
        if (ga === 0) return rb.totalWrong - ra.totalWrong;
        if (ga === 2) return (ra.lastSeenAt||'') < (rb.lastSeenAt||'') ? -1 : 1;
        return Math.random() - 0.5;
      });
    }
    if (!cands.length){
      modal('ぜんぶ習得済み!', 'この範囲の知識ポイントはすべて習得済みです。<b>全問モード</b>で実力チェックしてみよう!', [{label:'OK'}]);
      return;
    }
    if (cands.length < n) notice = `未習得が${cands.length}個のため、${cands.length}KPで出題します(仕様2-1)`;
    kps = cands.slice(0, n);
    /* both formats scheduled per KP: first pass + second pass */
    const first = shuffle(kps).map(f => ({kp: kpId(f), format: chooseFormat(temp[kpId(f)])}));
    const ffmt = {}; first.forEach(q => ffmt[q.kp] = q.format);
    const second = shuffle(kps).map(f => ({kp: kpId(f), format: other(ffmt[kpId(f)])}));
    queue = first.concat(second);
  }
  SES = {
    mode, queue, qi:0, temp, history:[], correct:0, wrong:0,
    reinsert:{}, skipped:new Set(), notice,
    startedAt: nowIso(), origMastered: new Set(FEATURES.filter(f => (prog.items[kpId(f)]||{}).mastered).map(f => kpId(f))),
    sessionKps: new Set(queue.map(q => q.kp)),
    review: null, snap: null, fb: null
  };
  window.addEventListener('beforeunload', beforeUnload);
  go('session');
}
function beforeUnload(e){ if (SES){ e.preventDefault(); e.returnValue = ''; } }
function confirmQuit(fn){
  modal('セッションをやめますか?', 'とちゅうでやめると、<b>今回の解答は記録されません</b>(仕様5-2)。',
    [{label:'つづける'}, {label:'やめる(記録しない)', cls:'danger', fn:() => { window.removeEventListener('beforeunload', beforeUnload); fn(); }}]);
}
function snapState(){
  SES.snap = JSON.stringify({temp:SES.temp, queue:SES.queue, qi:SES.qi, correct:SES.correct, wrong:SES.wrong,
    reinsert:SES.reinsert, skipped:[...SES.skipped]});
}
function restoreSnap(){
  const s = JSON.parse(SES.snap);
  SES.temp = s.temp; SES.queue = s.queue; SES.qi = s.qi; SES.correct = s.correct; SES.wrong = s.wrong;
  SES.reinsert = s.reinsert; SES.skipped = new Set(s.skipped);
}
function applyAnswer(rec, format, correct, answeredText){
  const t = nowIso();
  rec.lastFormat = format; rec.lastSeenAt = t;
  rec.lastAnswered = {at:t, format, answered:answeredText, correct};
  if (correct){
    rec.totalCorrect++; rec.byFormat[format].correct++;
    if (rec.streak === 0 || rec.lastCorrectFormat !== format) rec.streak++;
    rec.lastCorrectFormat = format;
    if (rec.streak >= MASTERY_STREAK && !rec.mastered){ rec.mastered = true; rec.masteredAt = t; }
  } else {
    rec.totalWrong++; rec.byFormat[format].wrong++;
    rec.wrongLog.push({at:t, format, answered:answeredText});
    if (rec.wrongLog.length > 20) rec.wrongLog.shift();
    rec.streak = 0; rec.mastered = false; rec.masteredAt = null; rec.lastCorrectFormat = null;
  }
}
function processAnswer(answeredKey, answeredText, correct){
  snapState(); /* for re-answer of this question */
  const q = SES.queue[SES.qi];
  const rec = SES.temp[q.kp];
  applyAnswer(rec, q.format, correct, answeredText);
  if (correct) SES.correct++; else SES.wrong++;
  SES.history.push({kp:q.kp, format:q.format, stim:SES.fb ? SES.fb.stim : null, answeredText, correct});
  if (SES.mode !== 'allq'){
    const futureHas = SES.queue.slice(SES.qi+1).some(x => x.kp === q.kp);
    if (rec.mastered){
      /* remove remaining scheduled entries for this KP */
      SES.queue = SES.queue.slice(0, SES.qi+1).concat(SES.queue.slice(SES.qi+1).filter(x => x.kp !== q.kp));
    } else {
      const cnt = SES.reinsert[q.kp] || 0;
      const delay = correct ? 6 : 3;
      const need = correct ? !futureHas : true;
      if (need){
        if (cnt >= 4){ SES.skipped.add(q.kp); }
        else {
          SES.reinsert[q.kp] = cnt + 1;
          const pos = Math.min(SES.qi + delay, SES.queue.length);
          SES.queue.splice(pos, 0, {kp:q.kp, format: other(q.format)});
        }
      }
    }
  }
}
function nextQuestion(){
  SES.fb = null;
  SES.qi++;
  if (SES.qi >= SES.queue.length) finishSession();
  else render();
}
function finishSession(){
  window.removeEventListener('beforeunload', beforeUnload);
  const prog = accProgress(db.activeAccountId);
  const newlyMastered = [...SES.sessionKps].filter(k => SES.temp[k].mastered && !SES.origMastered.has(k));
  if (SES.mode === 'allq'){
    for (const k of Object.keys(SES.temp)) if (SES.temp[k].mastered && !SES.origMastered.has(k) && !newlyMastered.includes(k)) newlyMastered.push(k);
  }
  const wrongCounts = {};
  SES.history.filter(h => !h.correct).forEach(h => wrongCounts[h.kp] = (wrongCounts[h.kp]||0) + 1);
  prog.items = SES.temp;
  prog.sessions.push({startedAt:SES.startedAt, finishedAt:nowIso(), mode:SES.mode,
    correct:SES.correct, wrong:SES.wrong, newlyMastered, wrongKpIds:Object.keys(wrongCounts), sessionWrongCount:wrongCounts});
  saveDB();
  pushCloud();
  LAST_RESULT = {mode:SES.mode, correct:SES.correct, wrong:SES.wrong, newlyMastered,
    history:SES.history.slice(), skipped:[...SES.skipped]};
  SES = null;
  go('result');
}

/* ---------- session UI ---------- */
const MODENAME = {'10q':'10問モード','20q':'20問モード','allq':'全問モード'};
function gaugeHtml(rec){
  let g = '';
  for (let i=0;i<MASTERY_STREAK;i++) g += i < rec.streak ? '●' : '○';
  return g;
}
function sessionHead(){
  const total = SES.queue.length;
  const done = SES.qi;
  const remainKp = [...SES.sessionKps].filter(k => !SES.temp[k].mastered).length;
  const rec = SES.temp[SES.queue[Math.min(SES.qi, total-1)].kp];
  return `<div class="qhead"><div class="inner">
    <div class="pbar"><i style="width:${Math.round(100*done/total)}%"></i></div>
    <div class="qstats">
      <span>${MODENAME[SES.mode]}</span>
      <span><b>${Math.min(done+1,total)}問目</b> / 全${total}問</span>
      <span>あと<b>${remainKp}</b>語</span>
      <span style="color:var(--ok)">正解 ${SES.correct}</span><span style="color:var(--ng)">誤答 ${SES.wrong}</span>
      <span class="gauge" title="この項目の習得ゲージ">${gaugeHtml(rec)}</span>
      <span class="grow"></span>
      <button class="btn mini ghost" id="backQ" ${SES.history.length?'':'disabled'}>← 前の問題</button>
      <button class="btn mini ghost" id="quitQ">やめる</button>
    </div></div></div>`;
}
function renderQuestionOrReview(){
  if (SES.review !== null) return renderReview();
  const q = SES.queue[SES.qi];
  const f = byKp(q.kp);
  if (!SES.fb){
    /* build stimulus */
    if (q.format === 'B'){
      const useMap = Math.random() < 0.5;
      const others = shuffle(FEATURES.filter(x => x.cat === f.cat && x !== f)).slice(0,3);
      SES.fb = {stim: useMap ? 'map' : 'desc', choices: shuffle([f, ...others]), answered:null};
    } else {
      SES.fb = {stim:'pos', answered:null};
    }
  }
  const st = SES.fb;
  let qhtml = '';
  if (q.format === 'A'){
    const dots = scopePool();
    const pool2 = dots.some(x => x === f) ? dots : dots.concat([f]);
    qhtml = `<div class="qbar"><div class="qtype">形式A|位置あて</div>

      <div class="navbtns" id="nx" style="display:none"><button class="btn big" id="nextBtn">次へ →</button></div></div>`;
  } else {
    qhtml = `<div class="qbar"><div class="qtype">形式B|名前を答える4択</div>
      <div style="font-size:15px;font-weight:800;margin-top:3px">${st.stim==='map' ? '地図が示す場所の名前は?' : '次の説明にあてはまるのは?'}</div></div>
      <div class="panel" style="max-width:560px;margin:0 auto">
      ${st.stim==='map' ? `<div class="minimap">${highlightSvg(f)}</div>`
        : `<div style="background:#f4f8fb;border-radius:8px;padding:12px;font-size:14.5px;line-height:1.8">${esc(f.desc)}</div>`}
      <div id="choices">${st.choices.map((c,i)=>`<button class="choice" data-i="${i}">${c.name}</button>`).join('')}</div>
      <div class="feedback" id="fbB" style="display:none"></div>
      <div class="navbtns" id="nx" style="display:none"><button class="btn big" id="nextBtn">次へ →</button></div></div>`;
  }
  app.innerHTML = sessionHead() + (SES.notice ? `<div class="notice">${SES.notice}</div>` : '') + qhtml;
  SES.notice = '';
  document.getElementById('quitQ').onclick = () => confirmQuit(() => { SES = null; go('home'); });
  document.getElementById('backQ').onclick = () => { if (SES.history.length){ SES.review = SES.history.length - 1; render(); } };
  if (q.format === 'A'){
    const box = document.getElementById('posMap');
    bindZoom(box);
    box.querySelectorAll('.marker').forEach(m => m.onclick = () => {
      if (st.answered) return;
      const pickKp = m.dataset.key;
      const pick = byKp(pickKp);
      st.answered = pick.name;
      const correct = pickKp === q.kp;
      const dot = m.querySelector('.dot');
      dot.setAttribute('fill', correct ? '#2f9e44' : '#e03131'); dot.setAttribute('r', 9);
      if (!correct){
        const right = box.querySelector(`.marker[data-key="${q.kp}"] .dot`);
        right.setAttribute('fill', '#2f9e44'); right.setAttribute('r', 10);
      }
      processAnswer(pickKp, pick.name, correct);
      const fb = document.getElementById('fbA');
      fb.style.display = 'block';
      fb.innerHTML = (correct ? `<span class="fb-ok">○ 正解!</span>` : `<span class="fb-ng">× ざんねん…(タップしたのは「${esc(pick.name)}」)</span>`) +
        ` <b style="color:${CATS[f.cat].hex}">${f.name}(${f.kana})</b> ${IMPMARK[f.imp]}<br>${esc(f.desc)}` +
        masteryNote(q.kp);

  } else {
    app.querySelectorAll('.choice').forEach((b,i) => b.onclick = () => {

      app.querySelectorAll('.choice').forEach((x,j) => {
        x.disabled = true;
        if (st.choices[j] === f) x.classList.add('correct');

        masteryNote(q.kp);

  }

function masteryNote(kp){
  const rec = SES.temp[kp];
  if (rec.mastered) return `<div style="margin-top:6px;color:var(--ok);font-weight:800">🎉 この項目を習得しました!(両形式で連続正解)</div>`;

function refreshHead(){

/* ---------- review (back navigation) ---------- */
function renderReview(){
  const i = SES.review;

        <button class="btn" id="rvNext">進む →</button>
      </div></div>`;
  document.getElementById('quitQ').onclick = () => confirmQuit(() => { SES = null; go('home'); });
  document.getElementById('backQ').onclick = () => {};
  document.getElementById('rvPrev').onclick = () => { if (i > 0){ SES.review = i - 1; render(); } };
  document.getElementById('rvNext').onclick = () => {
    if (i < SES.history.length - 1){ SES.review = i + 1; } else { SES.review = null; }
    render();
  };

  if (ra) ra.onclick = () => {

/* ---------- result ---------- */
let LAST_RESULT = null;
let resFilter = 'all', resSort = 'wrong';
function stateOf(rec){
  if (rec.mastered) return {cls:'st-mastered', label:'習得済み'};
  if (rec.totalCorrect + rec.totalWrong === 0) return {cls:'st-none', label:'未出題'};
  if (rec.lastAnswered && !rec.lastAnswered.correct) return {cls:'st-wrong', label:'誤答'};
  return {cls:'st-part', label:`${rec.totalCorrect}回正解`};
}
function renderResult(){
  const R = LAST_RESULT;
  if (!R){ go('home'); return; }
  const prog = accProgress(db.activeAccountId);
  const total = R.correct + R.wrong;
  const rate = total ? Math.round(100 * R.correct / total) : 0;
  const stars = rate === 100 ? '★★★' : rate >= 70 ? '★★☆' : '★☆☆';
  const missed = R.history.filter(h => !h.correct);

  if (resFilter !== 'all'){

      const st = stateOf(x.rec).label;
      if (resFilter === 'mastered') return x.rec.mastered;
      if (resFilter === 'wrong') return x.rec.totalWrong > 0;
      if (resFilter === 'none') return st === '未出題';
      if (resFilter === 'learning') return !x.rec.mastered && st !== '未出題';
      return true;
    });

  if (resSort === 'wrong') rows.sort((a,b) => b.rec.totalWrong - a.rec.totalWrong);

      ${R.skipped.length ? `<div class="notice">再出題の上限(4回)に達した項目があります:${R.skipped.map(k=>byKp(k).name).join('、')} → <b>要復習!</b></div>` : ''}
      ${R.newlyMastered.length ? `<div style="font-size:13px;color:var(--ok);font-weight:800">🎉 習得:${R.newlyMastered.map(k=>byKp(k).name).join('、')}</div>` : ''}
      <div class="navbtns" style="max-width:430px;margin:14px auto 0">
        <button class="btn big" id="toHome">ホームへ</button>
        <button class="btn big ghost" id="csvBtn">CSVダウンロード</button>
      </div>
    </div>
    ${missed.length ? `<h3 class="sec">今回まちがえた問題</h3><div class="panel"><div class="misslist">
      ${missed.map(h => { const f = byKp(h.kp); return `<b style="color:${CATS[f.cat].hex}">${f.name}</b>(${f.kana})|形式${h.format}|あなたの解答:${esc(h.answeredText)}<br><span style="font-size:12px;color:var(--sub)">${esc(f.desc)}</span>`; }).join('<hr style="border:none;border-top:1px dashed #e5b8b8;margin:6px 0">')}
    </div></div>` : ''}
    <h3 class="sec">カテゴリー別 全問一覧</h3>
    <div class="panel">
      <div class="row" style="margin-bottom:6px">
        <select class="sel" id="resFilter">

        </select>

            <b>${x.f.name}</b><span style="font-size:11px;color:var(--sub)">${x.f.kana}</span>
            <span class="grow"></span>
            ${warn2 ? `<span class="wbadge hot">⚠️2回以上ミス(${x.rec.totalWrong}回)</span>` : x.rec.totalWrong>0 ? `<span class="wbadge">誤答${x.rec.totalWrong}回</span>` : ''}
            <span class="statechip ${st.cls}">${st.label}</span>
          </div>
          <div class="rdetail" style="display:none">
            位置あて(A):${x.rec.byFormat.A.correct}勝${x.rec.byFormat.A.wrong}敗 / 4択(B):${x.rec.byFormat.B.correct}勝${x.rec.byFormat.B.wrong}敗
            ${x.rec.wrongLog.length ? `<br>まちがえた答え:${x.rec.wrongLog.map(w=>`${esc(w.answered)}(形式${w.format})`).join('、')}` : ''}
            ${x.rec.masteredAt ? `<br>習得日:${fmtDate(x.rec.masteredAt)}` : ''}
            <br><span style="font-size:11.5px">${esc(x.f.desc)}</span>
          </div></div>`;
      }).join('')}</div>
    </div>`;
  document.getElementById('toHome').onclick = () => go('home');
  document.getElementById('csvBtn').onclick = downloadCsv;
  document.getElementById('resFilter').value = resFilter;
  document.getElementById('resSort').value = resSort;
  document.getElementById('resFilter').onchange = e => { resFilter = e.target.value; renderResult(); };
  document.getElementById('resSort').onchange = e => { resSort = e.target.value; renderResult(); };
  app.querySelectorAll('.kprow .hd').forEach(hd => hd.onclick = () => {
    const d = hd.parentElement.querySelector('.rdetail');
    d.style.display = d.style.display === 'none' ? 'block' : 'none';
  });
}
function downloadCsv(){
  const prog = accProgress(db.activeAccountId);
  const rows = FEATURES.map(f => ({f, rec: getItem(prog.items, kpId(f))}))
    .sort((a,b) => b.rec.totalWrong - a.rec.totalWrong);
  const head = ['カテゴリー','知識ポイント','問題文','正解','直近の解答','状態','累計正解数','累計誤答数','形式A誤答数','形式B誤答数','過去の誤答内容','最終誤答日','習得日'];
  const lines = [head.join(',')];
  for (const x of rows){
    const r = x.rec;
    const lastWrong = r.wrongLog.length ? r.wrongLog[r.wrongLog.length-1].at : '';
    const cells = [CATS[x.f.cat].label, x.f.name + '(' + x.f.kana + ')', x.f.desc, x.f.name,
      r.lastAnswered ? r.lastAnswered.answered : '', stateOf(r).label,
      r.totalCorrect, r.totalWrong, r.byFormat.A.wrong, r.byFormat.B.wrong,
      r.wrongLog.map(w => w.answered).join(';'), fmtDate(lastWrong), fmtDate(r.masteredAt)];
    lines.push(cells.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(','));
  }
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const name = `結果_${activeAcc().name}_${ymd}.csv`;
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- learn mode (free study) ---------- */
let learnSel = null;
function detailHtml(f){
  if (!f) return `<div class="detail panel"><div style="color:var(--sub);font-size:14px;text-align:center;padding:36px 6px;">地図の印か、下の表をタップすると<br>くわしい説明が出ます</div></div>`;
  const c = CATS[f.cat];
  return `<div class="detail panel">
    <span class="badge" style="background:${c.hex}">${c.label} ${f.id}</span>
    <span style="font-size:13px;font-weight:800;margin-left:6px">${f.imp===2?'重要度 ◎':f.imp===1?'重要度 ○':''}</span>
    <h2>${f.name}</h2><div class="kana">${f.kana}</div>
    <div class="desc">${esc(f.desc)}</div>
    ${f.area ? `<div style="margin-top:6px;font-size:12px;color:var(--sub)">面積:${f.area} km²</div>` : ''}
    <div class="navbtns"><button class="btn ghost" id="prevBtn">← 前へ</button><button class="btn ghost" id="nextBtn">次へ →</button></div>
  </div>`;
}
function renderLearn(){
  const items = scopePool();
  app.innerHTML = `<span class="backlink" id="bkHome">← ホームへ</span>
    <div class="panel" style="margin-bottom:8px">${scopeCtrls()}</div>
    <div class="maparea">
      <div class="mapcol panel">${mapSvg(items, {labels:true, structs:true, vb:curVb()})}${zoomRow()}
        <div class="maplegend"><span style="color:#8d5524;font-weight:800">━</span> 橋(明石海峡大橋・大鳴門橋・関門橋) <span style="color:#37474f;font-weight:800">┅</span> トンネル(青函トンネル)|印をタップで説明</div></div>
      <div class="sidecol" id="detailBox">${detailHtml(learnSel ? byKp(learnSel) : null)}</div>
    </div>
    <div class="listwrap panel" style="padding:0"><table class="list"><thead><tr>
      <th style="width:36px">記号</th><th>名前</th><th>よみがな</th><th style="width:46px">重要度</th><th style="width:56px">状態</th></tr></thead>
      <tbody>${listRows(items)}</tbody></table></div>`;
  document.getElementById('bkHome').onclick = () => go('home');
  bindScope(renderLearn);
  const mapcol = app.querySelector('.mapcol');
  bindZoom(mapcol);
  function select(k){
    learnSel = k;
    document.getElementById('detailBox').innerHTML = detailHtml(byKp(k));
    app.querySelectorAll('.marker').forEach(m => m.classList.toggle('sel', m.dataset.key === k));
    app.querySelectorAll('table.list tr[data-key]').forEach(r => r.classList.toggle('sel', r.dataset.key === k));
    const idx = items.findIndex(f => kpId(f) === k);
    document.getElementById('prevBtn').onclick = () => select(kpId(items[(idx-1+items.length)%items.length]));
    document.getElementById('nextBtn').onclick = () => select(kpId(items[(idx+1)%items.length]));
  }
  app.querySelectorAll('.marker').forEach(m => m.onclick = () => select(m.dataset.key));
  app.querySelectorAll('table.list tr[data-key]').forEach(r => r.onclick = () => select(r.dataset.key));
}
function listRows(items){
  const prog = activeAcc() ? accProgress(db.activeAccountId) : {items:{}};
  let html = '', lastCat = null;
  for (const f of items){
    if (scope.cat === 'all' && f.cat !== lastCat){
      lastCat = f.cat;
      html += `<tr class="grouphead"><td colspan="5" style="color:${CATS[f.cat].hex}">${CATS[f.cat].label}</td></tr>`;
    }
    const rec = prog.items[kpId(f)];
    const st = rec ? stateOf(rec) : {cls:'st-none', label:'未出題'};
    html += `<tr data-key="${kpId(f)}"><td><b style="color:${CATS[f.cat].hex}">${f.id}</b></td><td><b>${f.name}</b></td><td style="color:var(--sub)">${f.kana}</td><td style="text-align:center">${IMPMARK[f.imp]}</td><td><span class="statechip ${st.cls}" style="font-size:10px">${st.label}</span></td></tr>`;
  }
  return html;
}

/* ---------- flash cards (free practice, not recorded) ---------- */
let cardDir = 'k2j';
function renderCards(){
  let deck = shuffle(scopePool());
  const total = deck.length;
  let learned = 0, flipped = false;
  function draw(){
    if (!deck.length){
      app.innerHTML = `<span class="backlink" id="bkHome">← ホームへ</span><div class="panel result"><div class="score">全${total}枚 完了!</div><div class="stars">★★★</div>
        <div>おつかれさま!※カードは自由練習なので習得判定には入りません</div>
        <div class="navbtns" style="max-width:430px;margin:18px auto 0"><button class="btn big" id="again">もう一度</button></div></div>`;
      document.getElementById('bkHome').onclick = () => go('home');
      document.getElementById('again').onclick = renderCards;
      return;
    }
    const f = deck[0];
    const c = CATS[f.cat];
    const front = cardDir === 'k2j'
      ? `<div class="mid">この読みを<b>漢字</b>で書けるかな?</div><div class="big">${f.kana}</div>`
      : `<div class="mid">この名前、<b>読める</b>かな?</div><div class="big">${f.name}</div>`;
    app.innerHTML = `<span class="backlink" id="bkHome">← ホームへ</span>
      <div class="row" style="justify-content:center;margin-bottom:8px"><div class="seg">
        <button id="dirA" class="${cardDir==='k2j'?'on':''}">読み → 漢字</button>
        <button id="dirB" class="${cardDir==='j2k'?'on':''}">漢字 → 読み</button></div></div>
      <div class="deckinfo">のこり ${deck.length} 枚 / 覚えた ${learned} 枚|自由練習(記録されません)</div>
      <div class="card"><div class="face" id="face">
        <span class="badge" style="background:${c.hex};color:#fff;border-radius:6px;padding:2px 10px;font-size:12px;font-weight:700">${c.label} ${f.id} ${IMPMARK[f.imp]}</span>
        ${flipped ? `<div class="big">${f.name}</div><div class="mid">${f.kana}</div>
          <div style="font-size:13px;line-height:1.7;background:#f4f8fb;border-radius:8px;padding:9px;margin-top:8px">${esc(f.desc)}</div>
          <div class="minimap">${highlightSvg(f)}</div>`
        : front + `<div class="mid" style="margin-top:14px;color:#a9b5c2">タップでめくる</div>`}
      </div></div>
      <div class="cardbtns">${flipped
        ? `<button class="btn ok" id="okBtn">◎ 覚えた!</button><button class="btn ng" id="ngBtn">△ まだ…(あとでもう一度)</button>`
        : `<button class="btn" id="flipBtn">めくって答えを見る</button>`}</div>`;
    document.getElementById('bkHome').onclick = () => go('home');
    document.getElementById('dirA').onclick = () => { cardDir='k2j'; flipped=false; draw(); };
    document.getElementById('dirB').onclick = () => { cardDir='j2k'; flipped=false; draw(); };
    document.getElementById('face').onclick = () => { flipped = !flipped; draw(); };
    const fbn = document.getElementById('flipBtn');
    if (fbn) fbn.onclick = () => { flipped = true; draw(); };
    const ok = document.getElementById('okBtn');
    if (ok){
      ok.onclick = () => { deck.shift(); learned++; flipped=false; draw(); };
      document.getElementById('ngBtn').onclick = () => { deck.push(deck.shift()); flipped=false; draw(); };
    }
  }
  draw();
}

if (db.activeAccountId && activeAcc()) screen = 'home'; else screen = 'account';

if (SYNC.url) pullCloud();
