<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本国憲法の条文｜第9回</title>
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#242028; --sub:#6b6470;
  --line:#e2ded8; --pri:#2f4fb5; --pri-d:#22397f; --pri-l:#e8edfb;
  --ok:#1f8a5f; --ok-l:#e3f4ec; --ng:#c0392b; --ng-l:#fbe9e7;
  --warn:#b8860b; --warn-l:#fbf3dd; --gold:#c8952a;
  --r:14px; --sh:0 1px 3px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.75; letter-spacing:.02em;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 64px}
h1,h2,h3{line-height:1.5;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hide{display:none !important}

/* ---------- header ---------- */
header.top{
  background:linear-gradient(135deg,#2f4fb5,#4a3a8f); color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.15);
}
header.top .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;font-weight:800;flex:1}
header.top .sub{font-size:11px;opacity:.8;font-weight:400;display:block}
.accbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}

/* ---------- card ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:12px 0}
.card h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h2 .em{font-size:18px}
.muted{color:var(--sub);font-size:13px}
.tiny{font-size:12px;color:var(--sub)}

/* ---------- chips / segments ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--sub);line-height:1.3}
.chip .n{font-size:11px;font-weight:700;opacity:.75;margin-left:4px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.seg button{flex:1;padding:10px 4px;font-size:13.5px;font-weight:700;color:var(--sub);border-right:1.5px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--pri);color:#fff}

/* ---------- mode buttons ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:12px;padding:14px 10px;font-weight:800;font-size:15px;
  background:var(--pri);color:#fff;box-shadow:0 2px 0 var(--pri-d);text-align:center;line-height:1.4}
.mode small{display:block;font-size:11px;font-weight:600;opacity:.85;margin-top:2px}
.mode.alt{background:#fff;color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.mode.learn{background:linear-gradient(135deg,#c8952a,#a8761a);box-shadow:0 2px 0 #8a5f12;grid-column:1/-1}
.mode.recheck{background:#fff;color:var(--warn);border:2px solid var(--warn);box-shadow:none;grid-column:1/-1}
.mode:disabled{opacity:.4}

/* ---------- bars ---------- */
.bar{height:9px;border-radius:99px;background:#e8e5df;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.m{background:var(--pri)}
.bar i.w{background:#f0a500}
.bar i.o{background:#a9c2f2}
.brow{margin:9px 0}
.brow .lb{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.brow .lb b{font-weight:800}

/* ---------- badge ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--warn-l);color:#8a6508;
  border:1.5px solid #e6d08a;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:800}

/* ---------- list ---------- */
.lst{border-top:1px solid var(--line)}
.lst .it{border-bottom:1px solid var(--line);padding:10px 2px;display:flex;gap:9px;align-items:flex-start}
.lst .it .k{flex:1;min-width:0}
.lst .it .k b{font-weight:700;font-size:14.5px}
.tag{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px;white-space:nowrap;line-height:1.5}
.t-m{background:var(--pri);color:#fff}
.t-w{background:var(--warn-l);color:#8a6508;border:1.5px solid #e6d08a}
.t-c{background:#dfe8fb;color:var(--pri-d)}
.t-x{background:var(--ng-l);color:var(--ng)}
.t-n{background:#eeebe6;color:var(--sub)}
.imp2{color:var(--gold);font-weight:900}
.imp1{color:var(--pri);font-weight:900}

/* ---------- quiz ---------- */
.qhead{background:var(--bg);padding:8px 0 6px;margin:-4px 0 0}
.qmeta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--sub);margin:6px 0 4px}
.gauge{display:flex;gap:4px;align-items:center;font-size:13px;font-weight:700}
.gauge .d{width:13px;height:13px;border-radius:50%;background:#ddd8d0;display:inline-block}
.gauge .d.f{background:var(--ok)}
.qtext{font-size:17px;font-weight:700;line-height:1.95;margin:4px 0 6px}
.qtext .bl{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--pri);
  text-align:center;color:var(--pri);font-weight:900;vertical-align:baseline}
.artchip{display:inline-block;background:var(--pri-l);color:var(--pri-d);border-radius:7px;
  padding:2px 9px;font-size:12.5px;font-weight:800;margin-bottom:8px}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;
  text-align:left;font-size:15.5px;font-weight:700;line-height:1.6;min-height:52px}
.opt .no{display:inline-block;width:22px;height:22px;border-radius:50%;background:#eeebe6;
  color:var(--sub);font-size:12px;font-weight:800;text-align:center;line-height:22px;margin-right:8px}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.ng{border-color:var(--ng);background:var(--ng-l)}
.opt.dim{opacity:.5}
.fb{border-radius:12px;padding:13px 14px;margin-top:12px;font-size:14.5px;line-height:1.8}
.fb.ok{background:var(--ok-l);border:1.5px solid #b6e0cd}
.fb.ng{background:var(--ng-l);border:1.5px solid #f0c6c0}
.fb .hd{font-weight:900;font-size:15px;margin-bottom:4px}
.fb .full{background:#fff;border-radius:9px;padding:10px 11px;margin-top:9px;font-size:14px;line-height:1.9}
.fb .full em{font-style:normal;color:var(--pri);font-weight:900;border-bottom:2px solid var(--pri)}
.navbtns{display:flex;gap:9px;margin-top:14px}
.btn{border-radius:11px;padding:13px 16px;font-weight:800;font-size:15px;text-align:center}
.btn.pri{background:var(--pri);color:#fff;flex:1;box-shadow:0 2px 0 var(--pri-d)}
.btn.gh{background:#fff;border:2px solid var(--line);color:var(--sub)}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}

/* ---------- flashcard ---------- */
.fc{background:#fff;border-radius:18px;box-shadow:var(--sh);min-height:250px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;text-align:center;position:relative}
.fc .side{font-size:11px;font-weight:800;color:var(--sub);position:absolute;top:12px;left:16px;letter-spacing:.1em}
.fc .big{font-size:20px;font-weight:800;line-height:1.9}
.fc .small{font-size:14px;color:var(--sub);margin-top:12px;line-height:1.8}
.fc .hint{font-size:12px;color:var(--sub);margin-top:18px}
.fcrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* ---------- misc ---------- */
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat div{background:var(--pri-l);border-radius:11px;padding:11px 4px}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--pri-d);line-height:1.3}
.stat span{font-size:11px;color:var(--sub);font-weight:700}
.syncbar{border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.6;background:#eeebe6;color:var(--sub)}
.syncbar.ok{background:var(--ok-l);color:#136344}
.syncbar.ng{background:var(--ng-l);color:var(--ng)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tools .btn{flex:1 1 46%;min-width:140px;background:#fff;border:2px solid var(--line);color:var(--ink);font-size:13.5px;padding:11px 8px}
input[type=text],input[type=url],select{width:100%;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
label.f{display:block;font-size:12.5px;font-weight:800;color:var(--sub);margin:10px 0 4px}
.modal{position:fixed;inset:0;background:rgba(20,16,24,.55);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.modal h3{font-size:16px;font-weight:800;margin-bottom:8px}
.mrow{display:flex;gap:9px;margin-top:14px}
.mrow .btn{flex:1}
details.kp{border-bottom:1px solid var(--line)}
details.kp summary{padding:10px 2px;list-style:none;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
details.kp summary::-webkit-details-marker{display:none}
details.kp .body{padding:2px 2px 12px;font-size:13.5px;line-height:1.85;color:var(--sub)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filters select{width:auto;flex:1 1 46%;min-width:130px;padding:8px 10px;font-size:13.5px}
.warnbar{background:var(--warn-l);border:1.5px solid #e6d08a;color:#8a6508;border-radius:10px;
  padding:9px 12px;font-size:12.5px;font-weight:700;margin:8px 0}
.rank{display:flex;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.rank .n{background:var(--ng-l);color:var(--ng);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:800}
.ruby{font-size:11px;color:var(--sub);display:block;line-height:1.4}
ruby{ruby-align:center}
ruby rt{font-size:.47em;color:var(--sub);font-weight:600;letter-spacing:0;line-height:1.1}
.opt ruby rt,.fc ruby rt{color:#8a8390}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <h1>日本国憲法の条文<span class="sub">第9回・重要条文チェック</span></h1>
    <button class="accbtn" id="accBtn">👤 —</button>
  </div>
</header>
<div class="wrap" id="app"></div>
<div id="modalHost"></div>
<script>
/* ============================================================
   日本国憲法の条文  データ定義
   ============================================================ */
const APP  = 'kj-quiz-shakai-kenpou';

/* 条文マスタ  [条番号, カテゴリー(章), 要旨, 重要度] */
const ARTICLES = [

["第52条","国会","常会（通常国会）は毎年1回召集する",1],
["第53条","国会","臨時会の召集（総議員の4分の1以上の要求で決定しなければならない）",1],
["第54条","国会","解散後40日以内に総選挙・30日以内に国会召集／参議院の緊急集会",2],

   ============================================================ */
const ARTMAP = {}; ARTICLES.forEach(a=>ARTMAP[a[0]]={key:a[0],cat:a[1],sum:a[2],imp:a[3]});
const CATS = []; ARTICLES.forEach(a=>{ if(CATS.indexOf(a[1])<0) CATS.push(a[1]); });

const KPS = [];
FILLS.forEach(function(f,i){
  KPS.push({ id:'f'+String(i+1).padStart(3,'0'), kind:'fill',
    art:f[0], cat:ARTMAP[f[0]].cat, sent:f[1], ans:f[2], yomi:f[3], imp:f[4], note:f[5],
    label:f[2] });
});
ARTICLES.forEach(function(a,i){
  KPS.push({ id:'m'+String(i+1).padStart(3,'0'), kind:'match',
    art:a[0], cat:a[1], sum:a[2], ans:a[2], yomi:'', imp:a[3],
    note:'条文の番号と内容の対応を覚える問題です。', label:a[0]+'の内容' });
});
const KPMAP = {}; KPS.forEach(function(k){ KPMAP[k.id]=k; });

/* 語 → その語が登場する条文の集合（形式Bの選択肢から除くため） */
const ANS2ARTS = {};
KPS.forEach(function(k){ if(k.kind==='fill'){ (ANS2ARTS[k.ans]=ANS2ARTS[k.ans]||{})[k.art]=1; } });
const ANSPOOL = []; KPS.forEach(function(k){ if(k.kind==='fill'&&ANSPOOL.indexOf(k.ans)<0) ANSPOOL.push(k.ans); });

function $(s,r){ return (r||document).querySelector(s); }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function nowISO(){ return new Date().toISOString(); }
function jdate(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function jdatetime(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return '—';
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function ymd(){ var d=new Date(); return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }

  var src=s, store=[];
  RUBY_KEYS.forEach(function(k){
    if(src.indexOf(k)<0) return;
    var i=store.length; store.push('<ruby>'+k+'<rt>'+RUBY[k]+'</rt></ruby>');
    src=src.split(k).join('\u0001'+i+'\u0002');
  });
  src=src.replace(/\u0001(\d+)\u0002/g,function(m,i){ return store[+i]; });
  RUBY_CACHE[s]=src; return src;
}

/* 旧スキーマ移行（§10） */
function normItem(o){
  var it=blankItem(); if(!o||typeof o!=='object') return it;
  it.streak = +o.streak||0;
  it.mastered = !!o.mastered;
  it.masteredAt = o.masteredAt||null;
  it.postMasterWrong = +o.postMasterWrong||0;
  it.lastFormat = (o.lastFormat==='A'||o.lastFormat==='B')?o.lastFormat:null;
  it.totalCorrect = +o.totalCorrect||+o.correct||0;
  it.totalWrong = +o.totalWrong||+o.wrong||0;
  var bf=o.byFormat||{};
  ['A','B'].forEach(function(f){ var s=bf[f]||{}; it.byFormat[f]={correct:+s.correct||0,wrong:+s.wrong||0}; });
  it.wrongLog = Array.isArray(o.wrongLog)?o.wrongLog.filter(function(w){return w&&w.at;}).slice(-5):[];
  it.lastSeenAt = o.lastSeenAt||null;
  if(it.mastered && !it.masteredAt) it.masteredAt = it.lastSeenAt||nowISO();
  return it;
}
function normAcctProgress(p){
  var out={items:{},sessions:[]};
  if(p&&p.items) Object.keys(p.items).forEach(function(k){ out.items[k]=normItem(p.items[k]); });
  else if(p&&p.st) Object.keys(p.st).forEach(function(k){ out.items[k]=normItem(p.st[k]); });
  if(p&&Array.isArray(p.sessions)) out.sessions=p.sessions.slice(-100);
  return out;
}
function migrate(raw){
  if(!raw||typeof raw!=='object') return blankDB();
  var db=blankDB();
  db.updatedAt = raw.updatedAt||nowISO();
  if(Array.isArray(raw.accounts)&&raw.progress){
    db.accounts = raw.accounts.filter(function(a){return a&&a.name;}).map(function(a){
      return {id:a.id||newAccId(), name:String(a.name), createdAt:a.createdAt||nowISO()}; });
    db.accounts.forEach(function(a){ db.progress[a.id]=normAcctProgress(raw.progress[a.id]); });
    db.activeAccountId = raw.activeAccountId;
  } else if(raw.users&&typeof raw.users==='object'){
    Object.keys(raw.users).forEach(function(name){
      var id=newAccId();
      db.accounts.push({id:id,name:name,createdAt:nowISO()});
      db.progress[id]=normAcctProgress(raw.users[name]);
    });
  }
  if(!db.accounts.length){ db.activeAccountId=null; }
  else if(!db.accounts.some(function(a){return a.id===db.activeAccountId;})) db.activeAccountId=db.accounts[0].id;
  return db;
}

function dbHasRecords(d){

/* §13-3 合流（マージ） */
function mergeItem(a,b){
  /* a=ローカル b=クラウド。どちらか欠けたら他方 */
  if(!a) return normItem(b); if(!b) return normItem(a);
  a=normItem(a); b=normItem(b);
  var o=blankItem();
  o.totalCorrect=Math.max(a.totalCorrect,b.totalCorrect);
  o.totalWrong  =Math.max(a.totalWrong,b.totalWrong);
  o.postMasterWrong=Math.max(a.postMasterWrong,b.postMasterWrong);
  ['A','B'].forEach(function(f){
    o.byFormat[f].correct=Math.max(a.byFormat[f].correct,b.byFormat[f].correct);
    o.byFormat[f].wrong  =Math.max(a.byFormat[f].wrong,  b.byFormat[f].wrong);
  });
  o.mastered = a.mastered||b.mastered;
  if(a.masteredAt&&b.masteredAt) o.masteredAt = (new Date(a.masteredAt)<=new Date(b.masteredAt))?a.masteredAt:b.masteredAt;
  else o.masteredAt = a.masteredAt||b.masteredAt||null;
  if(o.mastered&&!o.masteredAt) o.masteredAt=nowISO();
  /* wrongLog: at で重複排除 → 新しい順に5件 */
  var seen={}, log=[];
  a.wrongLog.concat(b.wrongLog).forEach(function(w){ if(w&&w.at&&!seen[w.at+'|'+w.format]){ seen[w.at+'|'+w.format]=1; log.push(w); } });
  log.sort(function(x,y){ return new Date(y.at)-new Date(x.at); });
  o.wrongLog = log.slice(0,5).reverse();
  var at=a.lastSeenAt?new Date(a.lastSeenAt).getTime():0, bt=b.lastSeenAt?new Date(b.lastSeenAt).getTime():0;
  var newer = (at>=bt)?a:b;
  o.lastSeenAt = newer.lastSeenAt||a.lastSeenAt||b.lastSeenAt||null;
  o.streak     = newer.streak;      /* ★ 大きい方ではなく lastSeenAt が新しい側 */
  o.lastFormat = newer.lastFormat;
  return o;
}
function mergeDB(local,cloud){
  var out=blankDB();
  out.updatedAt = local.updatedAt||nowISO();
  var byName={};
  local.accounts.forEach(function(a){ byName[a.name]={id:a.id,name:a.name,createdAt:a.createdAt,l:local.progress[a.id],c:null}; });
  cloud.accounts.forEach(function(a){
    if(byName[a.name]) byName[a.name].c = cloud.progress[a.id];
    else byName[a.name]={id:a.id,name:a.name,createdAt:a.createdAt,l:null,c:cloud.progress[a.id]};
  });
  Object.keys(byName).forEach(function(n){
    var e=byName[n];
    out.accounts.push({id:e.id,name:e.name,createdAt:e.createdAt||nowISO()});
    var L=normAcctProgress(e.l), C=normAcctProgress(e.c), M={items:{},sessions:[]};
    var ids={}; Object.keys(L.items).forEach(function(k){ids[k]=1;}); Object.keys(C.items).forEach(function(k){ids[k]=1;});
    Object.keys(ids).forEach(function(k){ M.items[k]=mergeItem(L.items[k],C.items[k]); });
    var seen={}, ss=[];
    L.sessions.concat(C.sessions).forEach(function(s){ if(s&&s.finishedAt&&!seen[s.finishedAt]){ seen[s.finishedAt]=1; ss.push(s); } });
    ss.sort(function(x,y){ return new Date(y.finishedAt)-new Date(x.finishedAt); });
    M.sessions = ss.slice(0,100).reverse();
    out.progress[e.id]=M;
  });
  /* ローカルでアクティブだったアカウントを名前で維持 */
  var la = local.accounts.filter(function(a){return a.id===local.activeAccountId;})[0];
  var keep = la?out.accounts.filter(function(a){return a.name===la.name;})[0]:null;
  out.activeAccountId = keep?keep.id:(out.accounts[0]?out.accounts[0].id:null);
  return out;
}
function dbSummary(d){
  var acn=d.accounts.length, seen=0, mas=0;
  Object.keys(d.progress).forEach(function(k){
    var its=(d.progress[k]||{}).items||{};
    Object.keys(its).forEach(function(i){ var it=its[i];
      if(((+it.totalCorrect||0)+(+it.totalWrong||0))>0) seen++;
      if(it.mastered) mas++; });
  });
  return acn+'人・出題済み'+seen+'・習得'+mas;
}

async function pullCloud(silent){
  if(!syncReady()){ if(!silent) setSync('','クラウド同期は未設定です'); return; }
  setSync('','☁… クラウドと同期しています');
  var txt;
  try{
    var r=await fetch(SYNC.url+'?key='+encodeURIComponent(SYNC.key)+'&app='+encodeURIComponent(APP));
    txt=await r.text();
  }catch(e){ setSync('','☁ オフライン（ローカルには保存済み）'); return; }
  var j; try{ j=parseResp(txt); }catch(e){ setSync('ng','☁⚠ '+e.message); return; }
  if(!j.ok){ setSync('ng','☁⚠ '+(/key|合言葉|KEY/i.test(j.error||'')?'合言葉が違います':(j.error||'エラー'))); return; }
  var cloud = j.data?migrate(j.data):null;
  var lHas=dbHasRecords(DB), cHas=cloud?dbHasRecords(cloud):false;
  if(!cloud||!cHas){                     /* クラウドが空 → push */
    await pushCloud(false,'☁ クラウドに進捗が無かったので送りました'); return;
  }
  if(!lHas){                              /* ローカルが空 → 無条件でクラウド採用 */
    DB=cloud; saveDB({fromCloud:true}); SYNC.lastSync=nowISO(); saveSync();
    setSync('ok','☁✓ クラウドの記録を取り込みました（'+dbSummary(DB)+'）'); render(); return;
  }
  /* 両方に記録あり → 必ず合流 */
  var before=JSON.stringify(DB.accounts.map(function(a){return a.name;}).sort())+'|'+JSON.stringify(DB.progress);
  var merged=mergeDB(DB,cloud);
  var after =JSON.stringify(merged.accounts.map(function(a){return a.name;}).sort())+'|'+JSON.stringify(merged.progress);
  merged.updatedAt = DB.updatedAt;
  DB=merged; saveDB({fromCloud:true});
  SYNC.lastSync=nowISO(); saveSync();
  var mm='☁✓ クラウドと合流しました（'+dbSummary(DB)+'）';
  setSync('ok',mm);
  render();
  if(before!==after) await pushCloud(true,mm);   /* 合流の文言を上書きしない */
}
async function pushCloud(silent,okMsg){
  if(!syncReady()) return;
  if(!silent) setSync('','☁… 送信しています');
  var txt;
  try{
    var r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:SYNC.key,data:DB})});
    txt=await r.text();
  }catch(e){ setSync('','☁ オフライン（ローカルには保存済み）'); return; }
  var j; try{ j=parseResp(txt); }catch(e){ setSync('ng','☁⚠ '+e.message); return; }
  if(!j.ok){ setSync('ng','☁⚠ '+(/key|合言葉|KEY/i.test(j.error||'')?'合言葉が違います':(j.error||'エラー'))); return; }
  SYNC.lastSync=nowISO(); saveSync();
  setSync('ok', okMsg||'☁✓ クラウドに保存しました（'+dbSummary(DB)+'）');
}

/* ============================================================
   問題生成
   形式A＝場所から中身（穴埋め／条番号→内容）
   形式B＝中身から場所（語→条文／内容→条番号）
   ============================================================ */
function artLabel(key){ return key+'　'+ARTMAP[key].sum; }
function distractors(ans){
  var isNum=NUMRE.test(ans);
  var pool=ANSPOOL.filter(function(a){ return a!==ans && NUMRE.test(a)===isNum; });
  if(pool.length<3) pool=ANSPOOL.filter(function(a){return a!==ans;});
  pool=pool.slice().sort(function(x,y){ return Math.abs(x.length-ans.length)-Math.abs(y.length-ans.length); });
  var near=pool.slice(0,Math.min(pool.length,14));
  var pick=shuffle(near).slice(0,3);
  while(pick.length<3){ var c=ANSPOOL[Math.floor(Math.random()*ANSPOOL.length)];
    if(c!==ans&&pick.indexOf(c)<0) pick.push(c); }
  return pick;
}
function pickArts(exclude,cat,n){
  var cand=ARTICLES.filter(function(a){ return !exclude[a[0]]; });
  var same=shuffle(cand.filter(function(a){return a[1]===cat;}));
  var other=shuffle(cand.filter(function(a){return a[1]!==cat;}));
  return same.slice(0,2).concat(other, same.slice(2)).slice(0,n).map(function(a){return a[0];});
}
function makeQ(kp,fmt){
  if(kp.kind==='fill'){
    if(fmt==='A'){
      var ch=shuffle([kp.ans].concat(distractors(kp.ans)));
      return {fmt:'A',kind:'fill',lead:'つぎの条文の　□　に入ることばは？',
        art:kp.art, sent:kp.sent, choices:ch, correct:kp.ans};
    }
    var ex={}; ex[kp.art]=1; Object.keys(ANS2ARTS[kp.ans]||{}).forEach(function(k){ex[k]=1;});
    var ds=pickArts(ex,kp.cat,3);
    var ch2=shuffle([kp.art].concat(ds));
    return {fmt:'B',kind:'fill',lead:'「'+kp.ans+'」ということばが出てくるのは、どの条文？',
      art:null, sent:null, choices:ch2.map(artLabel), correct:artLabel(kp.art),
      keyword:kp.ans};
  }
  /* 条文対応KP */
  var ex2={}; ex2[kp.art]=1;
  if(fmt==='A'){
    var d=pickArts(ex2,kp.cat,3);
    var c=shuffle([kp.art].concat(d));
    return {fmt:'A',kind:'match',lead:kp.art+'は、どんなことを定めている？',
      art:kp.art, sent:null, choices:c.map(function(k){return ARTMAP[k].sum;}), correct:kp.sum};
  }
  var d2=pickArts(ex2,kp.cat,3);
  var c2=shuffle([kp.art].concat(d2));
  return {fmt:'B',kind:'match',lead:'「'+kp.sum+'」　これは第何条？',
    art:null, sent:null, choices:c2, correct:kp.art};
}

var S=null, view='home';

function priSort(list){
  return shuffle(list).sort(function(a,b){
    var x=itemRO(a.id), y=itemRO(b.id);
    var xw=x.totalWrong||0, yw=y.totalWrong||0;
    if(yw!==xw) return yw-xw;
    var xu=x.lastSeenAt?0:1, yu=y.lastSeenAt?0:1;
    if(yu!==xu) return yu-xu;
    return (x.lastSeenAt?new Date(x.lastSeenAt).getTime():0)-(y.lastSeenAt?new Date(y.lastSeenAt).getTime():0);
  });
}
function mkEntry(kp,fmt){ S.appear[kp.id]=(S.appear[kp.id]||0)+1; return {kpId:kp.id,fmt:fmt,q:makeQ(kp,fmt)}; }
function firstFmt(id){ var it=itemRO(id); if(it.lastFormat==='A') return 'B'; if(it.lastFormat==='B') return 'A'; return Math.random()<.5?'A':'B'; }

function startSession(mode,focusId){
  if(!acc()){ openAccounts(); return; }
  var scope=scopeKPs(), pool=[], note='';
  if(mode==='再確認'){
    pool=scope.filter(function(k){ return itemRO(k.id).postMasterWrong>0; });
    if(!pool.length){ toastModal('要注意習得のことばはまだありません','習得したあとに間違えたことばが、ここに集まります。'); return; }
  } else if(mode==='全問'){
    pool=shuffle(scope);
    if(!pool.length){ toastModal('この範囲に問題がありません','出題範囲をひろげてください。'); return; }
  } else {
    var n=(mode==='10問')?10:20;
    var cand=scope.filter(function(k){ return !itemRO(k.id).mastered; });
    if(!cand.length){ toastModal('この範囲はすべて習得ずみです','範囲をひろげるか、「全問モード」で力だめしをしましょう。'); return; }
    pool=priSort(cand).slice(0,n);
    if(focusId&&KPMAP[focusId]){
      pool=pool.filter(function(k){ return k.id!==focusId; });
      pool.unshift(KPMAP[focusId]); pool=pool.slice(0,n);
    }
    if(pool.length<n) note='この範囲でまだ習得していないことばは'+pool.length+'語です。'+pool.length+'語で出題します。';
  }
  S={ mode:mode, startedAt:nowISO(), items:{}, queue:[], pos:0, log:[],
      correct:0, wrong:0, newly:[], wrongIds:{}, appear:{}, needReview:{},
      view:null, note:note, poolIds:pool.map(function(k){return k.id;}),
      masteredAtStart:{}, planned:0, committed:false };
  var p=prog();
  pool.forEach(function(k){
    S.items[k.id]= p.items[k.id]?clone(p.items[k.id]):blankItem();
    if(S.items[k.id].mastered) S.masteredAtStart[k.id]=1;
  });
  if(mode==='再確認'){
    var f1=pool.map(function(k){ return mkEntry(k,firstFmt(k.id)); });
    var f2=shuffle(pool).map(function(k){ var g=f1.filter(function(e){return e.kpId===k.id;})[0];
      return mkEntry(k, g.fmt==='A'?'B':'A'); });
    S.queue=f1.concat(f2);
    S.planned=S.queue.length;
  } else {
    S.queue=pool.map(function(k){ return mkEntry(k,firstFmt(k.id)); });
    if(mode==='全問') S.planned=pool.length;
    else S.planned=pool.reduce(function(s,k){ var it=S.items[k.id];
      return s+Math.max(1, requiredStreak(it)-(it.mastered?requiredStreak(it):it.streak)); },0);
  }
  view='quiz'; render();
  if(note) toastModal('出題数のおしらせ',note);
}

function curEntry(){ return S.queue[S.pos]; }
function answered(){ return S.log.length>S.pos; }

function applyAnswer(e,choice){
  var it=S.items[e.kpId], ok=(choice===e.q.correct), t=nowISO();
  e.chosen=choice; e.ok=ok;
  if(ok) S.correct++; else { S.wrong++; S.wrongIds[e.kpId]=1; }
  if(S.mode==='再確認'){
    if(!ok) it.postMasterWrong++;
  } else {
    var prev=it.lastFormat;
    if(ok){
      it.totalCorrect++; it.byFormat[e.fmt].correct++;
      if(!(it.streak>0 && prev===e.fmt)) it.streak++;
    } else {
      it.totalWrong++; it.byFormat[e.fmt].wrong++; it.streak=0;
      it.wrongLog.push({at:t,format:e.fmt,answered:String(choice).slice(0,60)});
      if(it.wrongLog.length>5) it.wrongLog=it.wrongLog.slice(-5);
      if(it.mastered) it.postMasterWrong++;
    }
    it.lastFormat=e.fmt; it.lastSeenAt=t;
    if(!it.mastered && it.streak>=requiredStreak(it)){
      it.mastered=true; it.masteredAt=t; if(S.newly.indexOf(e.kpId)<0) S.newly.push(e.kpId); }
  }
  if(S.mode!=='全問'){
    if(!ok) reinsert(e,3);
    else if(S.mode!=='再確認' && !it.mastered) reinsert(e,6);
  }
  return ok;
}
function reinsert(e,delay){
  if((S.appear[e.kpId]||0)>=4){ S.needReview[e.kpId]=1; return; }
  var kp=KPMAP[e.kpId], base=S.queue.indexOf(e); if(base<0) base=S.pos;
  var idx=Math.min(base+delay,S.queue.length);
  while(idx<S.queue.length && S.queue[idx].kpId===e.kpId) idx++;
  S.queue.splice(idx,0,mkEntry(kp, e.fmt==='A'?'B':'A'));
}
function doAnswer(choice){
  if(answered()) return;
  var e=curEntry();
  var snap={ item:clone(S.items[e.kpId]), queue:S.queue.slice(), correct:S.correct, wrong:S.wrong,
    newly:S.newly.slice(), appear:clone(S.appear), needReview:clone(S.needReview), wrongIds:clone(S.wrongIds) };
  applyAnswer(e,choice);
  S.log.push({e:e,snap:snap});
  renderQuiz();
}
function undoLast(){
  var r=S.log.pop(); if(!r) return null;
  S.items[r.e.kpId]=r.snap.item; S.queue=r.snap.queue; S.correct=r.snap.correct; S.wrong=r.snap.wrong;
  S.newly=r.snap.newly; S.appear=r.snap.appear; S.needReview=r.snap.needReview; S.wrongIds=r.snap.wrongIds;
  delete r.e.chosen; delete r.e.ok;
  return r;
}
function reAnswer(choice){
  var r=undoLast(); if(!r) return;
  applyAnswer(r.e,choice);
  S.log.push({e:r.e,snap:r.snap});
  S.pos=S.log.length; renderQuiz();
}
function nextQ(){
  S.pos=S.log.length;
  if(S.pos>=S.queue.length){ finishSession(); return; }
  renderQuiz();
}

/* §6-2 §11 結果画面到達時にのみ確定 */
function finishSession(){
  if(!S.committed){
    var p=prog();
    Object.keys(S.items).forEach(function(id){ p.items[id]=S.items[id]; });
    var totalMastered=0;
    KPS.forEach(function(k){ if((p.items[k.id]||{}).mastered) totalMastered++; });
    p.sessions.push({ startedAt:S.startedAt, finishedAt:nowISO(), mode:S.mode,
      correct:S.correct, wrong:S.wrong, newlyMastered:S.newly.slice(),
      wrongKpIds:Object.keys(S.wrongIds), totalMastered:totalMastered });
    if(p.sessions.length>100) p.sessions=p.sessions.slice(-100);
    S.committed=true;
    saveDB(); pushCloud(true);
  }
  view='result'; render();
}
function leaveQuiz(){
  if(S&&!S.committed&&S.log.length){
    openModal('とちゅうでやめますか？',
      '<p>結果画面まで進んでいないので、<b>今回の解答は記録されません</b>。<br>習得の記録も変わりません。</p>',
      [{t:'つづける',cls:'pri',fn:closeModal},
       {t:'やめてホームへ',cls:'gh',fn:function(){ closeModal(); S=null; view='home'; render(); }}]);
  } else { S=null; view='home'; render(); }
}

function statsFor(list){
  var p=prog()||{items:{}}, s={n:list.length,mas:0,warn:0,part:0};
  list.forEach(function(k){ var it=p.items[k.id];
    if(!it) return;
    if(it.mastered){ if(it.postMasterWrong>0) s.warn++; else s.mas++; }
    else if((it.totalCorrect||0)>0) s.part++; });
  return s;
}

/* ============================================================
   出題画面
   ============================================================ */
function renderQuiz(){
  var app=$('#app'); app.innerHTML='';
  if(S.view!=null){ renderReview(); return; }
  if(S.pos>=S.queue.length){ finishSession(); return; }
  var e=curEntry(), kp=KPMAP[e.kpId], it=S.items[e.kpId], done=answered();

  var head=el('div','qhead');
  var total=Math.max(S.planned,S.queue.length);
  var remainKp={}; S.queue.slice(S.pos).forEach(function(x){ remainKp[x.kpId]=1; });
  head.innerHTML='<div class="bar"><i class="m" style="width:'+((S.pos+(done?1:0))/total*100)+'%"></i></div>'+
    '<div class="qmeta"><span>'+esc(S.mode)+'モード　'+(S.pos+1)+'問目 / 全'+total+'問</span>'+
    '<span>あと'+Object.keys(remainKp).length+'語　｜　⭕'+S.correct+'　❌'+S.wrong+'</span></div>';
  app.appendChild(head);

  var c=el('div','card');
  /* 習得ゲージ */
  if(S.mode!=='再確認'){
    var req=requiredStreak(it), g=el('div','gauge');
    var gh='<span class="tiny" style="font-weight:700">習得まで</span>';
    for(var i=0;i<req;i++) gh+='<span class="d'+((it.mastered||i<it.streak)?' f':'')+'"></span>';
    if(it.mastered) gh+='<span class="tag t-'+(it.postMasterWrong>0?'w':'m')+'">'+(it.postMasterWrong>0?'要注意習得':'習得ずみ')+'</span>';
    else if(req>2) gh+='<span class="tiny">このことばは苦手なので'+req+'回必要</span>';
    g.innerHTML=gh; g.style.marginBottom='10px'; c.appendChild(g);
  } else {
    c.appendChild(el('div','tiny','再確認モードでは、習得の記録は変わりません（要注意の記録だけ更新します）'));
  }

  var lead=el('div','tiny'); lead.textContent='【形式'+e.fmt+'】'+(e.q.sent?e.q.lead:''); c.appendChild(lead);
  if(e.q.art){ var ac=el('span','artchip',e.q.art); c.appendChild(ac); }
  var q=el('div','qtext');
  if(e.q.sent) q.innerHTML=rubify(esc(e.q.sent)).replace(/【[\s\S]+?】/,'<span class="bl">？</span>');
  else q.innerHTML=rubify(esc(e.q.lead));
  c.appendChild(q);

  var opts=el('div','opts');
  e.q.choices.forEach(function(ch,i){
    var b=el('button','opt');
    b.innerHTML='<span class="no">'+(i+1)+'</span>'+rubify(esc(ch));
    if(done){
      if(ch===e.q.correct) b.className='opt ok';
      else if(ch===e.chosen) b.className='opt ng';
      else b.className='opt dim';
    } else b.onclick=function(){ doAnswer(ch); };
    opts.appendChild(b);
  });
  c.appendChild(opts);

  if(done) c.appendChild(feedbackEl(e,kp,it));
  app.appendChild(c);

  var nav=el('div','navbtns');
  if(!done && S.log.length>=1){
    var bk=el('button','btn gh','← 前の問題へ');
    bk.onclick=function(){ S.view=S.log.length-1; renderQuiz(); };
    nav.appendChild(bk);
  }
  if(done){
    var nx=el('button','btn pri', (S.log.length>=S.queue.length)?'結果を見る →':'つぎの問題 →');
    nx.onclick=nextQ; nav.appendChild(nx);
  }
  var rt=rubyToggle(); rt.className='btn gh sm'; nav.appendChild(rt);
  var hm=el('button','btn gh','中止'); hm.onclick=leaveQuiz; nav.appendChild(hm);
  app.appendChild(nav);
  window.scrollTo(0,0);
}
function feedbackEl(e,kp,it){
  var f=el('div','fb '+(e.ok?'ok':'ng'));
  var h='<div class="hd">'+(e.ok?'⭕ 正解！':'❌ ざんねん')+'</div>';
  if(!e.ok) h+='<div>正しくは <b>'+rubify(esc(e.q.correct))+'</b></div>';
  if(kp.kind==='fill'){
    h+='<div class="full">'+esc(kp.art)+'　'+rubify(esc(kp.sent)).replace(/【([\s\S]+?)】/,'<em>$1</em>')+
       '<div class="ruby">'+esc(kp.ans)+'（'+esc(kp.yomi)+'）　'+esc(impText(kp.imp))+'</div></div>';
  } else {
    h+='<div class="full"><b>'+esc(kp.art)+'</b>　'+rubify(esc(kp.sum))+'</div>';
  }
  h+='<div style="margin-top:8px">💡 '+esc(kp.note)+'</div>';
  f.innerHTML=h;
  return f;
}
/* §6-1 前の問題へ戻る */
function renderReview(){
  var app=$('#app'), i=S.view, r=S.log[i], e=r.e, kp=KPMAP[e.kpId];
  var last=(i===S.log.length-1);
  var c=el('div','card');
  c.innerHTML='<div class="tiny">見直し中（'+(i+1)+'問目 / 解答ずみ'+S.log.length+'問）'+
    (last?'　― この1問だけ答え直せます':'　― この問題は見るだけです')+'</div>';
  var lead=el('div','tiny'); lead.textContent='【形式'+e.fmt+'】'+(e.q.sent?e.q.lead:''); c.appendChild(lead);
  if(e.q.art) c.appendChild(el('span','artchip',e.q.art));
  var q=el('div','qtext');
  if(e.q.sent) q.innerHTML=rubify(esc(e.q.sent)).replace(/【[\s\S]+?】/,'<span class="bl">？</span>');
  else q.innerHTML=rubify(esc(e.q.lead));
  c.appendChild(q);
  var opts=el('div','opts');
  e.q.choices.forEach(function(ch,n){
    var b=el('button','opt');
    b.innerHTML='<span class="no">'+(n+1)+'</span>'+rubify(esc(ch));
    if(ch===e.q.correct) b.className='opt ok';
    else if(ch===e.chosen) b.className='opt ng';
    else b.className='opt dim';
    if(last){ b.onclick=function(){ reAnswer(ch); }; }
    opts.appendChild(b);
  });
  c.appendChild(opts);
  c.appendChild(feedbackEl(e,kp,S.items[e.kpId]));
  app.appendChild(c);
  var nav=el('div','navbtns');
  if(i>0){ var p=el('button','btn gh','← さらに前'); p.onclick=function(){ S.view=i-1; renderQuiz(); }; nav.appendChild(p); }
  var nx=el('button','btn pri', last?'出題にもどる →':'つぎへ →');
  nx.onclick=function(){ if(last){ S.view=null; S.pos=S.log.length; } else S.view=i+1; renderQuiz(); };
  nav.appendChild(nx);
  app.appendChild(nav);
  window.scrollTo(0,0);
}

/* ============================================================
   §8 結果画面
   ============================================================ */
var RF={cat:'すべて',st:'すべて',sort:'wrong'};
function renderResult(){
  var app=$('#app'); app.innerHTML=''; var p=prog();
  var tot=S.correct+S.wrong, rate=tot?Math.round(S.correct/tot*100):0;

  var c1=el('div','card');
  c1.innerHTML='<h2><span class="em">🎉</span>'+esc(S.mode)+'モード の結果</h2>'+
    '<div class="stat"><div><b>'+S.correct+'</b><span>正解</span></div>'+
    '<div><b>'+S.wrong+'</b><span>誤答</span></div>'+
    '<div><b>'+rate+'%</b><span>正答率</span></div>'+
    '<div><b>'+S.newly.length+'</b><span>新しく習得</span></div></div>';
  if(S.newly.length) c1.appendChild(el('div','tiny','🏅 新しく習得：'+S.newly.map(function(id){return KPMAP[id].label;}).join('、')));
  var nr=Object.keys(S.needReview);
  if(nr.length) c1.appendChild(el('div','warnbar','⚠ 要復習：'+nr.map(function(id){return KPMAP[id].label;}).join('、')+'（1回のセッションで4回出題しても定着しませんでした）'));
  app.appendChild(c1);

  var wrongs=S.log.filter(function(r){ return !r.e.ok; });
  var c2=el('div','card');
  c2.innerHTML='<h2><span class="em">❌</span>今回まちがえた問題（'+wrongs.length+'）</h2>';
  if(!wrongs.length) c2.appendChild(el('p','muted','ぜんぶ正解でした！すばらしい。'));
  wrongs.forEach(function(r){
    var kp=KPMAP[r.e.kpId], d=el('div','it');
    d.innerHTML='<div class="k"><b>'+esc(kp.label)+'</b> <span class="tag t-n">形式'+r.e.fmt+'</span>'+
      '<div class="tiny">あなたの答え：'+esc(r.e.chosen)+'　→　正解：'+esc(r.e.q.correct)+'</div>'+
      '<div class="tiny">'+esc(kp.art)+'　'+esc(kp.kind==='fill'?kp.sent.replace(/【|】/g,'　'):kp.sum)+'</div>'+
      '<div class="tiny">💡'+esc(kp.note)+'</div></div>';
    c2.appendChild(d);
  });
  c2.className='card lst'; app.appendChild(c2);

  /* 全問一覧（範囲選択の影響を受けない） */
  var c3=el('div','card');
  c3.innerHTML='<h2><span class="em">📚</span>カテゴリー別 全問一覧<span class="tiny" style="font-weight:400">（全'+KPS.length+'語）</span></h2>';
  var fl=el('div','filters');
  function sel(id,opts,val,fn){ var s=document.createElement('select');
    opts.forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1];
      if(o[0]===val) op.selected=true; s.appendChild(op); });
    s.onchange=function(){ fn(s.value); }; fl.appendChild(s); }
  sel('c',[['すべて','カテゴリー：すべて']].concat(CATS.map(function(x){return [x,'カテゴリー：'+x];})),RF.cat,function(v){RF.cat=v;renderResult();});
  sel('s',[['すべて','状態：すべて'],['習得済み','状態：習得済み'],['要注意習得','状態：要注意習得'],['未習得','状態：未習得'],['未出題','状態：未出題']],RF.st,function(v){RF.st=v;renderResult();});
  sel('o',[['wrong','並び：誤答が多い順'],['cat','並び：条文順'],['imp','並び：重要度順']],RF.sort,function(v){RF.sort=v;renderResult();});
  c3.appendChild(fl);

  var list=KPS.filter(function(k){
    if(RF.cat!=='すべて'&&k.cat!==RF.cat) return false;
    var st=stateLabel(p.items[k.id]);
    if(RF.st==='すべて') return true;
    if(RF.st==='未習得') return st!=='習得済み'&&st!=='要注意習得'&&st!=='未出題';
    return st===RF.st;
  });
  if(RF.sort==='wrong') list=list.slice().sort(function(x,y){ return ((p.items[y.id]||{}).totalWrong||0)-((p.items[x.id]||{}).totalWrong||0); });
  else if(RF.sort==='imp') list=list.slice().sort(function(x,y){ return y.imp-x.imp; });
  var host=el('div','');
  list.forEach(function(k){
    var it=p.items[k.id]||blankItem();
    var d=document.createElement('details'); d.className='kp';
    var sm=document.createElement('summary');
    sm.innerHTML='<span style="flex:1;min-width:0"><b>'+esc(k.label)+'</b> <span class="imp'+k.imp+'">'+impMark(k.imp)+'</span>'+
      '<span class="tiny"> '+esc(k.art)+'・'+esc(k.cat)+'</span></span>'+
      (it.totalWrong>1?'<span class="tag t-x">誤答'+it.totalWrong+'回</span>':(it.totalWrong===1?'<span class="tag t-n">誤答1回</span>':''))+
      '<span class="tag '+tagCls(it)+'">'+esc(stateLabel(it))+'</span>';
    d.appendChild(sm);
    var bd=el('div','body');
    var h='';
    if(k.kind==='fill') h+=esc(k.art)+'　'+rubify(esc(k.sent)).replace(/【([\s\S]+?)】/,'<em style="font-style:normal;color:var(--pri);font-weight:900">$1</em>')+'<br><span class="ruby">'+esc(k.yomi)+'</span>';
    else h+='<b>'+esc(k.art)+'</b>　'+rubify(esc(k.sum));
    h+='<br>💡'+esc(k.note);
    h+='<br>形式A：正'+it.byFormat.A.correct+'／誤'+it.byFormat.A.wrong+
       '　形式B：正'+it.byFormat.B.correct+'／誤'+it.byFormat.B.wrong;
    if(it.wrongLog.length) h+='<br>過去の誤答：'+it.wrongLog.map(function(w){return esc(w.answered)+'（形式'+w.format+'・'+jdate(w.at)+'）';}).join('／');
    if(it.masteredAt) h+='<br>習得日：'+jdate(it.masteredAt)+(it.postMasterWrong?'（習得後の誤答 '+it.postMasterWrong+'回）':'');
    bd.innerHTML=h; d.appendChild(bd); host.appendChild(d);
  });
  c3.appendChild(host);
  app.appendChild(c3);

  var nav=el('div','navbtns');
  var b1=el('button','btn pri','ホームへもどる'); b1.onclick=function(){ S=null; view='home'; render(); };
  var b2=el('button','btn gh','📄 CSV'); b2.onclick=downloadCSV;
  nav.appendChild(b1); nav.appendChild(b2); app.appendChild(nav);
  window.scrollTo(0,0);
}

/* ============================================================
   §3-4 覚えるモード（記録・習得判定・同期に一切影響しない）
   ============================================================ */
var L={tab:'list',idx:0,deck:[],di:0,flip:false,dir:'A',done:0};
function renderLearn(){
  var app=$('#app'); app.innerHTML='';
  var sc=scopeKPs();
  var top=el('div','card');
  top.innerHTML='<h2><span class="em">📖</span>覚えるモード<span class="tiny" style="font-weight:400">（記録は変わりません）</span></h2>';
  var seg=el('div','seg');
  [['list','📋 一覧学習'],['card','🃏 単語カード']].forEach(function(o){
    var b=el('button',L.tab===o[0]?'on':'',o[1]);
    b.onclick=function(){ L.tab=o[0]; if(o[0]==='card') buildDeck(); renderLearn(); };
    seg.appendChild(b);
  });
  top.appendChild(seg);
  top.appendChild(el('div','tiny','範囲：'+(UI.category)+'／'+({all:'すべて',top2:'◎○のみ',top1:'◎のみ'}[UI.impFilter])+'　'+sc.length+'語'));
  var row=el('div','navbtns');
  var hb=el('button','btn gh sm','← ホームへ'); hb.onclick=function(){ view='home'; render(); };
  row.appendChild(hb); row.appendChild(rubyToggle()); top.appendChild(row);
  app.appendChild(top);
  if(!sc.length){ app.appendChild(el('div','card','この範囲に語がありません。')); return; }
  if(L.tab==='list') learnList(app,sc); else learnCards(app,sc);
  window.scrollTo(0,0);
}
function learnList(app,sc){
  if(L.idx>=sc.length) L.idx=0;
  var k=sc[L.idx], it=itemRO(k.id);
  var c=el('div','card');
  var h='<div class="tiny">'+(L.idx+1)+' / '+sc.length+'　'+esc(k.cat)+'</div>'+
    '<span class="artchip">'+esc(k.art)+'</span>'+
    '<div class="qtext">';
  if(k.kind==='fill') h+=rubify(esc(k.sent)).replace(/【([\s\S]+?)】/,'<em style="font-style:normal;color:var(--pri);font-weight:900;border-bottom:3px solid var(--pri)">$1</em>');
  else h+=rubify(esc(k.sum));
  h+='</div>';
  if(k.kind==='fill') h+='<div class="ruby">'+esc(k.ans)+'（'+esc(k.yomi)+'）</div>';
  h+='<div style="margin-top:8px">💡'+esc(k.note)+'</div>'+
     '<div style="margin-top:10px"><span class="imp'+k.imp+'">'+esc(impText(k.imp))+'</span>　'+
     '<span class="tag '+tagCls(it)+'">'+esc(stateLabel(it))+'</span></div>';
  c.innerHTML=h;
  var nav=el('div','navbtns');
  var pb=el('button','btn gh','← 前へ'); pb.onclick=function(){ L.idx=(L.idx-1+sc.length)%sc.length; renderLearn(); };
  var nb=el('button','btn pri','次へ →'); nb.onclick=function(){ L.idx=(L.idx+1)%sc.length; renderLearn(); };
  nav.appendChild(pb); nav.appendChild(nb);
  c.appendChild(nav);
  app.appendChild(c);

  var c2=el('div','card lst');
  c2.innerHTML='<h2><span class="em">🗂</span>一覧（タップで表示）</h2>';
  var cur=null;
  sc.forEach(function(kk,i){
    if(kk.cat!==cur){ cur=kk.cat; var hd=el('div','tiny'); hd.style.cssText='font-weight:800;margin-top:8px'; hd.textContent='― '+cur+' ―'; c2.appendChild(hd); }
    var d=el('div','it'); d.style.cursor='pointer';
    d.innerHTML='<div class="k"><b>'+esc(kk.label)+'</b> <span class="imp'+kk.imp+'">'+impMark(kk.imp)+'</span>'+
      '<div class="tiny">'+esc(kk.art)+'</div></div><span class="tag '+tagCls(itemRO(kk.id))+'">'+esc(stateLabel(itemRO(kk.id)))+'</span>';
    d.onclick=function(){ L.idx=i; renderLearn(); };
    c2.appendChild(d);
  });
  app.appendChild(c2);
}
function buildDeck(){ L.deck=shuffle(scopeKPs()).map(function(k){return k.id;}); L.di=0; L.flip=false; L.done=0; }
function learnCards(app,sc){
  if(!L.deck.length || L.deck.some(function(id){ return !inScope(KPMAP[id]); })) buildDeck();
  var c0=el('div','card');
  var seg=el('div','seg');
  [['A','形式A：条文 → ことば'],['B','形式B：ことば → 条文']].forEach(function(o){
    var b=el('button',L.dir===o[0]?'on':'',o[1]);
    b.onclick=function(){ L.dir=o[0]; L.flip=false; renderLearn(); }; seg.appendChild(b);
  });
  c0.appendChild(seg);
  c0.appendChild(el('div','tiny','のこり '+L.deck.length+'枚　／　「覚えた」は画面上だけの印で、記録には残りません'));
  app.appendChild(c0);
  if(!L.deck.length){
    var fin=el('div','card');
    fin.innerHTML='<h2>🎊 デッキをぜんぶ覚えました！</h2><p class="muted">記録は変わっていません。</p>';
    var b=el('button','btn pri wide','もう一度シャッフル'); b.onclick=function(){ buildDeck(); renderLearn(); };
    fin.appendChild(b); app.appendChild(fin); return;
  }
  if(L.di>=L.deck.length) L.di=0;
  var k=KPMAP[L.deck[L.di]];
  var fc=el('div','fc');
  var front,back;
  if(k.kind==='fill'){
    front = (L.dir==='A') ? (k.art+'<br>'+rubify(esc(k.sent)).replace(/【[\s\S]+?】/,'<span class="bl">？</span>')) : rubify(esc(k.ans));
    back  = (L.dir==='A') ? rubify(esc(k.ans))+'<div class="ruby">'+esc(k.yomi)+'</div>'
                          : (k.art+'<br>'+rubify(esc(k.sent)).replace(/【([\s\S]+?)】/,'<em style="font-style:normal;color:var(--pri);font-weight:900">$1</em>'));
  } else {
    front = (L.dir==='A') ? esc(k.art) : rubify(esc(k.sum));
    back  = (L.dir==='A') ? rubify(esc(k.sum)) : esc(k.art);
  }
  fc.innerHTML='<div class="side">'+(L.flip?'うら（こたえ）':'おもて')+'</div>'+
    '<div class="big">'+(L.flip?back:front)+'</div>'+
    (L.flip?'<div class="small">💡'+esc(k.note)+'</div>':'<div class="hint">タップしてめくる</div>');
  fc.onclick=function(){ L.flip=!L.flip; renderLearn(); };
  app.appendChild(fc);
  var row=el('div','fcrow');
  var b1=el('button','btn gh','まだ　（後ろへ）');
  b1.onclick=function(){ var id=L.deck.splice(L.di,1)[0]; L.deck.push(id); L.flip=false; if(L.di>=L.deck.length)L.di=0; renderLearn(); };
  var b2=el('button','btn pri','覚えた　（外す）');
  b2.onclick=function(){ L.deck.splice(L.di,1); L.done++; L.flip=false; if(L.di>=L.deck.length)L.di=0; renderLearn(); };
  row.appendChild(b1); row.appendChild(b2); app.appendChild(row);
}

/* ============================================================
   起動
   ============================================================ */
function render(){
  if(view==='quiz'&&S) renderQuiz();
  else if(view==='result'&&S) renderResult();
  else if(view==='learn') renderLearn();
  else { view='home'; renderHome(); }
}
$('#accBtn').onclick=function(){ if(view==='quiz'&&S&&S.log.length){ leaveQuiz(); return; } openAccounts(); };
window.addEventListener('beforeunload',function(ev){
  if(view==='quiz'&&S&&!S.committed&&S.log.length){ ev.preventDefault(); ev.returnValue=''; }
});
loadAll();
if(syncReady()) setSync('','☁… クラウドと同期しています');
render();
if(syncReady()) pullCloud(true);

</script>
