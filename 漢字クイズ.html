<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漢字 - 学習ツール</title>
<style>
:root{--pri:#3949ab;--pri2:#5c6bc0;--ok:#2e7d32;--ng:#c62828;--warn:#ef6c00;--bg:#f4f5fb;--card:#fff;--tx:#263238;--mut:#78909c;--line:#e0e4ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.65}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
header .ttl{font-weight:700;font-size:17px}
header .ver{font-size:11px;opacity:.75;margin-left:6px}
#accBtn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:16px;padding:6px 12px;font-size:13px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:12px 12px 60px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(30,40,90,.08)}
.card h2{font-size:16px;margin:0 0 10px}
.card h2 .em{margin-right:6px}
.muted{color:var(--mut);font-size:13px}
.tiny{color:var(--mut);font-size:11.5px}
.btn{display:inline-block;background:#eef0fa;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.btn.gh{background:transparent;border:1px dashed var(--mut);color:var(--mut)}
.btn.wide{display:block;width:100%}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .btn{padding:16px 8px;font-size:16px;font-weight:700}
.modes .btn small{display:block;font-weight:400;font-size:11px;color:var(--mut);margin-top:2px}
.modes .btn.pri small{color:#dfe3ff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip.on{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:700}
.seg{display:flex;border:1.5px solid var(--pri2);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:none;background:#fff;color:var(--pri);padding:9px 4px;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;font-weight:700}
.selrow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
select{font-size:15px;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:#fff}
.tglrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px}
.tgl{width:46px;height:26px;border-radius:13px;background:#cfd8dc;border:none;position:relative;cursor:pointer;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:var(--pri)}
.tgl.on::after{left:23px}
.bar{height:12px;background:#e8eaf6;border-radius:6px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:6px}
.barrow{margin:7px 0}
.barrow .lb{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:2px}
.ubits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ubit{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:3px 7px;background:#fff;cursor:pointer}
.ubit b{color:var(--pri)}
.ubit.done{background:var(--pri);border-color:var(--pri);color:#fff}
.ubit.done b{color:#fff}
.ubit.mark{border:2px solid var(--warn)}
.shiori{background:#fff8e1;border-radius:9px;padding:8px 10px;font-size:13px;margin:8px 0;color:#795548}
.badge{display:inline-block;background:var(--warn);color:#fff;border-radius:10px;font-size:11.5px;padding:2px 8px;margin-left:6px}
.syncbar{border-radius:9px;padding:8px 10px;font-size:12.5px;background:#eceff1;color:var(--mut);margin-bottom:10px}
.syncbar.ok{background:#e8f5e9;color:var(--ok)}
.syncbar.ng{background:#ffebee;color:var(--ng)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools .btn{font-size:13.5px;padding:11px 6px}
/* quiz */
.qhead{position:sticky;top:52px;z-index:10;background:var(--bg);padding:6px 0 4px}
.qmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:4px}
.gauge{letter-spacing:2px;color:var(--pri);font-size:14px}
.qsent{font-size:20px;line-height:2.1;margin:14px 0;overflow-wrap:anywhere}
.blank{display:inline-block;border:2px solid var(--pri);border-radius:8px;padding:1px 10px;color:var(--pri);font-weight:700;background:#eef0fa;margin:0 2px}
.target{border-bottom:3px solid var(--pri);font-weight:700;padding:0 2px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices .btn{font-size:19px;padding:16px 6px;font-weight:700}
.choices .btn.hit{background:#e8f5e9;border-color:var(--ok);color:var(--ok)}
.choices .btn.miss{background:#ffebee;border-color:var(--ng);color:var(--ng)}
.choices .btn.dim{opacity:.55}
.fb{border-radius:12px;padding:12px;margin-top:12px}
.fb.ok{background:#e8f5e9}
.fb.ng{background:#ffebee}
.fb .big{font-size:18px;font-weight:700}
.fb .ansline{font-size:17px;margin:6px 0}
.navrow{display:flex;gap:8px;margin-top:12px}
.navrow .btn{flex:1}
ruby rt{font-size:.5em;color:var(--mut)}
.fav{background:none;border:none;font-size:22px;cursor:pointer;padding:2px 6px;filter:grayscale(1);opacity:.45}
.fav.on{filter:none;opacity:1}
/* lists */
.kprow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.kprow .no{color:var(--mut);font-size:12px;width:44px;flex:none}
.kprow .w{font-size:17px;font-weight:700;flex:1}
.kprow .st{font-size:11px;border-radius:8px;padding:2px 7px;flex:none}
.st.s-m{background:#e8eaf6;color:var(--pri)}
.st.s-c{background:#fff3e0;color:var(--warn)}
.st.s-p{background:#e0f2f1;color:#00695c}
.st.s-w{background:#ffebee;color:var(--ng)}
.st.s-u{background:#eceff1;color:var(--mut)}
.kpex{background:#f7f8fd;border-radius:10px;padding:10px 12px;margin:4px 0 8px;font-size:14px}
.defbox{background:#eef2ff;border-left:4px solid var(--pri);border-radius:8px;padding:8px 11px;margin:8px 0;font-size:14px;line-height:1.7}
.defbox .dw{font-size:16px;font-weight:700}
.defbox .dy{color:var(--pri);font-size:13px;margin-left:4px}
.expl{margin-top:10px}
.expl .eh{font-size:12.5px;color:var(--mut);margin-bottom:5px}
.exrow{display:flex;gap:8px;padding:7px 8px;border-radius:9px;margin-bottom:6px;background:#fff;border:1px solid var(--line);align-items:flex-start}
.exrow .tag{flex:none;font-size:11px;font-weight:700;border-radius:7px;padding:2px 7px;margin-top:2px;min-width:52px;text-align:center}
.exrow.ex-ok{background:#e8f5e9;border-color:#a5d6a7}
.exrow.ex-ok .tag{background:var(--ok);color:#fff}
.exrow.ex-you{background:#ffebee;border-color:#ef9a9a}
.exrow.ex-you .tag{background:var(--ng);color:#fff}
.exrow .tag.other{background:#eceff1;color:var(--mut)}
.exrow .ebody{flex:1}
.exrow .ew{font-weight:700}
.exrow .ey{color:var(--pri);font-size:12.5px;margin-left:4px}
.exrow .ed{font-size:12.5px;color:#455a64;display:block;margin-top:1px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
/* flashcard */
.fcard{background:#fff;border:2px solid var(--pri2);border-radius:16px;min-height:220px;display:flex;align-items:center;justify-content:center;padding:20px;font-size:20px;line-height:2;text-align:center;cursor:pointer;overflow-wrap:anywhere}
.fcard .bigans{font-size:30px;font-weight:700;color:var(--pri)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs .chip{flex:1;text-align:center}
/* modal */
#mask{position:fixed;inset:0;background:rgba(20,25,60,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#mask.show{display:flex}
#mbox{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:18px;max-height:80vh;overflow:auto}
#mbox h3{margin:0 0 8px;font-size:16px}
#mbox .mb-body{font-size:14px;color:var(--tx)}
#mbox .mrow{display:flex;gap:8px;margin-top:14px}
#mbox .mrow .btn{flex:1}
.rank{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;cursor:pointer;font-size:15px}
.rank .n{color:var(--ng);font-weight:700;width:70px;flex:none;font-size:12.5px}
@media (min-width:520px){.qsent{font-size:22px}}
</style>
</head>
<body>
<header><div><span class="ttl">漢字</span><span class="ver" id="verTag"></span></div><button id="accBtn">👤 —</button></header>
<div id="warnBar" style="display:none;background:#fff3e0;color:#e65100;font-size:12px;padding:6px 12px;text-align:center"></div>
<main id="app"></main>
<div id="mask"><div id="mbox"></div></div>
<script>

{"c":"shoU","u":1,"n":1,"s":"今回の事件は氷山の{}だ。","k":"一角","y":"いっかく","d":"大きな物事のうち、外に見えているほんの一部分。"},

{"c":"shoU","u":1,"n":5,"s":"運良く{}に一生を得た。","k":"九死","y":"きゅうし","d":"死ぬかもしれないほど、あぶない状態のこと。"},
{"c":"shoU","u":1,"n":6,"s":"{}、様々な生徒がいる。","k":"十人十色","y":"じゅうにんといろ","d":"人はそれぞれ、好みや考えがちがうということ。"},
{"c":"shoU","u":1,"n":7,"s":"{}を偲んで多くの人が集まった。","k":"故人","y":"こじん","d":"亡くなって、この世にいなくなった人のこと。","rb":[["偲","しの"]]},
{"c":"shoU","u":1,"n":8,"s":"戦に勝利し、{}を拡大する。","k":"勢力","y":"せいりょく","d":"まわりをおさえつける、強い力や勢いのこと。","rb":[["戦","いくさ"],["拡大","かくだい"]]},

{"c":"shoU","u":2,"n":17,"s":"{}全書を繙く。","k":"六法","y":"ろっぽう","d":"暮らしに関わる、大事な六つの法律のこと。","rb":[["繙","ひもと"]]},

<script>
"use strict";
/* ================= 基本定数（共通仕様 v3.0） ================= */
const APP  = 'kj-quiz-kokugo-kanji';
const TOOL = '漢字';
const VER  = 'v3.0';
var K_DB=APP, K_UI=APP+':ui', K_SYNC='kj-quiz:sync', K_AUTH='kj-quiz:auth';
var DB=null, UI=null, SYNC=null, AUTH=null;
var view='gate', S=null, learnTab='list', deckFilter='all', browse=null;

/* ============ カテゴリー・KPデータ ============ */
const CATS={
  shoU:{name:'小学1026', long:'6年上 小学漢字1026題', vol:'u', imp:1, unitLabel:function(u){return 'セット'+circ(u);}},
  hinU:{name:'入試頻出', long:'6年上 中学入試頻出漢字', vol:'u', imp:2, unitLabel:function(u){return '第'+u+'回';}},
  sho:{name:'小学1026', long:'6年下 小学漢字1026題', vol:'g', imp:1, unitLabel:function(u){return 'セット'+circ(u);}},
  hin:{name:'入試頻出', long:'6年下 中学入試頻出漢字', vol:'g', imp:2, unitLabel:function(u){return '第'+u+'回';}},
  chu:{name:'配当以上（読み）', long:'6年下 中学配当以上の漢字', vol:'g', imp:0, unitLabel:function(u){return circ(u);}}
};
const CAT_ORDER=['shoU','hinU','sho','hin','chu'];
const VOLS=[['all','両方'],['u','6年上'],['g','6年下']];
function volName(v){ return v==='u'?'6年上':'6年下'; }
function circ(n){ if(n>=1&&n<=20)return String.fromCharCode(0x2460+n-1); if(n>=21&&n<=35)return String.fromCharCode(0x3251+n-21); if(n>=36&&n<=50)return String.fromCharCode(0x32B1+n-36); return String(n); }
function pad2(n){ return (n<10?'0':'')+n; }
/* KDATA（転記データ）→ KPS */
var KPS=[];
(function(){
  if(typeof KDATA==='undefined') return;
  KDATA.forEach(function(r){
    var cat=r.c||'chu', o=r.o||'';
    KPS.push({ id:cat+'-'+pad2(r.u)+'-'+pad2(r.n), cat:cat, unit:r.u, n:r.n,
      sent:r.s, k:r.k, o:o, y:r.y, def:r.d||'', alt:r.alt||null, ka:r.ka||null, rb:r.rb||null, ta:r.ta||null, tb:r.tb||null,
      imp:CATS[cat].imp, ans:r.k+o, yomiFull:r.y+o, disp:kata(r.y)+o });
  });
})();
var KPIX={}; KPS.forEach(function(k){KPIX[k.id]=k;});
/* 語→意味の逆引き（選択肢の解説用）。同一表記は最初の1件を代表に */
var ANSIX={}, YOMIX={};
KPS.forEach(function(k){ if(!ANSIX[k.ans])ANSIX[k.ans]=k; if(!YOMIX[k.yomiFull])YOMIX[k.yomiFull]=k; });
function lookupByAns(w){ return ANSIX[w]||null; }
function lookupByYomi(y){ return YOMIX[y]||null; }
function catsPresent(){ var s={}; KPS.forEach(function(k){s[k.cat]=1;}); return CAT_ORDER.filter(function(c){return s[c];}); }
function unitsOf(cat){ var s={}; KPS.forEach(function(k){ if(k.cat===cat) s[k.unit]=1; }); return Object.keys(s).map(Number).sort(function(a,b){return a-b;}); }
function kata(h){ return h.replace(/[ぁ-ん]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+0x60);}); }

/* ============ ユーティリティ ============ */
function $(q){ return document.querySelector(q); }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function nowISO(){ return new Date().toISOString(); }
function ymd(){ var d=new Date(); return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function jdate(iso){ if(!iso)return ''; var d=new Date(iso); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t; } return a; }
function jparse(s){ try{ return s?JSON.parse(s):null; }catch(e){ return null; } }
/* localStorage（例外時はメモリ動作＋警告） */
var MEM={}, LS_OK=true;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ LS_OK=false; }
function lsGet(k){ if(!LS_OK) return MEM[k]||null; try{ return localStorage.getItem(k); }catch(e){ return MEM[k]||null; } }
function lsSet(k,v){ MEM[k]=v; if(LS_OK){ try{ localStorage.setItem(k,v); }catch(e){ LS_OK=false; } } if(!LS_OK) showWarn('この端末では保存領域が使えないため、記録はこの画面を閉じるまでしか残りません'); }
function lsDel(k){ delete MEM[k]; if(LS_OK){ try{ localStorage.removeItem(k); }catch(e){} } }
function showWarn(msg){ var w=$('#warnBar'); w.textContent='⚠ '+msg; w.style.display='block'; }

/* ============ 進捗DB（共通仕様 §10） ============ */
function blankDB(){ return {app:APP,version:2,updatedAt:nowISO(),activeAccountId:null,accounts:[],progress:{}}; }
function blankItem(){ return {streak:0,mastered:false,masteredAt:null,postMasterWrong:0,lastFormat:null,totalCorrect:0,totalWrong:0,byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}},wrongLog:[],lastSeenAt:null}; }
function normItem(x){
  var o=blankItem(); if(!x||typeof x!=='object') return o;
  o.streak=+x.streak||0; o.mastered=!!x.mastered; o.masteredAt=x.masteredAt||null;
  o.postMasterWrong=+x.postMasterWrong||0; o.lastFormat=x.lastFormat||null;
  o.totalCorrect=+x.totalCorrect||0; o.totalWrong=+x.totalWrong||0;
  ['A','B'].forEach(function(f){ var b=(x.byFormat&&x.byFormat[f])||{}; o.byFormat[f].correct=+b.correct||0; o.byFormat[f].wrong=+b.wrong||0; });
  o.wrongLog=Array.isArray(x.wrongLog)?x.wrongLog.slice(-5):[];
  o.lastSeenAt=x.lastSeenAt||null;
  if(x.favAt){ o.favAt=x.favAt; if(x.fav) o.fav=true; }
  return o;
}
function normProgress(p){
  var o={items:{},sessions:[]}; if(!p||typeof p!=='object') return o;
  if(p.items&&typeof p.items==='object') Object.keys(p.items).forEach(function(k){ o.items[k]=normItem(p.items[k]); });
  if(Array.isArray(p.sessions)) o.sessions=p.sessions.slice(-100);
  return o;
}
function acc(){ return DB.accounts[0]||null; }
function buildDB(raw){
  var db=blankDB();
  if(!AUTH) return db;
  db.activeAccountId=AUTH.id;
  var a={id:AUTH.id,name:AUTH.id,label:AUTH.label||AUTH.id};
  var src=raw&&raw.accounts?raw.accounts.filter(function(x){return String(x.id)===AUTH.id;})[0]:null;
  if(src&&src.createdAt) a.createdAt=src.createdAt;
  db.accounts=[a];
  db.progress[AUTH.id]=normProgress(raw&&raw.progress?raw.progress[AUTH.id]:null);
  db.updatedAt=(raw&&raw.updatedAt)||nowISO();
  return db;
}
function loadAll(){
  SYNC=jparse(lsGet(K_SYNC));
  if(!SYNC||!SYNC.url){
    var old=jparse(lsGet(APP+':sync'));
    if(old&&old.url){ SYNC={url:old.url,key:old.key||'',lastSync:old.lastSync||null}; lsSet(K_SYNC,JSON.stringify(SYNC)); }
  }
  if(!SYNC||typeof SYNC!=='object') SYNC={url:'',key:'',lastSync:null};
  AUTH=jparse(lsGet(K_AUTH));
  if(!AUTH||!AUTH.id||!AUTH.pw) AUTH=null;
  DB=buildDB(jparse(lsGet(K_DB)));
  UI=jparse(lsGet(K_UI));
  if(!UI||typeof UI!=='object') UI={};
  if(!UI.vol||['all','u','g'].indexOf(UI.vol)<0) UI.vol='all';
  if(!UI.cat) UI.cat=catsPresent().length===1?catsPresent()[0]:'all';
  if(!CATS[UI.cat]&&UI.cat!=='all') UI.cat=catsPresent()[0]||'all';
  if(!UI.impFilter) UI.impFilter='all';
  if(!UI.unit) UI.unit={};
  if(UI.favOnly==null) UI.favOnly=false;
  if(UI.ruby==null) UI.ruby=true;
}
function saveDB(opt){
  opt=opt||{};
  if(!AUTH) return;
  if(!opt.fromCloud) DB.updatedAt=nowISO();
  DB.app=APP; DB.version=2;
  lsSet(K_DB,JSON.stringify(DB));
}
function saveUI(){ lsSet(K_UI,JSON.stringify(UI)); }
function saveSync(){ lsSet(K_SYNC,JSON.stringify(SYNC)); }
function prog(){
  if(!AUTH) return null;
  if(!DB.progress[AUTH.id]) DB.progress[AUTH.id]={items:{},sessions:[]};
  var p=DB.progress[AUTH.id]; if(!p.items)p.items={}; if(!p.sessions)p.sessions=[]; return p;
}
function itemRO(id){ var p=prog(); if(!p||!p.items[id]) return blankItem(); return p.items[id]; }
function ready(){ return !!(SYNC&&SYNC.url&&SYNC.key); }
function loggedIn(){ return !!AUTH; }
function portalURL(){ return './index.html'; }

/* ============ 同期（共通仕様 §12〜§13） ============ */
var syncState={cls:'',msg:'☁ 未同期'};
function setSync(cls,msg){ syncState={cls:cls,msg:msg}; var b=$('#syncBar'); if(b){ b.className='syncbar '+cls; b.innerHTML=syncHTML(); } }
function syncHTML(){ var t=esc(syncState.msg); if(SYNC&&SYNC.lastSync) t+='　<span class="tiny">最終同期 '+esc(jdate(SYNC.lastSync))+'</span>'; return t; }
async function api(body){
  var r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({key:SYNC.key},body))});
  var txt=await r.text();
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error('GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください'); }
}
function apiError(j){
  var e=String(j.error||'');
  if(e==='auth') return 'ログインが無効になりました。ポータルでログインし直してください';
  if(/合言葉|key/i.test(e)) return '合言葉が違います';
  return e||'エラー';
}
function onAuthLost(){ lsDel(K_AUTH); AUTH=null; view='gate'; render(); }
async function pullCloud(silent){
  if(!ready()||!AUTH) return;
  if(!silent) setSync('','☁… クラウドと同期しています');
  var j;
  try{ j=await api({action:'fetch',app:APP,id:AUTH.id,pw:AUTH.pw}); }
  catch(e){
    if(/GASの応答/.test(e.message)) setSync('ng','☁⚠ '+e.message);
    else setSync('','☁ オフライン（ローカルには保存済み）');
    return;
  }
  if(!j.ok){
    if(j.error==='auth'){ setSync('ng','☁⚠ '+apiError(j)); onAuthLost(); return; }
    setSync('ng','☁⚠ '+apiError(j)); return;
  }
  var cloudP=normProgress(((j.data||{}).progress||{})[AUTH.id]);
  var localP=prog();
  var before=JSON.stringify(localP);
  var merged=mergeProgress(localP,cloudP);
  DB.progress[AUTH.id]=merged;
  if(j.label){ AUTH.label=j.label; lsSet(K_AUTH,JSON.stringify(AUTH)); DB.accounts[0].label=j.label; }
  var cd=(j.data||{}).accounts&&j.data.accounts[0];
  if(cd&&cd.createdAt) DB.accounts[0].createdAt=cd.createdAt;
  saveDB({fromCloud:true});
  SYNC.lastSync=nowISO(); saveSync();
  var n=Object.keys(merged.items).length;
  setSync('ok','☁✓ クラウドと合流しました（'+n+'語・習得'+Object.keys(merged.items).filter(function(k){return merged.items[k].mastered;}).length+'）');
  if(view==='home') render();
  if(before!==JSON.stringify(merged)) await pushCloud(true,syncState.msg);
}
async function pushCloud(silent,okMsg){
  if(!ready()||!AUTH) return false;
  if(!silent) setSync('','☁… 送信しています');
  var j;
  try{ j=await api({action:'save',app:APP,id:AUTH.id,pw:AUTH.pw,account:DB.accounts[0],progress:prog()}); }
  catch(e){
    if(/GASの応答/.test(e.message)) setSync('ng','☁⚠ '+e.message);
    else setSync('','☁ オフライン（ローカルには保存済み。次につながったときに送ります）');
    return false;
  }
  if(!j.ok){
    if(j.error==='auth'){ setSync('ng','☁⚠ '+apiError(j)); onAuthLost(); return false; }
    setSync('ng','☁⚠ '+apiError(j)); return false;
  }
  SYNC.lastSync=nowISO(); saveSync();
  setSync('ok',okMsg||'☁✓ クラウドに保存しました');
  return true;
}
/* 合流（1アカウント用・§13-2、fav拡張は個別仕様§8） */
function mergeProgress(L,C){
  L=normProgress(L); C=normProgress(C);
  var M={items:{},sessions:[]},ids={};
  Object.keys(L.items).forEach(function(k){ids[k]=1;});
  Object.keys(C.items).forEach(function(k){ids[k]=1;});
  Object.keys(ids).forEach(function(k){ M.items[k]=mergeItem(L.items[k],C.items[k]); });
  var seen={},ss=[];
  L.sessions.concat(C.sessions).forEach(function(s){ if(!seen[s.finishedAt]){ seen[s.finishedAt]=1; ss.push(s); } });
  ss.sort(function(x,y){ return new Date(y.finishedAt)-new Date(x.finishedAt); });
  M.sessions=ss.slice(0,100).reverse();
  return M;
}
function mergeItem(a,b){
  if(!a) return normItem(b); if(!b) return normItem(a);
  a=normItem(a); b=normItem(b);
  var o=blankItem();
  o.totalCorrect=Math.max(a.totalCorrect,b.totalCorrect);
  o.totalWrong  =Math.max(a.totalWrong,b.totalWrong);
  o.postMasterWrong=Math.max(a.postMasterWrong,b.postMasterWrong);
  ['A','B'].forEach(function(f){
    o.byFormat[f].correct=Math.max(a.byFormat[f].correct,b.byFormat[f].correct);
    o.byFormat[f].wrong  =Math.max(a.byFormat[f].wrong,  b.byFormat[f].wrong);
  });
  o.mastered=a.mastered||b.mastered;
  if(a.masteredAt&&b.masteredAt) o.masteredAt=(new Date(a.masteredAt)<=new Date(b.masteredAt))?a.masteredAt:b.masteredAt;
  else o.masteredAt=a.masteredAt||b.masteredAt||null;
  if(o.mastered&&!o.masteredAt) o.masteredAt=nowISO();
  var seen={},log=[];
  a.wrongLog.concat(b.wrongLog).forEach(function(w){ var k=w.at+'|'+w.format; if(!seen[k]){ seen[k]=1; log.push(w); } });
  log.sort(function(x,y){ return new Date(y.at)-new Date(x.at); });
  o.wrongLog=log.slice(0,5).reverse();
  var at=a.lastSeenAt?new Date(a.lastSeenAt).getTime():0, bt=b.lastSeenAt?new Date(b.lastSeenAt).getTime():0;
  var newer=(at>=bt)?a:b;
  o.lastSeenAt=newer.lastSeenAt||a.lastSeenAt||b.lastSeenAt||null;
  o.streak=newer.streak;
  o.lastFormat=newer.lastFormat;
  /* fav: favAt が新しい側（個別仕様 §8-1） */
  var fa=a.favAt?new Date(a.favAt).getTime():0, fb=b.favAt?new Date(b.favAt).getTime():0;
  if(fa||fb){ var fn=(fa>=fb)?a:b; o.favAt=fn.favAt; if(fn.fav) o.fav=true; }
  return o;
}

/* ============ 範囲選択（個別仕様 §2-1） ============ */
function unitRange(cat){ var u=UI.unit[cat]; if(!u||!u.from) return null; return u; }
function catsInVol(){ return catsPresent().filter(function(c){ return UI.vol==='all'||CATS[c].vol===UI.vol; }); }
function inRange(kp){
  if(UI.vol!=='all'&&CATS[kp.cat].vol!==UI.vol) return false;
  if(UI.cat!=='all'&&kp.cat!==UI.cat) return false;
  if(UI.impFilter==='i12'&&kp.imp<1) return false;
  if(UI.impFilter==='i2'&&kp.imp<2) return false;
  if(UI.cat!=='all'){ var r=unitRange(UI.cat); if(r&&(kp.unit<r.from||kp.unit>r.to)) return false; }
  if(UI.favOnly&&!itemRO(kp.id).fav) return false;
  return true;
}
function rangeKPs(){ return KPS.filter(inRange); }
function countCat(cat){ /* 選択中の巻・重要度・単元・⭐での件数 */
  return KPS.filter(function(kp){
    if(UI.vol!=='all'&&CATS[kp.cat].vol!==UI.vol) return false;
    if(cat!=='all'&&kp.cat!==cat) return false;
    if(UI.impFilter==='i12'&&kp.imp<1) return false;
    if(UI.impFilter==='i2'&&kp.imp<2) return false;
    if(cat!=='all'){ var r=unitRange(cat); if(r&&(kp.unit<r.from||kp.unit>r.to)) return false; }
    if(UI.favOnly&&!itemRO(kp.id).fav) return false;
    return true;
  }).length;
}

/* ============ 表示ヘルパー ============ */
function rubyText(text,rb){
  var s=esc(text);
  if(!UI.ruby||!rb||!rb.length) return s;
  var pairs=rb.slice().sort(function(a,b){return b[0].length-a[0].length;});
  var ph=[];
  pairs.forEach(function(p,i){
    var token=''+i+'';
    var html='<ruby>'+esc(p[0])+'<rt>'+esc(p[1])+'</rt></ruby>';
    s=s.split(esc(p[0])).join(token); ph.push([token,html]);
  });
  ph.forEach(function(p){ s=s.split(p[0]).join(p[1]); });
  return s;
}
function sentHTML(kp,fmt,answered){
  var parts=kp.sent.split('{}');
  var pre=rubyText(parts[0],kp.rb), post=rubyText(parts[1]||'',kp.rb);
  var mid;
  if(answered) mid='<span class="target">'+esc(kp.ans)+'</span>';
  else if(fmt==='A') mid='<span class="blank">'+esc(kp.disp)+'</span>';
  else mid='<span class="target">'+esc(kp.ans)+'</span>';
  return pre+mid+post;
}
function reqStreak(it){ var w=it.totalWrong||0; if(w>=6)return 4; if(w>=3)return 3; return 2; }
function stateOf(it){
  if(it.mastered) return it.postMasterWrong>0?{t:'要注意習得',c:'s-c'}:{t:'習得済み',c:'s-m'};
  if(it.totalCorrect>0) return {t:it.totalCorrect+'回正解',c:'s-p'};
  if(it.totalWrong>0) return {t:'誤答',c:'s-w'};
  return {t:'未出題',c:'s-u'};
}

/* ============ 4択生成（個別仕様 §6） ============ */
var DAKU={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
var DAKR={}; Object.keys(DAKU).forEach(function(k){DAKR[DAKU[k]]=k;});
var HAND={'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ'};
function mutations(r){
  var out=[],i,c;
  for(i=0;i<r.length;i++){
    c=r[i];
    if(DAKU[c]) out.push(r.slice(0,i)+DAKU[c]+r.slice(i+1));
    if(DAKR[c]) out.push(r.slice(0,i)+DAKR[c]+r.slice(i+1));
    if(HAND[c]) out.push(r.slice(0,i)+HAND[c]+r.slice(i+1));
  }
  for(i=0;i<r.length;i++){
    c=r[i];
    if(c==='う') out.push(r.slice(0,i)+r.slice(i+1));            /* 長音を削る */
    if(c==='っ') out.push(r.slice(0,i)+r.slice(i+1));            /* 促音を削る */
    if('おこそとのほもよろごぞどぼぽょ'.indexOf(c)>=0&&r[i+1]!=='う') out.push(r.slice(0,i+1)+'う'+r.slice(i+1)); /* 長音を足す */
    if('くきつち'.indexOf(c)>=0&&i<r.length-1&&r[i+1]!=='っ') out.push(r.slice(0,i)+'っ'+r.slice(i+1));
    if(c==='ゅ') out.push(r.slice(0,i)+'ゆ'+r.slice(i+1));
    if(c==='ょ') out.push(r.slice(0,i)+'よ'+r.slice(i+1));
    if(c==='ゃ') out.push(r.slice(0,i)+'や'+r.slice(i+1));
  }
  return out.filter(function(x){return x&&x!==r&&x.length>=1;});
}
function altFulls(kp){ var a=[kp.yomiFull]; (kp.alt||[]).forEach(function(x){a.push(x+kp.o);}); return a; }
function genChoices(kp,fmt){
  var correct,pool=[],add=function(t){ if(t&&t!==correct&&pool.indexOf(t)<0) pool.push(t); };
  if(fmt==='A'){
    correct=kp.ans;
    var ngA=(kp.ka||[]).map(function(x){return x+kp.o;});      /* 別表記(交替など)は誤答に使わない */
    var add0=add;
    add=function(t){ if(ngA.indexOf(t)<0) add0(t); };
    (kp.ta||[]).forEach(function(t){ add(t.indexOf(kp.o)>=0||!kp.o?t:t+kp.o); });
    KPS.forEach(function(x){ if(x.id!==kp.id&&x.k!==kp.k&&x.yomiFull===kp.yomiFull) add(x.ans); });      /* 同音異義語 */
    var chars=kp.k.split('');
    KPS.forEach(function(x){ if(x.id!==kp.id&&x.k!==kp.k&&x.o===kp.o&&x.k.length===kp.k.length&&chars.some(function(c){return x.k.indexOf(c)>=0;})) add(x.ans); });
    KPS.forEach(function(x){ if(x.id!==kp.id&&x.k!==kp.k&&x.o===kp.o&&x.k.length===kp.k.length) add(x.ans); });
    KPS.forEach(function(x){ if(x.id!==kp.id&&x.k!==kp.k&&(x.o===kp.o?x.ans!==correct:true)&&x.k.length===kp.k.length) add(x.k+kp.o); });
    shuffle(KPS).forEach(function(x){ if(x.id!==kp.id&&x.k!==kp.k) add(x.k.length===kp.k.length?x.k+kp.o:x.ans); });
  }else{
    correct=kp.yomiFull;
    var ng=altFulls(kp);
    add=function(t){ if(t&&ng.indexOf(t)<0&&pool.indexOf(t)<0) pool.push(t); };
    (kp.tb||[]).forEach(add);
    shuffle(mutations(correct)).forEach(add);
    shuffle(KPS).forEach(function(x){ if(x.id!==kp.id&&Math.abs(x.yomiFull.length-correct.length)<=1) add(x.yomiFull); });
    shuffle(KPS).forEach(function(x){ if(x.id!==kp.id) add(x.yomiFull); });
  }
  var opts=[correct].concat(pool.slice(0,3));
  var guard=0;
  while(opts.length<4&&guard<50){ opts.push(correct+'？'+(guard++)); } /* 保険（実データでは到達しない） */
  var seen={},uniq=[]; opts.forEach(function(t){ if(!seen[t]){seen[t]=1;uniq.push(t);} });
  while(uniq.length<4){ uniq.push('　'); }
  return shuffle(uniq.slice(0,4).map(function(t){ return {t:t,ok:t===correct}; }));
}

/* ============ セッション（§3〜§6） ============ */
function pickCandidates(){
  return rangeKPs().filter(function(kp){ return !itemRO(kp.id).mastered; });
}
function priSort(list){
  return list.slice().sort(function(a,b){
    var ia=itemRO(a.id),ib=itemRO(b.id);
    if(ib.totalWrong!==ia.totalWrong) return ib.totalWrong-ia.totalWrong;
    var ua=ia.lastSeenAt?1:0, ub=ib.lastSeenAt?1:0;
    if(ua!==ub) return ua-ub;                       /* 未出題を先に */
    if(ia.lastSeenAt&&ib.lastSeenAt) return new Date(ia.lastSeenAt)-new Date(ib.lastSeenAt);
    return Math.random()-0.5;
  });
}
function startSession(mode,seedId){
  if(!loggedIn()){ view='gate'; render(); return; }
  var label,kps,queue=[],note='';
  if(mode==='10'||mode==='20'){
    var N=mode==='10'?10:20;
    label=N+'問';
    var cand=priSort(pickCandidates());
    if(seedId){ cand=[KPIX[seedId]].concat(cand.filter(function(k){return k.id!==seedId;})); }
    if(!cand.length){ toastModal('出題できる語がありません','この範囲は全て習得済みです。全問モードや再確認モードをどうぞ。'); return; }
    if(cand.length<N){ note='この範囲の未習得は'+cand.length+'語のため、'+cand.length+'語で出題します。'; }
    kps=cand.slice(0,N);
    var a=shuffle(kps),b=shuffle(kps);
    a.forEach(function(k){queue.push({kpId:k.id,fmt:'A'});});
    b.forEach(function(k){queue.push({kpId:k.id,fmt:'B'});});
  }else if(mode==='all'){
    label='全問';
    kps=shuffle(rangeKPs());
    if(!kps.length){ toastModal('出題できる語がありません','範囲の設定を確認してください。'); return; }
    kps.forEach(function(k){
      var lf=itemRO(k.id).lastFormat;
      var f=lf?(lf==='A'?'B':'A'):(Math.random()<0.5?'A':'B');
      queue.push({kpId:k.id,fmt:f});
    });
  }else if(mode==='recheck'){
    label='再確認';
    kps=rangeKPs().filter(function(k){var it=itemRO(k.id);return it.mastered&&it.postMasterWrong>0;});
    if(!kps.length){ toastModal('要注意の語はありません','習得後に間違えた語が出てくると、ここで再確認できます。'); return; }
    var a2=shuffle(kps),b2=shuffle(kps);
    a2.forEach(function(k){queue.push({kpId:k.id,fmt:'A'});});
    b2.forEach(function(k){queue.push({kpId:k.id,fmt:'B'});});
  }else return;
  S={mode:mode,label:label,queue:queue,pos:0,log:[],reCount:{},work:{},startedAt:nowISO(),
     startMastered:{},over:{},note:note};
  KPS.forEach(function(k){ if(itemRO(k.id).mastered) S.startMastered[k.id]=1; });
  browse=null; view='quiz'; render();
  if(note) setTimeout(function(){ toastModal('お知らせ',note); },50);
}
function witem(id){ if(!S.work[id]) S.work[id]=normItem(JSON.parse(JSON.stringify(itemRO(id)))); return S.work[id]; }
function curQ(){ return S.queue[S.pos]; }
function ensureChoices(q){ if(!q.choices) q.choices=genChoices(KPIX[q.kpId],q.fmt); return q.choices; }
function reinsert(basePos,kpId,fmt,delta){
  if((S.reCount[kpId]||0)>=4){ S.over[kpId]=1; return; }
  S.reCount[kpId]=(S.reCount[kpId]||0)+1;
  var idx=basePos+delta;
  if(idx<=S.pos) idx=S.pos+1;
  if(idx>S.queue.length) idx=S.queue.length;
  S.queue.splice(idx,0,{kpId:kpId,fmt:fmt==='A'?'B':'A'});
}
function answer(ci){
  var q=curQ(); if(!q||q.answered) return;
  var kp=KPIX[q.kpId], ch=q.choices[ci], okAns=ch.ok;
  var it=witem(kp.id);
  var entry={pos:S.pos,kpId:kp.id,fmt:q.fmt,sel:ci,ok:okAns,
    preItem:JSON.stringify(it),preTail:S.queue.slice(S.pos+1),preRe:JSON.parse(JSON.stringify(S.reCount)),preOver:JSON.parse(JSON.stringify(S.over))};
  if(S.mode==='recheck'){
    if(!okAns) it.postMasterWrong++;
  }else{
    var prevFmt=it.lastFormat;
    it.lastSeenAt=nowISO(); it.lastFormat=q.fmt;
    if(okAns){
      it.totalCorrect++; it.byFormat[q.fmt].correct++;
      if(!it.mastered){
        if(!(it.streak>0&&prevFmt===q.fmt)) it.streak++;
        if(it.streak>=reqStreak(it)){ it.mastered=true; it.masteredAt=nowISO(); }
      }
    }else{
      it.totalWrong++; it.byFormat[q.fmt].wrong++; it.streak=0;
      it.wrongLog=it.wrongLog.concat([{at:nowISO(),format:q.fmt,answered:ch.t}]).slice(-5);
      if(it.mastered) it.postMasterWrong++;
    }
  }
  if(S.mode!=='all'){
    if(!okAns) reinsert(S.pos,kp.id,q.fmt,3);
    else if(!it.mastered&&S.mode!=='recheck'){
      /* 同じKPの出題がまだキューに残っていれば追加投入しない（§19-11） */
      var pending=S.queue.slice(S.pos+1).some(function(x){return x.kpId===kp.id;});
      if(!pending) reinsert(S.pos,kp.id,q.fmt,6);
    }
  }
  q.answered=true; q.sel=ci; q.ok=okAns;
  S.log.push(entry);
  renderQuiz();
}
function nextQ(){
  if(curQ()&&curQ().answered){
    if(S.pos+1>=S.queue.length){ finishSession(); return; }
    S.pos++; browse=null; renderQuiz(); window.scrollTo(0,0);
  }
}
function goBack(){
  var target=(browse==null)?S.pos-1:browse-1;
  if(target<0) return;
  browse=target; renderQuiz(); window.scrollTo(0,0);
}
function goFwd(){
  if(browse==null) return;
  browse=browse+1;
  if(browse>=S.pos) browse=null;
  renderQuiz(); window.scrollTo(0,0);
}
function reanswer(){
  /* 直前の1問のみ（§6-1）。スナップショットへ巻き戻す */
  var idx=S.pos-1;
  var entry=S.log[S.log.length-1];
  if(!entry||entry.pos!==idx||browse!==idx) return;
  S.work[entry.kpId]=normItem(JSON.parse(entry.preItem));
  S.queue=S.queue.slice(0,idx+1).concat(entry.preTail);
  S.reCount=entry.preRe; S.over=entry.preOver;
  var q=S.queue[idx]; q.answered=false; delete q.sel; delete q.ok;
  S.log.pop();
  S.pos=idx; browse=null; renderQuiz(); window.scrollTo(0,0);
}
function leaveQuiz(){
  toastModal('学習をやめますか？','途中でやめると、ここまでの解答は記録されません。',[
    {label:'つづける'},
    {label:'やめる',pri:true,fn:function(){ S=null; browse=null; view='home'; render(); }}
  ]);
}
function finishSession(){
  /* 成績確定（§6-2）：結果画面到達時に一括で永続化 → 自動push（§11） */
  var p=prog();
  Object.keys(S.work).forEach(function(id){ p.items[id]=S.work[id]; });
  var correct=S.log.filter(function(e){return e.ok;}).length;
  var wrong=S.log.length-correct;
  var newly=Object.keys(S.work).filter(function(id){ return S.work[id].mastered&&!S.startMastered[id]; });
  var wrongIds=[]; S.log.forEach(function(e){ if(!e.ok&&wrongIds.indexOf(e.kpId)<0) wrongIds.push(e.kpId); });
  var totalMastered=KPS.filter(function(k){return (p.items[k.id]||{}).mastered;}).length;
  var sess={startedAt:S.startedAt,finishedAt:nowISO(),mode:S.label,correct:correct,wrong:wrong,
    newlyMastered:newly,wrongKpIds:wrongIds,totalMastered:totalMastered};
  p.sessions=p.sessions.concat([sess]).slice(-100);
  saveDB();
  S.result={sess:sess,newly:newly,wrongIds:wrongIds};
  view='result'; render(); window.scrollTo(0,0);
  pushCloud(true);
}

/* 選択肢ぜんぶの解説 */
function explainChoices(kp,q){
  var wrap=el('div','expl');
  wrap.appendChild(el('div','eh', q.fmt==='A'?'えらんだ漢字の意味':'それぞれの読み方'));
  q.choices.forEach(function(ch,ci){
    var isOk=ch.ok, isYou=(ci===q.sel);
    var row=el('div','exrow '+(isOk?'ex-ok':isYou?'ex-you':''));
    var tag=el('span','tag'+(isOk||isYou?'':' other'), isOk?'○ 正解':isYou?'✗ あなた':'ほか');
    row.appendChild(tag);
    var body=el('div','ebody');
    if(q.fmt==='A'){
      /* 選択肢は漢字。逆引きで読み・意味を出す */
      var ref=lookupByAns(ch.t)||(isOk?kp:null);
      var yomi=ref?ref.yomiFull:'';
      body.innerHTML='<span class="ew">'+esc(ch.t)+'</span>'+(yomi?'<span class="ey">'+esc(yomi)+'</span>':'')+
        (ref&&ref.def?'<span class="ed">'+esc(ref.def)+'</span>':'<span class="ed">（この本には意味の説明がありません）</span>');
    }else{
      /* 選択肢は読み。正解は語の意味、ほかは何の語の読みかを示す */
      if(isOk){
        body.innerHTML='<span class="ew">'+esc(ch.t)+'</span><span class="ey">＝'+esc(kp.ans)+'</span>'+
          (kp.def?'<span class="ed">'+esc(kp.def)+'</span>':'');
      }else{
        var ref2=lookupByYomi(ch.t);
        if(ref2&&ref2.id!==kp.id){
          body.innerHTML='<span class="ew">'+esc(ch.t)+'</span><span class="ey">＝「'+esc(ref2.ans)+'」の読み</span>'+
            (ref2.def?'<span class="ed">'+esc(ref2.def)+'</span>':'');
        }else{
          body.innerHTML='<span class="ew">'+esc(ch.t)+'</span><span class="ed">「'+esc(kp.ans)+'」はこう読みません。</span>';
        }
      }
    }
    row.appendChild(body);
    wrap.appendChild(row);
  });
  return wrap;
}

function renderQuiz(){
  var app=$('#app'); app.innerHTML='';

  if(idx>=S.queue.length){ finishSession(); return; }

  var answered=q.answered;

  var bar=el('div','bar'); var bi=el('i');
  bi.style.width=Math.min(100,(S.pos)/S.queue.length*100)+'%'; bar.appendChild(bi); head.appendChild(bar);
  var remStart=S.pos+((S.queue[S.pos]&&S.queue[S.pos].answered)?1:0);
  var remKp={}; S.queue.slice(remStart).forEach(function(x){ remKp[x.kpId]=1; });

  head.appendChild(meta);
  var it=(S.mode==='recheck')?normItem(jparse(JSON.stringify(itemRO(kp.id)))):witem(kp.id);
  var need=reqStreak(it), g='';
  for(var i=0;i<need;i++) g+= i<Math.min(it.streak,need)?'●':'○';
  var gr=el('div','qmeta');
  gr.appendChild(el('span','gauge',(S.mode==='recheck'?'要注意の再確認':'習得まで ')+' '+g));

  head.appendChild(gr);

  var c=el('div','card');

    }else if(browse!=null&&!answered){
      /* 見直し中の未解答は無い想定 */

      b.onclick=function(){ answer(ci); };
    }
    cs.appendChild(b);
  });
  c.appendChild(cs);
  if(answered){
    var fb=el('div','fb '+(q.ok?'ok':'ng'));
    fb.appendChild(el('div','big',q.ok?'○ 正解！':'× ざんねん'));
    var full=el('div',null); full.innerHTML=sentHTML(kp,q.fmt,true); full.style.fontSize='16px'; fb.appendChild(full);
    fb.appendChild(defBox(kp));
    if(kp.ka){ fb.appendChild(el('div','tiny','別の書き方：'+kp.ka.map(function(x){return esc(x+kp.o);}).join('・'))); }
    fb.appendChild(explainChoices(kp,q));
    var favLine=el('div'); favLine.style.marginTop='8px';
    favLine.appendChild(el('span','tiny','あとで見直したいときは → '));
    favLine.appendChild(favBtnWork(kp.id));
    fb.appendChild(favLine);
    c.appendChild(fb);
  }
  var nav=el('div','navrow');
  if(idx>0||browse!=null){
    var bb=el('button','btn','← 前の問題');
    bb.onclick=goBack; nav.appendChild(bb);
  }
  if(browse!=null){
    if(browse===S.pos-1&&S.log.length&&S.log[S.log.length-1].pos===browse){
      var ra=el('button','btn','答え直す'); ra.onclick=reanswer; nav.appendChild(ra);
    }
    var ff=el('button','btn pri','進む →'); ff.onclick=goFwd; nav.appendChild(ff);
  }else if(answered){
    var nb=el('button','btn pri',(S.pos+1>=S.queue.length)?'結果を見る':'次へ →');
    nb.onclick=nextQ; nav.appendChild(nb);
  }
  c.appendChild(nav);
  var quit=el('button','btn gh wide','やめる（記録されません）');
  quit.style.marginTop='10px'; quit.onclick=leaveQuiz;
  c.appendChild(quit);
  app.appendChild(c);
}

var listState={cat:'all',st:'all',sort:'wrong'};
function buildKpList(container){
  var wrap=el('div','kplist');
  function redraw(){ buildKpList(container); }
  var f1=el('div','filters');
  [['all','すべて']].concat(catsPresent().map(function(c){return [c,catLabel(c)];})).forEach(function(p){
    var b=el('button','chip'+(listState.cat===p[0]?' on':''),p[1]);
    b.onclick=function(){ listState.cat=p[0]; redraw(); };
    f1.appendChild(b);
  });
  [['all','全状態'],['m','習得済み'],['c','要注意'],['p','正解あり'],['w','誤答'],['u','未出題']].forEach(function(p){
    var b=el('button','chip'+(listState.st===p[0]?' on':''),p[1]);
    b.onclick=function(){ listState.st=p[0]; redraw(); };
    f1.appendChild(b);
  });
  [['wrong','誤答順'],['book','番号順']].forEach(function(p){
    var b=el('button','chip'+(listState.sort===p[0]?' on':''),p[1]);
    b.onclick=function(){ listState.sort=p[0]; redraw(); };
    f1.appendChild(b);
  });
  wrap.appendChild(f1);
  var listBox=el('div'); wrap.appendChild(listBox);
  function match(it){
    var s=stateOf(it);
    if(listState.st==='m') return it.mastered&&!it.postMasterWrong;
    if(listState.st==='c') return it.mastered&&it.postMasterWrong>0;
    if(listState.st==='p') return !it.mastered&&it.totalCorrect>0;
    if(listState.st==='w') return !it.mastered&&it.totalWrong>0&&!it.totalCorrect;
    if(listState.st==='u') return s.t==='未出題';
    return true;
  }
  var list=KPS.filter(function(k){ return (listState.cat==='all'||k.cat===listState.cat)&&match(itemRO(k.id)); });
  if(listState.sort==='wrong') list=list.slice().sort(function(a,b){ return itemRO(b.id).totalWrong-itemRO(a.id).totalWrong; });
  list.slice(0,400).forEach(function(kp){ listBox.appendChild(kpRow(kp)); });
  if(list.length>400) listBox.appendChild(el('div','tiny','（'+list.length+'語中 400語まで表示）'));
  if(!list.length) listBox.appendChild(el('div','muted','該当する語がありません'));
  var old=container.querySelector('.kplist');
  if(old) container.replaceChild(wrap,old); else container.appendChild(wrap);
}

    var it=itemRO(kp.id);
    if(deckFilter==='un') return !it.mastered;
    if(deckFilter==='wr') return it.totalWrong>0;
    if(deckFilter==='ca') return it.mastered&&it.postMasterWrong>0;
    if(deckFilter==='fav') return !!it.fav;
    return true;
  });
  deck=shuffle(list.map(function(k){return k.id;}));
  flipped=false;
}
function renderLearnCards(app){
  var c=el('div','card');
  var f=el('div','filters');
  [['all','すべて'],['un','未習得のみ'],['wr','誤答あり'],['ca','要注意のみ'],['fav','⭐のみ']].forEach(function(p){
    var b=el('button','chip'+(deckFilter===p[0]?' on':''),p[1]);
    b.onclick=function(){ deckFilter=p[0]; deck=null; render(); };
    f.appendChild(b);
  });
  var dirB=el('button','chip','方向：'+(deckDir==='A'?'書き（カタカナ→漢字）':'読み（漢字→よみ）'));
  dirB.onclick=function(){ deckDir=deckDir==='A'?'B':'A'; flipped=false; render(); };
  f.appendChild(dirB);
  c.appendChild(f);
  if(!deck) buildDeck();
  if(!deck.length){ c.appendChild(el('div','muted','この条件のカードはありません')); app.appendChild(c); return; }
  var kp=KPIX[deck[0]];
  c.appendChild(el('div','tiny','のこり '+deck.length+'枚（タップでめくる）'));
  var card=el('div','fcard');
  if(!flipped){ card.innerHTML='<div>'+sentHTML(kp,deckDir,false)+'</div>'; }
  else{
    card.innerHTML='<div><div class="bigans">'+esc(deckDir==='A'?kp.ans:kp.yomiFull)+'</div>'+
      '<div style="font-size:15px;margin-top:8px">'+sentHTML(kp,deckDir,true)+'</div>'+
      '<div class="tiny">'+esc(kp.ans)+'（'+esc(kp.yomiFull)+'）</div>'+
      (kp.def?'<div style="font-size:13px;margin-top:6px;color:#455a64">'+esc(kp.def)+'</div>':'')+'</div>';
  }
  card.onclick=function(){ flipped=!flipped; render(); };
  c.appendChild(card);
  var row=el('div','navrow');
  var ok=el('button','btn','✔ 覚えた（外す）');
  ok.onclick=function(){ deck.shift(); flipped=false; render(); };
  var ng=el('button','btn','↻ まだ（後ろへ）');
  ng.onclick=function(){ deck.push(deck.shift()); flipped=false; render(); };
  row.appendChild(ok); row.appendChild(ng);
  c.appendChild(row);
  var fr=el('div'); fr.style.textAlign='center'; fr.style.marginTop='8px';
  fr.appendChild(favBtn(kp.id));
  c.appendChild(fr);
  var re=el('button','btn gh wide','デッキを配り直す');
  re.style.marginTop='8px'; re.onclick=function(){ deck=null; render(); };
  c.appendChild(re);
  app.appendChild(c);
}
function renderLearnHomo(app){
  var c=el('div','card');
  c.appendChild(el('div','muted','同じ読みのことばを並べて、書き分けを確認します（全範囲から）'));
  var g={};
  KPS.forEach(function(kp){ (g[kp.yomiFull]=g[kp.yomiFull]||[]).push(kp); });
  var groups=Object.keys(g).filter(function(y){
    var ks={}; g[y].forEach(function(kp){ks[kp.k]=1;});
    return Object.keys(ks).length>1;
  }).sort();
  if(!groups.length){ c.appendChild(el('div','muted','いまのデータには同音異義語のグループがありません（教材追加で増えます）')); }
  groups.forEach(function(y){
    c.appendChild(el('h2',null,'「'+y+'」'));
    g[y].forEach(function(kp){
      var box=el('div','kpex');
      box.innerHTML='<b>'+esc(kp.ans)+'</b>　'+sentHTML(kp,'B',true)+
        (kp.def?'<div class="tiny">'+esc(kp.def)+'</div>':'');
      c.appendChild(box);
    });
  });
  app.appendChild(c);
}

/* ============ 一覧書き出し・CSV・入出力（§15／§9-2／§H） ============ */
var LIST_HEADER=['名前','カテゴリー','記号','知識ポイント','よみがな','重要度','状態','累計正解数','累計誤答数','形式A誤答数','形式B誤答数','過去の誤答内容','最終誤答日','習得日'];
function rowFor(kp,it){
  it=it||itemRO(kp.id);
  var st=stateOf(it);
  var lastWrong=it.wrongLog.length?jdate(it.wrongLog[it.wrongLog.length-1].at):'';
  return [AUTH?AUTH.id:'', CATS[kp.cat].long, CATS[kp.cat].unitLabel(kp.unit)+'-'+kp.n, kp.ans, kp.yomiFull,
    impMark(kp.imp), st.t, it.totalCorrect, it.totalWrong, it.byFormat.A.wrong, it.byFormat.B.wrong,
    it.wrongLog.map(function(x){return x.answered;}).join('；'), lastWrong, it.masteredAt?jdate(it.masteredAt):''];
}
function buildListRows(){ return KPS.map(function(kp){ return rowFor(kp,prog().items[kp.id]); }); }
async function exportListToDrive(){
  if(!ready()||!AUTH) return;
  setSync('','☁… 送信の前に最新の記録を確認しています');
  await pullCloud(true);
  var p=prog();
  if(!Object.keys(p.items).length){
    setSync('ng','☁⚠ 記録がまだ無いため、一覧の書き出しを中止しました');
    toastModal('書き出しを中止しました','まだ学習記録がありません。1回学習してから書き出してください。');
    return;
  }
  setSync('','☁… 全問一覧を送信しています');
  var j;
  try{ j=await api({app:APP,id:AUTH.id,list:{header:LIST_HEADER,rows:buildListRows()}}); }
  catch(e){ setSync('ng','☁⚠ 送信できませんでした（オフライン？）'); return; }
  if(!j.ok){ setSync('ng','☁⚠ '+apiError(j)); return; }
  setSync('ok','☁✓ 全問一覧をDriveへ書き出しました');
}
function dl(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function downloadCSV(){
  if(!AUTH) return;
  var p=prog();
  var rows=KPS.map(function(kp){ return rowFor(kp,p.items[kp.id]).concat([AUTH.label||'']); });
  rows.sort(function(a,b){ return (+b[8])-(+a[8]); });
  var head=LIST_HEADER.concat(['表示名']);
  var csv='\uFEFF'+[head].concat(rows).map(function(r){
    return r.map(function(c){ c=String(c==null?'':c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',');
  }).join('\r\n');
  dl(new Blob([csv],{type:'text/csv'}), TOOL+'結果_'+AUTH.id+'_'+ymd()+'.csv');
}
function exportJSON(){
  if(!AUTH) return;
  var out={app:APP,version:2,exportedAt:nowISO(),accounts:DB.accounts,progress:{}};
  out.progress[AUTH.id]=prog();
  dl(new Blob([JSON.stringify(out)],{type:'application/json'}), TOOL+'記録_'+AUTH.id+'_'+ymd()+'.json');
}
function openImport(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var raw=jparse(rd.result);
      if(!raw||raw.app!==APP){ toastModal('読み込めません','このファイルは「'+TOOL+'」ツールの記録ではありません。'); return; }
      var p=(raw.progress||{})[AUTH.id];
      if(!p){ toastModal('このIDの記録がありません','このファイルには ID '+AUTH.id+' の記録が入っていません（別のお子さんの記録の可能性があります）。'); return; }
      toastModal('記録を置きかえますか？','いまの端末の記録を、ファイルの内容（ID '+AUTH.id+'）で置きかえます。',[
        {label:'やめる'},
        {label:'置きかえる',pri:true,fn:function(){
          DB.progress[AUTH.id]=normProgress(p); saveDB(); pushCloud(true); render();
        }}
      ]);
    };
    rd.readAsText(f);
  };
  inp.click();
}
function resetRecords(){
  toastModal('このツールの記録を消しますか？','「'+TOOL+'」の学習記録（ID '+AUTH.id+'）をこの端末とクラウドの両方から消します。ほかのツールやほかのお子さんの記録には影響しません。',[
    {label:'やめる'},
    {label:'消す',fn:function(){
      setTimeout(function(){
        toastModal('本当に消しますか？','この操作は元に戻せません。',[
          {label:'やめる'},
          {label:'本当に消す',fn:function(){
            DB.progress[AUTH.id]={items:{},sessions:[]}; saveDB(); pushCloud(true); render();
          }}
        ]);
      },50);
    }}
  ]);
}

/* ============ render入口・起動（指示書 §I） ============ */
function render(){
  if(!ready()||!loggedIn()){ view='gate'; renderGate(); return; }
  if(view==='quiz'&&S){ renderQuiz(); return; }
  if(view==='result'&&S&&S.result){ renderResult(); return; }
  if(view==='learn'){ renderLearn(); return; }
  view='home'; renderHome();
}
$('#verTag').textContent=VER;
$('#accBtn').onclick=function(){
  if(view==='quiz'&&S&&S.log.length){ leaveQuiz(); return; }
  if(loggedIn()) location.href=portalURL();
};
loadAll();
if(ready()&&loggedIn()) setSync('','☁… クラウドと同期しています');
render();
if(ready()&&loggedIn()) pullCloud(true);
window.addEventListener('storage',function(ev){
  if(ev.key!=='kj-quiz:auth'&&ev.key!=='kj-quiz:sync') return;
  if(view==='quiz'&&S&&S.log.length) return;
  loadAll(); render();
});
</script>
