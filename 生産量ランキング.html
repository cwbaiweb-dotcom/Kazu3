<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生産量ランキング</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --sub:#5b6776; --line:#d6dde6;
  --pri:#1f4e79; --pri2:#2d6aa3; --ok:#1e8449; --ng:#c0392b; --warn:#d68910;
  --m-dark:#1f4e79; --m-mid:#7fa7cf; --m-light:#e3eaf2; --gold:#fff3cd;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;touch-action:manipulation}
input{font:inherit}
.hidden{display:none!important}
.warn{background:#fdecea;color:var(--ng);padding:8px 14px;font-size:14px;text-align:center}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:10px 14px;gap:8px}
header .ttl{font-weight:700;font-size:17px}
header .who{font-size:14px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h2{font-size:16px;margin:0 0 10px;color:var(--pri)}
h3{font-size:15px;margin:12px 0 6px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--pri);color:#fff;padding:12px 14px;font-weight:700;min-height:46px}
.btn.sub{background:#e8eef5;color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.danger{background:#fdecea;color:var(--ng)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px;min-height:70px}
.mode small{font-weight:400;font-size:12px;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#e8eef5;color:var(--pri);padding:7px 11px;border-radius:999px;font-size:14px}
.chip.on{background:var(--pri);color:#fff}
.chip .n{font-size:12px;opacity:.8;margin-left:3px}
.seg{display:flex;border:1.5px solid var(--pri);border-radius:10px;overflow:hidden;margin-top:8px}
.seg button{flex:1;background:#fff;color:var(--pri);border-radius:0;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--pri);color:#fff}
.bar{height:12px;background:var(--m-light);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--m-dark)} .bar .c{background:repeating-linear-gradient(45deg,var(--m-dark) 0 5px,var(--warn) 5px 9px)}
.bar .p{background:var(--m-mid)}
.barrow{display:grid;grid-template-columns:88px 1fr 104px;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.barrow .v{text-align:right;color:var(--sub);font-size:13px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.badge{display:inline-block;background:var(--warn);color:#fff;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700}
.badge.ng{background:var(--ng)}
.badge.gray{background:#9aa6b2}
.rank-list{list-style:none;padding:0;margin:0}
.rank-list li{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.status{font-size:13px;padding:8px 10px;border-radius:8px;background:#eef2f6;margin-bottom:10px}
.status.ok{color:var(--ok);background:#eaf6ee}.status.err{color:var(--ng);background:#fdecea}.status.busy{color:var(--sub)}
.panel .btn{font-size:14px;padding:10px;min-height:44px}
a{color:var(--pri2)}
/* quiz */
.qtop{position:sticky;top:46px;z-index:4;background:var(--bg);padding:6px 0 8px}
.pbar{height:8px;background:var(--m-light);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri2)}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:4px;flex-wrap:wrap;gap:4px}
.gauge{font-size:18px;letter-spacing:2px;color:var(--pri)}
.qcat{display:inline-block;background:#e8eef5;color:var(--pri);border-radius:6px;padding:1px 8px;font-size:13px;margin-right:6px}
.qfmt{display:inline-block;background:#f0e6fa;color:#6c3483;border-radius:6px;padding:1px 8px;font-size:13px}
.qtext{font-size:20px;font-weight:700;margin:10px 0 4px}
.qsub{font-size:14px;color:var(--sub)}
.inrow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:10px 0}
.inrow label{font-weight:700;color:var(--pri)}
.inrow input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font-size:18px;background:#fff}
.inrow input:focus{outline:none;border-color:var(--pri2)}
.choices{display:grid;gap:10px;margin-top:12px}
.choice{background:#fff;border:2px solid var(--line);color:var(--ink);padding:14px;font-size:18px;text-align:left;min-height:54px}
.choice.correct{border-color:var(--ok);background:#eaf6ee}
.choice.wrong{border-color:var(--ng);background:#fdecea}
.ranks{background:#f7f9fc;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:18px}
.ranks div{padding:2px 0}
.verdict{font-size:26px;font-weight:800;margin:6px 0}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
table.res{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
table.res td.o{color:var(--ok);font-weight:700}table.res td.x{color:var(--ng);font-weight:700}
.why{background:#f2f7fc;border-left:4px solid var(--pri2);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:15px}
.tip{background:#fff8e6;border-left:4px solid var(--warn);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:15px;color:#7a4b00}
.navrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.navrow .btn{flex:1}
.notice{background:#fff3cd;color:#7a5b00;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
/* lists */
.kprow{border-bottom:1px solid var(--line);padding:8px 2px}
.kprow .h{display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer}
.kprow .d{font-size:13px;color:var(--sub);margin-top:6px}
.st{font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.st.m{background:var(--m-dark);color:#fff}.st.c{background:var(--warn);color:#fff}.st.p{background:var(--m-mid);color:#fff}
.st.w{background:#fdecea;color:var(--ng)}.st.n{background:var(--m-light);color:var(--sub)}
.imp{color:#b7950b;font-weight:700}
select{font:inherit;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:#fff}
/* flashcard */
.fc{min-height:230px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.fc .big{font-size:26px;font-weight:800}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:#e8eef5;color:var(--pri);padding:10px}
.tabs button.on{background:var(--pri);color:#fff}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sum div{background:#f2f6fa;border-radius:10px;padding:8px 2px}
.sum b{display:block;font-size:22px}
.gate{text-align:center;padding:30px 16px}
.gate .big{font-size:42px}
@media (max-width:420px){.barrow{grid-template-columns:72px 1fr 92px}.sum b{font-size:19px}}
</style>
</head>
<body>
<div id="warn" class="warn hidden">この端末では記録を保存できません（ブラウザの保存領域が使えないため、画面を閉じると消えます）</div>
<header><div class="ttl">📊 生産量ランキング</div><div class="who" id="who"></div></header>
<main id="main"></main>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* =========================================================
   基本設定
   ========================================================= */
const APP = 'kj-quiz-shakai-seisan';      // ← ツール識別子（変更しない）
const TOOL_NAME = '生産量ランキング';
const PORTAL_URL = 'index.html';
const SYNC_KEY = 'kj-quiz:sync';
const AUTH_KEY = 'kj-quiz:auth';
const UI_KEY = APP + ':ui';
const MAX_RE = 4;

/* =========================================================
   問題データ（KP）
   ranks: 上位の正解（県名などの正式表記）
   swap : 順不同で正解とする順位の添字
   imp  : 2=◎ 1=○ 0=標準
   ========================================================= */
const CATS = ['米・麦・いも','野菜','果物','工芸作物','畜産','水産','工業'];
const KPS = [
 // 米・麦・いも
 {id:'kome',cat:'米・麦・いも',name:'米',unit:'収穫量',imp:2,ranks:['新潟','北海道','秋田'],
  why:'雪どけ水が豊富で、夏は日照時間が長い。越後平野・石狩平野・秋田平野が広い。',tip:'「しん・ほく・あき」＝新・北・秋'},
 {id:'komugi',cat:'米・麦・いも',name:'小麦',unit:'収穫量',imp:1,ranks:['北海道','福岡','佐賀'],
  why:'乾燥・冷涼な気候を好む。九州北部（筑紫平野）は米の裏作＝二毛作で麦をつくる。',tip:'「北の麦、九州は二毛作」'},
 {id:'daizu',cat:'米・麦・いも',name:'大豆',unit:'収穫量',imp:1,ranks:['北海道','宮城','秋田'],
  why:'冷涼な畑作地帯で多い。東北では田を畑に変える転作でつくる。',tip:'北海道＋東北（宮城・秋田）'},
 {id:'soba',cat:'米・麦・いも',name:'そば',unit:'収穫量',imp:0,ranks:['北海道','長野','栃木'],
  why:'やせた土地・すずしい気候でも育つ。',tip:'「信州そば」＝長野が2位'},
 {id:'jagaimo',cat:'米・麦・いも',name:'じゃがいも',unit:'収穫量',imp:2,ranks:['北海道','鹿児島','長崎'],
  why:'冷涼な十勝平野などで大規模に栽培（全国の約8割）。九州は冬〜春に早出しする。',tip:'北海道がダントツ。2・3位は「鹿・長（しかなが）」'},
 {id:'satsumaimo',cat:'米・麦・いも',name:'さつまいも',unit:'収穫量',imp:2,ranks:['鹿児島','茨城','千葉'],
  why:'シラス台地は水はけがよすぎて稲作に向かず、いもが育つ。関東は干しいも・焼きいも用。',tip:'「薩摩いも」＝鹿児島'},
 // 野菜
 {id:'cabbage',cat:'野菜',name:'キャベツ',unit:'収穫量',imp:2,ranks:['群馬','愛知','千葉'],
  why:'群馬は嬬恋村の夏キャベツ（高原の抑制栽培）、愛知は冬キャベツ、千葉は春キャベツ。季節ごとに産地がリレーする。',tip:'「グン（群馬）と愛（愛知）して千（千葉）切り」'},
 {id:'lettuce',cat:'野菜',name:'レタス',unit:'収穫量',imp:2,ranks:['長野','茨城','群馬'],
  why:'長野は野辺山原など夏でもすずしい高原で、他の産地が少ない夏に出荷する（抑制栽培）。',tip:'「長い（長野）イバラ（茨城）をグン（群馬）と切る」'},
 {id:'hakusai',cat:'野菜',name:'はくさい',unit:'収穫量',imp:1,ranks:['茨城','長野','群馬'],
  why:'茨城は大都市向けの近郊農業、長野は夏の高原でつくる。',tip:'レタスの1位と2位を入れかえる'},
 {id:'tamanegi',cat:'野菜',name:'たまねぎ',unit:'収穫量',imp:1,ranks:['北海道','佐賀','兵庫'],
  why:'佐賀は米の裏作（二毛作）、兵庫は淡路島が産地。',tip:'「北で佐賀して淡路で泣く（たまねぎで涙）」'},
 {id:'ninjin',cat:'野菜',name:'にんじん',unit:'収穫量',imp:1,ranks:['北海道','千葉','徳島'],
  why:'千葉・徳島は大都市向けに春〜夏に出荷する。',tip:'「北・千・徳（ほくせんとく）」'},
 {id:'negi',cat:'野菜',name:'ねぎ',unit:'収穫量',imp:0,ranks:['千葉','埼玉','茨城'],
  why:'近郊農業の代表。深谷ねぎ（埼玉）が有名。年によって順位が入れかわる。',tip:'関東3県（千・埼・茨）'},
 {id:'hourensou',cat:'野菜',name:'ほうれんそう',unit:'収穫量',imp:0,ranks:['埼玉','群馬','千葉'],
  why:'葉物は傷みやすいので、大都市の近くでつくって新鮮なうちに届ける。',tip:'「葉物は近郊」'},
 {id:'kyuri',cat:'野菜',name:'きゅうり',unit:'収穫量',imp:1,ranks:['宮崎','群馬','埼玉'],
  why:'宮崎は冬でも暖かい気候を生かしたビニールハウスの促成栽培。群馬・埼玉は夏に出荷。',tip:'「宮崎の冬きゅうり」'},
 {id:'piman',cat:'野菜',name:'ピーマン',unit:'収穫量',imp:1,ranks:['茨城','宮崎','鹿児島'],
  why:'茨城は近郊農業。宮崎・鹿児島は冬の促成栽培。',tip:'「ピーマンは茨（いばら）と南九州」'},
 {id:'nasu',cat:'野菜',name:'なす',unit:'収穫量',imp:1,ranks:['高知','熊本','群馬'],
  why:'高知平野は冬も暖かく、ビニールハウスの促成栽培がさかん。',tip:'「なすは高知（こうち）でコウチャク（高・熊）」'},
 {id:'tomato',cat:'野菜',name:'トマト',unit:'収穫量',imp:1,ranks:['熊本','北海道','愛知'],
  why:'熊本の八代平野で冬〜春のトマトを大量につくる。',tip:'「トマトは熊本」'},
 {id:'ichigo',cat:'野菜',name:'いちご',unit:'収穫量',imp:1,ranks:['栃木','福岡','熊本'],
  why:'栃木（とちおとめ）・福岡（あまおう）。冬のハウス栽培。',tip:'「とち・あまおう・くま」'},
 {id:'melon',cat:'野菜',name:'メロン',unit:'収穫量',imp:1,ranks:['茨城','熊本','北海道'],
  why:'茨城の鉾田市が中心。夕張メロン（北海道）は有名だが量では3位。',tip:'「メロンは茨城が1位、夕張は3位」'},
 {id:'suika',cat:'野菜',name:'すいか',unit:'収穫量',imp:0,ranks:['熊本','千葉','山形'],
  why:'熊本は春、千葉・山形は夏に出荷する。',tip:'「くま・ちば・やま」'},
 // 果物
 {id:'mikan',cat:'果物',name:'みかん',unit:'収穫量',imp:2,ranks:['和歌山','愛媛','静岡'],swap:[1,2],
  why:'温暖で日当たりのよい、海沿いの山の斜面でつくる。2位・3位は年によって入れかわる。',tip:'「わ・え・し」（和歌山・愛媛・静岡）'},
 {id:'ringo',cat:'果物',name:'りんご',unit:'収穫量',imp:2,ranks:['青森','長野','岩手'],
  why:'冷涼な気候を好む。青森（津軽平野）で全国の約6割。',tip:'「青い長い岩」'},
 {id:'budou',cat:'果物',name:'ぶどう',unit:'収穫量',imp:2,ranks:['山梨','長野','岡山'],
  why:'甲府盆地の扇状地は水はけがよく、昼と夜の気温差が大きいので甘くなる。',tip:'「ぶ・な・お」（ぶどう＝長野・岡山）'},
 {id:'momo',cat:'果物',name:'もも',unit:'収穫量',imp:2,ranks:['山梨','福島','長野'],
  why:'ぶどうと同じく甲府盆地の扇状地。福島盆地も産地。',tip:'「ももは福（福島）を呼ぶ」'},
 {id:'sakuranbo',cat:'果物',name:'さくらんぼ',unit:'収穫量',imp:2,ranks:['山形','北海道','山梨'],
  why:'山形盆地でつくる。山形で全国の約7割以上。',tip:'「さくらんぼ＝山形」は即答'},
 {id:'nashi',cat:'果物',name:'日本なし',unit:'収穫量',imp:1,ranks:['千葉','茨城','栃木'],
  why:'関東の近郊でつくる（幸水・豊水）。鳥取の二十世紀梨は有名だが量では上位外の年が多い。',tip:'「なしは千葉の梨（ふなっしー）」'},
 {id:'younashi',cat:'果物',name:'西洋なし',unit:'収穫量',imp:0,ranks:['山形','新潟','青森'],
  why:'ラ・フランスの産地。',tip:'「ラ・フランスも山形」'},
 {id:'kaki',cat:'果物',name:'かき（果物）',unit:'収穫量',imp:1,ranks:['和歌山','奈良','福岡'],
  why:'和歌山の紀ノ川流域などでつくる。',tip:'「和歌山は、みかん・かき・うめの三冠」'},
 {id:'ume',cat:'果物',name:'うめ',unit:'収穫量',imp:1,ranks:['和歌山','群馬','三重'],
  why:'紀州の南高梅。和歌山で全国の約6割。',tip:'「和歌山は、みかん・かき・うめの三冠」'},
 {id:'pine',cat:'果物',name:'パイナップル',unit:'収穫量',imp:0,ranks:['沖縄'],
  why:'亜熱帯の気候。ほぼ沖縄だけでつくる。',tip:'南国のくだもの＝沖縄'},
 // 工芸作物
 {id:'cha',cat:'工芸作物',name:'茶（荒茶）',unit:'生産量',imp:2,ranks:['鹿児島','静岡','三重'],
  why:'2024年産から鹿児島が初の1位（静岡は60年以上1位だった）。鹿児島は平らな茶畑で大型機械が使え生産が安定。静岡は牧之原台地、高齢化で減少。',tip:'「かご（鹿児島）で静か（静岡）に見る（三重）お茶」。古いテキストの「静岡1位」に注意'},
 {id:'tensai',cat:'工芸作物',name:'てんさい（砂糖大根）',unit:'生産量',imp:1,ranks:['北海道'],
  why:'寒い地方でとれる砂糖の原料。北海道だけでつくる。',tip:'砂糖の原料：寒い北＝てんさい、暖かい南＝さとうきび'},
 {id:'satoukibi',cat:'工芸作物',name:'さとうきび',unit:'生産量',imp:1,ranks:['沖縄','鹿児島'],
  why:'暖かい地方でとれる砂糖の原料。沖縄と鹿児島の南西諸島。',tip:'砂糖の原料：寒い北＝てんさい、暖かい南＝さとうきび'},
 {id:'igusa',cat:'工芸作物',name:'い草（畳表）',unit:'生産量',imp:1,ranks:['熊本'],
  why:'八代平野でつくる。ほぼ全量が熊本。',tip:'「い草＝八代（熊本）」'},
 {id:'konnyaku',cat:'工芸作物',name:'こんにゃくいも',unit:'生産量',imp:1,ranks:['群馬'],

  get(k){ try { return localStorage.getItem(k); } catch(e){ this.fail(); return k in this.mem ? this.mem[k] : null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){ this.fail(); this.mem[k] = v; } },

  fail(){ if(!this.broken){ this.broken = true; const w = document.getElementById('warn'); if(w) w.classList.remove('hidden'); } }

function defaultItem(){
  return {streak: 0, mastered: false, postMasterWrong: 0, totalCorrect: 0, totalWrong: 0,
          byFormat: {A: {correct: 0, wrong: 0}, B: {correct: 0, wrong: 0}}, wrongLog: []};
}
function normItem(x){
  const d = defaultItem(); x = x || {};
  const r = {
    streak: +x.streak || 0, mastered: !!x.mastered, postMasterWrong: +x.postMasterWrong || 0,
    totalCorrect: +x.totalCorrect || 0, totalWrong: +x.totalWrong || 0,
    byFormat: {A: Object.assign({}, d.byFormat.A), B: Object.assign({}, d.byFormat.B)},
    wrongLog: Array.isArray(x.wrongLog) ? x.wrongLog.filter(w => w && w.at).map(w => stripNull({at: w.at, format: w.format, answered: w.answered})) : []
  };
  ['A', 'B'].forEach(f => { const b = (x.byFormat || {})[f] || {}; r.byFormat[f].correct = +b.correct || 0; r.byFormat[f].wrong = +b.wrong || 0; });
  r.wrongLog.sort((a, b) => tms(b.at) - tms(a.at)); r.wrongLog = r.wrongLog.slice(0, 5);
  if(x.masteredAt) r.masteredAt = x.masteredAt;
  if(x.lastFormat === 'A' || x.lastFormat === 'B') r.lastFormat = x.lastFormat;
  if(x.lastSeenAt) r.lastSeenAt = x.lastSeenAt;
  return r;
}
function normSessions(arr){
  const m = new Map();
  (Array.isArray(arr) ? arr : []).forEach(s => { if(s && s.finishedAt && !m.has(s.finishedAt)) m.set(s.finishedAt, stripNull(s)); });
  return [...m.values()].sort((a, b) => tms(a.finishedAt) - tms(b.finishedAt)).slice(-100);
}
function normProgress(p){
  p = p || {}; const items = {};
  Object.keys(p.items || {}).forEach(k => { items[k] = normItem(p.items[k]); });
  return {items, sessions: normSessions(p.sessions)};
}

/* =========================================================
   習得判定（§4）
   ========================================================= */
function requiredStreak(item){
  const w = item.totalWrong || 0;
  if(w >= 6) return 4;
  if(w >= 3) return 3;
  return 2;
}
function stateOf(it){
  if(it.mastered) return it.postMasterWrong >= 1 ? 'c' : 'm';
  if(it.streak > 0) return 'p';
  if(it.totalWrong > 0) return 'w';
  if(it.totalCorrect > 0) return 'w';
  return 'n';
}
function stateText(it){
  const s = stateOf(it);
  return s === 'm' ? '習得済み' : s === 'c' ? '要注意習得' : s === 'p' ? it.streak + '回正解' : s === 'w' ? '誤答' : '未出題';
}
function applyAnswer(it, fmt, ok, answered, mode){
  const at = nowISO();
  if(mode === '再確認' && !ok){
    // 再確認モードの誤答は postMasterWrong のみ増やす（§3-3）
    if(it.mastered) it.postMasterWrong++;
    return;
  }
  if(ok){
    it.totalCorrect++; it.byFormat[fmt].correct++;
    if(!it.mastered){
      if(it.streak === 0 || it.lastFormat !== fmt) it.streak++;   // 同形式の連続正解では進めない
      if(it.streak >= requiredStreak(it)){ it.mastered = true; it.masteredAt = at; }
    }
  } else {
    it.totalWrong++; it.byFormat[fmt].wrong++; it.streak = 0;
    it.wrongLog.unshift({at, format: fmt, answered});
    it.wrongLog = it.wrongLog.slice(0, 5);
    if(it.mastered) it.postMasterWrong++;
  }
  it.lastFormat = fmt; it.lastSeenAt = at;
}

/* =========================================================
   合流（§13-2）
   ========================================================= */
function mergeItem(a, b){
  if(!a) return normItem(b); if(!b) return normItem(a);
  a = normItem(a); b = normItem(b);
  const newer = tms(b.lastSeenAt) > tms(a.lastSeenAt) ? b : a;
  const mx = (x, y) => Math.max(x || 0, y || 0);
  const r = {
    streak: newer.streak,
    mastered: a.mastered || b.mastered,
    postMasterWrong: mx(a.postMasterWrong, b.postMasterWrong),
    totalCorrect: mx(a.totalCorrect, b.totalCorrect),
    totalWrong: mx(a.totalWrong, b.totalWrong),
    byFormat: {
      A: {correct: mx(a.byFormat.A.correct, b.byFormat.A.correct), wrong: mx(a.byFormat.A.wrong, b.byFormat.A.wrong)},
      B: {correct: mx(a.byFormat.B.correct, b.byFormat.B.correct), wrong: mx(a.byFormat.B.wrong, b.byFormat.B.wrong)}
    }
  };
  const logs = new Map();
  a.wrongLog.concat(b.wrongLog).forEach(w => { const k = w.at + '|' + w.format; if(!logs.has(k)) logs.set(k, w); });
  r.wrongLog = [...logs.values()].sort((x, y) => tms(y.at) - tms(x.at)).slice(0, 5);
  const ma = [a.masteredAt, b.masteredAt].filter(Boolean).sort((x, y) => tms(x) - tms(y));
  if(ma.length) r.masteredAt = ma[0];
  const ls = tms(a.lastSeenAt) >= tms(b.lastSeenAt) ? a.lastSeenAt : b.lastSeenAt;
  if(ls) r.lastSeenAt = ls;
  const lf = newer.lastFormat || (newer === a ? b.lastFormat : a.lastFormat);
  if(lf) r.lastFormat = lf;
  return normItem(r);
}
function mergeProgress(a, b){
  a = a || {}; b = b || {};
  const ia = a.items || {}, ib = b.items || {}, items = {};
  new Set(Object.keys(ia).concat(Object.keys(ib))).forEach(k => { items[k] = mergeItem(ia[k], ib[k]); });
  const sorted = {}; Object.keys(items).sort().forEach(k => sorted[k] = items[k]);
  return {items: sorted, sessions: normSessions((a.sessions || []).concat(b.sessions || []))};
}

                                 body: JSON.stringify(Object.assign({key: SYNC.key}, body))});
  } catch(e){ throw {msg: 'オフライン（ローカルには保存済み）'}; }
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); }
  catch(e){ throw {msg: 'GASの応答が不正です。GASのコードを最新版に貼り替え、『デプロイを管理→新バージョン』で更新してください'}; }
  if(j && j.ok === false){
    const er = String(j.error || '');
    if(er === 'auth'){ onAuthError(); throw {msg: 'ログインが無効になりました。ポータルでログインし直してください', auth: true}; }
    if(/key|合言葉/i.test(er)) throw {msg: '合言葉が違います（ポータルの同期設定を確認してください）'};
    throw {msg: 'サーバーエラー：' + (er || '不明')};
  }
  return j || {};
}
function onAuthError(){
  store.del(AUTH_KEY);           // 学習記録は消さない
  AUTH = null;
  if(screen === 'quiz'){ pendingReinit = true; return; }
  renderGate();
}
async function doFetch(){
  if(!SYNC || !AUTH) return false;
  const id = AUTH.id;
  setStatus('busy', '同期中…');
  try {
    const j = await api({action: 'fetch', app: APP, id, pw: AUTH.pw});
    if(!AUTH || AUTH.id !== id) return false;
    const data = j.data || {};
    const cp = (data.progress && data.progress[id]) || {items: {}, sessions: []};
    const acc = (data.accounts || []).find(a => a && a.id === id);
    const cloudLabel = j.label || (acc && acc.label);
    let labelChanged = false;
    if(cloudLabel && cloudLabel !== DB.accounts[0].label){ DB.accounts[0].label = cloudLabel; labelChanged = true; }
    if(acc && acc.createdAt && acc.createdAt !== DB.accounts[0].createdAt){ DB.accounts[0].createdAt = acc.createdAt; labelChanged = true; }
    const local = P();
    const merged = mergeProgress(local, cp);
    const mj = JSON.stringify(merged);
    const localChanged = mj !== JSON.stringify(mergeProgress(local, {}));
    const cloudChanged = mj !== JSON.stringify(mergeProgress(cp, {}));
    if(localChanged || labelChanged){ DB.progress[id] = merged; saveDb(true); }
    lastSyncAt = new Date();
    setStatus('ok', 'クラウドと同期しました');
    renderWho();
    if(localChanged && (screen === 'home')) renderHome();
    if(cloudChanged) await doPush();
    return true;
  } catch(e){
    setStatus('err', e.msg || String(e));
    return false;
  }
}
async function doPush(){
  if(!SYNC || !AUTH) return false;
  setStatus('busy', '送信中…');
  try {
    const p = P();
    await api({action: 'save', app: APP, id: AUTH.id, pw: AUTH.pw,
               account: stripNull({id: AUTH.id, name: AUTH.id, label: label(), createdAt: DB.accounts[0].createdAt}),
               progress: stripNull({items: p.items, sessions: p.sessions})});
    lastSyncAt = new Date();
    setStatus('ok', 'クラウドに保存しました');
    return true;
  } catch(e){
    setStatus('err', e.msg || String(e));
    return false;
  }
}

/* =========================================================
   セッション
   ========================================================= */
function pickFmt(id){ const it = getItem(id); return it.lastFormat ? other(it.lastFormat) : (Math.random() < .5 ? 'A' : 'B'); }
function startSession(mode, focusId){
  const range = rangeKps();
  let kps = [], queue = [], notice = '';
  if(mode === '10問' || mode === '20問'){
    const N = mode === '10問' ? 10 : 20;
    let cand = range.filter(k => !getItem(k.id).mastered);
    cand.sort((a, b) => {
      const A = getItem(a.id), B = getItem(b.id);
      if(B.totalWrong !== A.totalWrong) return B.totalWrong - A.totalWrong;
      const ua = A.lastSeenAt ? 1 : 0, ub = B.lastSeenAt ? 1 : 0;
      if(ua !== ub) return ua - ub;
      return tms(A.lastSeenAt) - tms(B.lastSeenAt);
    });
    let focus = null;
    if(focusId && KP[focusId]){ focus = KP[focusId]; cand = cand.filter(k => k.id !== focusId); }
    kps = shuffle(cand.slice(0, focus ? N - 1 : N));
    if(focus) kps.unshift(focus);
    if(kps.length < N){
      if(!kps.length){ alert('この出題範囲には、まだ習得していない品目がありません。\n範囲を広げるか、全問モード・再確認モードを使ってください。'); return; }
      notice = `出題範囲の未習得が${kps.length}品目のため、${kps.length}品目で出題します。`;
    }
    queue = kps.map(k => ({kp: k.id, fmt: pickFmt(k.id)}));
  } else if(mode === '全問'){
    kps = shuffle(range);
    if(!kps.length){ alert('出題範囲に品目がありません。'); return; }
    queue = kps.map(k => ({kp: k.id, fmt: pickFmt(k.id)}));
  } else if(mode === '再確認'){
    kps = shuffle(range.filter(k => { const it = getItem(k.id); return it.mastered && it.postMasterWrong >= 1; }));
    if(!kps.length){ alert('この出題範囲には、要注意の品目はありません。'); return; }
    const f = {}; kps.forEach(k => f[k.id] = Math.random() < .5 ? 'A' : 'B');
    queue = kps.map(k => ({kp: k.id, fmt: f[k.id]})).concat(kps.map(k => ({kp: k.id, fmt: other(f[k.id])})));
  }
  const items = {};
  kps.forEach(k => items[k.id] = normItem(clone(getItem(k.id))));
  S = {
    mode, notice, startedAt: nowISO(),
    startMastered: KPS.filter(k => getItem(k.id).mastered).map(k => k.id),
    queue, cur: 0, answered: [], items, reCount: {}, overCap: [],
    view: 0, snap: null, draft: null
  };
  screen = 'quiz';
  renderQuiz();
}
function core(){ return {queue: S.queue, cur: S.cur, answered: S.answered, items: S.items, reCount: S.reCount, overCap: S.overCap}; }
function remainKps(){ return new Set(S.queue.slice(S.cur).map(q => q.kp)).size; }
function makeChoices(kp){
  const sig = k => k.ranks.join('|');
  const pool = KPS.filter(k => k.id !== kp.id && sig(k) !== sig(kp));
  const same = shuffle(pool.filter(k => k.cat === kp.cat));
  const diff = shuffle(pool.filter(k => k.cat !== kp.cat));
  const picks = same.concat(diff).slice(0, 3).map(k => k.id);
  return shuffle(picks.concat([kp.id]));
}
function judgeA(kp, inputs){
  const used = new Set();
  const parts = kp.ranks.map((r, i) => {
    const v = (inputs[i] || '').trim();
    const key = matchName(v);
    let ok;
    if(kp.swap && kp.swap.includes(i)) ok = !!key && kp.swap.some(j => kp.ranks[j] === key) && !used.has(key);
    else ok = key === r;
    if(ok) used.add(key);
    return {rank: i + 1, correct: rankLabel(kp, i), input: v, ok};
  });
  return {ok: parts.every(p => p.ok), parts, answered: parts.map(p => p.input || '（空欄）').join('・')};
}
function submit(input){
  if(!S || S.cur >= S.queue.length || S.view !== S.cur) return;
  const i = S.cur, q = S.queue[i], kp = KP[q.kp];
  S.snap = {i, data: clone(core())};      // 直前の1問を巻き戻すためのスナップショット
  let res;
  if(q.fmt === 'A') res = judgeA(kp, input);
  else res = {ok: input === kp.id, choice: input, answered: KP[input] ? KP[input].name : String(input)};
  const it = S.items[q.kp];
  applyAnswer(it, q.fmt, res.ok, res.answered, S.mode);
  S.answered[i] = Object.assign({kp: q.kp, fmt: q.fmt}, res);
  if(S.mode !== '全問') schedule(i, q, it, res.ok);
  S.cur = i + 1; S.view = i; S.draft = null;
  renderQuiz();
}
function schedule(i, q, it, ok){
  let off = null;
  if(!ok) off = 3;
  else if(!it.mastered && S.mode !== '再確認') off = 6;
  if(off == null) return;
  const n = S.reCount[q.kp] || 0;
  if(n >= MAX_RE){ if(!S.overCap.includes(q.kp)) S.overCap.push(q.kp); return; }
  S.reCount[q.kp] = n + 1;
  let p = i + off;
  while(p < S.queue.length && S.queue[p].re) p++;
  if(p > S.queue.length) p = S.queue.length;
  S.queue.splice(p, 0, {kp: q.kp, fmt: other(q.fmt), re: true});
}
function redo(){
  if(!S || !S.snap || S.snap.i !== S.cur - 1) return;
  const keepChoices = S.queue[S.snap.i].choices;
  Object.assign(S, clone(S.snap.data));
  if(keepChoices && !S.queue[S.cur].choices) S.queue[S.cur].choices = keepChoices;
  S.view = S.cur; S.snap = null; S.draft = null;
  renderQuiz();
}
function goView(v){
  if(!S) return;
  if(v < 0) return;
  if(v >= S.queue.length && S.cur >= S.queue.length){ finish(); return; }
  if(v > S.cur) v = S.cur;
  S.view = v; renderQuiz();
}
function quitSession(){
  if(!confirm('ここでやめると、このセッションの記録はされません。やめますか？')) return;
  S = null; afterSession(); renderHome();
}
function afterSession(){
  if(pendingReinit){ pendingReinit = false; reinit(); return true; }
  return false;
}

/* ---------- 出題画面 ---------- */
function gaugeHTML(it){
  const req = requiredStreak(it);
  const f = it.mastered ? req : Math.min(it.streak, req);
  let s = '●'.repeat(f) + '○'.repeat(req - f);
  const note = req > 2 && !it.mastered ? `<span class="muted">（この品目は苦手なので${req}回必要）</span>` : '';
  return `<span class="gauge">${s}</span> ${note}`;
}
function qHeadHTML(q){
  const kp = KP[q.kp];
  return `<span class="qcat">${esc(kp.cat)}</span><span class="qfmt">${q.fmt === 'A' ? '形式A 県を入力' : '形式B 品目を選ぶ'}</span>${kp.imp ? ` <span class="imp">${impMark(kp.imp)}</span>` : ''}`;
}
function askLabel(kp){ return kp.ask || '都道府県'; }
function promptA(kp){
  const n = kp.ranks.length;
  if(n === 1) return {main: `「${kp.name}」`, sub: `${kp.unit === '主な産地' ? '生産がさかんな' : kp.unit + 'が全国1位の'}${askLabel(kp)}は？（ほぼこの1県に集中）`};
  return {main: `「${kp.name}」`, sub: `${kp.unit}の上位${n}位までの${askLabel(kp)}を、順番に入力`};
}
function renderQuiz(){
  if(!S) return renderHome();
  const v = S.view;
  const total = S.queue.length;
  const answeredN = S.answered.filter(Boolean).length;
  const correctN = S.answered.filter(a => a && a.ok).length;
  const q = S.queue[Math.min(v, total - 1)];
  const it = S.items[q.kp];
  const top = `<div class="qtop">
    <div class="pbar"><i style="width:${total ? (S.cur / total * 100) : 0}%"></i></div>
    <div class="qmeta"><span>${Math.min(v + 1, total)}問目 / 全${total}問</span><span>あと${remainKps()}品目</span><span>正解${correctN} 誤答${answeredN - correctN}</span></div>
    <div class="qmeta"><span>${esc(S.mode)}モード</span><span>${gaugeHTML(it)}</span></div>
  </div>`;
  const notice = S.notice && S.cur === 0 ? `<div class="notice">${esc(S.notice)}</div>` : '';
  let body;
  if(v < S.cur) body = feedbackHTML(v);
  else body = questionHTML(q);
  const back = v > 0 ? `<button class="btn sub" onclick="goView(${v - 1})">◀ 前の問題</button>` : '';
  $('main').innerHTML = top + notice + `<div class="card">${body}</div>` +
    `<div class="navrow">${back}<button class="btn ghost" onclick="quitSession()">やめる</button></div>`;
  if(v === S.cur && q.fmt === 'A'){ const f = $('in0'); if(f) setTimeout(() => f.focus(), 30); }
}
function questionHTML(q){
  const kp = KP[q.kp];
  if(q.fmt === 'A'){
    const p = promptA(kp);
    const d = S.draft || [];
    const rows = kp.ranks.map((_, i) => `<div class="inrow"><label for="in${i}">${i + 1}位</label><input id="in${i}" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(d[i] || '')}" placeholder="${esc(askLabel(kp))}" onkeydown="inKey(event,${i},${kp.ranks.length})" oninput="saveDraft(${kp.ranks.length})"></div>`).join('');
    return `${qHeadHTML(q)}
      <div class="qtext">${esc(p.main)}</div><div class="qsub">${esc(p.sub)}</div>
      ${kp.swap ? `<div class="qsub">※${kp.swap.map(j => j + 1).join('位と')}位は年によって入れかわるため、順不同で正解</div>` : ''}
      ${rows}
      <div class="navrow"><button class="btn" id="judgeBtn" onclick="submitA(${kp.ranks.length})">判定する</button><button class="btn sub" onclick="submit([])">わからない</button></div>`;
  }
  if(!q.choices) q.choices = makeChoices(kp);
  return `${qHeadHTML(q)}
    <div class="qtext">このランキングは何？</div>
    <div class="qsub">${esc(kp.cat)}／${esc(kp.unit)}</div>
    <div class="ranks">${kp.ranks.map((r, i) => `<div><b>${i + 1}位</b> ${esc(rankLabel(kp, i))}</div>`).join('')}${kp.ranks.length === 1 ? '<div class="muted">（ほぼこの1県に集中）</div>' : ''}</div>
    <div class="choices">${q.choices.map(c => `<button class="choice" onclick="submit('${c}')">${esc(KP[c].name)}</button>`).join('')}</div>`;
}
function saveDraft(n){ S.draft = []; for(let i = 0; i < n; i++){ const f = $('in' + i); S.draft.push(f ? f.value : ''); } }
function inKey(e, i, n){
  if(e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  if(i < n - 1) $('in' + (i + 1)).focus(); else submitA(n);
}
function submitA(n){
  const vals = []; for(let i = 0; i < n; i++) vals.push(($('in' + i) || {}).value || '');
  if(vals.every(v => !v.trim()) && !confirm('何も入力されていません。わからないとして答えますか？')) return;
  submit(vals);
}
function feedbackHTML(v){
  const a = S.answered[v], q = S.queue[v], kp = KP[a.kp];
  let detail;
  if(a.fmt === 'A'){
    detail = `<div class="qtext" style="font-size:18px">「${esc(kp.name)}」の${esc(kp.unit)}</div>
      <table class="res"><tr><th>順位</th><th>正解</th><th>あなたの答え</th><th></th></tr>
      ${a.parts.map(p => `<tr><td>${p.rank}位</td><td><b>${esc(p.correct)}</b></td><td>${esc(p.input || '（空欄）')}</td><td class="${p.ok ? 'o' : 'x'}">${p.ok ? '○' : '×'}</td></tr>`).join('')}
      </table>`;
  } else {
    const ch = q.choices || [];
    detail = `<div class="ranks">${kp.ranks.map((r, i) => `<div><b>${i + 1}位</b> ${esc(rankLabel(kp, i))}</div>`).join('')}</div>
      <div class="choices">${ch.map(c => `<div class="choice ${c === kp.id ? 'correct' : (c === a.choice ? 'wrong' : '')}">${c === kp.id ? '✓ ' : (c === a.choice ? '✕ ' : '')}${esc(KP[c].name)}</div>`).join('')}</div>`;
  }
  const it = S.items[a.kp];
  const mastNow = it.mastered && !S.startMastered.includes(a.kp);
  const canRedo = v === S.cur - 1 && S.snap && S.snap.i === v;
  const last = S.cur >= S.queue.length && v === S.cur - 1;
  const nextBtn = last ? `<button class="btn ok" onclick="finish()">結果を見る ▶</button>`
    : `<button class="btn" onclick="goView(${v + 1})">${v + 1 === S.cur ? '次の問題へ ▶' : '進む ▶'}</button>`;
  return `${qHeadHTML(q)}
    <div class="verdict ${a.ok ? 'ok' : 'ng'}">${a.ok ? '⭕ 正解！' : '❌ ざんねん'}</div>
    ${mastNow && a.ok ? '<div class="notice">🎉 この品目を習得しました！</div>' : ''}
    ${detail}
    <div class="why"><b>理由</b><br>${esc(kp.why)}</div>
    <div class="tip"><b>覚え方</b><br>${esc(kp.tip)}</div>
    ${v < S.cur - 1 ? '<p class="muted">この問題は見るだけです（答え直せるのは直前の1問だけ）。</p>' : ''}
    <div class="navrow">${canRedo ? '<button class="btn sub" onclick="redo()">↺ 答え直す</button>' : ''}${nextBtn}</div>`;
}

/* ---------- 成績確定（§6-2・§11） ---------- */
function finish(){
  if(!S || S.cur < S.queue.length) return;
  const p = P(), at = nowISO();
  const touched = [...new Set(S.answered.filter(Boolean).map(a => a.kp))];
  touched.forEach(id => { p.items[id] = mergeItem(p.items[id], S.items[id]); });
  const correct = S.answered.filter(a => a && a.ok).length;
  const wrong = S.answered.filter(a => a && !a.ok).length;
  const newly = KPS.filter(k => p.items[k.id] && p.items[k.id].mastered && !S.startMastered.includes(k.id)).map(k => k.id);
  const wrongKpIds = [...new Set(S.answered.filter(a => a && !a.ok).map(a => a.kp))];
  const totalMastered = KPS.filter(k => p.items[k.id] && p.items[k.id].mastered).length;
  p.sessions.push({startedAt: S.startedAt, finishedAt: at, mode: S.mode, correct, wrong,
                   newlyMastered: newly, wrongKpIds, totalMastered});
  p.sessions = normSessions(p.sessions);
  saveDb(false);
  const result = {mode: S.mode, correct, wrong, newly, overCap: S.overCap.slice(), answered: S.answered.slice(), queue: S.queue.slice()};
  S = null;
  screen = 'result';
  renderResult(result);
  doPush();
  if(pendingReinit){ pendingReinit = false; setTimeout(reinit, 0); }
}

/* =========================================================
   結果画面（§8）
   ========================================================= */
let LF = {cat: 'all', st: 'all', sort: 'wrong', open: null};
function renderResult(r){
  renderWho();
  const total = r.correct + r.wrong;
  const wrongs = r.answered.map((a, i) => a && !a.ok ? Object.assign({q: r.queue[i]}, a) : null).filter(Boolean);
  $('main').innerHTML = `
  <div class="card">
    <h2>結果（${esc(r.mode)}モード）</h2>
    <div class="sum"><div><b style="color:var(--ok)">${r.correct}</b>正解</div><div><b style="color:var(--ng)">${r.wrong}</b>誤答</div><div><b>${total ? Math.round(r.correct / total * 100) : 0}%</b>正答率</div><div><b>${r.newly.length}</b>新たに習得</div></div>
    ${r.newly.length ? `<p>🎉 習得：${r.newly.map(id => esc(KP[id].name)).join('、')}</p>` : ''}
    ${r.overCap.length ? `<div class="notice">⚠ <b>要復習</b>（今回くり返し上限に達した品目）：${r.overCap.map(id => esc(KP[id].name)).join('、')}</div>` : ''}
    ${statusHTML()}
    <div class="navrow"><button class="btn" onclick="renderHome()">ホームへ</button><button class="btn sub" onclick="downloadCSV()">📄 CSVダウンロード</button></div>
  </div>
  <div class="card">
    <h2>今回まちがえた問題（${wrongs.length}）</h2>
    ${wrongs.length ? `<table class="res"><tr><th>品目</th><th>形式</th><th>あなたの答え</th><th>正解</th></tr>
      ${wrongs.map(w => { const kp = KP[w.kp]; return `<tr><td><b>${esc(kp.name)}</b></td><td>${w.fmt}</td><td>${esc(w.answered)}</td><td>${w.fmt === 'A' ? esc(kp.ranks.map((x, i) => rankLabel(kp, i)).join('・')) : esc(kp.name)}</td></tr><tr><td colspan="4" class="muted">${esc(kp.why)}<br>覚え方：${esc(kp.tip)}</td></tr>`; }).join('')}</table>`
      : '<p>全問正解です！</p>'}
  </div>
  <div class="card" id="allList">${allListHTML()}</div>`;
  window.scrollTo(0, 0);
}
function openList(){ screen = 'list'; renderListScreen(); }
function renderListScreen(){
  renderWho();
  $('main').innerHTML = `<div class="navrow" style="margin:0 0 12px"><button class="btn sub" onclick="renderHome()">◀ ホームへ</button><button class="btn sub" onclick="downloadCSV()">📄 CSV</button></div><div class="card" id="allList">${allListHTML()}</div>`;
}
function allListHTML(){
  const order = {m: 4, c: 1, p: 2, w: 0, n: 3};
  let rows = KPS.map(k => ({k, it: getItem(k.id)}));
  if(LF.cat !== 'all') rows = rows.filter(r => r.k.cat === LF.cat);
  if(LF.st !== 'all') rows = rows.filter(r => stateOf(r.it) === LF.st);
  if(LF.sort === 'wrong') rows.sort((a, b) => b.it.totalWrong - a.it.totalWrong || KPS.indexOf(a.k) - KPS.indexOf(b.k));
  else if(LF.sort === 'state') rows.sort((a, b) => order[stateOf(a.it)] - order[stateOf(b.it)]);
  const opt = (v, t, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`;
  return `<h2>カテゴリー別 全問一覧 <span class="muted">（全${KPS.length}品目・累計）</span></h2>
  <div class="row" style="margin-bottom:8px">
    <select onchange="LF.cat=this.value;refreshList()">${opt('all', 'すべてのカテゴリー', LF.cat)}${CATS.map(c => opt(c, c, LF.cat)).join('')}</select>
    <select onchange="LF.st=this.value;refreshList()">${opt('all', 'すべての状態', LF.st)}${opt('m', '習得済み', LF.st)}${opt('c', '要注意習得', LF.st)}${opt('p', '◯回正解', LF.st)}${opt('w', '誤答', LF.st)}${opt('n', '未出題', LF.st)}</select>
    <select onchange="LF.sort=this.value;refreshList()">${opt('wrong', '誤答数が多い順', LF.sort)}${opt('cat', 'カテゴリー順', LF.sort)}${opt('state', '状態順', LF.sort)}</select>
  </div>
  ${rows.length ? rows.map(({k, it}) => `<div class="kprow"><div class="h" onclick="LF.open=LF.open==='${k.id}'?null:'${k.id}';refreshList()">
      <span><span class="imp">${impMark(k.imp)}</span> <b>${esc(k.name)}</b> <span class="muted">${esc(k.cat)}</span></span>
      <span><span class="st ${stateOf(it)}">${stateText(it)}</span> ${it.totalWrong ? `<span class="badge ${it.totalWrong >= 2 ? 'ng' : 'gray'}">誤答${it.totalWrong}回</span>` : ''}</span></div>
    ${LF.open === k.id ? `<div class="d">${esc(rankLine(k))}<br>形式A（県を入力）：正解${it.byFormat.A.correct}・誤答${it.byFormat.A.wrong}　形式B（品目を選ぶ）：正解${it.byFormat.B.correct}・誤答${it.byFormat.B.wrong}<br>
      ${it.wrongLog.length ? '過去の誤答：' + it.wrongLog.map(w => esc(ymd(w.at) + ' [' + w.format + '] ' + (w.answered || ''))).join('<br>') : '誤答の記録はありません'}${it.masteredAt ? '<br>習得日：' + esc(ymd(it.masteredAt)) : ''}</div>` : ''}</div>`).join('') : '<p class="muted">該当する品目はありません。</p>'}`;
}
function refreshList(){ const el = $('allList'); if(el) el.innerHTML = allListHTML(); }

/* =========================================================
   覚えるモード（§3-4）※記録・同期に一切影響しない
   ========================================================= */
let L = {tab: 'list', detail: null, deck: [], flipped: false, dir: 'A', deckTotal: 0};
function openLearn(){ screen = 'learn'; L.detail = null; newDeck(); renderLearn(); }
function newDeck(){ L.deck = shuffle(rangeKps().map(k => k.id)); L.deckTotal = L.deck.length; L.flipped = false; }
function renderLearn(){
  renderWho();
  const tabs = `<div class="tabs"><button class="${L.tab === 'list' ? 'on' : ''}" onclick="L.tab='list';L.detail=null;renderLearn()">📋 一覧学習</button><button class="${L.tab === 'card' ? 'on' : ''}" onclick="L.tab='card';renderLearn()">🃏 単語カード</button></div>`;
  const head = `<div class="navrow" style="margin:0 0 12px"><button class="btn sub" onclick="renderHome()">◀ ホームへ</button></div>
    <div class="card"><h2>📖 覚えるモード</h2><p class="muted" style="margin-top:0">ここでの操作は記録・習得判定に影響しません。</p>${rangeHTML()}</div>`;
  let body = '';
  const range = rangeKps();
  if(L.tab === 'list'){
    if(L.detail){
      const idx = range.findIndex(k => k.id === L.detail);
      const k = KP[L.detail], it = getItem(k.id);
      body = `<div class="card">
        <div><span class="qcat">${esc(k.cat)}</span>${k.imp ? `<span class="imp">${impMark(k.imp)}</span>` : ''} <span class="st ${stateOf(it)}">${stateText(it)}</span></div>
        <div class="qtext">${esc(k.name)}</div><div class="qsub">${esc(k.unit)}</div>
        <div class="ranks">${k.ranks.map((r, i) => `<div><b>${i + 1}位</b> ${esc(rankLabel(k, i))}</div>`).join('')}</div>
        <div class="why"><b>理由</b><br>${esc(k.why)}</div>
        <div class="tip"><b>覚え方</b><br>${esc(k.tip)}</div>
        <div class="navrow"><button class="btn sub" ${idx <= 0 ? 'disabled' : ''} onclick="L.detail='${idx > 0 ? range[idx - 1].id : ''}';renderLearn()">◀ 前へ</button>
          <button class="btn ghost" onclick="L.detail=null;renderLearn()">一覧へ</button>
          <button class="btn sub" ${idx < 0 || idx >= range.length - 1 ? 'disabled' : ''} onclick="L.detail='${idx >= 0 && idx < range.length - 1 ? range[idx + 1].id : ''}';renderLearn()">次へ ▶</button></div>
        <p class="muted">${idx + 1} / ${range.length}</p></div>`;
    } else {
      body = CATS.map(c => {
        const ks = range.filter(k => k.cat === c); if(!ks.length) return '';
        return `<div class="card"><h2>${esc(c)}</h2>${ks.map(k => { const it = getItem(k.id); return `<div class="kprow"><div class="h" onclick="L.detail='${k.id}';renderLearn();window.scrollTo(0,0)"><span><span class="imp">${impMark(k.imp)}</span> <b>${esc(k.name)}</b><br><span class="muted">${esc(rankLine(k))}</span></span><span class="st ${stateOf(it)}">${stateText(it)}</span></div></div>`; }).join('')}</div>`;
      }).join('') || '<div class="card"><p>出題範囲に品目がありません。</p></div>';
    }
  } else {
    const dirSeg = `<div class="seg" style="margin:0 0 12px"><button class="${L.dir === 'A' ? 'on' : ''}" onclick="L.dir='A';L.flipped=false;renderLearn()">品目 → ランキング</button><button class="${L.dir === 'B' ? 'on' : ''}" onclick="L.dir='B';L.flipped=false;renderLearn()">ランキング → 品目</button></div>`;
    if(!L.deck.length){
      body = `<div class="card">${dirSeg}<p style="text-align:center;font-size:20px">🎉 全部めくりました！</p><div class="navrow"><button class="btn" onclick="newDeck();renderLearn()">もう一度</button></div></div>`;
    } else {
      const k = KP[L.deck[0]];
      const ranksHTML = `<div class="ranks" style="text-align:left;width:100%">${k.ranks.map((r, i) => `<div><b>${i + 1}位</b> ${esc(rankLabel(k, i))}</div>`).join('')}</div>`;
      const front = L.dir === 'A'
        ? `<div class="muted">${esc(k.cat)}／${esc(k.unit)}</div><div class="big">${esc(k.name)}</div><div class="muted">上位の${esc(askLabel(k))}は？</div>`
        : `<div class="muted">${esc(k.cat)}／${esc(k.unit)}　これは何？</div>${ranksHTML}`;
      const back = (L.dir === 'A' ? `<div class="big" style="font-size:20px">${esc(k.name)}</div>${ranksHTML}` : `<div class="big">${esc(k.name)}</div>`)
        + `<div class="why" style="text-align:left;width:100%">${esc(k.why)}</div><div class="tip" style="text-align:left;width:100%">${esc(k.tip)}</div>`;
      body = `<div class="card">${dirSeg}
        <p class="muted" style="margin-top:0">残り ${L.deck.length} 枚 / ${L.deckTotal} 枚</p>
        <div class="fc" onclick="L.flipped=!L.flipped;renderLearn()">${L.flipped ? back : front}<div class="muted" style="margin-top:8px">${L.flipped ? '' : 'タップでめくる'}</div></div>
        <div class="navrow"><button class="btn sub" onclick="cardLater()">まだ</button><button class="btn ok" onclick="cardDone()">覚えた</button></div></div>`;
    }
  }
  $('main').innerHTML = head + tabs + body;
}
function cardDone(){ L.deck.shift(); L.flipped = false; renderLearn(); }       // 画面上の一時状態のみ
function cardLater(){ L.deck.push(L.deck.shift()); L.flipped = false; renderLearn(); }

/* =========================================================
   起動（§1-4）
   ========================================================= */
function readAuthSync(){
  const s = readJSON(SYNC_KEY), a = readJSON(AUTH_KEY);
  SYNC = s && s.url && s.key ? s : null;
  AUTH = a && a.id && a.pw ? {id: String(a.id), pw: String(a.pw), label: a.label ? String(a.label) : ''} : null;
}
function reinit(){
  const prevId = AUTH && AUTH.id;
  readAuthSync();
  if(!SYNC || !AUTH){ renderGate(); return; }
  if(!DB || prevId !== AUTH.id) loadDb();
  else if(AUTH.label && !DB.accounts[0].label) DB.accounts[0].label = AUTH.label;
  renderHome();
  doFetch();
}
window.addEventListener('storage', e => {
  if(e.key !== null && e.key !== AUTH_KEY && e.key !== SYNC_KEY && e.key !== APP) return;
  if(screen === 'quiz'){ pendingReinit = true; return; }   // 出題中は割り込まない
  if(e.key === APP && AUTH){ loadDb(); if(screen === 'home') renderHome(); return; }
  reinit();
});
window.addEventListener('beforeunload', e => { if(screen === 'quiz' && S){ e.preventDefault(); e.returnValue = ''; } });
$('fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) importJSON(f); });

loadUI();
readAuthSync();
if(!SYNC || !AUTH) renderGate();
else { loadDb(); renderHome(); doFetch(); }
</script>
</body>
</html>
