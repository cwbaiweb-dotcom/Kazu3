<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事成語クイズ v2</title>
<style>
  :root{
    --paper:#FAF6EC; --card:#FFFDF6; --ink:#2B2B33; --ink-soft:#6B6560;
    --ai:#22456E; --ai-deep:#18324F; --ai-mid:#7E97B8; --ai-pale:#DCE4EF;
    --shu:#C73E3A; --shu-soft:#F6E3E1;
    --matsu:#3F7A54; --matsu-soft:#E2F0E6;
    --line:#E4DCCB; --gold:#B98B2F; --gold-soft:#F5EBD6;
    --warn-bg:#FBEFE0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    background:var(--paper);
    background-image:radial-gradient(rgba(185,139,47,.05) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink); min-height:100vh;
  }
  .mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;}
  ruby rt{font-size:.55em;color:var(--shu);font-weight:400;}

  header{
    background:linear-gradient(135deg,var(--ai-deep),var(--ai));
    color:#F5EFE2; padding:12px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 2px 8px rgba(24,50,79,.25);
    position:sticky; top:0; z-index:20;
  }
  .seal{
    width:40px;height:40px;flex:0 0 40px;background:var(--shu);color:#FFF7EE;border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:.78rem;line-height:1.05;text-align:center;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;letter-spacing:1px;
    box-shadow:inset 0 0 0 2px rgba(255,247,238,.55);
  }
  header h1{font-size:1.1rem;letter-spacing:.12em;font-weight:700;}
  header .sub{font-size:.68rem;opacity:.75;letter-spacing:.06em;margin-top:2px;}
  #userChip{
    margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
    color:#F5EFE2;border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer;font-family:inherit;
  }

  main{max-width:680px;margin:0 auto;padding:16px 14px 70px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(43,43,51,.06);
  }
  .card h2{
    font-size:.85rem;color:var(--ai);letter-spacing:.18em;border-left:4px solid var(--shu);
    padding-left:10px;margin-bottom:12px;font-weight:700;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .card h2 .h2note{font-size:.7rem;color:var(--ink-soft);letter-spacing:0;font-weight:400;}

  /* アカウント */
  .userRow{display:flex;flex-wrap:wrap;gap:10px;}
  .userBtn{
    border:1.5px solid var(--line);background:#fff;border-radius:12px;
    padding:11px 18px;font-size:1rem;cursor:pointer;font-family:inherit;
  }
  .userBtn.selected{border-color:var(--ai);background:var(--ai);color:#fff;}
  .userAddRow{display:flex;gap:8px;margin-top:10px;}
  .userAddRow input{
    flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:1rem;font-family:inherit;background:#fff;min-width:0;
  }
  .userAddRow button{
    border:none;background:var(--ai);color:#fff;border-radius:10px;padding:0 18px;
    font-size:.9rem;cursor:pointer;font-family:inherit;
  }

  /* 選択肢ボタン群 */
  .optGrid{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:9px 16px;font-size:.92rem;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .opt.selected{border-color:var(--shu);background:var(--shu);color:#fff;}
  .opt small{opacity:.75;font-size:.72rem;margin-left:4px;}

  /* 習得バー */
  .mbarWrap{margin-bottom:10px;}
  .mbarWrap:last-child{margin-bottom:0;}
  .mbarLabel{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px;}
  .mbarLabel b{color:var(--ai);}
  .mbar{height:14px;border-radius:99px;background:var(--ai-pale);overflow:hidden;display:flex;}
  .mbar .seg-m{background:var(--ai);height:100%;}
  .mbar .seg-p{background:var(--ai-mid);height:100%;}
  .mbarTotal .mbar{height:18px;}
  .legendRow{display:flex;gap:14px;font-size:.7rem;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap;}
  .legendRow i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}

  /* ランキング */
  .rankItem{
    display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding:9px 2px;
  }
  .rankItem:first-of-type{border-top:none;}
  .rankNo{flex:0 0 26px;height:26px;border-radius:50%;background:var(--shu);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;}
  .rankNo.low{background:var(--gold);}
  .rankW{font-weight:700;}
  .rankMiss{margin-left:auto;font-size:.78rem;color:var(--shu);white-space:nowrap;}

  .bigStart{
    display:block;width:100%;background:linear-gradient(135deg,var(--shu),#A93330);
    color:#fff;border:none;border-radius:14px;padding:16px;font-size:1.15rem;
    letter-spacing:.25em;font-weight:700;cursor:pointer;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    box-shadow:0 3px 10px rgba(199,62,58,.35);
  }
  .bigStart:disabled{opacity:.4;box-shadow:none;cursor:default;}
  .footNav{display:flex;gap:10px;margin-top:14px;}
  .footNav button{
    flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:12px;font-size:.88rem;cursor:pointer;font-family:inherit;color:var(--ink);
  }

  /* クイズ画面 */
  .quizTop{position:sticky;top:64px;z-index:10;background:var(--paper);padding:4px 0 8px;}
  .qtRow1{display:flex;align-items:center;gap:10px;}
  .qCount{font-size:.85rem;color:var(--ink-soft);white-space:nowrap;font-weight:700;}
  .bar{flex:1;height:8px;background:#EDE6D6;border-radius:99px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ai),var(--shu));width:0%;transition:width .3s;}
  #quitBtn{border:none;background:none;color:var(--ink-soft);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit;}
  .qtRow2{display:flex;gap:12px;font-size:.76rem;color:var(--ink-soft);margin-top:5px;flex-wrap:wrap;align-items:center;}
  .qtRow2 .ok{color:var(--matsu);font-weight:700;}
  .qtRow2 .ng{color:var(--shu);font-weight:700;}
  .gauge{letter-spacing:2px;font-size:.85rem;}
  .gauge .on{color:var(--gold);}
  .gauge .off{color:#D8CFBB;}
  .notice{
    background:var(--warn-bg);border:1px solid #E8D3B0;border-radius:10px;
    font-size:.78rem;color:#7A5A22;padding:8px 12px;margin-top:8px;
  }

  .qCard{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px 18px 20px;text-align:center;position:relative;margin-bottom:14px;
    box-shadow:0 2px 6px rgba(43,43,51,.07);
  }
  .qLevelSeal{
    position:absolute;top:12px;right:12px;background:var(--shu);color:#fff;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:.72rem;
    padding:5px 7px;border-radius:5px;letter-spacing:.1em;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);
  }
  .fmtTag{
    position:absolute;top:12px;left:12px;font-size:.68rem;border-radius:5px;padding:4px 8px;
    background:var(--ai-pale);color:var(--ai);font-weight:700;letter-spacing:.05em;
  }
  .qLabel{font-size:.78rem;color:var(--ink-soft);letter-spacing:.2em;margin-bottom:12px;}
  .qWord{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:1.85rem;font-weight:700;line-height:1.6;letter-spacing:.04em;
  }
  .qWord.small{font-size:1.3rem;}
  .qMeaning{font-size:1.03rem;line-height:1.8;text-align:left;}
  .retryTag{display:inline-block;background:var(--gold);color:#fff;font-size:.7rem;border-radius:99px;padding:3px 10px;margin-bottom:10px;letter-spacing:.1em;}
  .reviewTag{display:inline-block;background:var(--ai);color:#fff;font-size:.7rem;border-radius:99px;padding:3px 10px;margin-bottom:10px;letter-spacing:.1em;}

  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;text-align:left;font-size:.97rem;line-height:1.65;
    cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;gap:10px;align-items:flex-start;
  }
  .choice .mk{
    flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);color:var(--ink-soft);
    font-size:.75rem;display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .choice:not(:disabled):hover{border-color:var(--ai);}
  .choice:disabled{cursor:default;opacity:.55;}
  .choice.correct{border-color:var(--matsu);background:var(--matsu-soft);opacity:1;}
  .choice.correct .mk{border-color:var(--matsu);background:var(--matsu);color:#fff;}
  .choice.wrong{border-color:var(--shu);background:var(--shu-soft);opacity:1;}
  .choice.wrong .mk{border-color:var(--shu);background:var(--shu);color:#fff;}
  .choice.chosen{box-shadow:0 0 0 2px var(--gold) inset;}

  .feedback{display:none;margin-top:14px;border-radius:14px;padding:16px;text-align:left;}
  .feedback.show{display:block;animation:fade .25s ease;}
  .feedback.ok{background:var(--matsu-soft);border:1px solid #BCD9C5;}
  .feedback.ng{background:var(--shu-soft);border:1px solid #E8C2C0;}
  .feedback.neutral{background:var(--ai-pale);border:1px solid #C4D0E2;}
  .fbHead{font-weight:700;font-size:1.05rem;margin-bottom:8px;}
  .feedback.ok .fbHead{color:var(--matsu);}
  .feedback.ng .fbHead{color:var(--shu);}
  .feedback.neutral .fbHead{color:var(--ai);}
  .fbWord{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:1.25rem;font-weight:700;}
  .fbReading{font-size:.82rem;color:var(--shu);margin:2px 0 8px;}
  .fbMeaning{font-size:.92rem;line-height:1.8;}
  .fbNote{font-size:.78rem;color:var(--ink-soft);margin-top:8px;}
  .nextBtn{
    display:block;width:100%;margin-top:12px;background:var(--ai);color:#fff;border:none;
    border-radius:12px;padding:13px;font-size:1rem;letter-spacing:.2em;cursor:pointer;font-family:inherit;
  }
  .navRow{display:flex;gap:10px;margin-top:12px;}
  .navRow button{
    flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:11px;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .navRow button:disabled{opacity:.35;cursor:default;}
  .reanswerBtn{border-color:var(--gold)!important;color:var(--gold)!important;font-weight:700;}

  /* 結果 */
  .resultHero{text-align:center;padding:24px 16px;}
  .resultHero .grade{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:2.3rem;font-weight:700;color:var(--shu);letter-spacing:.1em;}
  .sumGrid{display:flex;justify-content:center;gap:18px;margin-top:14px;flex-wrap:wrap;}
  .sumItem{text-align:center;}
  .sumItem .v{font-size:1.5rem;font-weight:700;color:var(--ai);}
  .sumItem .k{font-size:.72rem;color:var(--ink-soft);}
  .masterNote{font-size:.85rem;color:var(--gold);margin-top:12px;font-weight:700;line-height:1.7;}

  .wrongItem{border-top:1px dashed var(--line);padding:12px 2px;}
  .wrongItem:first-of-type{border-top:none;}
  .wrongItem .w{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:1.05rem;}
  .wrongItem .r{font-size:.78rem;color:var(--shu);margin:2px 0 4px;}
  .wrongItem .m{font-size:.88rem;color:var(--ink-soft);line-height:1.7;}
  .wrongItem .ans{font-size:.82rem;margin-top:4px;line-height:1.7;}
  .wrongItem .ans b{color:var(--shu);}
  .fmtBadge{display:inline-block;font-size:.66rem;border-radius:4px;padding:2px 6px;background:var(--ai-pale);color:var(--ai);font-weight:700;margin-right:6px;}

  /* 全問一覧 */
  .listTools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .listTools select{
    border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font-size:.85rem;
    font-family:inherit;background:#fff;color:var(--ink);
  }
  .kpRow{border-top:1px dashed var(--line);padding:10px 2px;}
  .kpRow:first-child{border-top:none;}
  .kpRow.alert{background:var(--shu-soft);border-radius:8px;padding:10px 8px;border-top-color:transparent;}
  .kpHead{display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
  .lvTag{flex:0 0 auto;font-size:.68rem;border-radius:5px;padding:3px 6px;margin-top:3px;background:var(--ai);color:#fff;font-family:"Hiragino Mincho ProN",serif;}
  .lvTag.B{background:var(--gold);}
  .lvTag.C{background:#6E5B8E;}
  .kpBody{flex:1;min-width:0;}
  .kpWord{font-weight:700;}
  .kpReading{font-size:.73rem;color:var(--shu);}
  .kpState{font-size:.72rem;margin-top:2px;color:var(--ink-soft);}
  .stBadge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.7rem;margin-right:6px;}
  .stBadge.mastered{background:var(--ai);color:#fff;}
  .stBadge.progress{background:var(--ai-pale);color:var(--ai);}
  .stBadge.wrong{background:var(--shu);color:#fff;}
  .stBadge.unseen{background:#EEE8DA;color:var(--ink-soft);}
  .missBadge{display:inline-block;background:#fff;border:1.5px solid var(--shu);color:var(--shu);border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:700;}
  .kpDetail{display:none;font-size:.8rem;color:var(--ink-soft);line-height:1.8;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .kpRow.open .kpDetail{display:block;}
  .csvBtn{
    display:block;width:100%;margin-top:12px;background:var(--matsu);color:#fff;border:none;
    border-radius:12px;padding:13px;font-size:.95rem;cursor:pointer;font-family:inherit;letter-spacing:.1em;
  }
  .rowBtns{display:flex;gap:10px;margin-top:4px;}
  .rowBtns button{flex:1;border-radius:12px;padding:13px;font-size:.95rem;cursor:pointer;font-family:inherit;}
  .btnGhost{background:#fff;border:1.5px solid var(--ai);color:var(--ai);}
  .btnFill{background:var(--shu);border:none;color:#fff;}

  /* 設定 */
  .setRow{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding:11px 2px;flex-wrap:wrap;}
  .setRow:first-of-type{border-top:none;}
  .setRow .nm{font-weight:700;}
  .setRow button{
    border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;
    font-size:.8rem;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .setRow button.danger{border-color:var(--shu);color:var(--shu);}

  /* 記録データの管理・同期 */
  .syncStatus{font-size:.78rem;border-radius:8px;padding:8px 12px;margin-bottom:10px;line-height:1.6;background:#EEE8DA;color:var(--ink-soft);}
  .syncStatus.ok{background:var(--matsu-soft);color:var(--matsu);border:1px solid #BCD9C5;}
  .syncStatus.err{background:var(--shu-soft);color:var(--shu);border:1px solid #E8C2C0;}
  .syncStatus.busy{background:var(--ai-pale);color:var(--ai);}
  .dataBtns{display:flex;flex-wrap:wrap;gap:8px;}
  .dataBtns button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:.82rem;cursor:pointer;font-family:inherit;color:var(--ink);}
  #storageWarn{background:#FBEFE0;border-bottom:1px solid #E8D3B0;color:#7A5A22;font-size:.78rem;padding:8px 14px;line-height:1.6;}

  /* モーダル */
  #modalBack{
    display:none;position:fixed;inset:0;background:rgba(43,43,51,.5);z-index:50;
    align-items:center;justify-content:center;padding:20px;
  }
  #modalBack.show{display:flex;}
  .modal{
    background:var(--card);border-radius:16px;padding:22px;max-width:420px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .modal .mTitle{font-weight:700;font-size:1.02rem;margin-bottom:10px;color:var(--ai);}
  .modal .mBody{font-size:.9rem;line-height:1.8;margin-bottom:16px;}
  .modal input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:1rem;font-family:inherit;margin-bottom:16px;
  }
  .modal .mBtns{display:flex;gap:10px;}
  .modal .mBtns button{flex:1;border-radius:10px;padding:12px;font-size:.92rem;cursor:pointer;font-family:inherit;}
  .mCancel{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .mOk{background:var(--shu);border:none;color:#fff;}

  /* 覚えるモード（フラッシュカード） */
  .learnTop{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .learnTop .stat{font-size:.82rem;color:var(--ink-soft);white-space:nowrap;}
  .learnTop .stat b{color:var(--matsu);}
  .learnCard{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:34px 20px 26px;text-align:center;position:relative;margin-bottom:14px;
    box-shadow:0 2px 8px rgba(43,43,51,.08);min-height:230px;cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;gap:14px;
  }
  .learnCard .lw{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:1.9rem;font-weight:700;line-height:1.6;letter-spacing:.04em;
  }
  .learnCard .lw.small{font-size:1.35rem;}
  .learnCard .lm{
    font-size:1rem;line-height:1.9;text-align:left;
    border-top:1px dashed var(--line);padding-top:14px;
  }
  .learnCard .hint{font-size:.75rem;color:var(--ink-soft);letter-spacing:.1em;}
  .learnCard .againTag{position:absolute;top:12px;left:12px;background:var(--gold);color:#fff;font-size:.7rem;border-radius:99px;padding:3px 10px;letter-spacing:.1em;}
  .learnBtns{display:flex;gap:10px;}
  .learnBtns button{
    flex:1;border:none;border-radius:14px;padding:15px 8px;font-size:1rem;
    cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.08em;
  }
  .learnBtns .lbShow{background:var(--ai);color:#fff;letter-spacing:.2em;}
  .learnBtns .lbGot{background:var(--matsu);color:#fff;}
  .learnBtns .lbAgain{background:#fff;border:2px solid var(--gold);color:var(--gold);}
  .learnDone{text-align:center;padding:30px 16px;}
  .learnDone .big{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:2rem;font-weight:700;color:var(--matsu);letter-spacing:.1em;}
  .learnDone .sub{font-size:.9rem;color:var(--ink-soft);margin-top:10px;line-height:1.9;}
  .learnBar{flex:1;height:8px;background:#EDE6D6;border-radius:99px;overflow:hidden;}
  .learnBar i{display:block;height:100%;background:linear-gradient(90deg,var(--matsu),var(--gold));width:0%;transition:width .3s;}

  button:focus-visible,.opt:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
</style>
</head>
<body>
<header>
  <div class="seal">故事<br>成語</div>
  <div>
    <h1 class="mincho">故事成語クイズ</h1>
    <div class="sub">中学受験・語句の知識（全65語）v2</div>
  </div>
  <button id="userChip">👤 ─</button>
</header>
<div id="storageWarn" style="display:none;"></div>

<main>
  <!-- ホーム -->
  <section id="scrHome" class="screen active">
    <div class="card">
      <h2>だれが挑戦する？</h2>
      <div class="userRow" id="userRow"></div>
      <div class="userAddRow">
        <input id="newUserName" type="text" maxlength="8" placeholder="なまえを追加（例：たろう）">
        <button id="addUserBtn">追加</button>
      </div>
    </div>

    <div class="card">
      <h2>習得状況 <span class="h2note" id="statOwner"></span></h2>
      <div id="masteryBars"></div>
      <div class="legendRow">
        <span><i style="background:var(--ai)"></i>習得済み</span>
        <span><i style="background:var(--ai-mid)"></i>学習中（正解あり）</span>
        <span><i style="background:var(--ai-pale)"></i>未着手・誤答</span>
      </div>
    </div>

    <div class="card" id="rankCard">

    byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}},
    wrongLog:[],lastSeenAt:null};
}
function defaultDb(){
  return {app:APP_KEY,version:SCHEMA_VERSION,updatedAt:null,activeAccountId:null,accounts:[],progress:{}};
}
/* スキーマの補正（pull・インポート・起動時に通す） */
function normalizeDb(d){
  if(!d||typeof d!=="object")d={};
  d.app=APP_KEY;
  d.version=d.version||SCHEMA_VERSION;
  if(!("updatedAt" in d))d.updatedAt=null;
  if(!("activeAccountId" in d))d.activeAccountId=null;
  if(!Array.isArray(d.accounts))d.accounts=[];
  if(!d.progress||typeof d.progress!=="object")d.progress={};
  d.accounts.forEach(a=>{
    if(!d.progress[a.id])d.progress[a.id]={items:{},sessions:[]};
    const p=d.progress[a.id];
    if(!p.items||typeof p.items!=="object")p.items={};
    if(!Array.isArray(p.sessions))p.sessions=[];
    Object.keys(p.items).forEach(k=>{
      const it=Object.assign(newItemState(),p.items[k]);
      if(!it.byFormat)it.byFormat={A:{correct:0,wrong:0},B:{correct:0,wrong:0}};
      if(!it.byFormat.A)it.byFormat.A={correct:0,wrong:0};
      if(!it.byFormat.B)it.byFormat.B={correct:0,wrong:0};
      if(!Array.isArray(it.wrongLog))it.wrongLog=[];
      p.items[k]=it;
    });
  });
  return d;
}
function loadDb(){
  let db=null;
  try{const raw=store.getItem(APP_KEY); if(raw)db=JSON.parse(raw);}catch(e){}
  if(!db){
    db=defaultDb();
    migrateV1(db);           // 旧版（v1）からの移行
  }
  return normalizeDb(db);
}
/* 追補v1.1§2：保存のたびに updatedAt を設定。
   クラウドから取り込んだデータの保存時は fromCloud=true で上書きしない */
function saveDb(fromCloud){
  if(!fromCloud)DB.updatedAt=new Date().toISOString();
  try{store.setItem(APP_KEY,JSON.stringify(DB));}catch(e){}
}

/* 旧版（ksg_users / ksg_prog_◯◯）からの移行 */
function migrateV1(db){
  try{
    const users=JSON.parse(store.getItem("ksg_users")||"null");
    if(!Array.isArray(users)||users.length===0)return;
    users.forEach((name,i)=>{
      const id="acc_"+String(i+1).padStart(3,"0");
      db.accounts.push({id,name,createdAt:nowIso()});
      const items={};
      const old=JSON.parse(store.getItem("ksg_prog_"+name)||"{}");
      Object.keys(old).forEach(kpId=>{
        if(!KP_BY_ID[kpId])return;
        const o=old[kpId], it=newItemState();
        it.totalCorrect=o.c||0; it.totalWrong=o.w||0;
        it.byFormat.A={correct:o.c||0,wrong:o.w||0};
        // 旧版は形式の概念がないため streak は引き継がない（新基準で習得し直す）
        items[kpId]=it;
      });
      db.progress[id]={items,sessions:[]};
    });
    const cur=JSON.parse(store.getItem("ksg_current")||"null");
    const found=db.accounts.find(a=>a.name===cur);
    db.activeAccountId=found?found.id:db.accounts[0].id;
  }catch(e){}
}

/* ================= グローバル状態 ================= */
let DB=loadDb();
saveDb();   // 移行結果を新スキーマで確定保存
let mode="10q", range="ALL";
let SESS=null;    // 実行中セッション
let CUR=null;     // 現在の出題 {kp,format,choices,retry}
let VIEW=null;    // レビュー閲覧中の history index（null=通常）
let lastResult=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rubyHtml=(kp,rt=true)=>rt?`<ruby>${esc(kp.w)}<rt>${esc(kp.r)}</rt></ruby>`:esc(kp.w);
const deepCopy=o=>JSON.parse(JSON.stringify(o));

function activeAcc(){ return DB.accounts.find(a=>a.id===DB.activeAccountId)||null; }
function accItems(){
  const acc=activeAcc(); if(!acc)return {};
  if(!DB.progress[acc.id])DB.progress[acc.id]={items:{},sessions:[]};
  return DB.progress[acc.id].items;
}
function getItem(items,kpId){ if(!items[kpId])items[kpId]=newItemState(); return items[kpId]; }
function poolByRange(rg){ return rg==="ALL"?DATA:DATA.filter(d=>d.lv===rg); }

/* ================= モーダル ================= */
let modalCb=null;
function showModal(title,body,{input=null,okLabel="OK",danger=true}={}){
  return new Promise(res=>{
    $("mTitle").textContent=title;
    $("mBody").innerHTML=body;

$("mOk").onclick=()=>modalCb&&modalCb(true);
$("mCancel").onclick=()=>modalCb&&modalCb(false);

/* ================= 習得判定（§3）：異なる形式で MASTERY_STREAK 連続正解 ================= */
function applyAnswer(item,format,ok,chosenKp){
  const t=nowIso();
  item.lastFormat=format; item.lastSeenAt=t;
  if(ok){
    item.totalCorrect++; item.byFormat[format].correct++;
    if(item.streak===0){ item.streak=1; item.streakFormat=format; }
    else if(item.streakFormat!==format){ item.streak++; item.streakFormat=format; }
    /* 同じ形式の連続正解ではカウントを進めない（§3） */
    if(!item.mastered && item.streak>=MASTERY_STREAK){ item.mastered=true; item.masteredAt=t; }
  }else{
    item.totalWrong++; item.byFormat[format].wrong++;
    item.streak=0; item.streakFormat=null;
    item.mastered=false; item.masteredAt=null;   // 誤答で習得解除（§3）
    item.wrongLog.push({at:t,format,answered:chosenKp?chosenKp.w:""});
    if(item.wrongLog.length>WRONGLOG_MAX)item.wrongLog.splice(0,item.wrongLog.length-WRONGLOG_MAX);
  }
}

/* ================= KP選択の優先順位（§2-1） ================= */
function selectKPs(pool,items,n){
  const cands=pool.filter(kp=>!getItem(items,kp.id).mastered);
  const scored=shuffle(cands).map(kp=>{
    const it=items[kp.id];
    return {kp,wrong:it.totalWrong,unseen:it.lastSeenAt?1:0,seenAt:it.lastSeenAt||""};
  });
  scored.sort((a,b)=>{
    if(b.wrong!==a.wrong)return b.wrong-a.wrong;        // 1. 誤答が多い
    if(a.unseen!==b.unseen)return a.unseen-b.unseen;    // 2. 未出題
    return a.seenAt<b.seenAt?-1:a.seenAt>b.seenAt?1:0;  // 3. 出題が古い
  });
  return scored.slice(0,n).map(s=>s.kp);
}

/* ================= セッション生成 ================= */
function buildNormalQueue(kps){
  // 各KPに形式A・Bの2問。単純シャッフル後、同一KPの隣接をほどく
  let q=[]; kps.forEach(kp=>{q.push({kp,format:"A",retry:false});q.push({kp,format:"B",retry:false});});
  q=shuffle(q);
  for(let i=1;i<q.length;i++){
    if(q[i].kp.id===q[i-1].kp.id){
      const j=q.findIndex((e,k)=>k>i&&e.kp.id!==q[i-1].kp.id);
      if(j>0){const t=q[i];q[i]=q[j];q[j]=t;}
    }
  }
  return q;
}
function startSession(opts){
  // opts: {mode, kps? (復習用の明示指定)}
  const acc=activeAcc(); if(!acc)return;
  const items=deepCopy(accItems());        // 一時領域（§5-2）。終了時にのみ永続化
  DATA.forEach(d=>getItem(items,d.id));
  const pool=poolByRange(range);
  let queue=[], notice="";
  const md=opts.mode;

  if(md==="all"){
    // 全問モード（§2-2）：習得済み込み全KP・1KP1問・前回と異なる形式
    queue=shuffle(pool).map(kp=>{
      const lf=items[kp.id].lastFormat;
      const format=lf?(lf==="A"?"B":"A"):(Math.random()<.5?"A":"B");
      return {kp,format,retry:false};
    });
  }else{
    let kps;
    if(opts.kps){ kps=opts.kps.filter(kp=>pool.includes(kp)||true); }
    else{
      const want=md==="20q"?20:10;
      kps=selectKPs(pool,items,want);
      if(kps.length===0){
        showModal("出題できません","この範囲のすべての語が習得済みです。🎉<br>「全問モード」で実力確認をするか、範囲を変えてください。",{okLabel:"OK",danger:false});
        return;
      }
      if(kps.length<want)notice=`未習得が${kps.length}語のため、${kps.length}語（${kps.length*2}問）で出題します`;
    }
    queue=buildNormalQueue(kps);
  }

  SESS={
    mode:md, items, queue, history:[],
    reinsertCount:{}, needReview:new Set(),
    kpIds:[...new Set(queue.map(e=>e.kp.id))],
    startedAt:nowIso(), notice, custom:!!opts.kps
  };
  VIEW=null; CUR=null;
  nextQuestion();
  showScreen("scrQuiz");
}

/* ================= 出題・解答（§4 復習キュー） ================= */
function makeChoices(kp){
  const same=DATA.filter(d=>d.id!==kp.id&&d.lv===kp.lv);
  const other=DATA.filter(d=>d.id!==kp.id&&d.lv!==kp.lv);
  const picks=shuffle(same).slice(0,3);
  const extra=shuffle(other); let i=0;
  while(picks.length<3&&i<extra.length){picks.push(extra[i]);i++;}
  return shuffle([kp,...picks]);
}
function nextQuestion(){
  // 習得済みKPの残問をスキップ（10/20問モードのみ・§3）
  if(SESS.mode!=="all"){
    while(SESS.queue.length&&SESS.items[SESS.queue[0].kp.id].mastered)SESS.queue.shift();
  }
  if(SESS.queue.length===0){finishSession();return;}
  const e=SESS.queue.shift();
  CUR={kp:e.kp,format:e.format,retry:e.retry,choices:makeChoices(e.kp)};
  VIEW=null;
  renderQuestion();
}
function postAnswerQueue(kp,format,ok){
  // 戻り値：undo用のアクション記録
  if(SESS.mode==="all")return null;                      // 全問モードは再投入なし（§2-2）
  const it=SESS.items[kp.id];
  if(it.mastered)return null;                            // 習得達成→再投入しない（§4）
  const otherFormat=format==="A"?"B":"A";
  const cnt=SESS.reinsertCount[kp.id]||0;
  const pendIdx=SESS.queue.findIndex(x=>x.kp.id===kp.id);

  if(!ok){
    if(cnt>=REQUEUE_LIMIT){SESS.needReview.add(kp.id);return {type:"limit"};}
    SESS.reinsertCount[kp.id]=cnt+1;
    const pos=Math.min(REQUEUE_WRONG,SESS.queue.length);
    if(pendIdx>=0){
      // 既に同KPの問題が控えている場合は3問後へ引き上げる
      const entry=SESS.queue.splice(pendIdx,1)[0];
      entry.retry=true;
      const p2=Math.min(REQUEUE_WRONG,SESS.queue.length);
      SESS.queue.splice(p2,0,entry);
      return {type:"move",entry,from:pendIdx};
    }
    const entry={kp,format:otherFormat,retry:true};      // 直前と異なる形式（§4）
    SESS.queue.splice(pos,0,entry);
    return {type:"insert",entry};
  }
  // 正解したが未習得（§4）：6問後に再出題（同KPが既に控えていれば追加しない）
  if(pendIdx>=0)return null;
  if(cnt>=REQUEUE_LIMIT){SESS.needReview.add(kp.id);return {type:"limit"};}
  SESS.reinsertCount[kp.id]=cnt+1;
  const entry={kp,format:otherFormat,retry:true};
  const pos=Math.min(REQUEUE_CORRECT,SESS.queue.length);
  SESS.queue.splice(pos,0,entry);
  return {type:"insert",entry};
}
function answer(chosen){
  if(!CUR||VIEW!==null)return;
  const {kp,format}=CUR;
  const it=SESS.items[kp.id];
  const rec={
    kpId:kp.id,format,retry:CUR.retry,
    choiceIds:CUR.choices.map(c=>c.id),
    chosenId:chosen.id, ok:chosen.id===kp.id,
    prevItem:deepCopy(it),
    prevReinsert:Object.assign({},SESS.reinsertCount),
    prevNeedReview:[...SESS.needReview],
    wasMasteredBefore:it.mastered
  };
  applyAnswer(it,format,rec.ok,rec.ok?null:chosen);
  rec.action=postAnswerQueue(kp,format,rec.ok);
  rec.nowMastered=it.mastered;
  SESS.history.push(rec);
  renderAnswered(rec,true);
}
/* 直前1問の再解答（§5-1）：効果を巻き戻して同じ問題を再提示 */
function undoLastAndReask(){
  const rec=SESS.history.pop();
  if(!rec)return;
  SESS.items[rec.kpId]=deepCopy(rec.prevItem);
  SESS.reinsertCount=Object.assign({},rec.prevReinsert);
  SESS.needReview=new Set(rec.prevNeedReview);
  if(rec.action){
    if(rec.action.type==="insert"){
      const i=SESS.queue.indexOf(rec.action.entry);
      if(i>=0)SESS.queue.splice(i,1);
    }else if(rec.action.type==="move"){
      const i=SESS.queue.indexOf(rec.action.entry);
      if(i>=0){
        const entry=SESS.queue.splice(i,1)[0];
        entry.retry=false;
        SESS.queue.splice(Math.min(rec.action.from,SESS.queue.length),0,entry);
      }
    }
  }
  CUR={kp:KP_BY_ID[rec.kpId],format:rec.format,retry:rec.retry,
       choices:rec.choiceIds.map(id=>KP_BY_ID[id])};
  VIEW=null;
  renderQuestion();
}

/* ================= セッション終了（§5-2：ここで一括永続化） ================= */
function finishSession(){
  const acc=activeAcc();
  const correct=SESS.history.filter(h=>h.ok).length;
  const wrong=SESS.history.length-correct;
  const before=accItems();
  const newly=[];
  Object.keys(SESS.items).forEach(id=>{
    const wasM=before[id]&&before[id].mastered;
    if(!wasM&&SESS.items[id].mastered)newly.push(id);
  });
  const sessionWrongCount={};
  SESS.history.filter(h=>!h.ok).forEach(h=>{sessionWrongCount[h.kpId]=(sessionWrongCount[h.kpId]||0)+1;});
  // 永続化
  DB.progress[acc.id].items=SESS.items;
  const totalMastered=Object.values(SESS.items).filter(it=>it.mastered).length;
  const sessList=DB.progress[acc.id].sessions;
  sessList.push({
    startedAt:SESS.startedAt,finishedAt:nowIso(),mode:MODE_LABEL[SESS.mode]||SESS.mode,
    correct,wrong,newlyMastered:newly,
    wrongKpIds:[...new Set(SESS.history.filter(h=>!h.ok).map(h=>h.kpId))],
    totalMastered,sessionWrongCount
  });
  if(sessList.length>SESSIONS_MAX)sessList.splice(0,sessList.length-SESSIONS_MAX);
  saveDb();
  pushDb();   // セッション終了直後の自動push（追補v1.1§5）
  lastResult={
    mode:SESS.mode,correct,wrong,newly,
    wrongRecords:SESS.history.filter(h=>!h.ok),
    needReview:[...SESS.needReview],
    kpIds:SESS.kpIds
  };
  SESS=null;CUR=null;VIEW=null;
  renderResult();
  showScreen("scrResult");
}
async function quitSession(){
  const ok=await showModal("やめますか？","途中でやめると、このセッションの結果は<b>記録されません</b>。<br>（習得状況も更新されません）",{okLabel:"やめる"});
  if(ok){SESS=null;CUR=null;VIEW=null;goHome();}
}

/* ================= クイズ描画 ================= */
function sessTotals(){
  const answered=SESS.history.length;
  const total=answered+ (CUR?1:0) + SESS.queue.length;
  const correct=SESS.history.filter(h=>h.ok).length;
  return {answered,total,correct,wrong:answered-correct};
}
function kpLeftCount(){
  const ids=new Set(SESS.queue.map(e=>e.kp.id));
  if(CUR)ids.add(CUR.kp.id);
  if(SESS.mode!=="all"){
    // 習得済みはスキップされるため除外
    [...ids].forEach(id=>{if(SESS.items[id].mastered)ids.delete(id);});
  }
  return ids.size;
}
function renderTop(reviewing){
  const t=sessTotals();
  $("qCount").textContent=reviewing?`${VIEW+1} / ${t.answered}問目を確認中`:`${t.answered+1}問目 / 全${t.total}問`;
  $("barFill").style.width=(t.answered/Math.max(t.total,1)*100)+"%";
  $("kpLeft").textContent=`あと${kpLeftCount()}語`;
  $("okCount").textContent=`正解 ${t.correct}`;
  $("ngCount").textContent=`誤答 ${t.wrong}`;
  const kp=reviewing?KP_BY_ID[SESS.history[VIEW].kpId]:CUR.kp;
  const it=SESS.items[kp.id];
  let g="習得 ";
  for(let i=0;i<MASTERY_STREAK;i++)g+=(i<it.streak?'<span class="on">●</span>':'<span class="off">○</span>');
  $("gauge").innerHTML=SESS.mode==="all"?"":g;
  const n=$("quizNotice");
  if(SESS.notice&&SESS.history.length===0){n.style.display="block";n.textContent=SESS.notice;}
  else n.style.display="none";
}
function renderChoiceButtons(kp,format,choices,{disabled=false,chosenId=null}={}){
  const marks=["ア","イ","ウ","エ"];
  const box=$("choices");box.innerHTML="";
  choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="choice";b.dataset.cid=c.id;b.disabled=disabled;
    const inner=format==="A"?esc(c.m):`<span class="mincho" style="font-weight:700;">${rubyHtml(c)}</span>`;
    b.innerHTML=`<span class="mk">${marks[i]}</span><span>${inner}</span>`;
    if(disabled){
      if(c.id===kp.id)b.classList.add("correct");
      if(chosenId&&c.id===chosenId){b.classList.add("chosen");if(c.id!==kp.id)b.classList.add("wrong");}
    }else b.onclick=()=>answer(c);
    box.appendChild(b);
  });
}
function renderQuestionCard(kp,format,tagHtml){
  $("qSeal").textContent=kp.lv==="C"?"他":kp.lv;
  $("fmtTag").textContent="形式"+format+"｜"+FMT_NAME[format];

  }else{
    $("qLabel").textContent="この意味に合う故事成語は？";

}
function renderQuestion(){
  renderTop(false);
  renderQuestionCard(CUR.kp,CUR.format,CUR.retry?'<span class="retryTag">もう一度！</span>':"");
  renderChoiceButtons(CUR.kp,CUR.format,CUR.choices);
  $("feedback").className="feedback";
  updateNav();
}
function renderAnswered(rec,live){
  const kp=KP_BY_ID[rec.kpId];
  renderTop(!live);
  renderQuestionCard(kp,rec.format,
    (live?"":'<span class="reviewTag">レビュー表示</span>')+(rec.retry?'<span class="retryTag">再出題</span>':""));
  renderChoiceButtons(kp,rec.format,rec.choiceIds.map(id=>KP_BY_ID[id]),{disabled:true,chosenId:rec.chosenId});
  const fb=$("feedback"), it=SESS.items[kp.id];
  fb.className="feedback show "+(live?(rec.ok?"ok":"ng"):"neutral");
  $("fbHead").textContent=live?(rec.ok?"⭕ 正解！":"❌ ざんねん…"):(rec.ok?"⭕ この問題は正解でした":"❌ この問題は誤答でした");
  $("fbWord").textContent=kp.w;
  $("fbReading").textContent=kp.r;
  $("fbMeaning").textContent=kp.m;
  if(live){
    let note;
    if(rec.nowMastered&&!rec.wasMasteredBefore)note="⭐ 習得しました！（このセッションではもう出題されません）";
    else if(rec.ok)note=`連続正解 ${it.streak}/${MASTERY_STREAK}回（次は${FMT_NAME[rec.format==="A"?"B":"A"]}で正解すると習得）`;
    else if(rec.action&&rec.action.type==="limit")note="⚠️ 再出題の上限に達しました。結果画面で「要復習」になります";
    else note=SESS.mode==="all"?"全問モードでは再出題はありません":"3問後にもう一度出題されるよ";
    $("fbNote").textContent=note;
    $("nextBtn").style.display="block";
    $("nextBtn").focus();
  }else{
    $("fbNote").textContent="自分の解答：「"+esc(KP_BY_ID[rec.chosenId].w)+"」"+(rec.ok?"（正解）":"（誤答）");
    $("nextBtn").style.display="none";
  }
  updateNav();
}
function updateNav(){
  const h=SESS.history.length;
  const reviewing=VIEW!==null;
  $("backBtn").disabled=reviewing?VIEW<=0:h===0;
  $("fwdBtn").disabled=!reviewing;
  // 直前1問のみ再解答可（§5-1・要確認②既定案）
  const canRe=reviewing&&VIEW===h-1&&CUR!==null;
  $("reanswerBtn").style.display=canRe?"block":"none";
}
function goBack(){
  const h=SESS.history.length;
  if(VIEW===null){if(h===0)return;VIEW=h-1;}
  else if(VIEW>0)VIEW--;
  else return;
  renderAnswered(SESS.history[VIEW],false);
}
function goForward(){
  if(VIEW===null)return;
  if(VIEW<SESS.history.length-1){VIEW++;renderAnswered(SESS.history[VIEW],false);}
  else{VIEW=null;renderQuestion();}
}

function renderUsers(){
  const row=$("userRow");row.innerHTML="";
  if(DB.accounts.length===0){
    const p=document.createElement("div");
    p.style.cssText="font-size:.85rem;color:var(--ink-soft);";
    p.textContent="まず、なまえを追加してね";
    row.appendChild(p);
  }
  DB.accounts.forEach(a=>{
    const b=document.createElement("button");
    b.className="userBtn"+(a.id===DB.activeAccountId?" selected":"");
    b.textContent=a.name;
    b.onclick=()=>{DB.activeAccountId=a.id;saveDb();renderHome();};
    row.appendChild(b);
  });
  const acc=activeAcc();
  $("userChip").textContent="👤 "+(acc?acc.name:"─");
  $("startBtn").disabled=!acc;
}
function addUser(){
  const v=$("newUserName").value.trim();
  if(!v)return;
  if(DB.accounts.some(a=>a.name===v)){$("newUserName").value="";return;}
  const id="acc_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  DB.accounts.push({id,name:v,createdAt:nowIso()});
  DB.activeAccountId=id;
  DB.progress[id]={items:{},sessions:[]};
  saveDb();pushDb();$("newUserName").value="";renderHome();
}
function itemStateClass(it){
  if(!it)return "unseen";
  if(it.mastered)return "mastered";
  if(it.totalWrong>0&&it.streak===0)return "wrong";
  if(it.totalCorrect>0)return "progress";
  if(it.lastSeenAt)return "wrong";
  return "unseen";
}
function renderMasteryBars(){
  const items=accItems(), box=$("masteryBars");
  const acc=activeAcc();
  $("statOwner").textContent=acc?acc.name+"さんの記録":"";
  if(!acc){box.innerHTML='<div style="font-size:.85rem;color:var(--ink-soft);">アカウントを選ぶと表示されます</div>';return;}
  let html="";
  const seg=lvs=>{
    const list=DATA.filter(d=>lvs.includes(d.lv));
    const m=list.filter(d=>items[d.id]&&items[d.id].mastered).length;
    const p=list.filter(d=>{const it=items[d.id];return it&&!it.mastered&&it.totalCorrect>0;}).length;
    return {n:list.length,m,p};
  };
  ["A","B","C"].forEach(lv=>{
    const s=seg([lv]);
    html+=`<div class="mbarWrap"><div class="mbarLabel"><span>${LV_NAME[lv]}</span><b>習得 ${s.m} / ${s.n}（${Math.round(s.m/s.n*100)}%）</b></div>
      <div class="mbar"><span class="seg-m" style="width:${s.m/s.n*100}%"></span><span class="seg-p" style="width:${s.p/s.n*100}%"></span></div></div>`;
  });
  const s=seg(["A","B","C"]);
  html+=`<div class="mbarWrap mbarTotal" style="margin-top:14px;"><div class="mbarLabel"><span><b>総合習得率</b></span><b>${s.m} / ${s.n}（${Math.round(s.m/s.n*100)}%）</b></div>
    <div class="mbar"><span class="seg-m" style="width:${s.m/s.n*100}%"></span><span class="seg-p" style="width:${s.p/s.n*100}%"></span></div></div>`;
  box.innerHTML=html;
}
function wrongRanking(){
  const items=accItems();
  return DATA.map(kp=>({kp,it:items[kp.id]}))
    .filter(x=>x.it&&x.it.totalWrong>0)
    .sort((a,b)=>b.it.totalWrong-a.it.totalWrong);
}
function renderRanking(){
  const rank=wrongRanking().slice(0,10);
  const card=$("rankCard");
  if(!activeAcc()||rank.length===0){card.style.display="none";return;}
  card.style.display="block";
  $("rankList").innerHTML=rank.map((x,i)=>
    `<div class="rankItem"><span class="rankNo${i>=3?" low":""}">${i+1}</span>
     <div><div class="rankW mincho">${esc(x.kp.w)}</div><div style="font-size:.72rem;color:var(--shu);">${esc(x.kp.r)}</div></div>
     <span class="rankMiss">誤答${x.it.totalWrong}回${x.it.totalWrong>=2?" ⚠️":""}</span></div>`).join("");
}
function startRankReview(){
  const kps=wrongRanking().slice(0,10).map(x=>x.kp);
  if(kps.length===0)return;
  startSession({mode:mode==="all"?"10q":mode,kps});
}
function renderHome(){
  renderUsers();renderMasteryBars();renderRanking();

    mode==="all"?"全問モード：習得済みも含めて全語を1周し、実力を確認します（再出題なし）"
    :mode==="learn"?"覚えるモード：カードをめくって意味を確認するインプット用。「まだ」のカードは少しあとにもう一度出ます（記録には影響しません）"
    :"1語につき「成語→意味」「意味→成語」の2形式で出題。異なる形式で2連続正解すると習得です";
}

/* ================= 結果画面 ================= */
function stateLabel(it){
  const cls=itemStateClass(it);
  if(cls==="mastered")return '<span class="stBadge mastered">習得済み</span>';
  if(cls==="progress")return `<span class="stBadge progress">${it.totalCorrect}回正解</span>`;
  if(cls==="wrong")return '<span class="stBadge wrong">誤答あり</span>';
  return '<span class="stBadge unseen">未出題</span>';
}
function renderResult(){
  const r=lastResult;
  const total=r.correct+r.wrong;
  const rate=total?Math.round(r.correct/total*100):0;
  $("grade").textContent=rate===100?"満点！":rate>=80?"すばらしい！":rate>=60?"よくできました":"復習しよう";
  $("sumCorrect").textContent=r.correct;
  $("sumWrong").textContent=r.wrong;
  $("sumRate").textContent=rate+"%";
  $("sumMastered").textContent=r.newly.length;
  let mn=r.newly.length?("⭐ 新しく習得："+r.newly.map(id=>KP_BY_ID[id].w).join("・")):"";
  if(r.needReview.length)mn+=(mn?"<br>":"")+"⚠️ 要復習（再出題上限）："+r.needReview.map(id=>KP_BY_ID[id].w).join("・");
  $("masterNote").innerHTML=mn;

  const wl=$("wrongList");
  if(r.wrongRecords.length===0){
    wl.innerHTML='<div style="font-size:.9rem;color:var(--matsu);font-weight:700;">全問正解！まちがいなし 🎉</div>';
    $("retryWrongBtn").style.display="none";
  }else{
    $("retryWrongBtn").style.display="block";
    wl.innerHTML=r.wrongRecords.map(h=>{
      const kp=KP_BY_ID[h.kpId], ch=KP_BY_ID[h.chosenId];
      return `<div class="wrongItem"><div class="w">${esc(kp.w)}</div><div class="r">${esc(kp.r)}</div>
        <div class="ans"><span class="fmtBadge">形式${h.format}｜${FMT_NAME[h.format]}</span>
        自分の解答：<b>「${esc(ch.w)}」${h.format==="A"?"の意味":""}</b>　→　正解：「${esc(kp.w)}」</div>
        <div class="m">${esc(kp.m)}</div></div>`;
    }).join("");
  }
  renderAllKpList();
}
function renderAllKpList(){
  const items=accItems();
  const cat=$("fltCat").value, st=$("fltState").value, so=$("fltSort").value;
  let list=DATA.map(kp=>({kp,it:items[kp.id]||null}));
  if(cat!=="ALL")list=list.filter(x=>x.kp.lv===cat);
  if(st!=="ALL")list=list.filter(x=>itemStateClass(x.it)===st);
  if(so==="wrong")list.sort((a,b)=>((b.it?b.it.totalWrong:0)-(a.it?a.it.totalWrong:0)));
  else if(so==="unmastered")list.sort((a,b)=>((a.it&&a.it.mastered?1:0)-(b.it&&b.it.mastered?1:0)));
  $("allKpList").innerHTML=list.map(x=>{
    const it=x.it, tw=it?it.totalWrong:0;
    const alert=tw>=2;
    const wlog=it&&it.wrongLog.length?it.wrongLog.map(l=>`「${esc(l.answered)}」`).join("・"):"なし";
    const bf=it?`形式A（成語→意味）：正解${it.byFormat.A.correct}・誤答${it.byFormat.A.wrong}回<br>形式B（意味→成語）：正解${it.byFormat.B.correct}・誤答${it.byFormat.B.wrong}回`:"記録なし";
    return `<div class="kpRow${alert?" alert":""}" data-kp="${x.kp.id}">
      <div class="kpHead">
        <span class="lvTag ${x.kp.lv}">${x.kp.lv==="C"?"他":x.kp.lv}</span>
        <div class="kpBody">
          <div class="kpWord mincho">${esc(x.kp.w)}</div>
          <div class="kpReading">${esc(x.kp.r)}</div>
          <div class="kpState">${stateLabel(it)}${tw>0?`<span class="missBadge">誤答${tw}回${alert?"・⚠️2回以上ミス":""}</span>`:""}</div>
        </div>
        <span style="color:var(--ink-soft);font-size:.8rem;">▾</span>
      </div>
      <div class="kpDetail">${esc(x.kp.m)}<br><br><b>形式別内訳</b><br>${bf}<br><b>過去に取り違えた語</b>：${wlog}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("#allKpList .kpHead").forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle("open");
  });
}

/* ================= CSVダウンロード（§7-4） ================= */
function csvEscape(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function downloadCsv(){
  const acc=activeAcc(); if(!acc)return;
  const items=accItems();
  const rows=DATA.map(kp=>{
    const it=items[kp.id]||newItemState();
    const cls=itemStateClass(items[kp.id]);
    const stTxt={mastered:"習得済み",progress:it.totalCorrect+"回正解",wrong:"誤答あり",unseen:"未出題"}[cls];
    const lastWrong=it.wrongLog.length?it.wrongLog[it.wrongLog.length-1]:null;
    return {
      cat:LV_NAME[kp.lv], kp:kp.w, q:kp.m, ans:kp.w+"（"+kp.r+"）",
      last:lastWrong?("「"+lastWrong.answered+"」と誤答"):(it.lastSeenAt?"正解":""),
      state:stTxt, tc:it.totalCorrect, tw:it.totalWrong,
      wa:it.byFormat.A.wrong, wb:it.byFormat.B.wrong,
      wlog:it.wrongLog.map(l=>l.answered).join(";"),
      lastWrongAt:lastWrong?lastWrong.at:"", masteredAt:it.masteredAt||""
    };
  }).sort((a,b)=>b.tw-a.tw);   // 既定：誤答数の多い順
  const header=["カテゴリー","知識ポイント","問題文","正解","直近の解答","状態","累計正解数","累計誤答数","形式A誤答数","形式B誤答数","過去の誤答内容","最終誤答日","習得日"];
  const lines=[header.join(",")].concat(rows.map(r=>
    [r.cat,r.kp,r.q,r.ans,r.last,r.state,r.tc,r.tw,r.wa,r.wb,r.wlog,r.lastWrongAt,r.masteredAt].map(csvEscape).join(",")));
  const bom="\uFEFF";
  const blob=new Blob([bom+lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const fname=`結果_${acc.name}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ================= 覚えるモード（フラッシュカード・記録に影響しない） ================= */
const LEARN_AGAIN_GAP=3;   // 「まだ」のカードを差しもどす位置
let LEARN=null;
function startLearn(){
  const acc=activeAcc(); if(!acc)return;
  const items=accItems();
  const pool=poolByRange(range);
  // 優先順位：誤答が多い → 未習得 → 未出題 → 習得済み（各グループ内はシャッフル）
  const g1=[],g2=[],g3=[],g4=[];
  pool.forEach(kp=>{
    const it=items[kp.id];
    if(it&&it.totalWrong>0&&!it.mastered)g1.push(kp);
    else if(it&&!it.mastered&&it.lastSeenAt)g2.push(kp);
    else if(!it||!it.lastSeenAt)g3.push(kp);
    else g4.push(kp);
  });
  g1.sort((a,b)=>items[b.id].totalWrong-items[a.id].totalWrong);
  const deck=[...g1,...shuffle(g2),...shuffle(g3),...shuffle(g4)].map(kp=>({kp,again:false}));
  LEARN={deck,total:deck.length,got:0,revealed:false};
  renderLearn();
  showScreen("scrLearn");
}
function renderLearn(){
  const total=LEARN.total;
  $("learnLeft").textContent=`のこり ${LEARN.deck.length} 枚`;
  $("learnGot").textContent=LEARN.got;
  $("learnBarFill").style.width=(total?LEARN.got/total*100:0)+"%";
  const body=$("learnBody");
  if(LEARN.deck.length===0){
    body.innerHTML=`<div class="card learnDone">
      <div class="big">おつかれさま！</div>
      <div class="sub">全 ${total} 枚をめくり終えました。<br>次は「10問モード」で確認テストをしてみよう。</div>
    </div>
    <div class="rowBtns">
      <button class="btnGhost" id="learnHomeBtn">ホームへ</button>
      <button class="btnFill" id="learnQuizBtn">10問モードに挑戦</button>
    </div>`;
    $("learnHomeBtn").onclick=goHome;
    $("learnQuizBtn").onclick=()=>{mode="10q";startSession({mode:"10q"});};
    return;
  }
  const c=LEARN.deck[0], kp=c.kp;
  const it=accItems()[kp.id];
  const badge=it&&it.mastered?'<span style="position:absolute;top:12px;right:12px;color:var(--gold);font-size:.85rem;">⭐習得済み</span>'
    :`<span class="qLevelSeal">${kp.lv==="C"?"他":kp.lv}</span>`;
  if(!LEARN.revealed){
    body.innerHTML=`<div class="learnCard" id="learnCardEl">
        ${badge}
        ${c.again?'<span class="againTag">もう一度</span>':""}
        <div class="lw${kp.w.length>8?" small":""}">${rubyHtml(kp)}</div>
        <div class="hint">タップで意味を表示</div>
      </div>
      <div class="learnBtns"><button class="lbShow" id="learnShowBtn">意味を見る</button></div>`;
    $("learnCardEl").onclick=revealLearn;
    $("learnShowBtn").onclick=revealLearn;
  }else{
    body.innerHTML=`<div class="learnCard" id="learnCardEl" style="cursor:default;">
        ${badge}
        ${c.again?'<span class="againTag">もう一度</span>':""}
        <div class="lw${kp.w.length>8?" small":""}">${rubyHtml(kp)}</div>
        <div class="lm">${esc(kp.m)}</div>
      </div>
      <div class="learnBtns">
        <button class="lbAgain" id="learnAgainBtn">🔁 まだ</button>
        <button class="lbGot" id="learnGotBtn">⭕ おぼえた</button>
      </div>`;
    $("learnAgainBtn").onclick=()=>learnNext(false);
    $("learnGotBtn").onclick=()=>learnNext(true);
  }
}
function revealLearn(){ if(!LEARN)return; LEARN.revealed=true; renderLearn(); }
function learnNext(got){
  if(!LEARN)return;
  const c=LEARN.deck.shift();
  if(got)LEARN.got++;
  else{
    c.again=true;
    LEARN.deck.splice(Math.min(LEARN_AGAIN_GAP,LEARN.deck.length),0,c);
  }
  LEARN.revealed=false;
  renderLearn();
}
$("learnQuitBtn").onclick=()=>{LEARN=null;goHome();};   // 記録なしのため確認不要

/* ================= クラウド同期（追補v1.1／v1.2） ================= */
let SYNC=(()=>{try{return JSON.parse(store.getItem(SYNC_KEY)||"null");}catch(e){return null;}})();
let lastSyncMsg="";
function saveSync(){try{store.setItem(SYNC_KEY,JSON.stringify(SYNC));}catch(e){}}
function syncConfigured(){return !!(SYNC&&SYNC.url&&SYNC.key);}
function fmtDateTime(iso){
  const d=new Date(iso); if(isNaN(d))return "";
  const p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${p(d.getMinutes())}`;
}
function ymd(iso){const d=new Date(iso);return isNaN(d)?"":`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;}
function setSync(kind,msg){
  lastSyncMsg=msg;
  const el=$("syncStatus");
  el.className="syncStatus "+kind;
  const ls=SYNC&&SYNC.lastSync?("｜最終同期 "+fmtDateTime(SYNC.lastSync)):"";
  el.textContent=msg+ls;
}
function renderDataPanel(){
  const cfg=syncConfigured();
  $("syncNowBtn").style.display=cfg?"":"none";
  $("listDriveBtn").style.display=cfg?"":"none";
  if(!lastSyncMsg)setSync(cfg?"ok":"","☁"+(cfg?"✓ 同期設定済み":" 同期未設定（この端末のみに保存）"));
}
function updateStorageWarn(){
  const el=$("storageWarn");
  if(STORAGE_OK){el.style.display="none";return;}
  el.style.display="block";
  el.textContent=syncConfigured()
    ?"☁ この端末には記録を残せない環境ですが、クラウド同期が有効なので記録はGoogleに保存されます"
    :"⚠ この環境ではブラウザに記録を保存できません（このセッション中のみ有効）。クラウド同期を設定すると記録を残せます";
}

/* API契約（追補v1.1§4・サーバー変更不可）：応答は text→JSON.parse */
async function gasFetch(opts){
  try{
    let res;
    if(opts.method==="GET"){
      res=await fetch(SYNC.url+"?key="+encodeURIComponent(SYNC.key)+"&app="+encodeURIComponent(APP_KEY));
    }else{
      res=await fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:opts.body});
    }
    const text=await res.text();
    try{return JSON.parse(text);}
    catch(e){return {ok:false,error:"GASの応答が不正です。GASのコードを最新版に貼り替え、『デプロイを管理→新バージョン』で更新してください"};}
  }catch(e){return {ok:false,offline:true,error:"オフライン（ローカルには保存済み）"};}
}
function dbHasRecords(d){
  if(!d||!Array.isArray(d.accounts))return false;
  return d.accounts.some(a=>{
    const p=d.progress&&d.progress[a.id];
    if(!p)return false;
    if(Array.isArray(p.sessions)&&p.sessions.length>0)return true;
    return p.items&&Object.values(p.items).some(it=>((it.totalCorrect||0)+(it.totalWrong||0))>0);
  });
}
/* 項目単位の合流（v1.2§5-3：大きい方・OR・ログ統合） */
function mergeItem(a,b){
  const aLater=String(a.lastSeenAt||"")>=String(b.lastSeenAt||"");
  const later=aLater?a:b;
  const out=newItemState();
  out.streak=Math.max(a.streak||0,b.streak||0);
  out.mastered=!!(a.mastered||b.mastered);
  out.masteredAt=a.masteredAt||b.masteredAt||null;
  out.lastFormat=later.lastFormat||a.lastFormat||b.lastFormat||null;
  out.streakFormat=later.streakFormat||a.streakFormat||b.streakFormat||null;
  out.totalCorrect=Math.max(a.totalCorrect||0,b.totalCorrect||0);
  out.totalWrong=Math.max(a.totalWrong||0,b.totalWrong||0);
  const gf=(x,f,k)=>((x.byFormat||{})[f]||{})[k]||0;
  out.byFormat={
    A:{correct:Math.max(gf(a,"A","correct"),gf(b,"A","correct")),wrong:Math.max(gf(a,"A","wrong"),gf(b,"A","wrong"))},
    B:{correct:Math.max(gf(a,"B","correct"),gf(b,"B","correct")),wrong:Math.max(gf(a,"B","wrong"),gf(b,"B","wrong"))}
  };
  const seen=new Set();
  const logs=[...(a.wrongLog||[]),...(b.wrongLog||[])].filter(l=>{
    const k=(l.at||"")+"|"+(l.format||"")+"|"+(l.answered||"");
    if(seen.has(k))return false; seen.add(k); return true;
  });
  logs.sort((x,y)=>String(x.at)<String(y.at)?-1:1);
  out.wrongLog=logs.slice(-WRONGLOG_MAX);
  out.lastSeenAt=aLater?(a.lastSeenAt||b.lastSeenAt||null):(b.lastSeenAt||a.lastSeenAt||null);
  if(out.mastered&&out.streak<MASTERY_STREAK)out.streak=MASTERY_STREAK;
  return out;
}
/* クラウドを土台にローカルを合流（v1.2§5：名前で突き合わせ・必ず合流） */
function mergeDbs(base,local){
  const db=normalizeDb(deepCopy(base));
  const snap=d=>JSON.stringify({a:d.accounts.map(x=>x.name).sort(),p:d.progress});
  const before=snap(db);
  (local.accounts||[]).forEach(la=>{
    const lp=(local.progress&&local.progress[la.id])||{items:{},sessions:[]};
    const ex=db.accounts.find(a=>a.name===la.name);
    if(!ex){
      db.accounts.push(deepCopy(la));
      db.progress[la.id]=deepCopy(lp);
    }else{
      const tp=db.progress[ex.id]||(db.progress[ex.id]={items:{},sessions:[]});
      Object.keys(lp.items||{}).forEach(kpId=>{
        tp.items[kpId]=tp.items[kpId]?mergeItem(tp.items[kpId],lp.items[kpId]):deepCopy(lp.items[kpId]);
      });
      const done=new Set((tp.sessions||[]).map(x=>x.finishedAt));
      (lp.sessions||[]).forEach(x=>{if(!done.has(x.finishedAt)){tp.sessions.push(deepCopy(x));done.add(x.finishedAt);}});
      tp.sessions.sort((x,y)=>String(x.finishedAt)<String(y.finishedAt)?-1:1);
      if(tp.sessions.length>SESSIONS_MAX)tp.sessions.splice(0,tp.sessions.length-SESSIONS_MAX);
    }
  });
  const lact=(local.accounts||[]).find(a=>a.id===local.activeAccountId);
  if(lact){const f=db.accounts.find(a=>a.name===lact.name);if(f)db.activeAccountId=f.id;}
  if(!db.activeAccountId||!db.accounts.some(a=>a.id===db.activeAccountId))
    db.activeAccountId=db.accounts.length?db.accounts[0].id:null;
  const changed=snap(db)!==before;
  const stats={seen:0,mastered:0};
  Object.values(db.progress).forEach(p=>Object.values(p.items||{}).forEach(it=>{
    if(((it.totalCorrect||0)+(it.totalWrong||0))>0)stats.seen++;
    if(it.mastered)stats.mastered++;
  }));
  return {db,changed,stats};
}
async function doPush(){
  if(!syncConfigured())return null;
  setSync("busy","☁… クラウドに送信中");
  const r=await gasFetch({method:"POST",body:JSON.stringify({key:SYNC.key,data:DB})});
  if(r.ok){SYNC.lastSync=nowIso();saveSync();setSync("ok","☁✓ クラウド保存ずみ");}
  else if(r.offline)setSync("err","☁⚠ オフライン（ローカルには保存済み）");
  else setSync("err","☁⚠ "+(r.error||"エラー"));
  return r;
}
function pushDb(){ if(syncConfigured())doPush(); }   // 非同期・失敗しても学習続行
async function pullNow(trigger){
  if(!syncConfigured())return null;
  setSync("busy","☁… 同期中");
  const r=await gasFetch({method:"GET"});
  if(!r.ok){
    if(r.offline)setSync("err","☁⚠ オフライン（ローカルには保存済み）");
    else setSync("err","☁⚠ "+(r.error||"エラー"));
    return r;
  }
  const cloud=r.data?normalizeDb(r.data):null;
  const localHas=dbHasRecords(DB), cloudHas=cloud?dbHasRecords(cloud):false;
  if(!cloud||!cloudHas){
    /* クラウドが空 or 記録なし → ローカルに記録があれば無条件push */
    if(localHas){
      const p=await doPush();
      if(p&&p.ok)setSync("ok","☁✓ クラウドに進捗が無かったので送りました");
    }else{
      SYNC.lastSync=nowIso();saveSync();setSync("ok","☁✓ 同期しました（まだ記録はありません）");
    }
  }else{
    /* クラウドに記録あり → クラウドを土台に必ず合流（v1.2§5） */
    const m=mergeDbs(cloud,DB);
    DB=m.db;
    if(m.changed){ saveDb(); await doPush(); }
    else saveDb(true);            // 取り込みのみ：updatedAtを上書きしない
    SYNC.lastSync=nowIso();saveSync();
    setSync("ok",localHas
      ?`☁✓ クラウドと合流しました（${DB.accounts.length}人・出題済み${m.stats.seen}・習得${m.stats.mastered}）`
      :`☁✓ クラウドの記録を取り込みました（${DB.accounts.length}人・習得${m.stats.mastered}）`);
    renderHome();
  }
  renderDataPanel();
  return r;
}

/* ---- 全問一覧をDriveへ（追補v1.1§6：14列・空上書き防止のため必ず先にpull） ---- */
async function exportListToDrive(){
  if(!syncConfigured())return;
  await pullNow("pre-export");
  if(!dbHasRecords(DB)){
    await showModal("書き出し中止","まだ記録が無いため、全問一覧の書き出しを中止しました。<br>（空データで既存の一覧シートを上書きしないための保護です）",{okLabel:"OK",danger:false});
    return;
  }
  setSync("busy","☁… 一覧を書き出し中");
  const header=["名前","カテゴリー","記号","知識ポイント","よみがな","重要度","状態",
    "累計正解数","累計誤答数","形式A誤答数","形式B誤答数","過去の誤答内容","最終誤答日","習得日"];
  const rows=[];
  DB.accounts.forEach(acc=>{
    const items=(DB.progress[acc.id]||{}).items||{};
    DATA.forEach(kp=>{
      const it=items[kp.id]||newItemState();
      const cls=itemStateClass(items[kp.id]||null);
      const st={mastered:"習得済み",progress:it.totalCorrect+"回正解",wrong:"誤答",unseen:"未出題"}[cls];
      const lastWrong=it.wrongLog.length?it.wrongLog[it.wrongLog.length-1]:null;
      rows.push([acc.name,LV_NAME[kp.lv],"",kp.w,kp.r,"",st,
        it.totalCorrect,it.totalWrong,it.byFormat.A.wrong,it.byFormat.B.wrong,
        it.wrongLog.map(l=>l.answered).join(";"),
        lastWrong?ymd(lastWrong.at):"", it.masteredAt?ymd(it.masteredAt):""]);
    });
  });
  const r=await gasFetch({method:"POST",body:JSON.stringify({key:SYNC.key,app:APP_KEY,list:{header,rows}})});
  if(r.ok){SYNC.lastSync=nowIso();saveSync();setSync("ok","☁✓ 全問一覧をスプレッドシートに書き出しました");}
  else if(r.offline)setSync("err","☁⚠ オフラインのため書き出せませんでした");
  else setSync("err","☁⚠ "+(r.error||"エラー"));
}

/* ---- JSONの書き出し・読み込み（追補v1.1§3） ---- */
function exportJson(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${TOOL_LABEL}記録_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
async function importJsonObject(obj){
  if(!obj||obj.app!==APP_KEY){
    await showModal("読み込みエラー","このファイルは「故事成語クイズ」の記録ではありません。<br>（ツール識別子 app が一致しません）",{okLabel:"OK",danger:false});
    return;
  }
  const names=(obj.accounts||[]).map(a=>a.name).join("・")||"（アカウントなし）";
  const ok=await showModal("記録の読み込み",
    `いまの記録をこのファイルの内容で<b>置き換え</b>ます。よろしいですか？<br><br>アカウント：${esc(names)}<br>保存日時：${obj.updatedAt?esc(fmtDateTime(obj.updatedAt)):"不明"}`,
    {okLabel:"置き換える"});
  if(!ok)return;
  DB=normalizeDb(obj);
  saveDb();            // 置換後は updatedAt を更新（v1.1§3）
  pushDb();
  renderHome();renderDataPanel();
}

/* ---- 同期設定モーダル ---- */
function openSyncSettings(){
  $("mTitle").textContent="☁ クラウド同期設定";
  $("mBody").innerHTML=
    '<div style="font-size:.8rem;line-height:1.7;margin-bottom:10px;color:var(--ink-soft);">Google Apps Script のURL（<b>/exec</b> で終わるもの）と合言葉を入力してください。設定はこの端末にだけ保存されます。</div>'
    +'<input id="syncUrlIn" type="text" placeholder="https://script.google.com/…/exec" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;font-family:inherit;margin-bottom:10px;" value="'+esc(SYNC&&SYNC.url?SYNC.url:"")+'">'
    +'<input id="syncKeyIn" type="password" placeholder="合言葉" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;font-family:inherit;margin-bottom:10px;" value="'+esc(SYNC&&SYNC.key?SYNC.key:"")+'">'
    +(syncConfigured()?'<button id="syncClearBtn" style="border:1.5px solid var(--shu);color:var(--shu);background:#fff;border-radius:8px;padding:8px 12px;font-size:.8rem;cursor:pointer;font-family:inherit;">同期を解除</button>':"");
  $("mInput").style.display="none";
  $("mOk").textContent="保存して同期";
  $("mOk").style.background="var(--ai)";
  $("modalBack").classList.add("show");
  modalCb=async ok=>{
    $("modalBack").classList.remove("show");
    if(!ok)return;
    const url=$("syncUrlIn").value.trim(), key=$("syncKeyIn").value.trim();
    if(!url||!key){setSync("err","☁⚠ URLと合言葉の両方を入力してください");return;}
    if(!/\/exec$/.test(url)){setSync("err","☁⚠ URLは /exec で終わる形式にしてください");return;}
    SYNC={url,key,lastSync:SYNC&&SYNC.lastSync?SYNC.lastSync:null};
    saveSync();updateStorageWarn();renderDataPanel();
    await pullNow("settings");   // 保存直後にpull（追補v1.1§5）
  };
  const cb=$("syncClearBtn");
  if(cb)cb.onclick=()=>{
    $("modalBack").classList.remove("show");
    SYNC=null;lastSyncMsg="";
    try{store.removeItem(SYNC_KEY);}catch(e){}
    updateStorageWarn();renderDataPanel();
  };
}

/* ---- パネルのイベント ---- */
$("exportJsonBtn").onclick=exportJson;
$("importJsonBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let obj=null;
    try{obj=JSON.parse(rd.result);}catch(err){}
    importJsonObject(obj);
  };
  rd.readAsText(f);
};
$("syncSetBtn").onclick=openSyncSettings;
$("syncNowBtn").onclick=()=>pullNow("manual");
$("listDriveBtn").onclick=exportListToDrive;

/* 初期化 */
renderHome();
renderDataPanel();
updateStorageWarn();
if(syncConfigured())pullNow("startup");   // 起動直後のpull（追補v1.1§5）

</script>
