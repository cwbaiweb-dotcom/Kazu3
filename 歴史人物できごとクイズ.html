<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>歴史人物・できごとクイズ</title>
<style>
:root{
  --washi:#f7f2e6; --washi2:#efe7d5; --line:#d9cdb2;
  --ai:#1d3557; --ai2:#274b78; --ai3:#3d6ea5; --ai-pale:#e6edf5;
  --shu:#b7452f; --shu-pale:#f6e5e0;
  --midori:#4a7c59; --midori-pale:#e4efe6;
  --kin:#b8912f; --sumi:#2c2a26; --gray:#7a7266;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  color:var(--sumi); background:var(--washi);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 65%, rgba(180,165,130,.14) 0 2px, transparent 3px),
    linear-gradient(180deg,#f9f5ea,#f2ebda);
  background-size:37px 37px,53px 53px,100% 100%;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
}
#app{max-width:760px;margin:0 auto;padding:0 12px 64px}
h1,h2,h3{font-weight:600;letter-spacing:.04em;margin:0}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;background:none;color:inherit}
.hd{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;margin:0 -12px 14px;
  background:linear-gradient(180deg,var(--ai),var(--ai2));color:#fdfbf5;
  border-bottom:3px solid var(--kin);
}
.hd h1{font-size:1.12rem;flex:1;line-height:1.35}
.hd .sub{display:block;font-size:.7rem;opacity:.8;letter-spacing:.12em;font-weight:400}
.hd button{color:#fdfbf5;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 12px;font-size:.8rem;white-space:nowrap}
.card{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.card>h2{font-size:.95rem;color:var(--ai);border-left:4px solid var(--ai3);padding-left:8px;margin-bottom:10px}
.btn{display:inline-block;background:var(--ai);color:#fdfbf5;border-radius:10px;padding:11px 16px;font-size:1rem;text-align:center;border:1px solid var(--ai)}
.btn:active{transform:translateY(1px)}
.btn.sub{background:transparent;color:var(--ai);border:1px solid var(--ai3)}
.btn.warn{background:var(--shu);border-color:var(--shu)}
.btn.wide{display:block;width:100%}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--sumi)}
.chip.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.seg{display:flex;border:1px solid var(--ai3);border-radius:999px;overflow:hidden}
.seg button{flex:1;padding:7px 4px;font-size:.85rem;color:var(--ai);background:#fff}
.seg button.on{background:var(--ai);color:#fff}
.muted{color:var(--gray);font-size:.82rem}
.mini{font-size:.75rem}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.bar{height:9px;border-radius:99px;background:var(--washi2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ai3),var(--ai))}
.barline{display:flex;align-items:center;gap:8px;margin:5px 0}
.barline .nm{width:8.5em;font-size:.82rem;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barline .bar{flex:1}
.barline .vl{font-size:.74rem;color:var(--gray);width:6.5em;text-align:right;flex:none}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;border:1px solid}
.b-master{background:var(--ai);color:#fff;border-color:var(--ai)}
.b-caution{background:var(--ai);color:#fff;border-color:var(--shu);box-shadow:0 0 0 2px var(--shu-pale)}
.b-half{background:var(--ai-pale);color:var(--ai);border-color:var(--ai3)}
.b-none{background:#fff;color:var(--gray);border-color:var(--line)}
.b-wrong{background:var(--shu-pale);color:var(--shu);border-color:var(--shu)}
.b-imp2{background:#fff7e0;color:#8a6a12;border-color:var(--kin)}
.b-imp1{background:#fff;color:var(--gray);border-color:var(--line)}
.qtop{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#f9f5ea,rgba(249,245,234,.94));padding:8px 0 6px;margin:0 -12px;padding-left:12px;padding-right:12px;border-bottom:1px solid var(--line)}
.qmeta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--gray);margin-top:4px}
.stem{font-size:1.12rem;line-height:1.6;margin:14px 0 4px}
.stem .k{color:var(--ai);font-weight:600}
.gauge{letter-spacing:.18em;color:var(--ai);font-size:1rem}
.choices{display:grid;gap:9px;margin-top:12px}
.ch{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;font-size:1rem;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.ch .no{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--ai-pale);color:var(--ai);font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-top:.15em}
.ch.ok{border-color:var(--midori);background:var(--midori-pale)}
.ch.ng{border-color:var(--shu);background:var(--shu-pale)}
.ch.dim{opacity:.55}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid}
.fb.ok{background:var(--midori-pale);border-color:var(--midori)}
.fb.ng{background:var(--shu-pale);border-color:var(--shu)}
.fb h3{font-size:1rem;margin-bottom:6px}
.fb .ex{font-size:.9rem;line-height:1.65}
.fb .goro{margin-top:8px;font-size:.86rem;background:rgba(255,255,255,.75);border-left:3px solid var(--kin);padding:6px 10px;border-radius:4px}
table.lst{width:100%;border-collapse:collapse;font-size:.83rem}
table.lst th,table.lst td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.lst th{color:var(--ai);font-size:.78rem;white-space:nowrap}
.acc{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden}
.acc>.hdr{display:flex;gap:8px;align-items:center;padding:10px 12px;cursor:pointer}
.acc>.hdr .t{flex:1}
.acc>.bd{border-top:1px dashed var(--line);padding:10px 12px;background:#fdfcf8;font-size:.86rem}
input[type=text],input[type=url],input[type=password],select,textarea{
  font-family:inherit;font-size:1rem;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%
}
.modal{position:fixed;inset:0;background:rgba(30,26,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal>div{background:var(--washi);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:16px}
.sync{font-size:.85rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.sync.ok{border-color:var(--midori);background:var(--midori-pale)}
.sync.err{border-color:var(--shu);background:var(--shu-pale)}
.fav{border:none;background:none;font-size:1.15rem;line-height:1;color:var(--kin);padding:2px 4px}
.fav.off{color:#cfc6b2}
.tag{font-size:.72rem;color:var(--gray);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;background:#fff}
.warnbar{background:var(--shu);color:#fff;font-size:.8rem;padding:6px 10px;text-align:center}
.cardface{border:1px solid var(--line);border-radius:14px;background:#fff;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 16px;text-align:center;box-shadow:0 2px 6px rgba(80,70,50,.08)}
.cardface .big{font-size:1.35rem;line-height:1.55}
.ruby rt{font-size:.55em;color:var(--gray)}
.nav{display:flex;gap:8px;margin-top:14px}
.nav>*{flex:1}
hr.sep{border:none;border-top:1px dashed var(--line);margin:12px 0}
.center{text-align:center}
.right{text-align:right}
.sp{height:8px}
ul.plain{margin:6px 0;padding-left:1.1em}
ul.plain li{margin-bottom:4px}

</style>
</head>

{id:"p117",cat:"明治",imp:2,who:"伊藤博文",yomi:"いとうひろぶみ",y:1885,

 goro:"明治天皇 憲法発布 東アジアで いち早く（1889年）"},
{id:"p118",cat:"明治",imp:2,who:"福沢諭吉",yomi:"ふくざわゆきち",y:1872,

 goro:""},
{id:"p119",cat:"明治",imp:1,who:"ノルマントン号事件",yomi:"のるまんとんごうじけん",y:1886,
 what:"1886年、沈没船でイギリス人だけが助かり日本人が全員死亡したのに船長が軽い罰ですんだ事件である",
 desc:"領事裁判権（治外法権）の不当さが国民に強く意識され、条約改正を求める世論が高まった。",
 goro:"日本人を 見殺しにした 船長バカヤロ ノルマントン（1886年）"},
{id:"p120",cat:"明治",imp:2,who:"陸奥宗光",yomi:"むつむねみつ",y:1894,
 what:"1894年、外務大臣としてイギリスとの交渉で領事裁判権（治外法権）の撤廃に成功した",
 desc:"日清戦争直前、ロシアの南下を警戒するイギリスが応じた。下関条約にも全権として調印。",

{id:"p121",cat:"明治",imp:2,who:"小村寿太郎",yomi:"こむらじゅたろう",y:1911,

 goro:"辛亥革命 その必要を 孫文は説く 人々に（1911年）"},
{id:"p122",cat:"明治",imp:1,who:"下関条約",yomi:"しものせきじょうやく",y:1895,

 desc:"日本全権は伊藤博文・陸奥宗光、清は李鴻章。直後にロシア・ドイツ・フランスの三国干渉で遼東半島を返還し、「臥薪嘗胆」の合言葉が広まった。",
 goro:"清に勝利し 条約結ぶ 下関から 飛躍へゴー！（1895年）"},
{id:"p123",cat:"明治",imp:1,who:"日英同盟",yomi:"にちえいどうめい",y:1902,
 what:"1902年、ロシアの南下をおさえるためイギリスと結んだ同盟である",
 desc:"「光栄ある孤立」を捨てたイギリスと利害が一致した。日露戦争を戦う支えとなった。",
 goro:"イギリスだって ロシアが不安 遠くをにらみ 日英同盟（1902年）"},
{id:"p124",cat:"明治",imp:1,who:"ポーツマス条約",yomi:"ぽーつますじょうやく",y:1905,
 what:"1905年、アメリカのセオドア・ルーズベルトの仲立ちで結ばれた日露戦争の講和条約である",
 desc:"樺太南部・旅順・大連の租借権・南満州鉄道の権利を得たが賠償金はなく、国民の不満から日比谷焼き打ち事件が起きた。",
 goro:"ルーズベルトが なかだちをして 遠くで行う ポーツマス（1905年）"},
{id:"p125",cat:"明治",imp:1,who:"与謝野晶子",yomi:"よさのあきこ",y:1904,
 what:"日露戦争に出征した弟を思い「君死にたまふことなかれ」をよんだ",

{id:"p126",cat:"明治",imp:2,who:"田中正造",yomi:"たなかしょうぞう",y:1901,

{id:"p127",cat:"明治",imp:1,who:"渋沢栄一",yomi:"しぶさわえいいち",y:1873,

{id:"p128",cat:"明治",imp:1,who:"北里柴三郎",yomi:"きたさとしばさぶろう",y:1894,

{id:"p129",cat:"明治",imp:0,who:"野口英世",yomi:"のぐちひでよ",y:1918,
 what:"黄熱病の研究に取り組み、アフリカで研究中に自らも感染して亡くなった",

{id:"p130",cat:"明治",imp:0,who:"志賀潔",yomi:"しがきよし",y:1897,

{id:"p131",cat:"明治",imp:1,who:"夏目漱石",yomi:"なつめそうせき",y:1905,
 what:"『吾輩は猫である』『坊っちゃん』『こころ』を書いた",

 goro:""},
{id:"p132",cat:"明治",imp:0,who:"森鴎外",yomi:"もりおうがい",y:1890,
 what:"軍医として活動しながら『舞姫』『高瀬舟』を書いた",

 goro:""},
{id:"p133",cat:"明治",imp:0,who:"樋口一葉",yomi:"ひぐちいちよう",y:1895,
 what:"『たけくらべ』『にごりえ』を書き、24歳で亡くなった女性作家である",

 goro:""},
{id:"p134",cat:"明治",imp:0,who:"新渡戸稲造",yomi:"にとべいなぞう",y:1920,
 what:"『武士道』を英語で著し、のちに国際連盟の事務局次長を務めた",

 goro:""},
{id:"p135",cat:"明治",imp:2,who:"孫文",yomi:"そんぶん",y:1911,
 what:"三民主義をとなえて辛亥革命を導き、翌年に中華民国を建てた",
 desc:"1911年の辛亥革命で清がたおれ、2千年以上続いた皇帝の政治が終わった。三民主義＝民族・民権・民生。",
 goro:""},
{id:"p136",cat:"明治",imp:1,who:"韓国併合",yomi:"かんこくへいごう",y:1910,
 what:"1910年、日本が韓国を植民地とし、朝鮮総督府を置いて統治した",
 desc:"日本語教育の強制や土地調査事業で土地を失う人が出て、多くが日本へ移住した。1919年に三・一独立運動が起きた。",
 goro:"土地奪われて 日本を目指し 行く人多し 韓国併合（1910年）"},

/* ---------- 大正・昭和(戦前) ---------- */
{id:"p137",cat:"大正・昭和(戦前)",imp:0,who:"レーニン",yomi:"れーにん",y:1917,

{id:"p138",cat:"大正・昭和(戦前)",imp:1,who:"米騒動",yomi:"こめそうどう",y:1918,

{id:"p139",cat:"大正・昭和(戦前)",imp:2,who:"原敬",yomi:"はらたかし",y:1918,

 goro:""},
{id:"p140",cat:"大正・昭和(戦前)",imp:0,who:"吉野作造",yomi:"よしのさくぞう",y:1916,

 desc:"主権の所在は問わず、民衆の意向にそう政治を求める考え方。",
 goro:""},
{id:"p141",cat:"大正・昭和(戦前)",imp:2,who:"平塚らいてう",yomi:"ひらつからいちょう",y:1911,
 what:"「元始、女性は太陽であった」と青鞜社を興し、市川房枝らと新婦人協会をつくった",
 desc:"女性の政治活動を禁じた治安警察法の改正を求めた。女性の参政権が実現するのは1945年。",
 goro:""},
{id:"p142",cat:"大正・昭和(戦前)",imp:0,who:"全国水平社",yomi:"ぜんこくすいへいしゃ",y:1922,
 what:"1922年に結成され、差別からの解放を「人の世に熱あれ、人間に光あれ」とうたった",
 desc:"水平社宣言は日本初の人権宣言といわれる。",
 goro:""},
{id:"p143",cat:"大正・昭和(戦前)",imp:0,who:"ベルサイユ条約",yomi:"べるさいゆじょうやく",y:1919,
 what:"1919年に第一次世界大戦の講和として結ばれ、日本は山東省の権益と南洋諸島の委任統治を得た",
 desc:"ドイツに巨額の賠償を課した。翌1920年に国際連盟が発足し日本は常任理事国となったが、アメリカは加盟しなかった。",
 goro:"パリで条約 日本もチャンス 行く行くフランス ベルサイユ（1919年）"},
{id:"p144",cat:"大正・昭和(戦前)",imp:1,who:"関東大震災",yomi:"かんとうだいしんさい",y:1923,

{id:"p145",cat:"大正・昭和(戦前)",imp:1,who:"加藤高明",yomi:"かとうたかあき",y:1925,

 desc:"満25歳以上のすべての男子に選挙権（有権者は約4倍に）。同時に社会主義運動を取りしまった。同年ラジオ放送も開始。",
 goro:"男子限定 普選が実現 選挙行くんだ ２５歳（1925年）"},
{id:"p146",cat:"大正・昭和(戦前)",imp:1,who:"世界恐慌",yomi:"せかいきょうこう",y:1929,
 what:"1929年、ニューヨークの株価大暴落から始まり世界中に広がった大不況である",
 desc:"アメリカはニューディール政策、英仏はブロック経済で対応。植民地の少ない日独伊は対外進出に向かい、日本は昭和恐慌で農村が困窮した。",
 goro:"街にあふれる 失業者たち ひどく憎むは 世界恐慌（1929年）"},
{id:"p147",cat:"大正・昭和(戦前)",imp:1,who:"満州事変",yomi:"まんしゅうじへん",y:1931,
 what:"1931年、奉天郊外の柳条湖で線路を爆破した関東軍が満州を占領したできごとである",
 desc:"翌年「満州国」を建国。リットン調査団の報告を受けた国際連盟の勧告に反発し、1933年に日本は国際連盟を脱退した。",
 goro:"奉天郊外 柳条湖から いくさの一歩 満州事変（1931年）"},
{id:"p148",cat:"大正・昭和(戦前)",imp:2,who:"犬養毅",yomi:"いぬかいつよし",y:1932,
 what:"1932年の五・一五事件で海軍青年将校らに暗殺された首相である",
 desc:"「話せばわかる」と言ったと伝わる。この事件で政党内閣が終わり、軍部の力が強まった。",
 goro:"話せばわかると 犬養毅 いくさに不安 五・一五（1932年）"},
{id:"p149",cat:"大正・昭和(戦前)",imp:1,who:"二・二六事件",yomi:"ににろくじけん",y:1936,
 what:"1936年、陸軍の青年将校が首相官邸などを占拠し大臣を殺害した事件である",
 desc:"鎮圧後、軍部の政治的発言力がさらに強まり、日本は戦時体制へ進んだ。",
 goro:"東京中枢 軍人占拠 いくさ向かう日 二・二六（1936年）"},
{id:"p150",cat:"大正・昭和(戦前)",imp:1,who:"日中戦争",yomi:"にっちゅうせんそう",y:1937,

 desc:"翌1938年には国家総動員法が定められ、政府が議会の承認なく物資や人を動員できるようになった。",
 goro:"北京郊外 盧溝橋から いくさ長引く 日中戦争（1937年）"},
{id:"p151",cat:"大正・昭和(戦前)",imp:0,who:"東条英機",yomi:"とうじょうひでき",y:1941,
 what:"太平洋戦争が始まったときの首相で、戦後に極東国際軍事裁判で死刑となった",
 desc:"1941年12月8日、真珠湾攻撃とマレー半島上陸で開戦。",
 goro:"陸軍マレーへ 海軍どこへ？ 行くよいっきに 真珠湾（1941年）"},
{id:"p152",cat:"大正・昭和(戦前)",imp:1,who:"ポツダム宣言",yomi:"ぽつだむせんげん",y:1945,
 what:"1945年に日本が受け入れ、無条件降伏して第二次世界大戦が終わった宣言である",
 desc:"8月6日広島・9日長崎に原子爆弾、8日ソ連参戦を経て、8月14日受諾・15日玉音放送。",
 goro:"ポツダム宣言 受け入れを決め 行くよこれから 再出発（1945年）"},

{id:"p154",cat:"昭和(戦後)・平成",imp:1,who:"日本国憲法",yomi:"にほんこくけんぽう",y:1946,

{id:"p155",cat:"昭和(戦後)・平成",imp:0,who:"教育基本法",yomi:"きょういくきほんほう",y:1947,

{id:"p156",cat:"昭和(戦後)・平成",imp:1,who:"朝鮮戦争",yomi:"ちょうせんせんそう",y:1950,

{id:"p157",cat:"昭和(戦後)・平成",imp:2,who:"吉田茂",yomi:"よしだしげる",y:1951,

{id:"p158",cat:"昭和(戦後)・平成",imp:0,who:"第五福竜丸事件",yomi:"だいごふくりゅうまるじけん",y:1954,

 desc:"翌1955年に第1回原水爆禁止世界大会が広島で開かれるなど、原水爆禁止運動が全国に広がった。",
 goro:"保安隊から 組織を変えて 自衛隊員 行く行進（1954年）"},
{id:"p159",cat:"昭和(戦後)・平成",imp:1,who:"日ソ共同宣言",yomi:"にっそきょうどうせんげん",y:1956,

 desc:"それまでソ連が拒否権を使って加盟を阻んでいた。北方領土問題は未解決のまま残った。",
 goro:"日ソ共同宣言調印 日本も行くころ 国連へ（1956年）"},
{id:"p160",cat:"昭和(戦後)・平成",imp:1,who:"高度経済成長",yomi:"こうどけいざいせいちょう",y:1955,

 goro:"行くぞゴーゴー 重化学なのさ 高度経済成長期（1955年）"},
{id:"p161",cat:"昭和(戦後)・平成",imp:1,who:"東京オリンピック",yomi:"とうきょうおりんぴっく",y:1964,

/* ① 歴史人物・できごと（誰が／何を） 出題形式の定義 */
var APP_CFG = (function(){
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function shuf(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  /* 同じカテゴリーから優先的に3つのダミーを選ぶ（=まぎらわしい選択肢） */
  function distract(kp, all, key){
    var same = all.filter(function(x){ return x.id!==kp.id && x.cat===kp.cat && x[key]!==kp[key]; });
    var other = all.filter(function(x){ return x.id!==kp.id && x.cat!==kp.cat && x[key]!==kp[key]; });
    var pick = shuf(same).slice(0,2);
    var need = 3 - pick.length;
    pick = pick.concat(shuf(other).slice(0, need));
    if(pick.length<3) pick = pick.concat(shuf(same).slice(2, 2+(3-pick.length)));
    return pick.slice(0,3);
  }

  return {
    app:"kj-quiz-shakai-rekishi-jinbutsu",
    title:"歴史人物・できごと",
    subtitle:"だれが／なにを　歴史年代表100 深掘り編",
    fmtA:{key:"A", label:"人物→業績"},
    fmtB:{key:"B", label:"業績→人物"},

    makeQ: function(kp, fmt, all){
      var q = {};
      if(fmt==="A"){
        var ds = distract(kp, all, "what");
        var opts = shuf([{t:kp.what, ok:true}].concat(ds.map(function(x){return {t:x.what,ok:false};})));
        q.stem = '<span class="k">'+esc(kp.who)+'</span>　にあてはまる説明はどれ？';
        q.choices = opts.map(function(o){ return esc(o.t); });
        q.answer  = opts.findIndex ? opts.findIndex(function(o){return o.ok;}) : (function(){ for(var i=0;i<opts.length;i++) if(opts[i].ok) return i; return 0; })();
      } else {
        var ds2 = distract(kp, all, "who");
        var opts2 = shuf([{t:kp.who, ok:true}].concat(ds2.map(function(x){return {t:x.who,ok:false};})));
        q.stem = 'つぎの説明にあてはまる人物・文化財はどれ？<br><span class="k">'+esc(kp.what)+'</span>';
        q.choices = opts2.map(function(o){ return esc(o.t); });
        q.answer  = (function(){ for(var i=0;i<opts2.length;i++) if(opts2[i].ok) return i; return 0; })();
      }
      q.explain = '<b>'+esc(kp.who)+'</b>'+(kp.y?'（'+kp.y+'年ごろ）':'')+'　'+esc(kp.what)+'。<br>'+esc(kp.desc);
      q.goro = kp.goro || "";
      return q;
    },

    listMark: function(k){ return k.y ? String(k.y) : ""; },
    kpName:   function(k){ return k.who; },
    searchQ:  function(k){ return k.who + " 中学受験 歴史"; },

    detail: function(k){
      return '<div>'+esc(k.what)+'。</div>'+
             '<div class="mini" style="margin-top:6px">'+esc(k.desc)+'</div>'+
             (k.goro ? '<div class="goro mini" style="margin-top:6px">覚え方：'+esc(k.goro)+'</div>' : '')+
             (k.y ? '<div class="mini muted" style="margin-top:4px">関連年代：'+k.y+'年</div>' : '');
    },
    cardFront: function(k, dir){
      return dir==="A" ? esc(k.who) + (k.yomi?'<div class="muted mini">'+esc(k.yomi)+'</div>':'')
                       : esc(k.what);
    },

function newItem(){
  return { streak:0, mastered:false, masteredAt:null, postMasterWrong:0,
    lastFormat:null, totalCorrect:0, totalWrong:0,
    byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}},

  return { app:APP, version:2, updatedAt:nowISO(), activeAccountId:null, accounts:[], progress:{} };

function normItem(it){
  var n = newItem();
  if(!it) return n;
  n.streak = it.streak|0; n.mastered = !!it.mastered; n.masteredAt = it.masteredAt||null;
  n.postMasterWrong = it.postMasterWrong|0;
  n.lastFormat = it.lastFormat||null;
  n.totalCorrect = it.totalCorrect|0; n.totalWrong = it.totalWrong|0;
  if(it.byFormat){

      if(it.byFormat[f]){ n.byFormat[f].correct = it.byFormat[f].correct|0; n.byFormat[f].wrong = it.byFormat[f].wrong|0; }
    });
  }
  n.wrongLog = (it.wrongLog||[]).filter(function(x){ return x && x.at; })
    .sort(function(a,b){ return a.at < b.at ? 1 : -1; }).slice(0,5);   /* 新しい順に5件 */
  n.lastSeenAt = it.lastSeenAt||null;
  n.fav = !!it.fav;
  return n;
}

function normProgress(p){
  var out = { items:{}, sessions:[] };
  if(!p || typeof p!=="object") return out;
  Object.keys(p.items||{}).forEach(function(kid){ out.items[kid] = normItem(p.items[kid]); });
  var seen = {};
  out.sessions = (p.sessions||[]).filter(function(s){
    if(!s || !s.finishedAt || seen[s.finishedAt]) return false;
    seen[s.finishedAt]=1; return true;
  }).slice(-100);
  return out;
}

function progHasRecords(p){

    return ((it[k].totalCorrect|0)+(it[k].totalWrong|0)) > 0;
  });
}

/* §13-2 合流 */
function mergeItem(a,b){
  var L = normItem(a), R = normItem(b), o = newItem();
  o.totalCorrect = Math.max(L.totalCorrect,R.totalCorrect);
  o.totalWrong   = Math.max(L.totalWrong,R.totalWrong);
  o.postMasterWrong = Math.max(L.postMasterWrong,R.postMasterWrong);
  ["A","B"].forEach(function(f){
    o.byFormat[f].correct = Math.max(L.byFormat[f].correct,R.byFormat[f].correct);
    o.byFormat[f].wrong   = Math.max(L.byFormat[f].wrong,R.byFormat[f].wrong);
  });
  o.mastered = L.mastered || R.mastered;
  if(L.masteredAt && R.masteredAt) o.masteredAt = (L.masteredAt < R.masteredAt) ? L.masteredAt : R.masteredAt;
  else o.masteredAt = L.masteredAt || R.masteredAt || null;
  var seen = {}, log = [];
  L.wrongLog.concat(R.wrongLog).forEach(function(w){ if(w && w.at && !seen[w.at]){ seen[w.at]=1; log.push(w); } });
  log.sort(function(x,y){ return x.at < y.at ? 1 : -1; });
  o.wrongLog = log.slice(0,5);
  var lNew = (L.lastSeenAt||"") >= (R.lastSeenAt||"");
  o.lastSeenAt = lNew ? (L.lastSeenAt||R.lastSeenAt||null) : (R.lastSeenAt||L.lastSeenAt||null);
  o.streak     = lNew ? L.streak : R.streak;          /* ← 大きい方ではない */
  o.lastFormat = lNew ? L.lastFormat : R.lastFormat;
  o.fav = L.fav || R.fav;
  return o;
}
/* 扱うのは常に同じ1つのIDだけなので、アカウントの突き合わせは不要（§13-2） */
function mergeProgress(L,C){
  L = normProgress(L); C = normProgress(C);
  var M = {items:{}, sessions:[]}, ids = {};
  Object.keys(L.items).forEach(function(k){ ids[k]=1; });
  Object.keys(C.items).forEach(function(k){ ids[k]=1; });
  Object.keys(ids).forEach(function(k){ M.items[k] = mergeItem(L.items[k], C.items[k]); });
  var seen = {}, ss = [];
  L.sessions.concat(C.sessions).forEach(function(s){
    if(s && s.finishedAt && !seen[s.finishedAt]){ seen[s.finishedAt]=1; ss.push(s); }
  });
  ss.sort(function(x,y){ return x.finishedAt < y.finishedAt ? 1 : -1; });   /* 新しい順 */
  M.sessions = ss.slice(0,100).reverse();                                   /* 古い順に戻す */
  return M;
}

/* §12-B 取得（pull） */
function pullCloud(silent){
  if(!ready() || !AUTH) return Promise.resolve();
  if(!silent) setSync("☁… クラウドと同期しています","");
  return api({action:'fetch', app:APP, id:AUTH.id, pw:AUTH.pw}).then(function(j){
    if(!j.ok){
      setSync("☁⚠ "+apiError(j), "err");
      if(j.error==="auth") onAuthLost();
      return;
    }
    var cloudP = normProgress((((j.data||{}).progress)||{})[AUTH.id]);
    var localP = prog();
    var before = JSON.stringify(localP);
    var merged = mergeProgress(localP, cloudP);
    DB.progress[AUTH.id] = merged;
    if(j.label){ AUTH.label=j.label; lsSet(K_AUTH, JSON.stringify(AUTH)); DB.accounts[0].label=j.label; }
    var cd = (j.data||{}).accounts && j.data.accounts[0];
    if(cd && cd.createdAt) DB.accounts[0].createdAt = cd.createdAt;
    saveDB({fromCloud:true});
    SYNC.lastSync = nowISO(); saveSync();
    var n = Object.keys(merged.items).length;
    var m = Object.keys(merged.items).filter(function(k){ return merged.items[k].mastered; }).length;
    setSync("☁✓ クラウドと合流しました（"+n+"語・習得"+m+"）","ok");
    render();
    if(before !== JSON.stringify(merged)) return pushCloud(true, syncMsg.text);
  }).catch(function(e){ netMsg(e); });
}

/* §12-C 保存（push）— 自分のID 1件だけを送る */
function pushCloud(silent, okMsg){
  if(!ready() || !AUTH) return Promise.resolve(false);
  if(!silent) setSync("☁… 送信しています","");
  return api({action:'save', app:APP, id:AUTH.id, pw:AUTH.pw,
              account:DB.accounts[0], progress:prog()}).then(function(j){
    if(!j.ok){
      setSync("☁⚠ "+apiError(j), "err");
      if(j.error==="auth") onAuthLost();
      return false;
    }
    SYNC.lastSync = nowISO(); saveSync();
    setSync(okMsg || "☁✓ クラウドに保存しました","ok");
    return true;
  }).catch(function(e){ netMsg(e, "。次につながったときに送ります"); return false; });
}

function rowFor(k, it){

function ymd(){ var d=new Date(), p=function(n){return (n<10?"0":"")+n;};

function downloadCSV(){

function dl(blob, name){

/* ============================================================
   出題ロジック
   ============================================================ */
var sess = null;

function pickTargets(n, pool){
  var list = pool.filter(function(k){ return !peekItem(k.id).mastered; });
  list.sort(function(a,b){
    var A=peekItem(a.id), B=peekItem(b.id);
    if(B.totalWrong !== A.totalWrong) return B.totalWrong - A.totalWrong;
    var au = (A.totalCorrect+A.totalWrong)===0, bu = (B.totalCorrect+B.totalWrong)===0;
    if(au!==bu) return au ? -1 : 1;
    return (A.lastSeenAt||"") < (B.lastSeenAt||"") ? -1 : 1;
  });
  return list.slice(0, n);
}
function otherFmt(f){ return f===FA.key ? FB.key : FA.key; }

function startSession(mode){
  if(!loggedIn()){ screen="gate"; render(); return; }
  var pool = scopeKPs(), targets, queue = [];
  if(mode==="全問"){
    targets = shuffle(pool.slice());
    targets.forEach(function(k){
      var it = peekItem(k.id);
      var f = it.lastFormat ? otherFmt(it.lastFormat) : (Math.random()<.5?FA.key:FB.key);
      queue.push(mkEntry(k,f));
    });
  } else if(mode==="再確認"){
    targets = pool.filter(function(k){ return peekItem(k.id).postMasterWrong>0; });
    if(!targets.length){ alert("要注意習得のことがらはありません。"); return; }
    targets = shuffle(targets.slice());
    var h1 = targets.map(function(k){ return mkEntry(k, Math.random()<.5?FA.key:FB.key); });
    var h2 = shuffle(targets.slice()).map(function(k){
      var e = h1.filter(function(x){return x.kpId===k.id;})[0];
      return mkEntry(k, otherFmt(e.fmt));
    });
    queue = h1.concat(h2);
  } else {
    var n = (mode==="20問") ? 20 : 10;
    targets = pickTargets(n, pool);
    if(!targets.length){ alert("この範囲に未習得のことがらがありません。範囲を広げるか、全問モードをお試しください。"); return; }
    var short = targets.length < n;
    var a1 = shuffle(targets.slice()).map(function(k){
      var it = peekItem(k.id);
      var f = it.lastFormat ? otherFmt(it.lastFormat) : (Math.random()<.5?FA.key:FB.key);
      return mkEntry(k,f);
    });
    var a2 = shuffle(targets.slice()).map(function(k){
      var e = a1.filter(function(x){return x.kpId===k.id;})[0];
      return mkEntry(k, otherFmt(e.fmt));
    });
    queue = a1.concat(a2);
    if(short) setTimeout(function(){ alert("この範囲の未習得は"+targets.length+"語です。"+targets.length+"語（"+queue.length+"問）で出題します。"); },30);
  }
  sess = { mode:mode, queue:queue, idx:0, pos:0, startedAt:nowISO(),
           work:{}, newlyMastered:[], wrongKp:[] };
  screen = "quiz"; jump = true; render();
}
function mkEntry(k,f){
  return { kpId:k.id, fmt:f, q:APP_CFG.makeQ(k, f, KPS), answered:false, choice:-1, correct:false, requeueRef:null };
}
function w(kid){
  if(!sess.work[kid]) sess.work[kid] = JSON.parse(JSON.stringify(normItem((prog()||{items:{}}).items[kid])));
  return sess.work[kid];
}
/* 解答の反映（sess.work 上のみ。DBへは結果画面で確定） */
function applyAnswer(e){
  var it = w(e.kpId), ts = nowISO();
  it.lastSeenAt = ts; it.lastFormat = e.fmt;
  if(sess.mode==="再確認"){
    if(!e.correct){
      it.postMasterWrong++;
      it.wrongLog.unshift({at:ts, format:e.fmt, answered:e.q.choices[e.choice]||""});
      it.wrongLog = it.wrongLog.slice(0,5);
      if(sess.wrongKp.indexOf(e.kpId)<0) sess.wrongKp.push(e.kpId);
    }
    return;
  }
  if(e.correct){
    it.totalCorrect++; it.byFormat[e.fmt].correct++;
    if(it.streak>0 && e.prevFmt===e.fmt) { /* 同形式の連続正解はstreakを進めない */ }
    else it.streak++;
    if(!it.mastered && it.streak >= requiredStreak(it)){
      it.mastered = true; it.masteredAt = ts;
      if(sess.newlyMastered.indexOf(e.kpId)<0) sess.newlyMastered.push(e.kpId);
    }
  } else {
    it.totalWrong++; it.byFormat[e.fmt].wrong++;
    it.streak = 0;
    if(it.mastered) it.postMasterWrong++;
    it.wrongLog.unshift({at:ts, format:e.fmt, answered:e.q.choices[e.choice]||""});
    it.wrongLog = it.wrongLog.slice(0,5);
    if(sess.wrongKp.indexOf(e.kpId)<0) sess.wrongKp.push(e.kpId);
  }
}
function replay(){
  sess.work = {}; sess.newlyMastered = []; sess.wrongKp = [];
  var prev = {}, base = (prog()||{items:{}}).items || {};
  sess.queue.forEach(function(e){
    if(!e.answered) return;
    if(!(e.kpId in prev)) prev[e.kpId] = normItem(base[e.kpId]).lastFormat;
    e.prevFmt = prev[e.kpId];
    prev[e.kpId] = e.fmt;
    applyAnswer(e);
  });
}
function countInQueue(kid){
  return sess.queue.filter(function(e){ return e.kpId===kid; }).length;
}
function requeue(e, offset){
  if(sess.mode==="全問") return;
  if(countInQueue(e.kpId) >= 4){ e.skipped = true; return; }
  var pos = Math.min(sess.pos + offset, sess.queue.length);
  while(pos < sess.queue.length && sess.queue[pos].kpId === e.kpId) pos++;
  var k = KPBYID[e.kpId];
  var ne = mkEntry(k, otherFmt(e.fmt));
  sess.queue.splice(pos, 0, ne);
  e.requeueRef = ne;
}
function answer(ci){
  var e = sess.queue[sess.idx];
  if(e.answered) return;
  e.answered = true; e.choice = ci; e.correct = (ci === e.q.answer);
  replay();
  if(!e.correct) requeue(e, 3);
  else {
    var it = w(e.kpId);
    if(!it.mastered) requeue(e, 6);
  }
  render();
}
/* §6-1 再解答できるのは直前の1問のみ */
function canReanswer(){ return sess.idx === sess.pos - 1; }
function reanswer(ci){
  var e = sess.queue[sess.idx];
  if(e.requeueRef){
    var i = sess.queue.indexOf(e.requeueRef);
    if(i > sess.pos && !sess.queue[i].answered) sess.queue.splice(i,1);
    e.requeueRef = null;
  }
  e.choice = ci; e.correct = (ci === e.q.answer); e.skipped = false;
  replay();
  if(!e.correct) requeue(e,3);
  else { var it = w(e.kpId); if(!it.mastered) requeue(e,6); }
  render();
}
function next(){
  if(sess.pos < sess.queue.length-1){ sess.pos++; sess.idx = sess.pos; jump = true; render(); }
  else finish();
}
/* §6-2 結果画面到達時のみ確定 */
function finish(){
  var p = prog(), fin = nowISO();
  Object.keys(sess.work).forEach(function(kid){ p.items[kid] = sess.work[kid]; });
  var totalMastered = 0;
  Object.keys(p.items).forEach(function(k){ if(p.items[k].mastered) totalMastered++; });
  var corr = sess.queue.filter(function(e){ return e.answered && e.correct; }).length;
  var wrng = sess.queue.filter(function(e){ return e.answered && !e.correct; }).length;
  p.sessions.push({ startedAt:sess.startedAt, finishedAt:fin, mode:sess.mode,
    correct:corr, wrong:wrng, newlyMastered:sess.newlyMastered.slice(),
    wrongKpIds:sess.wrongKp.slice(), totalMastered:totalMastered });
  p.sessions = p.sessions.slice(-100);
  saveDB();
  pushCloud(true);
  sess.result = {correct:corr, wrong:wrng, fin:fin};
  screen = "result"; render();
}

  if(sess.idx>0) h += '<button class="btn sub" data-act="back">← 前の問題へ</button>';
  if(reviewing) h += '<button class="btn sub" data-act="fwd">進む →</button>';
  else if(e.answered) h += '<button class="btn" data-act="next">'+(sess.pos<sess.queue.length-1?"次の問題へ →":"結果を見る →")+'</button>';
  h += '</div>';
  h += '<div class="sp"></div><button class="btn sub sm" data-act="abort">中止してホームへ</button>';
  h += '</div>';
  return h;
}

/* ---------- 結果 ---------- */
function viewResult(){
  var r = sess.result;
  var tot = r.correct + r.wrong;
  var h = header("結果", '<button data-act="home">ホーム</button>');
  h += '<div class="card"><h2>今回のまとめ（'+esc(sess.mode)+'）</h2>'+
    '<div style="font-size:1.1rem">正解 <b>'+r.correct+'</b>　誤答 <b>'+r.wrong+'</b>　正答率 <b>'+
    (tot?Math.round(r.correct/tot*100):0)+'%</b></div>'+
    '<div style="margin-top:6px">今回あらたに習得：<b>'+sess.newlyMastered.length+'語</b>'+
    (sess.newlyMastered.length? '<div class="mini muted">'+sess.newlyMastered.map(function(id){return esc(APP_CFG.kpName(KPBYID[id]));}).join("／")+'</div>':'')+
    '</div></div>';

  var wrongs = sess.queue.filter(function(e){ return e.answered && !e.correct; });
  if(wrongs.length){
    h += '<div class="card"><h2>今回まちがえた問題</h2><table class="lst">'+
      '<tr><th>ことがら</th><th>形式</th><th>あなたの答え</th><th>正解</th></tr>';
    wrongs.forEach(function(e){
      h += '<tr><td>'+esc(APP_CFG.kpName(KPBYID[e.kpId]))+'</td><td>'+e.fmt+'</td>'+
        '<td style="color:var(--shu)">'+e.q.choices[e.choice]+'</td><td>'+e.q.choices[e.q.answer]+'</td></tr>';
    });
    h += '</table></div>';
  }
  var skipped = sess.queue.filter(function(e){ return e.skipped; });
  if(skipped.length){
    h += '<div class="card"><h2 style="border-left-color:var(--shu)">要復習（出題上限に達しました）</h2><div>'+
      uniq(skipped.map(function(e){return APP_CFG.kpName(KPBYID[e.kpId]);})).map(esc).join("／")+'</div></div>';
  }
  h += allList();
  h += '<div class="card"><button class="btn wide" data-act="home">ホームへもどる</button></div>';
  return h;
}

/* ---------- カテゴリー別 全問一覧（範囲の影響を受けない） ---------- */
var listFilter = { cat:"すべて", state:"すべて", sort:"cat" };
function allList(){
  var h = '<div class="card"><h2>カテゴリー別 全問一覧（累計・全'+KPS.length+'語）</h2>';
  h += '<div class="row" style="margin-bottom:6px">';
  ["すべて"].concat(CATS).forEach(function(c){
    h += '<button class="chip'+(listFilter.cat===c?" on":"")+'" data-act="lcat" data-v="'+esc(c)+'">'+esc(c)+'</button>';
  });
  h += '</div><div class="row" style="margin-bottom:8px">';
  ["すべて","習得済み","要注意習得","誤答あり","未出題"].forEach(function(s){
    h += '<button class="chip'+(listFilter.state===s?" on":"")+'" data-act="lst" data-v="'+esc(s)+'">'+esc(s)+'</button>';
  });
  h += '<button class="chip'+(listFilter.sort==="wrong"?" on":"")+'" data-act="lsort" data-v="wrong">誤答数順</button>';
  h += '<button class="chip'+(listFilter.sort==="cat"?" on":"")+'" data-act="lsort" data-v="cat">カテゴリー順</button>';
  h += '</div>';

  var list = KPS.filter(function(k){
    if(listFilter.cat!=="すべて" && k.cat!==listFilter.cat) return false;
    var it = peekItem(k.id), s = stateOf(it);
    if(listFilter.state==="習得済み")  return s==="習得済み";
    if(listFilter.state==="要注意習得") return s==="要注意習得";
    if(listFilter.state==="誤答あり")  return it.totalWrong>0;
    if(listFilter.state==="未出題")    return s==="未出題";
    return true;
  });
  if(listFilter.sort==="wrong") list = list.slice().sort(function(a,b){ return peekItem(b.id).totalWrong - peekItem(a.id).totalWrong; });

  list.forEach(function(k){
    var it = peekItem(k.id);
    h += '<div class="acc"><div class="hdr" data-act="open" data-id="'+k.id+'">'+
      '<span class="t">'+(impMark(k.imp)?'<span class="tag">'+impMark(k.imp)+'</span>':'')+esc(APP_CFG.kpName(k))+'</span>'+
      (it.totalWrong>0 ? '<span class="badge b-wrong" style="'+(it.totalWrong>=2?"font-weight:700":"")+'">誤答'+it.totalWrong+'回</span> ':'')+
      stateBadge(it)+'</div>';
    if(openKp===k.id){
      h += '<div class="bd">'+APP_CFG.detail(k)+
        '<hr class="sep"><div class="mini">'+
        FA.label+'：正解'+it.byFormat.A.correct+'／誤答'+it.byFormat.A.wrong+'　｜　'+
        FB.label+'：正解'+it.byFormat.B.correct+'／誤答'+it.byFormat.B.wrong+'</div>';
      if(it.wrongLog.length){
        h += '<div class="mini" style="color:var(--shu)">過去の誤答：'+
          it.wrongLog.map(function(x){ return esc(jdate(x.at)+" 形式"+x.format+"「"+x.answered+"」"); }).join("／")+'</div>';
      }
      if(it.masteredAt) h += '<div class="mini muted">習得日：'+jdate(it.masteredAt)+'</div>';
      h += '<div class="row" style="margin-top:8px">'+
        '<button class="fav '+(it.fav?"":"off")+'" data-act="fav" data-id="'+k.id+'">★</button>'+
        '<button class="btn sub sm" data-act="google" data-id="'+k.id+'">🔍 Googleで調べる</button></div>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '<div class="sp"></div><button class="btn sub wide" data-act="csv">CSVでダウンロード（14列）</button>';
  h += '</div>';
  return h;
}
var openKp = null;

/* ---------- §3-4 覚えるモード ---------- */
function viewLearn(){
  var pool = scopeKPs();
  var h = header("覚えるモード", '<button data-act="home">ホーム</button>');
  h += '<div class="card"><div class="muted mini">このモードは記録・習得判定・同期にいっさい影響しません。</div>'+
    '<div class="seg" style="margin-top:8px">'+
    '<button class="'+(learn.tab==="list"?"on":"")+'" data-act="ltab" data-v="list">一覧学習</button>'+
    '<button class="'+(learn.tab==="card"?"on":"")+'" data-act="ltab" data-v="card">単語カード</button>'+
    '</div>';
  h += '<div class="row" style="margin-top:8px">';
  ["すべて"].concat(CATS).forEach(function(c){
    h += '<button class="chip'+(UI.category===c?" on":"")+'" data-act="cat" data-v="'+esc(c)+'">'+esc(c)+'</button>';
  });
  h += '</div>';
  h += '<div class="seg" style="margin-top:8px">'+
    '<button class="'+(UI.impFilter==="all"?"on":"")+'" data-act="imp" data-v="all">すべて</button>'+
    '<button class="'+(UI.impFilter==="21"?"on":"")+'" data-act="imp" data-v="21">◎○のみ</button>'+
    '<button class="'+(UI.impFilter==="2"?"on":"")+'" data-act="imp" data-v="2">◎のみ</button></div>';
  h += '<div class="muted mini" style="margin-top:6px">対象 '+pool.length+'語</div></div>';

  if(learn.tab==="list"){
    if(learn.detail!=null && pool[learn.detail]){
      var k = pool[learn.detail], it = peekItem(k.id);
      h += '<div class="card"><div class="muted mini">'+esc(k.cat)+(impMark(k.imp)?' ｜ '+impMark(k.imp):'')+' ｜ '+(learn.detail+1)+'/'+pool.length+'</div>'+
        '<h2 style="font-size:1.2rem;border:none;padding:0;margin:6px 0">'+esc(APP_CFG.kpName(k))+'</h2>'+
        (k.yomi?'<div class="muted mini">'+esc(k.yomi)+'</div>':'')+
        '<div style="margin-top:8px">'+APP_CFG.detail(k)+'</div>'+
        '<div style="margin-top:8px">現在の状態：'+stateBadge(it)+'</div>'+
        '<div class="row" style="margin-top:8px">'+
          '<button class="fav '+(it.fav?"":"off")+'" data-act="fav" data-id="'+k.id+'">★</button>'+
          '<button class="btn sub sm" data-act="google" data-id="'+k.id+'">🔍 Googleで調べる</button></div>'+
        '<div class="nav"><button class="btn sub" data-act="lprev">← 前へ</button>'+
        '<button class="btn sub" data-act="lclose">一覧へ</button>'+
        '<button class="btn sub" data-act="lnext">次へ →</button></div></div>';
    } else {
      var cur = "";
      h += '<div class="card">';
      pool.forEach(function(k,i){
        if(k.cat!==cur){ cur=k.cat; h += '<div class="muted mini" style="margin-top:10px;border-bottom:1px solid var(--line)">'+esc(cur)+'</div>'; }
        var it = peekItem(k.id);
        h += '<div class="acc"><div class="hdr" data-act="ldetail" data-i="'+i+'">'+
          '<span class="t">'+(impMark(k.imp)?'<span class="tag">'+impMark(k.imp)+'</span>':'')+
          (it.fav?'<span class="fav" style="font-size:.9rem">★</span>':'')+esc(APP_CFG.kpName(k))+'</span>'+stateBadge(it)+'</div></div>';
      });
      h += '</div>';
    }
  } else {
    if(!learn.deck || !learn.deck.length) buildDeck(pool);
    if(!learn.deck.length){
      h += '<div class="card center"><p>この範囲のカードをすべて「覚えた」にしました。</p>'+
        '<button class="btn" data-act="ldeck">もう一度</button></div>';
    } else {
      var kk = KPBYID[learn.deck[0]];
      h += '<div class="card"><div class="row" style="justify-content:space-between"><span class="muted mini">のこり '+learn.deck.length+'枚</span>'+
        '<span class="muted mini">出題方向：'+esc(APP_CFG.dirLabel ? APP_CFG.dirLabel(learn.dir)
            : ("形式"+learn.dir+"（"+(learn.dir===FA.key?FA.label:FB.label)+"）"))+'</span></div>'+
        '<div class="sp"></div><div class="cardface" data-act="flip">'+
        (learn.flip ? '<div class="big">'+APP_CFG.cardBack(kk)+'</div>'
                    : '<div class="big">'+APP_CFG.cardFront(kk, learn.dir)+'</div><div class="muted mini" style="margin-top:12px">タップでめくる</div>')+
        '</div>'+
        '<div class="nav"><button class="btn sub" data-act="lstill">まだ</button>'+
        '<button class="btn" data-act="lgot">覚えた</button></div>'+
        '<div class="row" style="margin-top:8px"><button class="btn sub sm" data-act="ldir">出題方向を切りかえ</button>'+
        '<button class="btn sub sm" data-act="ldeck">シャッフルし直す</button>'+
        '<button class="btn sub sm" data-act="google" data-id="'+kk.id+'">🔍 Google</button></div></div>';
    }
  }
  return h;
}
function buildDeck(pool){
  learn.deck = shuffle(pool.map(function(k){return k.id;}));
  learn.flip = false;
}

/* ---------- §14 記録データの管理（設定はポータル・操作はツール） ---------- */
function managePanel(){
  var h = '<div class="card"><h2>記録データの管理</h2>'+syncBoxHTML()+'<div class="sp"></div>';
  h += '<div class="grid2">'+
    '<button class="btn sub" data-act="syncnow">\ud83d\udd04 今すぐ同期</button>'+
    '<button class="btn sub" data-act="pushlist">\ud83d\udccb 全問一覧をDriveへ</button>'+
    '<button class="btn sub" data-act="csv">\ud83d\udcc4 CSVをダウンロード</button>'+
    '<button class="btn sub" data-act="expjson">\ud83d\udce4 記録を書き出す</button>'+
    '<button class="btn sub" data-act="impjson">\ud83d\udce5 記録を読み込む</button>'+
    '<button class="btn warn" data-act="reset">\ud83d\uddd1 このツールの記録を消す</button>'+
    '</div>';
  h += '<div class="sp"></div><a class="btn sub wide" href="'+portalURL()+
       '" style="display:block;text-decoration:none;text-align:center">\u2699 同期設定・ログアウトはポータルへ</a>';
  h += '<div class="sp"></div><div class="mini muted">ID '+esc(AUTH?AUTH.id:"")+
       '　／　ツール識別子 <span class="mono">'+APP+'</span>　／　共通仕様 '+VER+
       '　／　全'+KPS.length+'知識ポイント</div>';
  h += '</div>';
  return h;
}

/* ---------- モーダル ---------- */
function mdl(inner){ return '<div class="modal" data-act="mclose-bg"><div>'+inner+'</div></div>'; }
function confirmModal(text, act, extra){
  return mdl('<h2>確認</h2><p>'+text+'</p>'+(extra||"")+
    '<div class="row"><button class="btn warn" data-act="'+act+'">実行する</button>'+
    '<button class="btn sub" data-act="mclose">やめる</button></div>');
}

/* ============================================================
   イベント
   ============================================================ */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]"); if(!t) return;
  var a = t.getAttribute("data-act"), v = t.getAttribute("data-v"), id = t.getAttribute("data-id");
  window.__sy = window.scrollY;

  switch(a){
  case "home": screen="home"; modal=null; render(); break;
  /* ヘッダーの \ud83d\udc64：出題中は中止確認、それ以外はポータルへ */
  case "portal":
    if(screen==="quiz" && sess && sess.queue.some(function(x){return x.answered;})){
      modal=function(){ return confirmModal("とちゅうでやめると、今回の解答は<b>記録されません</b>。ホームにもどりますか？","abort2"); };
      render(); return;
    }
    if(loggedIn()) location.href = portalURL();
    break;
  case "regate":
    loadAll();
    screen = (ready()&&loggedIn()) ? "home" : "gate";
    render();
    if(ready()&&loggedIn()) pullCloud(true);
    break;

  case "cat": UI.category=v; saveUI(); if(learn){learn.deck=null;} render(); break;
  case "imp": UI.impFilter=v; saveUI(); if(learn){learn.deck=null;} render(); break;

  case "start": startSession(v); break;
  case "learn": learn={tab:"list",detail:null,deck:null,flip:false,dir:FA.key}; screen="learn"; render(); break;
  case "ltab": learn.tab=v; learn.detail=null; render(); break;
  case "ldetail": learn.detail=parseInt(t.getAttribute("data-i"),10); render(); break;
  case "lclose": learn.detail=null; render(); break;
  case "lprev": if(learn.detail>0) learn.detail--; render(); break;
  case "lnext": { var pl=scopeKPs(); if(learn.detail<pl.length-1) learn.detail++; render(); break; }
  case "flip": learn.flip=!learn.flip; render(); break;
  case "lgot": learn.deck.shift(); learn.flip=false; render(); break;
  case "lstill": learn.deck.push(learn.deck.shift()); learn.flip=false; render(); break;
  case "ldir": learn.dir = otherFmt(learn.dir); learn.flip=false; render(); break;
  case "ldeck": buildDeck(scopeKPs()); render(); break;

  case "ans": {
    var i = parseInt(t.getAttribute("data-i"),10);
    var e = sess.queue[sess.idx];
    if(!e.answered && sess.idx===sess.pos) answer(i);
    else if(canReanswer()) reanswer(i);
    break; }
  case "next": next(); break;
  case "back": if(sess.idx>0){ sess.idx--; jump=true; render(); } break;
  case "fwd": if(sess.idx<sess.pos){ sess.idx++; jump=true; render(); } break;
  case "abort": modal=function(){ return confirmModal("とちゅうでやめると、今回の解答は<b>記録されません</b>。ホームにもどりますか？","abort2"); }; render(); break;
  case "abort2": sess=null; modal=null; screen="home"; render(); break;

  case "fav": { var it=itemOf(id); it.fav=!it.fav; saveDB(); render(); break; }
  case "google": { var k=KPBYID[id];
    window.open("https://www.google.com/search?q="+encodeURIComponent(APP_CFG.searchQ(k)), "_blank"); break; }

  case "open": openKp = (openKp===id)?null:id; render(); break;
  case "lcat": listFilter.cat=v; render(); break;
  case "lst": listFilter.state=v; render(); break;
  case "lsort": listFilter.sort=v; render(); break;
  case "csv": downloadCSV(); break;

  case "expjson":
    dl(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}),
       APP_CFG.title+"記録_"+(AUTH?AUTH.id:"")+"_"+ymd()+".json");
    break;
  case "impjson": {
    var inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
    inp.onchange=function(){ var f=inp.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        var j; try{ j=JSON.parse(rd.result);}catch(err){ alert("JSONを読み取れませんでした"); return; }
        if(j.app && j.app!==APP){ alert("このファイルは別のツール（"+j.app+"）の記録です。"); return; }
        /* §H 他人のIDのファイルは弾く */
        var pin = (j.progress||{})[AUTH.id];
        if(!pin){
          modal=function(){ return mdl('<h2>このIDの記録がありません</h2><p>このファイルには ID '+esc(AUTH.id)+
            ' の記録が入っていません（別のお子さんの記録の可能性があります）。</p>'+
            '<button class="btn" data-act="mclose">閉じる</button>'); };
          render(); return;
        }
        window.__imp = normProgress(pin);
        modal=function(){ return confirmModal(
          "読み込んだ記録で<b>置き換え</b>ます。今の記録は消えます。","impjson2",
          '<div class="mini muted">ID：'+esc(AUTH.id)+'　／　'+Object.keys(window.__imp.items).length+'語'+
          '<br>保存日時：'+esc(jdatetime(j.updatedAt))+'</div>'); };
        render();
      };
      rd.readAsText(f);
    };
    inp.click(); break; }
  case "impjson2":
    DB.progress[AUTH.id]=window.__imp; saveDB(); pushCloud(true); modal=null; render(); break;

  case "reset": modal=function(){ return confirmModal(
      "<b>このツールの記録</b>（ID "+esc(AUTH.id)+"）をすべて消します。もとにもどせません。","reset2"); };
    render(); break;
  case "reset2":
    DB.progress[AUTH.id]={items:{},sessions:[]}; saveDB(); pushCloud(true);
    modal=null; screen="home"; render(); break;

  case "syncnow": pullCloud(); break;
  case "pushlist": {
    if(!ready()) return;
    setSync("☁… 一覧を書き出しています","");
    /* §15 空上書き防止：書き出し前に必ず fetch する */
    api({action:'fetch', app:APP, id:AUTH.id, pw:AUTH.pw}).then(function(j){
      if(j && j.ok){
        var cloudP = normProgress((((j.data||{}).progress)||{})[AUTH.id]);
        if(!progHasRecords(prog()) && progHasRecords(cloudP)){
          DB.progress[AUTH.id]=cloudP; saveDB({fromCloud:true}); render();
        }
      } else if(j && j.error==="auth"){ setSync("☁⚠ "+apiError(j),"err"); onAuthLost(); return; }
      if(!progHasRecords(prog())){
        modal=function(){ return mdl('<h2>書き出しを中止しました</h2><p>記録がまだありません。空の一覧でスプレッドシートを上書きしないよう中止しました。</p><button class="btn" data-act="mclose">閉じる</button>'); };
        setSync("☁⚠ 記録が無いため書き出しを中止しました","err"); render(); return;
      }
      return api({app:APP, id:AUTH.id, list:{header:HEADER14, rows:rows14()}}).then(function(r){
        setSync(r.ok ? "☁✓ 全問一覧をスプレッドシートに書き出しました" : ("☁⚠ "+apiError(r)), r.ok?"ok":"err");
      });
    }).catch(function(){ setSync("☁ オフライン（書き出しできません）","err"); });
    break; }

  case "mclose": modal=null; render(); break;
  case "mclose-bg": if(ev.target===t){ modal=null; render(); } break;
  }
});

/* ============================================================
   起動
   ============================================================ */
loadAll();
if(ready() && loggedIn()) setSync("☁… クラウドと同期しています","");
render();
if(ready() && loggedIn()) pullCloud(true);

/* 他のツール／ポータルでログイン状態が変わったら追従する（出題中は割り込まない） */
window.addEventListener("storage", function(ev){
  if(ev.key!==K_AUTH && ev.key!==K_SYNC) return;
  if(screen==="quiz" && sess && sess.queue.some(function(x){return x.answered;})) return;
  loadAll();
  screen = (ready()&&loggedIn()) ? (screen==="gate"?"home":screen) : "gate";
  render();
});

window.__DEBUG = { get DB(){return DB;}, get sess(){return sess;}, get AUTH(){return AUTH;},
  KPS:KPS, mergeProgress:mergeProgress, mergeItem:mergeItem, normProgress:normProgress,
  requiredStreak:requiredStreak, startSession:startSession, loadAll:loadAll,
  answer:function(i){ answer(i); }, next:function(){ next(); },
  get screen(){return screen;} };
})();

</script>
