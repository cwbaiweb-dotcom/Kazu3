<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和語マスター｜中学受験 語句の知識</title>
<style>
:root{
  --washi:#F6F2E7; --washi-deep:#EDE6D3; --card:#FFFDF7;
  --ai:#28466E; --ai-deep:#1B3252; --ai-pale:#EEF2F8;
  --shu:#C0463C; --shu-pale:#F9EFED;
  --matsu:#3E7154; --matsu-pale:#EFF5EF;
  --kincha:#B8802E; --kincha-pale:#FBF4E4;
  --sumi:#2B2A26; --usuzumi:#7A756A; --line:#D9D0BA;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--washi);
  background-image:radial-gradient(rgba(43,42,38,.025) 1px,transparent 1px);background-size:22px 22px;
  color:var(--sumi);line-height:1.6;min-height:100vh;font-size:16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.app{max-width:660px;margin:0 auto;padding:14px 14px 60px}

/* warn bar */
.warnbar{display:none;background:var(--kincha-pale);border:1.5px solid var(--kincha);color:#7a5416;
  border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.55;margin-bottom:12px}
.warnbar.show{display:block}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.hanko{width:44px;height:44px;border-radius:8px;background:var(--shu);color:#FFF8ED;font-family:var(--serif);
  font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;
  letter-spacing:2px;box-shadow:0 2px 0 rgba(0,0,0,.12);flex-shrink:0}
.brand h1{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--usuzumi);font-weight:400;letter-spacing:.13em}
.chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--ai-deep);flex-shrink:0}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--ai)}

.screen{display:none}
.screen.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.lbl{font-size:11.5px;letter-spacing:.2em;color:var(--usuzumi);font-weight:700;margin:20px 0 9px;
  display:flex;align-items:center;gap:9px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.lbl:first-child{margin-top:4px}

/* generic cards */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:14px}
.row{display:flex;align-items:center;gap:12px}

/* accounts */
.acc-card{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);
  border-radius:13px;padding:14px 15px;text-align:left;width:100%;margin-bottom:10px}
.acc-card.active{border-color:var(--ai);box-shadow:inset 0 0 0 1.5px var(--ai)}
.avatar{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:23px;font-weight:700;color:#FFF8ED;flex-shrink:0;background:var(--ai)}
.acc-info{flex:1;min-width:0}
.acc-name{font-size:16.5px;font-weight:700}
.acc-sub{font-size:12px;color:var(--usuzumi)}
.icon-btn{font-size:12px;color:var(--usuzumi);padding:9px 7px;border-radius:8px;flex-shrink:0}
.icon-btn:active{background:var(--washi-deep)}
.add-btn{width:100%;border:1.5px dashed var(--line);border-radius:13px;padding:14px;font-size:14.5px;
  font-weight:700;color:var(--usuzumi);background:transparent}

/* mode + category */
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.seg button{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:11px 4px;
  font-size:13px;font-weight:700;color:var(--usuzumi);line-height:1.35}
.seg button b{display:block;font-size:15px;color:inherit}
.seg button.on{border-color:var(--ai);color:var(--ai-deep);background:var(--ai-pale);box-shadow:inset 0 0 0 1px var(--ai)}
.cat-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
  border-radius:13px;padding:12px 14px;text-align:left;width:100%;margin-bottom:9px}
.cat-card.on{border-color:var(--ai);box-shadow:inset 0 0 0 1.5px var(--ai);background:#F4F7FB}
.cat-mark{width:42px;height:42px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:18px;color:#FFF8ED;writing-mode:vertical-rl;letter-spacing:1px;line-height:1}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:15px;font-weight:700}
.cat-detail{font-size:11.5px;color:var(--usuzumi);display:flex;align-items:center;gap:8px;margin-top:3px}
.bar{flex:1;max-width:150px;height:7px;background:var(--washi-deep);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.m{background:var(--kincha)}
.bar i.p{background:#DCC98F}
.cat-count{font-size:11.5px;font-weight:700;color:var(--kincha);white-space:nowrap}
.overall{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--usuzumi);margin-top:4px;padding:0 2px}
.overall b{color:var(--kincha);font-size:15px}

/* start */
.start-area{display:grid;gap:9px;margin-top:18px}
.big-btn{background:var(--ai);color:#FFF8ED;font-size:16.5px;font-weight:700;letter-spacing:.1em;
  border-radius:13px;padding:16px;box-shadow:0 3px 0 var(--ai-deep)}
.big-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ai-deep)}
.big-btn:disabled{opacity:.45;box-shadow:none}
.sub-btn{background:var(--card);border:1.5px solid var(--ai);color:var(--ai-deep);font-size:14.5px;
  font-weight:700;border-radius:12px;padding:12px}
.sub-btn:disabled{opacity:.4}
.mini-btn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;
  font-size:12.5px;font-weight:700;color:var(--sumi)}
.mini-btn:active{background:var(--washi-deep)}
.hint{font-size:11.5px;color:var(--usuzumi);margin-top:6px;line-height:1.5}

/* ranking */
.rank-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.rank-item:last-child{border-bottom:none}
.rank-no{width:22px;font-family:var(--serif);font-weight:700;color:var(--usuzumi);font-size:13px;flex-shrink:0}
.rank-w{flex:1;font-family:var(--serif);font-size:16px;font-weight:700;min-width:0}
.rank-n{font-size:11.5px;font-weight:700;color:var(--shu);background:var(--shu-pale);border-radius:99px;padding:2px 9px;flex-shrink:0}

/* sync panel */
.sync-status{font-size:12.5px;font-weight:700;padding:9px 11px;border-radius:9px;background:var(--washi-deep);
  color:var(--usuzumi);line-height:1.5;word-break:break-word}
.sync-status.ok{background:var(--matsu-pale);color:var(--matsu)}
.sync-status.err{background:var(--shu-pale);color:var(--shu)}
.sync-status.busy{background:var(--ai-pale);color:var(--ai-deep)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-grid .wide{grid-column:1/-1}

/* quiz */
.qbar-wrap{margin-bottom:12px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.quit-btn{font-size:12.5px;color:var(--usuzumi);padding:7px 9px;border-radius:8px;flex-shrink:0}
.track{flex:1;height:8px;background:var(--washi-deep);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ai);border-radius:99px;transition:width .3s}
.qstats{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--usuzumi);font-weight:700;flex-wrap:wrap}
.qstats .ok{color:var(--matsu)}
.qstats .ng{color:var(--shu)}
.qstats .sep{color:var(--line)}
.nav-row{display:flex;gap:8px;margin-bottom:10px}
.nav-row button{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px;
  font-size:12.5px;font-weight:700;color:var(--usuzumi)}
.nav-row button:disabled{opacity:.35}
.review-banner{background:var(--kincha-pale);border:1.5px solid var(--kincha);color:#7a5416;border-radius:10px;
  padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:10px}
.q-card{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:24px 18px;
  text-align:center;position:relative;overflow:hidden}
.q-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--ai)}
.q-type{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ai-deep);
  background:var(--ai-pale);border-radius:99px;padding:4px 13px;margin-bottom:12px}
.q-word{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:.04em;line-height:1.3}
.q-meaning{font-size:17.5px;font-weight:600;line-height:1.75;text-align:left}
.gauge{margin-top:11px;font-size:11.5px;color:var(--kincha);font-weight:700;letter-spacing:.1em;min-height:17px}
.choices{display:grid;gap:9px;margin-top:14px}
.choice{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;
  font-size:15px;font-weight:600;text-align:left;line-height:1.55;display:flex;gap:11px;align-items:flex-start;width:100%}
.choice .kigo{font-family:var(--serif);font-weight:700;color:var(--usuzumi);flex-shrink:0;width:25px;height:25px;
  border:1.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;margin-top:1px}
.choice.wordmode{justify-content:center;text-align:center;font-family:var(--serif);font-size:19px}
.choice.wordmode .kigo{margin-top:0}
.choice.correct{border-color:var(--matsu);background:var(--matsu-pale);color:var(--matsu)}
.choice.correct .kigo{border-color:var(--matsu);color:var(--matsu)}
.choice.wrong{border-color:var(--shu);background:var(--shu-pale);color:var(--shu)}
.choice.wrong .kigo{border-color:var(--shu);color:var(--shu)}
.choice.dim{opacity:.42}
.choice:disabled{cursor:default}
.feedback{margin-top:13px;border-radius:13px;padding:16px;border:1.5px solid;display:none}
.feedback.show{display:block;animation:fade .2s ease}
.feedback.good{background:var(--matsu-pale);border-color:var(--matsu)}
.feedback.bad{background:var(--shu-pale);border-color:var(--shu)}
.fb-head{font-size:18px;font-weight:800;letter-spacing:.05em}
.feedback.good .fb-head{color:var(--matsu)}
.feedback.bad .fb-head{color:var(--shu)}
.fb-word{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:8px}
.fb-word span{font-size:13px;color:var(--usuzumi);font-weight:400;margin-left:7px}
.fb-mean{font-size:14px;margin-top:3px}
.fb-ex{margin-top:9px;background:rgba(255,255,255,.72);border-radius:9px;padding:9px 13px;font-size:13.5px;line-height:1.7}
.fb-ex b{color:var(--ai-deep)}
.fb-ex::before{content:"例 ";font-size:10.5px;font-weight:700;color:var(--usuzumi);letter-spacing:.14em}
.fb-note{margin-top:9px;font-size:13px;font-weight:700;color:var(--kincha)}
.next-btn{margin-top:12px;width:100%;background:var(--sumi);color:#FFF8ED;font-size:15px;font-weight:700;
  letter-spacing:.09em;border-radius:11px;padding:13px}

/* result */
.res-head{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:26px 18px;text-align:center}
.res-title{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.07em}
.res-score{font-family:var(--serif);font-size:50px;font-weight:700;color:var(--ai);margin:4px 0 0}
.res-score small{font-size:18px;color:var(--usuzumi)}
.res-sub{font-size:13px;color:var(--usuzumi)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.res-cell{background:var(--washi-deep);border-radius:10px;padding:9px 4px}
.res-cell b{display:block;font-size:19px;font-family:var(--serif)}
.res-cell span{font-size:10.5px;color:var(--usuzumi);letter-spacing:.08em}
.stamp{margin:14px auto 0;width:80px;height:80px;border:3px solid var(--shu);border-radius:50%;color:var(--shu);
  font-family:var(--serif);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;
  transform:rotate(-8deg);letter-spacing:2px;opacity:0}
.stamp.show{animation:stamp .4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(2)}to{opacity:.92;transform:rotate(-8deg) scale(1)}}
.tag{display:inline-block;background:var(--kincha-pale);border:1.5px solid var(--kincha);color:var(--kincha);
  font-family:var(--serif);font-weight:700;font-size:14px;border-radius:99px;padding:4px 13px;margin:0 6px 6px 0}
.wrong-item{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--shu);
  border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.65}
.wrong-item .w{font-family:var(--serif);font-size:16.5px;font-weight:700}
.wrong-item .fm{font-size:10.5px;font-weight:700;color:var(--usuzumi);background:var(--washi-deep);
  border-radius:99px;padding:2px 8px;margin-left:7px;letter-spacing:.06em}
.wrong-item .ans{color:var(--shu);font-weight:700}
.wrong-item .cor{color:var(--matsu);font-weight:700}

/* all list */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.filters select{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:8px 9px;
  font-size:12.5px;font-weight:700;color:var(--sumi)}
.kp-row{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;
  text-align:left;width:100%;display:block}
.kp-row.danger{background:var(--shu-pale);border-color:var(--shu)}
.kp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kp-w{font-family:var(--serif);font-size:16px;font-weight:700}
.kp-cat{font-size:10px;color:#FFF8ED;border-radius:99px;padding:2px 8px;font-weight:700}
.badge{font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 9px;letter-spacing:.04em}
.badge.m{background:var(--kincha-pale);color:var(--kincha);border:1px solid var(--kincha)}
.badge.p{background:var(--ai-pale);color:var(--ai-deep);border:1px solid var(--ai)}
.badge.n{background:var(--washi-deep);color:var(--usuzumi);border:1px solid var(--line)}
.badge.x{background:#fff;color:var(--shu);border:1px solid var(--shu)}
.badge.warn{background:var(--shu);color:#FFF8ED}
.kp-mean{font-size:12.5px;color:var(--usuzumi);margin-top:3px;line-height:1.5}
.kp-detail{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.7;display:none}
.kp-detail.open{display:block}
.kp-detail .k{color:var(--usuzumi);font-weight:700;letter-spacing:.05em}

/* modal */
.modal-root{position:fixed;inset:0;background:rgba(43,42,38,.55);display:none;align-items:center;
  justify-content:center;padding:18px;z-index:50}
.modal-root.show{display:flex}
.modal{background:var(--card);border-radius:15px;padding:20px;width:100%;max-width:420px;max-height:86vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:9px}
.modal .body{font-size:13.5px;line-height:1.7;color:var(--sumi)}
.modal .body p{margin-bottom:8px}
.modal input[type=text],.modal input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:9px;
  padding:11px;margin-top:7px;background:#fff}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--usuzumi);margin-top:11px}
.modal .acts{display:grid;gap:8px;margin-top:16px}
.modal .acts button{border-radius:11px;padding:12px;font-size:14.5px;font-weight:700}
.m-primary{background:var(--ai);color:#FFF8ED}
.m-danger{background:var(--shu);color:#FFF8ED}
.m-ghost{background:var(--washi-deep);color:var(--sumi)}

/* 覚えるモード */
.study-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.study-tools select{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:9px;
  font-size:12.5px;font-weight:700;color:var(--sumi);width:100%}
.view-toggle{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--line);border-radius:10px;
  overflow:hidden;background:var(--card);margin-bottom:12px}
.view-toggle button{padding:9px;font-size:12.5px;font-weight:700;color:var(--usuzumi)}
.view-toggle button.on{background:var(--ai);color:#FFF8ED}
.s-count{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;color:var(--usuzumi);margin-bottom:8px}
.s-count .track{height:6px}
.scard{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:26px 20px;
  position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:center;
  text-align:center;cursor:pointer;width:100%}
.scard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--kincha)}
.s-badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.s-word{font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:.04em;line-height:1.3}
.s-word em{display:block;font-style:normal;font-size:13px;color:var(--usuzumi);font-family:var(--sans);
  font-weight:400;letter-spacing:.1em;margin-top:6px}
.s-mean{font-size:18px;font-weight:600;line-height:1.8;text-align:left}
.s-hint{margin-top:16px;font-size:11px;color:var(--usuzumi);letter-spacing:.14em;font-weight:700}
.s-back{display:none;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);text-align:left}
.s-back.show{display:block;animation:fade .22s ease}
.s-ans{font-family:var(--serif);font-size:28px;font-weight:700;text-align:center;line-height:1.35}
.s-ans span{font-size:14px;color:var(--usuzumi);font-weight:400;font-family:var(--sans);margin-left:7px}
.s-bmean{font-size:15px;line-height:1.75;margin-top:4px}
.s-ex{margin-top:11px;background:var(--washi-deep);border-radius:9px;padding:10px 13px;font-size:13.5px;line-height:1.75}
.s-ex b{color:var(--ai-deep)}
.s-ex::before{content:"例文 ";font-size:10px;font-weight:700;color:var(--usuzumi);letter-spacing:.14em}
.s-nav{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:11px}
.s-nav button{border-radius:12px;padding:14px;font-size:15px;font-weight:700}
.s-prev{background:var(--card);border:1.5px solid var(--line);color:var(--sumi)}
.s-next{background:var(--ai);color:#FFF8ED;box-shadow:0 3px 0 var(--ai-deep)}
.s-next:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ai-deep)}
.s-prev:disabled{opacity:.35}
.tiny-info{font-size:10.5px;color:var(--usuzumi);line-height:1.7;margin-top:9px;text-align:center;letter-spacing:.03em}
.gate-list{padding-left:1.2em;line-height:2;font-size:12.5px;color:var(--usuzumi);margin-top:4px}
footer{margin-top:32px;text-align:center;font-size:10.5px;color:var(--usuzumi);letter-spacing:.08em;line-height:1.7}
@media (max-width:380px){.q-word{font-size:31px}.seg button{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="warnbar" id="warnBar"></div>
  <div class="header">
    <div class="brand">
      <div class="hanko">和語</div>
      <h1>和語マスター<small>ごくの ちしき ／ 中学受験</small></h1>
    </div>
    <button class="chip" id="chip" onclick="chipClick()" style="display:none">

function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—";
  const p=n=>("0"+n).slice(-2); return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }

/* ---------- 保存キー（4本で固定。増やさない） ---------- */
const K_DB = APP_ID, K_UI = APP_ID + ":ui", K_SYNC = "kj-quiz:sync", K_AUTH = "kj-quiz:auth";

/* ---------- 状態 ---------- */
let db = null, UI = null, SYNC = null, AUTH = null;

function blankDB(){
  return { app:APP_ID, version:2, updatedAt:nowISO(), activeAccountId:null, accounts:[], progress:{},
           initialSyncAt:null, syncedId:null };
}
function blankItem(){
  return { streak:0, mastered:false, masteredAt:null, lastFormat:null,
    totalCorrect:0, totalWrong:0,
    byFormat:{ A:{correct:0,wrong:0}, B:{correct:0,wrong:0} },
    wrongLog:[], lastSeenAt:null };
}
const newItem = blankItem;
function normItem(x){
  const o = blankItem();
  if(!x || typeof x!=="object") return o;
  for(const k in o) if(x[k]!==undefined) o[k]=x[k];
  o.byFormat = { A:{correct:0,wrong:0}, B:{correct:0,wrong:0} };
  ["A","B"].forEach(f=>{
    const src = (x.byFormat&&x.byFormat[f]) || {};
    o.byFormat[f].correct = src.correct||0;
    o.byFormat[f].wrong   = src.wrong||0;
  });
  o.wrongLog = Array.isArray(x.wrongLog) ? x.wrongLog.filter(w=>w&&w.at) : [];
  o.totalCorrect = o.totalCorrect||0; o.totalWrong = o.totalWrong||0; o.streak = o.streak||0;
  return o;
}
function normProgress(p){
  const o = {items:{}, sessions:[]};
  if(!p || typeof p!=="object") return o;
  const items = p.items || {};
  Object.keys(items).forEach(k=>{ o.items[k] = normItem(items[k]); });
  o.sessions = Array.isArray(p.sessions) ? p.sessions.filter(s=>s&&s.finishedAt) : [];
  return o;
}

/* 端末に持つのは常に「ログイン中のID 1件だけ」。他のIDは読み捨てる */
function buildDB(raw){
  const d = blankDB();
  if(!AUTH) return d;
  d.activeAccountId = AUTH.id;
  const a = { id:AUTH.id, name:AUTH.id, label:AUTH.label||AUTH.id };
  const src = raw && Array.isArray(raw.accounts)
    ? raw.accounts.filter(x=>String(x.id)===AUTH.id)[0] : null;
  if(src && src.createdAt) a.createdAt = src.createdAt;
  d.accounts = [a];
  d.progress[AUTH.id] = normProgress(raw && raw.progress ? raw.progress[AUTH.id] : null);
  d.updatedAt = (raw && raw.updatedAt) || nowISO();
  /* 「この端末でこのIDがサーバーと初回合流を済ませたか」。IDが変わればやり直す */
  if(raw && String(raw.syncedId||"")===AUTH.id && raw.initialSyncAt){
    d.syncedId = AUTH.id; d.initialSyncAt = raw.initialSyncAt;
  }
  return d;
}

function loadAll(){
  /* 同期設定：共通キー。無ければ旧キーから引き継ぐ（v2.1からの移行） */
  SYNC = jparse(lsGet(K_SYNC));
  if(!SYNC || !SYNC.url){
    const old = jparse(lsGet(APP_ID + ":sync"));
    if(old && old.url){
      SYNC = {url:old.url, key:old.key||"", lastSync:old.lastSync||null};
      lsSet(K_SYNC, JSON.stringify(SYNC));
    }
  }
  if(!SYNC || typeof SYNC!=="object") SYNC = {url:"", key:"", lastSync:null};

  AUTH = jparse(lsGet(K_AUTH));
  if(!AUTH || !AUTH.id || !AUTH.pw) AUTH = null;
  if(AUTH) AUTH.id = String(AUTH.id);

  db = buildDB(jparse(lsGet(K_DB)));

  UI = jparse(lsGet(K_UI)) || {};
  if(UI.mode==="10q"||UI.mode==="20q"||UI.mode==="all") uiMode = UI.mode;
  uiCat = UI.cat || null;
}

  if(p.sessions.length>0) return true;

function stateOf(it){
  if(it.mastered) return "mastered";
  if((it.totalCorrect+it.totalWrong)===0) return "new";
  if(it.streak>0) return "partial";
  return "wrong";
}
function stateText(it){
  const s = stateOf(it);
  if(s==="mastered") return "習得済み";
  if(s==="new") return "未出題";
  if(s==="partial") return it.streak+"回正解";
  return "誤答";
}

/* ============================================================
   合流（1アカウント用）
   ============================================================ */
function mergeItem(a,b){
  if(!a) return normItem(b);
  if(!b) return normItem(a);
  a = normItem(a); b = normItem(b);
  const o = blankItem();
  o.totalCorrect = Math.max(a.totalCorrect, b.totalCorrect);
  o.totalWrong   = Math.max(a.totalWrong,   b.totalWrong);
  ["A","B"].forEach(f=>{
    o.byFormat[f].correct = Math.max(a.byFormat[f].correct, b.byFormat[f].correct);
    o.byFormat[f].wrong   = Math.max(a.byFormat[f].wrong,   b.byFormat[f].wrong);
  });
  o.mastered = a.mastered || b.mastered;
  if(a.masteredAt && b.masteredAt)
    o.masteredAt = (new Date(a.masteredAt) <= new Date(b.masteredAt)) ? a.masteredAt : b.masteredAt;
  else o.masteredAt = a.masteredAt || b.masteredAt || null;
  if(o.mastered && !o.masteredAt) o.masteredAt = nowISO();
  const seen = {}, log = [];
  a.wrongLog.concat(b.wrongLog).forEach(w=>{ const k = w.at+"|"+w.format; if(!seen[k]){ seen[k]=1; log.push(w); } });
  log.sort((x,y)=> new Date(y.at) - new Date(x.at));
  o.wrongLog = log.slice(0,5).reverse();
  const at = a.lastSeenAt ? new Date(a.lastSeenAt).getTime() : 0;
  const bt = b.lastSeenAt ? new Date(b.lastSeenAt).getTime() : 0;
  const newer = (at>=bt) ? a : b;                      /* streak は最後に解いた端末を採用 */
  o.lastSeenAt = newer.lastSeenAt || a.lastSeenAt || b.lastSeenAt || null;
  o.streak     = newer.streak;
  o.lastFormat = newer.lastFormat;
  return o;
}
function mergeProgress(L,C){
  L = normProgress(L); C = normProgress(C);
  const M = {items:{}, sessions:[]}, ids = {};
  Object.keys(L.items).forEach(k=>{ids[k]=1;});
  Object.keys(C.items).forEach(k=>{ids[k]=1;});
  Object.keys(ids).forEach(k=>{ M.items[k] = mergeItem(L.items[k], C.items[k]); });
  const seen = {}, ss = [];
  L.sessions.concat(C.sessions).forEach(s=>{ if(!seen[s.finishedAt]){ seen[s.finishedAt]=1; ss.push(s); } });
  ss.sort((x,y)=> new Date(y.finishedAt) - new Date(x.finishedAt));
  M.sessions = ss.slice(0,100).reverse();
  return M;
}

/* ============================================================
   同期API（POST固定。action: fetch / save）
   ============================================================ */
let syncState = {cls:"", msg:""};
function setSync(cls, msg){
  syncState = {cls, msg};
  const el = $("syncStatus"); if(!el) return;
  const last = (SYNC && SYNC.lastSync) ? "　｜　最終同期 " + fmtDateTime(SYNC.lastSync) : "";
  el.className = "sync-status" + (cls==="ok" ? " ok" : cls==="ng" ? " err" : cls==="busy" ? " busy" : "");
  el.textContent = msg + last;
}
async function api(body){
  const r = await fetch(SYNC.url, { method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({key:SYNC.key}, body)) });
  const txt = await r.text();
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error("GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください"); }
}
function apiError(j){
  const e = String((j&&j.error)||"");
  if(e==="auth") return "ログインが無効になりました。ポータルでログインし直してください";
  if(/合言葉|key/i.test(e)) return "合言葉が違います";
  return e || "エラー";
}
function onAuthLost(){ lsDel(K_AUTH); AUTH = null; db = buildDB(null); go("gate"); }

/* ---------- pull（初回はサーバーの記録をそのまま取り込む） ---------- */
async function pullCloud(opt){
  opt = opt || {};
  if(!ready() || !AUTH){ if(opt.manual) setSync("ng","☁⚠ ポータルでログインしてください"); return false; }
  const first = !db.initialSyncAt;
  if(!opt.silent) setSync("busy", first ? "☁… サーバーから記録をダウンロードしています" : "☁… クラウドと同期しています");
  let j;
  try{ j = await api({action:"fetch", app:APP_ID, id:AUTH.id, pw:AUTH.pw}); }
  catch(e){
    if(/GASの応答/.test(e.message)) setSync("ng","☁⚠ "+e.message);
    else setSync("", first ? "☁ オフライン（サーバーの記録はまだ取り込めていません）"
                           : "☁ オフライン（ローカルには保存済み）");
    renderGateBanner(); return false;
  }
  if(!j.ok){
    if(j.error==="auth"){ setSync("ng","☁⚠ "+apiError(j)); onAuthLost(); return false; }
    setSync("ng","☁⚠ "+apiError(j)); renderGateBanner(); return false;
  }
  const cloudP = normProgress(((j.data||{}).progress||{})[AUTH.id]);
  const localP = progRO();
  const before = JSON.stringify(localP);
  /* この端末に記録が無ければサーバーの内容をそのまま採用。あれば合流 */
  const localEmpty = !hasRecords();
  const merged = localEmpty ? cloudP : mergeProgress(localP, cloudP);
  db.progress[AUTH.id] = merged;
  if(j.label){ AUTH.label = j.label; lsSet(K_AUTH, JSON.stringify(AUTH)); db.accounts[0].label = j.label; }
  const cd = (j.data||{}).accounts && j.data.accounts[0];
  if(cd && cd.createdAt) db.accounts[0].createdAt = cd.createdAt;
  db.initialSyncAt = nowISO(); db.syncedId = AUTH.id;
  saveDB({fromCloud:true});
  SYNC.lastSync = nowISO(); saveSyncCfg();

  const n = Object.keys(merged.items).length;
  const mn = Object.keys(merged.items).filter(k=>merged.items[k].mastered).length;
  if(first && localEmpty)
    setSync("ok", n>0 ? "☁✓ サーバーの記録を取り込みました（"+n+"語・習得"+mn+"）"
                      : "☁✓ 同期しました（サーバーにはまだ記録がありません）");
  else
    setSync("ok","☁✓ クラウドと合流しました（"+n+"語・習得"+mn+"）");
  refreshAll();
  if(before !== JSON.stringify(merged)) await pushCloud(true, syncState.msg);
  return true;
}

/* ---------- push（自分のID 1件だけ。初回合流前は送らない） ---------- */
async function pushCloud(silent, okMsg){
  if(!ready() || !AUTH) return false;
  /* サーバーの記録をまだ取り込んでいない端末は、先に取り込んでからでないと送らない
     （新しい端末の少ない記録で、サーバーの記録を上書きしてしまう事故を防ぐ） */
  if(!db.initialSyncAt){
    const got = await pullCloud({silent:true});
    if(!got){ setSync("", "☁ サーバーの記録をまだ取り込めていないため、送信を見あわせました（ローカルには保存済み）"); return false; }
  }
  if(!silent) setSync("busy","☁… 送信しています");
  let j;
  try{ j = await api({action:"save", app:APP_ID, id:AUTH.id, pw:AUTH.pw,
        account:db.accounts[0], progress:prog()}); }
  catch(e){
    if(/GASの応答/.test(e.message)) setSync("ng","☁⚠ "+e.message);
    else setSync("","☁ オフライン（ローカルには保存済み。次につながったときに送ります）");
    return false;
  }
  if(!j.ok){
    if(j.error==="auth"){ setSync("ng","☁⚠ "+apiError(j)); onAuthLost(); return false; }
    setSync("ng","☁⚠ "+apiError(j)); return false;
  }
  SYNC.lastSync = nowISO(); saveSyncCfg();
  setSync("ok", okMsg || "☁✓ クラウドに保存しました");
  return true;
}

/* ---------- 全問一覧の書き出し ---------- */
const LIST_HEADER = ["名前","カテゴリー","記号","知識ポイント","よみがな","重要度","状態",
  "累計正解数","累計誤答数","形式A誤答数","形式B誤答数","過去の誤答内容","最終誤答日","習得日"];
function rowFor(w, it){
  it = it || blankItem();
  const lastWrong = it.wrongLog.length ? it.wrongLog[it.wrongLog.length-1].at : "";
  return [ AUTH?AUTH.id:"", CATMAP[w.c].name, CATMAP[w.c].mark, w.w, w.y, "",
    stateText(it), it.totalCorrect, it.totalWrong,
    it.byFormat.A.wrong, it.byFormat.B.wrong,
    it.wrongLog.map(l=>l.answered).join(";"),
    fmtDate(lastWrong), fmtDate(it.masteredAt) ];
}
function buildListRows(){
  const items = progRO().items;
  return WORDS.map(w=>rowFor(w, items[w.id]));
}
async function exportList(){
  if(!ready() || !AUTH){ setSync("ng","☁⚠ ポータルでログインしてください"); return; }
  await pullCloud({silent:true});                       /* 空上書き防止：必ず先に取り込む */

      html:"<p>この端末にもサーバーにも、まだ学習記録がありません。</p><p>空のデータで既存の一覧シートを上書きしないよう、書き出しを中止しました。学習を1回終えてから、もう一度お試しください。</p>",
      acts:[{label:"閉じる", kind:"m-ghost"}] });

  }

  try{ j = await api({app:APP_ID, id:AUTH.id, list:{header:LIST_HEADER, rows:buildListRows()}}); }
  catch(e){ setSync("ng","☁⚠ "+e.message); return; }
  if(!j.ok){ setSync("ng","☁⚠ "+apiError(j)); return; }
  SYNC.lastSync = nowISO(); saveSyncCfg();

}

/* ============================================================
   出題エンジン（§2・§3・§4・§5）
   ============================================================ */
let S = null;   /* セッション（一時領域。完走時のみ永続化） */

function priorityCmp(a,b){
  const ia = peek(a.id), ib = peek(b.id);
  if(ib.totalWrong !== ia.totalWrong) return ib.totalWrong - ia.totalWrong;   /* ①誤答が多い */
  const ua = (ia.totalCorrect+ia.totalWrong)===0, ub = (ib.totalCorrect+ib.totalWrong)===0;
  if(ua !== ub) return ua ? -1 : 1;                                           /* ②未出題 */
  const la = ia.lastSeenAt||"", lb = ib.lastSeenAt||"";
  return la<lb ? -1 : la>lb ? 1 : 0;                                          /* ③最終出題が古い */
}
function otherFmt(f){ return f==="A" ? "B" : "A"; }
function firstFmt(kpId){
  const last = peek(kpId).lastFormat;
  return last ? otherFmt(last) : (Math.random()<0.5 ? "A" : "B");
}

function startSession(opt){
  if(!ready() || !loggedIn()){ go("gate"); return; }
  const mode = opt.mode;
  let kps, want = 0, shortage = null;

  if(mode==="all"){
    kps = shuffle(catWords(opt.cat));
  }else if(mode==="review"){
    const items = progRO().items;
    kps = WORDS.filter(w=>items[w.id] && items[w.id].totalWrong>0)
      .sort((a,b)=>items[b.id].totalWrong-items[a.id].totalWrong).slice(0,20);
    if(kps.length===0) return;
    kps = shuffle(kps);
  }else{
    want = mode==="10q" ? 10 : 20;
    let pool = catWords(opt.cat).filter(w=>!peek(w.id).mastered);
    pool = shuffle(pool).sort(priorityCmp);
    kps = shuffle(pool.slice(0, want));
    if(kps.length===0){
      modal({title:"出題できる語がありません", html:"<p>このカテゴリーはすべて習得済みです。<b>全問モード</b>で実力チェックをするか、別のカテゴリーを選んでください。</p>"});
      return;
    }
    if(kps.length < want) shortage = {want, got:kps.length};
  }

  S = { mode, cat:opt.cat||null, startedAt:nowISO(),
    work:{}, appear:{}, queue:[], history:[], current:null,
    phase:"answering", view:null, qidSeq:1,
    requeue: mode!=="all", committed:false };

  kps.forEach(w=>{ S.work[w.id] = clone(peek(w.id)); S.appear[w.id] = 0; });
  S.queue = kps.map(w=>({ qid:S.qidSeq++, kpId:w.id, format:firstFmt(w.id), pinned:false }));

  go("quiz");
  if(shortage){
    modal({ title:"出題数のおしらせ",
      html:"<p>未習得の語が"+shortage.got+"語しか残っていないため、今回は<b>"+shortage.got+"語</b>で出題します。</p>",
      acts:[{label:"はじめる", kind:"m-primary", onClick:advance}] });
  }else advance();
}

function makeChoices(kpId){
  const w = WMAP[kpId];
  const same = shuffle(WORDS.filter(x=>x.c===w.c && x.id!==kpId));
  const other = shuffle(WORDS.filter(x=>x.c!==w.c));
  return shuffle([kpId].concat(same.concat(other).slice(0,3).map(x=>x.id)));
}
function advance(){
  if(S.queue.length===0){ finishSession(); return; }
  const q = S.queue.shift();
  S.appear[q.kpId] = (S.appear[q.kpId]||0) + 1;
  q.choices = makeChoices(q.kpId);
  S.current = q; S.phase = "answering"; S.view = null;
  renderQuiz();
}
function insertQueue(item, offset){
  let i = Math.min(offset-1, S.queue.length);
  if(i<0) i = 0;
  while(i < S.queue.length && S.queue[i].pinned) i++;   /* 埋まっていれば直後の空きへ */
  S.queue.splice(i, 0, item);
}
function applyAnswer(e){
  const w = S.work[e.kpId];
  w.lastSeenAt = e.at;
  if(e.correct){
    w.totalCorrect++; w.byFormat[e.format].correct++;
    /* 連続する2回は必ず異なる出題形式であること */
    if(w.streak>0 && w.lastFormat && w.lastFormat!==e.format) w.streak++;
    else w.streak = 1;
    w.lastFormat = e.format;
    if(w.streak>=MASTERY_STREAK && !w.mastered){ w.mastered=true; w.masteredAt=e.at; e.newMaster=true; }
  }else{
    w.totalWrong++; w.byFormat[e.format].wrong++;
    w.wrongLog.push({ at:e.at, format:e.format, answered:WMAP[e.answered].w });
    if(w.wrongLog.length>WRONG_LOG_MAX) w.wrongLog = w.wrongLog.slice(-WRONG_LOG_MAX);
    w.streak = 0; w.mastered = false; w.masteredAt = null; w.lastFormat = e.format;
  }
  if(S.requeue){
    const n = S.appear[e.kpId] || 1;
    if(!w.mastered && n < MAX_APPEAR){
      const qid = S.qidSeq++;
      insertQueue({ qid, kpId:e.kpId, format:otherFmt(e.format), pinned:true },
        e.correct ? REQUEUE_OK : REQUEUE_WRONG);
      e.scheduled = qid;
    }else if(!w.mastered){ e.needsReview = true; }
  }
}
function answer(chosen){
  const q = S.current;
  const e = { qid:q.qid, kpId:q.kpId, format:q.format, choices:q.choices,
    answered:chosen, correct:(chosen===q.kpId), pre:clone(S.work[q.kpId]),
    scheduled:null, at:nowISO(), appearNo:S.appear[q.kpId] };
  S.history.push(e);
  applyAnswer(e);
  S.phase = "feedback";
  renderQuiz();
}
function reanswer(idx, chosen){
  const e = S.history[idx];
  S.work[e.kpId] = clone(e.pre);
  if(e.scheduled){ S.queue = S.queue.filter(q=>q.qid!==e.scheduled); e.scheduled=null; }
  delete e.newMaster; delete e.needsReview;
  e.answered = chosen; e.correct = (chosen===e.kpId); e.at = nowISO(); e.redone = true;
  applyAnswer(e);
  renderQuiz();
}
function goNext(){ if(S.queue.length===0) finishSession(); else advance(); }

/* ---------- ナビゲーション（§5-1） ---------- */
function liveIsAnswered(){ return S.phase==="feedback"; }
function firstViewable(){ return liveIsAnswered() ? S.history.length-2 : S.history.length-1; }
function navPrev(){
  if(S.view===null){ const i=firstViewable(); if(i<0) return; S.view=i; }
  else if(S.view>0) S.view--;
  renderQuiz();
}
function navNext(){
  if(S.view===null) return;
  const limit = firstViewable();
  if(S.view < limit) S.view++;
  else S.view = null;
  renderQuiz();
}
function uiQuit(){
  modal({ title:"クイズをやめますか?",
    html:"<p>とちゅうでやめると、<b>今回の成績と習得の記録は残りません</b>。（最後まで終えたときだけ記録されます）</p>",
    acts:[
      {label:"やめてホームへ", kind:"m-danger", onClick:()=>{ S=null; go("home"); }},
      {label:"つづける", kind:"m-primary"}
    ]});
}

/* ---------- 描画 ---------- */
function renderQuiz(){
  const reviewing = S.view !== null;
  const e = reviewing ? S.history[S.view] : (liveIsAnswered() ? S.history[S.history.length-1] : null);
  const q = reviewing ? e : S.current;
  const kp = WMAP[q.kpId];
  const done = S.history.length;
  const total = done + (liveIsAnswered() ? 0 : 1) + S.queue.length;
  const idxShown = reviewing ? S.view+1 : done + (liveIsAnswered() ? 0 : 1);
  const okN = S.history.filter(x=>x.correct).length;
  const remainKp = new Set(S.queue.map(x=>x.kpId));
  if(!liveIsAnswered() && !reviewing) remainKp.add(S.current.kpId);

  $("qBar").style.width = ((idxShown-1)/Math.max(total,1)*100)+"%";
  $("qStats").innerHTML =
    "<span>"+idxShown+"問目 / 全"+total+"問</span><span class='sep'>|</span>"+
    "<span>あと"+remainKp.size+"語</span><span class='sep'>|</span>"+
    "<span class='ok'>正解 "+okN+"</span><span class='ng'>誤答 "+(done-okN)+"</span>";

  const canPrev = reviewing ? S.view>0 : firstViewable()>=0;
  $("btnPrev").disabled = !canPrev;
  $("btnNext").disabled = !reviewing;
  $("btnNext").textContent = reviewing ? "次の問題 →" : "次の問題 →";

  const reanswerable = reviewing && REANSWER_PREV && !liveIsAnswered() && S.view===S.history.length-1;
  const banner = $("reviewBanner");
  if(reviewing){
    banner.style.display = "block";
    banner.textContent = reanswerable
      ? "◀ 直前の問題を見ています。選びなおすと、この問題の正誤は上書きされます。"
      : "◀ 前の問題を見ています（この問題は閲覧のみ）。";
  }else banner.style.display = "none";

  const w = S.work[q.kpId];
  if(q.format==="A"){
    $("qType").textContent = FMT.A.q;
    $("qPrompt").innerHTML = "<div class='q-meaning'>"+esc(kp.m)+"</div>";
  }else{
    $("qType").textContent = FMT.B.q;
    $("qPrompt").innerHTML = "<div class='q-word'>"+esc(kp.w)+"</div>";
  }
  const dots = [];
  for(let i=0;i<MASTERY_STREAK;i++) dots.push(i<w.streak ? "●" : "○");
  $("qGauge").textContent = w.mastered ? "★ 習得ずみ" : dots.join("")+"　あと"+Math.max(MASTERY_STREAK-w.streak,0)+"回で習得";

  /* 選択肢 */
  const kigo = ["ア","イ","ウ","エ"];
  const box = $("choices"); box.innerHTML = "";
  q.choices.forEach((cid,i)=>{
    const cw = WMAP[cid];
    const b = document.createElement("button");
    b.className = "choice" + (q.format==="A" ? " wordmode" : "");
    b.innerHTML = "<span class='kigo'>"+kigo[i]+"</span><span>"+esc(q.format==="A" ? cw.w : cw.m)+"</span>";
    if(e){
      b.disabled = !reanswerable;
      if(cid===q.kpId) b.classList.add("correct");
      else if(cid===e.answered) b.classList.add("wrong");
      else b.classList.add("dim");
      if(reanswerable) b.onclick = ()=>reanswer(S.view, cid);
    }else{
      b.onclick = ()=>answer(cid);
    }
    box.appendChild(b);
  });

  /* 解説 */
  const fb = $("feedback");
  if(e){
    fb.className = "feedback show " + (e.correct ? "good" : "bad");
    $("fbHead").textContent = e.correct ? "○ せいかい!" : "× ざんねん…";
    $("fbWord").innerHTML = esc(kp.w) + (kp.k!==kp.w ? "<span>【"+esc(kp.k)+"】</span>" : "");
    $("fbMean").textContent = kp.m;
    $("fbEx").innerHTML = kp.e;
    let note = "";
    if(e.newMaster) note = "★ 異なる形式で2回連続正解! この言葉を習得しました。";
    else if(e.correct && w.streak===1) note = "いいね! つぎは「"+FMT[otherFmt(e.format)].label+"」で出ます。";
    else if(!e.correct) note = "あなたの答え：" + esc(WMAP[e.answered].w);
    if(e.needsReview) note += "（このセッションでの出題は上限に達しました。結果画面で要復習に入ります）";
    $("fbNote").textContent = note;
    $("fbNote").style.display = note ? "block" : "none";
    $("fbNext").style.display = reviewing ? "none" : "block";
    $("fbNext").textContent = S.queue.length===0 ? "けっかを見る" : "つぎへ";
  }else{
    fb.className = "feedback";
  }
}

/* ---------- 完走時のみ確定（§5-2） ---------- */
function finishSession(){
  if(S.committed){ showResult(); return; }
  const p = prog();
  const newly = [], wrongKp = [], sessionWrongCount = {};
  S.history.forEach(e=>{
    if(!e.correct){
      sessionWrongCount[e.kpId] = (sessionWrongCount[e.kpId]||0)+1;
      if(wrongKp.indexOf(e.kpId)<0) wrongKp.push(e.kpId);
    }
  });
  Object.keys(S.work).forEach(kp=>{
    if(!S.appear[kp]) return;
    const before = p.items[kp];
    const after = S.work[kp];
    if(after.mastered && (!before || !before.mastered)) newly.push(kp);
    p.items[kp] = after;
  });
  const correct = S.history.filter(e=>e.correct).length;
  p.sessions.push({ startedAt:S.startedAt, finishedAt:nowISO(), mode:S.mode,
    correct, wrong:S.history.length-correct, newlyMastered:newly, wrongKpIds:wrongKp, sessionWrongCount });
  S.newly = newly; S.committed = true;
  saveDB({push:true});
  showResult();
}

/* ============================================================
   結果画面（§7・§9-2）
   ============================================================ */
function showResult(){
  const total = S.history.length;
  const correct = S.history.filter(e=>e.correct).length;
  const rate = total ? correct/total : 0;
  $("rScore").textContent = correct;
  $("rTotal").textContent = total;
  $("rRate").textContent = Math.round(rate*100)+"%";
  $("rWrong").textContent = total-correct;
  $("rNew").textContent = S.newly.length;
  $("rMsg").textContent = rate===1 ? "パーフェクト! すばらしい!"
    : rate>=0.8 ? "よくできました!"
    : rate>=0.5 ? "その調子! 復習でのばそう!" : "まちがえた言葉をもう一度見てみよう!";
  const st = $("stamp");
  st.classList.remove("show");
  if(rate>=0.8){ st.style.display="flex"; setTimeout(()=>st.classList.add("show"),200); } else st.style.display="none";

  if(S.newly.length){
    $("rNewBox").style.display="block";
    $("rNewTags").innerHTML = S.newly.map(id=>"<span class='tag'>"+esc(WMAP[id].w)+"</span>").join("");
  }else $("rNewBox").style.display="none";

  const wrongs = S.history.filter(e=>!e.correct);
  if(wrongs.length){
    $("rWrongBox").style.display="block";
    $("rWrongList").innerHTML = wrongs.map(e=>{
      const kp = WMAP[e.kpId];
      return "<div class='wrong-item'><span class='w'>"+esc(kp.w)+"</span>"+
        "<span class='fm'>"+FMT[e.format].label+"</span><br>"+
        "<span class='ans'>あなた：</span>"+esc(e.format==="A" ? WMAP[e.answered].w : WMAP[e.answered].m)+"<br>"+
        "<span class='cor'>正解：</span>"+esc(e.format==="A" ? kp.w : kp.m)+"<br>"+
        "<span style='color:var(--usuzumi)'>"+esc(kp.m)+"</span></div>";
    }).join("");
  }else $("rWrongBox").style.display="none";

  const todo = [...new Set(S.history.filter(e=>e.needsReview).map(e=>e.kpId))];
  if(todo.length){
    $("rTodoBox").style.display="block";
    $("rTodoList").innerHTML = todo.map(id=>"<span class='tag' style='background:var(--shu-pale);border-color:var(--shu);color:var(--shu)'>"+esc(WMAP[id].w)+"</span>").join("");
  }else $("rTodoBox").style.display="none";

  const fc = $("fCat");
  if(fc.options.length===0){
    fc.innerHTML = "<option value=''>すべてのカテゴリー</option>" +
      CATEGORIES.map(c=>"<option value='"+c.id+"'>"+c.name+"</option>").join("");
  }
  renderAllList();
  go("result");
}

function kpRowsHTML(list, items, pfx){
  return list.map(w=>{
    const it = items[w.id] || newItem();
    const s = stateOf(it);
    const bc = s==="mastered" ? "m" : s==="partial" ? "p" : s==="new" ? "n" : "x";
    const danger = it.totalWrong>=2;
    const cat = CATMAP[w.c];
    let detail = "<div class='kp-detail' id='"+pfx+esc(w.id)+"'>";
    detail += "<div><span class='k'>意味</span>　"+esc(w.m)+"</div>";
    detail += "<div><span class='k'>例文</span>　"+w.e+"</div>";
    detail += "<div><span class='k'>形式別</span>　"+FMT.A.label+"：正"+it.byFormat.A.correct+"／誤"+it.byFormat.A.wrong+
              "　　"+FMT.B.label+"：正"+it.byFormat.B.correct+"／誤"+it.byFormat.B.wrong+"</div>";
    if(it.wrongLog.length)
      detail += "<div><span class='k'>過去の誤答</span>　"+it.wrongLog.map(l=>esc(l.answered)+"（"+fmtDate(l.at)+"）").join("／")+"</div>";
    if(it.masteredAt) detail += "<div><span class='k'>習得日</span>　"+fmtDate(it.masteredAt)+"</div>";
    detail += "</div>";
    return "<div class='kp-row"+(danger?" danger":"")+"' onclick=\"toggleKp('"+pfx+"','"+esc(w.id)+"')\">"+
      "<div class='kp-top'><span class='kp-w'>"+esc(w.w)+"</span>"+
      "<span class='kp-cat' style='background:"+cat.color+"'>"+cat.mark+"</span>"+
      "<span class='badge "+bc+"'>"+stateText(it)+"</span>"+
      (it.totalWrong>0 ? "<span class='badge "+(danger?"warn":"x")+"'>"+(danger?"⚠️2回以上ミス ":"")+"誤答"+it.totalWrong+"回</span>" : "")+
      "</div><div class='kp-mean'>"+esc(w.m)+"</div>"+detail+"</div>";
  }).join("");
}
function renderAllList(){
  const items = progRO().items;
  const fc = $("fCat").value, fs = $("fState").value, so = $("fSort").value;
  let list = WORDS.slice();
  if(fc) list = list.filter(w=>w.c===fc);
  if(fs){
    list = list.filter(w=>{
      const it = items[w.id] || newItem();
      if(fs==="danger") return it.totalWrong>=2;
      return stateOf(it)===fs;
    });
  }
  const g = w => items[w.id] || newItem();
  if(so==="wrong") list.sort((a,b)=>g(b).totalWrong-g(a).totalWrong || a.w.localeCompare(b.w,"ja"));
  else if(so==="cat") list.sort((a,b)=>CATEGORIES.findIndex(c=>c.id===a.c)-CATEGORIES.findIndex(c=>c.id===b.c));
  else list.sort((a,b)=>a.y.localeCompare(b.y,"ja"));
  const box = $("allList");
  if(list.length===0){ box.innerHTML="<div class='panel' style='text-align:center;color:var(--usuzumi);font-size:13px'>該当する言葉はありません。</div>"; return; }
  box.innerHTML = kpRowsHTML(list, items, "d_");
}
function toggleKp(pfx,id){ const d=$(pfx+id); if(d) d.classList.toggle("open"); }

/* ---------- CSV（§7-4） ---------- */
function csvCell(v){ const s=String(v==null?"":v); return '"'+s.replace(/"/g,'""')+'"'; }
function downloadCSV(){
  if(!AUTH) return;
  const items = progRO().items;
  const header = LIST_HEADER.concat(["表示名"]);
  const rows = WORDS.map(w=>rowFor(w, items[w.id]).concat([AUTH.label||""]))
    .sort((a,b)=>b[8]-a[8]);
  const csv = "\uFEFF" + [header].concat(rows).map(r=>r.map(csvCell).join(",")).join("\r\n");
  download("和語結果_" + AUTH.id + "_" + stamp8() + ".csv", csv, "text/csv;charset=utf-8");
}

/* ============================================================
   覚えるモード（学習記録には一切書き込まない読み取り専用）
   ============================================================ */
let ST = { list:[], idx:0, open:false, view:"card" };

function openStudy(){
  if(!acc()){ go("account"); return; }
  const sel = $("stCat");
  if(sel.options.length===0){
    sel.innerHTML = "<option value=''>すべてのカテゴリー</option>" +
      CATEGORIES.map(c=>"<option value='"+c.id+"'>"+c.name+"</option>").join("");
  }
  sel.value = uiCat || "";
  studyView(ST.view);
  studyRebuild();
  go("study");
}
function studyView(v){
  ST.view = v;
  $("vwCard").classList.toggle("on", v==="card");
  $("vwList").classList.toggle("on", v==="list");
  $("studyCardWrap").style.display = v==="card" ? "block" : "none";
  $("studyListWrap").style.display = v==="list" ? "block" : "none";
  if(v==="list") renderStudyList();
}
function studyRebuild(){
  const items = progRO().items;
  const cat = $("stCat").value, scope = $("stScope").value, order = $("stOrder").value;
  const g = w => items[w.id] || newItem();
  let list = cat ? WORDS.filter(w=>w.c===cat) : WORDS.slice();
  if(scope==="unmastered") list = list.filter(w=>!g(w).mastered);
  else if(scope==="mastered") list = list.filter(w=>g(w).mastered);
  else if(scope==="wrong")   list = list.filter(w=>g(w).totalWrong>0);
  if(order==="shuffle") list = shuffle(list);
  else if(order==="wrong") list = list.slice().sort((a,b)=>g(b).totalWrong-g(a).totalWrong || a.y.localeCompare(b.y,"ja"));
  else if(order==="kana") list = list.slice().sort((a,b)=>a.y.localeCompare(b.y,"ja"));
  ST.list = list; ST.idx = 0; ST.open = false;
  if(ST.view==="list") renderStudyList(); else renderStudy();
}
function renderStudyList(){
  const items = progRO().items;
  const box = $("studyListWrap");
  box.innerHTML = ST.list.length===0
    ? "<div class='panel' style='text-align:center;color:var(--usuzumi);font-size:13px'>該当する言葉はありません。</div>"
    : kpRowsHTML(ST.list, items, "ds_");
}
function studyFlip(){ if(ST.list.length===0) return; ST.open = !ST.open; renderStudy(); }
function studyNext(){
  if(ST.list.length===0) return;
  if(!ST.open){ ST.open = true; renderStudy(); return; }
  studyMove(1);
}
function studyMove(d){
  if(ST.list.length===0) return;
  const n = ST.idx + d;
  if(n<0 || n>=ST.list.length) return;
  ST.idx = n; ST.open = false; renderStudy();
}
function renderStudy(){
  const card = $("studyCard");
  const total = ST.list.length;
  if(total===0){
    $("stCount").textContent = "0 / 0";
    $("stBar").style.width = "0%";
    card.innerHTML = "<div style='color:var(--usuzumi);font-size:14px;line-height:1.8'>該当する言葉がありません。<br>上の条件を変えてください。</div>";
    $("stPrev").disabled = true; $("stNext").disabled = true;
    return;
  }
  $("stNext").disabled = false;
  const w = ST.list[ST.idx];
  const it = progRO().items[w.id] || newItem();
  const cat = CATMAP[w.c];
  const face = $("stFace").value;
  $("stCount").textContent = (ST.idx+1) + " / " + total;
  $("stBar").style.width = ((ST.idx+1)/total*100) + "%";
  $("stPrev").disabled = ST.idx===0;
  $("stNext").textContent = !ST.open ? "めくる" : (ST.idx===total-1 ? "おわり" : "次へ →");

  const badges = "<div class='s-badges'>"+
    "<span class='kp-cat' style='background:"+cat.color+"'>"+cat.mark+"</span>"+
    "<span class='badge "+(it.mastered?"m":stateOf(it)==="partial"?"p":stateOf(it)==="new"?"n":"x")+"'>"+stateText(it)+"</span>"+
    (it.totalWrong>0 ? "<span class='badge "+(it.totalWrong>=2?"warn":"x")+"'>誤答"+it.totalWrong+"回</span>" : "")+
    "</div>";

  let front, back;
  if(face==="word"){
    front = "<div class='s-word'>"+esc(w.w)+"</div>";
    back  = "<div class='s-bmean'>"+esc(w.m)+"</div>";
    if(w.k!==w.w) back = "<div style='text-align:center;color:var(--usuzumi);font-family:var(--serif);font-size:16px;margin-bottom:6px'>【"+esc(w.k)+"】</div>" + back;
  }else{
    front = "<div class='s-mean'>"+esc(w.m)+"</div>";
    back  = "<div class='s-ans'>"+esc(w.w)+(w.k!==w.w ? "<span>【"+esc(w.k)+"】</span>" : "")+"</div>";
  }
  card.innerHTML = badges + front +
    (ST.open
      ? "<div class='s-back show'>"+back+"<div class='s-ex'>"+w.e+"</div></div>"
      : "<div class='s-hint'>タップして"+(face==="word"?"意味":"ことば")+"を見る</div>");
}
document.addEventListener("keydown", e=>{
  if(!$("sc-study").classList.contains("active")) return;
  if(e.key==="ArrowLeft"){ studyMove(-1); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ studyNext(); e.preventDefault(); }
  else if(e.key===" "){ studyFlip(); e.preventDefault(); }
});

/* ============================================================
   起動
   ============================================================ */
$("totalWords").textContent = WORDS.length;
$("footVer").textContent = APP_ID + " " + VER;

loadAll();
if(!storageOK){
  const wb = $("warnBar"); wb.classList.add("show");
  wb.textContent = ready()
    ? "☁ この端末には記録を残せない環境ですが、クラウド同期が有効なので記録はサーバーに保存されます。"
    : "⚠ この端末には学習記録を保存できません（ブラウザの設定によるもの）。ポータルでクラウド同期を設定すると記録を残せます。";
}
if(ready() && loggedIn()) setSync("busy", db.initialSyncAt ? "☁… クラウドと同期しています" : "☁… サーバーから記録をダウンロードしています");
go(ready() && loggedIn() ? "home" : "gate");
if(ready() && loggedIn()) pullCloud({silent:false});

/* 他のツール／ポータルでログイン状態が変わったら追従する */
window.addEventListener("storage", ev=>{
  if(ev.key!=="kj-quiz:auth" && ev.key!=="kj-quiz:sync") return;
  if($("sc-quiz").classList.contains("active") && S && S.history.length>0 && !S.committed) return;
  const prevId = AUTH ? AUTH.id : null;
  loadAll();
  go(ready() && loggedIn() ? "home" : "gate");
  if(ready() && loggedIn() && (AUTH.id!==prevId || !db.initialSyncAt)) pullCloud({});
});
window.addEventListener("beforeunload", e=>{
  if(S && S.history.length>0 && !S.committed){ e.preventDefault(); e.returnValue=""; }
});
