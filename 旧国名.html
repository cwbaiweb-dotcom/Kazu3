<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>むかしの国名（旧国名）クイズ</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fff; --ink:#2b2b2b; --sub:#6b6459;
  --accent:#8b5e34; --accent2:#c98a4b; --line:#e3ddd2;
  --ok:#2e7d55; --ng:#c0392b; --warn:#e0a800;
  --mast:#2e7d55; --mid:#a8cbb4; --pale:#e8e4db;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  font-size:16px; line-height:1.7; padding-bottom:40px;
}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.25rem;margin:.2em 0 .4em;letter-spacing:.02em}
h2{font-size:1.05rem;margin:1.1em 0 .5em;border-left:6px solid var(--accent2);padding-left:.5em}
h3{font-size:.98rem;margin:.9em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.muted{color:var(--sub);font-size:.86rem}
.tiny{font-size:.78rem}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:12px;
  padding:13px 18px;font-weight:700;min-height:48px;margin:4px 4px 4px 0}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn.gray{background:#efece5;color:#4a443b;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:0;font-size:.85rem;border-radius:10px}
.btn.wide{display:block;width:100%;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.hidden{display:none!important}

/* 選択肢 */
.choices{display:grid;gap:10px;margin-top:12px}
.choice{background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 14px;
  text-align:left;font-size:1.12rem;font-weight:700;min-height:56px;width:100%;color:var(--ink)}
.choice:hover{border-color:var(--accent2)}
.choice.correct{background:#e8f5ec;border-color:var(--ok);color:#17603c}
.choice.wrong{background:#fdeceb;border-color:var(--ng);color:#8e2b20}
.choice.dim{opacity:.55}
.choice .yomi{display:block;font-size:.75rem;font-weight:400;color:var(--sub)}

/* 進捗 */
.bar{height:10px;background:var(--pale);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .25s}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.hud .line{display:flex;gap:10px;font-size:.82rem;color:var(--sub);flex-wrap:wrap}
.gauge{font-size:1.15rem;letter-spacing:.12em;color:var(--accent)}

.qbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center}
.qlabel{display:inline-block;background:#f0e8dc;color:var(--accent);border-radius:99px;padding:2px 12px;font-size:.76rem;font-weight:700}
.qtext{font-size:1.02rem;margin:10px 0 4px;color:var(--sub)}
.qmain{font-size:2.3rem;font-weight:800;letter-spacing:.06em;margin:6px 0 2px}
.qmain.small{font-size:1.5rem}
.qyomi{font-size:.9rem;color:var(--sub)}

.fb{border-radius:14px;padding:12px 14px;margin-top:12px}
.fb.ok{background:#e8f5ec;border:1px solid var(--ok)}
.fb.ng{background:#fdeceb;border:1px solid var(--ng)}
.fb b{font-size:1.05rem}
.exp{margin-top:6px;font-size:.9rem;line-height:1.65}
.exp .k{color:var(--accent);font-weight:700}

/* アカウント */
.acc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin:6px 0}
.acc .nm{font-weight:700;flex:1}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700}
.badge.w{background:#fff6e0;color:#8a6400;border:1px solid var(--warn)}
.badge.g{background:#e8f5ec;color:#1d6b45;border:1px solid var(--ok)}

/* 一覧 */
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
th{background:#faf7f1;color:var(--sub);font-weight:700;position:sticky;top:0}
.st{white-space:nowrap;font-weight:700;font-size:.78rem}
.st.m{color:var(--mast)} .st.c{color:#8a6400} .st.n{color:var(--ng)} .st.u{color:var(--sub)}
tr.krow{cursor:pointer}
tr.krow:hover{background:#fbf9f5}
.detail td{background:#fbf9f5;font-size:.8rem;color:var(--sub)}

/* ホームのカテゴリバー */
.catline{margin:8px 0}
.catline .t{display:flex;font-size:.85rem}
.catline .t b{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{width:13px;height:13px;border-radius:4px;background:var(--pale)}
.chip.m{background:var(--mast)} .chip.w{background:var(--mast);box-shadow:0 0 0 2px var(--warn) inset}
.chip.c{background:var(--mid)} .chip.n{background:#f2c9c4}

/* モーダル */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{background:#fff;border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
input[type=text],input[type=url],select{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label.f{display:block;margin:10px 0 4px;font-size:.85rem;color:var(--sub);font-weight:700}

/* 同期状態 */
.sync{border-radius:12px;padding:10px 12px;font-size:.86rem;background:#f3f0e9;border:1px solid var(--line)}
.sync.ok{background:#e8f5ec;border-color:var(--ok);color:#1d6b45}
.sync.err{background:#fdeceb;border-color:var(--ng);color:#8e2b20}
.warnbar{background:#fff6e0;border:1px solid var(--warn);color:#7a5a00;border-radius:10px;padding:8px 12px;font-size:.85rem;margin:8px 0}

/* 地図 */
.mapwrap{background:#eef4f7;border:1px solid var(--line);border-radius:14px;padding:6px;margin-top:12px}
svg.jp{width:100%;height:auto;display:block}
svg.jp .land{fill:#f7f4ec;stroke:#b9ac97;stroke-width:1.1;stroke-linejoin:round}
svg.jp .dot{fill:#c9c0ae}
svg.jp .hit{fill:#c0392b;stroke:#fff;stroke-width:1.5}
svg.jp .hit2{fill:#e0a800;stroke:#fff;stroke-width:1.4}
svg.jp text{font-size:13px;fill:#2b2b2b;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round}
.legend{font-size:.76rem;color:var(--sub);padding:2px 6px 4px}

/* おぼえるカード・ヒント */
.card.teach{border:2px solid var(--accent2);background:linear-gradient(180deg,#fffdf8,#fff)}
.card.teach .qmain{text-align:center}
.teachbody{background:#faf7f1;border-radius:12px;padding:12px;margin-top:10px;font-size:.95rem;line-height:1.8}
.hints{margin-top:12px;background:#fff9e8;border:1px solid #f0d99a;border-radius:12px;padding:10px 12px;
  font-size:.88rem;text-align:left;color:#6b5400}
.setcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.setcard ol{margin:6px 0 6px 1.2em;padding:0}
.setcard li{margin:3px 0}
.setcard .kn{font-weight:800;font-size:1.05rem}
.rulebox{background:#f0e8dc;border-radius:12px;padding:12px;font-size:.92rem;line-height:1.8}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters select{width:auto;min-width:120px;padding:8px}
@media(max-width:420px){ .qmain{font-size:1.9rem} .choice{font-size:1.05rem} }
</style>
</head>

/* --- KPの組み立て --- */
function buildKPs(){
  const list = [];
  KUNI_RAW.forEach(function(r,i){
    const prefs = r[2].split("|").map(function(s){
      return s.charAt(0)==="*" ? {n:s.slice(1),part:true} : {n:s,part:false};
    });
    const ex = (r[4]?1:0)+(r[5]?1:0);
    list.push({
      id:"k"+(i+1), type:"kuni", no:i+1, cat:r[3],
      name:r[0], yomi:r[1], prefs:prefs,
      prefNames:prefs.map(function(p){return p.n;}),
      main:prefs[0].n, geo:r[4], hist:r[5],
      imp: ex>=2?"★★★":(ex===1?"★★":"★")
    });
  });
  COMPOUND_RAW.forEach(function(r,i){
    const pn = [];
    r[2].forEach(function(k){
      if(k==="出羽"){ pn.push("秋田県","山形県"); return; }
      const f = list.filter(function(x){return x.name===k;})[0];
      if(f) f.prefNames.forEach(function(p){ if(pn.indexOf(p)<0) pn.push(p); });
    });
    list.push({
      id:"c"+(i+1), type:"compound", no:i+1, cat:"複合語",
      name:r[0], yomi:r[1], kunis:r[2], desc:r[3],
      prefNames:pn, main:pn[0], prefs:pn.map(function(p){return {n:p,part:false};}),
      geo:r[3], hist:"", imp:"★★★"
    });
  });
  return list;
}

let MEMORY_ONLY = false;      // localStorageが使えない環境
let MEM = {};                 // その場合の代替
function lsGet(k){
  try{ return MEMORY_ONLY ? (MEM[k]||null) : localStorage.getItem(k); }
  catch(e){ MEMORY_ONLY=true; return MEM[k]||null; }
}
function lsSet(k,v){
  try{
    if(MEMORY_ONLY){ MEM[k]=v; return; }
    localStorage.setItem(k,v);
  }catch(e){ MEMORY_ONLY=true; MEM[k]=v; }
}
function lsDel(k){
  try{ if(MEMORY_ONLY){ delete MEM[k]; return; } localStorage.removeItem(k); }
  catch(e){ delete MEM[k]; }
}
function jparse(s){ try{ return JSON.parse(s||"null"); }catch(e){ return null; } }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function nowISO(){ return new Date().toISOString(); }

function blankItem(){
  return {streak:0,mastered:false,masteredAt:null,postMasterWrong:0,lastFormat:null,
    totalCorrect:0,totalWrong:0,
    byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}},
    wrongLog:[],lastSeenAt:null};
}
function blankDB(){
  return {app:APP,version:SCHEMA_VERSION,updatedAt:nowISO(),activeAccountId:null,accounts:[],progress:{}};
}
function normItem(raw){
  const it = Object.assign(blankItem(), raw||{});
  if(typeof it.postMasterWrong!=="number") it.postMasterWrong=0;      // v1系の補完
  if(!it.byFormat) it.byFormat={A:{correct:0,wrong:0},B:{correct:0,wrong:0}};
  ["A","B"].forEach(function(f){
    it.byFormat[f]=Object.assign({correct:0,wrong:0},it.byFormat[f]||{});
  });
  if(!Array.isArray(it.wrongLog)) it.wrongLog=[];
  it.wrongLog = it.wrongLog.slice(0,5);                                // §9-1 最新5件
  if(it.mastered && !it.masteredAt) it.masteredAt = it.lastSeenAt || nowISO();
  return it;
}
function normProgress(raw){
  const p = {items:{},sessions:[]};
  const src = raw||{};
  Object.keys(src.items||{}).forEach(function(k){ p.items[k]=normItem(src.items[k]); });
  p.sessions = (Array.isArray(src.sessions)? src.sessions : []).slice(0,100);
  p.sessions.forEach(function(s){                                      // modeは日本語表記に統一
    if(s.mode==="20q") s.mode="20問";
    if(s.mode==="10q") s.mode="10問";
    if(s.mode==="all") s.mode="全問";
  });
  return p;
}

async function api(body){

  if(e==='auth') return 'ログインが無効になりました。ポータルでログインし直してください';
  if(/合言葉|key/i.test(e)) return '合言葉が違います';
  return e||'エラー';
}

/* ---- 合流（ログイン中のID 1件ぶんだけ） ---- */
function mergeItem(a,b){
  if(!a) return normItem(b); if(!b) return normItem(a);
  a=normItem(a); b=normItem(b);
  const o=blankItem();
  o.totalCorrect=Math.max(a.totalCorrect,b.totalCorrect);
  o.totalWrong  =Math.max(a.totalWrong,b.totalWrong);
  o.postMasterWrong=Math.max(a.postMasterWrong,b.postMasterWrong);
  ["A","B"].forEach(function(f){
    o.byFormat[f].correct=Math.max(a.byFormat[f].correct,b.byFormat[f].correct);
    o.byFormat[f].wrong  =Math.max(a.byFormat[f].wrong,  b.byFormat[f].wrong);
  });
  o.mastered = a.mastered||b.mastered;
  if(a.masteredAt&&b.masteredAt) o.masteredAt = (new Date(a.masteredAt)<=new Date(b.masteredAt))?a.masteredAt:b.masteredAt;
  else o.masteredAt = a.masteredAt||b.masteredAt||null;
  if(o.mastered&&!o.masteredAt) o.masteredAt=nowISO();
  const seen={}, log=[];
  a.wrongLog.concat(b.wrongLog).forEach(function(w){ const k=w.at+'|'+w.format; if(!seen[k]){ seen[k]=1; log.push(w); } });
  log.sort(function(x,y){ return new Date(y.at)-new Date(x.at); });
  o.wrongLog = log.slice(0,5);
  const at=a.lastSeenAt?new Date(a.lastSeenAt).getTime():0, bt=b.lastSeenAt?new Date(b.lastSeenAt).getTime():0;
  const newer = (at>=bt)?a:b;
  o.lastSeenAt = newer.lastSeenAt||a.lastSeenAt||b.lastSeenAt||null;
  o.streak     = newer.streak;          // 最後に学習した端末の値を正とする
  o.lastFormat = newer.lastFormat;
  return o;
}
function mergeProgress(L,C){
  L=normProgress(L); C=normProgress(C);
  const M={items:{},sessions:[]}, ids={};
  Object.keys(L.items).forEach(function(k){ids[k]=1;});
  Object.keys(C.items).forEach(function(k){ids[k]=1;});
  Object.keys(ids).forEach(function(k){ M.items[k]=mergeItem(L.items[k],C.items[k]); });
  const seen={}, ss=[];
  L.sessions.concat(C.sessions).forEach(function(s){ if(!seen[s.finishedAt]){ seen[s.finishedAt]=1; ss.push(s); } });
  ss.sort(function(x,y){ return new Date(y.finishedAt)-new Date(x.finishedAt); });
  M.sessions = ss.slice(0,100);
  return M;
}
function progHasRecords(p){
  if(!p) return false;
  if((p.sessions||[]).length>0) return true;
  const it=p.items||{};
  return Object.keys(it).some(function(k){
    return (it[k].totalCorrect||0)+(it[k].totalWrong||0) > 0;
  });
}

/* ---- pull / push ---- */
async function pullCloud(silent){
  if(!ready()||!AUTH) return;
  if(!silent) setSync('','☁… クラウドと同期しています');
  let j;
  try{ j = await api({action:'fetch', app:APP, id:AUTH.id, pw:AUTH.pw}); }
  catch(e){
    if(/GASの応答/.test(e.message)) setSync('err','☁⚠ '+e.message);
    else setSync('','☁ オフライン（ローカルには保存済み）');
    return;
  }
  if(!j.ok){
    if(j.error==='auth'){ setSync('err','☁⚠ '+apiError(j)); onAuthLost(); return; }
    setSync('err','☁⚠ '+apiError(j)); return;
  }
  const cloudP = normProgress(((j.data||{}).progress||{})[AUTH.id]);
  const localP = prog();
  const before = JSON.stringify(localP);
  const merged = mergeProgress(localP, cloudP);
  DB.progress[AUTH.id]=merged;
  if(j.label){ AUTH.label=j.label; lsSet(K_AUTH,JSON.stringify(AUTH)); DB.accounts[0].label=j.label; }
  const cd=(j.data||{}).accounts&&j.data.accounts[0];
  if(cd&&cd.createdAt) DB.accounts[0].createdAt=cd.createdAt;
  saveDB({fromCloud:true});
  SYNC.lastSync=nowISO(); saveSync();
  const n=Object.keys(merged.items).length;
  setSync('ok','☁✓ クラウドと合流しました（'+n+'語・習得'+
    Object.keys(merged.items).filter(function(k){return merged.items[k].mastered;}).length+'）');
  render();
  if(before!==JSON.stringify(merged)) await pushCloud(true, SYNC_MSG.text);
}
async function pushCloud(silent,okMsg){
  if(!ready()||!AUTH) return false;
  if(!silent) setSync('','☁… 送信しています');
  let j;
  try{ j = await api({action:'save', app:APP, id:AUTH.id, pw:AUTH.pw,
        account:DB.accounts[0], progress:prog()}); }
  catch(e){
    if(/GASの応答/.test(e.message)) setSync('err','☁⚠ '+e.message);
    else setSync('','☁ オフライン（ローカルには保存済み。次につながったときに送ります）');
    return false;
  }
  if(!j.ok){
    if(j.error==='auth'){ setSync('err','☁⚠ '+apiError(j)); onAuthLost(); return false; }
    setSync('err','☁⚠ '+apiError(j)); return false;
  }
  SYNC.lastSync=nowISO(); saveSync();
  setSync('ok', okMsg||'☁✓ クラウドに保存しました');
  return true;
}

/* =============== §3〜§6 出題エンジン =============== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i];r[i]=r[j];r[j]=t; }
  return r; }

/* §4-1 適応ハードル：累計誤答が多いKPほど必要連続正解を増やす */
function requiredStreak(it){
  const w = (it && it.totalWrong) || 0;
  if (w >= 6) return 4;
  if (w >= 3) return 3;
  return 2;
}
function prefsLabel(kp){
  return kp.prefs.map(function(p){ return p.n + (p.part?"（一部）":""); }).join("・");
}
function kpState(it){
  if(it.mastered && it.postMasterWrong>0) return "要注意習得";
  if(it.mastered) return "習得済み";
  if(it.totalCorrect>0) return it.totalCorrect+"回正解";
  if(it.totalWrong>0) return "誤答";
  return "未出題";
}

/* ---- 出題の生成 ---- */
function makeQuestion(kp, fmt){
  const q = {kpId:kp.id, fmt:fmt, kp:kp};
  if(kp.type==="kuni"){
    if(fmt==="A"){
      q.label="形式A｜旧国名 → 都道府県";
      q.text="この旧国名は、おもに今のどこ？";
      q.main=kp.name; q.yomi=kp.yomi; q.big=true;
      const pool = shuffle(ALL_PREFS.filter(function(p){ return kp.prefNames.indexOf(p)<0; }));
      const near = pool.filter(function(p){ return KPS.some(function(x){
        return x.type==="kuni" && x.cat===kp.cat && x.prefNames.indexOf(p)>=0; }); });
      const ds = near.concat(pool).filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,3);
      q.answer = kp.main;
      q.choices = shuffle(ds.concat([kp.main])).map(function(v){ return {v:v,label:v}; });
    }else{
      q.label="形式B｜都道府県 → 旧国名";
      q.text="次のうち、今の「"+kp.main+"」にあたる旧国名は？";
      q.main=kp.main; q.yomi=""; q.big=true;
      const cands = KPS.filter(function(x){
        if(x.type!=="kuni" || x.id===kp.id) return false;
        return !x.prefNames.some(function(p){ return kp.prefNames.indexOf(p)>=0; });
      });
      const near = shuffle(cands.filter(function(x){return x.cat===kp.cat;}));
      const far  = shuffle(cands);
      const ds = near.concat(far).filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,3);
      q.answer = kp.name;
      q.choices = shuffle(ds.map(function(x){return {v:x.name,label:x.name,yomi:x.yomi};})
                    .concat([{v:kp.name,label:kp.name,yomi:kp.yomi}]));
    }
  }else{
    const comb = kp.kunis.join("＋");
    if(fmt==="A"){
      q.label="形式A｜ことば → 旧国名";
      q.text="このことばは、どの旧国名を組み合わせたもの？";
      q.main=kp.name; q.yomi=kp.yomi; q.big=false;
      const ds = shuffle(KPS.filter(function(x){return x.type==="compound"&&x.id!==kp.id;}))
        .slice(0,3).map(function(x){return x.kunis.join("＋");});
      q.answer = comb;
      q.choices = shuffle(ds.concat([comb])).map(function(v){return {v:v,label:v};});
    }else{
      q.label="形式B｜旧国名 → ことば";
      q.text="この旧国名を組み合わせてできたことばは？";
      q.main=comb; q.yomi=""; q.big=false;
      const ds = shuffle(KPS.filter(function(x){return x.type==="compound"&&x.id!==kp.id;}))
        .slice(0,3).map(function(x){return x.name;});
      q.answer = kp.name;
      q.choices = shuffle(ds.concat([kp.name])).map(function(v){return {v:v,label:v};});
    }
  }
  q.hints = buildHints(kp, fmt);
  return q;
}
function firstEx(s){ return (s||"").split("・")[0]; }
function buildHints(kp, fmt){
  if(kp.type==="compound"){
    if(fmt==="A") return [
      "ふくまれる旧国名は "+kp.kunis.length+"つ です",
      "1つめは「"+kp.kunis[0]+"」です",
      kp.desc.split("。")[0]+"。"];
    return [
      kp.desc.split("。")[0]+"。",
      "よみは「"+kp.yomi.charAt(0)+"」からはじまります",
      "よみは「"+kp.yomi+"」です"];
  }
  const ex = kp.geo ? firstEx(kp.geo) : (kp.hist ? firstEx(kp.hist) : "");
  if(fmt==="A") return [
    "この旧国名は "+kp.cat+"地方 にあります",
    ex ? "「"+ex+"」ということばでも知られています" : "よみは「"+kp.yomi+"」です",
    "答えの都道府県は「"+kp.main.charAt(0)+"」からはじまります"];
  const same = KPS.filter(function(x){ return x.type==="kuni" && x.prefNames.indexOf(kp.main)>=0; }).length;
  return [
    "答えのよみは「"+kp.yomi.charAt(0)+"」からはじまります"+(same>1? "（この県には旧国名が"+same+"つあります）":""),
    ex ? "「"+ex+"」ということばでも知られています" : "よみは"+kp.yomi.length+"文字です",
    "よみは「"+kp.yomi+"」です"];
}

/* ---- §3-1 出題対象の選定 ---- */
function pickKPs(n){
  const p=prog()||{items:{}};
  const cands = KPS.filter(function(k){ return !itemRO(k.id,p).mastered; });
  cands.sort(function(a,b){
    const ia=itemRO(a.id,p), ib=itemRO(b.id,p);
    if((ib.totalWrong||0)!==(ia.totalWrong||0)) return (ib.totalWrong||0)-(ia.totalWrong||0);
    const ua=ia.lastSeenAt?1:0, ub=ib.lastSeenAt?1:0;
    if(ua!==ub) return ua-ub;
    return (ia.lastSeenAt||"")<(ib.lastSeenAt||"") ? -1 : 1;
  });
  return cands.slice(0,n).map(function(k){return k.id;});
}
function attentionKPs(){
  const p=prog()||{items:{}};
  return KPS.filter(function(k){ return (itemRO(k.id,p).postMasterWrong||0)>=1; }).map(function(k){return k.id;});
}
function unseenKPs(){
  const p=prog()||{items:{}};
  return KPS.filter(function(k){ const it=itemRO(k.id,p);
    return !it.mastered && (it.totalCorrect||0)+(it.totalWrong||0)===0; }).map(function(k){return k.id;});
}
/* おぼえるモード：まだ見たことのないKPを優先して選ぶ */
function pickLearnKPs(n){
  const un = unseenKPs();
  if(un.length>=n) return shuffle(un).slice(0,n);
  const rest = pickKPs(n).filter(function(id){ return un.indexOf(id)<0; });
  return un.concat(rest).slice(0,n);
}

/* ---- セッション ---- */
let S = null;
function startSession(mode, kpIdsOverride, opts){
  opts = opts || {};
  if(!loggedIn()){ view='gate'; render(); return; }
  const p = prog(); if(!p) return;
  let kpIds;
  if(kpIdsOverride) kpIds = kpIdsOverride.slice();
  else if(mode==="全問") kpIds = KPS.map(function(k){return k.id;});
  else if(mode==="再確認") kpIds = attentionKPs();
  else kpIds = pickKPs(mode==="20問"?20:10);

  if(!kpIds.length){ alert("いま出題できることばがありません。"); return; }
  const want = mode==="全問"? KPS.length : (mode==="再確認"? kpIds.length : (mode==="20問"?20:10));
  const short = (mode==="10問"||mode==="20問") && kpIds.length<want;

  S = {mode:mode, startedAt:nowISO(), queue:[], idx:0, view:0, answers:[],
       work:{}, masteredStart:{}, rq:{}, needReview:{}, short:short, wanted:want, got:kpIds.length,
       teach:!!opts.teach, title:opts.title||"", hintCount:0, guessCount:0};
  kpIds.forEach(function(id){
    S.work[id] = clone(itemRO(id,p));
    if(S.work[id].mastered) S.masteredStart[id]=1;
    S.rq[id]=0;
  });

  if(mode==="全問"){
    shuffle(kpIds).forEach(function(id){
      const lf = S.work[id].lastFormat;
      const f = lf ? (lf==="A"?"B":"A") : (Math.random()<.5?"A":"B");
      S.queue.push({kpId:id, fmt:f});
    });
  }else{
    const pass1=[], pass2=[];
    shuffle(kpIds).forEach(function(id){
      const lf=S.work[id].lastFormat;
      pass1.push({kpId:id, fmt: lf==="A" ? "B" : "A"});
    });
    shuffle(kpIds).forEach(function(id){
      const f1 = pass1.filter(function(e){return e.kpId===id;})[0].fmt;
      pass2.push({kpId:id, fmt: f1==="A"?"B":"A"});
    });
    S.queue = pass1.concat(pass2);
  }
  S.queue.forEach(function(e){ e.q = makeQuestion(KP_BY_ID[e.kpId], e.fmt); });

  /* 【おぼえるモード】初見のことばは、最初の1回だけカードで見せてから出題する */
  const marked={};
  S.queue.forEach(function(e){
    if(marked[e.kpId]) return;
    const it=S.work[e.kpId];
    const unseen = (it.totalCorrect||0)+(it.totalWrong||0)===0 && !it.mastered;
    if(opts.teach || unseen){ e.teach=true; marked[e.kpId]=1; }
  });
  go("quiz");
}

function remainingKP(){
  const set={};
  for(let i=S.idx;i<S.queue.length;i++) set[S.queue[i].kpId]=1;
  return Object.keys(set).length;
}
function requeue(entry, offset){
  const id = entry.kpId;
  if(S.rq[id] >= 4){ S.needReview[id]=1; return null; }   // §5 同一KPの再出題上限4回
  S.rq[id]++;
  const f = entry.fmt==="A"?"B":"A";                       // 直前と必ず異なる形式
  let at = S.idx + offset;
  if(at > S.queue.length) at = S.queue.length;
  while(at < S.queue.length && S.queue[at].kpId===id) at++;   // 埋まっていれば直後の空きへ
  const ne = {kpId:id, fmt:f, q:makeQuestion(KP_BY_ID[id], f), re:true};
  S.queue.splice(at,0,ne);
  return ne;
}
function hasPending(kpId, afterIdx){
  for(let j=afterIdx+1;j<S.queue.length;j++){
    if(S.queue[j].kpId===kpId && !S.answers[j]) return true;
  }
  return false;
}
function undoAnswer(i){
  const a = S.answers[i]; if(!a) return;
  const e = S.queue[i];
  S.work[e.kpId] = clone(a.snapshot);
  if(a.inserted){
    const at = S.queue.indexOf(a.inserted);
    if(at > i){ S.queue.splice(at,1); S.rq[e.kpId]=Math.max(0,S.rq[e.kpId]-1); }
  }
  S.answers[i]=null;
}
function applyAnswer(i, chosen, opts){
  opts = opts || {};
  const e = S.queue[i], kp = KP_BY_ID[e.kpId], it = S.work[e.kpId];
  const ok = (chosen === e.q.answer);
  /* ヒントを使った正解・「まぐれ」申告の正解は、習得カウント(streak)を進めない */
  const noStreak = (e.hints||0) > 0 || !!opts.noStreak;
  const snap = clone(it);
  const at = nowISO();
  const wasMastered = it.mastered;

  if(S.mode==="再確認"){
    /* §3-3 誤答しても postMasterWrong を増やす以外の状態変更をしない */
    if(!ok){
      it.postMasterWrong = (it.postMasterWrong||0)+1;
      it.wrongLog.unshift({at:at, format:e.fmt, answered:chosen});
      it.wrongLog = it.wrongLog.slice(0,5);
    }
    it.lastSeenAt = at; it.lastFormat = e.fmt;
  }else{
    it.lastSeenAt = at;
    if(ok){
      it.totalCorrect++; it.byFormat[e.fmt].correct++;
      if(!it.mastered && !noStreak){
        if(!(it.lastFormat===e.fmt && it.streak>0)) it.streak++;   // 同形式の連続では進めない
        if(it.streak >= requiredStreak(it)){ it.mastered=true; it.masteredAt=at; }
      }
    }else{
      it.totalWrong++; it.byFormat[e.fmt].wrong++;
      it.streak = 0;                                               // §4-1 誤答でリセット
      if(it.mastered) it.postMasterWrong=(it.postMasterWrong||0)+1;// §4-2 降格せず印を付ける
      it.wrongLog.unshift({at:at, format:e.fmt, answered:chosen});
      it.wrongLog = it.wrongLog.slice(0,5);
    }
    it.lastFormat = e.fmt;
  }

  let inserted=null;
  if(S.mode!=="全問"){                                             // §5 復習キュー
    if(!ok) inserted = requeue(e,3);                               // 誤答は必ず3問後
    else if(!it.mastered && !hasPending(e.kpId, i)) inserted = requeue(e,6);
    /* 正解したが未習得のときは6問後に再投入。ただし、まだ出していない同じKPの
       問題（もう一方の出題形式）がキューに残っていれば、それが復習を兼ねるので重複させない。
       これにより10問モードの実出題数は基本20問（§3-1）に保たれる。 */
  }
  S.answers[i] = {ok:ok, chosen:chosen, snapshot:snap, inserted:inserted,
                  noStreak:noStreak, guess:!!opts.guess, hints:(e.hints||0),
                  newlyMastered: (!wasMastered && it.mastered)};
  return ok;
}

function onChoice(val){
  const i = S.view;
  if(i > S.idx) return;
  if(S.answers[i]){                     // §6-1 再解答できるのは直前の1問のみ
    if(i !== S.idx-1) return;
    undoAnswer(i);
  }
  applyAnswer(i, val);
  render();
}
/* 【ヒント】段階的に開く。使った時点で習得カウントは進めない */
function useHint(){
  const i=S.view, e=S.queue[i];
  if(S.answers[i]) return;
  if((e.hints||0) >= e.q.hints.length) return;
  e.hints = (e.hints||0)+1; S.hintCount++;
  render();
}
/* 【まぐれ申告】正解を取り消さずに、習得カウントだけ進めなかったことにする */
function markGuess(){
  const i=S.view, a=S.answers[i];
  if(!a || !a.ok || a.guess || i!==S.idx) return;
  const chosen=a.chosen;
  undoAnswer(i);
  applyAnswer(i, chosen, {noStreak:true, guess:true});
  S.guessCount++;
  render();
}
/* 【おぼえるカード】読んだら問題へ */
function taught(){ S.queue[S.view].taught = true; render(); }
function nextQ(){
  if(S.view < S.idx){ S.view = S.idx; render(); return; }
  if(!S.answers[S.idx]) return;
  S.idx++; S.view = S.idx;
  if(S.idx >= S.queue.length){ finishSession(); return; }
  render();
}
function prevQ(){ if(S.view>0){ S.view--; render(); } }
function fwdQ(){ if(S.view<S.idx){ S.view++; render(); } }

/* §6-2 結果画面に到達した時点でのみ確定 */
let LAST_RESULT = null;
function finishSession(){
  const p = prog(); if(!p) return;
  let correct=0, wrong=0; const wrongKpIds=[], newly=[];
  S.answers.forEach(function(a,i){
    if(!a) return;
    if(a.ok) correct++; else { wrong++; const id=S.queue[i].kpId; if(wrongKpIds.indexOf(id)<0) wrongKpIds.push(id); }
  });
  Object.keys(S.work).forEach(function(id){
    if(S.work[id].mastered && !S.masteredStart[id]) newly.push(id);
    p.items[id] = S.work[id];                                     // 一括で永続化
  });
  let totalMastered=0;
  Object.keys(p.items).forEach(function(k){ if(p.items[k].mastered) totalMastered++; });
  const rec = {startedAt:S.startedAt, finishedAt:nowISO(), mode:S.mode,
    correct:correct, wrong:wrong, newlyMastered:newly, wrongKpIds:wrongKpIds,
    totalMastered:totalMastered};
  p.sessions.unshift(rec);                                        // §11 これが履歴シートの行になる
  p.sessions = p.sessions.slice(0,100);
  saveDB();
  LAST_RESULT = {rec:rec, answers:S.answers.slice(), queue:S.queue.slice(),
                 needReview:Object.keys(S.needReview), mode:S.mode,
                 hintCount:S.hintCount, guessCount:S.guessCount, title:S.title,
                 taught:S.queue.filter(function(e){return e.teach;}).length};
  S = null;
  go("result");
  pushCloud(true);                                                // 終了直後に自動push（自分のID1件だけ）
}
function abortSession(){
  showModal("<h3>とちゅうでやめますか？</h3><p class='muted'>ここまでの成績は<b>記録されません</b>。</p>",

     {t:"つづける",cls:"btn sec",fn:closeModal}]);
}

/* ---- §16 自前SVG日本地図（外部タイル不使用） ---- */
const MAPCFG={minLng:127,maxLng:146,minLat:30,maxLat:46,S:32,K:0.81};
function proj(lat,lng){
  return [ (lng-MAPCFG.minLng)*MAPCFG.K*MAPCFG.S, (MAPCFG.maxLat-lat)*MAPCFG.S ];
}
function svgMap(hits, subs, labelMap){
  const W=Math.round((MAPCFG.maxLng-MAPCFG.minLng)*MAPCFG.K*MAPCFG.S);
  const H=Math.round((MAPCFG.maxLat-MAPCFG.minLat)*MAPCFG.S);
  let s = "<svg class='jp' viewBox='0 0 "+W+" "+H+"' role='img' aria-label='日本地図'>";
  JP_SHAPES.forEach(function(poly){
    s += "<polygon class='land' points='"+poly.map(function(p){
      const c=proj(p[0],p[1]); return c[0].toFixed(1)+","+c[1].toFixed(1); }).join(" ")+"'/>";
  });
  ALL_PREFS.forEach(function(pn){
    const ll=PREF_LL[pn], c=proj(ll[0],ll[1]);
    const isHit = hits && hits.indexOf(pn)>=0;
    const isSub = !isHit && subs && subs.indexOf(pn)>=0;
    if(isHit)      s += "<circle class='hit'  cx='"+c[0].toFixed(1)+"' cy='"+c[1].toFixed(1)+"' r='7'><title>"+esc(pn)+"</title></circle>";
    else if(isSub) s += "<circle class='hit2' cx='"+c[0].toFixed(1)+"' cy='"+c[1].toFixed(1)+"' r='6'><title>"+esc(pn)+"</title></circle>";
    else           s += "<circle class='dot'  cx='"+c[0].toFixed(1)+"' cy='"+c[1].toFixed(1)+"' r='2.6'><title>"+esc(pn)+"</title></circle>";
  });
  const placed=[];
  (hits||[]).concat(subs||[]).forEach(function(pn){
    if(!PREF_LL[pn]) return;
    const ll=PREF_LL[pn], c=proj(ll[0],ll[1]);
    let x=c[0]+10, y=c[1]+5, tries=0;
    while(tries++<8 && placed.some(function(q){ return Math.abs(q.y-y)<14 && Math.abs(q.x-x)<70; })) y+=15;
    placed.push({x:x,y:y});
    s += "<line x1='"+c[0].toFixed(1)+"' y1='"+c[1].toFixed(1)+"' x2='"+(x-2).toFixed(1)+"' y2='"+(y-4).toFixed(1)+
         "' stroke='#8b5e34' stroke-width='0.8'/>";
    s += "<text x='"+x.toFixed(1)+"' y='"+y.toFixed(1)+"'>"+esc((labelMap&&labelMap[pn])||pn)+"</text>";
  });
  return s+"</svg>";
}
function mapBlock(kp){
  const main=[kp.prefs[0]?kp.prefs[0].n:null].filter(Boolean);
  const subs=kp.prefNames.filter(function(p){return main.indexOf(p)<0;});
  return "<div class='mapwrap'>"+svgMap(main,subs)+
    "<div class='legend'>● 赤＝おもな都道府県／● 黄＝関係する都道府県（一部をふくむ）</div></div>";
}

/* =============== セットで覚える（前・中・後／上・下） =============== */
function setKPs(s){
  return s.ks.map(function(n){ return KPS.filter(function(k){return k.name===n;})[0]; }).filter(Boolean);
}
function setLabels(ks){
  const lm={}, num="①②③④⑤";
  ks.forEach(function(k,i){
    const t=num.charAt(i)+k.name;
    lm[k.main]= lm[k.main] ? lm[k.main]+"・"+t : t;
  });
  return lm;
}
function setsHTML(){
  let h = "<div class='row'><h1 style='margin:0'>セットで覚える</h1><div class='spacer'></div>"+
          "<button class='btn gray sm' data-a='home'>← ホーム</button></div>";
  h += "<div class='card'><div class='rulebox'>"+SET_RULE+"</div></div>";
  SETS.forEach(function(s,i){
    const ks = setKPs(s);
    let m=0; ks.forEach(function(k){ if(itemRO(k.id).mastered) m++; });
    h += "<div class='setcard'><div class='row'><b style='font-size:1.05rem'>"+esc(s.t)+"</b>"+
      "<div class='spacer'></div><span class='muted tiny'>習得 "+m+"/"+ks.length+"</span></div>"+
      "<ol>"+ks.map(function(k){
        return "<li><span class='kn'>"+esc(k.name)+"</span>（"+esc(k.yomi)+"）… "+esc(prefsLabel(k))+
          (k.geo? " <span class='muted tiny'>"+esc(firstEx(k.geo))+"</span>":"")+"</li>"; }).join("")+"</ol>"+
      "<div class='muted tiny'>"+esc(s.note)+"</div>"+
      "<div class='mapwrap'>"+svgMap([ks[0].main],
          ks.slice(1).map(function(k){return k.main;}).filter(function(v,n,a){ return a.indexOf(v)===n && v!==ks[0].main; }),
          setLabels(ks))+
        "<div class='legend'>● 赤＝①"+esc(ks[0].name)+"（都に近い方）／● 黄＝そのつづき</div></div>"+
      "<button class='btn sm' style='margin-top:10px' data-set='"+i+"'>▶ このセットだけで出題する</button></div>";
  });
  h += "<div class='card'><div class='muted tiny'>【注】かつて陸奥・陸中・陸前・岩代・磐城をまとめて「陸奥」、羽前・羽後をまとめて「出羽」とよんでいたことがあります。</div></div>";
  h += "<button class='btn gray' data-a='home'>← ホームへ</button>";
  return h;
}

/* =============== 一覧（結果画面とホームで共用） =============== */
let FILTER={cat:"", st:"", sort:"wrong"};
function listHTML(ns){
  let h = "<div class='filters'>"+
    "<select data-f='cat'><option value=''>地方：すべて</option>"+
      CATS.map(function(c){return "<option value='"+esc(c)+"'"+(FILTER.cat===c?" selected":"")+">"+esc(c)+"</option>";}).join("")+"</select>"+
    "<select data-f='st'><option value=''>状態：すべて</option>"+
      ["習得済み","要注意習得","正解あり","誤答","未出題"].map(function(s){
        return "<option value='"+esc(s)+"'"+(FILTER.st===s?" selected":"")+">"+esc(s)+"</option>";}).join("")+"</select>"+
    "<select data-f='sort'>"+
      [["wrong","誤答数の多い順"],["no","教材の番号順"],["name","旧国名順"]].map(function(o){
        return "<option value='"+o[0]+"'"+(FILTER.sort===o[0]?" selected":"")+">"+o[1]+"</option>";}).join("")+"</select>"+
    "</div>";
  let rows = KPS.slice();
  if(FILTER.cat) rows = rows.filter(function(k){return k.cat===FILTER.cat;});
  if(FILTER.st) rows = rows.filter(function(k){
    const it=itemRO(k.id), s=kpState(it);
    if(FILTER.st==="正解あり") return /回正解/.test(s);
    return s===FILTER.st;
  });
  if(FILTER.sort==="wrong") rows.sort(function(a,b){ return (itemRO(b.id).totalWrong||0)-(itemRO(a.id).totalWrong||0) || a.no-b.no; });
  else if(FILTER.sort==="name") rows.sort(function(a,b){ return a.name.localeCompare(b.name,"ja"); });
  else rows.sort(function(a,b){ return (a.type===b.type? a.no-b.no : (a.type==="kuni"?-1:1)); });

  h += "<div style='overflow:auto;max-height:70vh'><table><thead><tr>"+
    "<th>旧国名</th><th>今の都道府県</th><th>状態</th><th>誤答</th></tr></thead><tbody>";
  rows.forEach(function(k){
    const it=itemRO(k.id), s=kpState(it);
    const cls = s==="習得済み"?"m":(s==="要注意習得"?"c":(/回正解/.test(s)?"c":(s==="誤答"?"n":"u")));
    h += "<tr class='krow' data-kp='"+k.id+"'>"+
      "<td><b>"+esc(k.name)+"</b><br><span class='muted tiny'>"+esc(k.yomi)+"</span></td>"+
      "<td class='tiny'>"+esc(k.type==="kuni"?prefsLabel(k):k.kunis.join("＋"))+"</td>"+
      "<td class='st "+cls+"'>"+esc(s)+"</td>"+
      "<td class='tiny'>"+(it.totalWrong>0? "<span class='badge "+(it.totalWrong>=2?"w":"")+"'>誤答"+it.totalWrong+"回</span>":"")+"</td></tr>";
    h += "<tr class='detail hidden' data-det='"+k.id+"'><td colspan='4'>"+detailHTML(k,it)+"</td></tr>";
  });
  return h+"</tbody></table></div>";
}
function detailHTML(k,it){
  let h="";
  if(k.type==="kuni"){
    h += "<div><span class='k'>今の都道府県：</span>"+esc(prefsLabel(k))+"</div>";
    if(k.geo)  h += "<div><span class='k'>地理のことば：</span>"+esc(k.geo)+"</div>";
    if(k.hist) h += "<div><span class='k'>歴史のことば：</span>"+esc(k.hist)+"</div>";
  }else{
    h += "<div><span class='k'>ふくまれる旧国名：</span>"+esc(k.kunis.join("・"))+"</div>";
    h += "<div>"+esc(k.desc)+"</div>";
  }
  h += "<div style='margin-top:4px'>形式A（旧国名→都道府県）："+it.byFormat.A.correct+"回正解／"+it.byFormat.A.wrong+"回ミス"+
       "　形式B（都道府県→旧国名）："+it.byFormat.B.correct+"回正解／"+it.byFormat.B.wrong+"回ミス</div>";
  if(it.wrongLog.length){
    h += "<div>過去の誤答："+it.wrongLog.map(function(w){
      return esc(fmtDate(w.at)+" "+(w.format==="A"?"旧国名→都道府県":"都道府県→旧国名")+"／"+w.answered+"と誤答"); }).join(" ／ ")+"</div>";
  }
  if(it.masteredAt) h += "<div>習得日："+fmtDate(it.masteredAt)+(it.postMasterWrong>0? "（そのあと"+it.postMasterWrong+"回ミス＝要注意）":"")+"</div>";
  return h;
}

/* =============== 出題画面 =============== */
function quizHTML(){
  const i=S.view, e=S.queue[i], q=e.q, kp=KP_BY_ID[e.kpId];
  const ans=S.answers[i];
  let corr=0,wr=0;
  S.answers.forEach(function(a){ if(a){ a.ok?corr++:wr++; } });
  const pct = Math.round(S.idx/S.queue.length*100);
  const it = S.work[e.kpId];
  const req = requiredStreak(it);
  const gauge = it.mastered ? "習得済み ✓"
    : Array.from({length:req},function(_,n){ return n < it.streak ? "●":"○"; }).join("");

  let h="<div class='hud'><div class='bar'><i style='width:"+pct+"%'></i></div>"+
    "<div class='line' style='margin-top:5px'>"+
      "<span>"+(i+1)+"問目 / 全"+S.queue.length+"問</span>"+
      "<span>あと"+remainingKP()+"語</span>"+
      "<span>正解"+corr+"　誤答"+wr+"</span>"+
      "<span class='spacer'></span>"+
      "<span>"+esc(S.mode)+"モード</span>"+
    "</div>"+
    "<div class='line'><span class='gauge'>"+gauge+"</span>"+
      "<span class='tiny' style='align-self:center'>"+(it.mastered? "" :
        (req>2? "このことばは苦手なので"+req+"回れんぞく正解が必要（形式をかえて）" : "あと"+Math.max(0,req-it.streak)+"回れんぞく正解で習得"))+"</span></div>"+
    "</div>";

  if(S.short && i===0 && !ans){
    h += "<div class='warnbar'>出題できることばが"+S.got+"語しかないため、"+S.got+"語で出題します。</div>";
  }

  /* 【おぼえるカード】まだ見たことのないことばは、先にカードで見せる */
  if(e.teach && !e.taught && !ans){
    h += "<div class='card teach'><div class='row'><span class='qlabel'>📖 はじめてのことば</span>"+
      "<span class='spacer'></span><span class='muted tiny'>読んでから問題にすすみます</span></div>"+
      "<div class='qmain"+(kp.type==="compound"?" small":"")+"' style='margin-top:10px'>"+esc(kp.name)+"</div>"+
      "<div class='qyomi' style='text-align:center;font-size:1.05rem'>（"+esc(kp.yomi)+"）</div>"+
      "<div class='teachbody'>"+expHTML(kp)+"</div>"+
      mapBlock(kp)+
      "<button class='btn wide' style='margin-top:12px' data-a='taught'>おぼえた！ 問題へ →</button></div>";
    h += "<div class='row' style='margin-top:14px'><button class='btn gray sm' data-a='abort'>とちゅうでやめる</button></div>";
    return h;
  }

  h += "<div class='qbox'><span class='qlabel'>"+esc(q.label)+"</span>"+
    "<div class='qtext'>"+esc(q.text)+"</div>"+
    "<div class='qmain"+(q.big?"":" small")+"'>"+esc(q.main)+"</div>"+
    (q.yomi? "<div class='qyomi'>（"+esc(q.yomi)+"）</div>":"")+
    "<div class='choices'>"+
      q.choices.map(function(c){
        let cls="choice";
        if(ans){
          if(c.v===q.answer) cls+=" correct";
          else if(c.v===ans.chosen) cls+=" wrong";
          else cls+=" dim";
        }
        return "<button class='"+cls+"' data-c='"+esc(c.v)+"'>"+esc(c.label)+
          (c.yomi? "<span class='yomi'>"+esc(c.yomi)+"</span>":"")+"</button>";
      }).join("")+
    "</div>";

  /* 【ヒント】段階的に開く */
  const hn = e.hints||0;
  if(hn>0){
    h += "<div class='hints'>"+q.hints.slice(0,hn).map(function(t,n){
      return "<div>💡 ヒント"+(n+1)+"：<b>"+esc(t)+"</b></div>"; }).join("")+
      (ans? "" : "<div class='tiny' style='margin-top:4px'>ヒントを使ったので、この問題は習得のカウントを進めません。</div>")+"</div>";
  }
  if(!ans && hn < q.hints.length){
    h += "<button class='btn gray sm' style='margin-top:10px' data-a='hint'>💡 ヒントを見る（"+(hn+1)+"/"+q.hints.length+"）</button>";
  }
  h += "</div>";

  if(ans){
    h += "<div class='fb "+(ans.ok?"ok":"ng")+"'>"+
      "<b>"+(ans.ok? "◯ せいかい！":"✕ ざんねん…　正解は「"+esc(q.answer)+"」")+"</b>"+
      (ans.newlyMastered? " <span class='badge g'>習得！</span>":"")+
      (ans.ok && ans.noStreak? " <span class='badge w'>習得カウントなし</span>":"")+
      "<div class='exp'>"+expHTML(kp)+"</div></div>";
    if(ans.ok && !ans.noStreak && S.view===S.idx){
      h += "<div class='row' style='margin-top:8px'><button class='btn gray sm' data-a='guess'>🤔 いまのはまぐれ（習得カウントに入れない）</button></div>";
    }
    h += mapBlock(kp);
  }

  h += "<div class='row' style='margin-top:14px'>"+
    "<button class='btn gray sm' data-a='prev' "+(S.view>0?"":"disabled")+">← 前の問題へ</button>"+
    (S.view<S.idx? "<button class='btn gray sm' data-a='fwd'>進む →</button>":"")+
    "<span class='spacer'></span>"+
    (ans && S.view===S.idx ? "<button class='btn' data-a='next'>"+(S.idx+1>=S.queue.length? "結果を見る":"つぎへ →")+"</button>":"")+
    "</div>";
  if(S.view<S.idx){
    h += "<div class='muted tiny'>"+(S.view===S.idx-1
      ? "この問題は選びなおせます（正誤を上書きします）。"
      : "これより前の問題は見るだけです。")+"</div>";
  }
  h += "<div class='row' style='margin-top:18px'><button class='btn gray sm' data-a='abort'>とちゅうでやめる</button>"+
       "<span class='muted tiny'>成績は結果画面に着いたときだけ記録されます。</span></div>";
  return h;
}
function expHTML(kp){
  if(kp.type==="kuni"){
    let h = "<span class='k'>"+esc(kp.name)+"（"+esc(kp.yomi)+"）</span>＝今の <b>"+esc(prefsLabel(kp))+"</b>";
    if(kp.geo)  h += "<br><span class='k'>地理：</span>"+esc(kp.geo);
    if(kp.hist) h += "<br><span class='k'>歴史：</span>"+esc(kp.hist);
    return h;
  }
  return "<span class='k'>"+esc(kp.name)+"（"+esc(kp.yomi)+"）</span>＝ "+esc(kp.kunis.join("＋"))+
    "<br>"+esc(kp.desc);
}

/* =============== 結果画面 =============== */
function resultHTML(){
  const R=LAST_RESULT; if(!R) return "<p>結果がありません。</p>";
  const total=R.rec.correct+R.rec.wrong;
  const rate= total? Math.round(R.rec.correct/total*100):0;
  let h = "<h1>けっか（"+esc(R.mode)+"モード）</h1>";
  h += "<div class='card'><div class='row'>"+
    "<div style='flex:1'><div class='muted tiny'>正解</div><div style='font-size:1.6rem;font-weight:800;color:var(--ok)'>"+R.rec.correct+"</div></div>"+
    "<div style='flex:1'><div class='muted tiny'>誤答</div><div style='font-size:1.6rem;font-weight:800;color:var(--ng)'>"+R.rec.wrong+"</div></div>"+
    "<div style='flex:1'><div class='muted tiny'>正答率</div><div style='font-size:1.6rem;font-weight:800'>"+rate+"%</div></div>"+
    "<div style='flex:1'><div class='muted tiny'>新しく習得</div><div style='font-size:1.6rem;font-weight:800;color:var(--accent)'>"+R.rec.newlyMastered.length+"</div></div>"+
    "</div>"+
    "<div class='muted tiny' style='margin-top:6px'>これまでの習得は合計 "+R.rec.totalMastered+" / "+KPS.length+" 語です。"+
      (R.taught? "　今回はじめて見たことば "+R.taught+"語。":"")+
      (R.hintCount? "　ヒント "+R.hintCount+"回。":"")+
      (R.guessCount? "　まぐれ申告 "+R.guessCount+"回。":"")+
      ((R.hintCount||R.guessCount)? "（この問題は習得カウントに入れていません）":"")+"</div></div>";

  if(R.rec.newlyMastered.length){
    h += "<div class='card'><h2 style='margin-top:0'>今回あたらしく習得したことば</h2>"+
      R.rec.newlyMastered.map(function(id){ const k=KP_BY_ID[id];
        return "<span class='badge g' style='margin:3px'>"+esc(k.name)+"（"+esc(k.yomi)+"）</span>"; }).join("")+"</div>";
  }
  if(R.needReview.length){
    h += "<div class='card'><h2 style='margin-top:0'>要復習</h2><div class='muted tiny'>1回のセッションで出しきれなかったことばです。</div>"+
      R.needReview.map(function(id){ const k=KP_BY_ID[id];
        return "<span class='badge w' style='margin:3px'>"+esc(k.name)+"</span>"; }).join("")+"</div>";
  }

  const wrongs=[];
  R.answers.forEach(function(a,i){ if(a && !a.ok) wrongs.push({e:R.queue[i],a:a}); });
  h += "<div class='card'><h2 style='margin-top:0'>今回まちがえた問題（"+wrongs.length+"）</h2>";
  if(!wrongs.length) h += "<div class='muted'>まちがいはありませんでした。すばらしい！</div>";
  else h += "<table><thead><tr><th>ことば</th><th>形式</th><th>あなたの答え</th><th>正解</th></tr></thead><tbody>"+
    wrongs.map(function(w){ const k=KP_BY_ID[w.e.kpId];
      return "<tr class='krow' data-kp='"+k.id+"'><td><b>"+esc(k.name)+"</b><br><span class='muted tiny'>"+esc(k.yomi)+"</span></td>"+
        "<td class='tiny'>"+(w.e.fmt==="A"?"旧国名→都道府県":"都道府県→旧国名")+"</td>"+
        "<td class='tiny' style='color:var(--ng)'>"+esc(w.a.chosen)+"</td>"+
        "<td class='tiny' style='color:var(--ok)'>"+esc(w.e.q.answer)+"</td></tr>"+
        "<tr class='detail hidden' data-det='"+k.id+"'><td colspan='4'>"+detailHTML(k,itemRO(k.id))+"</td></tr>"; }).join("")+
    "</tbody></table>";
  h += "</div>";

  h += "<div class='card'><h2 style='margin-top:0'>地方べつ 全問一覧（累計）</h2>"+listHTML("result")+"</div>";
  h += "<div class='row'><button class='btn' data-a='home'>ホームへ</button>"+
       "<button class='btn sec' data-a='csv'>⬇ 結果をCSVでダウンロード</button></div>";
  return h;
}

/* =============== 描画 =============== */
function renderSyncBar(){
  const el=$("syncbar"); if(!el) return;
  el.className = "sync "+(SYNC_MSG.cls||"");
  el.textContent = SYNC_MSG.text;
}
function render(){
  if(!ready()||!loggedIn()){
    view="gate";
    $("app").innerHTML=renderGate();
    bind();
    return;
  }
  let h="";
  if(view==="quiz" && S) h=quizHTML();
  else if(view==="sets") h=setsHTML();
  else if(view==="result") h=resultHTML();
  else { view="home"; h=homeHTML(); }
  $("app").innerHTML=h;
  renderSyncBar();
  bind();
}
function bind(){
  const app=$("app");
  app.querySelectorAll("[data-a]").forEach(function(b){ b.onclick=function(){ action(b.getAttribute("data-a")); }; });
  app.querySelectorAll("[data-c]").forEach(function(b){ b.onclick=function(){ onChoice(b.getAttribute("data-c")); }; });
  app.querySelectorAll("[data-kp]").forEach(function(r){ r.onclick=function(){
    const d=app.querySelector("[data-det='"+r.getAttribute("data-kp")+"']");
    if(d) d.classList.toggle("hidden"); }; });
  app.querySelectorAll("[data-rank]").forEach(function(r){ r.onclick=function(){
    const id=r.getAttribute("data-rank");
    const p=prog()||{items:{}};
    const others=KPS.filter(function(k){return k.id!==id && !itemRO(k.id,p).mastered;})
      .sort(function(a,b){ return (itemRO(b.id,p).totalWrong||0)-(itemRO(a.id,p).totalWrong||0); })
      .slice(0,9).map(function(k){return k.id;});
    startSession("10問",[id].concat(others)); }; });
  app.querySelectorAll("[data-set]").forEach(function(b){ b.onclick=function(){
    const s=SETS[+b.getAttribute("data-set")];
    startSession("10問", setKPs(s).map(function(k){return k.id;}), {teach:true, title:s.t}); }; });
  app.querySelectorAll("[data-f]").forEach(function(s){ s.onchange=function(){
    FILTER[s.getAttribute("data-f")]=s.value; saveUI(); render(); }; });
}
function action(a){
  if(a==="portal"){ location.href=portalURL(); return; }
  if(a==="reload"){ loadAll(); view=(loggedIn()&&ready())?"home":"gate"; render(); if(ready()&&AUTH) pullCloud(true); return; }
  if(a==="home") return go("home");
  if(a==="sets") return go("sets");
  if(a==="learn"){
    const ids = pickLearnKPs(10);
    if(!ids.length) return alert("いま出題できることばがありません。");
    return startSession("10問", ids, {teach:true});   // §10 modeは既存の4値に寄せる
  }
  if(a==="hint") return useHint();
  if(a==="guess") return markGuess();
  if(a==="taught") return taught();
  if(a==="start10") return startSession("10問");
  if(a==="start20") return startSession("20問");
  if(a==="startall") return startSession("全問");
  if(a==="startatt") return startSession("再確認");
  if(a==="prev") return prevQ();
  if(a==="fwd") return fwdQ();
  if(a==="next") return nextQ();
  if(a==="abort") return abortSession();
  if(a==="exp") return exportJSON();
  if(a==="imp") return importJSON();
  if(a==="reset") return resetRecords();
  if(a==="syncnow") return pullCloud();
  if(a==="drive") return exportDrive();
  if(a==="csv") return downloadCSV();
}

/* =============== 書き出し（14列で統一） =============== */
const EXPORT_HEADER = ["名前","カテゴリー","記号","知識ポイント","よみがな","重要度","状態",
  "累計正解数","累計誤答数","形式A誤答数","形式B誤答数","過去の誤答内容","最終誤答日","習得日"];
function rowFor(k,it){
  it = it || blankItem();
  const last=(it.wrongLog&&it.wrongLog[0])? fmtDate(it.wrongLog[0].at):"";
  return [ AUTH?AUTH.id:"", k.cat, (k.type==="kuni"?"旧":"複")+k.no, k.name, k.yomi, k.imp, kpState(it),
    it.totalCorrect||0, it.totalWrong||0, it.byFormat.A.wrong||0, it.byFormat.B.wrong||0,
    (it.wrongLog||[]).map(function(w){return w.answered;}).join(";"), last, fmtDate(it.masteredAt)];
}
function buildListRows(){
  const p=prog()||{items:{}};
  const rows=KPS.map(function(k){ return rowFor(k, p.items[k.id]); });
  rows.sort(function(x,y){ return (y[8]||0)-(x[8]||0); });   // 既定は誤答数の多い順
  return rows;
}
function downloadCSV(){
  const p=prog()||{items:{}};
  let rows=KPS.map(function(k){ return rowFor(k,p.items[k.id]).concat([AUTH.label||""]); });
  rows.sort(function(x,y){ return (y[8]||0)-(x[8]||0); });
  const csv=[EXPORT_HEADER.concat(["表示名"])].concat(rows).map(function(r){
    return r.map(function(v){ const t=String(v==null?"":v);
      return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; }).join(","); }).join("\r\n");
  dl(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}), TOOL+"結果_"+AUTH.id+"_"+stamp()+".csv");
}
function dl(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },300);
}
async function exportDrive(){
  if(!ready()||!AUTH) return;
  setSync("","☁… 書き出し前にクラウドを確認しています");
  await pullCloud(true);                                     // 空上書き防止：先に合流してから
  if(!progHasRecords(prog())){
    setSync("err","☁⚠ 記録が空のため書き出しを中止しました");
    return showModal("<h3>書き出しを中止しました</h3><p>この端末にもクラウドにも学習の記録がありません。空のデータで上書きしてしまうのを防ぐため、書き出しを行いませんでした。</p>");
  }
  let j;
  try{ j = await api({app:APP, id:AUTH.id, list:{header:EXPORT_HEADER, rows:buildListRows()}}); }
  catch(e){
    if(/GASの応答/.test(e.message)) setSync("err","☁⚠ "+e.message);
    else setSync("","☁ オフライン（ローカルには保存済み）");
    return;
  }
  if(j && j.ok) setSync("ok","☁✓ 全問一覧をスプレッドシートに書き出しました");
  else { if(j && j.error==="auth"){ setSync("err","☁⚠ "+apiError(j)); onAuthLost(); return; }
         setSync("err","☁⚠ "+apiError(j)); }
}

/* =============== JSON 書き出し／読み込み／記録の消去 =============== */
function exportJSON(){
  dl(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}), TOOL+"記録_"+AUTH.id+"_"+stamp()+".json");
}
function importJSON(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=function(){
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=function(){
      const raw=jparse(rd.result);
      if(!raw) return alert("読み込めませんでした（JSONではありません）。");
      if(raw.app && raw.app!==APP) return alert("このファイルは別のツールの記録です（"+raw.app+"）。");
      const p=(raw.progress||{})[AUTH.id];
      if(!p) return showModal("<h3>このIDの記録がありません</h3><p>このファイルには ID "+esc(AUTH.id)+
        " の記録が入っていません（別のお子さんの記録の可能性があります）。</p>");
      const np=normProgress(p);
      showModal("<h3>この記録に置きかえますか？</h3>"+
        "<p>ID：<b>"+esc(AUTH.id)+"</b><br>保存日時：<b>"+fmtDT(raw.updatedAt)+"</b><br>"+
        "ことば数：<b>"+Object.keys(np.items).length+"</b></p>"+
        "<p class='muted tiny'>いまこの端末にある記録は消えます。</p>",
        [{t:"置きかえる",cls:"btn",fn:function(){
            DB.progress[AUTH.id]=np; saveDB(); pushCloud(true); closeModal(); go("home"); }},
         {t:"やめる",cls:"btn sec",fn:closeModal}]);
    };
    rd.readAsText(f);
  };
  inp.click();
}
function resetRecords(){
  showModal("<h3>このツールの記録を消しますか？</h3><p class='muted'>ID "+esc(AUTH.id)+
    " の「"+esc(TOOL)+"」の学習記録がすべて消えます。もとに戻せません。</p>",
    [{t:"消す",cls:"btn",fn:function(){
        DB.progress[AUTH.id]={items:{},sessions:[]}; saveDB(); pushCloud(true); closeModal(); go("home"); }},
     {t:"やめる",cls:"btn sec",fn:closeModal}]);
}

/* =============== 起動 =============== */
loadAll();
if(ready()&&loggedIn()) setSync("","☁… クラウドと同期しています");
render();
if(ready()&&loggedIn()) pullCloud(true);
/* 他のツール／ポータルでログイン状態が変わったら追従する */
window.addEventListener("storage",function(ev){
  if(ev.key!=='kj-quiz:auth'&&ev.key!=='kj-quiz:sync') return;
  if(view==="quiz"&&S&&S.answers.some(function(a){return !!a;})) return;
  loadAll(); render();
});
window.addEventListener("beforeunload",function(ev){
  if(S && S.answers.some(function(a){return !!a;})){ ev.preventDefault(); ev.returnValue=""; }
});
</script>
