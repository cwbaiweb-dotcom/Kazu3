<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中学受験 同訓異字・同音異義語・同音異字</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --sub:#5b6673; --line:#e3e7ec;
  --accent:#2f6fb5; --accent-d:#22527f; --ok:#1f8a52; --ng:#c0392b; --warn:#c47f17;
  --mast:#2f6fb5; --half:#9dc0e4; --none:#e8ecf1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.7;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 48px}
h1{font-size:1.15rem;margin:0}
h2{font-size:1.02rem;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;margin-bottom:12px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.hdr button{white-space:nowrap}
.hdr .seg button{font-size:.78rem;padding:6px 8px}
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);padding:10px 12px;line-height:1.4}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn-s{background:#eef3f9;border-color:#d6e2f0;color:var(--accent-d);font-weight:700}
.btn-sm{padding:6px 10px;font-size:.86rem;border-radius:8px}
.btn-danger{background:#fdf0ee;border-color:#f2c9c2;color:var(--ng)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;text-align:left}
.mode-btn b{font-size:1.04rem}
.mode-btn span{font-size:.76rem;color:var(--sub);font-weight:400}
.mode-btn.btn-p span{color:rgba(255,255,255,.88)}
.muted{color:var(--sub);font-size:.84rem}
.tiny{font-size:.76rem;color:var(--sub)}
.chip{border-radius:999px;padding:6px 12px;font-size:.85rem;background:#fff;border:1px solid var(--line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;flex:1;padding:8px 4px;font-size:.85rem;background:#fff}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.bar{height:9px;border-radius:6px;background:var(--none);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.m{background:var(--mast)} .bar i.h{background:var(--half)}
.qbar{height:6px;border-radius:4px;background:var(--none);overflow:hidden;margin:6px 0}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.gauge{display:inline-flex;gap:3px;vertical-align:middle}
.gauge b{width:11px;height:11px;border-radius:50%;background:var(--none);display:block}
.gauge b.on{background:var(--ok)}
.qtext{font-size:1.28rem;line-height:1.9;margin:6px 0 14px;word-break:break-word}
.blank{display:inline-block;min-width:3.4em;text-align:center;border-bottom:3px solid var(--accent);
  font-weight:700;color:var(--accent-d);padding:0 .2em}
.choices{display:grid;gap:8px}
.choice{padding:14px;font-size:1.22rem;font-weight:700;text-align:center;border:1px solid var(--line);background:#fff}
.choice.ok{background:#e8f6ee;border-color:var(--ok);color:var(--ok)}
.choice.ng{background:#fdecea;border-color:var(--ng);color:var(--ng)}
.choice.dim{opacity:.5}
.fb{border-radius:12px;padding:12px;margin-top:12px;border:1px solid}
.fb.ok{background:#e8f6ee;border-color:#b6e0c7}
.fb.ng{background:#fdecea;border-color:#f5c4bd}
.fb .ttl{font-weight:800;margin-bottom:4px}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:#eef1f5;color:var(--sub);
  border:1px solid var(--line);white-space:nowrap}
.badge.m{background:#e7f0fa;color:var(--accent-d);border-color:#c9dcf0}
.badge.w{background:#fff5e5;color:var(--warn);border-color:#f0dcb4}
.badge.ng{background:#fdecea;color:var(--ng);border-color:#f5c4bd}
.badge.imp2{background:#fdf3d6;color:#9a6f06;border-color:#f0e0a8}
.badge.imp1{background:#eaf3ec;color:#31724a;border-color:#c9e2d1}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{border-top:1px solid var(--line);padding:10px 12px;background:#fff}
.li:first-child{border-top:0}
.li .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li .kp{font-weight:700}
.li.click{cursor:pointer}
.li.click:active{background:#f4f7fb}
.mask{position:fixed;inset:0;background:rgba(18,24,32,.5);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:100}
.modal{background:#fff;border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
input[type=text],input[type=url],input[type=password],select{
  font-family:inherit;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
label{display:block;font-size:.84rem;color:var(--sub);margin:8px 0 3px}
.sync{border-radius:10px;padding:9px 11px;font-size:.85rem;border:1px solid var(--line);background:#f7f9fb}
.sync.ok{background:#e8f6ee;border-color:#b6e0c7;color:#15613a}
.sync.err{background:#fdecea;border-color:#f5c4bd;color:var(--ng)}
.card-flip{border:1px solid var(--line);border-radius:16px;background:#fff;min-height:210px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:10px;cursor:pointer}
.card-flip .big{font-size:1.9rem;font-weight:800;line-height:1.5}
.ruby{font-size:.7em;color:var(--sub);display:block}
.warnbar{background:#fff5e5;border:1px solid #f0dcb4;color:#8a6410;border-radius:10px;padding:8px 11px;
  font-size:.83rem;margin-bottom:10px}
.hide{display:none!important}
.sp{height:6px}
.right{margin-left:auto}
table.mini{width:100%;border-collapse:collapse;font-size:.84rem}
table.mini td{padding:3px 6px;border-top:1px solid var(--line)}
table.mini td:first-child{color:var(--sub);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modalRoot"></div>
<script>

"use strict";

const APP = "kj-quiz-kokugo-doukun-douon";

/* 出題形式の定義（§0）

const FMT_LABEL = { A: "例文→漢字", B: "意味→漢字" };

/* ---- 問題データ（imp は静的データ側。進捗DBには含めない §3-5①） ---- */
const DATA = [{"id":"同:あう:会う","cat":"同訓異字","grp":"あう","kana":"あう","w":"会う","m":"人と顔をあわせる","a":"駅で友だちに","b":"。","n":"","imp":2},{"id":"同:あう:合う","cat":"同訓異字","grp":"あう","kana":"あう","w":"合う","m":"ぴったり一致する。調和する","a":"みんなの意見が","b":"。","n":"","imp":2},{"id":"同:あう:遭う","cat":"同訓異字","grp":"あう","kana":"あう","w":"遭う","m":"好ましくない出来事にであう","a":"山で大雨に","b":"。","n":"","imp":1},{"id":"同:あける:開ける","cat":"同訓異字","grp":"あける","kana":"あける","w":"開ける","m":"閉じているものをひらく","a":"教室のまどを","b":"。","n":"","imp":2},{"id":"同:あける:空ける","cat":"同訓異字","grp":"あける","kana":"あける","w":"空ける","m":"中身をからにする。すきまをつくる","a":"となりの席を一つ","b":"。","n":"","imp":2},{"id":"同:あける:明ける","cat":"同訓異字","grp":"あける","kana":"あける","w":"明ける","m":"夜や年が終わって新しくなる","a":"長い梅雨がようやく","b":"。","n":"","imp":2},{"id":"同:あつい:暑い","cat":"同訓異字","grp":"あつい","kana":"あつい","w":"暑い","m":"気温が高い","a":"今年の夏はとても","b":"。","n":"","imp":2},{"id":"同:あつい:熱い","cat":"同訓異字","grp":"あつい","kana":"あつい","w":"熱い","m":"物の温度が高い。気持ちが高ぶる","a":"やかんの湯が","b":"。","n":"","imp":2},{"id":"同:あつい:厚い","cat":"同訓異字","grp":"あつい","kana":"あつい","w":"厚い","m":"厚みがある。心がこもっている","a":"この国語辞典は","b":"。","n":"","imp":2},{"id":"同:あたたかい:温かい","cat":"同訓異字","grp":"あたたかい","kana":"あたたかい","w":"温かい","m":"物や心があたたかい（⇔冷たい）","a":"作りたてのスープが","b":"。","n":"","imp":2},{"id":"同:あたたかい:暖かい","cat":"同訓異字","grp":"あたたかい","kana":"あたたかい","w":"暖かい","m":"気候や空気があたたかい（⇔寒い）","a":"今日は春のように","b":"。","n":"","imp":2},{"id":"同:あらわす:表す","cat":"同訓異字","grp":"あらわす","kana":"あらわす","w":"表す","m":"気持ちや考えを外に示す","a":"感謝の気持ちを言葉で","b":"。","n":"","imp":2},{"id":"同:あらわす:現す","cat":"同訓異字","grp":"あらわす","kana":"あらわす","w":"現す","m":"かくれていた姿をみせる","a":"犯人がついに姿を","b":"。","n":"","imp":2},{"id":"同:あらわす:著す","cat":"同訓異字","grp":"あらわす","kana":"あらわす","w":"著す","m":"本を書いて世に出す","a":"研究の成果を本に","b":"。","n":"","imp":1},{"id":"同:うつす:写す","cat":"同訓異字","grp":"うつす","kana":"うつす","w":"写す","m":"元のとおりに書き取る。撮影する","a":"黒板の字をノートに","b":"。","n":"","imp":2},{"id":"同:うつす:移す","cat":"同訓異字","grp":"うつす","kana":"うつす","w":"移す","m":"場所や位置をかえる","a":"花びんを別の部屋に","b":"。","n":"","imp":2},{"id":"同:うつす:映す /* =================== ストレージ =================== */
let memoryOnly = false;
let memStore = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ memoryOnly = true; return memStore[k] ?? null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memoryOnly = true; memStore[k] = v; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete memStore[k]; } }

function newAccId(){ return "acc_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function blankItem(){
  return { streak:0, mastered:false, masteredAt:null, postMasterWrong:0, lastFormat:null,
           totalCorrect:0, totalWrong:0,
           byFormat:{A:{correct:0,wrong:0}, B:{correct:0,wrong:0}}, wrongLog:[], lastSeenAt:null };
}
function emptyDB(){
  return { app:APP, version:SCHEMA_VERSION, updatedAt:nowISO(), activeAccountId:null, accounts:[], progress:{} };
}

/* ---- 旧スキーマからの移行（§10） ---- */
function migrate(raw){
  if(!raw || typeof raw !== "object") return emptyDB();
  let db;
  if(raw.accounts && raw.progress){
    db = raw;
  } else if(raw.users && typeof raw.users === "object"){
    // v1系 {users:{名前:{st:{...}}}} → v2
    db = emptyDB();
    Object.keys(raw.users).forEach(name=>{
      const id = newAccId();
      db.accounts.push({id, name, createdAt: nowISO()});
      const src = raw.users[name] || {};
      const st  = src.st || src.items || {};
      const items = {};
      Object.keys(st).forEach(kid=>{
        const o = st[kid] || {}; const it = blankItem();
        it.streak = o.streak|0; it.mastered = !!o.mastered; it.masteredAt = o.masteredAt || null;
        it.totalCorrect = o.totalCorrect|0; it.totalWrong = o.totalWrong|0;
        it.lastFormat = o.lastFormat || null; it.lastSeenAt = o.lastSeenAt || null;
        if(o.byFormat) it.byFormat = normByFormat(o.byFormat);
        if(Array.isArray(o.wrongLog)) it.wrongLog = o.wrongLog.slice(0,5);
        items[kid] = it;
      });
      db.progress[id] = { items, sessions: Array.isArray(src.sessions)? src.sessions : [] };
      if(!db.activeAccountId) db.activeAccountId = id;
    });
  } else {
    db = emptyDB();
  }
  db.app = APP; db.version = SCHEMA_VERSION;
  db.accounts = Array.isArray(db.accounts) ? db.accounts : [];
  db.progress = db.progress || {};
  db.accounts.forEach(a=>{
    const p = db.progress[a.id] = db.progress[a.id] || {items:{}, sessions:[]};
    p.items = p.items || {}; p.sessions = Array.isArray(p.sessions) ? p.sessions : [];
    Object.keys(p.items).forEach(kid=>{
      const it = Object.assign(blankItem(), p.items[kid]);
      it.postMasterWrong = it.postMasterWrong|0;         // v1系の補完
      it.byFormat = normByFormat(it.byFormat);
      it.wrongLog = (Array.isArray(it.wrongLog)?it.wrongLog:[])
                      .sort((x,y)=> String(y.at).localeCompare(String(x.at))).slice(0,5);
      delete it.imp;                                      // imp は進捗DBに置かない
      p.items[kid] = it;
    });
    p.sessions = p.sessions.slice(-100);
  });
  if(!db.updatedAt) db.updatedAt = nowISO();
  if(db.activeAccountId && !db.accounts.some(a=>a.id===db.activeAccountId)) db.activeAccountId = null;
  if(!db.activeAccountId && db.accounts.length) db.activeAccountId = db.accounts[0].id;
  return db;
}
function normByFormat(bf){
  bf = bf || {};
  const f = k => ({ correct:(bf[k]&&bf[k].correct)|0, wrong:(bf[k]&&bf[k].wrong)|0 });
  return { A:f("A"), B:f("B") };
}

let DB = migrate(safeParse(lsGet(APP)));
function safeParse(s){ try{ return JSON.parse(s); }catch(e){ return null; } }

function saveDB(opts){

  if(!opts.keepUpdatedAt) DB.updatedAt = nowISO();

  lsSet(APP, JSON.stringify(DB));
}

/* =================== アカウント =================== */
function accounts(){ return DB.accounts; }
function activeAcc(){ return DB.accounts.find(a=>a.id===DB.activeAccountId) || null; }
function prog(){
  const a = activeAcc(); if(!a) return null;
  const p = DB.progress[a.id] = DB.progress[a.id] || {items:{}, sessions:[]};
  p.items = p.items || {}; p.sessions = p.sessions || [];
  return p;
}
function itemOf(kpId){
  const p = prog(); if(!p) return blankItem();
  return p.items[kpId] || blankItem();
}
function addAccount(name){

/* =================== 習得判定（§4） =================== */
function requiredStreak(item){
  const w = (item && item.totalWrong) || 0;
  if(w >= 6) return 4;
  if(w >= 3) return 3;
  return 2;
}
function stateOf(it){
  if(it.mastered) return (it.postMasterWrong>0) ? "要注意習得" : "習得済み";
  if(it.totalWrong>0 && it.totalCorrect===0) return "誤答";
  if(it.totalCorrect>0) return it.totalCorrect + "回正解";
  if(it.totalWrong>0) return "誤答";
  return "未出題";
}

/* =================== 出題範囲（§3-5） =================== */
function impOK(kp){
  if(UI.impFilter === "must") return kp.imp === 2;
  if(UI.impFilter === "imp")  return kp.imp >= 1;
  return true;
}
function inRange(kp){
  if(UI.category !== "__all__" && kp.cat !== UI.category) return false;
  return impOK(kp);
}
function rangeKPs(){ return DATA.filter(inRange); }
function catCount(cat){
  return DATA.filter(k => (cat==="__all__" || k.cat===cat) && impOK(k)).length;
}

/* =================== 選択肢生成 =================== */
function siblings(kp){ return BY_GRP[kp.cat + "/" + kp.grp] || [kp]; }
function makeChoices(kp, seedIdx){
  const sib = siblings(kp).filter(x => x.id !== kp.id);
  const picked = shuffle(sib.slice()).slice(0, 3);
  return shuffle(picked.concat([kp])).map(x => x.w);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

/* =================== セッション（§5,§6,§11） =================== */
let S = null;   // 進行中のセッション（結果画面到達までは永続化しない §6-2）

function tmpItem(kpId){
  if(!S.tmp[kpId]) S.tmp[kpId] = JSON.parse(JSON.stringify(itemOf(kpId)));
  return S.tmp[kpId];
}
function otherFmt(f){ return f === "A" ? "B" : "A"; }

function pickTargets(mode){
  let pool;
  if(mode === "再確認"){
    pool = rangeKPs().filter(k => itemOf(k.id).postMasterWrong >= 1);
  } else if(mode === "全問"){
    pool = rangeKPs().slice();
  } else {
    pool = rangeKPs().filter(k => !itemOf(k.id).mastered);
  }
  if(mode === "全問" || mode === "再確認") return shuffle(pool);
  // §3-1 優先順位：totalWrong 多い → 未出題 → lastSeenAt 古い
  const scored = pool.map(k=>{
    const it = itemOf(k.id);
    const seen = it.totalCorrect + it.totalWrong;
    return { k, w: it.totalWrong, unseen: seen===0 ? 1 : 0, last: it.lastSeenAt || "" };
  });
  shuffle(scored);
  scored.sort((x,y)=>{
    if(y.w !== x.w) return y.w - x.w;
    if(y.unseen !== x.unseen) return y.unseen - x.unseen;
    return String(x.last).localeCompare(String(y.last));
  });
  const n = mode === "20問" ? 20 : 10;
  return scored.slice(0, n).map(s=>s.k);
}

function startSession(mode){
  const targets = pickTargets(mode);
  if(!targets.length){
    modal("出題できる問題がありません",
      mode==="再確認" ? "<p>要注意習得のことばはまだありません。</p>"
                      : "<p>選んだ出題範囲に、出題できることばがありません。範囲を広げてください。</p>", [{t:"閉じる"}]);
    return;
  }
  const requested = (mode==="10問") ? 10 : (mode==="20問" ? 20 : targets.length);
  const shrunk = (mode==="10問"||mode==="20問") && targets.length < requested;

  const queue = [];
  if(mode === "全問"){
    targets.forEach(k=>{
      const lf = itemOf(k.id).lastFormat;
      const f = lf ? otherFmt(lf) : (Math.random()<0.5 ? "A" : "B");
      queue.push({kp:k.id, fmt:f, src:null});
    });
  } else {
    const first = targets.map(k=>{
      const lf = itemOf(k.id).lastFormat;
      return {kp:k.id, fmt: lf ? otherFmt(lf) : (Math.random()<0.5?"A":"B"), src:null};
    });
    shuffle(first);
    const second = first.map(q=>({kp:q.kp, fmt:otherFmt(q.fmt), src:null}));
    shuffle(second);
    queue.push(...first, ...second);
  }

  const startedMastered = {};
  targets.forEach(k=>{ if(itemOf(k.id).mastered) startedMastered[k.id] = true; });

  S = { mode, queue, idx:0, answers:[], tmp:{}, startedAt:nowISO(),
        startedMastered, askCount:{}, viewIdx:null, kpCount:targets.length, shrunk, skipped:[] };
  screen = "quiz"; render();
}

function curQ(){ return S.queue[S.idx] || null; }

function answer(choice){
  const q = curQ(); if(!q) return;
  const kp = BY_ID[q.kp];
  const correct = (choice === kp.w);
  const ansIdx = S.answers.length;
  const before = JSON.parse(JSON.stringify(tmpItem(q.kp)));
  applyAnswer(q, correct, choice);
  S.answers.push({ qi:S.idx, kp:q.kp, fmt:q.fmt, choice, correct, before });
  S.askCount[q.kp] = (S.askCount[q.kp]||0) + 1;
  scheduleRequeue(q, correct, ansIdx);
  q.answered = ansIdx;
  render();
}

function applyAnswer(q, correct, choice){
  const it = tmpItem(q.kp);
  it.lastSeenAt = nowISO();
  it.lastFormat = q.fmt;
  if(correct){
    it.totalCorrect++; it.byFormat[q.fmt].correct++;
    // §4-1 連続正解は必ず異なる出題形式であること
    if(it.streak > 0 && it._streakFmt === q.fmt){ /* 同形式の連続正解では進めない */ }
    else { it.streak++; it._streakFmt = q.fmt; }
    if(!it.mastered && it.streak >= requiredStreak(it)){
      it.mastered = true; it.masteredAt = nowISO();
    }
  } else {
    it.totalWrong++; it.byFormat[q.fmt].wrong++;
    it.streak = 0; it._streakFmt = null;
    if(it.mastered) it.postMasterWrong++;
    it.wrongLog.unshift({ at:nowISO(), format:q.fmt, answered:choice });
    it.wrongLog = it.wrongLog.slice(0,5);
  }
}

/* §5 復習キュー（10問/20問/再確認のみ） */
function scheduleRequeue(q, correct, ansIdx){
  if(S.mode === "全問") return;
  const it = tmpItem(q.kp);
  if(correct && it.mastered) return;                     // 習得達成 → 再投入しない
  if((S.askCount[q.kp]||0) >= 4){ if(!S.skipped.includes(q.kp)) S.skipped.push(q.kp); return; }
  const gap = correct ? 6 : 3;
  let pos = Math.min(S.idx + gap, S.queue.length);
  while(pos < S.queue.length && S.queue[pos].locked) pos++;   // 空きスロットへずらす
  S.queue.splice(pos, 0, {kp:q.kp, fmt:otherFmt(q.fmt), src:ansIdx, locked:true});
}

/* §6-1 直前の1問のみ再解答 */
function reAnswer(choice){
  const ai = S.answers.length - 1; if(ai < 0) return;
  const a = S.answers[ai];
  const q = S.queue[a.qi];
  S.tmp[a.kp] = JSON.parse(JSON.stringify(a.before));     // 効果を取り消す
  S.queue = S.queue.filter((x,i)=> !(x.src === ai && i > a.qi));  // 予約した再投入を取り消す
  const correct = (choice === BY_ID[a.kp].w);
  applyAnswer(q, correct, choice);
  S.answers[ai] = { qi:a.qi, kp:a.kp, fmt:a.fmt, choice, correct, before:a.before };
  scheduleRequeue(q, correct, ai);
  render();
}

function nextQ(){
  if(S.idx < S.queue.length - 1){ S.idx++; S.viewIdx = null; render(); }
  else { finishSession(); }
}

/* §6-2 / §11 結果画面到達時にのみ確定 */
function finishSession(){
  const p = prog(); if(!p) return;
  const newlyMastered = [], wrongKpIds = [];
  Object.keys(S.tmp).forEach(kid=>{
    const t = S.tmp[kid];
    if(!S.answers.some(a=>a.kp===kid)) return;
    delete t._streakFmt;
    p.items[kid] = t;
    if(t.mastered && !S.startedMastered[kid]) newlyMastered.push(kid);
  });
  S.answers.forEach(a=>{ if(!a.correct && !wrongKpIds.includes(a.kp)) wrongKpIds.push(a.kp); });
  const totalMastered = DATA.filter(k => (p.items[k.id]||{}).mastered).length;
  const correct = S.answers.filter(a=>a.correct).length;
  const rec = { startedAt:S.startedAt, finishedAt:nowISO(), mode:S.mode,
                correct, wrong:S.answers.length - correct,
                newlyMastered, wrongKpIds, totalMastered };
  p.sessions.push(rec);
  if(p.sessions.length > 100) p.sessions = p.sessions.slice(-100);
  saveDB();
  S.result = rec;
  screen = "result"; render();
  pushCloud("記録をクラウドに保存しました");
}

/* =================== 同期（§12・§13） =================== */
let syncState = { cls:"", msg:"" };
function syncConfigured(){ return !!(SYNC.url && SYNC.key); }
function setSync(cls, msg){ syncState = {cls, msg}; render(); }

function dbHasRecords(d){
  if(!d || !d.progress) return false;
  return Object.keys(d.progress).some(aid=>{
    const p = d.progress[aid] || {};
    if(Array.isArray(p.sessions) && p.sessions.length) return true;
    const items = p.items || {};
    return Object.keys(items).some(k=>{
      const it = items[k] || {};
      return ((it.totalCorrect|0) + (it.totalWrong|0)) > 0;
    });
  });
}

async function pullCloud(silent){
  if(!syncConfigured()) return;
  setSync("", "☁… 同期中");
  let res;
  try{
    const r = await fetch(SYNC.url + "?key=" + encodeURIComponent(SYNC.key) + "&app=" + encodeURIComponent(APP));
    const t = await r.text();
    try{ res = JSON.parse(t); }
    catch(e){ return setSync("err","☁⚠ GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください"); }
  }catch(e){ return setSync("", "☁ オフライン（ローカルには保存済み）"); }
  if(!res.ok){
    const err = String(res.error||"");
    return setSync("err", /key|合言葉|unauthor/i.test(err) ? "☁⚠ 合言葉が違います" : "☁⚠ " + err);
  }
  const cloud = res.data ? migrate(res.data) : null;
  const localHas = dbHasRecords(DB), cloudHas = dbHasRecords(cloud);

  if(!cloud || !cloudHas){                       // §13-2-1,2
    if(localHas){ await doPush(); return setSync("ok","☁ クラウドに進捗が無かったので送りました"); }
    if(cloud) { DB = cloud; saveDB({keepUpdatedAt:true}); }
    return setSync("ok","☁✓ クラウドと同期しました（記録はまだありません）");
  }
  if(!localHas){                                  // 無条件でクラウド採用
    DB = cloud; saveDB({keepUpdatedAt:true});
    return setSync("ok","☁✓ クラウドの記録を取り込みました" + summaryOf(DB));
  }
  const changed = mergeDB(DB, cloud);             // §13-3 合流
  if(changed){ saveDB(); await doPush(); setSync("ok","☁✓ クラウドと合流しました" + summaryOf(DB)); }
  else { DB.updatedAt = cloud.updatedAt || DB.updatedAt; saveDB({keepUpdatedAt:true});
         setSync("ok","☁✓ クラウドと同じ内容です" + summaryOf(DB)); }
}

function summaryOf(d){
  let asked = 0, mast = 0;
  Object.keys(d.progress||{}).forEach(aid=>{
    const items = (d.progress[aid]||{}).items || {};
    Object.keys(items).forEach(k=>{
      const it = items[k]; if(((it.totalCorrect|0)+(it.totalWrong|0))>0) asked++;
      if(it.mastered) mast++;
    });
  });
  return "（" + (d.accounts||[]).length + "人・出題済み" + asked + "・習得" + mast + "）";
}

/* §13-3 合流 */
function mergeDB(local, cloud){
  let changed = false;
  const byName = {};
  local.accounts.forEach(a=>{ byName[a.name] = a; });
  const activeName = (local.accounts.find(a=>a.id===local.activeAccountId)||{}).name;

  (cloud.accounts||[]).forEach(ca=>{
    let la = byName[ca.name];
    if(!la){
      la = { id:newAccId(), name:ca.name, createdAt: ca.createdAt || nowISO() };
      local.accounts.push(la); byName[ca.name] = la; local.progress[la.id] = {items:{}, sessions:[]};
      changed = true;
    }
    const lp = local.progress[la.id] = local.progress[la.id] || {items:{}, sessions:[]};
    const cp = cloud.progress[ca.id] || {items:{}, sessions:[]};
    Object.keys(cp.items||{}).forEach(kid=>{
      const c = cp.items[kid]; const l = lp.items[kid];
      if(!l){ lp.items[kid] = c; changed = true; return; }
      const merged = mergeItem(l, c);
      if(JSON.stringify(merged) !== JSON.stringify(l)){ lp.items[kid] = merged; changed = true; }
    });
    const seen = {}; const all = [];
    lp.sessions.concat(cp.sessions||[]).forEach(s=>{
      const key = s.finishedAt || JSON.stringify(s);
      if(seen[key]) return; seen[key] = 1; all.push(s);
    });
    all.sort((a,b)=> String(a.finishedAt).localeCompare(String(b.finishedAt)));
    const cut = all.slice(-100);
    if(JSON.stringify(cut) !== JSON.stringify(lp.sessions)){ lp.sessions = cut; changed = true; }
  });
  if(activeName){
    const a = local.accounts.find(x=>x.name===activeName);
    if(a) local.activeAccountId = a.id;
  } else if(!local.activeAccountId && local.accounts.length){
    local.activeAccountId = local.accounts[0].id;
  }
  return changed;
}
function mergeItem(l, c){
  l = Object.assign(blankItem(), l); c = Object.assign(blankItem(), c);
  l.byFormat = normByFormat(l.byFormat); c.byFormat = normByFormat(c.byFormat);
  const newer = String(c.lastSeenAt||"") > String(l.lastSeenAt||"") ? c : l;   // §13-3
  const m = {
    totalCorrect: Math.max(l.totalCorrect|0, c.totalCorrect|0),
    totalWrong:   Math.max(l.totalWrong|0,   c.totalWrong|0),
    postMasterWrong: Math.max(l.postMasterWrong|0, c.postMasterWrong|0),
    byFormat: { A:{ correct:Math.max(l.byFormat.A.correct,c.byFormat.A.correct),
                    wrong:  Math.max(l.byFormat.A.wrong,  c.byFormat.A.wrong) },
                B:{ correct:Math.max(l.byFormat.B.correct,c.byFormat.B.correct),
                    wrong:  Math.max(l.byFormat.B.wrong,  c.byFormat.B.wrong) } },
    mastered: !!(l.mastered || c.mastered),
    masteredAt: pickEarlier(l.masteredAt, c.masteredAt),
    wrongLog: mergeLogs(l.wrongLog, c.wrongLog),
    lastSeenAt: String(c.lastSeenAt||"") > String(l.lastSeenAt||"") ? c.lastSeenAt : l.lastSeenAt,
    streak: newer.streak|0,                    // lastSeenAt が新しい側（大きい方ではない）
    lastFormat: newer.lastFormat || null
  };
  return m;
}
function pickEarlier(a, b){
  if(!a) return b || null; if(!b) return a;
  return String(a) <= String(b) ? a : b;
}
function mergeLogs(a, b){
  const seen = {}; const all = [];
  (a||[]).concat(b||[]).forEach(w=>{ const k = w.at + "|" + w.format + "|" + w.answered;
    if(seen[k]) return; seen[k]=1; all.push(w); });
  all.sort((x,y)=> String(y.at).localeCompare(String(x.at)));
  return all.slice(0,5);
}

async function doPush(){
  if(!syncConfigured()) return false;
  DB.app = APP;
  const r = await fetch(SYNC.url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ key:SYNC.key, data:DB }) });
  const t = await r.text();
  let res; try{ res = JSON.parse(t); }catch(e){ throw new Error("PARSE"); }
  if(!res.ok) throw new Error(res.error || "ERR");
  SYNC.lastSync = nowISO(); saveSync();
  return true;
}
async function pushCloud(okMsg){
  if(!syncConfigured()) return;
  setSync("", "☁… 送信中");
  try{ await doPush(); setSync("ok", "☁✓ " + (okMsg||"クラウドに保存しました")); }
  catch(e){
    if(e.message === "PARSE") setSync("err","☁⚠ GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください");
    else if(/key|合言葉|unauthor/i.test(e.message)) setSync("err","☁⚠ 合言葉が違います");
    else setSync("", "☁ オフライン（ローカルには保存済み）");
  }
}
async function pushList(){
  if(!syncConfigured()) return;
  setSync("", "☁… 一覧を書き出し中");
  await pullCloud(true);                                  // §15 空上書き防止：先にpull
  if(!dbHasRecords(DB)){
    setSync("err", "☁⚠ 記録が空のため中止しました");
    return modal("書き出しを中止しました",
      "<p>記録がまだ1件もないため、スプレッドシートを空で上書きしてしまう恐れがあります。<br>学習を1回終えてからもう一度お試しください。</p>", [{t:"閉じる"}]);
  }
  try{
    const r = await fetch(SYNC.url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ key:SYNC.key, app:APP, list:{ header:LIST_HEADER, rows:listRows(false) } }) });
    const t = await r.text(); let res;
    try{ res = JSON.parse(t); }catch(e){ return setSync("err","☁⚠ GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください"); }
    if(!res.ok) return setSync("err", /key|合言葉/i.test(String(res.error)) ? "☁⚠ 合言葉が違います" : "☁⚠ " + res.error);
    setSync("ok", "☁✓ 全問一覧をスプレッドシートに書き出しました");
  }catch(e){ setSync("", "☁ オフライン（ローカルには保存済み）"); }
}

let resultFilter = { cat:"__all__", state:"all", sort:"wrong" };

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function h(strings, ...v){ return strings.reduce((a,s,i)=> a + s + (v[i]==null?"":v[i]), ""); }

function render(){
  const app = $("app");
  if(!activeAcc() && screen !== "accounts"){ app.innerHTML = viewAccountPicker(); return bind(); }
  let body = "";
  if(screen === "home")   body = viewHome();
  else if(screen === "quiz")   body = viewQuiz();
  else if(screen === "result") body = viewResult();
  else if(screen === "learn")  body = viewLearn();
  else if(screen === "accounts") body = viewAccountPicker();
  app.innerHTML = body;
  bind();
}

function bind(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick = ev => { ev.stopPropagation(); ACT[el.dataset.act](el.dataset, el); };
  });
  document.querySelectorAll("[data-chg]").forEach(el=>{
    el.onchange = ev => ACT[el.dataset.chg](el.dataset, el);
  });
}

/* ---------- モーダル ---------- */
function modal(title, html, buttons){
  const root = $("modalRoot");
  root.innerHTML = h`<div class="mask"><div class="modal">
    <h2>${esc(title)}</h2><div id="mbody">${html}</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">${
      buttons.map((b,i)=>`<button class="${b.cls||"btn-s"}" data-mb="${i}">${esc(b.t)}</button>`).join("")
    }</div></div></div>`;
  root.querySelectorAll("[data-mb]").forEach(el=>{
    el.onclick = () => { const b = buttons[+el.dataset.mb]; closeModal(); if(b.fn) b.fn(); };
  });
}
function closeModal(){ $("modalRoot").innerHTML = ""; }

function masteredCountOf(aid){
  const items = (DB.progress[aid]||{}).items || {};
  return DATA.filter(k => (items[k.id]||{}).mastered).length;
}

      <button class="mode-btn btn-p" data-act="start" data-m="10問"><b>10問モード</b><span>10語 × 2形式＝20問</span></button>
      <button class="mode-btn btn-p" data-act="start" data-m="20問"><b>20問モード</b><span>20語 × 2形式＝40問</span></button>
      <button class="mode-btn" data-act="start" data-m="全問"><b>全問モード</b><span>範囲の${kps.length}語を1周（実力確認）</span></button>

    ${ kiken.length ? h`<div class="sp"></div>
      <button class="btn-s" style="width:100%" data-act="start" data-m="再確認">⚠ 要注意 ${kiken.length}語 — 再確認する</button>` : "" }

function viewMasteryBars(){
  const p = prog();
  const rowOf = (label, arr) => {
    const tot = arr.length;
    const m = arr.filter(k=>itemOf(k.id).mastered).length;
    const h1 = arr.filter(k=>{ const it = itemOf(k.id); return !it.mastered && it.totalCorrect>0; }).length;
    const kk = arr.filter(k=>itemOf(k.id).postMasterWrong>=1).length;
    return h`<div style="margin-bottom:10px">
      <div class="top" style="display:flex;align-items:center;gap:6px;font-size:.88rem">
        <span>${esc(label)}</span>${ kk?`<span class="badge w">要注意 ${kk}</span>`:"" }
        <span class="right muted">習得済み ${m} / 全 ${tot}（${tot?Math.round(m/tot*100):0}%）</span></div>
      <div class="bar"><i class="m" style="width:${tot?m/tot*100:0}%"></i><i class="h" style="width:${tot?h1/tot*100:0}%"></i></div>
    </div>`;
  };
  return h`<div class="card"><h2>習得のようす<span class="tiny" style="font-weight:400">（範囲にかかわらず全${DATA.length}語で集計）</span></h2>
    ${ rowOf("総合", DATA) }
    ${ CATS.map(c=> rowOf(c, DATA.filter(k=>k.cat===c))).join("") }
    <div class="tiny">■濃い＝習得済み　■うすい＝1回以上正解</div></div>`;
}

function viewWrongRanking(){
  const rank = DATA.map(k=>({k, it:itemOf(k.id)})).filter(x=>x.it.totalWrong>0)
    .sort((a,b)=> b.it.totalWrong - a.it.totalWrong).slice(0,10);
  if(!rank.length) return "";
  return h`<div class="card"><h2>間違いランキング</h2><div class="list">
    ${ rank.map(({k,it})=>h`<div class="li click" data-act="learnOne" data-id="${esc(k.id)}">
      <div class="top"><span class="kp">${esc(k.w)}</span>
        <span class="tiny">${esc(k.kana)}・${esc(k.cat)}</span>
        <span class="right badge ng">誤答${it.totalWrong}回</span>
        <span class="badge ${it.mastered?(it.postMasterWrong?"w":"m"):""}">${stateOf(it)}</span></div>
      <div class="tiny">${esc(k.m)}</div></div>`).join("") }
  </div><div class="tiny" style="margin-top:6px">タップすると意味と例文を確認できます</div></div>`;
}

/* ---------- 出題画面 ---------- */
function viewQuiz(){
  const viewing = S.viewIdx != null;
  const qi = viewing ? S.viewIdx : S.idx;
  const q = S.queue[qi];
  const kp = BY_ID[q.kp];
  const ansIdx = S.answers.findIndex(a=>a.qi===qi);
  const a = ansIdx>=0 ? S.answers[ansIdx] : null;
  const it = tmpItem(q.kp);
  const need = requiredStreak(it);
  const total = S.queue.length;
  const remainKP = new Set(S.queue.slice(S.idx).map(x=>x.kp)).size;
  const nCor = S.answers.filter(x=>x.correct).length;
  const choices = q.choices || (q.choices = makeChoices(kp));
  const canReAnswer = viewing && qi === S.idx - 1 && !!a;
  const isLast = S.idx >= S.queue.length - 1;

  const qtext = q.fmt === "A"
    ? h`${esc(kp.a)}<span class="blank">${esc(kp.kana)}</span>${esc(kp.b)}`
    : h`「${esc(kp.m)}」<br><span class="muted" style="font-size:.9rem">という意味の
        ${ kp.cat==="同音異字" ? "漢字" : "ことば" }（よみ：${esc(kp.kana)}）は？</span>`;

  return h`
  <div class="hdr"><button class="btn-sm" data-act="quitQuiz">← やめる</button>
    <span class="tiny">${esc(S.mode)}モード ${ viewing?"（見直し中）":"" }</span>
    <span class="tiny">正解 ${nCor}／誤答 ${S.answers.length-nCor}</span></div>
  <div class="card">
    <div class="tiny">${qi+1}問目 / 全${total}問　｜　あと${remainKP}語</div>
    <div class="qbar"><i style="width:${(qi)/total*100}%"></i></div>
    <div class="top" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="badge">${esc(kp.cat)}</span>
      <span class="badge">形式${q.fmt}：${FMT_LABEL[q.fmt]}</span>
      ${ kp.imp>0?`<span class="badge imp${kp.imp}">${IMP_MARK[kp.imp]}</span>`:"" }
      <span class="right gauge">${ Array.from({length:need},(_,i)=>
        `<b class="${i < Math.min(it.streak,need) ? "on":""}"></b>`).join("") }</span>
    </div>
    ${ need>2 ? `<div class="tiny" style="color:var(--warn)">このことばは苦手なので${need}回連続の正解が必要です</div>` : "" }
    <div class="qtext">${qtext}</div>
    <div class="choices">
      ${ choices.map(c=>{
        let cls = "choice";
        if(a){
          if(c === kp.w) cls += " ok";
          else if(c === a.choice) cls += " ng";
          else cls += " dim";
        }
        return h`<button class="${cls}" data-act="${a?(canReAnswer?"reans":"noop"):"ans"}" data-c="${esc(c)}">${esc(c)}${
          kp.cat!=="同音異字" ? "" : "" }</button>`;
      }).join("") }
    </div>
    ${ a ? h`<div class="fb ${a.correct?"ok":"ng"}">
      <div class="ttl">${ a.correct?"○ 正解":"× 不正解　正しくは「"+esc(kp.w)+"」" }</div>
      <div><b>${esc(kp.w)}</b>（${esc(kp.kana)}）＝${esc(kp.m)}</div>
      <div class="tiny" style="margin-top:4px">例文：${esc(kp.a + kp.w + kp.b)}${ kp.n?"　／　"+esc(kp.n):"" }</div>
      ${ !a.correct && a.choice ? h`<div class="tiny" style="margin-top:4px">「${esc(a.choice)}」＝${
        esc((siblings(kp).find(x=>x.w===a.choice)||{}).m || "")}</div>` : "" }
      ${ canReAnswer ? '<div class="tiny" style="margin-top:6px">この問題は選び直せます</div>' : "" }
      </div>` : "" }
    <div class="sp"></div>
    <div class="row">
      ${ qi>0 ? `<button class="btn-sm" data-act="prevQ">← 前の問題へ</button>` : "" }
      ${ viewing ? `<button class="btn-sm right btn-s" data-act="forwardQ">進む →</button>`
        : (a ? `<button class="btn-p right" data-act="nextQ">${ isLast ? "結果を見る →" : "次の問題へ →" }</button>` : "") }
    </div>
  </div>`;
}

/* ---------- 結果画面 ---------- */
function viewResult(){
  const r = S.result;
  const rate = S.answers.length ? Math.round(r.correct / S.answers.length * 100) : 0;
  const wrongs = S.answers.filter(a=>!a.correct);
  return h`
  <div class="hdr"><h1>結果</h1><button class="btn-sm" data-act="goHome">ホームへ</button></div>
  <div class="card"><h2>${esc(r.mode)}モードの成績</h2>
    <table class="mini">
      <tr><td>正解</td><td><b>${r.correct}問</b></td></tr>
      <tr><td>誤答</td><td><b>${r.wrong}問</b></td></tr>
      <tr><td>正答率</td><td><b>${rate}%</b></td></tr>
      <tr><td>今回新たに習得</td><td><b>${r.newlyMastered.length}語</b>${
        r.newlyMastered.length? "（"+r.newlyMastered.map(id=>esc(BY_ID[id].w)).join("・")+"）":"" }</td></tr>
      <tr><td>総習得数</td><td>${r.totalMastered} / ${DATA.length}</td></tr>
    </table>
    ${ S.skipped.length ? h`<div class="warnbar" style="margin-top:10px">同じことばを4回出題しても正解できませんでした：
      ${ S.skipped.map(id=>esc(BY_ID[id].w)).join("・") }　→ <b>要復習</b></div>` : "" }
  </div>

  <div class="card"><h2>今回間違えた問題（${wrongs.length}）</h2>
    ${ wrongs.length ? h`<div class="list">${ wrongs.map(a=>{ const k = BY_ID[a.kp]; return h`
      <div class="li"><div class="top"><span class="kp">${esc(k.w)}</span>
        <span class="badge">形式${a.fmt}</span><span class="tiny">${esc(k.cat)}</span></div>
      <div class="tiny">あなたの答え：<b style="color:var(--ng)">${esc(a.choice)}</b>　／　正解：<b style="color:var(--ok)">${esc(k.w)}</b></div>
      <div class="tiny">${esc(k.m)}　例文：${esc(k.a + k.w + k.b)}</div></div>`; }).join("") }</div>`
      : '<div class="muted">全問正解です！</div>' }
  </div>

  ${ viewFullList() }
  <div class="card"><button class="btn-s" style="width:100%" data-act="csv">📊 CSVをダウンロード</button></div>`;
}

function viewFullList(){
  const F = resultFilter;
  let arr = DATA.filter(k=> F.cat==="__all__" || k.cat===F.cat);   // §3-5③ 範囲選択の影響を受けない
  arr = arr.filter(k=>{
    const it = itemOf(k.id); const st = stateOf(it);
    if(F.state==="all") return true;
    if(F.state==="mastered") return it.mastered && !it.postMasterWrong;
    if(F.state==="kiken") return it.mastered && it.postMasterWrong>0;
    if(F.state==="wrong") return it.totalWrong>0;
    if(F.state==="none") return st==="未出題";
    return true;
  });
  arr.sort((a,b)=>{
    const ia = itemOf(a.id), ib = itemOf(b.id);
    if(F.sort==="wrong") return ib.totalWrong - ia.totalWrong;
    if(F.sort==="correct") return ib.totalCorrect - ia.totalCorrect;
    return 0;
  });
  return h`<div class="card"><h2>カテゴリー別 全問一覧<span class="tiny" style="font-weight:400">（累計・全${DATA.length}語）</span></h2>
    <div class="row" style="margin-bottom:6px">
      ${ ["__all__"].concat(CATS).map(c=>h`<button class="chip ${F.cat===c?"on":""}" data-act="rfCat" data-c="${c}">${c==="__all__"?"すべて":esc(c)}</button>`).join("") }
    </div>
    <div class="row" style="margin-bottom:8px">
      ${ [["all","状態すべて"],["mastered","習得済み"],["kiken","要注意習得"],["wrong","誤答あり"],["none","未出題"]]
        .map(([v,l])=>h`<button class="chip ${F.state===v?"on":""}" data-act="rfState" data-v="${v}">${l}</button>`).join("") }
      <span class="right"></span>
      <select data-chg="rfSort" style="width:auto">
        <option value="wrong" ${F.sort==="wrong"?"selected":""}>誤答が多い順</option>
        <option value="correct" ${F.sort==="correct"?"selected":""}>正解が多い順</option>
        <option value="none" ${F.sort==="none"?"selected":""}>収録順</option>
      </select>
    </div>
    <div class="list">${ arr.slice(0,400).map(k=>{
      const it = itemOf(k.id); const st = stateOf(it);
      const open = resultOpen === k.id;
      return h`<div class="li click" data-act="toggleOpen" data-id="${esc(k.id)}">
        <div class="top"><span class="kp">${esc(k.w)}</span><span class="tiny">${esc(k.kana)}</span>
          ${ k.imp>0?`<span class="badge imp${k.imp}">${IMP_MARK[k.imp]}</span>`:"" }
          <span class="right badge ${it.mastered?(it.postMasterWrong?"w":"m"):""}">${st}</span>
          ${ it.totalWrong>0 ? `<span class="badge ng" style="${it.totalWrong>=2?"font-weight:800":""}">誤答${it.totalWrong}回</span>`:"" }
        </div>
        ${ open ? h`<div class="tiny" style="margin-top:6px">
          ${esc(k.m)}<br>例文：${esc(k.a + k.w + k.b)}<br>
          形式A（例文→漢字）：正解${it.byFormat.A.correct}・誤答${it.byFormat.A.wrong}／
          形式B（意味→漢字）：正解${it.byFormat.B.correct}・誤答${it.byFormat.B.wrong}
          ${ it.wrongLog.length ? "<br>過去の誤答：" + it.wrongLog.map(w=>esc(w.answered)+"（"+fmtDate(w.at)+"）").join("、") : "" }
          ${ it.masteredAt ? "<br>習得日："+fmtDate(it.masteredAt) : "" }
        </div>` : "" }
      </div>`;
    }).join("") }</div>
    ${ arr.length>400 ? '<div class="tiny">（先頭400件を表示）</div>' : "" }
  </div>`;
}
let resultOpen = null;

/* ---------- 覚えるモード（§3-4）記録・同期に一切影響しない ---------- */
function viewLearn(){
  const pool = rangeKPs();
  const hdr = h`<div class="hdr"><button class="btn-sm" data-act="goHome">← ホーム</button>
    <span class="tiny">覚えるモード（記録はつきません）</span>
    <div class="seg" style="width:auto">
      <button class="${learn.mode==="list"?"on":""}" data-act="lmode" data-v="list">一覧</button>
      <button class="${learn.mode==="card"?"on":""}" data-act="lmode" data-v="card">単語カード</button>
    </div></div>`;
  if(!pool.length) return hdr + '<div class="card muted">選んだ出題範囲にことばがありません。ホームで範囲を広げてください。</div>';

  if(learn.mode === "card") return hdr + viewCards(pool);

  if(learn.detail){
    const list = pool;
    const i = Math.max(0, list.findIndex(k=>k.id===learn.detail));
    const k = list[i]; const it = itemOf(k.id);
    return hdr + h`<div class="card">
      <div class="top" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="badge">${esc(k.cat)}</span>
        ${ k.imp>0?`<span class="badge imp${k.imp}">${IMP_MARK[k.imp]}</span>`:"" }
        <span class="right badge ${it.mastered?(it.postMasterWrong?"w":"m"):""}">${stateOf(it)}</span></div>
      <div style="text-align:center;margin:16px 0">
        <ruby style="font-size:2.4rem;font-weight:800">${esc(k.w)}<rt style="font-size:.9rem">${esc(k.kana)}</rt></ruby>
      </div>
      <table class="mini">
        <tr><td>意味</td><td>${esc(k.m)}</td></tr>
        <tr><td>例文</td><td>${esc(k.a)}<b style="color:var(--accent-d)">${esc(k.w)}</b>${esc(k.b)}</td></tr>
        ${ k.n ? `<tr><td>熟語</td><td>${esc(k.n)}</td></tr>` : "" }
        <tr><td>仲間</td><td>${ siblings(k).map(s=> s.id===k.id ? "<b>"+esc(s.w)+"</b>" : esc(s.w)).join("・") }</td></tr>
      </table>
      <div class="sp"></div>
      <div class="row">
        <button data-act="ldet" data-id="${esc((list[i-1]||list[list.length-1]).id)}">← 前へ</button>
        <button class="right" data-act="ldet" data-id="${esc((list[i+1]||list[0]).id)}">次へ →</button>
      </div>
      <div class="sp"></div>
      <button class="btn-sm" style="width:100%" data-act="ldetClose">一覧にもどる</button>
      <div class="tiny" style="text-align:center;margin-top:8px">${i+1} / ${list.length}</div>
    </div>`;
  }

  const byCat = {};
  pool.forEach(k=>{ (byCat[k.cat] = byCat[k.cat]||[]).push(k); });
  const legend = '<div class="tiny" style="margin:-4px 0 10px">ことばをタップすると意味・例文・仲間のことばが見られます。'
    + '　<span class="chip on" style="padding:2px 8px;font-size:.7rem">青</span>＝習得済み　／　◎＝最重要　○＝重要</div>';
  return hdr + legend + Object.keys(byCat).map(c=>{
    const groups = {};
    byCat[c].forEach(k=>{ (groups[k.grp]=groups[k.grp]||[]).push(k); });
    return h`<div class="card"><h2>${esc(c)}<span class="tiny" style="font-weight:400">（${byCat[c].length}語）</span></h2>
      <div class="list">${ Object.keys(groups).map(g=>h`
        <div class="li"><div class="tiny" style="margin-bottom:4px">よみ：<b>${esc(g)}</b></div>
        <div class="row">${ groups[g].map(k=>{ const it = itemOf(k.id);
          return h`<button class="chip ${it.mastered?"on":""}" data-act="ldet" data-id="${esc(k.id)}">${esc(k.w)}${
            k.imp===2?"◎":(k.imp===1?"○":"") }</button>`; }).join("") }</div></div>`).join("") }
      </div></div>`;
  }).join("");
}

function viewCards(pool){
  if(!learn.deck.length || learn.deckKey !== deckKey(pool)){
    learn.deck = shuffle(pool.slice()).map(k=>k.id);
    learn.deckKey = deckKey(pool); learn.flipped = false; learn.done = 0;
  }
  if(!learn.deck.length){
    return h`<div class="card" style="text-align:center"><h2>おつかれさま！</h2>
      <p>このデッキのカードをすべて「覚えた」にしました。</p>
      <div class="tiny">「覚えた」は画面上の一時的な印です。習得の記録には影響しません。</div>
      <div class="sp"></div><button class="btn-p" data-act="deckReset">もう一度</button></div>`;
  }
  const k = BY_ID[learn.deck[0]];
  const front = learn.dir === "A"
      ? h`${esc(k.a)}<span class="blank">${esc(k.kana)}</span>${esc(k.b)}`
      : h`「${esc(k.m)}」`;
  return h`
  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <div class="seg" style="flex:1">
        <button class="${learn.dir==="A"?"on":""}" data-act="ldir" data-v="A">形式A：例文→漢字</button>
        <button class="${learn.dir==="B"?"on":""}" data-act="ldir" data-v="B">形式B：意味→漢字</button>
      </div>
    </div>
    <div class="tiny">残り ${learn.deck.length} 枚　／　覚えた ${learn.done} 枚</div>
    <div class="sp"></div>
    <div class="card-flip" data-act="flip">
      ${ learn.flipped ? h`
        <div class="big"><ruby>${esc(k.w)}<rt style="font-size:.42em">${esc(k.kana)}</rt></ruby></div>
        <div>${esc(k.m)}</div>
        <div class="tiny">例文：${esc(k.a + k.w + k.b)}${ k.n?"　／　"+esc(k.n):"" }</div>`
      : h`<div class="big">${front}</div><div class="tiny">タップしてめくる</div>` }
    </div>
    <div class="sp"></div>
    <div class="row">
      <button class="btn-s" style="flex:1" data-act="cardKnown">覚えた</button>
      <button style="flex:1" data-act="cardAgain">まだ</button>
    </div>
    <div class="tiny" style="margin-top:8px;text-align:center">このモードは記録・習得判定・同期に影響しません</div>
  </div>`;
}
function deckKey(pool){ return UI.category + "|" + UI.impFilter + "|" + pool.length; }

/* =================== アクション =================== */
const ACT = {
  noop(){},
  goHome(){ screen = "home"; learn.detail = null; render(); },
  goAcc(){ screen = "accounts"; render(); },
  pickAcc(d){ DB.activeAccountId = d.id; saveDB(); screen = "home"; render(); },
  addAcc(){
    modal("新しいアカウント", '<label>名前</label><input type="text" id="mName" placeholder="例：長男">',
      [{t:"キャンセル"},{t:"作る", cls:"btn-p", fn:()=>{}}]);
    setTimeout(()=>{
      const btns = document.querySelectorAll("#modalRoot [data-mb]");
      btns[1].onclick = () => { const v = ($("mName").value||"").trim();
        if(!v) return; closeModal(); addAccount(v); screen="home"; render(); };
      $("mName").focus();
    },0);
  },
  renameAcc(d){
    const a = DB.accounts.find(x=>x.id===d.id);
    modal("名前を変える", `<label>名前</label><input type="text" id="mName" value="${esc(a.name)}">`,
      [{t:"キャンセル"},{t:"変える", cls:"btn-p"}]);
    setTimeout(()=>{ document.querySelectorAll("#modalRoot [data-mb]")[1].onclick = ()=>{
      const v = ($("mName").value||"").trim(); if(!v) return; closeModal(); renameAccount(d.id, v); render(); }; },0);
  },
  delAcc(d){
    const a = DB.accounts.find(x=>x.id===d.id);
    modal("アカウントを削除しますか？",
      `<p><b>${esc(a.name)}</b> の学習記録がすべて消えます。もとにもどせません。</p>`,
      [{t:"キャンセル"},{t:"削除する", cls:"btn-danger", fn:()=>{ deleteAccount(d.id); render(); }}]);
  },
  setCat(d){ UI.category = d.c; saveUI(); learn.deck = []; render(); },
  setImp(d){ UI.impFilter = d.v; saveUI(); learn.deck = []; render(); },
  start(d){ startSession(d.m); },
  goLearn(){ screen = "learn"; learn.detail = null; render(); },
  lmode(d){ learn.mode = d.v; learn.detail = null; render(); },
  ldir(d){ learn.dir = d.v; learn.flipped = false; render(); },
  ldet(d){ learn.detail = d.id; learn.mode = "list"; render(); },
  ldetClose(){ learn.detail = null; render(); },
  learnOne(d){ screen = "learn"; learn.mode = "list"; learn.detail = d.id; render(); },
  flip(){ learn.flipped = !learn.flipped; render(); },
  cardKnown(){ learn.deck.shift(); learn.done++; learn.flipped = false; render(); },
  cardAgain(){ const x = learn.deck.shift(); learn.deck.push(x); learn.flipped = false; render(); },
  deckReset(){ learn.deck = []; learn.done = 0; render(); },

  ans(d){ answer(d.c); },
  reans(d){ reAnswer(d.c); },
  nextQ(){ nextQ(); },
  prevQ(){ const cur = S.viewIdx==null ? S.idx : S.viewIdx; if(cur>0){ S.viewIdx = cur-1; render(); } },
  forwardQ(){ const cur = S.viewIdx; if(cur==null) return;
    if(cur+1 >= S.idx){ S.viewIdx = null; } else { S.viewIdx = cur+1; } render(); },
  quitQuiz(){
    modal("学習をやめますか？",
      "<p>とちゅうでやめると、<b>今回の成績は記録されません</b>（習得のようすも変わりません）。</p>",
      [{t:"つづける"},{t:"やめる", cls:"btn-danger", fn:()=>{ S = null; screen="home"; render(); }}]);
  },
  toggleOpen(d){ resultOpen = (resultOpen === d.id) ? null : d.id; render(); },
  rfCat(d){ resultFilter.cat = d.c; render(); },
  rfState(d){ resultFilter.state = d.v; render(); },
  rfSort(d, el){ resultFilter.sort = el.value; render(); },
  csv(){ downloadCSV(); },

  exportJSON(){
    const d = new Date(); const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    dl(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}), TOOL_NAME+"記録_"+ymd+".json");
  },
  importJSON(){
    const inp = document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const raw = safeParse(rd.result);
        if(!raw) return modal("読み込めません","<p>JSONとして読めませんでした。</p>",[{t:"閉じる"}]);
        if(raw.app && raw.app !== APP)
          return modal("別のツールの記録です",`<p>このファイルは <b>${esc(raw.app)}</b> のものです。このツール（${APP}）には読み込めません。</p>`,[{t:"閉じる"}]);
        const nd = migrate(raw);
        modal("記録を置きかえますか？",
          `<p>ファイルの内容：</p><table class="mini">
           <tr><td>アカウント</td><td>${nd.accounts.map(a=>esc(a.name)).join("・")||"—"}</td></tr>
           <tr><td>保存日時</td><td>${esc(nd.updatedAt? new Date(nd.updatedAt).toLocaleString("ja-JP"):"—")}</td></tr></table>
           <p style="color:var(--ng)">いまのこの端末の記録は<b>すべて消えます</b>。</p>`,
          [{t:"キャンセル"},{t:"置きかえる", cls:"btn-danger", fn:()=>{
            DB = nd; saveDB(); pushCloud("読み込んだ記録をクラウドに送りました"); screen="home"; render(); }}]);
      };
      rd.readAsText(f);
    };
    inp.click();
  },
  syncCfg(){
    modal("クラウド同期設定",
      `<label>GASのURL（末尾が /exec）</label><input type="url" id="mUrl" value="${esc(SYNC.url)}" placeholder="https://script.google.com/macros/s/.../exec">
       <label>合言葉</label><input type="text" id="mKey" value="${esc(SYNC.key)}" placeholder="合言葉">
       <p class="tiny">この設定はこの端末にだけ保存されます（記録とは別に保存され、同期されません）。</p>`,
      [{t:"キャンセル"},
       {t:"同期を解除", cls:"btn-danger", fn:()=>{ SYNC={url:"",key:"",lastSync:null}; saveSync(); setSync("","クラウド同期を解除しました"); }},
       {t:"保存して同期", cls:"btn-p"}]);
    setTimeout(()=>{ const b = document.querySelectorAll("#modalRoot [data-mb]"); b[2].onclick = ()=>{
      SYNC.url = ($("mUrl").value||"").trim(); SYNC.key = ($("mKey").value||"").trim();
      saveSync(); closeModal(); render(); pullCloud(); }; },0);
  },
  syncNow(){ pullCloud(); },
  pushList(){ pushList(); },
  resetRec(){
    const a = activeAcc();
    modal("記録をリセットしますか？",
      `<p><b>${esc(a.name)}</b> の学習記録（習得・誤答・履歴）をすべて消します。もとにもどせません。</p>`,
      [{t:"キャンセル"},{t:"リセットする", cls:"btn-danger", fn:()=>{
        DB.progress[a.id] = {items:{}, sessions:[]}; saveDB(); pushCloud("記録をリセットしました"); render(); }}]);
  }
};

/* =================== 起動 =================== */
(function init(){
  if(!DB.accounts.length) screen = "accounts";
  render();
  if(syncConfigured()) pullCloud();          // §13-1 起動直後にpull
  window.addEventListener("beforeunload", e=>{
    if(screen === "quiz" && S && S.answers.length){ e.preventDefault(); e.returnValue = ""; }
  });
})();

</script>
</body>
</html>
