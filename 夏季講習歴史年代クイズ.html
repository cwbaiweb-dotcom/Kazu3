<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歴史年表 クイズ｜夏季講習</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#2b2723; --sub:#6b625a; --line:#e0dad0;
  --main:#8a5a2b; --main-d:#6d461f; --main-l:#f3e9dd;
  --ok:#1f7a4d; --ok-l:#e4f4ea; --ng:#c0392b; --ng-l:#fdeceb;
  --warn:#b8860b; --warn-l:#fdf3d8;
  --jp:#8a5a2b; --cu:#2f6f8f; --wo:#5b6b3a;
  --r:14px; --sh:0 2px 8px rgba(60,45,30,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.7; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:820px;margin:0 auto;padding:12px 12px 64px}
h1{font-size:19px;margin:0}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.muted{color:var(--sub);font-size:13px}
.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1}
button{font-family:inherit;font-size:16px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--main);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-weight:700;min-height:50px}
.btn:active{background:var(--main-d)}
.btn.sec{background:#fff;color:var(--main);border:2px solid var(--main)}
.btn.gray{background:#efeae3;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.mode{flex-direction:column;gap:2px;padding:12px 8px;text-align:center;line-height:1.35;min-height:64px;white-space:normal}
.btn.mode .sr{font-size:11px;font-weight:600;opacity:.9;color:inherit}
.btn:disabled{opacity:.45}
.btn.danger{background:var(--ng)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--main-l);color:var(--main-d)}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.ng{background:var(--ng-l);color:var(--ng)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.bar{height:12px;background:#eae4db;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#b98247,#8a5a2b)}
.pill{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 12px;font-size:14px;font-weight:600;color:var(--sub)}
.pill.on{background:var(--main);color:#fff;border-color:var(--main)}
.gauge span{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--main);margin-right:4px;vertical-align:-2px}
.gauge span.f{background:var(--main)}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:10px;font-size:16px;line-height:1.5;min-height:56px}
.choice:active{border-color:var(--main)}
.choice.correct{border-color:var(--ok);background:var(--ok-l)}
.choice.wrong{border-color:var(--ng);background:var(--ng-l)}
.choice.dim{opacity:.5}
.choice:disabled{color:var(--ink);opacity:1}
.choice.dim:disabled{opacity:.5}
.qbox{background:var(--main-l);border-radius:12px;padding:16px;margin-bottom:14px}
.qyear{font-size:34px;font-weight:800;letter-spacing:.02em;color:var(--main-d)}
.qtext{font-size:19px;font-weight:700}
.fb{border-radius:12px;padding:12px;margin:12px 0;font-weight:600}
.fb.ok{background:var(--ok-l);color:var(--ok)}
.fb.ng{background:var(--ng-l);color:var(--ng)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f0ebe3;font-weight:700;white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hide{display:none!important}
.status{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;background:#eef3ee;color:#2c5c3f}
.status.err{background:var(--ng-l);color:var(--ng)}
.status.busy{background:#eef0f4;color:#41506b}
input[type=text],input[type=url],input[type=password],select{
  font-family:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
label{font-size:13px;color:var(--sub);font-weight:700;display:block;margin:8px 0 3px}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal .card{max-width:520px;width:100%;max-height:86vh;overflow:auto;margin:0}
.acc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:8px}
.acc.on{border-color:var(--main);background:var(--main-l)}
.list-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.tl{border-left:3px solid var(--line);padding-left:10px;margin-left:4px}
.tl .yr{font-weight:800;color:var(--main-d);min-width:64px;display:inline-block}
.tl .ev{display:inline}
.tl-row{padding:5px 0;border-bottom:1px dotted #e6e0d6}
.tl-row.J .yr{color:var(--jp)} .tl-row.C .yr{color:var(--cu)} .tl-row.W .yr{color:var(--wo)}
.tl-h{background:#4a4038;color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:3px 10px;margin:10px 0 4px;display:inline-block}
.tl-n{color:var(--sub);font-size:14px;padding:3px 0 3px 8px;border-left:2px solid #eee}
.masked{background:#ded7cc;color:transparent;border-radius:5px;user-select:none}
.masked.open{background:transparent;color:inherit}
.card-face{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px;gap:10px}
.goro{background:var(--warn-l);border-radius:10px;padding:10px;font-weight:700;color:#7a5c0a}
.tag{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;border:1px solid currentColor}
.tag.J{color:var(--jp)} .tag.C{color:var(--cu)} .tag.W{color:var(--wo)}
.fixed-bottom{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,244,239,0),var(--bg) 30%);padding:10px 0 6px}
.sr{font-size:12px;color:var(--sub)}
.warnbar{background:var(--warn-l);color:#7a5c0a;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:10px;font-weight:600}
</style>
</head>

function hashId(s){
  let h = 5381;
  for (let i=0;i<s.length;i++) h = (((h*33) ^ s.charCodeAt(i)) >>> 0);
  return 'n' + h.toString(36);
}
function yearLabel(y){ return y < 0 ? ('前' + Math.abs(y) + '年') : (y + '年'); }

/* ROWS = 年表の全行（見出し・メモ含む） / ITEMS = KPになる行のみ */
const ROWS = [], ITEMS = [], BYID = {};
(function build(){
  const used = {};
  RAW.forEach(function(r, i){
    const row = { kai:r[0], era:r[1], year:(r[2]===undefined?null:r[2]), col:r[3], kind:r[4], text:r[5], goro:r[6]||'' };
    row.order = i;
    if (row.kind === 'e' && row.year !== null){
      let id = hashId(row.col + '|' + row.year + '|' + row.text);
      let n = 2; while (used[id]) { id = hashId(row.col+'|'+row.year+'|'+row.text) + '_' + (n++); }
      used[id] = 1;
      row.id = id;
      ITEMS.push(row); BYID[id] = row;
    }
    ROWS.push(row);
  });
})();

/* ---------- 1. localStorage ラッパ（失敗しても動く） ---------- */
let LS_OK = true;
const MEM = {};
function lsGet(k){
  try { return localStorage.getItem(k); } catch(e){ LS_OK = false; return (k in MEM) ? MEM[k] : null; }
}
function lsSet(k,v){
  try { localStorage.setItem(k,v); } catch(e){ LS_OK = false; MEM[k] = v; }
}
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete MEM[k]; } }

/* ---------- 2. DB（§10 スキーマ） ---------- */
function newAccId(){ return 'acc_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function emptyItem(){
  return { streak:0, mastered:false, masteredAt:null, postMasterWrong:0, lastFormat:null,
           totalCorrect:0, totalWrong:0,
           byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}},
           wrongLog:[], lastSeenAt:null };
}
function emptyDB(){
  return { app:APP, version:2, updatedAt:new Date().toISOString(),
           activeAccountId:null, accounts:[], progress:{} };
}
function normItem(o){
  const e = emptyItem();
  if (!o || typeof o !== 'object') return e;
  e.streak = +o.streak || 0;
  e.mastered = !!o.mastered;
  e.masteredAt = o.masteredAt || null;
  e.postMasterWrong = +o.postMasterWrong || 0;
  e.lastFormat = o.lastFormat || null;
  e.totalCorrect = +o.totalCorrect || 0;
  e.totalWrong = +o.totalWrong || 0;
  ['A','B'].forEach(function(f){
    const s = (o.byFormat && o.byFormat[f]) || {};
    e.byFormat[f] = { correct:+s.correct||0, wrong:+s.wrong||0 };
  });
  e.wrongLog = (Array.isArray(o.wrongLog) ? o.wrongLog : []).slice(0,5);
  e.lastSeenAt = o.lastSeenAt || null;
  return e;
}
/* §10 旧スキーマからの移行 */
function migrate(raw){
  if (!raw || typeof raw !== 'object') return emptyDB();
  let db = raw;
  if (db.users && !db.accounts){            // v0系 {users:{name:{st}}}
    const nd = emptyDB();
    Object.keys(db.users).forEach(function(name){
      const id = newAccId();
      nd.accounts.push({ id:id, name:name, createdAt:new Date().toISOString() });
      const items = {};
      const src = db.users[name].st || db.users[name].items || {};
      Object.keys(src).forEach(function(k){ items[k] = normItem(src[k]); });
      nd.progress[id] = { items:items, sessions:[] };
    });
    if (nd.accounts.length) nd.activeAccountId = nd.accounts[0].id;
    db = nd;
  }
  db.app = APP;
  db.version = 2;
  if (!Array.isArray(db.accounts)) db.accounts = [];
  if (!db.progress || typeof db.progress !== 'object') db.progress = {};
  db.accounts.forEach(function(a){
    if (!a.id) a.id = newAccId();
    if (!db.progress[a.id]) db.progress[a.id] = { items:{}, sessions:[] };
    const p = db.progress[a.id];
    if (!p.items) p.items = {};
    if (!Array.isArray(p.sessions)) p.sessions = [];
    Object.keys(p.items).forEach(function(k){ p.items[k] = normItem(p.items[k]); });
    p.sessions = p.sessions.slice(0,100);
  });
  if (!db.activeAccountId || !db.accounts.some(function(a){return a.id===db.activeAccountId;}))
    db.activeAccountId = db.accounts.length ? db.accounts[0].id : null;
  if (!db.updatedAt) db.updatedAt = new Date().toISOString();
  return db;
}
let DB = migrate(JSON.parse(lsGet(APP) || 'null'));

function saveDB(fromCloud){
  if (!fromCloud) DB.updatedAt = new Date().toISOString();   // §10 saveDB要件
  DB.app = APP; DB.version = 2;
  lsSet(APP, JSON.stringify(DB));
}
function acc(){ return DB.accounts.find(function(a){return a.id===DB.activeAccountId;}) || null; }
function prog(){
  const a = acc(); if (!a) return null;
  if (!DB.progress[a.id]) DB.progress[a.id] = { items:{}, sessions:[] };
  return DB.progress[a.id];
}
function it(id){
  const p = prog(); if (!p) return emptyItem();
  if (!p.items[id]) p.items[id] = emptyItem();
  return p.items[id];
}
function itRO(id){ const p = prog(); return (p && p.items[id]) || emptyItem(); }

function requiredStreak(item){

  if (w >= 6) return 4;
  if (w >= 3) return 3;
  return 2;
}

/* ---------- 5. 出題対象の抽出 ---------- */
function inRange(row){ return PREF.kai.indexOf(row.kai) >= 0 && PREF.col.indexOf(row.col) >= 0; }
function poolAll(){ return ITEMS.filter(inRange); }
function poolUnmastered(){ return poolAll().filter(function(r){ return !itRO(r.id).mastered; }); }
function poolCaution(){ return ITEMS.filter(function(r){ return itRO(r.id).postMasterWrong >= 1; }); }

/* 優先順位：totalWrong多い → 未出題 → lastSeenAt古い */
function pickTargets(n){
  const list = poolUnmastered().slice();
  list.sort(function(a,b){
    const A = itRO(a.id), B = itRO(b.id);
    if ((B.totalWrong||0) !== (A.totalWrong||0)) return (B.totalWrong||0) - (A.totalWrong||0);
    const an = A.lastSeenAt ? 1 : 0, bn = B.lastSeenAt ? 1 : 0;
    if (an !== bn) return an - bn;                       // 未出題を先に
    if (!A.lastSeenAt && !B.lastSeenAt) return a.order - b.order;
    return String(A.lastSeenAt).localeCompare(String(B.lastSeenAt));
  });
  return list.slice(0, n);
}

/* ---------- 6. 問題生成（A=年号→できごと / B=できごと→年号） ---------- */
function shuffle(a){ const x = a.slice(); for (let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=x[i];x[i]=x[j];x[j]=t; } return x; }

function makeQuestion(kpId, fmt){
  const row = BYID[kpId];
  const pool = ITEMS;                       // 誤答は全範囲から（近い年代を優先）
  if (fmt === 'A'){
    const same = shuffle(pool.filter(function(r){ return r.era===row.era && r.year!==row.year; }));
    const near = shuffle(pool.filter(function(r){ return r.year!==row.year && Math.abs(r.year-row.year)<=60; }));
    const any  = shuffle(pool.filter(function(r){ return r.year!==row.year; }));
    const cand = [], seen = {};
    [same, near, any].forEach(function(src){
      src.forEach(function(r){ if (cand.length<3 && !seen[r.text]){ seen[r.text]=1; cand.push(r); } });
    });
    const choices = shuffle(cand.slice(0,3).map(function(r){ return r.text; }).concat([row.text]));
    return { kpId:kpId, format:'A', qLabel:'年号 → できごと',
             prompt:yearLabel(row.year), promptSub:'このできごとは？',
             choices:choices, answer:row.text, row:row };
  } else {
    const ys = {}; ITEMS.forEach(function(r){ ys[r.year] = 1; });
    const years = Object.keys(ys).map(Number).filter(function(y){ return y !== row.year; });
    years.sort(function(a,b){ return Math.abs(a-row.year) - Math.abs(b-row.year); });
    const near = years.slice(0, 14);
    const cand = shuffle(near).slice(0,3);
    let g = 1;
    while (cand.length < 3){ const y = row.year + g*7; if (cand.indexOf(y)<0) cand.push(y); g++; }
    const choices = shuffle(cand.concat([row.year])).map(yearLabel);
    return { kpId:kpId, format:'B', qLabel:'できごと → 年号',
             prompt:row.text, promptSub:'これは何年のできごと？',
             choices:choices, answer:yearLabel(row.year), row:row };
  }
}

function dbHasRecords(d){

  return Object.keys(d.progress).some(function(aid){
    const p = d.progress[aid] || {};
    if (Array.isArray(p.sessions) && p.sessions.length) return true;

/* §13-3 合流 */
function newer(a,b){ if(!a) return false; if(!b) return true; return String(a) > String(b); }
function mergeItem(L, R){
  const l = normItem(L), r = normItem(R);
  const o = emptyItem();
  o.totalCorrect    = Math.max(l.totalCorrect, r.totalCorrect);
  o.totalWrong      = Math.max(l.totalWrong, r.totalWrong);
  o.postMasterWrong = Math.max(l.postMasterWrong, r.postMasterWrong);
  ['A','B'].forEach(function(f){
    o.byFormat[f].correct = Math.max(l.byFormat[f].correct, r.byFormat[f].correct);
    o.byFormat[f].wrong   = Math.max(l.byFormat[f].wrong,   r.byFormat[f].wrong);
  });
  o.mastered = l.mastered || r.mastered;
  if (l.masteredAt && r.masteredAt) o.masteredAt = (String(l.masteredAt) < String(r.masteredAt)) ? l.masteredAt : r.masteredAt;
  else o.masteredAt = l.masteredAt || r.masteredAt || null;
  const map = {};
  l.wrongLog.concat(r.wrongLog).forEach(function(w){ if (w && w.at) map[w.at] = w; });
  o.wrongLog = Object.keys(map).sort().reverse().slice(0,5).map(function(k){ return map[k]; });
  o.lastSeenAt = newer(l.lastSeenAt, r.lastSeenAt) ? l.lastSeenAt : r.lastSeenAt;
  const lNew = newer(l.lastSeenAt, r.lastSeenAt);          // streak/lastFormat は lastSeenAt が新しい側
  o.streak = lNew ? l.streak : r.streak;
  o.lastFormat = lNew ? l.lastFormat : r.lastFormat;
  return o;
}
function mergeDB(local, cloud){
  const out = { app:APP, version:2, updatedAt:local.updatedAt, activeAccountId:null, accounts:[], progress:{} };
  const byName = {};
  local.accounts.forEach(function(a){ byName[a.name] = { id:a.id, createdAt:a.createdAt, local:a }; });
  cloud.accounts.forEach(function(a){
    if (!byName[a.name]) byName[a.name] = { id:a.id, createdAt:a.createdAt, cloud:a };
    else { byName[a.name].cloud = a;
           if (a.createdAt && (!byName[a.name].createdAt || String(a.createdAt) < String(byName[a.name].createdAt)))
             byName[a.name].createdAt = a.createdAt; }
  });
  Object.keys(byName).forEach(function(name){
    const e = byName[name];
    const id = e.id;
    out.accounts.push({ id:id, name:name, createdAt:e.createdAt || new Date().toISOString() });
    const lp = (e.local && local.progress[e.local.id]) || { items:{}, sessions:[] };
    const cp = (e.cloud && cloud.progress[e.cloud.id]) || { items:{}, sessions:[] };
    const items = {};
    const keys = {};
    Object.keys(lp.items||{}).forEach(function(k){ keys[k]=1; });
    Object.keys(cp.items||{}).forEach(function(k){ keys[k]=1; });
    Object.keys(keys).forEach(function(k){ items[k] = mergeItem((lp.items||{})[k], (cp.items||{})[k]); });
    const smap = {};
    (lp.sessions||[]).concat(cp.sessions||[]).forEach(function(s){ if (s && s.finishedAt) smap[s.finishedAt] = s; });
    const sessions = Object.keys(smap).sort().reverse().slice(0,100).map(function(k){ return smap[k]; });
    out.progress[id] = { items:items, sessions:sessions };
  });
  const la = local.accounts.find(function(a){ return a.id === local.activeAccountId; });
  if (la){ const m = out.accounts.find(function(a){ return a.name === la.name; }); if (m) out.activeAccountId = m.id; }
  if (!out.activeAccountId) out.activeAccountId = out.accounts.length ? out.accounts[0].id : null;
  return out;
}
function dbStat(d){
  let ppl = d.accounts.length, seen = 0, mas = 0;
  Object.keys(d.progress).forEach(function(aid){
    const items = (d.progress[aid]||{}).items || {};
    Object.keys(items).forEach(function(k){
      const i = items[k];
      if (((+i.totalCorrect||0)+(+i.totalWrong||0)) > 0) seen++;
      if (i.mastered) mas++;
    });
  });
  return { ppl:ppl, seen:seen, mas:mas };
}

function setSyncMsg(text, cls){ SYNCMSG = { text:text, cls:cls||'' }; const el=$('syncbox'); if(el) el.outerHTML = syncBoxHTML(); }

async function doPull(silent){
  if (!syncReady()) return;
  setSyncMsg('☁… クラウドを確認しています', 'busy');
  try {
    const cloud = await apiPull();
    const localHas = dbHasRecords(DB);
    const cloudHas = cloud && dbHasRecords(cloud);
    if (!cloud){                                   // §13-2 (2)
      await apiPush(DB); touchSync();
      setSyncMsg('☁ クラウドに進捗が無かったので送りました');
    } else if (!localHas && cloudHas){             // §13-2 (1)
      DB = migrate(cloud); saveDB(true); touchSync();
      const st = dbStat(DB);
      setSyncMsg('☁✓ クラウドの記録を取り込みました（'+st.ppl+'人・出題済み'+st.seen+'・習得'+st.mas+'）');
    } else if (localHas && !cloudHas){
      await apiPush(DB); touchSync();
      setSyncMsg('☁ クラウドに進捗が無かったので送りました');
    } else {                                       // §13-2 (3) 必ず合流
      const before = JSON.stringify(DB);
      const merged = mergeDB(DB, migrate(cloud));
      DB = merged; saveDB(true);
      const changed = JSON.stringify(DB) !== before;
      if (changed) { DB.updatedAt = new Date().toISOString(); saveDB(true); await apiPush(DB); }
      touchSync();
      const st = dbStat(DB);
      setSyncMsg('☁✓ クラウドと合流しました（'+st.ppl+'人・出題済み'+st.seen+'・習得'+st.mas+'）');
    }
  } catch(e){
    const m = String(e && e.message || e);
    if (/合言葉|key|認証|不正な合言葉/i.test(m)) setSyncMsg('☁⚠ 合言葉が違います', 'err');
    else if (/GASの応答/.test(m)) setSyncMsg('☁⚠ ' + m, 'err');
    else setSyncMsg('☁ オフライン（ローカルには保存済み）', 'err');
  }
  if (!silent) render();
}

/* ---------- 統計 ---------- */
function statFor(rows){
  let mas=0, cau=0, one=0, none=0;
  rows.forEach(function(r){
    const i = itRO(r.id);
    if (i.mastered){ mas++; if (i.postMasterWrong>0) cau++; }
    else if (i.totalCorrect>0) one++;
    else none++;
  });
  return { total:rows.length, mastered:mas, caution:cau, one:one, none:none };
}
function stateLabel(i){
  if (i.mastered) return i.postMasterWrong>0 ? '要注意習得' : '習得済み';
  if (i.totalCorrect>0) return i.totalCorrect+'回正解';
  if (i.totalWrong>0) return '誤答';
  return '未出題';
}

function cloneItem(o){ return JSON.parse(JSON.stringify(o)); }

function buildQueueBoth(rows){
  const pass1 = shuffle(rows).map(function(r){ return { kpId:r.id, format: Math.random()<0.5?'A':'B', src:null }; });
  const pass2 = shuffle(pass1.slice()).map(function(q){ return { kpId:q.kpId, format: q.format==='A'?'B':'A', src:null }; });
  return pass1.concat(pass2);
}
function startSession(mode){
  let rows = [], queue = [];
  if (mode === '10問' || mode === '20問'){
    rows = pickTargets(mode === '10問' ? 10 : 20);
    queue = buildQueueBoth(rows);
  } else if (mode === '再確認'){
    rows = poolCaution();
    queue = buildQueueBoth(rows);
  } else {
    rows = shuffle(poolAll());
    queue = rows.map(function(r){
      const lf = itRO(r.id).lastFormat;
      const f = lf === 'A' ? 'B' : lf === 'B' ? 'A' : (Math.random()<0.5?'A':'B');
      return { kpId:r.id, format:f, src:null };
    });
  }
  if (!rows.length){ alert('出題できる問題がありません。出題範囲の設定をご確認ください。'); return; }
  const baseline = {};
  rows.forEach(function(r){ baseline[r.id] = cloneItem(itRO(r.id)); });
  S = { mode:mode, startedAt:new Date().toISOString(), queue:queue, idx:0, view:0,
        hist:[], baseline:baseline, work:{}, targets:rows.map(function(r){return r.id;}),
        masteredAtStart:{}, overflow:{}, q:null, shortfall:0 };
  rows.forEach(function(r){ if (baseline[r.id].mastered) S.masteredAtStart[r.id] = 1; });
  const want = mode==='10問'?10:mode==='20問'?20:rows.length;
  S.shortfall = Math.max(0, want - rows.length);
  replayWork();
  S.q = makeQuestion(queue[0].kpId, queue[0].format);
  VIEW = 'quiz'; render();
  if (S.shortfall > 0) setTimeout(function(){
    alert('出題対象が'+rows.length+'語しかないため、'+rows.length+'語で出題します。');
  }, 60);
}
function replayWork(){
  S.work = {};
  Object.keys(S.baseline).forEach(function(k){ S.work[k] = cloneItem(S.baseline[k]); });
  S.hist.forEach(function(h){ if (h && h.answered != null) applyAnswer(h); });
}
function applyAnswer(h){
  const w = S.work[h.kpId] || (S.work[h.kpId] = emptyItem());
  const at = h.at, fmt = h.format;
  w.lastSeenAt = at;
  if (h.correct){ w.totalCorrect++; w.byFormat[fmt].correct++; }
  else {
    w.totalWrong++; w.byFormat[fmt].wrong++;
    w.wrongLog.unshift({ at:at, format:fmt, answered:h.answered });
    w.wrongLog = w.wrongLog.slice(0,5);
  }
  if (S.mode === '再確認'){
    if (!h.correct && w.mastered) w.postMasterWrong++;
    w.lastFormat = fmt;
    return;                                     // §3-3 streak/mastered は変えない
  }
  if (h.correct){
    if (w.lastFormat !== fmt) w.streak++;        // §4-1 連続正解は必ず異なる形式
    if (!w.mastered && w.streak >= requiredStreak(w)){ w.mastered = true; w.masteredAt = at; }
  } else {
    w.streak = 0;
    if (w.mastered) w.postMasterWrong++;         // §4-2 降格しない
  }
  w.lastFormat = fmt;
}
function reinsertCount(kpId){
  return S.queue.filter(function(q){ return q.kpId===kpId && q.src!=null; }).length;
}
function scheduleReinsert(qi){
  if (!QUEUE_MODES[S.mode]) return;
  const h = S.hist[qi]; if (!h) return;
  const w = S.work[h.kpId];
  let after = 0;
  if (!h.correct) after = 3;
  else if (!w.mastered) after = 6;
  else return;
  if (reinsertCount(h.kpId) >= 4){ S.overflow[h.kpId] = 1; return; }
  const pos = Math.min(qi + after, S.queue.length);
  S.queue.splice(pos, 0, { kpId:h.kpId, format: h.format==='A'?'B':'A', src:qi });
}
function removeReinsert(qi){
  for (let i = S.queue.length-1; i > S.idx; i--){ if (S.queue[i].src === qi) S.queue.splice(i,1); }
}
function answer(choice){
  const cur = S.queue[S.view];
  const q = S.q;
  const correct = (choice === q.answer);
  const isRe = (S.view < S.idx);
  if (isRe) removeReinsert(S.view);
  S.hist[S.view] = { kpId:cur.kpId, format:cur.format, answered:choice, correct:correct,
                     at:new Date().toISOString(), qText:q.prompt, ansText:q.answer };
  replayWork();
  scheduleReinsert(S.view);
  render();
}
function nextQ(){
  if (S.view < S.idx){ S.view++; S.q = makeQuestion(S.queue[S.view].kpId, S.queue[S.view].format); render(); return; }
  if (S.idx >= S.queue.length - 1){ finishSession(); return; }
  S.idx++; S.view = S.idx;
  S.q = makeQuestion(S.queue[S.idx].kpId, S.queue[S.idx].format);
  render();
}
function prevQ(){
  if (S.view <= 0) return;
  S.view--;
  S.q = makeQuestion(S.queue[S.view].kpId, S.queue[S.view].format);
  const h = S.hist[S.view];
  if (h){ S.q.choices = S.q.choices.slice(); if (S.q.choices.indexOf(h.answered)<0) S.q.choices[0] = h.answered; }
  render();
}
function finishSession(){
  const p = prog(); if (!p) return;
  let correct = 0, wrong = 0; const wrongKpIds = {};
  S.hist.forEach(function(h){ if(!h) return; if (h.correct) correct++; else { wrong++; wrongKpIds[h.kpId]=1; } });
  Object.keys(S.work).forEach(function(id){ p.items[id] = S.work[id]; });
  const newly = S.targets.filter(function(id){ return S.work[id] && S.work[id].mastered && !S.masteredAtStart[id]; });
  let totalMastered = 0;
  Object.keys(p.items).forEach(function(k){ if (p.items[k].mastered) totalMastered++; });
  p.sessions.unshift({ startedAt:S.startedAt, finishedAt:new Date().toISOString(), mode:S.mode,
                       correct:correct, wrong:wrong, newlyMastered:newly,
                       wrongKpIds:Object.keys(wrongKpIds), totalMastered:totalMastered });
  p.sessions = p.sessions.slice(0,100);
  saveDB();
  S.result = { correct:correct, wrong:wrong, newly:newly };
  VIEW = 'result'; render();
  autoPush();
}
function abortSession(){
  if (!confirm('とちゅうでやめると、今回の成績は記録されません。ホームにもどりますか？')) return;
  S = null; VIEW = 'home'; render();
}

const HEADER14 = ['名前','カテゴリー','記号','知識ポイント','よみがな','重要度','状態',
  '累計正解数','累計誤答数','形式A誤答数','形式B誤答数','過去の誤答内容','最終誤答日','習得日'];
function rows14(accountsFilter){
  const out = [];
  DB.accounts.forEach(function(a){
    if (accountsFilter && a.id !== accountsFilter) return;
    const items = (DB.progress[a.id]||{}).items || {};
    ITEMS.forEach(function(r){
      const i = normItem(items[r.id]);
      const st = stateLabel(i);
      const past = (i.wrongLog||[]).map(function(w){ return (w.answered||''); }).filter(Boolean).join('；');
      const lastW = (i.wrongLog||[])[0];
      out.push([ a.name, r.era, yearLabel(r.year), r.text, '', COLIMP[r.col], st,
                 i.totalCorrect, i.totalWrong, i.byFormat.A.wrong, i.byFormat.B.wrong,
                 past, lastW ? fmtD(lastW.at) : '', i.masteredAt ? fmtD(i.masteredAt) : '' ]);
    });
  });
  return out;
}
function downloadCSV(){
  const a = acc(); if (!a) return;
  const rows = rows14(a.id).slice();
  rows.sort(function(x,y){ return (y[8]-x[8]); });
  const body = [HEADER14].concat(rows).map(function(r){
    return r.map(function(c){ return '"' + String(c==null?'':c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');
  const blob = new Blob(['﻿'+body], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = url; el.download = TOOL_NAME+'結果_'+a.name+'_'+todayTag()+'.csv';
  document.body.appendChild(el); el.click(); document.body.removeChild(el);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
async function exportList(){
  if (!syncReady()) return;
  setSyncMsg('☁… 一覧を書き出しています','busy');
  try {
    const cloud = await apiPull();                       // §15 空上書き防止
    if (cloud && dbHasRecords(cloud) && !dbHasRecords(DB)){ DB = migrate(cloud); saveDB(true); }
    if (!dbHasRecords(DB)){
      setSyncMsg('☁⚠ 記録がまだ無いので書き出しを中止しました','err');
      openModal('<h2>書き出しを中止しました</h2><p>この端末にもクラウドにも学習記録がありません。空のデータで上書きしないため中止しました。</p><button class="btn wide" onclick="closeModal()">とじる</button>');

  } catch(e){
    const m = String(e && e.message || e);

function importJSON(file){
  const fr = new FileReader();
  fr.onload = function(){
    let d = null;
    try { d = JSON.parse(fr.result); } catch(e){ alert('ファイルを読み取れませんでした。'); return; }
    if (!d || (d.app && d.app !== APP)){ alert('このツールの記録ファイルではありません（app が一致しません）。'); return; }
    const nd = migrate(d);
    const names = nd.accounts.map(function(a){return a.name;}).join('、') || '（なし）';
    openModal('<h2>記録を置き換えますか？</h2>'+
      '<p class="muted">読み込むファイルの内容</p>'+
      '<div class="list-item">アカウント：'+esc(names)+'<br>保存日時：'+esc(fmtDT(nd.updatedAt))+'</div>'+
      '<p class="muted">いまの端末の記録は置き換えられます。</p>'+
      '<div class="row"><button class="btn grow" onclick="doImport()">置き換える</button>'+
      '<button class="btn gray grow" onclick="closeModal()">やめる</button></div>');
    window.__pendingImport = nd;
  };
  fr.readAsText(file);
}

function startWeak(){
  const weak = ITEMS.filter(function(r){ return itRO(r.id).totalWrong>0 && !itRO(r.id).mastered; })
    .sort(function(a,b){ return itRO(b.id).totalWrong - itRO(a.id).totalWrong; }).slice(0,10);
  if (!weak.length){ alert('復習対象がありません。'); return; }
  const baseline = {}; weak.forEach(function(r){ baseline[r.id] = cloneItem(itRO(r.id)); });
  S = { mode:'10問', startedAt:new Date().toISOString(), queue:buildQueueBoth(weak), idx:0, view:0,
        hist:[], baseline:baseline, work:{}, targets:weak.map(function(r){return r.id;}),
        masteredAtStart:{}, overflow:{}, q:null, shortfall:0 };
  weak.forEach(function(r){ if (baseline[r.id].mastered) S.masteredAtStart[r.id]=1; });
  replayWork();
  S.q = makeQuestion(S.queue[0].kpId, S.queue[0].format);
  VIEW='quiz'; render();
}

/* ---------------- 出題 ---------------- */
function screenQuiz(){
  const q = S.q, h0 = S.hist[S.view];
  const total = S.queue.length, no = S.view+1;
  const pct = Math.round(no/total*100);
  let done = 0, ok = 0, ng = 0;
  S.hist.forEach(function(x){ if(x){ done++; if(x.correct) ok++; else ng++; } });
  const remain = S.targets.filter(function(id){ return !(S.work[id]&&S.work[id].mastered); }).length;
  const w = S.work[q.kpId] || emptyItem();
  const need = requiredStreak(w);

  let h = '<div class="top"><div class="spread" style="margin-bottom:6px">'+
    '<button class="btn gray sm" onclick="abortSession()">やめる</button>'+
    '<span class="badge">'+esc(S.mode)+'</span>'+
    '<span class="muted">'+no+'問目 / 全'+total+'問</span></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="spread" style="margin:6px 0 10px"><span class="muted">'+
      (S.mode==='全問'?'':'あと '+remain+'語')+'</span>'+
    '<span class="muted">正解 '+ok+' ／ 誤答 '+ng+'</span></div></div>';

  /* 習得ゲージ */
  if (S.mode !== '再確認'){
    let g = '';
    for (let i=0;i<need;i++) g += '<span class="'+(i<w.streak?'f':'')+'"></span>';
    h += '<div class="card" style="padding:10px 14px"><div class="spread"><span class="gauge">'+g+'</span>'+
      '<span class="sr">'+(w.mastered?'習得ずみ':'あと'+Math.max(0,need-w.streak)+'回で習得')+
      (need>2?' ／ このことばは苦手なので'+need+'回必要':'')+'</span></div></div>';
  }

  h += '<div class="card">';
  h += '<div class="sr" style="margin-bottom:6px">'+esc(q.qLabel)+' ／ '+esc(q.row.era)+' <span class="tag '+q.row.col+'">'+esc(COLNAME[q.row.col])+'</span></div>';
  h += '<div class="qbox">'+(q.format==='A'
      ? '<div class="qyear">'+esc(q.prompt)+'</div><div class="muted">'+esc(q.promptSub)+'</div>'
      : '<div class="qtext">'+esc(q.prompt)+'</div><div class="muted">'+esc(q.promptSub)+'</div>')+'</div>';

  q.choices.forEach(function(c){
    let cls = 'choice';
    if (h0){
      if (c === q.answer) cls += ' correct';
      else if (c === h0.answered) cls += ' wrong';
      else cls += ' dim';
    }
    h += '<button class="'+cls+'" '+(h0?'disabled':'onclick="answer(this.dataset.c)"')+' data-c="'+esc(c)+'">'+esc(c)+'</button>';
  });

  if (h0){
    h += '<div class="fb '+(h0.correct?'ok':'ng')+'">'+(h0.correct?'○ 正解！':'× ざんねん…　正解は「'+esc(q.answer)+'」')+'</div>';
    h += '<div class="list-item"><b>'+esc(yearLabel(q.row.year))+'</b>　'+esc(q.row.text)+
         '<div class="sr">'+esc(q.row.era)+'／'+esc(KAI_LABEL[q.row.kai])+'</div>'+
         (q.row.goro?'<div class="goro" style="margin-top:8px">🎵 '+esc(q.row.goro)+'</div>':'')+'</div>';
    if (S.overflow[q.kpId]) h += '<div class="warnbar">この語は今回くり返し出題したので、次回にまわします（要復習）</div>';
  }
  h += '</div>';

  h += '<div class="fixed-bottom row">'+
    '<button class="btn gray grow" onclick="prevQ()" '+(S.view>0?'':'disabled')+'>← 前の問題へ</button>'+
    (h0 || S.view < S.idx
      ? '<button class="btn grow" onclick="nextQ()">'+((S.view>=S.idx && S.idx>=S.queue.length-1)?'結果を見る →':'つぎへ →')+'</button>'
      : '<button class="btn grow" disabled>こたえを選んでね</button>')+
    '</div>';
  if (S.view < S.idx) h += '<div class="sr center">見なおし中（'+(S.view===S.idx-1?'この問題は答え直せます':'閲覧のみ')+'）</div>';
  return h;
}

function resultTable(){
  const eras = ERA_ORDER.filter(function(e){ return ITEMS.some(function(r){return r.era===e;}); });
  let rows = ITEMS.slice();
  if (RFILTER.era) rows = rows.filter(function(r){ return r.era===RFILTER.era; });
  if (RFILTER.state) rows = rows.filter(function(r){ return stateLabel(itRO(r.id))===RFILTER.state; });
  if (RFILTER.sort==='wrong') rows.sort(function(a,b){ return itRO(b.id).totalWrong - itRO(a.id).totalWrong || a.order-b.order; });
  else rows.sort(function(a,b){ return a.order-b.order; });

  let h = '<div class="card"><h3>時代べつ 全問一覧（累計）</h3>'+
    '<div class="row tight" style="margin-bottom:8px">'+
    '<select onchange="RFILTER.era=this.value;render()" style="width:auto"><option value="">時代：すべて</option>'+
      eras.map(function(e){ return '<option value="'+esc(e)+'"'+(RFILTER.era===e?' selected':'')+'>'+esc(e)+'</option>'; }).join('')+'</select>'+
    '<select onchange="RFILTER.state=this.value;render()" style="width:auto"><option value="">状態：すべて</option>'+
      ['習得済み','要注意習得','誤答','未出題'].map(function(e){ return '<option value="'+esc(e)+'"'+(RFILTER.state===e?' selected':'')+'>'+esc(e)+'</option>'; }).join('')+'</select>'+
    '<select onchange="RFILTER.sort=this.value;render()" style="width:auto">'+
      '<option value="wrong"'+(RFILTER.sort==='wrong'?' selected':'')+'>誤答が多い順</option>'+
      '<option value="order"'+(RFILTER.sort==='order'?' selected':'')+'>年表の順</option></select>'+
    '</div><div class="tw"><table><tr><th>年</th><th>できごと</th><th>状態</th><th>正</th><th>誤</th><th>A誤</th><th>B誤</th></tr>';
  rows.slice(0,400).forEach(function(r){
    const i = itRO(r.id), st = stateLabel(i);
    const cls = st==='要注意習得'?'badge warn':st==='習得済み'?'badge ok':st==='未出題'?'badge':'badge ng';
    const past = (i.wrongLog||[]).map(function(w){return w.answered;}).filter(Boolean).join('／');
    h += '<tr><td style="white-space:nowrap">'+esc(yearLabel(r.year))+'</td><td>'+esc(r.text)+
      '<div class="sr">'+esc(r.era)+'</div>'+(past?'<div class="sr">誤答内容：'+esc(past)+'</div>':'')+'</td>'+
      '<td><span class="'+cls+'">'+esc(st)+'</span></td><td>'+i.totalCorrect+'</td>'+
      '<td'+(i.totalWrong>=2?' style="font-weight:800;color:var(--ng)"':'')+'>'+i.totalWrong+'</td>'+
      '<td>'+i.byFormat.A.wrong+'</td><td>'+i.byFormat.B.wrong+'</td></tr>';
  });
  h += '</table></div>';
  if (rows.length>400) h += '<p class="sr">※ 表示は400件までです（フィルタで絞ってください）</p>';
  h += '<button class="btn gray wide" style="margin-top:10px" onclick="downloadCSV()">📄 CSVダウンロード（14列）</button></div>';
  return h;
}

  openModal('<h2>☁ クラウド同期設定</h2>'+
    '<p class="muted">GASのウェブアプリURL（末尾が /exec）と合言葉を入れてください。この設定は端末ごとに保存され、同期データには含まれません。</p>'+
    '<label>GASのURL</label><input type="url" id="sy_url" value="'+esc(s.url||'')+'" placeholder="https://script.google.com/macros/s/…/exec">'+
    '<label>合言葉</label><input type="text" id="sy_key" value="'+esc(s.key||'')+'" placeholder="合言葉">'+
    '<div class="row" style="margin-top:12px">'+
    '<button class="btn grow" onclick="saveSync()">保存して同期</button>'+
    '<button class="btn gray grow" onclick="closeModal()">とじる</button></div>'+
    (s.url?'<button class="btn gray wide" style="margin-top:8px" onclick="clearSync()">同期を解除</button>':''));
}
async function saveSync(){
  const url = ($('sy_url').value||'').trim();
  const key = ($('sy_key').value||'').trim();
  if (!url || !key){ alert('URLと合言葉の両方を入れてください。'); return; }
  if (!/\/exec\/?$/.test(url) && !confirm('URLの末尾が /exec ではありません。このまま保存しますか？')) return;
  const s = getSync(); s.url = url; s.key = key; setSync(s);
  closeModal();
  await doPull();
}
function clearSync(){
  if (!confirm('この端末の同期設定を消します。学習記録は消えません。')) return;
  lsDel(SYNC_KEY); SYNCMSG = { text:'', cls:'' }; closeModal();
}

/* ---------- ルーター ---------- */
function render(){
  let h = '';
  if (!DB.accounts.length || VIEW === 'accounts' || !acc()) h = screenAccounts();
  else if (VIEW === 'quiz'   && S) h = screenQuiz();
  else if (VIEW === 'result' && S) h = screenResult();
  else if (VIEW === 'flip')     h = screenFlip();
  else if (VIEW === 'viewer')   h = screenViewer();
  else if (VIEW === 'goro')     h = screenGoro();
  else if (VIEW === 'gorolist') h = screenGoroList();
  else if (VIEW === 'slide')    h = screenSlide();
  else h = screenHome();
  if (MODAL) h += '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">'+MODAL+'</div></div>';
  APPEL.innerHTML = h;
  if (VIEW !== 'quiz') window.scrollTo(0, window.__keepScroll ? window.scrollY : 0);
}

/* ---------- 離脱時の警告（§6-2） ---------- */
window.addEventListener('beforeunload', function(e){
  if (VIEW === 'quiz' && S && S.hist.some(function(x){return !!x;})){
    e.preventDefault(); e.returnValue = '';
  }
});

/* ---------- 起動 ---------- */
(function boot(){
  VIEW = DB.accounts.length ? 'home' : 'accounts';
  saveDB(true);
  render();
  if (syncReady()) doPull();      // §13-1 起動直後にpull
})();
</script></body></html>
