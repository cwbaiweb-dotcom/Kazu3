<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中学受験 公民（難関校）</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1c2430; --muted:#68727f; --line:#e2e7ef;
  --pri:#2563c9; --pri-d:#1b4a99; --ok:#1f9d63; --ok-bg:#e6f6ee;
  --warn:#e0862a; --warn-bg:#fdf2e2; --bad:#d24b4b; --bad-bg:#fbeaea;
  --mid:#b9d0f2; --light:#eef1f6; --chip:#eaf0fb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
#warnbar{display:none;background:var(--bad-bg);color:var(--bad);padding:8px 12px;font-size:13px;text-align:center;border-bottom:1px solid var(--bad)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#2b6fd6,#2560c2);color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .ttl{font-weight:700;font-size:16px;flex:1;letter-spacing:.02em}
#accBtn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .em{font-size:18px}
.muted{color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;
  padding:11px 14px;font-size:15px;cursor:pointer;font-weight:600;transition:.05s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.gh{background:#f6f8fc}
.btn.wide{width:100%;display:block;text-align:center}
.btn.lg{padding:15px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid #d5e2f8;color:#274b86;
  border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .n{font-size:11px;opacity:.85;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}
.bar{height:12px;border-radius:8px;background:var(--light);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:8px}
.bar>i.warn{background:linear-gradient(90deg,var(--ok) 70%,var(--warn))}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.syncbar{font-size:13px;padding:8px 10px;border-radius:9px;background:#f1f4f9;color:var(--muted);margin-bottom:8px}
.syncbar.ok{background:var(--ok-bg);color:#137a49}
.syncbar.ng{background:var(--bad-bg);color:var(--bad)}
.badge{display:inline-block;background:var(--warn-bg);color:var(--warn);border:1px solid #f0cd9c;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.qbox{font-size:19px;font-weight:700;margin:6px 0 14px;line-height:1.5}
.choice{width:100%;text-align:left;margin:7px 0;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px;cursor:pointer;font-weight:600;line-height:1.45}
.choice:hover{border-color:#c4d4ee}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ng{border-color:var(--bad);background:var(--bad-bg)}
.choice.dim{opacity:.6}
.fb{border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
.fb.ok{background:var(--ok-bg);border:1px solid #b6e3cd}
.fb.ng{background:var(--bad-bg);border:1px solid #f1c4c4}
.fb .lead{font-weight:800;font-size:15px}
.topbar{position:sticky;top:52px;z-index:10;background:var(--bg);padding:8px 0}
.pbar{height:8px;border-radius:6px;background:#dfe6f1;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--pri)}
.metar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.gauge{letter-spacing:3px;font-size:16px}
.gauge b{color:var(--pri)}
.gauge s{color:#cfd8e6;text-decoration:none}
.state{display:inline-block;font-size:11px;border-radius:6px;padding:2px 7px;font-weight:700}
.s-master{background:var(--ok-bg);color:#137a49}
.s-warn{background:var(--warn-bg);color:var(--warn)}
.s-mid{background:#eaf1fb;color:#2f5da3}
.s-bad{background:var(--bad-bg);color:var(--bad)}
.s-none{background:#eef1f6;color:#8a93a0}
.imp2{color:#d23b6a;font-weight:800}
.imp1{color:#2f7ad2;font-weight:800}
.list-row{border-top:1px solid var(--line);padding:9px 2px;font-size:14px}
.list-row:first-child{border-top:none}
.small-sel{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
ruby rt{font-size:.55em;color:var(--muted)}
.modemenu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modebtn{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;cursor:pointer;text-align:left}
.modebtn:active{transform:translateY(1px)}
.modebtn .mt{font-weight:800;font-size:16px}
.modebtn .md{font-size:12px;color:var(--muted);margin-top:3px}
.modebtn.p{background:linear-gradient(180deg,#eaf2ff,#dbe9ff);border-color:#bcd4f7}
.overlay{position:fixed;inset:0;background:rgba(20,28,44,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px}
.flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222c3a;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:.2s}
.flash.on{opacity:1}
a{color:var(--pri)}
.hr{height:1px;background:var(--line);margin:12px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:3px}
</style>
</head>
<body>
<div id="warnbar"></div>
<header>
  <div class="ttl">📘 中学受験 公民</div>
  <button id="accBtn">👤 —</button>
</header>
<div class="wrap"><div id="app"></div></div>
<div id="flash" class="flash"></div>

/* ---------- 合流（1アカウント用） ---------- */
function mergeItem(a,b){
  if(!a)return normItem(b); if(!b)return normItem(a);
  a=normItem(a); b=normItem(b); var o=blankItem();
  o.totalCorrect=Math.max(a.totalCorrect,b.totalCorrect);
  o.totalWrong=Math.max(a.totalWrong,b.totalWrong);
  o.postMasterWrong=Math.max(a.postMasterWrong,b.postMasterWrong);
  ['A','B'].forEach(function(f){ o.byFormat[f].correct=Math.max(a.byFormat[f].correct,b.byFormat[f].correct); o.byFormat[f].wrong=Math.max(a.byFormat[f].wrong,b.byFormat[f].wrong); });
  o.mastered=a.mastered||b.mastered;
  if(a.masteredAt&&b.masteredAt)o.masteredAt=(new Date(a.masteredAt)<=new Date(b.masteredAt))?a.masteredAt:b.masteredAt;
  else o.masteredAt=a.masteredAt||b.masteredAt||null;
  if(o.mastered&&!o.masteredAt)o.masteredAt=nowISO();
  var seen={},log=[];
  a.wrongLog.concat(b.wrongLog).forEach(function(w){ var k=w.at+'|'+w.format; if(!seen[k]){seen[k]=1;log.push(w);} });
  log.sort(function(x,y){return new Date(y.at)-new Date(x.at);}); o.wrongLog=log.slice(0,5).reverse();
  var at=a.lastSeenAt?new Date(a.lastSeenAt).getTime():0, bt=b.lastSeenAt?new Date(b.lastSeenAt).getTime():0;
  var newer=(at>=bt)?a:b;
  o.lastSeenAt=newer.lastSeenAt||a.lastSeenAt||b.lastSeenAt||null;
  o.streak=newer.streak; o.lastFormat=newer.lastFormat;
  return o;
}
function mergeProgress(L,C){
  L=normProgress(L); C=normProgress(C);
  var M={items:{},sessions:[]},ids={};
  Object.keys(L.items).forEach(function(k){ids[k]=1;}); Object.keys(C.items).forEach(function(k){ids[k]=1;});
  Object.keys(ids).forEach(function(k){ M.items[k]=mergeItem(L.items[k],C.items[k]); });
  var seen={},ss=[]; L.sessions.concat(C.sessions).forEach(function(s){ if(!seen[s.finishedAt]){seen[s.finishedAt]=1;ss.push(s);} });
  ss.sort(function(x,y){return new Date(y.finishedAt)-new Date(x.finishedAt);});
  M.sessions=ss.slice(0,100).reverse();
  return M;
}

/* ---------- 適応ハードル（§4-1） ---------- */
function requiredStreak(it){ var w=it&&it.totalWrong||0; if(w>=6)return 4; if(w>=3)return 3; return 2; }

/* ---------- 出題範囲（§3-5） ---------- */
function impPass(imp){ if(UI.impFilter==='top')return imp===2; if(UI.impFilter==='topboth')return imp>=1; return true; }
function inRange(kp){ if(UI.category!=='すべて'&&kp.cat!==UI.category)return false; return impPass(kp.imp); }
function rangeKPs(){ return KPS.filter(inRange); }
function catCount(cat){ return KPS.filter(function(k){ return (cat==='すべて'||k.cat===cat)&&impPass(k.imp); }).length; }
function usedCats(){ var s={}; KPS.forEach(function(k){s[k.cat]=1;}); return CAT_ORDER.filter(function(c){return s[c];}); }

/* ---------- 状態判定 ---------- */
function stateOf(it){
  if(!it||(!it.lastSeenAt&&!it.totalCorrect&&!it.totalWrong))return {k:'none',t:'未出題'};
  if(it.mastered&&it.postMasterWrong>=1)return {k:'warn',t:'要注意習得'};
  if(it.mastered)return {k:'master',t:'習得済み'};
  if(it.totalCorrect>0)return {k:'mid',t:it.totalCorrect+'回正解'};
  if(it.totalWrong>0)return {k:'bad',t:'誤答'};
  return {k:'none',t:'未出題'};
}

/* ---------- ルビ ---------- */
function ruby(a,reading){ if(!UI.ruby||!reading)return esc(a); return '<ruby>'+esc(a)+'<rt>'+esc(reading)+'</rt></ruby>'; }

/* ---------- 出題生成 ---------- */
var CAT_INDEX={}; KPS.forEach(function(k){ (CAT_INDEX[k.cat]=CAT_INDEX[k.cat]||[]).push(k); });
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function pickDistractors(kp,format,n){
  var field=format==='A'?'a':'q';
  var correct=kp[field];
  var pool=(CAT_INDEX[kp.cat]||[]).filter(function(x){return x.id!==kp.id;});
  if(pool.length<n) pool=KPS.filter(function(x){return x.id!==kp.id;});
  var out=[],seen={}; seen[correct]=1;
  shuffle(pool).forEach(function(x){ var v=x[field]; if(out.length<n && !seen[v]){ seen[v]=1; out.push({kp:x,text:v}); } });
  if(out.length<n){ // 最終手段：全体から
    shuffle(KPS.filter(function(x){return x.id!==kp.id;})).forEach(function(x){ var v=x[field]; if(out.length<n&&!seen[v]){seen[v]=1;out.push({kp:x,text:v});} });
  }
  return out;
}
function buildQuestion(kp,format){
  var field=format==='A'?'a':'q';
  var correct={kp:kp,text:kp[field]};
  var opts=pickDistractors(kp,format,3).concat([correct]);
  opts=shuffle(opts);
  var correctIndex=opts.indexOf(correct);
  return {kpId:kp.id,format:format,prompt:(format==='A'?kp.q:kp.a),promptReading:(format==='A'?'':kp.reading),
    choices:opts,correctIndex:correctIndex,kp:kp};
}
function kpById(id){ for(var i=0;i<KPS.length;i++)if(KPS[i].id===id)return KPS[i]; return null; }

/* ============================================================
   セッション
   ============================================================ */
var view='gate';
var S=null;

function cloneItems(src){ var o={}; Object.keys(src).forEach(function(k){ o[k]=JSON.parse(JSON.stringify(src[k])); }); return o; }

function startSession(mode,opts){
  opts=opts||{};
  if(!loggedIn()){ view='gate'; render(); return; }
  var p=prog()||{items:{}};
  var work=cloneItems(p.items||{});
  var getIt=function(id){ if(!work[id])work[id]=blankItem(); return work[id]; };
  var peek=function(id){ return work[id]||blankItem(); };   // 読み取り専用（空itemを作らない）

  var queue=[]; var recordMode=mode; var requeue=false; var note='';
  if(mode==='10問'||mode==='20問'){
    requeue=true;
    var N=mode==='10問'?10:20;
    var pool=rangeKPs().filter(function(kp){ return !peek(kp.id).mastered; });
    // seedKpIds（間違いランキングから）
    if(opts.seedKpIds&&opts.seedKpIds.length){
      var seedSet={}; opts.seedKpIds.forEach(function(id){seedSet[id]=1;});
      pool.sort(function(a,b){ return (seedSet[b.id]?1:0)-(seedSet[a.id]?1:0); });
    }
    pool.sort(function(a,b){
      var ia=peek(a.id),ib=peek(b.id);
      if(ib.totalWrong!==ia.totalWrong)return ib.totalWrong-ia.totalWrong;      // 誤答多い順
      var na=ia.lastSeenAt?1:0, nb=ib.lastSeenAt?1:0; if(na!==nb)return na-nb;  // 未出題優先
      return (new Date(ia.lastSeenAt||0))-(new Date(ib.lastSeenAt||0));         // 古い順
    });
    var pick=pool.slice(0,N);
    if(pick.length<N)note='出題できるのは '+pick.length+' 語です（範囲内の未習得がこの数のため）。';
    if(pick.length===0){ toast('この範囲に出題できる語がありません'); return; }
    var firsts=[],seconds=[];
    pick.forEach(function(kp){ var it=peek(kp.id); var f1=it.lastFormat==='A'?'B':'A'; var f2=f1==='A'?'B':'A';
      firsts.push({kpId:kp.id,format:f1}); seconds.push({kpId:kp.id,format:f2}); });
    queue=shuffle(firsts).concat(shuffle(seconds));
  } else if(mode==='全問'){
    recordMode='全問';
    var all=shuffle(rangeKPs());
    if(all.length===0){ toast('この範囲に語がありません'); return; }
    all.forEach(function(kp){ var it=peek(kp.id); var f=it.lastFormat?(it.lastFormat==='A'?'B':'A'):(Math.random()<.5?'A':'B'); queue.push({kpId:kp.id,format:f}); });
  } else if(mode==='再確認'){
    recordMode='再確認'; requeue=true;
    var tgt=rangeKPs().filter(function(kp){ var it=peek(kp.id); return it.mastered&&it.postMasterWrong>=1; });
    if(tgt.length===0){ toast('要注意習得の語はありません'); return; }
    tgt=shuffle(tgt);
    tgt.forEach(function(kp){ var it=peek(kp.id); var f1=it.lastFormat==='A'?'B':'A'; var f2=f1==='A'?'B':'A'; queue.push({kpId:kp.id,format:f1}); queue.push({kpId:kp.id,format:f2}); });
  }

  var startMastered={}; Object.keys(work).forEach(function(k){ if(work[k].mastered)startMastered[k]=1; });
  S={ mode:mode, recordMode:recordMode, items:work, queue:queue, cur:0, requeue:requeue,
      correct:0, wrong:0, answered:[], log:[], snaps:[], appear:{}, maxIdx:-1,
      startedAt:nowISO(), startMastered:startMastered, note:note, viewIdx:null, newlyMastered:{}, needAgain:{} };
  // 初期出現回数
  queue.forEach(function(q){ S.appear[q.kpId]=(S.appear[q.kpId]||0)+1; });
  view='quiz'; render();
}

function snapshot(){ return { items:cloneItems(S.items), queue:JSON.parse(JSON.stringify(S.queue)),
  cur:S.cur, correct:S.correct, wrong:S.wrong, appear:JSON.parse(JSON.stringify(S.appear)),
  newlyMastered:Object.assign({},S.newlyMastered), needAgain:Object.assign({},S.needAgain) }; }
function restore(sn){ S.items=cloneItems(sn.items); S.queue=JSON.parse(JSON.stringify(sn.queue));
  S.cur=sn.cur; S.correct=sn.correct; S.wrong=sn.wrong; S.appear=JSON.parse(JSON.stringify(sn.appear));
  S.newlyMastered=Object.assign({},sn.newlyMastered); S.needAgain=Object.assign({},sn.needAgain); }

function processAnswer(entry,chosenIndex,question){
  var it=S.items[entry.kpId]||(S.items[entry.kpId]=blankItem());
  var correct=chosenIndex===question.correctIndex;
  var prevFormat=it.lastFormat;
  if(S.recordMode==='再確認'){
    // 状態変更は postMasterWrong のみ（§3-3）
    if(!correct){ it.postMasterWrong=(it.postMasterWrong||0)+1; S.wrong++; }
    else { S.correct++; }
  } else {
    it.lastSeenAt=nowISO();
    it.byFormat[entry.format][correct?'correct':'wrong']++;
    if(correct){
      it.totalCorrect++; S.correct++;
      if(it.streak===0) it.streak=1;
      else if(entry.format!==prevFormat) it.streak++;
      // 同形式連続は据え置き
      if(!it.mastered && it.streak>=requiredStreak(it)){ it.mastered=true; it.masteredAt=nowISO(); S.newlyMastered[entry.kpId]=1; }
    } else {
      it.totalWrong++; S.wrong++; it.streak=0;
      it.wrongLog.push({at:nowISO(),format:entry.format,answered:question.choices[chosenIndex].text});
      if(it.wrongLog.length>5)it.wrongLog=it.wrongLog.slice(-5);
      if(it.mastered) it.postMasterWrong=(it.postMasterWrong||0)+1;
    }
    it.lastFormat=entry.format;
  }
  // 復習キュー（§5）
  if(S.requeue){
    var mastered=it.mastered;
    var gap=null;
    if(!correct) gap=3;
    else if(!mastered && S.recordMode!=='再確認') gap=6;
    // 再確認は誤答時のみ再投入（未習得の概念がないため）
    if(S.recordMode==='再確認'){ gap = correct?null:3; }
    if(gap!==null){
      if((S.appear[entry.kpId]||0) >= 4){ S.needAgain[entry.kpId]=1; }
      else {
        var pos=Math.min(S.cur+gap, S.queue.length);
        var nf=entry.format==='A'?'B':'A';
        S.queue.splice(pos,0,{kpId:entry.kpId,format:nf});
        S.appear[entry.kpId]=(S.appear[entry.kpId]||0)+1;
      }
    }
  }
  return correct;
}

function answerChoice(chosenIndex){
  if(S.viewIdx!==null)return; // 閲覧中は無効
  var entry=S.queue[S.cur];
  var question=S.log[S.cur]&&S.log[S.cur].question ? S.log[S.cur].question : buildQuestion(kpById(entry.kpId),entry.format);
  if(S.log[S.cur]&&S.log[S.cur].done)return;
  S.snaps[S.cur]=snapshot();
  var correct=processAnswer(entry,chosenIndex,question);
  S.log[S.cur]={done:true,entry:entry,question:question,chosen:chosenIndex,correct:correct};
  if(S.cur>S.maxIdx)S.maxIdx=S.cur;
  render();
}

function reanswer(chosenIndex){
  // 直前の1問のみ再解答（§6-1）
  var i=S.cur;
  if(!S.snaps[i])return;
  restore(S.snaps[i]);
  var entry=S.log[i].entry, question=S.log[i].question;
  S.snaps[i]=snapshot();
  var correct=processAnswer(entry,chosenIndex,question);
  S.log[i]={done:true,entry:entry,question:question,chosen:chosenIndex,correct:correct};
  render();
}

function nextQuestion(){
  S.viewIdx=null;
  if(S.cur>=S.queue.length-1){ finishSession(); return; }
  S.cur++; render();
}
function goBack(){ // 前の問題へ
  if(S.cur<=0)return;
  S.viewIdx=S.cur-1; render();
}
function goForward(){ S.viewIdx=null; render(); }

function finishSession(){
  // 成績確定（結果画面到達時のみ・§6-2/§11）
  var p=prog(); if(!p){ view='home'; render(); return; }
  // 触れた（記録のある）item だけ残す。空itemは保存しない（§10「値が無いフィールドは省略」）
  var pruned={};
  Object.keys(S.items).forEach(function(k){ var it=S.items[k];
    if(it && (it.totalCorrect||it.totalWrong||it.mastered||it.postMasterWrong||it.lastSeenAt||(it.wrongLog&&it.wrongLog.length)||it.streak)) pruned[k]=it; });
  p.items=pruned;
  var totalMastered=Object.keys(S.items).filter(function(k){return S.items[k].mastered;}).length;
  var wrongKpIds=[]; var seenW={};
  S.log.forEach(function(l){ if(l&&l.done&&!l.correct&&!seenW[l.entry.kpId]){seenW[l.entry.kpId]=1;wrongKpIds.push(l.entry.kpId);} });
  var sess={ startedAt:S.startedAt, finishedAt:nowISO(), mode:S.recordMode,
    correct:S.correct, wrong:S.wrong, newlyMastered:Object.keys(S.newlyMastered),
    wrongKpIds:wrongKpIds, totalMastered:totalMastered };
  p.sessions.push(sess); if(p.sessions.length>100)p.sessions=p.sessions.slice(-100);
  saveDB();
  view='result'; S.result={sess:sess}; render();
  pushCloud(false,'☁✓ 結果を保存しました');
}

function renderQuiz(){
  var app=$('#app'); app.innerHTML='';
  $('#accBtn').textContent='✕ やめる';
  var idx=(S.viewIdx!==null)?S.viewIdx:S.cur;
  var entry=S.queue[idx];
  var kp=kpById(entry.kpId);
  var logged=S.log[idx];
  var question=logged?logged.question:buildQuestion(kp,entry.format);
  if(!logged)S.log[idx]=S.log[idx]||{question:question};

  // 進捗バー
  var tb=el('div','topbar');
  var answeredCount=S.log.filter(function(l){return l&&l.done;}).length;
  var totalQ=S.queue.length;
  var remainKP={}; for(var i=S.cur;i<S.queue.length;i++){ var it=S.items[S.queue[i].kpId]; if(!it||!it.mastered)remainKP[S.queue[i].kpId]=1; }
  var pct=Math.round((Math.min(idx+ (logged&&logged.done?1:0),totalQ))/totalQ*100);
  tb.innerHTML='<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="metar"><span>'+(idx+1)+'問目 / 全'+totalQ+'問</span>'+
    '<span>あと'+Object.keys(remainKP).length+'語</span>'+
    '<span>正解'+S.correct+'・誤答'+S.wrong+'</span></div>';
  app.appendChild(tb);

  var c=el('div','card');
  // 習得ゲージ
  var it=S.items[entry.kpId]||blankItem();
  var need=requiredStreak(it);
  var g=''; for(var k=0;k<need;k++){ g+= (k<it.streak)?'<b>●</b>':'<s>○</s>'; }
  var gauge=el('div'); gauge.style.marginBottom='6px';
  gauge.innerHTML='<span class="gauge">'+g+'</span> <span class="tiny">'+(need>=3?'このことばは苦手なので'+need+'回連続（形式ちがい）で習得':'習得まで'+need+'回連続（形式ちがい）')+'</span>';
  if(S.recordMode==='再確認'){ gauge.innerHTML='<span class="tiny">再確認モード：記録は「要注意」の判定だけ更新されます</span>'; }
  if(S.recordMode==='全問'){ gauge.innerHTML='<span class="tiny">全問モード：実力確認（1語1問）</span>'; }
  c.appendChild(gauge);

  // 出題
  var head=el('div','tiny'); head.innerHTML='形式'+entry.format+'：'+(entry.format==='A'?'つぎの説明にあう<b>ことば</b>は？':'つぎの<b>ことば</b>の説明は？');
  c.appendChild(head);
  var q=el('div','qbox');
  if(entry.format==='A') q.textContent=question.prompt;
  else q.innerHTML=ruby(question.prompt,kp.reading);
  c.appendChild(q);

  // 選択肢
  question.choices.forEach(function(ch,ci){
    var b=el('button','choice');
    if(entry.format==='A') b.innerHTML=ruby(ch.text,ch.kp.reading);
    else b.textContent=ch.text;
    if(logged&&logged.done){
      if(ci===question.correctIndex)b.className='choice ok';
      else if(ci===logged.chosen)b.className='choice ng';
      else b.className='choice dim';
      if(S.viewIdx!==null && idx===S.cur-0 && false){}
      // 直前の1問のみ再解答可
      if(S.viewIdx!==null && idx===S.maxIdx){ b.onclick=(function(x){return function(){reanswer(x);};})(ci); b.style.cursor='pointer'; }
      else if(S.viewIdx===null){ /* 現在の問題で解答済み：クリック不可 */ }
    } else {
      b.onclick=(function(x){return function(){answerChoice(x);};})(ci);
    }
    c.appendChild(b);
  });

  // フィードバック
  if(logged&&logged.done){
    var fb=el('div','fb '+(logged.correct?'ok':'ng'));
    var correctText=question.choices[question.correctIndex].text;
    fb.innerHTML='<div class="lead">'+(logged.correct?'⭕ 正解！':'❌ 不正解')+'</div>'+
      (logged.correct?'':'<div>正解：<b>'+esc(correctText)+'</b></div>')+
      '<div style="margin-top:6px"><b>'+esc(kp.a)+'</b>'+(kp.reading?'（'+esc(kp.reading)+'）':'')+'</div>'+
      '<div class="tiny" style="margin-top:2px">'+esc(kp.q)+'</div>'+
      (kp.kaisetsu?'<div style="margin-top:6px">💡 '+esc(kp.kaisetsu)+'</div>':'');
    c.appendChild(fb);
  }
  app.appendChild(c);

  // ナビ
  var nav=el('div','row'); nav.style.marginTop='4px';
  if(idx>0){ var back=el('button','btn gh','← 前の問題へ'); back.onclick=goBack; if(S.viewIdx!==null){ back.disabled=(idx<=0); } nav.appendChild(back); }
  if(S.viewIdx!==null){
    var fwd=el('button','btn','進む →'); fwd.onclick=goForward; nav.appendChild(fwd);
    if(idx===S.maxIdx){ nav.appendChild(el('div','tiny','この問題だけ、選択肢を押して答え直せます')); }
    else { nav.appendChild(el('div','tiny','（閲覧のみ。答え直せるのは直前の1問だけ）')); }
  } else if(logged&&logged.done){
    var nx=el('button','btn pri', S.cur>=S.queue.length-1?'結果を見る →':'つぎの問題 →'); nx.onclick=nextQuestion; nav.appendChild(nx);
  }
  app.appendChild(nav);
  if(S.note && answeredCount===0)app.appendChild(el('div','tiny',S.note));
}

      var kp=list[Math.max(0,Math.min(LEARN.idx,list.length-1))];
      var it=itemRO(kp.id); var st=stateOf(it);
      var c=el('div','card');
      c.innerHTML='<div class="tiny">'+esc(kp.cat)+(kp.imp?' ・ <span class="imp'+kp.imp+'">'+impMark(kp.imp)+'</span>':'')+' <span class="state s-'+st.k+'">'+st.t+'</span></div>'+
        '<div style="font-size:22px;font-weight:800;margin:8px 0">'+ruby(kp.a,kp.reading)+'</div>'+
        '<div>'+esc(kp.q)+'</div>'+(kp.kaisetsu?'<div class="tiny" style="margin-top:8px">💡 '+esc(kp.kaisetsu)+'</div>':'');
      app.appendChild(c);
      var nav=el('div','row');
      var pv=el('button','btn gh','← 前へ'); pv.disabled=LEARN.idx<=0; pv.onclick=function(){LEARN.idx--;renderLearn();};
      var nx=el('button','btn','次へ →'); nx.disabled=LEARN.idx>=list.length-1; nx.onclick=function(){LEARN.idx++;renderLearn();};
      nav.appendChild(pv); nav.appendChild(nx); nav.appendChild(el('div','tiny',(LEARN.idx+1)+' / '+list.length)); app.appendChild(nav);
    }
  } else {
    var deck=LEARN.deck.filter(function(id){return !LEARN.remember[id];});
    var c=el('div','card'); c.style.textAlign='center'; c.style.minHeight='150px';
    var dirNote=el('div','tiny'); dirNote.style.textAlign='left';
    dirNote.innerHTML='向き：'+(LEARN.dir==='A'?'ことば → 説明':'説明 → ことば');
    var toggle=el('button','btn gh','向きを切りかえる'); toggle.style.marginBottom='8px';
    toggle.onclick=function(){LEARN.dir=LEARN.dir==='A'?'B':'A';LEARN.flip=false;renderLearn();};
    if(!deck.length){
      c.innerHTML='<div style="font-size:18px;font-weight:800;margin:20px 0">🎊 このデッキは終わりました</div>';
      var again=el('button','btn pri','もう一度'); again.onclick=function(){LEARN.deck=shuffle(rangeKPs().map(function(k){return k.id;}));LEARN.remember={};LEARN.flip=false;renderLearn();};
      app.appendChild(el('div',null)); app.appendChild(c); c.appendChild(again); return;
    }
    var kp=kpById(deck[0]);
    var front = LEARN.dir==='A' ? ruby(kp.a,kp.reading) : esc(kp.q);
    var back  = LEARN.dir==='A' ? esc(kp.q) : ruby(kp.a,kp.reading);
    c.innerHTML='<div class="tiny" style="text-align:left">'+esc(kp.cat)+' ・ 残り'+deck.length+'枚</div>'+
      '<div style="font-size:20px;font-weight:800;margin:24px 8px">'+(LEARN.flip?back:front)+'</div>'+
      (LEARN.flip&&kp.kaisetsu?'<div class="tiny">💡 '+esc(kp.kaisetsu)+'</div>':'');
    c.onclick=function(){ LEARN.flip=!LEARN.flip; renderLearn(); };
    app.appendChild(dirNote); app.appendChild(toggle); app.appendChild(c);
    var nav=el('div','grid2'); nav.style.marginTop='8px';
    var no=el('button','btn gh','まだ（後で）'); no.onclick=function(ev){ ev.stopPropagation(); LEARN.deck.push(LEARN.deck.shift()); LEARN.flip=false; renderLearn(); };
    var yes=el('button','btn pri','覚えた'); yes.onclick=function(ev){ ev.stopPropagation(); LEARN.remember[kp.id]=1; LEARN.flip=false; renderLearn(); };
    nav.appendChild(no); nav.appendChild(yes); app.appendChild(nav);
    app.appendChild(el('div','tiny','※「覚えた」は画面上だけの一時状態です。習得記録は変わりません。'));
  }
  var back=el('button','btn gh wide','ホームへもどる'); back.style.marginTop='12px'; back.onclick=function(){ LEARN=null; view='home'; render(); }; app.appendChild(back);
}

/* ============================================================
   一覧・CSV・書き出し／読み込み
   ============================================================ */
var LIST_HEADER=['名前','カテゴリー','記号','知識ポイント','よみがな','重要度','状態','累計正解数','累計誤答数','形式A誤答数','形式B誤答数','過去の誤答内容','最終誤答日','習得日'];
function rowFor(kp,it){
  it=normItem(it); var st=stateOf(it);
  var lastWrong=''; if(it.wrongLog&&it.wrongLog.length){ lastWrong=ymdSlash(it.wrongLog[it.wrongLog.length-1].at); }
  var wl=it.wrongLog?it.wrongLog.map(function(w){return w.answered;}).join('；'):'';
  return [ AUTH?AUTH.id:'', kp.cat, '', kp.a, kp.reading||'', impMark(kp.imp), st.t,
    it.totalCorrect, it.totalWrong, it.byFormat.A.wrong, it.byFormat.B.wrong, wl, lastWrong, ymdSlash(it.masteredAt) ];
}
function buildListRows(){ var p=prog()||{items:{}}; return KPS.map(function(k){ return rowFor(k,p.items[k.id]); }); }

async function exportListToDrive(){
  if(!ready()||!AUTH){ toast('ポータルで同期設定とログインをしてください'); return; }
  setSync('','☁… 一覧を書き出しています');
  // 空上書き防止：先に fetch（§15）
  try{
    var jf=await api({action:'fetch',app:APP,id:AUTH.id,pw:AUTH.pw});
    if(jf&&jf.ok){ var cp=normProgress(((jf.data||{}).progress||{})[AUTH.id]); DB.progress[AUTH.id]=mergeProgress(prog(),cp); saveDB({fromCloud:true}); }
  }catch(e){ setSync('ng','☁⚠ 通信できないため一覧書き出しを中止しました'); return; }
  var p=prog();
  var hasRecord=Object.keys(p.items||{}).some(function(k){ var it=p.items[k]; return it.totalCorrect||it.totalWrong||it.mastered; });
  if(!hasRecord){ setSync('ng','☁⚠ 記録がないため一覧書き出しを中止しました'); toast('まだ記録がありません（空の上書きを防ぎました）'); return; }
  var j; try{ j=await api({app:APP,id:AUTH.id,list:{header:LIST_HEADER,rows:buildListRows()}}); }
  catch(e){ setSync('ng','☁⚠ '+e.message); return; }
  if(j&&j.ok){ SYNC.lastSync=nowISO(); saveSync(); setSync('ok','☁✓ 全問一覧をDriveへ書き出しました'); }
  else { setSync('ng','☁⚠ '+apiError(j||{})); }
}

function downloadCSV(){
  var p=prog()||{items:{}};
  var rows=KPS.map(function(k){ return rowFor(k,p.items[k.id]).concat([AUTH.label||'']); });
  rows.sort(function(a,b){ return (b[8]||0)-(a[8]||0); }); // 誤答数の多い順
  var header=LIST_HEADER.concat(['表示名']);
  var csv=[header].concat(rows).map(function(r){ return r.map(function(c){ c=String(c==null?'':c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\r\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  dl(blob, TOOL+'結果_'+AUTH.id+'_'+ymd()+'.csv');
}
function exportJSON(){
  var out={app:APP,version:2,exportedAt:nowISO(),id:AUTH.id,account:DB.accounts[0],progress:prog()};
  var blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  dl(blob, TOOL+'記録_'+AUTH.id+'_'+ymd()+'.json');
}
function dl(blob,name){ var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1000); }

function openImport(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){ var f=inp.files[0]; if(!f)return; var rd=new FileReader();
    rd.onload=function(){ var raw=jparse(rd.result);
      if(!raw||raw.app!==APP){ toastModal('読み込めません','このツール（'+APP+'）の記録ファイルではありません。'); return; }
      var pr=(raw.progress||{}); var p=pr.items?pr:(pr[AUTH.id]||null);
      if(!p){ toastModal('このIDの記録がありません','このファイルには ID '+AUTH.id+' の記録が入っていません（別のお子さんの記録の可能性があります）。'); return; }
      showModal('記録を読み込みますか？','いまの記録は置きかえられます（読み込み後にクラウドへ送信されます）。',[
        {t:'やめる',cls:'gh',fn:closeModal},
        {t:'置きかえる',cls:'pri',fn:function(){ closeModal(); DB.progress[AUTH.id]=normProgress(p); saveDB(); render(); pushCloud(true); toast('読み込みました'); }}
      ]);
    }; rd.readAsText(f); };
  inp.click();
}
function resetRecords(){
  showModal('このツールの記録を消しますか？','この端末の '+TOOL+' の学習記録（ID '+AUTH.id+'）が消えます。クラウドにも空の記録が送られます。もとに戻せません。',[
    {t:'やめる',cls:'gh',fn:closeModal},
    {t:'消す',cls:'pri',fn:function(){ closeModal(); DB.progress[AUTH.id]={items:{},sessions:[]}; saveDB(); render(); pushCloud(true); toast('記録を消しました'); }}
  ]);
}

/* ---------- モーダル・トースト ---------- */
function showModal(title,body,btns){
  closeModal();
  var ov=el('div','overlay'); ov.id='ovl';
  var m=el('div','modal'); m.innerHTML='<h3>'+esc(title)+'</h3><p class="muted">'+esc(body)+'</p>';
  var row=el('div','row'); row.style.justifyContent='flex-end';
  (btns||[]).forEach(function(b){ var bt=el('button','btn '+(b.cls||''),b.t); bt.onclick=b.fn; row.appendChild(bt); });
  m.appendChild(row); ov.appendChild(m); document.body.appendChild(ov);
  ov.onclick=function(e){ if(e.target===ov)closeModal(); };
}
function toastModal(t,b){ showModal(t,b,[{t:'とじる',cls:'pri',fn:closeModal}]); }
function closeModal(){ var o=$('#ovl'); if(o)o.remove(); }
var flashTimer=null;
function toast(msg){ var f=$('#flash'); f.textContent=msg; f.className='flash on'; clearTimeout(flashTimer); flashTimer=setTimeout(function(){f.className='flash';},1800); }

/* ---------- ヘッダー 👤 ---------- */
$('#accBtn').onclick=function(){
  if(view==='quiz'){ if(S&&S.log.some(function(l){return l&&l.done;}))leaveQuiz(); else { S=null; view='home'; render(); } return; }
  if(view==='learn'){ LEARN=null; view='home'; render(); return; }
  if(view==='result'){ S=null; view='home'; render(); return; }
  if(loggedIn())location.href=portalURL();
};

/* ---------- 起動 ---------- */
loadAll();
if(ready()&&loggedIn())setSync('','☁… クラウドと同期しています');
render();
if(ready()&&loggedIn())pullCloud(true);
window.addEventListener('storage',function(ev){
  if(ev.key!=='kj-quiz:auth'&&ev.key!=='kj-quiz:sync')return;
  if(view==='quiz'&&S&&S.log.some(function(l){return l&&l.done;}))return;
  loadAll(); render();
});
</script>
