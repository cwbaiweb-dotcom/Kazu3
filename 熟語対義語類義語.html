<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>熟語クイズ｜中学受験</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1d2530; --sub:#5b6875; --line:#dde3ea;
  --accent:#2f6bd8; --accent-d:#1f4ea8; --ok:#1c8a4a; --ng:#c62d3c;
  --warn:#c77700; --mast:#2f6bd8; --half:#8fb4ee; --none:#e3e8ef;
  --r:14px; --shadow:0 1px 3px rgba(20,30,50,.08),0 6px 18px rgba(20,30,50,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 48px}
h1{font-size:1.25rem;margin:.2em 0 .1em}
h2{font-size:1.05rem;margin:1.4em 0 .5em;padding-left:.5em;border-left:4px solid var(--accent)}
h3{font-size:.95rem;margin:1.1em 0 .4em;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.muted{color:var(--sub);font-size:.85rem}
.center{text-align:center}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px;min-height:48px;transition:.12s}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:default}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent-d)}
.btn-s{background:#eef3fb;border-color:#cfdcf4;color:var(--accent-d)}
.btn-d{background:#fff;border-color:#e6bcc1;color:var(--ng)}
.btn-sm{padding:8px 12px;min-height:40px;font-size:.85rem;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=url],input[type=password],select{
  font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink);min-height:46px}
label.fld{display:block;margin:10px 0 0;font-size:.85rem;color:var(--sub);font-weight:600}
/* 状態バー */
#syncBar{position:sticky;top:0;z-index:40;font-size:.82rem;padding:7px 12px;border-radius:0 0 10px 10px;background:#eef3fb;color:var(--accent-d);border:1px solid #cfdcf4;border-top:none;display:none}
#syncBar.ok{background:#e8f6ee;color:#146b39;border-color:#bfe3cd}
#syncBar.err{background:#fdecee;color:#a3232f;border-color:#f2c3c8}
#syncBar.busy{background:#eef3fb;color:var(--accent-d)}
#warnBar{display:none;font-size:.82rem;padding:8px 12px;background:#fff6e5;color:#8a5600;border:1px solid #f0dcb4;border-radius:10px;margin:8px 0}
/* アカウント */
.acc-pill{display:inline-flex;align-items:center;gap:6px;background:#eef3fb;border:1px solid #cfdcf4;color:var(--accent-d);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.acc-item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff}
.acc-item.active{border-color:var(--accent);background:#f5f9ff}
.acc-item .nm{flex:1;font-weight:700}
/* 習得バー */
.mbar{height:12px;border-radius:6px;background:var(--none);overflow:hidden;display:flex;margin:4px 0}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--mast)} .mbar .h{background:var(--half)}
.mrow{margin:10px 0}
.mrow .hd{display:flex;justify-content:space-between;font-size:.85rem;gap:8px}
.mrow .hd b{font-weight:700}
/* カテゴリ選択 */
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff;cursor:pointer}
.chk.on{border-color:var(--accent);background:#f5f9ff}
.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
.chk .t{flex:1}
.chk .t b{display:block}
/* 出題 */
.qhead{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.pbar{height:8px;background:var(--none);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--sub);margin-top:6px}
.qmeta .ok{color:var(--ok);font-weight:700}
.qmeta .ng{color:var(--ng);font-weight:700}
.gauge{letter-spacing:2px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 14px;margin:12px 0;text-align:center;box-shadow:var(--shadow)}
.qlabel{font-size:.78rem;color:var(--sub);font-weight:700;letter-spacing:.05em}
.qword{font-size:2.1rem;font-weight:800;letter-spacing:.08em;margin:.25em 0 .1em;line-height:1.4}
.qword.small{font-size:1.25rem;font-weight:700;letter-spacing:.02em;line-height:1.6}
.qword ruby rt{font-size:.4em;font-weight:600;color:var(--sub)}
.qask{font-size:.92rem;color:var(--sub);margin-top:.4em}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;line-height:1.6;border:1px solid var(--line);background:#fff;font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt .n{display:inline-block;min-width:1.6em;color:var(--sub);font-weight:800}
.opt.correct{background:#e8f6ee;border-color:var(--ok);color:#0f5c30}
.opt.wrong{background:#fdecee;border-color:var(--ng);color:#8f1f2a}
.opt.dim{opacity:.5}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0;border:1px solid}
.fb.ok{background:#e8f6ee;border-color:#bfe3cd}
.fb.ng{background:#fdecee;border-color:#f2c3c8}
.fb .hd{font-weight:800;margin-bottom:4px}
.fb.ok .hd{color:#146b39} .fb.ng .hd{color:#a3232f}
.fb .ex{font-size:.9rem;line-height:1.75}
.fb .ex b{color:var(--ink)}
.navrow{display:flex;gap:8px;margin-top:10px}
.navrow button{flex:1}
.reviewmark{background:#fff6e5;border:1px solid #f0dcb4;color:#8a5600;border-radius:10px;padding:8px 12px;font-size:.85rem;margin:8px 0}
/* 結果 */
.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.scoregrid div{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.scoregrid b{display:block;font-size:1.4rem;line-height:1.2}
.scoregrid span{font-size:.72rem;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-size:.78rem;white-space:nowrap;cursor:pointer;user-select:none}
tr.hot td{background:#fff6e5}
.badge{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.b-m{background:#e8f6ee;color:#146b39} .b-c{background:#eef3fb;color:var(--accent-d)}
.b-n{background:#f0f2f5;color:var(--sub)} .b-w{background:#fdecee;color:#a3232f}
.b-hot{background:#ffe9c2;color:#8a5600;margin-left:4px}
.kpdetail{background:#f7f9fc;border-left:3px solid var(--accent);padding:8px 10px;margin:4px 0 8px;font-size:.82rem;border-radius:0 8px 8px 0}
/* モーダル */
.mask{position:fixed;inset:0;background:rgba(15,22,35,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin-top:0;color:var(--ink);font-size:1.05rem}
.hide{display:none!important}
.sep{height:1px;background:var(--line);margin:14px 0}
.tiny{font-size:.78rem;color:var(--sub);line-height:1.6}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.filters select{width:auto;flex:1 1 140px;min-height:42px;padding:8px 10px}
@media(max-width:400px){.scoregrid{grid-template-columns:repeat(2,1fr)}.qword{font-size:1.8rem}}
</style>
</head>
<body>
<div id="syncBar"></div>
<div class="wrap">
  <div id="warnBar"></div>
  <div id="app"></div>
</div>
<div id="modalRoot"></div>
<script>
/* ===== 出題データ（熟語.pdf より抽出） ===== */
const DATA = {"niji":[{"word":"勝負","yomi":"しょうぶ","meaning":"勝ちと負け。勝ち負けを争うこと","kata":"ウ","kataName":"反対の意味の漢字を組み合わせたもの","level":"A","src":"1-A1-1"},{"word":"行進","yomi":"こうしん","meaning":"列を作って前へ進んで行くこと","kata":"イ","kataName":"意味の似た漢字を重ねたもの","level":"A","src":"1-A1-2"},{"word":"青葉","yomi":"あおば","meaning":"青々としげった木の葉","kata":"オ","kataName":"上の漢字が下の漢字を修飾するもの","level":"A","src":"1-A1-3"},{"word":"雷鳴","yomi":"らいめい","meaning":"かみなりが鳴ること。またその音","kata":"エ","kataName":"上が主語で下が述語の関係にあるもの","level":"A","src":"1-A1-4"},{"word":"長短","yomi":"ちょうたん","meaning":"長いことと短いこと。長所と短所","kata":"ウ","kataName":"反対の意味の漢字を組み合わせたもの","level":"A","src":"1-A1-5"},{"word":"着席","yomi":"ちゃくせき","meaning":"席に着くこと。座ること","kata":"カ","kataName":"上が動作で下がその目的・対象を表すもの","level":"A","src":"1-A1-6,4-A-2エ"},{"word":"水害","yomi":"すいがい","meaning":"大水によって受ける災害","kata":"オ","kataName":"上の漢字が下の漢字を修飾するもの","level":"A","src":"1-A1-7"},{"word":"不便","yomi":"ふべん","meaning":"都合が悪く使いにくいこと","kata":"キ","kataName":"「不・無・非・未」がついて打ち消すもの","level":"A","src":"1-A1-8"},{"word":"運送","yomi":"うんそう","meaning":"荷物などを運び送ること","kata":"イ","kataName":"意味の似た漢字を重ねたもの","level":"A","src":"1-A1-9"},{"word":"消火","yomi":"しょうか","meaning":"火事の火を消すこと","kata":"カ","kataName":"上が動作で下がその目的・対象を表すもの","level":"A","src":"1-A1-10"},{"word":"代々","yomi":"だいだい","meaning":"何代も続いて。代が変わってもずっと","kata":"ア","kataName":"同じ漢字を重ねたもの","level":"A","src":"1-A1-11"},{"word":"知的","yomi":"ちてき","meaning":"知識や知性が感じられるようす","kata":"ク","kataName":"下に「的・性・然・化」がついたもの","level":"A","src":"1-A1-12,3-A-18,4-A-6オ"},{"word":"日没","yomi":"にちぼつ","meaning":"太陽が沈むこと。日の入り","kata":"エ","kataName":"上が主語で下が述語の関係にあるもの","level":"A","src":"1-A1-13"},{"word":"労組","yomi":"ろうそ","meaning":"労働組合の略。働く人がつくる団体","kata":"ケ","kataName":"長い語句を簡略化した略語","level":"A","src":"1-A1-14"},{"word":"学習","yomi":"がくしゅう","meaning":"学び習うこと。勉強すること","kata":"イ","kataName":"意味の似た漢字を重ねたもの","level":"A","src":"1-A1-15"},{"word":"国体","yomi":"こくたい","meaning":"国民体育大会の略","kata":"ケ","kataName":"長い語句を簡略化した略語","level":"A","src":"1-A1-16"},{"word":"暗室", e":"人柄がおだやかで角が立たないこと","level":"B","src":"B-8"},{"word":"効能","yomi":"こうのう","synonym":"効用","synonymYomi":"こうよう","note":"ききめ・役に立つはたらき","level":"B","src":"B-9"},{"word":"情勢","yomi":"じょうせい","synonym":"形勢","synonymYomi":"けいせい","note":"移り変わっていく物事のようす","level":"B","src":"B-10"},{"word":"公務","yomi":"こうむ","synonym":"公用","synonymYomi":"こうよう","note":"役所や公の仕事","level":"B","src":"B-11"},{"word":"所有","yomi":"しょゆう","synonym":"所持","synonymYomi":"しょじ","altSynonyms":["保持"],"altSynonymYomi":["ほじ"],"note":"自分のものとして持っていること","level":"B","src":"B-12"},{"word":"返事","yomi":"へんじ","synonym":"応答","synonymYomi":"おうとう","note":"呼びかけや問いに答えること","level":"B","src":"B-13"},{"word":"風格","yomi":"ふうかく","synonym":"格調","synonymYomi":"かくちょう","note":"人や作品にそなわる品位","level":"B","src":"B-14"},{"word":"事前","yomi":"じぜん","synonym":"未然","synonymYomi":"みぜん","note":"物事がまだ起こらないうち","level":"B","src":"B-15"},{"word":"貧乏","yomi":"びんぼう","synonym":"貧困","synonymYomi":"ひんこん","note":"財産がなく生活が苦しいこと","level":"B","src":"B-16"},{"word":"進展","yomi":"しんてん","synonym":"発展","synonymYomi":"はってん","note":"物事が進んで広がっていくこと","level":"B","src":"B-17"},{"word":"倹約","yomi":"けんやく","synonym":"節約","synonymYomi":"せつやく","note":"むだを省いて費用を切りつめること","level":"B","src":"B-18"},{"word":"欠乏","yomi":"けつぼう","synonym":"不足","synonymYomi":"ふそく","note":"必要な分が足りないこと","level":"B","src":"B-19"},{"word":"口調","yomi":"くちょう","synonym":"語調","synonymYomi":"ごちょう","note":"ものの言い方の調子","level":"B","src":"B-20"},{"word":"留学","yomi":"りゅうがく","synonym":"遊学","synonymYomi":"ゆうがく","note":"よその土地や外国へ行って学ぶこと","level":"B","src":"B-21"},{"word":"特殊","yomi":"とくしゅ","synonym":"特別","synonymYomi":"とくべつ","note":"ふつうとはちがっていること","level":"B","src":"B-22"},{"word":"留守","yomi":"るす","synonym":"不在","synonymYomi":"ふざい","note":"その場や家にいないこと","level":"B","src":"B-23"},{"word":"給料","yomi":"きゅうりょう","synonym":"給与","synonymYomi":"きゅうよ","altSynonyms":["賃金"],"altSynonymYomi":["ちんぎん"],"note":"働いた対価として支払われるお金","level":"B","src":"B-24"},{"word":"感心","yomi":"かんしん","synonym":"感服","synonymYomi":"かんぷく","note":"立派さに深く心を動 <script>
/* ============================================================
   熟語クイズ  —  共通仕様書 v1.0 ＋ 追補 v1.1（クラウド同期編）準拠
   ============================================================ */
'use strict';

const APP        = 'kj-quiz-kokugo-jukugo';   // 追補§1 ツール識別子（変更しないこと）
const APP_TITLE  = '熟語';
const SCHEMA_VER = 1;
const MASTERY_STREAK = 2;                     // v1.0 §3 要確認① 既定値2
const WRONGLOG_MAX   = 20;                    // v1.0 §9-1
const REQUEUE_WRONG  = 3;                     // v1.0 §4
const REQUEUE_UNMAST = 6;
const MAX_REPEAT     = 4;                     // 1セッション内の同一KP再出題上限
const SYNC_LSKEY = APP + ':sync';             // 追補§2（同期対象に含めない）

/* ---------- カテゴリー定義 ---------- */
const CATS = [
  {id:'niji',  name:'二字熟語', short:'二字', fa:'熟語 → 意味',   fb:'意味 → 熟語',   kind:'mean'},
  {id:'sanji', name:'三字熟語', short:'三字', fa:'熟語 → 意味',   fb:'意味 → 熟語',   kind:'mean'},
  {id:'yoji',  name:'四字熟語', short:'四字', fa:'熟語 → 意味',   fb:'意味 → 熟語',   kind:'mean'},
  {id:'taigi', name:'対義語',   short:'対義', fa:'語 → 対義語',   fb:'対義語 → 語',   kind:'pair', rel:'⇔'},
  {id:'ruigi', name:'類義語',   short:'類義', fa:'語 → 類義語',   fb:'類義語 → 語',   kind:'pair', rel:'≒'},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));

/* ---------- KP（知識ポイント）の構築 ---------- */
const KPS = [];
function pushKP(o){ KPS.push(o); }
(function buildKPs(){
  (DATA.niji||[]).forEach(d=>pushKP({
    id:'kp_niji_'+d.word, cat:'niji', level:d.level, mark:d.kata||'',
    front:d.word, frontYomi:d.yomi||'', back:d.meaning, backYomi:'',
    extra:d.kata?('組み立ての型：'+d.kata+'　'+(d.kataName||'')):''
  }));
  (DATA.sanji||[]).forEach(d=>pushKP({
    id:'kp_sanji_'+d.word, cat:'sanji', level:d.level, mark:d.kata||'',
    front:d.word, frontYomi:d.yomi||'', back:d.meaning, backYomi:'',
    extra:d.kata?('組み立ての型：'+d.kata+'　'+(d.kataName||'')):''
  }));
  (DATA.yoji||[]).forEach(d=>pushKP({
    id:'kp_yoji_'+d.word, cat:'yoji', level:d.level, mark:'',
    front:d.word, frontYomi:d.yomi||'', back:d.meaning, backYomi:'', extra:''
  }));
  (DATA.taigi||[]).forEach(d=>pushKP({
    id:'kp_taigi_'+d.word, cat:'taigi', level:d.level, mark:'',
    front:d.word, frontYomi:d.yomi||'', back:d.antonym, backYomi:d.antonymYomi||'',
    alts:d.altAntonyms||[], extra:d.note||''
  }));
  (DATA.ruigi||[]).forEach(d=>pushKP({
    id:'kp_ruigi_'+d.word, cat:'ruigi', level:d.level, mark:'',
    front:d.word, frontYomi:d.yomi||'', back:d.synonym, backYomi:d.synonymYomi||'',
    alts:d.altSynonyms||[], extra:d.note||''
  }));
})();
const KPMAP = Object.fromEntries(KPS.map(k=>[k.id,k]));
const KP_BY_CAT = {}; CATS.forEach(c=>KP_BY_CAT[c.id]=KPS.filter(k=>k.cat===c.id));

/* ============================================================
   保存レイヤ（v1.0 §9 ／ 追補§2）
   ============================================================ */
let LS_OK = true;
let memStore = {};
function lsGet(k){
  try{ return localStorage.getItem(k); }catch(e){ LS_OK=false; return (k in memStore)?memStore[k]:null; }
}
function lsSet(k,v){
  try{ localStorage.setItem(k,v); }catch(e){ LS_OK=false; memStore[k]=v; }
}
(function probeLS(){
  try{ localStorage.setItem(APP+':probe','1'); localStorage.removeItem(APP+':probe'); }
  catch(e){ LS_OK=false; }
})();

function newDB(){
  return {app:APP, version:SCHEMA_VER, activeAccountId:null, accounts:[], progress:{}, updatedAt:null};
}
function migrate(d){
  if(!d || typeof d!=='object') return newDB();
  d.app = APP;
  if(typeof d.version!=='number') d.version = SCHEMA_VER;
  if(d.version < SCHEMA_VER){ d.version = SCHEMA_VER; }   // 将来のマイグレーション挿入点
  d.accounts = Array.isArray(d.accounts)?d.accounts:[];
  d.progress = (d.progress && typeof d.progress==='object')?d.progress:{};
  d.accounts.forEach(a=>{
    if(!d.progress[a.id]) d.progress[a.id] = {items:{}, sessions:[]};
    if(!d.progress[a.id].items) d.progress[a.id].items = {};
    if(!Array.isArray(d.progress[a.id].sessions)) d.progress[a.id].sessions = [];
  });
  if(d.activeAccountId && !d.accounts.some(a=>a.id===d.activeAccountId)) d.activeAccountId=null;
  return d;
}
let db = newDB();
function loadDB(){
  const raw = lsGet(APP);
  if(!raw){ db = newDB(); return; }
  try{ db = migrate(JSON.parse(raw)); }catch(e){ db = newDB(); }
}
/* 追補§2: 保存のたびに updatedAt を更新（クラウド取り込み時は上書きしない） */
function saveDB(keepUpdatedAt){
  if(!keepUpdatedAt) db.updatedAt = new Date().toISOString();
  db.app = APP;
  try{ lsSet(APP, JSON.stringify(db)); }catch(e){}
}
function newItem(){
  return {streak:0, mastered:false, masteredAt:null, lastFormat:null,
          totalCorrect:0, totalWrong:0,
          byFormat:{A:{correct:0,wrong:0}, B:{correct:0,wrong:0}},
          wrongLog:[], lastSeenAt:null};
}
function accProg(accId){
  if(!db.progress[accId]) db.progress[accId] = {items:{}, sessions:[]};
  return db.progress[accId];
}
function getItem(accId,kpId){
  const p = accProg(accId);
  if(!p.items[kpId]) p.items[kpId] = newItem();
  const it = p.items[kpId];
  if(!it.byFormat) it.byFormat = {A:{correct:0,wrong:0},B:{correct:0,wrong:0}};
  if(!it.wrongLog) it.wrongLog = [];
  return it;
}
function activeAcc(){ return db.accounts.find(a=>a.id===db.activeAccountId)||null; }

/* 追補§5-1: 記録の有無判定 */
function dbHasRecords(d){
  if(!d || !d.progress) return false;
  for(const aid in d.progress){
    const p = d.progress[aid]; if(!p) continue;
    if(Array.isArray(p.sessions) && p.sessions.length>0) return true;
    const items = p.items||{};
    for(const k in items){
      const it = items[k];
      if(((it.totalCorrect|0)+(it.totalWrong|0))>0) return true;
    }
  }
  return false;
}

/* ============================================================
   同期（追補§4 API契約 — サーバー側は変更不可）
   ============================================================ */
let syncCfg = null;   // {url,key,lastSync}
function loadSyncCfg(){
  try{ const r = lsGet(SYNC_LSKEY); syncCfg = r?JSON.parse(r):null; }catch(e){ syncCfg=null; }
  if(syncCfg && !syncCfg.url) syncCfg=null;
}
function saveSyncCfg(){
  if(syncCfg) lsSet(SYNC_LSKEY, JSON.stringify(syncCfg));
  else { try{ localStorage.removeItem(SYNC_LSKEY); }catch(e){ delete memStore[SYNC_LSKEY]; } }
}
function syncEnabled(){ return !!(syncCfg && syncCfg.url && syncCfg.key); }

const GAS_BAD = 'GASの応答が不正です。GASのコードを最新版に貼り替え、「デプロイを管理→新バージョン」で更新してください';
function setBar(state,msg){
  const el = document.getElementById('syncBar');
  if(!syncEnabled() && state!=='force'){ el.style.display='none'; return; }
  el.style.display='block';
  el.className = state==='ok'?'ok':state==='err'?'err':'busy';
  const ls = (syncCfg&&syncCfg.lastSync)?('｜最終同期 '+fmtDT(syncCfg.lastSync)):'';
  const icon = state==='ok'?'☁✓':state==='err'?'☁⚠':'☁…';
  el.textContent = icon+' '+msg+ls;
}
async function gasFetch(opt){
  let res, txt;
  try{
    res = await fetch(opt.url, opt.init);
    txt = await res.text();
  }catch(e){ const err=new Error('offline'); err.kind='offline'; throw err; }
  let j;
  try{ j = JSON.parse(txt); }catch(e){ const err=new Error(GAS_BAD); err.kind='gas'; throw err; }
  if(!j || typeof j!=='object'){ const err=new Error(GAS_BAD); err.kind='gas'; throw err; }
  return j;
}
function syncErrMsg(e){
  if(e && e.kind==='offline') return 'オフライン（ローカルには保存済み）';
  return (e&&e.message)?e.message:'同期エラー';
}
/* 追補§4-2 記録の保存(push) */
async function syncPush(silent){
  if(!syncEnabled()) return {ok:false};
  if(!silent) setBar('busy','クラウドに保存中');
  try{
    const j = await gasFetch({url:syncCfg.url, init:{
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({key:syncCfg.key, data:db})
    }});
    if(j.ok){ syncCfg.lastSync=new Date().toISOString(); saveSyncCfg(); setBar('ok','クラウド保存ずみ'); return {ok:true}; }
    setBar('err', j.error||'保存に失敗しました'); return {ok:false,error:j.error};
  }catch(e){ setBar('err', syncErrMsg(e)); return {ok:false,error:syncErrMsg(e)}; }
}
/* 追補§4-1 記録の取得(pull) ＋ §5 勝敗ルール */
async function syncPull(silent){
  if(!syncEnabled()) return {ok:false};
  if(!silent) setBar('busy','クラウドと同期中');
  let j;
  try{
    j = await gasFetch({url: syncCfg.url+(syncCfg.url.includes('?')?'&':'?')
        +'key='+encodeURIComponent(syncCfg.key)+'&app='+encodeURIComponent(APP), init:{method:'GET'}});
  }catch(e){ setBar('err', syncErrMsg(e)); return {ok:false,error:syncErrMsg(e)}; }
  if(!j.ok){ setBar('err', j.error||'取得に失敗しました'); return {ok:false,error:j.error}; }

  const cloud = j.data ? migrate(j.data) : null;
  syncCfg.lastSync = new Date().toISOString(); saveSyncCfg();

  if(!cloud){                                        // §5-5 クラウドが空 → push
    const r = await syncPush(true);
    setBar(r.ok?'ok':'err', r.ok?'クラウドに初回保存しました':(r.error||'保存に失敗しました'));
    return {ok:true, action:'push'};
  }
  const lh = dbHasRecords(db), ch = dbHasRecords(cloud);
  let adopt = false;
  if(!lh && ch)      adopt = true;                   // §5-2 無条件でクラウド採用
  else if(lh && !ch) adopt = false;                  // §5-2 逆なら無条件push
  else if(lh && ch)  adopt = (new Date(cloud.updatedAt||0) > new Date(db.updatedAt||0)); // §5-3
  else               adopt = true;                   // 両方とも記録なし → クラウドに寄せる

  if(adopt){
    const merged = mergeLocalOnlyAccounts(cloud, db);  // §5-4 アカウント合流
    const prevActiveName = (activeAcc()||{}).name;
    db = merged.db;
    if(prevActiveName){
      const hit = db.accounts.find(a=>a.name===prevActiveName);
      if(hit) db.activeAccountId = hit.id;
    }
    if(!db.activeAccountId && db.accounts[0]) db.activeAccountId = db.accounts[0].id;
    // 追補§2 取り込みだけなら updatedAt を上書きしない。
    // ただし §5-4 の合流が起きたときは「この端末で内容が増えた」ので updatedAt を進める
    // （進めないと、合流結果を他端末が古いデータとみなして上書きしてしまう）
    saveDB(!merged.merged);
    if(merged.merged){ await syncPush(true); setBar('ok','クラウドの記録と合流しました'); }
    else setBar('ok','クラウドの記録を取り込みました');
    return {ok:true, action:'adopt'};
  }else{
    const r = await syncPush(true);
    setBar(r.ok?'ok':'err', r.ok?'この端末の記録をクラウドに保存しました':(r.error||'保存に失敗しました'));
    return {ok:true, action:'push'};
  }
}
/* §5-4 ローカルにしかないアカウント（名前で判定）を消さずに合流 */
function mergeLocalOnlyAccounts(cloud, local){
  let merged = false;
  const names = new Set(cloud.accounts.map(a=>a.name));
  local.accounts.forEach(a=>{
    if(names.has(a.name)) return;
    let id = a.id;
    while(cloud.accounts.some(x=>x.id===id)) id = 'acc_'+Math.random().toString(36).slice(2,9);
    cloud.accounts.push({id, name:a.name, createdAt:a.createdAt});
    cloud.progress[id] = local.progress[a.id] || {items:{}, sessions:[]};
    merged = true;
  });
  return {db:cloud, merged};
}
/* 追補§4-3 全問一覧の書き出し */
async function syncPushList(rows, header){

  try{
    const j = await gasFetch({url:syncCfg.url, init:{

/* ============================================================
   ユーティリティ
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return n<10?'0'+n:''+n; }
function fmtDT(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtD(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function fmtFile(){ const d=new Date(); return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function ruby(word, yomi){
  if(!yomi) return esc(word);
  return '<ruby>'+esc(word)+'<rt>'+esc(yomi)+'</rt></ruby>';
}
function stateOf(it){
  if(!it || (it.totalCorrect|0)+(it.totalWrong|0)===0) return {t:'未出題', cls:'b-n'};
  if(it.mastered) return {t:'習得済み', cls:'b-m'};
  if((it.streak|0)>0) return {t:it.streak+'回正解', cls:'b-c'};
  return {t:'誤答', cls:'b-w'};
}

/* ============================================================
   出題生成
   ============================================================ */
function qText(kp, fmt){
  const c = CAT[kp.cat];
  if(c.kind==='mean'){
    return fmt==='A'
      ? {label:c.name+'　'+c.fa, word:kp.front, yomi:kp.frontYomi, big:true,  ask:'この熟語の意味は？'}
      : {label:c.name+'　'+c.fb, word:kp.back,  yomi:'',            big:false, ask:'この意味を表す'+c.name+'は？'};
  }
  const rel = c.id==='taigi'?'対義語':'類義語';
  return fmt==='A'
    ? {label:c.name+'　'+c.fa, word:kp.front, yomi:kp.frontYomi, big:true, ask:'この語の'+rel+'は？'}
    : {label:c.name+'　'+c.fb, word:kp.back,  yomi:kp.backYomi,   big:true, ask:'この語の'+rel+'は？'};
}
function answerOf(kp, fmt){ return fmt==='A' ? kp.back : kp.front; }
function makeChoices(kp, fmt){
  const correct = answerOf(kp, fmt);
  const pool = KP_BY_CAT[kp.cat].filter(k=>k.id!==kp.id);
  const same = shuffle(pool.filter(k=>k.level===kp.level));
  const rest = shuffle(pool.filter(k=>k.level!==kp.level));
  const bad = new Set([correct]);
  if(kp.alts) kp.alts.forEach(a=>bad.add(a));
  const out=[];
  for(const k of same.concat(rest)){
    const v = answerOf(k, fmt);
    if(bad.has(v)) continue;
    bad.add(v); out.push(v);
    if(out.length===3) break;
  }
  return shuffle(out.concat([correct]));
}
function isCorrect(kp, fmt, picked){
  if(picked===answerOf(kp,fmt)) return true;
  if(fmt==='A' && kp.alts && kp.alts.includes(picked)) return true;   // 併記解答も正解扱い
  return false;
}
function explainOf(kp){
  const c = CAT[kp.cat];
  let s;
  if(c.kind==='mean'){
    s = '<b>'+ruby(kp.front, kp.frontYomi)+'</b>　'+esc(kp.back);
  }else{
    s = '<b>'+ruby(kp.front,kp.frontYomi)+'</b> '+c.rel+' <b>'+ruby(kp.back,kp.backYomi)+'</b>';
    if(kp.alts && kp.alts.length) s += '　（'+esc(kp.alts.join('・'))+' も可）';
  }
  if(kp.extra) s += '<br><span class="muted">'+esc(kp.extra)+'</span>';
  return s;
}
/* ============================================================
   セッション（v1.0 §2 出題モード／§3 習得判定／§4 復習キュー／§5 ナビ）
   ============================================================ */
let S = null;

function pickKPs(catIds, levels, n, mode, onlyIds){
  let pool = KPS.filter(k=>catIds.includes(k.cat) && levels.includes(k.level));
  if(onlyIds) pool = pool.filter(k=>onlyIds.includes(k.id));
  const acc = db.activeAccountId;
  if(mode==='all') return shuffle(pool).map(k=>k.id);
  // 習得済みを除外
  const cand = pool.filter(k=>!(accProg(acc).items[k.id]||{}).mastered);
  const now = Date.now();
  const scored = cand.map(k=>{
    const it = accProg(acc).items[k.id]||{};
    const wrong = it.totalWrong|0;
    const unseen = ((it.totalCorrect|0)+(it.totalWrong|0))===0;
    const since = it.lastSeenAt ? (now-new Date(it.lastSeenAt).getTime())/86400000 : 9999;
    // 優先順位: ①誤答回数が多い ②未出題 ③最終出題からの経過が長い
    return {id:k.id, s: wrong*1000 + (unseen?500:0) + Math.min(since,365), r:Math.random()};
  });
  scored.sort((a,b)=> (b.s-a.s) || (a.r-b.r));
  return scored.slice(0, n).map(x=>x.id);
}
function initialFormat(kpId){
  const it = accProg(db.activeAccountId).items[kpId];
  if(it && it.lastFormat) return it.lastFormat==='A'?'B':'A';
  return Math.random()<.5?'A':'B';
}
function startSession(opt){
  const acc = db.activeAccountId;
  const n = opt.mode==='10q'?10 : opt.mode==='20q'?20 : Infinity;
  const kpIds = pickKPs(opt.cats, opt.levels, n, opt.mode, opt.onlyIds);
  if(!kpIds.length) return null;
  const base = {};
  kpIds.forEach(id=>{
    const it = accProg(acc).items[id]||newItem();
    base[id] = {streak:it.streak|0, mastered:!!it.mastered, lastFormat:it.lastFormat||null,
                lastCorrectFormat:(it.streak|0)>0?(it.lastFormat||null):null};
  });
  const q = kpIds.map(id=>({kpId:id, fmt:initialFormat(id), req:false, src:-1}));
  S = {
    mode:opt.mode, cats:opt.cats, levels:opt.levels, label:opt.label||'',
    kpIds, base, queue:(opt.mode==='all'? q : shuffle(q)),
    log:[], cur:null, viewIdx:null, appear:{}, needReview:new Set(),
    startedAt:new Date().toISOString(),
    requested:(n===Infinity?kpIds.length:n), shortfall:(n!==Infinity && kpIds.length<n)
  };
  nextQ();
  return S;
}
function replay(){
  const st = {};
  S.kpIds.forEach(id=>{ const b=S.base[id]; st[id]={streak:b.streak, mastered:b.mastered,
    lastCorrectFormat:b.lastCorrectFormat, correct:0, wrong:0, justMastered:false}; });
  S.log.forEach(e=>{
    const s = st[e.kpId]; if(!s) return;
    if(e.correct){
      s.correct++;
      if(s.streak===0){ s.streak=1; s.lastCorrectFormat=e.fmt; }
      else if(e.fmt!==s.lastCorrectFormat){ s.streak++; s.lastCorrectFormat=e.fmt; }
      if(s.streak>=MASTERY_STREAK && !s.mastered){ s.mastered=true; s.justMastered=true; }
    }else{
      s.wrong++; s.streak=0; s.mastered=false; s.lastCorrectFormat=null;
    }
  });
  return st;
}
function nextQ(){
  S.viewIdx = null;
  if(!S.queue.length){ S.cur=null; return; }
  const q = S.queue.shift();
  const kp = KPMAP[q.kpId];
  S.appear[q.kpId] = (S.appear[q.kpId]|0)+1;
  S.cur = {kpId:q.kpId, fmt:q.fmt, choices:makeChoices(kp,q.fmt), src:q.src};
}
/* v1.0 §4 復習キュー：挿入位置が埋まっていれば直後の空きスロットへ */
function enqueue(kpId, fmt, offset, srcIdx){
  let i = Math.min(offset-1, S.queue.length);
  if(i<0) i=0;
  while(i<S.queue.length && S.queue[i].req) i++;
  S.queue.splice(i,0,{kpId, fmt, req:true, src:srcIdx});
}
function dropRequeueBySrc(srcIdx){
  S.queue = S.queue.filter(q=>!(q.req && q.src===srcIdx));
}
function scheduleFrom(idx){
  const e = S.log[idx];
  if(S.mode==='all') return;                              // §2-2 再投入なし
  if((S.appear[e.kpId]|0) >= MAX_REPEAT){ if(!e.correct||replay()[e.kpId].mastered===false) S.needReview.add(e.kpId); return; }
  const st = replay()[e.kpId];
  if(st.mastered) return;                                 // §4 習得達成 → 再投入しない
  const nf = e.fmt==='A'?'B':'A';                         // 直前と必ず異なる形式
  enqueue(e.kpId, nf, e.correct?REQUEUE_UNMAST:REQUEUE_WRONG, idx);
}
function answerQ(picked){
  const kp = KPMAP[S.cur.kpId];
  const ok = isCorrect(kp, S.cur.fmt, picked);
  S.log.push({kpId:S.cur.kpId, fmt:S.cur.fmt, choices:S.cur.choices, picked, correct:ok, at:new Date().toISOString()});
  scheduleFrom(S.log.length-1);
  return ok;
}
function reAnswer(idx, picked){
  const e = S.log[idx];
  const kp = KPMAP[e.kpId];
  dropRequeueBySrc(idx);
  e.picked = picked;
  e.correct = isCorrect(kp, e.fmt, picked);
  e.at = new Date().toISOString();
  scheduleFrom(idx);
}
function sessTotals(){
  let c=0,w=0; S.log.forEach(e=>{ e.correct?c++:w++; });
  return {c,w, total:S.log.length + (S.cur?1:0) + S.queue.length, idx:S.log.length+1};
}
function remainWords(){
  const st = replay();
  if(S.mode==='all'){
    const seen = new Set(S.log.map(e=>e.kpId));
    return S.kpIds.length - seen.size;
  }
  return S.kpIds.filter(id=>!st[id].mastered).length;
}

/* 成績の確定（v1.0 §5-2：全問終了時にのみ記録） */
function commitSession(){
  const acc = db.activeAccountId;
  const p = accProg(acc);
  const newlyMastered = [], wrongKpIds = new Set(), sessionWrongCount = {};
  let c=0,w=0;
  S.log.forEach(e=>{
    const it = getItem(acc, e.kpId);
    const f = (e.fmt==='A')?'A':'B';
    it.lastSeenAt = e.at;
    it.lastFormat = e.fmt;
    if(e.correct){
      c++; it.totalCorrect++; it.byFormat[f].correct++;
      if(it.streak===0){ it.streak=1; }
      else if(it._lcf!==e.fmt){ it.streak++; }
      it._lcf = e.fmt;
      if(it.streak>=MASTERY_STREAK && !it.mastered){
        it.mastered = true; it.masteredAt = e.at; newlyMastered.push(e.kpId);
      }
    }else{
      w++; it.totalWrong++; it.byFormat[f].wrong++;
      it.streak = 0; it.mastered = false; it._lcf = null;
      it.wrongLog.push({at:e.at, format:e.fmt, answered:e.picked});
      if(it.wrongLog.length>WRONGLOG_MAX) it.wrongLog = it.wrongLog.slice(-WRONGLOG_MAX);
      wrongKpIds.add(e.kpId);
      sessionWrongCount[e.kpId] = (sessionWrongCount[e.kpId]|0)+1;
    }
  });
  Object.values(p.items).forEach(it=>{ delete it._lcf; });
  p.sessions.push({
    startedAt:S.startedAt, finishedAt:new Date().toISOString(),
    mode:S.mode, correct:c, wrong:w,
    newlyMastered, wrongKpIds:[...wrongKpIds], sessionWrongCount
  });
  saveDB();
  syncPush(true);                                  // 追補§5 セッション終了の保存直後に自動push
  return {c, w, newlyMastered, wrongKpIds:[...wrongKpIds]};
}

function catCount(cid, levels){ return KP_BY_CAT[cid].filter(k=>levels.includes(k.level)).length; }
function statFor(cid, level){
  const items = accProg(db.activeAccountId).items;
  const list = KP_BY_CAT[cid].filter(k=>!level || k.level===level);
  let m=0,h=0;
  list.forEach(k=>{ const it=items[k.id]; if(!it) return;
    if(it.mastered) m++; else if((it.streak|0)>0) h++; });
  return {total:list.length, mast:m, half:h};
}
function bar(s){
  const p1 = s.total? s.mast/s.total*100:0, p2 = s.total? s.half/s.total*100:0;
  return '<div class="mbar"><i class="m" style="width:'+p1.toFixed(1)+'%"></i><i class="h" style="width:'+p2.toFixed(1)+'%"></i></div>';
}

/* ============================================================
   出題画面（v1.0 §6-1／§5 ナビゲーション）
   ============================================================ */
function viewQuiz(){
  const t = sessTotals();
  const reviewing = S.viewIdx!==null;
  const e = reviewing ? S.log[S.viewIdx] : null;
  const kpId = reviewing ? e.kpId : S.cur.kpId;
  const fmt  = reviewing ? e.fmt  : S.cur.fmt;
  const kp = KPMAP[kpId];
  const q = qText(kp, fmt);
  const choices = reviewing ? e.choices : S.cur.choices;
  const st = replay()[kpId];
  const idxShown = reviewing ? (S.viewIdx+1) : t.idx;

  let h = '<div class="qhead"><div class="pbar"><i style="width:'+(t.total?idxShown/t.total*100:0).toFixed(1)+'%"></i></div>'+
    '<div class="qmeta"><span><b>'+idxShown+'問目</b> / 全'+t.total+'問</span>'+
    '<span>あと'+remainWords()+'語</span>'+
    '<span class="ok">正解 '+t.c+'</span><span class="ng">誤答 '+t.w+'</span>'+
    '<span class="gauge">習得 '+'●'.repeat(Math.min(st.streak,MASTERY_STREAK))+'○'.repeat(Math.max(0,MASTERY_STREAK-st.streak))+
      (st.mastered?' 済':'')+'</span>'+
    '<span style="margin-left:auto"><button class="btn-sm" data-act="quitQuiz">中断</button></span></div></div>';

  if(reviewing){
    h += '<div class="reviewmark">🔍 レビュー表示（'+(S.viewIdx===S.log.length-1
      ? 'この問題は解き直せます' : '閲覧のみ')+'）</div>';
  }
  h += '<div class="qbox"><div class="qlabel">'+esc(q.label)+'</div>'+
    '<div class="qword'+(q.big?'':' small')+'">'+(q.big?ruby(q.word,q.yomi):esc(q.word))+'</div>'+
    '<div class="qask">'+esc(q.ask)+'</div></div>';

  const answered = reviewing || (S.cur && S.cur.done);
  const picked = reviewing ? e.picked : (S.cur?S.cur.picked:null);
  const correctVal = answerOf(kp,fmt);
  choices.forEach((ch,i)=>{
    let cls='opt';
    if(answered){
      const isC = isCorrect(kp,fmt,ch);
      if(isC) cls+=' correct';
      else if(ch===picked) cls+=' wrong';
      else cls+=' dim';
    }
    h += '<button class="'+cls+'" data-act="pick" data-v="'+esc(ch)+'"'+(answered&&!(reviewing&&S.viewIdx===S.log.length-1)?' disabled':'')+'>'+
      '<span class="n">'+'①②③④'[i]+'</span>'+esc(ch)+'</button>';
  });

  if(answered){
    const ok = reviewing ? e.correct : S.cur.ok;
    h += '<div class="fb '+(ok?'ok':'ng')+'"><div class="hd">'+(ok?'⭕ 正解！':'❌ 不正解　正解は「'+esc(correctVal)+'」')+'</div>'+
      '<div class="ex">'+explainOf(kp)+'</div></div>';
  }

  h += '<div class="navrow">'+
    '<button data-act="back"'+((reviewing? S.viewIdx<=0 : S.log.length<1)?' disabled':'')+'>← 前の問題</button>'+
    (reviewing
      ? '<button class="btn-p" data-act="fwd">'+(S.viewIdx>=S.log.length-1?'出題にもどる →':'次へ →')+'</button>'
      : (S.cur&&S.cur.done ? '<button class="btn-p" data-act="nextq">次の問題 →</button>' : '<button disabled>選んでください</button>'))+
    '</div>';
  return h;
}

/* ---------- カテゴリー別 全問一覧（v1.0 §7-3） ---------- */
function listRows(){
  const items = accProg(db.activeAccountId).items;
  let rows = KPS.map(k=>{
    const it = items[k.id]||newItem();
    return {k, it, st:stateOf(it), wrong:it.totalWrong|0, correct:it.totalCorrect|0};
  });
  if(LISTF.cat) rows = rows.filter(r=>r.k.cat===LISTF.cat);
  if(LISTF.state) rows = rows.filter(r=>{
    if(LISTF.state==='mastered') return r.it.mastered;
    if(LISTF.state==='wrong')    return !r.it.mastered && r.wrong>0;
    if(LISTF.state==='hot')      return r.wrong>=2;
    if(LISTF.state==='new')      return r.correct+r.wrong===0;
    return true;
  });
  const ord = {niji:0,sanji:1,yoji:2,taigi:3,ruigi:4};
  if(LISTF.sort==='wrong')      rows.sort((a,b)=>b.wrong-a.wrong || ord[a.k.cat]-ord[b.k.cat]);
  else if(LISTF.sort==='cat')   rows.sort((a,b)=>ord[a.k.cat]-ord[b.k.cat] || a.k.level.localeCompare(b.k.level));
  else if(LISTF.sort==='state') rows.sort((a,b)=>(b.it.mastered?1:0)-(a.it.mastered?1:0) || b.correct-a.correct);
  return rows;
}
function listCard(inResult){
  const rows = listRows();
  let h = '<div class="card" id="listCard"><h3 style="margin-top:0">カテゴリー別 全問一覧</h3>'+
   '<div class="filters">'+
   '<select data-act="f" data-k="cat"><option value="">全カテゴリー</option>'+
     CATS.map(c=>'<option value="'+c.id+'"'+(LISTF.cat===c.id?' selected':'')+'>'+c.name+'</option>').join('')+'</select>'+
   '<select data-act="f" data-k="state"><option value="">すべての状態</option>'+
     [['mastered','習得済み'],['wrong','誤答あり'],['hot','2回以上ミス'],['new','未出題']]
       .map(o=>'<option value="'+o[0]+'"'+(LISTF.state===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
   '<select data-act="f" data-k="sort">'+
     [['wrong','誤答数の多い順'],['cat','カテゴリー順'],['state','習得順']]
       .map(o=>'<option value="'+o[0]+'"'+(LISTF.sort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
   '</div>';
  h += '<p class="muted" style="font-size:.8rem">'+rows.length+'語　（行をタップすると内訳を表示）</p>';
  h += '<table><thead><tr><th>知識ポイント</th><th>状態</th><th>正/誤</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const hot = r.wrong>=2;
    h += '<tr class="'+(hot?'hot':'')+'" data-act="kp" data-id="'+esc(r.k.id)+'">'+
      '<td><b>'+esc(r.k.front)+'</b> <span class="muted" style="font-size:.72rem">'+esc(r.k.frontYomi)+'</span>'+
      '<br><span class="muted" style="font-size:.72rem">'+CAT[r.k.cat].short+'・'+r.k.level+'</span></td>'+
      '<td><span class="badge '+r.st.cls+'">'+r.st.t+'</span>'+(hot?'<br><span class="badge b-hot">⚠️'+r.wrong+'回ミス</span>':'')+'</td>'+
      '<td style="white-space:nowrap">'+r.correct+' / '+r.wrong+'</td></tr>';
    if(openKp===r.k.id){
      const it = r.it;
      const fa = CAT[r.k.cat].fa, fb = CAT[r.k.cat].fb;
      let d = explainOf(r.k)+'<br>';
      d += '形式A（'+esc(fa)+'）：正解'+it.byFormat.A.correct+'／誤答'+it.byFormat.A.wrong+'　';
      d += '形式B（'+esc(fb)+'）：正解'+it.byFormat.B.correct+'／誤答'+it.byFormat.B.wrong;
      if(it.wrongLog.length){
        d += '<br>過去の誤答：'+it.wrongLog.slice(-8).map(w=>esc(w.answered)+'<span class="muted">('+w.format+'/'+fmtD(w.at)+')</span>').join('、');
      }
      if(it.masteredAt) d += '<br>習得日：'+fmtD(it.masteredAt);
      h += '<tr><td colspan="3"><div class="kpdetail">'+d+'</div></td></tr>';
    }
  });
  h += '</tbody></table>';
  h += '<div class="row" style="margin-top:12px"><button class="btn-s" data-act="csv">⬇ CSVでダウンロード</button>'+
    (syncEnabled()?'<button class="btn-s" data-act="pushList">📋 全問一覧をDriveへ</button>':'')+'</div>';
  if(!inResult) h += '<div class="row" style="margin-top:8px"><button data-act="go" data-v="home">閉じる</button></div>';
  h += '</div>';
  return h;
}
/* ============================================================
   イベント配線
   ============================================================ */
function bind(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    const a = el.dataset.act;
    if(el.tagName==='SELECT'){ el.onchange = ()=>{ LISTF[el.dataset.k]=el.value; render(); }; return; }
    if(el.tagName==='INPUT' && el.type==='checkbox'){ el.onchange = ()=>ACT[a](el); return; }
    el.onclick = (ev)=>{ ev.stopPropagation(); ACT[a] && ACT[a](el); };
  });
}
const ACT = {
  go(el){ VIEW = el.dataset.v; openKp=null; render(); },
  cat(el){
    const id = el.dataset.id;
    PICK.cats = el.checked ? [...new Set([...PICK.cats,id])] : PICK.cats.filter(x=>x!==id);
    render();
  },
  lv(el){
    const l = el.dataset.id;
    let n = PICK.levels.includes(l) ? PICK.levels.filter(x=>x!==l) : [...PICK.levels,l];
    if(!n.length) n = [l];
    PICK.levels = n; render();
  },
  f(){},
  kp(el){ openKp = (openKp===el.dataset.id)?null:el.dataset.id; render(); },
  showList(){ VIEW='list'; openKp=null; render(); },

  /* ---- アカウント ---- */
  accAdd(){
    const v = ($('newAcc').value||'').trim();
    if(!v) return alertM('入力してください','名前を入れてから「追加」を押してください。');
    if(db.accounts.some(a=>a.name===v)) return alertM('同じ名前があります','別の名前にしてください。');
    const id = uid('acc');
    db.accounts.push({id, name:v, createdAt:new Date().toISOString()});
    db.progress[id] = {items:{}, sessions:[]};
    db.activeAccountId = id;
    saveDB(); syncPush(true);                       // 追補§5 アカウント追加でpush
    VIEW='home'; render();
  },
  accUse(el){ db.activeAccountId = el.dataset.id; saveDB(); VIEW='home'; render(); },
  accRename(el){
    const a = db.accounts.find(x=>x.id===el.dataset.id); if(!a) return;
    modal('<h3>名前を変える</h3><input type="text" id="rnV" value="'+esc(a.name)+'">'+
      '<div class="row" style="margin-top:14px"><button id="rnC">キャンセル</button><button class="btn-p" id="rnO">変更</button></div>');
    $('rnC').onclick = closeModal;
    $('rnO').onclick = ()=>{
      const v = ($('rnV').value||'').trim(); if(!v) return;
      a.name = v; closeModal(); saveDB(); syncPush(true); render();
    };
  },
  accDel(el){
    const a = db.accounts.find(x=>x.id===el.dataset.id); if(!a) return;
    confirmM('アカウントを削除しますか？','<b>'+esc(a.name)+'</b> の学習記録もすべて消えます。この操作は取り消せません。','削除する',()=>{
      db.accounts = db.accounts.filter(x=>x.id!==a.id);
      delete db.progress[a.id];
      if(db.activeAccountId===a.id) db.activeAccountId = db.accounts[0]?db.accounts[0].id:null;
      saveDB(); syncPush(true); render();
    }, true);
  },

  /* ---- 出題 ---- */
  start(el){
    const m = el.dataset.m;
    const s = startSession({mode:m, cats:PICK.cats, levels:PICK.levels});
    if(!s) return alertM('出題できません','選んだ条件に出題できる語がありません（すべて習得済みかもしれません）。<br>「全問モード」なら習得済みも出題できます。');
    const start = ()=>{ VIEW='quiz'; render(); };
    if(S.shortfall) alertM('出題数のお知らせ','出題できる語が '+S.kpIds.length+' 語しかないため、その数で出題します。', start);
    else start();
  },
  startWrong(){
    const items = accProg(db.activeAccountId).items;
    const ids = KPS.filter(k=>((items[k.id]||{}).totalWrong|0)>0).map(k=>k.id);
    if(!ids.length) return;
    const s = startSession({mode:'all', cats:CATS.map(c=>c.id), levels:['A','B'], onlyIds:ids, label:'間違い復習'});
    if(!s) return;
    VIEW='quiz'; render();
  },
  pick(el){
    const v = el.dataset.v;
    if(S.viewIdx!==null){                         // §5-1 直前1問のみ再解答可
      if(S.viewIdx!==S.log.length-1) return;
      reAnswer(S.viewIdx, v); render(); return;
    }
    if(S.cur.done) return;
    const ok = answerQ(v);
    S.cur.done = true; S.cur.picked = v; S.cur.ok = ok;
    render();
  },
  nextq(){
    nextQ();
    if(!S.cur){ finishSession(); return; }
    render();
  },
  back(){
    if(S.viewIdx===null) S.viewIdx = S.log.length-1;
    else if(S.viewIdx>0) S.viewIdx--;
    render();
  },
  fwd(){
    if(S.viewIdx===null) return;
    if(S.viewIdx>=S.log.length-1) S.viewIdx = null;
    else S.viewIdx++;
    render();
  },
  quitQuiz(){
    confirmM('学習を中断しますか？','とちゅうでやめると<b>今回の成績は記録されません</b>（習得状況も変わりません）。','中断する',()=>{
      S=null; VIEW='home'; render();
    }, true);
  },

  /* ---- 記録データの管理（追補§3） ---- */
  expJson(){
    const blob = new Blob([JSON.stringify(db,null,1)], {type:'application/json'});
    dl(blob, APP_TITLE+'記録_'+fmtFile()+'.json');
  },
  impJson(){ $('impFile').value=''; $('impFile').click(); },
  csv(){ downloadCSV(); },
  pushList(){ doPushList(); },
  syncNow(){ syncPull().then(()=>render()); },
  syncCfg(){ syncModal(); },
  resetAcc(){
    const a = activeAcc(); if(!a) return;
    confirmM('記録をリセットしますか？','<b>'+esc(a.name)+'</b> の学習記録（習得状況・履歴）をすべて消します。','リセットする',()=>{
      db.progress[a.id] = {items:{}, sessions:[]};
      saveDB(); syncPush(true); render();
    }, true);
  },
  resetAll(){
    confirmM('全データをリセットしますか？','すべてのアカウントと学習記録を消します。この操作は取り消せません。','全部消す',()=>{
      db = newDB(); saveDB(); syncPush(true); VIEW='accounts'; render();
    }, true);
  },
};

function finishSession(){
  const r = commitSession();
  RESULT = {c:r.c, w:r.w, newlyMastered:r.newlyMastered, log:S.log.slice(),
    needReview:[...S.needReview], at:new Date().toISOString(),
    modeLabel: S.label || (S.mode==='all'?'全問モード':S.mode==='10q'?'10問モード':'20問モード')};
  S = null; VIEW='result'; openKp=null; render();
}

/* ---------- ダウンロード ---------- */
function dl(blob, name){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 1000);
}
function csvCell(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function qLabelFor(kp){
  const c = CAT[kp.cat];
  return c.kind==='mean' ? '「'+kp.front+'」の意味は？' : '「'+kp.front+'」の'+(c.id==='taigi'?'対義語':'類義語')+'は？';
}
function lastAnswerOf(it){
  if(!it || (it.totalCorrect|0)+(it.totalWrong|0)===0) return '';
  if(it.mastered || (it.streak|0)>0) return '（正解）';
  const w = it.wrongLog[it.wrongLog.length-1];
  return w?w.answered:'';
}
/* v1.0 §7-4 CSV（UTF-8 BOM付き・13列） */
function downloadCSV(){
  const items = accProg(db.activeAccountId).items;
  const header = ['カテゴリー','知識ポイント','問題文','正解','直近の解答','状態','累計正解数','累計誤答数',
                  '形式A誤答数','形式B誤答数','過去の誤答内容','最終誤答日','習得日'];
  const rows = KPS.map(k=>{
    const it = items[k.id]||newItem();
    const lw = it.wrongLog[it.wrongLog.length-1];
    return [CAT[k.cat].name, k.front, qLabelFor(k), k.back, lastAnswerOf(it), stateOf(it).t,
      it.totalCorrect|0, it.totalWrong|0, it.byFormat.A.wrong|0, it.byFormat.B.wrong|0,
      it.wrongLog.map(w=>w.answered).join(';'), lw?fmtD(lw.at):'', it.masteredAt?fmtD(it.masteredAt):''];
  }).sort((a,b)=>b[7]-a[7]);
  const csv = [header, ...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  dl(new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}), '結果_'+activeAcc().name+'_'+fmtFile()+'.csv');
}
/* 追補§6 全問一覧をDriveへ（14列・全アカウント×全KP） */
const LIST_HEADER = ['名前','カテゴリー','記号','知識ポイント','よみがな','重要度','状態',
  '累計正解数','累計誤答数','形式A誤答数','形式B誤答数','過去の誤答内容','最終誤答日','習得日'];
function buildListRows(){
  const rows = [];
  db.accounts.forEach(a=>{
    const items = accProg(a.id).items;
    KPS.forEach(k=>{
      const it = items[k.id]||newItem();
      const lw = it.wrongLog[it.wrongLog.length-1];
      rows.push([a.name, CAT[k.cat].name, k.mark||'', k.front, k.frontYomi||'', 'レベル'+k.level, stateOf(it).t,
        it.totalCorrect|0, it.totalWrong|0, it.byFormat.A.wrong|0, it.byFormat.B.wrong|0,
        it.wrongLog.map(w=>w.answered).join(';'), lw?fmtD(lw.at):'', it.masteredAt?fmtD(it.masteredAt):'']);
    });
  });
  return rows;
}
async function doPushList(){
  if(!syncEnabled()) return;
  await syncPull(true);                                   // 追補§6 空上書き防止：必ず先にpull
  if(!dbHasRecords(db)){
    return alertM('書き出しを中止しました',
      'この端末にもクラウドにも学習記録がありません。<br>空のデータで既存の一覧シートを上書きしないよう、書き出しを中止しました。<br><br>先に学習するか、記録のある端末で同期してからお試しください。');
  }
  const r = await syncPushList(buildListRows(), LIST_HEADER);
  render();
  if(!r.ok) alertM('書き出しに失敗しました', esc(r.error||'もう一度お試しください。'));
}

/* ---------- インポート（追補§3） ---------- */
function handleImport(file){
  const rd = new FileReader();
  rd.onload = ()=>{
    let d;
    try{ d = JSON.parse(rd.result); }catch(e){ return alertM('読み込めません','JSONファイルとして読めませんでした。'); }
    if(!d || d.app!==APP){
      return alertM('このツールの記録ではありません','ファイルの app は「'+esc((d&&d.app)||'不明')+'」です。<br>このツール（'+esc(APP)+'）の記録ファイルを選んでください。');
    }
    const names = (d.accounts||[]).map(a=>a.name).join('、')||'（なし）';
    confirmM('記録を置き換えますか？',
      'アカウント：<b>'+esc(names)+'</b><br>保存日時：<b>'+fmtDT(d.updatedAt)+'</b><br><br>'+
      '現在この端末にある記録は<b>すべて置き換えられます</b>。',
      '置き換える', async ()=>{
        db = migrate(d);
        saveDB();                                   // 追補§3 置換後 updatedAt更新＋push
        await syncPush(true);
        VIEW = db.activeAccountId?'home':'accounts'; render();
        alertM('読み込みました','記録を置き換えました。');
      }, true);
  };
  rd.readAsText(file);
}

/* ---------- 同期設定モーダル（追補§3・§7） ---------- */
function syncModal(){
  const on = syncEnabled();
  modal('<h3>☁ クラウド同期設定</h3>'+
    '<p class="tiny">Google Apps Script のウェブアプリURL（<b>/exec</b> で終わるもの）と合言葉を入力してください。'+
    'この情報はこの端末の中だけに保存され、ほかには送信されません。</p>'+
    '<label class="fld">GASのURL</label><input type="url" id="sUrl" placeholder="https://script.google.com/macros/s/～/exec" value="'+esc(on?syncCfg.url:'')+'">'+
    '<label class="fld">合言葉</label><input type="password" id="sKey" placeholder="合言葉" value="'+esc(on?syncCfg.key:'')+'">'+
    '<div class="row" style="margin-top:16px"><button id="sC">閉じる</button>'+
    (on?'<button class="btn-d" id="sD">同期を解除</button>':'')+
    '<button class="btn-p" id="sS">保存して同期</button></div>', {sticky:true});
  $('sC').onclick = closeModal;
  if(on) $('sD').onclick = ()=>{
    confirmM('同期を解除しますか？','この端末の同期設定（URLと合言葉）を消します。学習記録はこの端末に残ります。','解除する',()=>{
      syncCfg=null; saveSyncCfg(); setBar('force',''); $('syncBar').style.display='none'; render();
    }, true);
  };
  $('sS').onclick = async ()=>{
    const url = ($('sUrl').value||'').trim(), key = ($('sKey').value||'').trim();
    if(!/^https?:\/\/.+\/exec$/.test(url)) return alertM('URLを確認してください','GASのウェブアプリURLは <b>https://…/exec</b> の形（末尾が /exec）です。');
    if(!key) return alertM('合言葉を入れてください','サーバー側と同じ合言葉を入力してください。');
    syncCfg = {url, key, lastSync:(syncCfg&&syncCfg.lastSync)||null};
    saveSyncCfg(); closeModal();
    await syncPull();                                // 追補§5 同期設定の保存直後にpull
    render();
  };
}

/* ============================================================
   起動
   ============================================================ */
(async function boot(){
  loadDB(); loadSyncCfg();
  render();
  $('impFile') && ($('impFile').onchange = e=>{ if(e.target.files[0]) handleImport(e.target.files[0]); });
  document.addEventListener('change', e=>{
    if(e.target && e.target.id==='impFile' && e.target.files[0]) handleImport(e.target.files[0]);
  });
  if(syncEnabled()){ setBar('busy','クラウドと同期中'); await syncPull(true); render(); }  // 追補§5 起動直後にpull
  window.addEventListener('beforeunload', e=>{
    if(VIEW==='quiz' && S && S.log.length){ e.preventDefault(); e.returnValue=''; }        // v1.0 §5-2
  });
})();
</script>
