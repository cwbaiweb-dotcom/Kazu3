<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動物｜中学受験 理科</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b; --line:#e3ded3;
  --accent:#2f7d5d; --accent2:#e3f1e9; --warn:#c9522b; --warnbg:#fdeee8;
  --gold:#b8860b; --blue:#2b6cb0; --bluebg:#e7eff8;
  --ok:#2f7d5d; --ng:#c9522b;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,sans-serif;
  font-size:16px; line-height:1.7; padding-bottom:40px;
}
#app{max-width:720px;margin:0 auto;padding:12px 12px 60px;}
h1,h2,h3{margin:0 0 8px;line-height:1.4;}
h1{font-size:20px;}
h2{font-size:17px;}
h3{font-size:15px;color:var(--sub);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;}
.card.tight{padding:10px;}
.muted{color:var(--sub);font-size:13px;}
.small{font-size:13px;}
.center{text-align:center;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.row.tight{gap:6px;}
.spacer{flex:1;}
button{
  font-family:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;
}
button:active{transform:translateY(1px);}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:bold;}
button.ghost{background:transparent;}
button.danger{color:var(--warn);border-color:#eccfc4;}
button.wide{width:100%;}
button:disabled{opacity:.45;cursor:default;}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
.seg button{border:0;border-radius:0;padding:8px 12px;font-size:13px;background:#fff;}
.seg button.on{background:var(--accent);color:#fff;}
.bar{height:9px;background:#e9e5dc;border-radius:99px;overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--accent);}
.qbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;}
.qtext{font-size:20px;font-weight:bold;line-height:1.5;}
.choice{
  display:block;width:100%;text-align:left;margin:8px 0;padding:14px;
  font-size:16px;border-radius:12px;border:1px solid var(--line);background:#fff;
}
.choice.correct{background:var(--accent2);border-color:var(--accent);font-weight:bold;}
.choice.wrong{background:var(--warnbg);border-color:var(--warn);color:var(--warn);}
.choice:disabled{opacity:1;cursor:default;}
.choice.correct::after{content:" ◯";color:var(--accent);}
.choice.wrong::after{content:" ×";color:var(--warn);}
.fb{padding:12px;border-radius:12px;margin:10px 0;font-weight:bold;}
.fb.ok{background:var(--accent2);color:var(--accent);}
.fb.ng{background:var(--warnbg);color:var(--warn);}
.gauge{letter-spacing:2px;font-size:16px;}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:#faf8f4;color:var(--sub);margin-right:4px;}
.tag.imp2{background:#fdf3d8;border-color:#eddfae;color:var(--gold);}
.tag.imp1{background:var(--bluebg);border-color:#cfdcee;color:var(--blue);}
.tag.mastered{background:var(--accent);border-color:var(--accent);color:#fff;}
.tag.attn{background:var(--warnbg);border-color:var(--warn);color:var(--warn);}
table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;}
th{background:#faf8f4;font-weight:bold;}
.hide-cell{color:transparent !important;background:#efece5 !important;border-radius:6px;cursor:pointer;}
.hide-cell *{color:transparent !important;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:100;opacity:.95;}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;}
input[type=text],input[type=url],input[type=password],select{
  font-family:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink);
}
label.f{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px;}
.list-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;background:#fff;cursor:pointer;}
.list-item.mastered{background:#eef6f1;}
.list-item.attn{background:#fdf5f1;border-color:#eccfc4;}
.flip{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:22px;font-weight:bold;cursor:pointer;}
.flip .sub{font-size:14px;font-weight:normal;color:var(--sub);margin-top:10px;}
.box{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:64px;background:#fff;}
.box.on{border-color:var(--accent);background:var(--accent2);}
.goro{background:#fdf9ec;border:1px solid #eddfae;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;}
.note{background:#f4f7fb;border:1px solid #dbe5f0;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;}
.warnbar{background:var(--warnbg);border:1px solid #eccfc4;color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0;}
.okbar{background:var(--accent2);border:1px solid #cfe4d8;color:var(--accent);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media(max-width:420px){ .grid3{grid-template-columns:1fr 1fr;} }
.tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
.tabbar button{white-space:nowrap;font-size:13px;padding:8px 12px;}
.tabbar button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.kpline{display:flex;gap:8px;align-items:baseline;}
.kpline .n{font-weight:bold;}
.kpline .a{color:var(--accent);}
.rank{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:6px 0;font-size:14px;cursor:pointer;}
</style>
</head>

function hashStr(s){ var h=5381,i; for(i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; } return h.toString(36); }

var KPS = [], NAME_AXIS = {}, ID2KP = {};
(function(){
  var used = {};
  for (var i=0;i<D.length;i++){
    var r = D[i];
    var kp = { unit:r[0], cat:r[1], axis:r[2], name:r[3], ans:r[4], imp:(r[5]===undefined?1:r[5]), note:r[6]||"", goro:r[7]||"", idx:i };
    var base = "k" + hashStr(kp.cat + "|" + kp.axis + "|" + kp.name), id = base, n = 2;
    while (used[id]) { id = base + "_" + (n++); }
    used[id] = 1; kp.id = id;
    KPS.push(kp); ID2KP[id] = kp;
    NAME_AXIS[kp.name + "|" + kp.axis] = kp.ans;
  }
})();

var UNITS = [];
var CATS  = [];
var CAT_UNIT = {};
(function(){
  for (var i=0;i<KPS.length;i++){
    if (UNITS.indexOf(KPS[i].unit) < 0) UNITS.push(KPS[i].unit);
    if (CATS.indexOf(KPS[i].cat) < 0) { CATS.push(KPS[i].cat); CAT_UNIT[KPS[i].cat] = KPS[i].unit; }
  }
})();

function qText(kp, fmt){
  var t = AXQ[kp.axis];
  var s = t ? (fmt==="A" ? t.a : t.b)
            : (fmt==="A" ? "「{name}」の{axis}は？" : "{axis}が「{ans}」なのはどれ？");

}

/* =======================================================================
   誤答選択肢の生成（引き継ぎ仕様 §4）
   ======================================================================= */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function distractorsA(kp){
  var out=[], seen={}; seen[kp.ans]=1;
  var tiers=[
    KPS.filter(function(k){ return k.axis===kp.axis && k.cat===kp.cat; }),
    KPS.filter(function(k){ return k.axis===kp.axis; }),
    KPS.filter(function(k){ return k.cat===kp.cat; }),
    KPS.filter(function(k){ return k.unit===kp.unit; }),
    KPS
  ];
  for(var t=0;t<tiers.length && out.length<3;t++){
    var c=shuffle(tiers[t]);
    for(var i=0;i<c.length && out.length<3;i++){ if(!seen[c[i].ans]){ seen[c[i].ans]=1; out.push(c[i].ans); } }
  }
  return out;
}
function distractorsB(kp){
  var out=[], seen={}; seen[kp.name]=1;
  function ok(k){ return NAME_AXIS[k.name+"|"+kp.axis] !== kp.ans; }        // 正解が2つになるのを防ぐ
  function unknown(k){ return NAME_AXIS[k.name+"|"+kp.axis] === undefined; }
  var tiers=[
    KPS.filter(function(k){ return k.axis===kp.axis && k.cat===kp.cat && ok(k); }),
    KPS.filter(function(k){ return k.axis===kp.axis && k.unit===kp.unit && ok(k); }),
    KPS.filter(function(k){ return k.axis===kp.axis && ok(k); }),
    KPS.filter(function(k){ return unknown(k) && k.cat===kp.cat; }),
    KPS.filter(unknown)
  ];
  for(var t=0;t<tiers.length && out.length<3;t++){
    var c=shuffle(tiers[t]);
    for(var i=0;i<c.length && out.length<3;i++){ if(!seen[c[i].name]){ seen[c[i].name]=1; out.push(c[i].name); } }
  }
  return out;
}
function buildQuestion(kp, fmt){
  var correct = fmt==="A" ? kp.ans : kp.name;
  var ds = fmt==="A" ? distractorsA(kp) : distractorsB(kp);
  return { kp:kp, fmt:fmt, text:qText(kp,fmt), correct:correct, choices:shuffle([correct].concat(ds)) };
}

function newItem(){
  return { streak:0, mastered:false, masteredAt:null, postMasterWrong:0, lastFormat:null,
           totalCorrect:0, totalWrong:0,
           byFormat:{A:{correct:0,wrong:0},B:{correct:0,wrong:0}}, wrongLog:[], lastSeenAt:null };
}
function emptyDB(){
  return { app:APP, version:DB_VERSION, updatedAt:new Date().toISOString(),
           activeAccountId:null, accounts:[], progress:{} };
}
var DB = null;

function migrate(raw){
  if (!raw || typeof raw !== "object") return emptyDB();
  // 旧スキーマ {users:{name:{st}}} 等 → 新スキーマ
  if (!raw.accounts && raw.users){
    var db = emptyDB(), names = Object.keys(raw.users);
    names.forEach(function(nm,i){
      var id = "acc_" + hashStr(nm) + "_" + i;
      db.accounts.push({ id:id, name:nm, createdAt:new Date().toISOString() });
      var p = { items:{}, sessions:[] }, src = raw.users[nm] || {};
      var srcItems = src.st || src.items || {};
      Object.keys(srcItems).forEach(function(k){
        var it = newItem(), o = srcItems[k] || {};
        it.streak = o.streak||0; it.mastered = !!o.mastered; it.masteredAt = o.masteredAt||null;
        it.totalCorrect = o.totalCorrect||0; it.totalWrong = o.totalWrong||0;
        it.lastSeenAt = o.lastSeenAt||null; it.lastFormat = o.lastFormat||null;
        if (o.byFormat) it.byFormat = o.byFormat;
        it.wrongLog = (o.wrongLog||[]).slice(0,5);
        p.items[k] = it;
      });
      db.progress[id] = p;
    });
    db.activeAccountId = db.accounts.length ? db.accounts[0].id : null;
    return db;
  }
  raw.app = APP; raw.version = DB_VERSION;
  raw.accounts = raw.accounts || [];
  raw.progress = raw.progress || {};
  raw.accounts.forEach(function(a){
    var p = raw.progress[a.id] = raw.progress[a.id] || { items:{}, sessions:[] };
    p.items = p.items || {}; p.sessions = p.sessions || [];
    Object.keys(p.items).forEach(function(k){
      var it = p.items[k], base = newItem(), f;
      for (f in base) if (it[f] === undefined) it[f] = base[f];
      it.byFormat = it.byFormat || {A:{correct:0,wrong:0},B:{correct:0,wrong:0}};
      it.byFormat.A = it.byFormat.A || {correct:0,wrong:0};
      it.byFormat.B = it.byFormat.B || {correct:0,wrong:0};
      if (typeof it.postMasterWrong !== "number") it.postMasterWrong = 0;   // v1→v2 補完
      it.wrongLog = (it.wrongLog||[]).slice(0,5);                            // 5件に切り詰め
    });
    if (p.sessions.length > 100) p.sessions = p.sessions.slice(0,100);
  });
  return raw;
}
function loadDB(){
  var s = lsGet(APP), raw = null;
  if (s) { try { raw = JSON.parse(s); } catch(e){ raw = null; } }
  DB = migrate(raw);
  if (!DB.accounts.length) DB.activeAccountId = null;
  return DB;
}
function saveDB(fromCloud){
  if (!fromCloud) DB.updatedAt = new Date().toISOString();   // クラウド取り込み時は上書きしない
  DB.app = APP; DB.version = DB_VERSION;

}
function acc(){
  if (!DB.activeAccountId) return null;
  for (var i=0;i<DB.accounts.length;i++) if (DB.accounts[i].id===DB.activeAccountId) return DB.accounts[i];
  return null;
}
function prog(){
  var a = acc(); if (!a) return null;
  if (!DB.progress[a.id]) DB.progress[a.id] = { items:{}, sessions:[] };
  return DB.progress[a.id];
}
function item(id, create){
  var p = prog(); if (!p) return newItem();
  if (!p.items[id]) { if (!create) return newItem(); p.items[id] = newItem(); }
  return p.items[id];
}

  if (e === "OFFLINE")  return "オフライン（ローカルには保存済み）";

/* ---- 合流（§13-3） -------------------------------------------------- */
function mergeItem(a, b){
  // a=ローカル, b=クラウド
  var A = a || newItem(), B = b || newItem(), o = newItem();
  o.totalCorrect    = Math.max(A.totalCorrect||0,    B.totalCorrect||0);
  o.totalWrong      = Math.max(A.totalWrong||0,      B.totalWrong||0);
  o.postMasterWrong = Math.max(A.postMasterWrong||0, B.postMasterWrong||0);
  ["A","B"].forEach(function(f){
    o.byFormat[f].correct = Math.max((A.byFormat&&A.byFormat[f]?A.byFormat[f].correct:0)||0,(B.byFormat&&B.byFormat[f]?B.byFormat[f].correct:0)||0);
    o.byFormat[f].wrong   = Math.max((A.byFormat&&A.byFormat[f]?A.byFormat[f].wrong  :0)||0,(B.byFormat&&B.byFormat[f]?B.byFormat[f].wrong  :0)||0);
  });
  o.mastered = !!(A.mastered || B.mastered);
  if (A.masteredAt && B.masteredAt) o.masteredAt = (A.masteredAt < B.masteredAt) ? A.masteredAt : B.masteredAt;
  else o.masteredAt = A.masteredAt || B.masteredAt || null;
  var log = (A.wrongLog||[]).concat(B.wrongLog||[]), seen = {}, uniq = [];
  log.forEach(function(w){ if (w && w.at && !seen[w.at]) { seen[w.at]=1; uniq.push(w); } });
  uniq.sort(function(x,y){ return x.at < y.at ? 1 : -1; });
  o.wrongLog = uniq.slice(0,5);
  var an = A.lastSeenAt || "", bn = B.lastSeenAt || "";
  var newer = (an >= bn) ? A : B;                 // lastSeenAt が新しい側
  o.lastSeenAt = an >= bn ? an : bn; if (!o.lastSeenAt) o.lastSeenAt = null;
  o.streak     = newer.streak || 0;               // ← 大きい方ではない（§13-3）
  o.lastFormat = newer.lastFormat || null;
  return o;
}
function mergeDB(local, cloud){
  var out = { app:APP, version:DB_VERSION, updatedAt:cloud.updatedAt || local.updatedAt,
              activeAccountId:null, accounts:[], progress:{} };
  var byName = {}, changed = false;
  (local.accounts||[]).forEach(function(a){ byName[a.name] = { id:a.id, createdAt:a.createdAt }; });
  var names = (local.accounts||[]).map(function(a){ return a.name; });
  (cloud.accounts||[]).forEach(function(a){ if (names.indexOf(a.name)<0) { names.push(a.name); byName[a.name] = { id:a.id, createdAt:a.createdAt }; changed = true; } });

  names.forEach(function(nm){
    var la = (local.accounts||[]).filter(function(a){ return a.name===nm; })[0];
    var ca = (cloud.accounts||[]).filter(function(a){ return a.name===nm; })[0];
    var id = la ? la.id : ca.id;
    out.accounts.push({ id:id, name:nm, createdAt:(la&&la.createdAt) || (ca&&ca.createdAt) || new Date().toISOString() });
    var lp = (la && local.progress ? local.progress[la.id] : null) || { items:{}, sessions:[] };
    var cp = (ca && cloud.progress ? cloud.progress[ca.id] : null) || { items:{}, sessions:[] };
    var items = {}, keys = {};
    Object.keys(lp.items||{}).forEach(function(k){ keys[k]=1; });
    Object.keys(cp.items||{}).forEach(function(k){ keys[k]=1; });
    Object.keys(keys).forEach(function(k){
      var m = mergeItem(lp.items?lp.items[k]:null, cp.items?cp.items[k]:null);
      items[k] = m;
      if (JSON.stringify(m) !== JSON.stringify(lp.items ? lp.items[k] : null)) changed = true;
    });
    var ss = (lp.sessions||[]).concat(cp.sessions||[]), seen={}, u=[];
    ss.forEach(function(s){ if (s && s.finishedAt && !seen[s.finishedAt]) { seen[s.finishedAt]=1; u.push(s); } });
    u.sort(function(x,y){ return x.finishedAt < y.finishedAt ? 1 : -1; });
    if (u.length !== (lp.sessions||[]).length) changed = true;
    out.progress[id] = { items:items, sessions:u.slice(0,100) };
  });
  // アクティブアカウントは名前で維持
  var cur = (local.accounts||[]).filter(function(a){ return a.id===local.activeAccountId; })[0];
  if (cur){ var f = out.accounts.filter(function(a){ return a.name===cur.name; })[0]; if (f) out.activeAccountId = f.id; }
  if (!out.activeAccountId && out.accounts.length) out.activeAccountId = out.accounts[0].id;
  return { db:out, changed:changed };
}
function mergeSummary(db){
  var people = db.accounts.length, seen = 0, mastered = 0;
  Object.keys(db.progress).forEach(function(id){
    var its = db.progress[id].items || {};
    Object.keys(its).forEach(function(k){
      var it = its[k];
      if ((it.totalCorrect||0)+(it.totalWrong||0) > 0) seen++;
      if (it.mastered) mastered++;
    });
  });
  return "（" + people + "人・出題済み" + seen + "・習得" + mastered + "）";
}
function doSync(){
  var s = syncCfg(); if (!s) { flash("同期が設定されていません"); return; }
  setSyncMsg("busy","☁… 同期中");
  apiPull(function(j){
    if (!j.ok){ setSyncMsg(/合言葉/.test(errText(j.error))?"err":"warn", "☁⚠ " + errText(j.error)); return; }
    var cloud = j.data ? migrate(j.data) : null;
    var localHas = dbHasRecords(DB), cloudHas = dbHasRecords(cloud);
    if (!cloud){ pushDB(true); setSyncMsg("ok","☁ クラウドに進捗が無かったので送りました"); return; }
    if (!localHas && cloudHas){                       // 空の端末は無条件でクラウド採用
      DB = cloud; saveDB(true); lsSet(APP, JSON.stringify(DB));
      setSyncMsg("ok","☁✓ クラウドの記録を取り込みました " + mergeSummary(DB)); return;
    }
    if (localHas && !cloudHas){ pushDB(true); setSyncMsg("ok","☁ クラウドに進捗が無かったので送りました"); return; }
    if (!localHas && !cloudHas){
      var r0 = mergeDB(DB, cloud); DB = r0.db; saveDB(true); lsSet(APP, JSON.stringify(DB));
      setSyncMsg("ok","☁✓ クラウドと合流しました " + mergeSummary(DB)); return;
    }
    var r = mergeDB(DB, cloud);
    DB = r.db; saveDB(true); lsSet(APP, JSON.stringify(DB));
    setSyncMsg("ok","☁✓ クラウドと合流しました " + mergeSummary(DB));
    if (r.changed) pushDB(true);
  });
}

   出題（共通仕様 §3・§4・§5）
   ======================================================================= */
var SESSION = null;

function pickKPs(mode, focusId){
  var pool = rangeKPs();
  if (mode === "再確認") return pool.filter(function(k){ return itemRO(k.id).postMasterWrong > 0; });
  if (mode === "全問")  return shuffle(pool);
  var need = mode === "20問" ? 20 : 10;
  var cand = pool.filter(function(k){ return !itemRO(k.id).mastered; });
  cand.sort(function(a,b){
    var A = itemRO(a.id), B = itemRO(b.id);
    if ((B.totalWrong||0) !== (A.totalWrong||0)) return (B.totalWrong||0) - (A.totalWrong||0);
    var au = A.lastSeenAt ? 1 : 0, bu = B.lastSeenAt ? 1 : 0;
    if (au !== bu) return au - bu;                        // 未出題を優先
    return (A.lastSeenAt||"") < (B.lastSeenAt||"") ? -1 : 1;  // 古い順
  });
  var out = cand.slice(0, need);
  if (focusId){
    var f = ID2KP[focusId];
    if (f && out.indexOf(f) < 0) { out.pop(); out.unshift(f); }
  }
  return out;
}
function startFocus(id){ startQuiz("10問", id); }

function startQuiz(mode, focusId){
  var kps = pickKPs(mode, focusId);
  if (!kps.length){
    flash(mode==="再確認" ? "要注意のことばはありません" : "この範囲に出題できることばがありません");
    return;
  }
  var short = "";
  if (mode!=="全問" && mode!=="再確認"){
    var need = mode==="20問"?20:10;
    if (kps.length < need) short = "この範囲の未習得は"+kps.length+"語しかないので、"+kps.length+"語（"+(kps.length*2)+"問）で出題します。";
  }
  var queue = [];
  if (mode === "全問"){
    kps.forEach(function(k){ var lf = itemRO(k.id).lastFormat; var f = lf==="A" ? "B" : (lf==="B" ? "A" : (Math.random()<.5?"A":"B")); queue.push({id:k.id, fmt:f}); });
  } else {
    var first = [], second = [];
    kps.forEach(function(k){
      var lf = itemRO(k.id).lastFormat; var f = lf==="A" ? "B" : (lf==="B" ? "A" : (Math.random()<.5?"A":"B"));
      first.push({id:k.id, fmt:f}); second.push({id:k.id, fmt:(f==="A"?"B":"A")});
    });
    queue = shuffle(first).concat(shuffle(second));
  }
  SESSION = {
    mode: mode, queue: queue, idx: 0, log: [], tmp: {}, seenCount: {},
    startedAt: new Date().toISOString(),
    masteredAtStart: KPS.filter(function(k){ return itemRO(k.id).mastered; }).map(function(k){ return k.id; }),
    answered: false, viewBack: null, cur: null, notice: short, skipped: []
  };
  nextQuestion();
  go("quiz");
}
function tmpItem(id){
  if (!SESSION.tmp[id]) SESSION.tmp[id] = JSON.parse(JSON.stringify(itemRO(id)));
  return SESSION.tmp[id];
}
function nextQuestion(){
  SESSION.answered = false; SESSION.viewBack = null;
  while (SESSION.idx < SESSION.queue.length){
    var q = SESSION.queue[SESSION.idx];
    if ((SESSION.seenCount[q.id]||0) >= 4){                 // 1セッション同一KPの上限4回（§5）
      if (SESSION.skipped.indexOf(q.id)<0) SESSION.skipped.push(q.id);
      SESSION.idx++; continue;
    }
    SESSION.cur = buildQuestion(ID2KP[q.id], q.fmt);
    return;
  }
  SESSION.cur = null; finishSession();
}
function totalPlanned(){ return SESSION.queue.length; }

function answer(choiceIdx){
  if (SESSION.answered) return;
  var q = SESSION.cur, chosen = q.choices[choiceIdx], ok = (chosen === q.correct);
  var id = q.kp.id;
  var before = JSON.parse(JSON.stringify(tmpItem(id)));
  var beforeQueue = JSON.stringify(SESSION.queue);
  applyAnswer(q, ok, chosen);
  SESSION.log.push({ id:id, fmt:q.fmt, text:q.text, choices:q.choices, correct:q.correct, chosen:chosen, ok:ok,
                     before:before, beforeQueue:beforeQueue, beforeIdx:SESSION.idx });
  SESSION.answered = true;
  render();
}
function applyAnswer(q, ok, chosen){
  var id = q.kp.id, it = tmpItem(id), now = new Date().toISOString();
  SESSION.seenCount[id] = (SESSION.seenCount[id]||0) + 1;
  var wasMastered = it.mastered;
  it.lastSeenAt = now;
  if (ok){
    it.totalCorrect++; it.byFormat[q.fmt].correct++;
    if (SESSION.mode !== "再確認"){
      if (it.lastFormat === q.fmt) { /* 同形式の連続正解では streak を進めない */ }
      else it.streak++;
      if (!it.mastered && it.streak >= requiredStreak(it)) { it.mastered = true; it.masteredAt = now; }
    }
  } else {
    it.totalWrong++; it.byFormat[q.fmt].wrong++;
    it.wrongLog.unshift({ at:now, format:q.fmt, answered:chosen });
    it.wrongLog = it.wrongLog.slice(0,5);
    if (wasMastered) it.postMasterWrong++;
    if (SESSION.mode !== "再確認") it.streak = 0;          // 習得は降格しない（§4-2）
  }
  it.lastFormat = q.fmt;
  // 復習キュー（10問／20問／再確認のみ）
  if (SESSION.mode !== "全問"){
    var gap = ok ? (it.mastered ? 0 : 6) : 3;
    if (gap > 0 && (SESSION.seenCount[id]||0) < 4){
      var pos = SESSION.idx + gap, nf = q.fmt === "A" ? "B" : "A";
      while (pos < SESSION.queue.length && SESSION.queue[pos] && SESSION.queue[pos].id === id) pos++;
      if (pos > SESSION.queue.length) pos = SESSION.queue.length;
      SESSION.queue.splice(pos, 0, { id:id, fmt:nf });
    }
  }
}
function nextBtn(){ SESSION.idx++; nextQuestion(); render(); }
function goBack(){
  if (SESSION.viewBack === null) SESSION.viewBack = SESSION.answered ? SESSION.log.length-2 : SESSION.log.length-1;
  else SESSION.viewBack--;
  if (SESSION.viewBack < 0) SESSION.viewBack = 0;
  render();
}
function goForward(){
  if (SESSION.viewBack === null) return;
  SESSION.viewBack++;
  if (SESSION.viewBack > SESSION.log.length-1 || (SESSION.answered && SESSION.viewBack > SESSION.log.length-1)) SESSION.viewBack = null;
  render();
}
function reAnswer(choiceIdx){
  var i = SESSION.log.length-1, e = SESSION.log[i];
  var chosen = e.choices[choiceIdx], ok = (chosen === e.correct);
  SESSION.tmp[e.id] = JSON.parse(JSON.stringify(e.before));
  SESSION.queue = JSON.parse(e.beforeQueue);
  SESSION.idx = e.beforeIdx;
  SESSION.seenCount[e.id] = Math.max(0,(SESSION.seenCount[e.id]||1)-1);
  var q = { kp:ID2KP[e.id], fmt:e.fmt, correct:e.correct, choices:e.choices, text:e.text };
  applyAnswer(q, ok, chosen);
  e.chosen = chosen; e.ok = ok;
  SESSION.viewBack = null; SESSION.answered = true;
  render();
}
function quitQuiz(){
  if (!confirm("とちゅうでやめると、今回の成績は記録されません。やめますか？")) return;
  SESSION = null; go("home");
}

function viewQuiz(){
  if (!SESSION) return viewHome();
  var doneN = SESSION.log.length, totN = Math.max(totalPlanned(), doneN);
  var correctN = SESSION.log.filter(function(x){ return x.ok; }).length;
  var wrongN = doneN - correctN;
  var remain = {}; SESSION.queue.slice(SESSION.idx).forEach(function(q){ remain[q.id]=1; });
  var remainWords = Object.keys(remain).length;

  var h = '<div class="topbar">';
  h += '<div class="row small"><b>'+esc(SESSION.mode)+'モード</b><span class="spacer"></span>'
    +  '<span class="muted">'+(doneN+ (SESSION.answered?0:1))+'問目 / 全'+totN+'問 ｜ あと'+remainWords+'語 ｜ 正解'+correctN+' 誤答'+wrongN+'</span></div>';
  h += '<div class="bar" style="margin-top:5px"><i style="width:'+(totN?Math.min(100,doneN/totN*100):0)+'%"></i></div>';
  h += '<div class="row" style="margin-top:6px"><button class="chip" onclick="quitQuiz()">やめる</button>';
  if (SESSION.log.length > (SESSION.answered?1:0)) h += '<button class="chip" onclick="goBack()">← 前の問題へ</button>';
  if (SESSION.viewBack !== null) h += '<button class="chip" onclick="goForward()">進む →</button>';
  h += '</div></div>';

  if (SESSION.notice) h += '<div class="okbar">'+esc(SESSION.notice)+'</div>';

  if (SESSION.viewBack !== null){
    var e = SESSION.log[SESSION.viewBack];
    var editable = (SESSION.viewBack === SESSION.log.length-1) && !SESSION.answered;
    h += '<div class="muted small">'+(SESSION.viewBack+1)+'問目の見直し'+(editable?'（もう一度こたえられます）':'（見るだけ）')+'</div>';
    h += renderQ(e, true, editable);
    return h;
  }
  if (SESSION.answered){
    var last = SESSION.log[SESSION.log.length-1];
    h += renderQ(last, true, false);
    h += '<button class="primary wide" onclick="nextBtn()">次へ →</button>';
    return h;
  }
  if (!SESSION.cur) return h;
  h += renderQ({ id:SESSION.cur.kp.id, fmt:SESSION.cur.fmt, text:SESSION.cur.text, choices:SESSION.cur.choices,
                 correct:SESSION.cur.correct, chosen:null, ok:null }, false, false);
  return h;
}
function renderQ(e, revealed, editable){
  var kp = ID2KP[e.id], it = tmpItem(e.id), req = requiredStreak(it);
  var h = '<div class="qbox">';
  h += '<div class="muted small">'+esc(kp.cat)+' ｜ '+esc(kp.axis)+' ｜ 形式'+e.fmt+' '+(e.fmt==="A"?"（ことば→特ちょう）":"（特ちょう→ことば）")+' '+(kp.imp===2?'<span class="tag imp2">◎</span>':(kp.imp===1?'<span class="tag imp1">○</span>':''))+'</div>';
  h += '<div class="qtext">'+esc(e.text)+'</div>';
  h += '<div class="muted small" style="margin-top:6px">習得ゲージ <span class="gauge">'+gauge(it.streak, req)+'</span>'
    +  (req>2 ? ' <span class="tag attn">このことばは苦手なので'+req+'回必要</span>' : '')
    +  (it.mastered ? ' <span class="tag mastered">習得済み</span>' : '') + '</div>';
  h += '</div>';
  e.choices.forEach(function(c, i){
    var cls = "choice";
    if (revealed && !editable){
      if (c === e.correct) cls += " correct";
      else if (c === e.chosen) cls += " wrong";
    }
    var act = editable ? "reAnswer("+i+")" : (revealed ? "" : "answer("+i+")");
    h += '<button class="'+cls+'"'+(act?' onclick="'+act+'"':' disabled')+'>'+esc(c)+'</button>';
  });
  if (revealed && !editable){
    h += '<div class="fb '+(e.ok?"ok":"ng")+'">'+(e.ok?"◯ 正解！":"× ざんねん…　正しくは「"+esc(e.correct)+"」")+'</div>';
    h += '<div class="card tight"><div class="kpline"><span class="n">'+esc(kp.name)+'</span><span class="muted">の '+esc(kp.axis)+' →</span><span class="a">'+esc(kp.ans)+'</span></div>';
    if (kp.note) h += '<div class="note">'+esc(kp.note)+'</div>';
    if (kp.goro) h += '<div class="goro">🎵 '+esc(kp.goro)+'</div>';
    h += '</div>';
  }
  return h;
}
function gauge(s, req){ var o=""; for(var i=0;i<req;i++) o += (i<s ? "●" : "○"); return o; }

/* =======================================================================
   セッション確定（共通仕様 §6-2・§11）
   ======================================================================= */
function finishSession(){
  var p = prog(); if (!p) { go("home"); return; }
  var newly = [];
  Object.keys(SESSION.tmp).forEach(function(id){
    var t = SESSION.tmp[id];
    if (t.mastered && SESSION.masteredAtStart.indexOf(id) < 0) newly.push(id);
    p.items[id] = t;
  });
  var correct = SESSION.log.filter(function(x){ return x.ok; }).length;
  var wrong = SESSION.log.length - correct;
  var wrongKpIds = []; SESSION.log.forEach(function(x){ if (!x.ok && wrongKpIds.indexOf(x.id)<0) wrongKpIds.push(x.id); });
  var totalMastered = 0; Object.keys(p.items).forEach(function(k){ if (p.items[k].mastered) totalMastered++; });
  p.sessions.unshift({
    startedAt: SESSION.startedAt, finishedAt: new Date().toISOString(),
    mode: SESSION.mode, correct: correct, wrong: wrong,
    newlyMastered: newly, wrongKpIds: wrongKpIds, totalMastered: totalMastered
  });
  if (p.sessions.length > 100) p.sessions = p.sessions.slice(0,100);
  SESSION.newly = newly; SESSION.correctN = correct; SESSION.wrongN = wrong;
  saveDB();
  pushDB(true);
  SCREEN = "result";
}

   ======================================================================= */
var HEADER14 = ["名前","カテゴリー","記号","知識ポイント","よみがな","重要度","状態",
                "累計正解数","累計誤答数","形式A誤答数","形式B誤答数","過去の誤答内容","最終誤答日","習得日"];
function dstr(iso){ if(!iso) return ""; var d=new Date(iso); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function buildRows(extra){
  var rows = [];
  DB.accounts.forEach(function(a){
    var p = DB.progress[a.id] || { items:{} };
    KPS.forEach(function(k){
      var it = (p.items && p.items[k.id]) ? p.items[k.id] : newItem();
      var bf = it.byFormat || {A:{wrong:0},B:{wrong:0}};
      var last = (it.wrongLog && it.wrongLog.length) ? it.wrongLog[0].at : null;
      var r = [ a.name, k.cat, k.axis, k.name, "", impMark(k.imp), stateOf(it),
                it.totalCorrect||0, it.totalWrong||0, (bf.A?bf.A.wrong:0)||0, (bf.B?bf.B.wrong:0)||0,
                (it.wrongLog||[]).map(function(w){ return w.answered; }).join("；"),
                dstr(last), dstr(it.masteredAt) ];
      if (extra) r = r.concat([ k.ans, k.unit ]);
      rows.push(r);
    });
  });
  rows.sort(function(x,y){ return (y[8]||0)-(x[8]||0); });   // 誤答数の多い順
  return rows;
}
function downloadCSV(){
  var rows = buildRows(true), head = HEADER14.concat(["答え","大単元"]);
  var csv = [head].concat(rows).map(function(r){
    return r.map(function(c){ c = String(c===undefined||c===null?"":c); return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(",");
  }).join("\r\n");
  var a = acc();
  dl(TOOL_NAME+"結果_"+((a&&a.name)||"")+"_"+ymd()+".csv", "\ufeff"+csv, "text/csv");
}
function exportList(){
  var s = syncCfg(); if (!s) { flash("同期が設定されていません"); return; }
  setSyncMsg("busy","☁… 一覧を書き出しています");
  apiPull(function(j){                                   // 空上書き防止（§15）
    if (j.ok && j.data){ var cloud = migrate(j.data); if (dbHasRecords(cloud) && !dbHasRecords(DB)) { DB = cloud; saveDB(true); } }
    if (!dbHasRecords(DB)){
      setSyncMsg("warn","☁⚠ 書き出しを中止しました");
      openModal('<h2>書き出しを中止しました</h2><div class="small">この端末にもクラウドにも学習の記録がありません。空の一覧でスプレッドシートを上書きしないように中止しました。</div><div class="row" style="margin-top:10px"><button class="primary" onclick="closeModal()">とじる</button></div>');
      return;
    }
    apiPost({ key:s.key, app:APP, list:{ header:HEADER14, rows:buildRows(false) } }, function(r){
      if (r.ok) setSyncMsg("ok","☁✓ 全問一覧をスプレッドシートに書き出しました");
      else setSyncMsg("err","☁⚠ "+errText(r.error));

  });
}

    + (k.goro?'<div class="goro">🎵 '+esc(k.goro)+'</div>':'')
    + '<div class="row" style="margin-top:10px"><button onclick="moveList(-1)">← 前へ</button>'
    + '<span class="spacer"></span><span class="muted small">'+(LEARN.listIdx+1)+' / '+list.length+'</span><span class="spacer"></span>'
    + '<button onclick="moveList(1)">次へ →</button></div></div>';
  h += '<div class="card"><h3>この範囲のことば</h3>';
  list.forEach(function(x,i){
    h += '<div class="list-item'+(i===LEARN.listIdx?' mastered':'')+'" onclick="jumpList('+i+')"><div class="row tight">'
      + '<b>'+esc(x.name)+'</b><span class="muted small">'+esc(x.axis)+'</span><span class="spacer"></span>'
      + '<span class="muted small">'+esc(x.ans)+'</span></div></div>';
  });
  h += '</div>';
  return h;
}
function moveList(d){ var n=rangeKPs().length; LEARN.listIdx=(LEARN.listIdx+d+n)%n; render(); }
function jumpList(i){ LEARN.listIdx=i; render(); window.scrollTo(0,0); }

/* ---- ② 分類表ビューア ------------------------------------------------ */
function learnTable(){
  var list = rangeKPs();
  if (!list.length) return '<div class="card muted">この範囲にことばがありません。</div>';
  var h = '<div class="card tight"><div class="row tight">'
    + '<button class="chip'+(LEARN.hideName?" on":"")+'" onclick="toggleHide(\'hideName\')">ことばをかくす</button>'
    + '<button class="chip'+(LEARN.hideAns?" on":"")+'" onclick="toggleHide(\'hideAns\')">答えをかくす</button>'
    + '<span class="muted small">かくれている所はタップで開きます</span></div></div>';
  var groups = {};
  list.forEach(function(k){ var g = k.cat+"／"+k.axis; (groups[g] = groups[g] || []).push(k); });
  Object.keys(groups).forEach(function(g){
    var ks = groups[g], byAns = {}, order = [];
    ks.forEach(function(k){ if (!byAns[k.ans]) { byAns[k.ans]=[]; order.push(k.ans); } byAns[k.ans].push(k.name); });
    h += '<div class="card"><h3>'+esc(g)+'</h3><table><tr><th style="width:36%">答え</th><th>あてはまることば</th></tr>';
    order.forEach(function(a){
      h += '<tr><td'+(LEARN.hideAns?' class="hide-cell" onclick="this.classList.toggle(\'hide-cell\')"':'')+'>'+esc(a)+'</td>'
        +  '<td'+(LEARN.hideName?' class="hide-cell" onclick="this.classList.toggle(\'hide-cell\')"':'')+'>'+byAns[a].map(esc).join("、")+'</td></tr>';
    });
    h += '</table></div>';
  });
  return h;
}
function toggleHide(k){ LEARN[k] = !LEARN[k]; render(); }

/* ---- ③ カードめくり -------------------------------------------------- */
function resetDeck(){ LEARN.deck = shuffle(rangeKPs()).map(function(k){ return k.id; }); LEARN.deckIdx=0; LEARN.flipped=false; }
function currentDeck(){
  var d = LEARN.deck.filter(function(id){ return ID2KP[id] && inRange(ID2KP[id]); });
  if (LEARN.onlyLeft) d = d.filter(function(id){ return !LEARN.known[id]; });
  return d;
}
function learnCard(){
  var d = currentDeck();
  var h = '<div class="card tight"><div class="row tight">'
    + '<span class="seg">'+segBtn("ことば→答え", LEARN.dir==="A", "setDir(\'A\')")+segBtn("答え→ことば", LEARN.dir==="B", "setDir(\'B\')")+'</span>'
    + '<button class="chip'+(LEARN.onlyLeft?" on":"")+'" onclick="LEARN.onlyLeft=!LEARN.onlyLeft;LEARN.deckIdx=0;LEARN.flipped=false;render()">まだの分だけ</button>'
    + '<button class="chip" onclick="resetDeck();render()">シャッフル</button>'
    + '<button class="chip" onclick="LEARN.known={};render()">覚えたをリセット</button></div></div>';
  if (!d.length) return h + '<div class="card center"><b>ぜんぶ「覚えた」になりました！</b><div class="muted small">この印はこの画面だけのもので、成績には影響しません。</div></div>';
  if (LEARN.deckIdx >= d.length) LEARN.deckIdx = 0;
  var k = ID2KP[d[LEARN.deckIdx]];
  var front = LEARN.dir==="A" ? k.name : k.ans, back = LEARN.dir==="A" ? k.ans : k.name;
  h += '<div class="card flip" onclick="LEARN.flipped=!LEARN.flipped;render()">'
    + '<div class="muted small">'+esc(k.cat)+' ｜ '+esc(k.axis)+'</div>'
    + '<div style="margin-top:8px">'+esc(LEARN.flipped ? back : front)+'</div>';
  if (LEARN.flipped){
    if (k.note) h += '<div class="sub">'+esc(k.note)+'</div>';
    if (k.goro) h += '<div class="sub">🎵 '+esc(k.goro)+'</div>';
  } else h += '<div class="sub">タップしてめくる</div>';
  h += '</div>';
  h += '<div class="row"><button class="primary" style="flex:1" onclick="markKnown(true)">覚えた ✓</button>'
    + '<button style="flex:1" onclick="markKnown(false)">まだ</button></div>';
  h += '<div class="muted small center" style="margin-top:6px">のこり '+d.length+' 枚 ｜ 覚えた '+Object.keys(LEARN.known).length+' 枚（記録には残りません）</div>';
  return h;
}
function setDir(d){ LEARN.dir=d; LEARN.flipped=false; render(); }
function markKnown(yes){
  var d = currentDeck(); if (!d.length) return;
  var id = d[LEARN.deckIdx];
  if (yes) LEARN.known[id] = 1;                        // 画面上の一時状態のみ（mastered は立てない）
  else { LEARN.deck.push(LEARN.deck.splice(LEARN.deck.indexOf(id),1)[0]); }
  LEARN.flipped = false;
  if (yes && LEARN.onlyLeft) { /* インデックス据え置き */ } else LEARN.deckIdx++;
  var nd = currentDeck(); if (LEARN.deckIdx >= nd.length) LEARN.deckIdx = 0;
  render();
}

/* ---- ④ 語呂合わせ ---------------------------------------------------- */
function learnGoro(){
  var list = rangeKPs().filter(function(k){ return k.goro; });
  if (!list.length) return '<div class="card muted">この範囲に語呂合わせはありません。範囲を「すべての単元」にすると見つかります。</div>';
  if (LEARN.goroIdx >= list.length) LEARN.goroIdx = 0;
  var k = list[LEARN.goroIdx];
  var h = '<div class="card center"><div class="muted small">'+esc(k.cat)+' ｜ '+esc(k.axis)+'</div>'
    + '<div style="font-size:18px;font-weight:bold;margin:8px 0">'+esc(k.name)+' → '+esc(k.ans)+'</div>'
    + '<div class="goro" style="font-size:16px">🎵 '+esc(k.goro)+'</div>'
    + '<div class="row" style="margin-top:10px"><button onclick="moveGoro(-1)">← 前へ</button><span class="spacer"></span>'
    + '<span class="muted small">'+(LEARN.goroIdx+1)+' / '+list.length+'</span><span class="spacer"></span>'
    + '<button onclick="moveGoro(1)">次へ →</button></div></div>';
  h += '<div class="card"><h3>語呂合わせ一覧</h3><table><tr><th style="width:34%">ことば</th><th>語呂合わせ</th></tr>';
  list.forEach(function(x,i){ h += '<tr onclick="LEARN.goroIdx='+i+';render();window.scrollTo(0,0)" style="cursor:pointer"><td>'+esc(x.name)+'<div class="muted small">'+esc(x.ans)+'</div></td><td>'+esc(x.goro)+'</td></tr>'; });
  h += '</table></div>';
  return h;
}
function moveGoro(d){ var n=rangeKPs().filter(function(k){return k.goro;}).length; LEARN.goroIdx=(LEARN.goroIdx+d+n)%n; render(); }

/* ---- ⑤ 仲間分けトレーニング ------------------------------------------ */
function sortableAxes(){
  var list = rangeKPs(), m = {};
  list.forEach(function(k){ (m[k.cat+"／"+k.axis] = m[k.cat+"／"+k.axis] || []).push(k); });
  return Object.keys(m).filter(function(g){
    var as = {}; m[g].forEach(function(k){ as[k.ans]=1; });
    return Object.keys(as).length >= 2 && Object.keys(as).length <= 8 && m[g].length >= 4;
  }).map(function(g){ return { key:g, kps:m[g] }; });
}
function learnSort(){
  var axes = sortableAxes();
  if (!LEARN.sortAxis){
    var h = '<div class="card"><h3>どの軸で仲間分けする？</h3>';
    if (!axes.length) h += '<div class="muted">この範囲では仲間分けできる軸がありません。範囲を広げてください。</div>';
    axes.forEach(function(a){
      var as={}; a.kps.forEach(function(k){ as[k.ans]=1; });
      h += '<div class="list-item" onclick="startSort(\''+a.key.replace(/'/g,"\\'")+'\')"><b>'+esc(a.key)+'</b>'
        + '<div class="muted small">'+a.kps.length+'語／箱 '+Object.keys(as).length+'つ</div></div>';
    });
    return h + '</div>';
  }
  var g = axes.filter(function(a){ return a.key===LEARN.sortAxis; })[0];
  if (!g) { LEARN.sortAxis=null; return learnSort(); }
  var boxes = []; g.kps.forEach(function(k){ if (boxes.indexOf(k.ans)<0) boxes.push(k.ans); });
  var h = '<div class="card tight"><div class="row"><b>'+esc(g.key)+'</b><span class="spacer"></span>'
    + '<span class="muted small">○'+LEARN.sortOk+' ×'+LEARN.sortNg+'</span>'
    + '<button class="chip" onclick="LEARN.sortAxis=null;render()">別の軸</button></div></div>';
  if (LEARN.sortIdx >= LEARN.sortQueue.length){
    h += '<div class="card center"><b>おわり！ ○'+LEARN.sortOk+' ×'+LEARN.sortNg+'</b>'
      + '<div class="muted small">この結果は成績には記録されません。</div>'
      + '<div class="row" style="margin-top:8px"><button class="primary" onclick="startSort(\''+LEARN.sortAxis.replace(/'/g,"\\'")+'\')">もう一度</button>'
      + '<button onclick="LEARN.sortAxis=null;render()">別の軸</button></div></div>';
    return h;
  }
  var kp = ID2KP[LEARN.sortQueue[LEARN.sortIdx]];
  h += '<div class="card center"><div class="muted small">'+(LEARN.sortIdx+1)+' / '+LEARN.sortQueue.length+'</div>'
    + '<div style="font-size:24px;font-weight:bold;margin:10px 0">'+esc(kp.name)+'</div>'
    + '<div class="muted small">どの箱に入る？</div></div>';
  h += '<div class="grid2">';
  boxes.forEach(function(b,i){
    var cls = "box";
    if (LEARN.sortFb){
      if (b === kp.ans) cls += " on";
    }
    h += '<button class="'+cls+'" style="text-align:center" '+(LEARN.sortFb?'disabled':'onclick="answerSort('+i+')"')+'>'+esc(b)+'</button>';
  });
  h += '</div>';
  if (LEARN.sortFb){
    h += '<div class="fb '+(LEARN.sortFb.ok?"ok":"ng")+'">'+(LEARN.sortFb.ok?"◯ 正解！":"× 正しくは「"+esc(kp.ans)+"」")+'</div>';
    if (kp.note) h += '<div class="note">'+esc(kp.note)+'</div>';
    if (kp.goro) h += '<div class="goro">🎵 '+esc(kp.goro)+'</div>';
    h += '<button class="primary wide" onclick="nextSort()">次へ →</button>';
  }
  return h;
}
function startSort(key){
  LEARN.sortAxis = key;
  var g = sortableAxes().filter(function(a){ return a.key===key; })[0];
  LEARN.sortQueue = shuffle(g.kps).slice(0,24).map(function(k){ return k.id; });
  LEARN.sortIdx = 0; LEARN.sortOk = 0; LEARN.sortNg = 0; LEARN.sortFb = null;
  render(); window.scrollTo(0,0);
}
function answerSort(i){
  var g = sortableAxes().filter(function(a){ return a.key===LEARN.sortAxis; })[0];
  var boxes = []; g.kps.forEach(function(k){ if (boxes.indexOf(k.ans)<0) boxes.push(k.ans); });
  var kp = ID2KP[LEARN.sortQueue[LEARN.sortIdx]], ok = (boxes[i] === kp.ans);
  if (ok) LEARN.sortOk++; else LEARN.sortNg++;
  LEARN.sortFb = { ok:ok };
  render();
}
function nextSort(){ LEARN.sortIdx++; LEARN.sortFb = null; render(); }

/* =======================================================================
   起動
   ======================================================================= */
(function init(){
  loadDB();
  if (!DB.accounts.length) SCREEN = "account"; else SCREEN = "home";
  render();
  if (syncCfg()) setTimeout(doSync, 300);     // 起動直後にpull（§13-1）
})();
</script>
</body>
